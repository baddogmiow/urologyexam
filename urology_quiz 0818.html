yOrder":11,"number":32,"question":"有關經皮腎造廔取石手術(percutaneous nephrolithotomy)及其可能的手術併發症，以下敘述何 者錯誤？","options":{"A":"不可控制的泌尿道感染、潛在的腎臟腫瘤及懷孕都 是手術禁忌症","B":"由於馬蹄腎(Horseshoe Kidney)的上極(upper pole)較下極(lower pole)更為後側且外側，因此 經由上極取石能提供較安全的路徑","C":"為了避免穿刺腹膜並傷害腹腔內器官，移植於骨盆 的腎臟取石手術路徑選取越下端越好","D":"鹿角狀結石(staghorn stone)的取石目標是盡可能 的結石完全移除(stone free)，因此在單一路徑的 選擇以下極優於上極","E":"術後若仍有顯著的出血，可先嘗試鉗閉腎造廔導管 (nephrostomy tube)使其填塞(tamponade)出血點 達到止血效果"},"answer":"D","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell 12ed, Chapter 94, Surgical Management for Upper Urinary Tract Calculi , p2105-2107; EAU guideline, Urolithiasis, 3.4.7 Percutaneous nephrolithotomy, p22","sourcePage":412},{"id":"11-033","category":"手術及併發症","categoryOrder":11,"number":33,"question":"腹腔鏡手術時，在以Varess氣腹針建立氣腹 (pneumoperitoneum)時，如果傷及血管，據統計，最常 傷到的血管是？","options":{"A":"Aorta","B":"Inferior vena cava","C":"Rt. common iliac vein","D":"Lt. common iliac vein","E":"Rt. external iliac artery"},"answer":"D","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：第 12 版 Campbell, Ch 17, p. 271","sourcePage":412},{"id":"11-034","category":"手術及併發症","categoryOrder":11,"number":34,"question":"有關處理腹腔鏡部分腎切除手術(partial nephrectomy)後，因集尿系統(collecting system)受 損，而產生尿液外漏(urine leak)的併發症，以下哪一 種作為是沒有幫助的？","options":{"A":"置放膀胱導尿管","B":"在手術那側的輸尿管內裝置輸尿管導管","C":"保持傷口引流管暢通","D":"若傷口引流管末端太接近腎臟縫合處，可以稍微向 外拔出來一點","E":"將引流管外接負壓，若是引流管使用 JP(Jackson-Pratt)管，可以將負壓吸引的球壓得 更緊一點"},"answer":"E","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：第 12 版 Campbell, Ch 17, p. 263-264","sourcePage":413},{"id":"11-035","category":"手術及併發症","categoryOrder":11,"number":35,"question":"某泌尿科專科醫師執行TURP之後，發生術後併發症，病 患輸了500 CC的血，而且顯得躁動，需要再送回手術室 以全身麻醉方式處理該併發症，所幸病人沒有生命危 險，也不必住到加護病房。此情況，按照Clavien Dindo 併發症嚴重度分類，應該屬於哪一級？","options":{"A":"Grade II","B":"Grade IIIa","C":"Grade IIIb","D":"Grade IV","E":"Grade V"},"answer":"C","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：第 12 版 Campbell, Ch 17, p. 261","sourcePage":413},{"id":"11-036","category":"手術及併發症","categoryOrder":11,"number":36,"question":"下列有關陰囊手術的併發症，何者錯誤？","options":{"A":"陰囊手術後的感染通常由於血腫所造成","B":"輸精管結紮術後，因發炎所產生的結節 (Inflammatory nodule)被認為是最常見的手術併 發症之一","C":"如果輸精管結紮術後的精液檢查已達到成功標 準，之後再出現手術失敗的機率是 1/2000","D":"陰囊手術後的持續出血通常是因為精索動脈不完 全結紮所導致","E":"陰囊水腫術後再復發率約只有 0-2％"},"answer":"B","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell 12ed. Ch83 p.1855-1856","sourcePage":413},{"id":"11-037","category":"手術及併發症","categoryOrder":11,"number":37,"question":"關於尿道懸吊手術的併發症，下列何者錯誤？","options":{"A":"恥骨後懸吊術(TVT)相較於經閉孔肌懸吊術(TOT) 有較高的膀胱受損率","B":"恥骨後懸吊術(TVT)相較於經閉孔肌懸吊術(TOT) 有較高的排尿困難(voiding dysfunction)機率","C":"恥骨後懸吊術(TVT)相較於經閉孔肌懸吊術(TOT) 有較高的鼠蹊部疼痛機率","D":"懸吊手術後五年內有大約 6％的病人需要做人工網 膜調整(mesh revision)","E":"對於停經後的婦女，置放懸吊後性交疼痛可嘗試於 陰道局部使用雌激素"},"answer":"C","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell 12ed. Ch126 p.2880-2883","sourcePage":414},{"id":"11-038","category":"手術及併發症","categoryOrder":11,"number":38,"question":"關於腹腔鏡手術之併發症，下列何者正確?","options":{"A":"採 Trendelenburg position 可增加主動脈與腹壁 間的距離","B":"部分腎切除(Partial nephrectomy)後之假性血管 瘤(pseudoaneurysms)多於術後 2~3 周發現，發燒 為其常見表徵之一","C":"閉孔神經(Obturator nerve)斷裂(transection)會 影響下肢之內收功能(adduction)，建議以 7-0 可 吸收線修補","D":"行 Lithotomy position 時，腳踝背屈 (dorsiflexion)可減少下肢發生腔室症候群 (compartment syndrome)之機率","E":"部分腎切除術後發生尿液滲漏(urine leak)，若放 置導尿管及輸尿管導管無效，腹腔引流管應接上低 壓吸引(low pressure suction)或吸引球以降低尿 液囊腫(urinoma)生成"},"answer":"B","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell 12ed. Ch17 p271 (A) p274 (B) p262 (C) p262 (D) p264 (E)","sourcePage":414},{"id":"11-039","category":"手術及併發症","categoryOrder":11,"number":39,"question":"對於腹腔鏡手術時，灌注 CO2 可能引發的併發症描述， 下列何者為是?","options":{"A":"灌注 CO2 壓力大於 40 mmHg 時，常引發張力性氣腹， 故腹內 CO2 壓力要維持 15 -20 mmHg 以下","B":"高碳酸血症會引起心臟頻脈及心室早期收縮","C":"手術當中體液的補充以 5ml/kg/hour 進行以避免過 量(fluid overload)","D":"手術過程因腹壓増加，限制下肢血回流因此要採取 措施預防血栓形成","E":"以上皆是"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Smith & Tanagho’s General Urology 19th P162","sourcePage":414},{"id":"11-040","category":"手術及併發症","categoryOrder":11,"number":40,"question":"根本性膀胱切除手術，以小腸與輸尿管進行重建，吻合 手術的描述何者為非?","options":{"A":"Bricker 方式直接 end-to-side 沒抗逆流 (anti-reflux)簡易施行併發症低","B":"上述方式置放 stent 也無法降低其 complication rate","C":"即使成功的 anti-reflux 吻合方式並無法阻止腎 盂的菌落數","D":"上述方式狹窄發生率約 6% urine leak 尿液滲漏約 3-5%","E":"發生狹窄可能的原因，包括缺血、尿液滲漏、輻射、 感染等"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 19th P639-646","sourcePage":415},{"id":"11-041","category":"手術及併發症","categoryOrder":11,"number":41,"question":"根除性腎臟切除時，需作局部的淋巴清除，下列描述何 者為非?","options":{"A":"常規性施行有助正確分期","B":"電腦斷層顯示局部淋巴結腫大","C":"腎臟腫瘤大於 10 公分","D":"腫瘤合併血栓形成(tumor thrombus)","E":"腎臟腫瘤侵犯臨近器官"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 19th P2257-2278","sourcePage":415},{"id":"11-042","category":"手術及併發症","categoryOrder":11,"number":42,"question":"腎臟移植術後，尿液滲漏是早期常見的併發症，其可能 的原因，下列何者為非?","options":{"A":"輸尿管太長","B":"導尿管太早移除或是輸尿管 stent 太早移除","C":"跟膀胱吻合時輸尿管扭轉","D":"膀胱容量太小","E":"移植腎實質壞死"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 19th P1936-1941","sourcePage":415},{"id":"11-043","category":"手術及併發症","categoryOrder":11,"number":43,"question":"從一項多機構研究分析，1647 位非肌肉侵犯性膀胱癌患 者，施行根除性膀胱切除手術時，淋巴結清除跟腫瘤結 果，在下列那一期病患不見改善?","options":{"A":"Tis (carcioma in situ)","B":"Ta","C":"T1","D":"T2","E":"以上期別皆受益"},"answer":"B","reference":"(111) The Journal of Urology vol.207,pp.551-558","sourcePage":415},{"id":"11-044","category":"手術及併發症","categoryOrder":11,"number":44,"question":"以下敘述何者錯誤?","options":{"A":"華法林(Warfarin)的半衰期是 36 到 42 小時，因此 大部份手術指引建議在術前五天停藥以確保國際 標準化凝血脢原時間比(INR)可以小於 1.5","B":"太晚暫停抗血小板治療會使嚴重心肌梗塞的風險 增加 25% 至 50%，從而導致手術前後死亡率的增加","C":"與麻醉處置相關的主要併發症是硬膜穿刺後頭痛 （由腦脊液滲漏所引起），以目前使用的 29 號脊椎 穿刺針進行發生頭痛的機率低於 2%","D":"早期併發症與所有泌尿外科手術（即發燒、麻痺性 腸阻塞、漏尿、貧血），而晚期並發症往往更具手 術特異性（即根治性攝護腺切除術後的尿道接合處 狹窄、部份腎切除之後的假性動脈瘤、根治性膀胱 切除術後輸尿管迴腸接口狹窄）","E":"目前歐洲泌尿雜誌建議的針對泌尿手術併發症未 來方向是創建一個中心化的歐洲數據庫，泌尿科醫 師為諮詢和研究目的，可任意存取與彙編以回報晚 期併發症"},"answer":"B","reference":"(111) 參考資料(摘錄自)：Principles of Urologic Surgery: Perioperative Care / Regional Anesthesia European urology, PLATINUM OPINION| VOLUME 80, ISSUE 5, P527-528, NOVEMBER 01, 2021 An increasing number of patients are receiving chronic antiplatelet therapy in the prevention of cardiovascular events and, more important, in the prevention of coronary stent thrombosis. Current recommendations require dual antiplatelet therapy for 6 weeks after bare metal coronary stents and 12 months for drug-eluting stents. Premature interruption of antiplatelet therapy has been associated with a 25% to 50% risk for significant myocardial infarction with resultant increased perioperative mortality","sourcePage":415},{"id":"11-045","category":"手術及併發症","categoryOrder":11,"number":45,"question":"以下敘述何者錯誤?","options":{"A":"發生淋巴囊腫的主要原因是器官摘取手術或於準 備移植器官時，在受贈者髂血管或移植腎血管周圍 的淋巴管清理的過於廣泛","B":"與一般人相比，腎移植患者罹患膀胱癌的風險會顯 著增加（SIR = 3.18；95% CI：1.34–7.53；P = 0.008）","C":"膀胱內卡介苗灌注可用於高風險的無肌肉侵犯型 之膀胱癌患者。","D":"腎臟移植後病人如罹患攝護腺癌，如果屬於器官侷 限型，且 Gleason score 六分以下，最常見的治療 方式是手術摘除，各種術式均涵蓋在內，排名第二 的是積極監測(active surveillance)，只有少數 病人接受放射治療","E":"尿液滲漏是腎移植術後最常見的早期泌尿系統併 發症，發生率從 1.2% 到 8.9%"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology Twelfth Edition: Urologic Complications of Renal Transplantation In a recent meta-analysis, the majority of kidney transplant patients with prostate cancer who underwent treatment had organ-confined disease, and Gleason score of 6 or less. The most common modality of treatment is surgical extirpation by any approach, followed by radiation therapy and then active surveillance, which was underused","sourcePage":416},{"id":"11-046","category":"手術及併發症","categoryOrder":11,"number":46,"question":"以下敘述何者錯誤?","options":{"A":"接受治療後救援性前列腺切除術的患者需要進行 完整的腸道準備，並被告知直腸損傷和可能需要腸 造廔的風險；此外，與原直接手術相比，陽痿和失 禁的發生率更高","B":"在固定病人時應使用固定式肩托，因為在極端的頭 低腳高臥位(Trendelenburg position)時，才能避 免肩部和臂叢神經被壓傷","C":"在常常執行機器手臂輔助腹腔鏡根除性攝護腺切 除手術(RALRP)的醫院中，嚴重的機器設備故障極 為罕見，不可恢復的故障率僅為 0.4%","D":"對於機器手臂輔助腹腔鏡根除性攝護腺切除手術 而言，膀胱頸狹窄的併發症並不常見，一般是藉著 切開膀胱頸和導管引流來治療的","E":"與剖腹手術相比，機器手臂輔助腹腔鏡根除性攝護 腺切除手術(RALRP)方法的優勢在於明顯減少與手 術相關的失血量、可隔日出院和病人更早恢復正常 活動"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology Twelfth Edition: Evolution of Minimally Invasive Laparoscopic Prostatectomy ; Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy Fixed shoulder rests should be avoided because this can result in compression injury to the shoulders and brachial plexus when in the steep Trendelenburg position. Slight flexion of the table at the level of the hips may be required to properly dock the robotic arms; however, exaggerated flexion should be avoided so as to minimize the risk for femoral neurapraxia","sourcePage":416},{"id":"11-047","category":"手術及併發症","categoryOrder":11,"number":47,"question":"以下敘述何者錯誤?","options":{"A":"對於急迫性尿失禁(UI)和勃起功能障礙的病人而 言，不應同時植入人工尿道括約肌(AUS)和可充灌 式人工陰莖，應擇一進行","B":"植入物感染時標準處理方式是要全部取出，但在某 些病人如果要挽救植入物，是可以利用先移除，以 抗生素沖洗，再重新植入。","C":"人工尿道括約肌(AUS)的再植入手術，已被證明與 那些第一次接受手術的患者結果相似，在尿道中段 吊帶術後仍持續有壓力性尿失禁的患者，則建議使 用人工尿道括約肌","D":"人工尿道括約肌(AUS)的長期耐用性已經相當明 確，在第 2 年和第 5 年再置換手術率為 16%和 28%， 在某些醫院其耐用年限超過五年的比例可達 72%至 75%","E":"最近的一項研究顯示，與聚維酮碘 (povidone-iodine)相比，以 chlorhexidine 刷洗 10 分鐘，然後再用碘 Povacrylex（0.7%碘)，和 異丙醇 74% w/w (DuraPrep) 可降低消毒後細菌皮 膚培養率；但對於臨床實際上人工尿道刮約肌 (AUS)植入組間感染率則沒有差異"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology Twelfth Edition: Surgical Procedures for Sphincteric Incontinence in the Male /Special Circumstances Dual implantation of AUS and inflatable penile prosthesis is safe, feasible, and cost-effective for patients with UI and erectile dysfunction. Although the literature is limited, several small case series have shown that synchronous implantation of both devices can be performed, albeit with longer operative times ( Kendirci et al., 2006 ; Rolle et al., 2012 ). Implantation can be performed through 1 penoscrotal incision or 2 incisions (penoscrotal, perineal).","sourcePage":417},{"id":"11-048","category":"手術及併發症","categoryOrder":11,"number":48,"question":"以下敘述何者錯誤?","options":{"A":"剖腹手術和機器手臂輔助腹腔鏡根除性攝護腺切 除手術的直腸損傷發生率相同，但援救性攝護腺切 除手術(salvage prostatectomy)的風險更高。在 針對 24,178 名患者的研究中，接受剖腹手術和機 器手臂輔助腹腔鏡根除性攝護腺切除手術的患者 的直腸損傷發生率為 0.47%，接受援救性攝護腺切 除手術的患者其直腸損傷發生率為 6.86%","B":"平均腹腔鏡套管入口處發生切口疝氣(port-site hernia)的時間為 9.6 天(介於 1 至 54 天)。切口處 使用 12 毫米套管會比 10 毫米套管相比，更容易出 現切口疝氣，發生率分別為 3.1% 和 0.23%）","C":"接受胰臟腫瘤切除術後，或急性重症胰腺炎患者， Somatostatin 類似物（如 octreotide）已被證明 可降低與胰臟相關的相關的併發症","D":"腸沾黏排除時用不帶能量之腹腔鏡剪，不用電燒可 以以避免高溫影響的範圍擴大，也能減少延遲出現 的熱損傷","E":"根除性攝護腺切除術後尿道膀胱吻合處的尿液滲 漏，可以藉由膀胱造影時，吻合處外的造影劑顯影 得到證實。造影劑外滲通常在吻合處最薄弱處的前 方"},"answer":"E","reference":"(111)參考資料(摘錄自)： Campbell-Walsh-Wein Urology Twelfth Edition: Complications of Urologic Surgery/ Duodenal and Pancreatic Injuries During Nephrectomy Urinary leakage at the urethrovesical anastomotic junction is one of the most common complications in the early postoperative period (days 7 to 10) reaching an incidence of 0.3% to 15.4%(8). Although no exact definition of urine leakage after radical prostatectomy exists, it consists of an increase in drainage from the surgical drain along with a proportional decrease of drainage from the urethral catheter. It is confirmed by contrast extravasation from the anastomosis on cystography. The contrast extravasation is usually posterior along the possible weakest point of the anastomosis, although other areas of the anastomosis can leak also.","sourcePage":418},{"id":"11-049","category":"手術及併發症","categoryOrder":11,"number":49,"question":"關於人工網膜(Mesh)用於婦女應力性尿失禁的併發症 敘述，下列何者正確?","options":{"A":"裝完人工網膜(Mesh)後發生疼痛在術前的危險因 子(Risk factor)包括年齡較輕(Younger age), 性 生活活躍(Sexually active)和原本就有骨盆腔疼 痛(Pre-existing pelvic pain)","B":"人工網膜攣縮(Mesh contraction)通常只發生在骨 盆器官脫垂網膜(POP mesh)，造成性交疼痛 (Dyspareunia) ，因為使用的人工網膜較大片","C":"糖尿病、年齡大、肥胖和抽菸的病人在經陰道移除 人工網膜(Transvaginal mesh removal)後較易有 併發症","D":"第一型人工網膜(Type 1 mesh)是微孔型 (Microporous)，孔徑約 30 μm","E":"較瘦的病人(BMI<30)裝人工網膜(mesh)時發生 bladder perforation 的機會較高，因為骨盆腔空 間較陜小"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell 12ed. Ch126 (A) 性生活 p2881, 沒有 活躍 (B) p2884 (C) p2886, 沒有任何預 測因子 (D) p2877, 第二型人工 網膜(Type 2 mesh)是微 孔型(Microporous), 孔徑約 30 μm (E) p2882, 因為 retropubic space 的 fat 較少","sourcePage":418},{"id":"11-050","category":"手術及併發症","categoryOrder":11,"number":50,"question":"關於睪丸癌的後腹腔淋巴結切除術 (Retroperitoneal lymph nodes dissection)與併發症，下列何者正確?","options":{"A":"術後若出現乳糜性腹水(Chylous ascites), 應該 給予低脂肪低蛋白的飲食, 並且在乳糜性腹水緩 解後持續這樣的飲食至少 4 週","B":"晚期復發(Late relapse)指的是精母細胞瘤(Germ cell tumor)經過治療且達到完全緩解(Complete response)的兩年以後復發","C":"右側結節後交感神經(Postganglionic nerve)會走 在下腔靜脈(IVC)的表面並匯集到上腹下神經叢 (superior hypogastric plexus)","D":"後腹腔淋巴結切除術 (Retroperitoneal lymph nodes dissection)可能影響睪丸賀爾蒙分泌與造 精功能(spermatogenesis)","E":"術中傷及下腔靜脈(IVC)通常可以直接修補 (primary repair), 而傷及主動脈(aorta)則必須 以動脈替代物(artery graft)來修補"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell 12ed. Ch77 (A) p1731, 低脂肪高蛋 白飲食 (B) p1729 (C) p1717, 走在 IVC 底 下 (D) p1729 不會影響睪 丸賀爾蒙分泌與造精功 能(spermatogenesis) (E) p1719, small injury 仍可以嘗試直接 修補","sourcePage":419},{"id":"11-051","category":"手術及併發症","categoryOrder":11,"number":51,"question":"下列關於體外震波碎石術(ESWL)之併發症何者正確?","options":{"A":"針對下段輸尿管結石的體外震波碎石術(ESWL)可 能造成精液品質下降，但通常能在術後三個月恢復","B":"體外震波碎石術(ESWL)若傷及胰臟，可能增加日後 得到糖尿病的風險，與震波頻率和震波能量有關","C":"體外震波碎石術(ESWL)後結石復發率(stone recurrence rate)的高低最主要與結石大小有關","D":"體外震波碎石術(ESWL)後出現血尿主要是因為石 頭在被震碎的過程中摩擦泌尿上皮(Urothelium) 造成出血","E":"體外震波碎石術(ESWL)過程中的疼痛與總震波次 數和震波頻率最有關"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell 12ed. Ch94 (A) p2099 (B) p2097, 與總震波次 數和震波能量有關 (C) p2100, 與有無殘存 residual stone debris 最有關 (D) p2098, 是因為震波 傷害 renal parenchyma 中的血管與 renal tubule (E) p2102, 與 energy density 和 focal point 的 size 最有關","sourcePage":419},{"id":"11-052","category":"手術及併發症","categoryOrder":11,"number":52,"question":"下列關於膀胱輸尿管逆流(Vesicoureteral reflux)的 手術與併發症何者正確？","options":{"A":"手術後在長期追蹤下若逆流有復發或持續的情形 (Recurrent or persistent reflux)，可能是通道 (A) 長度與輸尿管管徑比例(tunnel length to ureter diameter ratio)不適當，應該盡快進行輸尿管重 接的手術(Reimplantation surgery) (B)","B":"手術後出現對側逆流(Contralateral reflux)較常 發生在 6 歲以上的兒童和膀胱容量小(Low bladder (C) capacity)的病人身上","C":"膀胱內手術(Intravesical procedures)中， Politano-Leadbetter technique 比 Glenn-Anderson technique 不容易有接合處彎曲 (D) (Kinking)","D":"膀胱外手術(Extravesical procedures)可能傷及 骨盆神經叢(Pelvic plexus)因此術後較易出現排 尿障礙(Voiding dysfunction)，而骨盆神經叢位 於輸尿管膀胱交口(UVJ)的背側(Dorsally)和外側 (Laterally)約 1.5 到 2 公分","E":"手術後在長期追蹤下若出現接合處阻塞 (Obstruction)情形, 通常是新的輸尿管開口接合 得太過外側(Laterally)與前側(Anteriorly), 此 時膀胱脹起來易造成接合處彎曲(Kinking)"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell 12ed. Ch42 p846 應先排除 secondary reflux 的 可能性 p844, 較常發生在 6 歲以下 p840, Glenn-Anderson technique 比較不容 易有阻塞情形 p841, 位於輸尿管 膀胱交口(UVJ)的背 側(Dorsally)和內 側(Medially)約 1.5 到 2 公分 p846","sourcePage":419},{"id":"11-053","category":"手術及併發症","categoryOrder":11,"number":53,"question":"根據 Dallas 等人的世代研究，關於 Minimally invasive (11 abdominal sacrocolpopexy(MISC)和人工網膜(Mesh)併 參考 發症的敘述，何者正確？ “S","options":{"A":"年紀大是會產生人工網膜併發症的危險因子 Hys","B":"和白人相比，黑人產生人工網膜併發症機率較高 Pro","C":"術中同時做全子宮切除 (total hysterectomy)和 Mes 子宮頸上子宮切除 (supracervical aft hysterectomy)相比，子宮頸上子宮切除術後產生 Inv 人工網膜併發症機率較高 Sac","D":"術中同時做前陰道修補術 (Anterior Pop colporrhaphy)，對於人工網膜併發症產生無顯著 Coh 差異 12, Jou","E":"之前做過全子宮切除 (total hysterectomy)，可 207 以降低人工網膜併發症產生 (E"},"answer":"D","reference":"1) 資料(摘錄自)： upracervical terectomy Is tective against h Complications er Minimally asive Abdominal rocolpopexy: A ulation-Based ort Study of 189 Patients” rnal of Urology (2022) 669-676 年紀不是 黑人較低，但沒有 顯著差異 術中同時做全子宮 切除併發症機率較 高 )無法降低","sourcePage":420},{"id":"11-054","category":"手術及併發症","categoryOrder":11,"number":54,"question":"關於泌尿科手術中神經損傷的敘述，下列何者錯誤？ (1","options":{"A":"在輸尿管重建手術中，psoas hitch 的步驟可能造 ( A 成縫到 genitofemoral nerve 造成陰囊和大腿內側 C a 感覺異常 Ed","B":"骨盆腔淋巴結廓清術可能傷到 obturator nerve， 26 造成大腿內側感覺及內收運動異常","C":"機械輔助攝護腺切除術 RALP 在 steep Trendelenburg position 擺位時應使用固定式肩 托，因為可避免肩部和臂叢神經受壓。","D":"仰臥手術時，不適當的緩衝和襯墊常造成坐骨神經 損傷。通常會出現小腿外側和足部麻木","E":"截石位擺位可能導致後脛骨神經(posterior tibial N.)受損，導致足底屈折(plantarflexion) 無力"},"answer":"C","reference":"11) ) (B)(D)(E)The mpbell Urology 12th ition Chapter 17, P 1, 262 (C) The Campbell Urology 12th Edition Chapter 156, P 3568","sourcePage":421},{"id":"11-055","category":"手術及併發症","categoryOrder":11,"number":55,"question":"關於腹腔鏡腎臟、腎上腺手術，下列敘述何者錯誤 (1","options":{"A":"術中出血可能來自腎上腺靜脈、下腔靜脈、腎靜脈 Th 或腰靜脈，可藉由上升 pneumoperitoneum 壓力至 12 25mmHg 減緩出血 10","B":"若懷疑胰臟損傷，建議留下閉合吸引的外科引流 管。術後引流高甘油三酯提示胰腺損傷","C":"pheochromocytoma 術中麻醉可用短效 beta-blockade, nicardipine 或 nitroprusside 控 制血壓","D":"Cushing syndrome 患者在手術後需要類固醇替代， 直到對側腺體恢復功能。 血漿皮質醇的測量可用 於確定何時可以逐漸減少類固醇替代","E":"腎細胞癌手術時，常規施行區域淋巴清除術 (lymphadenectomy)對無惡化存活 (progression-free survival)是有幫助"},"answer":"E","reference":"11) e Campbell Urology th Edition Chapter 7, P 2423 - 2424","sourcePage":421},{"id":"11-056","category":"手術及併發症","categoryOrder":11,"number":56,"question":"關於機械輔助攝護腺切除術 RALP 或 腹腔鏡攝護腺切除 (1 術 LRP 的敘述下列何者錯誤？ Th","options":{"A":"robotic salvage prostatectomy 較不建議在先前 12 治療失敗後，PSA 高於 10ng/dl 之病患 15","B":"下肢深部靜脈栓塞(Deep Vein Thrombosis) 發生率因 Trendelenburg 擺位較傳統開腹術式高","C":"除了保留血管神經叢中的 cavernous nerve 外，保 留 accessary pudendal arteries 對勃起功能也很 重要","D":"對於 T2 , T3 期的病患，接受 RALP 或 open radical prostatectomy 在術後 3 年 biochemical-free recurrence survival 無顯著差異","E":"接受 RALP 或 LRP，pT3 仍約有 21%~35%的 positive margin"},"answer":"B","reference":"11) e Campbell Urology th Edition Chapter 6, P 3583 Key points","sourcePage":421},{"id":"11-057","category":"手術及併發症","categoryOrder":11,"number":57,"question":"關於腎細胞癌合併下腔靜脈腫瘤血栓(IVC tumor thrombi，採 traditional staging)手術，下列何者為 錯誤?","options":{"A":"右腎細胞癌合併 Level lll 下腔靜脈腫瘤血栓(IVC tumor thrombi) 其血栓頭端位置介於橫隔膜及肝 靜脈之間，手術時需 suprahepatic IVC clamping and infra-hepatic cavotomy","B":"Level lll~lV 下腔靜脈腫瘤血栓術中經食道超音波 (TEE)是必要，監測血栓延展程度及是否斷裂","C":"Atrial thrombi 可以完全 milking 回到下腔靜脈 時，仍可採行 venovenous bypass，但須全量肝素 預防血栓形成","D":"Cavotomy 後，IVC size 小於原本 50%時，需進行 patch cavoplasty","E":"Level lll~lV 術前心臟功能不良者接受 thrombectomy 時，為了避免 cardiac ischemia 發 生，最好接受體外循環(cardiopulmonary bypass)"},"answer":"C","reference":"(111) the Campbell Urology 12th Chapter 101 P2266~2278","sourcePage":422},{"id":"11-058","category":"手術及併發症","categoryOrder":11,"number":58,"question":"關於腹腔鏡(Laparoscopy)手術之併發症，下列何者正 確?","options":{"A":"腹腔鏡前列腺摘除手術(Laparoscopic radical prostatectomy 造成直腸損傷(Rectal injury)的機 會大約為 2%","B":"根據評估術後發生靜脈栓塞(VTE)的 Caprini score, 若為低風險(Low risk)則無需任何預防措 施","C":"部分腎切除(Partial nephrectomy)術後發生血管 損傷(Vascular injury)的機會約 2%","D":"淋巴囊腫(Lymphocele)若小於 10cm 且無症狀則可 以保守治療","E":"前列腺摘除手術(Radical prostatectomy)後發生 尿液滲漏(Urine leak)的危險因子包含肥胖, 膀胱 頸的大小, 遠端尿道的保留長度, 術後出血量和 手術時間"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell 12ed. Ch17 (A) p277, 大約 1% (B) p280, 需要 intermittent pneumatic compression (C) p274 (D) p280, 小於 5cm 且 無症狀可以保守治療 (E) p267, 遠端尿道 保留不是促進因素","sourcePage":422},{"id":"11-059","category":"手術及併發症","categoryOrder":11,"number":59,"question":"有關人工陰莖 (Penile prostheses)置放手術的併發 症，下列何者正確?","options":{"A":"若人工陰莖(Penile prothesis)發生感染, 可以在 取出植入物並控制感染後, 約 1 個月左右重新置放 植入物","B":"使用環狀切開(Circumcising incision)小心辨識 血管能避免術後發生陰莖壞死(Penile necrosis)","C":"人工陰莖(Penile prothesis)最常見的併發症是感 染","D":"兩件式或三件式人工陰莖(Penile prothesis)的幫 補(Pump)建議放在陰囊的肉膜肌下空間 (Sub-dartos pouch)","E":"有人工陰莖(Penile prothesis)的病人不能騎腳踏 車, 因為可能造成疼痛和麻木, 甚至會尿道狹窄 (Urethral stricture)"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell 12ed. Ch72 (A) p1593, 2 到 6 個月 後可重新置放植入物 (B) p1595, 使用 longitudinal incision 才能避免傷到血管 (C) p1597, 最常見的併 發症是 mechanical malfunction (D) p1586 (E) p1596, 偶爾短距離 騎腳踏車是可以的, 只 有長距離且頻繁騎腳踏 車才應避免","sourcePage":423},{"id":"11-060","category":"手術及併發症","categoryOrder":11,"number":60,"question":"有關腎移植(Renal transplant)術後的併發症，下列何 者正確?","options":{"A":"移植手術前若已知有前列腺肥大(Benign prostatic hyperplasia), 建議在移植手術前進行 經尿道前列腺刮除(TURP)","B":"腎移植術後出現膀胱輸尿管逆流(VUR)的病人高血 壓(Hypertension)的盛行率較高","C":"淋巴水腫(Lymphocele)是術後三個月內發生輸尿 管阻塞(Ureteral obstruction)常見的原因之一","D":"腎移植(Renal transplant)得到泌尿上皮癌 (Urothelial carcinoma)的風險是常人的 1.5 倍","E":"雙丁導管(DBJ)建議在移植術後 8 週移除"},"answer":"B","reference":"(111)參考資料 Campbell 12ed. Ch88 (A) p1939 不建議, 會 增加 bladder neck contracture 或 urethral stricture 的 機會 (B) p1938 (C) p1937 淋巴水腫 (lymphocele)是術後三 個月以上發生輸尿管阻 塞(ureteral obstruction)常見的原 因之一 (D) p1941 風險是常人 的 3 倍 (E) p1936 建議術後三 週移除","sourcePage":423},{"id":"11-061","category":"手術及併發症","categoryOrder":11,"number":61,"question":"關於部分腎臟切除手術（partial nephrectomy）的併 發症，何者為是?","options":{"A":"尿液滲漏（urine leaks）表徵出現的平均時間點 大約在術後第五天","B":"術後 48 小時候測量引流管的肌酸酐（creatinine） 可以幫忙診斷尿路廔管（urinary fistula），但無 法幫助辨識其位置和嚴重程度","C":"關於部分腎臟切除手術術後假性動脈瘤 （pseudoaneurysm）的發生，開腹式（open）比微 創手術（minimally invasive）的機率還高","D":"若假性動脈瘤（pseudoaneurysm）因其他因素被意 外偵測到，但病人沒有血尿症狀，此時仍皆建議病 人接受動脈栓塞的治療","E":"在 hilar control 時，只夾動脈（artery-only clamping）比合併夾動靜脈（combined clamping） 有更低的併發症比例、更短的 warm ischemia time 和較低的術後血中肌酸酐上升"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell 12ed. Ch17 & Ch 102 (A) p263 平均表現時間 點為第 13 天 (B) p263 (C) p274, open 機率 1.0%，微創機率 1.96% (D) p275, 可保守觀察 (E) p2303, artery only 只有 lower postoperative creatine rise，併發症 和 warm ischemia time 兩組相當","sourcePage":424},{"id":"11-062","category":"手術及併發症","categoryOrder":11,"number":62,"question":"在較短的（小於 2 公分）的球狀尿道狹窄（bulbar urethra stricture），針對 transecting excision and primary anastomosis (tEPA)和 buccal mucosa grafting (BMG)兩種手術方式，過往沒有隨機 對照試驗直接比較，直至今年才有北歐團隊的 Scandinavian Urethroplasty Study 發表兩者追蹤一年 併發症的比較，根據該研究何者為非？","options":{"A":"tEPA 手術的陰莖併發症（penile complication） 較高，理論為尿道海綿體(corpus spongiosum)被 截斷後，通往尿道和海綿體的血流受阻。","B":"在第 12 個月的追蹤，tEPA 組別相對 BMG 組別有顯 著更高的比例自覺龜頭較不堅硬（glans filling）","C":"在第 12 個月的追蹤，tEPA 組別相對 BMG 組別有顯 著更高的比例自覺有勃起功能障礙（erectile dysfunction）","D":"在第 12 個月的追蹤，tEPA 組別相對 BMG 組別有顯 著更高的比例自覺陰莖變短（penile shortening）","E":"在第 12 個月的追蹤點，tEPA 組別和 BMG 組別皆有 一定比例自覺龜頭感覺喪失（glans sensation）， 兩組別在此項無顯著差異"},"answer":"C","reference":"(111) Nilsen OJ, Holm HV, Ekerhult TO, Lindqvist K, Grabowska B, Persson B, Sairanen J. To Transect or Not Transect: Results from the Scandinavian Urethroplasty Study, A Multicentre Randomised Study of Bulbar Urethroplasty Comparing Excision and Primary Anastomosis Versus Buccal Mucosal Grafting. Eur Urol. 2022 Apr;81(4):375-382. (C) 在 IIEF-5 評分兩組 別無顯著差異","sourcePage":424},{"id":"11-063","category":"手術及併發症","categoryOrder":11,"number":63,"question":"Clavien-Dindo 分級系統已被臨床廣泛接受，其以治療 發生併發症所需的臨床干預措施為分級標準，能簡便客 觀地反映發生術後併發症的總體嚴重程度。下列各級數 的描述，何者為非?","options":{"A":"GradeI 可以使用止瀉藥、利尿劑","B":"GradeII 可以輸血及使用全靜脈營養","C":"GradeIIIa 治療時需要全身麻醉","D":"GradeIVa 只有單一器官功能異常","E":"GradeIV 病人死亡"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh th Urology, 12 edition. Chapter 17, p261.","sourcePage":425},{"id":"11-064","category":"手術及併發症","categoryOrder":11,"number":64,"question":"在有些泌尿道疾病手術後，關於術後神經受損的描述， 下列何者為非?","options":{"A":"Ilioinguinal nerve 是常遭遇受傷的神經之一","B":"在執行輸尿管重建手術(ureteral reimplantation and psoas hitch)，報導有近 10%的機會造成 genitofemoral nerve、femoral nerve 受傷","C":"Obturator nerve 控制大腿內側皮膚感覺及內收肌 群運動","D":"Genitofemoral nerve 受傷會影響陰曩及大腿內側 皮膚感覺","E":"Ilioinguinal nerve 受傷會造成陰囊外側皮膚感覺 異常"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 17, p262.","sourcePage":425},{"id":"11-065","category":"手術及併發症","categoryOrder":11,"number":65,"question":"執行腹腔鏡手術時，氣腹壓力 的選 (pneumoperitoneum) 擇，下列描述何者為非?","options":{"A":"研究指出 12mmHg 是較佳壓力選擇","B":"維持 10mmHg 能明顯降低寡尿(oliguria)的發生","C":"使用一氧化氮(nitrous oxide)灌入腹腔，會降低心 臟輸出量及增加平均動脈壓","D":"氣腹壓力 5mmHg，血液中二氧化碳壓力(Pco )也會上 2 升","E":"高碳酸血症(hypercapnia)會造成心搏過速及心室 心律不整"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 14, p220-221.","sourcePage":425},{"id":"11-066","category":"手術及併發症","categoryOrder":11,"number":66,"question":"在進行泌尿道手術時，對產生腸道損傷( ) bowel injury 的描述，下列何者為非?","options":{"A":"在進行腹腔鏡手術後，可能會發生延遲性或是無法 辨識的腸道損傷","B":"進行機械手臂輔助攝護腺切除，直腸損傷機率為 1%","C":"直腸損傷時，若是沒有明顯大便溢出，可以直接進 行縫合修補","D":"使用腹腔鏡不帶熱能剪刀分離沾黏處可以避免腸 道損傷","E":"胰臟受損時，會產生胰臟廔管或是腹內膿瘍"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 17, p275-278.","sourcePage":425},{"id":"11-067","category":"手術及併發症","categoryOrder":11,"number":67,"question":"對靜脈栓塞( )的發生，可以使用 venous thromboembolism Caprini score 來做風險分層評估(risk stratification)，下列關於 Caprini score 內容描述何 者為非?","options":{"A":"年齡介於 61 到 74 歲，分數 2 分","B":"血小板減少症，分數 3 分","C":"敗血症(小於壹個月)，分數 1 分","D":"中風(小於壹個月)，分數 4 分","E":"髖骨、大腿骨折，分數 5 分"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 17, p278-279.","sourcePage":426},{"id":"11-068","category":"手術及併發症","categoryOrder":11,"number":68,"question":"關於腹腔鏡手術建立腹部通道(abdominal access)時， 所引起的併發症，何者錯誤？","options":{"A":"氣體栓塞的跡象可能引起血流動力學的變化包 括：突發性缺氧、高碳酸血症、低血壓、心律失常 或充氣過程發紺","B":"對於氣體栓塞的治療是立即排氣，給予 100% 的 FiO2，並將患者置於特倫德倫伯臥位 (Trendelenburg position)和右側臥位以捕獲右心 房中的氣泡，然後插入中心靜脈導管以試圖吸出氣 泡","C":"氣腹針的進入角度被認為是有影響的。 一般來 說，對於 BMI 正常的患者，氣腹針必須以 45 度 的角度插入，而對於肥胖患者，必須以 90 度的角 度插入肚臍水平","D":"一般來說，靠近臍部附近的主動脈及腔靜脈分叉處 容易有血管損傷的情形，而最有可能被 Veress needle 或套管直接損傷的血管是左髂總靜脈","E":"傳統上，Hasson technique 被認為是對於經驗不足 的外科醫生或對於曾接受過腹部手術且懷疑有廣 泛性粘連時的患者來說，最安全的方法"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume I, Chapter 17 (p.269-274)","sourcePage":426},{"id":"11-069","category":"手術及併發症","categoryOrder":11,"number":69,"question":"關於 The Clavien-Dindo Scale 的敘述，何者為錯？","options":{"A":"Grade I 是指任何偏離正常的術後回復過程，但不 需要藥物或手術性、放射科的介入治療 (radiologic interventions)，可允許使用症狀治 療藥物包含，止吐藥、解熱藥、鎮痛劑、利尿劑、 電解質補充和物理治療；亦包含床邊因傷口感染的 開放性傷口照護","B":"Grade II 則是需要使用其他藥物(Grade I 所允許 的藥物以外)來進行治療的併發症，且輸血和全胃 腸外營養也包括在內","C":"Grade III 則是需手術、內視鏡或放射科的介入治 療，其中 IIIa 是指不需要全身麻醉的狀況下執 行，而 IIIb 是指需要全身麻醉下執行","D":"Grade IV 是指 Life-threatening 的併發症並且需 要在加護單位進行治療，其中 IVa 是指單一器官發 生功能障礙 (包含洗腎)，而 IVb 是指多重器官發 生功能障礙","E":"The Clavien-Dindo system 是根據併發症的處理及 嚴重程度來分類，且其對於早期、晚期或是術中的 併發症並沒有區分，然而它可能不適用於小兒泌尿 外科"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume I, Chapter 17 (p.260-261)","sourcePage":426},{"id":"11-070","category":"手術及併發症","categoryOrder":11,"number":70,"question":"關於上泌尿道手術後尿液滲漏的相關敘述，何者為錯？","options":{"A":"尿液滲漏的發生率，於傳統開放性的腎臟部分切除 術為 1.0% 至 17.4%，於腹腔鏡部分腎臟切除術為 1.6% 至 16.5%，而於機器手臂輔助部分腎切除術 的比率則低至 0.78%","B":"對於尿液滲漏於部分腎臟切除術的最相關因子包 含腫瘤大小、內生性 (endophytic)、冷缺血時間、 手術時間及靠近肺門 (hilar) 的腫瘤","C":"使用具有尿路造影階段(urogram phase)及顯影劑 的電腦斷層掃描，且合併可見腎盂和輸尿管的延遲 圖像(delayed imagine)，仍然是診斷的主要手段， 因為它可以準確估計尿路瘤(urinoma)的範圍或洩 漏的位置","D":"手術 48 小時候測量引流管中的肌酸酐 （creatinine）有助於診斷尿液滲漏，但不能確定 其位置或嚴重程度","E":"當懷疑並證實有漏尿時，尿管需要持續使用或重新 插入；如果滲漏持續存在時，使用輸尿管支架置入 合併逆行腎盂造影檢查將有助於重新評估滲漏的 嚴重程度並且能夠實現最佳的引流效果"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume I, Chapter 17 (p.263-264)","sourcePage":427},{"id":"11-071","category":"手術及併發症","categoryOrder":11,"number":71,"question":"關於手術造成之輸尿管損傷的敘述，下列何者為非？","options":{"A":"當最初的內視鏡嘗試失敗或廣泛的輸尿管狹窄長 度> 2 cm 時，理論上就需要進行手術修復","B":"對於一輸尿管再植手術，一般而言，會以 psoas hitch 針對輸尿管下段缺損，而 Boari flap 則是針 對輸尿管中段損傷","C":"根據文獻，腹腔鏡子宮切除術於輸尿管損傷的發生 率為 0.3%，且均靠近子宮動脈(uterine artery) 和子宮骶韌帶(uterosacral ligament)","D":"手術造成之輸尿管損傷，部分或完全橫斷是在術中 最可識別的損傷，並且能夠在術中就進行處理；而 結紮(ligation)和熱損傷(thermal injury)可能會 有延遲的症狀表現","E":"早期辨識出輸尿管損傷，對於後遺症發病率 (morbidity)有很大影響，根據文獻，早期和延遲 識別輸尿管損傷需要腎造口術(nephrostomy)的比 例分別為 2.3% 和 23.4%"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume I, Chapter 17 (p.264-267)","sourcePage":427},{"id":"11-072","category":"手術及併發症","categoryOrder":11,"number":72,"question":"關於泌尿道手術後相關併發症之敘述，何者為非？","options":{"A":"在機器人或腹腔鏡泌尿外科損傷中，膀胱損傷其實 很少見。然而，在婦科手術或結腸直腸手術中更為 常見","B":"腹腔鏡手術後發生的延遲性或未被識別的腸損傷 具有非典型表現，一般來說，患者可能不會有腹膜 炎、急性腹症或白細胞增多的表現；而典型症狀， 通常在術後 24 至 48 小時內才會出現","C":"腎切除手術術後可能會發生延遲性的胰腺損傷，可 以藉由引流液的增加及引流液中解脂酶(Lypase) 的增加來加以診斷","D":"直腸損傷是根治性前列腺切除術中最常見的腸道 併發症，而傳統開腹和機器人輔助之前列腺切除術 的直腸損傷發生率相同","E":"針對靜脈栓塞(venous thromboembolism)的風險評 估，使用最廣泛的風險分層方法是 Caprini score， 患者被分類為非常低風險(0 分)、低風險(1-2 分）、 中度風險（3-4 分）和高風險（≥5 分）"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume I, Chapter 17 (p.275-281)","sourcePage":428},{"id":"11-073","category":"手術及併發症","categoryOrder":11,"number":73,"question":"有關腎臟移植(Renal transplantation)手術後的併發 症，下列敘述何者正確?","options":{"A":"動靜脈及集尿系統的瘻管(arteriovenous collecting system fistula)是可能造成術後持續 性血尿的原因，且大於 70%的病人皆須以經血管栓 塞(selective embolization)來處理","B":"移植輸尿管的遠端血循不良及缺血(ischemia)是 造成尿液滲漏(urinary leak)及輸尿管狹窄 (ureteral stricture)的主要危險因子","C":"吻合處水腫(anastomosis edema)是造成移植輸尿 管阻塞(ureteral obstruction)的晚期(大於 3 個 月)原因之一","D":"移植後淋巴囊腫(lymphocele)的處理方式包含抽 吸(aspiration)、硬化劑注射(sclerotherapy)、 引流管放置(drainage placement)、腹腔鏡手術、 及開放手術，其中以開放手術的成功率最高","E":"若移植男性病人合併有未處理的良性攝護腺增生 (benign prostatic hyperplasia)並且移植術後產 生阻塞性腎水腫,應該在移植手術後兩周內盡快手 術以避免腎功能惡化"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, 2020, Volume II, Chapter 88, p.1936-p.1939","sourcePage":428},{"id":"11-074","category":"手術及併發症","categoryOrder":11,"number":74,"question":"有關尿路腸道分流(Urinary intestinal diversion)手 術後的長期併發症，下列敘述何者錯誤?","options":{"A":"使用胃(stomach)來做尿路腸道分流，可能產生血 尿-解尿疼痛症候群(hematuria-dysuria syndrome)，並可以使用 H2-blocker 等藥物來治療","B":"使用空腸(jejunum)來做尿路腸道分流，因較容易 產生嚴重的電解質不平衡如高鉀性高氯性代謝性 酸中毒(hyperkalemic hyperchloremic metabolic acidosis)合併低血鈉(hyponatremia)，故應優先 考慮其他腸道來做分流","C":"使用迴腸導管術(ileal conduit)的病人，有 3/4 的病人有菌尿症且多數無症狀，但若尿液培養出變 異菌屬(Proteus)或假單孢菌屬(Pseudomonas)則 較有可能造成尿路上游的感染及功能惡化","D":"尿路腸道分流的病人發生骨質軟化 (Osteomalacia)可能的原因包含酸血症 (acidosis)、維他命 D 抗性(vitamin D resistance)、及腎臟流失鈣質","E":"若尿路腸道分流的病人使用經腎臟排泄的藥物，有 可能會因為經由腸道分流處再吸收而造成毒性，因 此這類病人在經化學治療時，應考慮在尿路腸道分 流處進行引流"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, 2020, Volume III, Chapter 139, p.3160-3162, p.3198-3203","sourcePage":429},{"id":"11-075","category":"手術及併發症","categoryOrder":11,"number":75,"question":"有關尿道中段懸吊手術(Mid-Urethral Sling)的比較及 併發症，下列敘述何者正確?","options":{"A":"經恥骨後(Retropubic)中段尿道懸吊手術相較經 閉孔(Trans-obturator)中段尿道懸吊手術，有較 高的穿刺器損傷(Trocar injury)比例","B":"經恥骨後(Retropubic)中段尿道懸吊手術相較經 閉孔(Trans-obturator)中段尿道懸吊手術，有較 高的鼠蹊部疼痛(Groin pain)比例","C":"對於無症狀的膀胱內人工網膜穿孔(intravesical mesh perforation)，可先考慮保守治療 2-4 週無 效後，再進行經陰道人工網膜切除術 (transvaginal mesh excision)","D":"對於尿道中段懸吊手術後的解尿困難(voiding dysfunction)，尿道擴張術(urethral dilation) 是治療的首選","E":"尿道中段懸吊手術後的性交疼痛(dyspareunia)， 即使病人是停經後女性，依然不建議使用陰道局部 雌激素(vaginal estrogen)"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, 2020, Volume III, Chapter 125, p.2863-2873, Chapter 126 p.2880-2883","sourcePage":429},{"id":"11-076","category":"手術及併發症","categoryOrder":11,"number":76,"question":"晚期腎細胞癌(Advanced renal cell carcinoma, RCC) 的其中一項特性是容易形成靜脈腫瘤栓塞(venous tumor thrombus)，有關手術處理腎細胞癌併靜脈腫瘤 栓塞的敘述，下列何者錯誤?","options":{"A":"傳統分級將腎細胞癌併靜脈腫瘤栓塞的侵犯程度 分成 0-IV 級，其中 III 級(Level III)是指栓塞侵 犯程度在下腔靜脈(Inferior vena cava, IVC)中 高於肝靜脈(hepatic vein)但低於橫膈膜 (diaphragm)","B":"對於 Level I 的腫瘤栓塞，可使用 C 型薩丁斯基血 管鉗(Satinsky vascular clamp)將腎靜脈進入下 腔靜脈的開口處夾住，後將腎臟與腫瘤栓塞取出後 直接對下腔靜脈的缺口進行縫合","C":"對於 Level III 以上的腫瘤栓塞，可考慮使用心肺 體外循環(Cardiopulmonary bypass)合併深低溫停 循環(Deep hypothermic circulatory arrest)來 幫助手術順利進行","D":"若對於下腔靜脈腫瘤栓塞的侵犯程度有疑慮，或懷 疑腫瘤於下腔靜脈中移位產生遠處栓塞 (Embolization)，可於術前或術中請麻醉科或心臟 科執行經胸壁心臟超音波(Transthoracic echocardiography, TTE)來確定其位置","E":"若下腔靜脈在手術後損失小於其原始體積的 50%， 則可使用補片下腔靜脈修補術(patch cavoplasty)，常使用的材料包含豬心包膜(bovine pericardium)或聚四氟乙烯 (polytetrafluoroethylene, PTFE)等"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, 2020, Volume II, Chapter 101, p.2266-2278","sourcePage":430},{"id":"11-077","category":"手術及併發症","categoryOrder":11,"number":77,"question":"輸尿管狹窄疾病(Ureteral stricture disease)因應狹 窄長度及位置有許多不同的手術方式，下列有關其手術 原則的敘述何者錯誤?","options":{"A":"若選擇使用逆行性氣球擴張術(Retrograde balloon dilation)，病人當下的活動性感染 (Active infection)及狹窄長度大於兩公分為其禁 忌症(contraindication)","B":"若選擇使用內視鏡輸尿管切開術 (Endoureterotomy)，為了避開傷到血管，下段輸 尿管應選擇切在後外側(posterolateral)，而上段 輸尿管應選擇切在前中側(anteromedial)","C":"若選擇開放性手術修補，膀胱肌瓣整形術(Boari flap)比起腰大肌懸吊(Psoas hitch)可以彌補更長 的輸尿管缺損","D":"若選擇使用迴腸輸尿管替代術(ileal ureteral substitution)，血清肌酐酸(creatinine)濃度大 於 2 mg/dL 會顯著增加病人產生帶高氯性代謝性酸 中毒(hyperchloremic metabolic acidosis)的機 會","E":"若上述輸尿管狹窄的手術方式皆失敗或無法執 行，且病人對側腎臟功能不佳，則可以考慮執行自 體腎臟移植(Autotransplantation)"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, 2020, Volume II, Chapter 89, p.1965-1976","sourcePage":430},{"id":"11-078","category":"手術及併發症","categoryOrder":11,"number":78,"question":"以下關於根除性攝護腺切除術及其併發症何者錯誤?","options":{"A":"Salvage radical prostatectomy 有較高機會在術 中造成直腸損傷","B":"術後勃起功能障礙對藥物的反應不佳","C":"根除性攝護腺切除術術中最常見的併發症是出血","D":"術後膀胱頸攣縮(bladder neck contracture)的發 生率在過去十年有顯著下降","E":"血栓靜脈炎合併肺栓塞(Thrombophlebitis with pulmonary embolism)是根除性攝護腺切除術術後 死亡的主因"},"answer":"B","reference":"(112) 參考資料(摘錄自)： European Urology Open Science Volume 52, June 2023, Pages 85-99 Campbell Urology, 12th, p3563, 3564, 3565","sourcePage":431},{"id":"11-079","category":"手術及併發症","categoryOrder":11,"number":79,"question":"下列關於懷孕婦女接受手術及相關併發症的敘述何者 錯誤?","options":{"A":"非緊急的手術應選在第二孕期執行以減少早產收 縮及流產的機會","B":"孕婦發生血栓栓塞疾病的機會比未懷孕者高十倍","C":"孕婦在平躺或截石臥位時右側抬高可以避免靜脈 回流及心輸出量的快速下降","D":"在懷孕期間可以接受經尿道切除膀胱腫瘤來做病 理確認","E":"懷孕患者接受輸尿管鏡發生併發症的機會比未懷 孕患者高"},"answer":"E","reference":"(112) 參考資料(摘錄自)： Campbell Urology, 12th, p282, 283, 285, 288, 293","sourcePage":431},{"id":"11-080","category":"手術及併發症","categoryOrder":11,"number":80,"question":"以下有關泌尿系統手術伴隨的併發症，下列描述何者有 誤?","options":{"A":"若術前擺位時，手臂的位置過度外展到大於九十 度，可能導致臂神經叢的傷害，病人會抱怨不同程 度的肩膀疼痛或手臂無力，而其中的 radial nerve 受傷，會導致 wrist drop","B":"在泌尿科的微創手術當中，最常見需要轉成開放式 手術的理由是因為血管損傷。而容易導致血管併發 症的病人相關因素，包括病人曾經開過其他腹部的 手術、肥胖、以及特殊的血管解剖構造","C":"腹腔鏡手術可能因為 trocar 的置入或電燒的使 用，導致術後發生延遲的腸道傷害，症狀可能在術 後一至兩天後才出現，症狀包括腹脹和腸阻塞，抽 血檢查反而較常出現 leukopenia 而非 leukocytosis","D":"當我們要執行 ureteral reimplantation，或是 psoas hitch procedure 時，將膀胱固定在 psoas tendon 上的 anchoring suture，有可能會導致 ilioinguinal nerve 受到壓迫，因而導致陰囊和大 腿內側的感覺異常","E":"無論是 open 或是 robotic 的攝護腺手術，導致直 腸受傷的發生率相近，但在 salvage prostatectomy 手術會有較高的直腸受傷發生率，若破損的當下沒 有直接看到明顯四散的糞便，可以只進行 primary closure 而不做 bowel diversion"},"answer":"D","reference":"(112) 參考資料(摘錄自)： Campbell 12ed. Ch17 p. 261-262, 270, 275-278","sourcePage":432},{"id":"11-081","category":"手術及併發症","categoryOrder":11,"number":81,"question":"下列關於腎移植後輸尿管狹窄 Ureteral stricture 敘 述何者錯誤?","options":{"A":"晚期(>3 個月)腎移植術後之輸尿管阻塞最常見原因 是輸尿管狹窄","B":"臨床表現為水腎以及腎功能下降, 可考慮做 Antegrade nephrostogram 或 Whitaker test 加以診 斷","C":"輸尿管狹窄最常見的原因是慢性感染","D":"治療首先要讓集尿系統減壓, 使 Allograft 腎功能 恢復","E":"治療選項有內視鏡放置 ureteral stent 或 balloon dilation, 但 Open surgical repair 較內視鏡手術 長期預後好"},"answer":"C","reference":"(112) 參考資料(摘錄自)： Campbell 12th ch.88 p1937-1938","sourcePage":432},{"id":"11-082","category":"手術及併發症","categoryOrder":11,"number":82,"question":"下列關於腎移植術後的併發症敘述何者錯誤？","options":{"A":"尿液滲漏(Urinary Leak)原因包括過長輸尿管，手 術技術問題如 ureteric twisting or kinking，過 早移除 Ureteral stent 或 Urinary catheter，腎 實質壞死","B":"腎移植後 VUR(Vesicoureteral Reflux)發生率約 50-86%，但有症狀的 VUR(symptomatic VUR)不到 1%","C":"若反覆泌尿道感染，應做 Voiding cystography 評 估 VUR(Vesicoureteral Reflux)之程度","D":"早期輸尿管阻塞 Ureteral obstruction 原因有過 長輸尿管，輸尿管膀胱吻合技術問題，未放置 Ureteral stent","E":"晚期輸尿管阻塞原因有外部壓迫(lymphocele, hematoma,abscess)、輸尿管狹窄、結石"},"answer":"E","reference":"(112) )/ 11.手術及併 發症/參考資料(摘錄 自)： C a mpbell 12th ch.88 (A)p1937 (B)p1938 (C)p1938 (D)p1937 (E)p1937","sourcePage":433},{"id":"11-083","category":"手術及併發症","categoryOrder":11,"number":83,"question":"有關攝護腺根除手術後尿液滲漏併發症之敘述，何者為 非？","options":{"A":"是術後早期(7-10 天)常見的併發症，發生率約為 0.3% - 15.4%","B":"雖然提早至術後第二天移除尿管並沒有顯著增加 尿液滲漏的風險，一般還是認為術後需留置尿管 7-10 天","C":"肥胖、手術時間長短、膀胱頸大小、未執行膀胱頸 重建術、及術後出血(Hct 下降大於 6%)等是術後尿 液滲漏的預測因子","D":"若滲漏量不大時，可檢測引流液之肌酸酐濃度輔佐 判斷，或是以 computed tomography cystography 加以判斷","E":"尿液滲漏大多可以延長尿管留置方式保守處理，必 要時可配合使用 traction"},"answer":"E","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, Page 267-269 (E) It is crucial to ensure that the urethral catheter is in place and draining optimally. Traction should never be employed as it can further disrupt the anastomosis and risk contracture formation.","sourcePage":433},{"id":"11-084","category":"手術及併發症","categoryOrder":11,"number":84,"question":"有關手術導致腸損傷(Bowel injuries)併發症之敘述， 下列何者錯誤？","options":{"A":"約有將近七成的腸損傷無法在術中被即時發現，且 可能發生在手術中的任何一個階段","B":"這些未及時發現的術後腸損傷患者，常有腹膜炎癥 兆(peritonitis)，及白血球增生(leukocytosis)","C":"症狀通常發生在術後 24-48 小時，包含單一 trocar site 異常疼痛但不伴隨腹脹、腸阻塞、及腹瀉","D":"腹部電腦斷層(computed tomography)合併使用口 服及靜脈注射顯影劑為最佳診斷工具","E":"對於困難或是有腹腔手術史的個案，術前清腸 (bowel prep)是必要的，並且數中執行沾黏分離術 (adhesiolysis)時，應使用不帶電燒的腹腔鏡剪， 避免腸道熱傷害"},"answer":"B","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, Page 275-277 (B) Complete blood count usually reveals leukopenia rather than leukocytosis (Bishoff et al.,1999).","sourcePage":433},{"id":"11-085","category":"手術及併發症","categoryOrder":11,"number":85,"question":"有關 Clavien Dindo Classification 之敘述，何者正 確？","options":{"A":"輸血、使用全靜脈營養、藥物等方式，分級上屬於 Grade II","B":"術後傷口感染在病房以止痛藥止痛後執行傷口切 開術，分級上屬於 Grade III","C":"Clavien Dindo System 可用於小兒泌尿的範疇","D":"Grade IVb 是指 Life-threatening complication 中有多器官功能障礙(Multiorgan dysfunction)， 包含需要洗腎","E":"Clavien Dindo Classification 可以用來區分早期 及晚期併發症"},"answer":"A","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, Page 260-281 (B) Grade 1: Allowed therapeutic regimens are: drugs as antiemetics, antipyretics, analgesics, diuretics, and electrolytes and physiotherapy. This grade also includes wound infections opened at the bedside.","sourcePage":434},{"id":"11-086","category":"手術及併發症","categoryOrder":11,"number":86,"question":"有關輸尿管損傷(ureteral injury)的敘述，何者錯誤？","options":{"A":"Laparoscopic hysterectomy 併發輸尿管損傷的發 生率約為 0.3%，大多是因為解剖位置接近 uterine artery 及 uterosacral ligament","B":"對於術中輸尿管損傷最好的預防方式是儘早辨認 出輸尿管","C":"好發位置在上腹腔，輸尿管靠近 gonadal vessels 以及腎臟的下端(lower pole) ; 在下腹 腔，輸尿管與 common iliac artery 在 pelvic rim 附近交會","D":"Computed tomography 合併使用靜脈注射顯影劑以 獲取延遲影像是較適合的診斷工具","E":"若發現輸尿管損傷是在術後兩週左右，由於發炎情 形尚未嚴重，可以考慮 early surgical repair"},"answer":"E","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, Page 264-267 (E) In the early postoperative period, as long as the injury has been discovered in the first 7 days postoperatively and endoscopic management is considered inadequate, an early surgical repair could be attempted, as the inflammation is not extensive.","sourcePage":434},{"id":"11-087","category":"手術及併發症","categoryOrder":11,"number":87,"question":"有關進入腹腔(Abdominal Access)造成之血管損傷，下 列何者敘述有誤？","options":{"A":"發生率約為 0.1%","B":"Trocar 進入前應將腹腔充氣至 15 to 18 mmHg，完 成 trocar 建立後再降回 12 to 15 mmHg","C":"Veress needle 或 trocar 由肚臍周圍進入時最常傷 害到的血管為 right common iliac artery","D":"根據文獻，使用 Veress needle 與 direct trocar method 相比有較高的進入失敗率(access failure rates)","E":"目前對於何種進入方式(Access Techniques)較為 安全尚無定論，但對於有腹腔手術史或是懷疑有嚴 重沾粘的個案而言，Hasson technique 是一般認為 最安全的選擇"},"answer":"C","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, Page 271-273 (C) In most situations, with the aortic and vena caval bifurcation near the umbilicus in general, the most likely vessel injured directly with an umbilical Veress needle or trocar is the left common iliac vein.","sourcePage":435},{"id":"11-088","category":"手術及併發症","categoryOrder":11,"number":88,"question":"關於小兒腎盂整形手術(pyeloplasty)以及併發症，下 列何者錯誤？","options":{"A":"目前小兒腎盂整形手術併發症少，且手術成功與非 常高，達 90％-100%","B":"在 laparoscopic or robotic-assisted pyeloplasty 當中，如果是 left-sided pyeloplasy，可以考慮 transmesenteric approach，比起 retrocolic approach 手術時間較 少、住院天數較短、併發症發生率較低","C":"Minimally invasive pyeloplasty 術中導致需要改 成傳統開腹手術最常見的原因為 difficulties dissecting the UPJ","D":"Pyeloplasty 術後持續感染、疼痛、以及腎盂腫脹 加劇都是重建手術失敗的早期徵象","E":"Pyeloplasty 術後如果腎功能變差或是 hydronephrosis 更加嚴重，可以考慮於輸尿管狹窄 處進行氣球擴張術以及輸尿管導管置放至少 4 到 6 週。如果效果不彰才考慮再次 pyeloplasty"},"answer":"C","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： Campbell 12ed, Chapter 42, page 826-852 詳解： (C) 最常見的原因為 bleeding","sourcePage":435},{"id":"11-089","category":"手術及併發症","categoryOrder":11,"number":89,"question":"近年來針對 bladder cancer 病人如果需要接受 radical cystectomy，有越來越多醫師會選擇使用 robotic system 來進行手術。於是英國的研究團隊在 2023 年 5 月 European Urology 期刊發表一篇 systematic review and meta-analysis，比較 robotic-assisted radical cystectomy (RARC)和 open radical cystectomy (ORC) 間的 outcomes，下列何者錯誤？","options":{"A":"ORC 比起 RARC 需要顯著更長的住院天數","B":"關於 90 天內的 overall complication rate，兩者 之間並沒有顯著差異","C":"ORC 比起 RARC 有顯著較多的 blood loss，以及需 要輸血的比例也顯著較高","D":"RARC 平均的手術時間較長，且有顯著較高比例的 venous thromboembolic events","E":"兩著之間的 3 年 overall survival 以及 progression-free survival 則是沒有差別"},"answer":"D","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： Khetrapal P, Wong JKL, Tan WP, Rupasinghe T, Tan WS, Williams SB, Boorjian SA, Wijburg C, Parekh DJ, Wiklund P, Vasdev N, Khan MS, Guru KA, Catto JWF, Kelly JD. Robot-assisted Radical Cystectomy Versus Open Radical Cystectomy: A Systematic Review and Meta-analysis of Perioperative, Oncological, and Quality of Life Outcomes Using Randomized Controlled Trials. Eur Urol. 2023 May 9:S0302-2838(23)0272 6-4. doi: 10.1016/j.eururo.202 3.04.004. Epub ahead of print. (D) ORC 的 venous thromboembolic event 顯著較高(OR 1.84, 95% CI 1.02–3.31, p = 0.04)","sourcePage":436},{"id":"11-090","category":"手術及併發症","categoryOrder":11,"number":90,"question":"腎移植(renal transplant)相關之病發症，何者正確？","options":{"A":"腎臟切片後持續或嚴重血尿，應安排 Dopplar ultrasound 以排除 pseudoaneurysm","B":"尿液滲漏為移植術後之常見併發症，其主因為遠端 輸尿管缺乏血流供應造成壞死","C":"其他可能造成尿液滲漏之原因包括：輸尿管過短、 過早移除膀胱或輸尿管之引流、急性尿滯留、輸尿 管 twisting or kinking","D":"術後出現膀胱輸尿管逆流(VUR)的發生率 50%~86%，而有症狀之有臨床意義 VUR 約 10%","E":"腎移植病人發生膀胱癌之風險與常人相近"},"answer":"B","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： Campbell 12ed, Chapter 88, page 1936-1941 詳解：答案為(B) A, P.1936, 排除 AV fistula C, P.1937, 輸尿管過長 D P.1938, 有意義 VUR 約 1% E, P.1941, significantly increased risk","sourcePage":436},{"id":"11-091","category":"手術及併發症","categoryOrder":11,"number":91,"question":"關於 varicocelectomy 手術及併發症，下列何者錯誤？","options":{"A":"術後最常見的併發症為 hydrocele，發生率大約 3%-30%不等","B":"造成 hydrocele 主要原因為靜脈回流受阻。","C":"Microscopic varicocelectomy 相較於 conventional inguinal approach 能夠有效減少 hydrocele 發生","D":"Varicocelectomy 術中如果發生 testicular artery injury，成人會比小孩更容易造成日後的 testicular atrophy","E":"相較於 Microsurgical approach，conventional inguinal approach 有較高的 varicocele recurrence rate"},"answer":"B","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： Campbell 12ed, Chapter 67, page 1453-1484 詳解： (B) 主要原因為淋巴回 流受阻","sourcePage":437},{"id":"11-092","category":"手術及併發症","categoryOrder":11,"number":92,"question":"依據 Campbell 第 12 版請問以下關於 hypospadias repair 術後 complication 敘述何者正確？","options":{"A":"Urethrocutaneous fistula 為 hypospadias 術後 最罕見併發症","B":"術後發現的 Small urethrocutaneous fistula 若 無發炎感染決大部分會自行癒合","C":"術後發生 Glans dehiscence 無論有無排尿症狀一 定需手術。","D":"術後發生 recurrent curvature 定義為在勃起狀況 下 residual ventral, dorsal, or lateral curvature >30 degrees","E":"Meatal stenosis 定義為 meatal calibration <14 Fr before puberty or <16 Fr after puberty 即 可定義為 meatal stenosis"},"answer":"B","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： Campbell 12ed, Chapter 17, page 935-939 答案為 (D) 詳解 A：最常見併發症 B:不會自行癒合 C：有排尿症狀才一定要 手術 D：正確 E：需排尿症狀","sourcePage":437},{"id":"11-093","category":"手術及併發症","categoryOrder":11,"number":93,"question":"下列關於使用腸道做為尿路重建的敘述何者錯誤?","options":{"A":"使用胃來執行尿路重建可能發生 hematuria-dysuria syndrome","B":"使用迴腸或結腸執行尿路重建都可能會產生低血 鉀高血氯的酸中毒","C":"使用結腸執行尿路重建術後發生腸阻塞需再次手 術的機會比使用迴腸高","D":"使用越近端的空腸執行尿路重建引起的血液離子 不平衡越嚴重","E":"使用過長的迴腸執行尿路重建可能引起腹瀉及脂 肪吸收不良"},"answer":"C","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： 參考資料 摘錄自 Campbell Urology, 12th, p3162, 3199, 3200","sourcePage":438},{"id":"11-094","category":"手術及併發症","categoryOrder":11,"number":94,"question":"下列關於經皮腎造廔取石術(PCNL)的敘述何者錯誤?","options":{"A":"針對馬蹄腎(Horseshoe Kidney)可採取 Upper-pole access","B":"發生靜脈氣栓塞(venous gas embolism)的患者可 能會有心輸出量降低的表現","C":"約有 2%的病人在術後會有 infundibular stenosis","D":"術後置放經皮腎造廔管引流，術後出血量與引流管 (nephrostomy tube)管徑大小有關","E":"非複雜性經皮腎手術對腎臟功能的影響很有限"},"answer":"D","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： 參考資料 摘錄自 Campbell Urology, 12th, p177, 178, 182, 183","sourcePage":438},{"id":"11-095","category":"手術及併發症","categoryOrder":11,"number":95,"question":"下列關於腹腔鏡手術的敘述何者正確?","options":{"A":"術中有未被察覺的腸道熱損傷患者可能出現低體 溫、白血球減少(leukopenia) 以及最靠近腸道損 傷的 Trocar 傷口處持續的疼痛","B":"使用 Blunt trocar 可減少腹壁出血的發生率但不 影響 Port site hernia 的發生率","C":"使用 Veress Needle 誤入腸道時，需執行剖腹探查 確認腸道受傷狀況","D":"Trocar 若穿刺到大血管血持續有血湧出，應立即將 Trocar 取出並改為傳統開腹手術修補","E":"腹腔鏡術後發現的膀胱受損都應該再次進行手術 修補"},"answer":"A","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： 參考資料 摘錄自 Campbell Urology, 12th, p219, 224, 226, 229, 230.e1","sourcePage":438},{"id":"11-096","category":"手術及併發症","categoryOrder":11,"number":96,"question":"下列有關 lymphoceles 的敘述何者為錯誤?","options":{"A":"達文西經腹腔攝護腺根除性手術及骨盆腔淋巴結 廓清術後約有 4.6%至 10%患者會有 lymphocele 的 產生, 其中好發於術後 24 至 48 小時以內","B":"進行骨盆底淋巴結廓清術時, 常使用血管夾 (clips)或雙極電燒(bipolar devices), 但目前並 無實證兩者之間何者有較低的 lymphocele 發生率","C":"大多數的 lymphocele 都是無症狀的, 通常若是小 於 5 公分可以採取保守治療並常規追蹤就可以","D":"Lymphoceles 所引起的壓迫性症狀包含下肢水腫, 頻尿與急尿等, 可考慮經皮穿刺引流手術 (percutaneous drainage), 若反覆發生可考慮經 腹腔鏡造袋手術(laparoscopic marsupialization)","E":"若進行骨盆腔淋巴結廓清術, 建議手術後置放引 流管, 但不論是經腹膜(transperitoneal)或是腹 膜外(extraperitoneal)的攝護腺根除性手術, 兩 者之間造成有症狀的 lymphocele 發生率並無明顯 差異"},"answer":"A","reference":"(112) / 11.手術及併發 症/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition Ch 17 p.280-281 A: 好發於手術後 48 至 72 小時以內。","sourcePage":438},{"id":"11-097","category":"手術及併發症","categoryOrder":11,"number":97,"question":"下列關於恥骨陰道吊帶手術(pubovaginal sling procedure)之敘述, 何者正確?","options":{"A":"目前恥骨陰道吊帶手術的使用材料 gold standard 為人工合成吊帶(synthetic slings)。","B":"最終縫合陰道切口之前, 需先使用 70 度膀胱鏡確 認是否有膀胱內受損(perforation), 再換成 12 度 膀胱鏡退至膀胱頸來調整吊帶鬆緊度。","C":"當使用自體組織吊帶(autologous slings)進行恥 骨陰道吊帶手術, 其治癒率在 31%至 97%之間, 其 中對於應力性尿失禁(stress urinary incontinence)的效果比應力性膀胱過動症 (stress-induced detrusor overactivity)的效果 相似。","D":"此手術後所引起的急尿(urgency)及急迫性尿失禁 (urge urinary incontinence), 比術後引起的尿 滯留(urinary retention)比率還低。","E":"自體組織吊帶(autologous slings)若引起的尿道 破裂(urethral perforation), 其應力性尿失禁復 發的比率約在 44%至 100%"},"answer":"C","reference":"(112) / 11.手術及併發 症/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition Ch 125 p.2833-2849 A: autologous slings 為目前 PVS 的 gold standard B: 應先縫合陰道切口 再調整吊帶鬆緊 D: 術後急尿及 UUI 的比 率比尿滯留還高(8-25% vs <=5%) E: 此敘述若改為人工 合成吊帶(synthetic slings)則正確","sourcePage":439},{"id":"11-098","category":"手術及併發症","categoryOrder":11,"number":98,"question":"下列對於輸尿管鏡結石手術(ureteroscopic stone management)之併發症敘述, 何者錯誤?","options":{"A":"若發生輸尿管破裂(ureteral perforation), 應即 刻終止手術並置放輸尿管支架(ureteral stent)","B":"即便是進行非複雜性的輸尿管鏡手術之後, 仍有 發生輸尿管狹窄的可能性, 因此建議所有術後患 者都應接受影像學檢查(postoperative imaging)","C":"在輸尿管破裂(ureteral perforation)的情況下有 可能發生黏膜下結石(submucosal stone)甚至造成 結石完全擠出(complete extrusion or lost stone), 此時不應繼續碎石手術, 以避免輸尿管 損傷及外滲(extravasation)情形更嚴重","D":"若輸尿管破裂受損範圍超過圓周之一半以上, 且 成功置放輸尿管支架(ureteral stent), 應至少在 12 周後待發炎反應消退後進行手術修補","E":"在非視野內使用取石網(basket)是造成輸尿管撕 裂傷(avulsion)常見原因, 其發生率佔整體手術 的 0.06%至 0.5%"},"answer":"D","reference":"(112) / 11.手術及併發 症/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition Ch 94 2107-2109 D: 待六周後就可嘗試 修補, 非”至少”12 周。","sourcePage":439},{"id":"11-099","category":"手術及併發症","categoryOrder":11,"number":99,"question":"關於孕婦相關的泌尿科手術, 下列何者敘述錯誤?","options":{"A":"若評估孕婦較無早期宮縮或自然流產之可能性, 即使非緊急手術, 在第二孕期(second trimester) 可以進行泌尿科手術","B":"若泌尿科醫師經評估需要進行電腦斷層檢查, 應 會診放射科及婦產科醫師共同評估, 以低劑量電 腦斷層(low-dose radiation exposure CT)為準則, 最高劑量不應超過 50mGy","C":"膀胱腫瘤是造成血尿的原因之一, 約 22%的孕婦血 尿被誤認為是陰道出血, 應避免於第三孕期 (third trimester)進行經尿道膀胱腫瘤刮除手術 (TUR-BT)","D":"若影像檢查懷疑腎臟腫瘤, 應先進行腎臟切片再 進行後續治療, 並建議基因檢測是否有 familial renal neoplastic syndrome","E":"孕婦及非孕婦進行輸尿管鏡手術的併發症並無明 顯差異"},"answer":"C","reference":"(112) / 11.手術及併發 症/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition Ch 18 285-293 C: 即便是在第三孕期 進行 TUR-BT 目前也被認 為是相對安全的, 主要 還是應該得到病理組織 來取得後續治療計畫。","sourcePage":440},{"id":"11-100","category":"手術及併發症","categoryOrder":11,"number":100,"question":"關於泌尿道手術後相關併發症之敘述，何者為非？","options":{"A":"對於根治性前列腺切除術後漏尿，其影響的因子包 括：術後出血量 (Postoperative blood loss)、 肥胖、手術時間以及膀胱頸大小 (size of bladder neck)等","B":"腹腔鏡手術後發生的延遲性或未被識別的腸損傷 具有非典型表現，一般來說，患者可能不會有腹膜 (p. 炎、急性腹症或白細胞增多的表現；而典型症狀， 通常在術後 24 至 48 小時內才會出現 統計","C":"淋巴囊腫 (Lymphocele) 是執行骨盆腔淋巴清掃 相同 手術 (pelvic lymph node dissection)時最常見 的併發症，根據統計，當進行侷限性淋巴結清掃術 時，其發生率為 4.6%，而進行擴大性淋巴結清掃 術時，則可高達 10%","D":"直腸損傷是根治性前列腺切除術中最常見的腸道 併發症，而統計上，傳統開腹的前列腺切除術的直 腸損傷發生率 (incidence) 較機器人輔助前列腺 切除術高","E":"早 期 辨 識 出 輸 尿 管 損 傷 ， 對 於 後 遺 症 發 病 率 (morbidity) 有 很 大 影 響 ， 根 據 文 獻 ， 延 遲 (delayed) 辨識輸尿管損傷進而需要執行腎造口 術(nephrostomy) 的病患比例是早期辨識的 10 倍"},"answer":"D","reference":"(112) / 11.手術及併發 症/參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume I, Chapter 17 269-281) 上，兩者發生率是 的。","sourcePage":440},{"id":"11-101","category":"手術及併發症","categoryOrder":11,"number":101,"question":"以下關於人工陰莖的植入手術及併發症的敘述，何者正 (11 確? 症/","options":{"A":"關於 inflatable 人工陰莖 cylinder 的大小的選 自) 擇，一般選擇比實際陰莖量測長度長約 1 公分的大 Uro 小，而 reservoir 的放置一般位於 space of Retzius (A)","B":"手術感染的機率約 1-3%，建議術後使用抗生素 5-14 天，有助顯著減少術後感染之機率","C":"對於陰莖有感覺缺失，譬如 spinal cord injury (B) 的病人，應優先選擇 semirigid 的 implant 以減少 未來產生 cylinder erosion 的機會","D":"若在植入 inflatable 人工陰莖多年後發現，陰莖 (C) 根部皮膚鼓起，最常見原因是 cylinder 從 corporotomy 處所產生的 herniation","E":"膀胱或腸道的 reservoir erosion 是三件式 Cam inflatable 人工陰莖植入一個較少見的併發症，通 Uro 常是因為植入 reservoir 在過於受限的 p.1 perivesical space 造成，如果產生膀胱的 erosion，因為此傷口和尿液的接觸可當作無菌環 境，一般來說可只更換 reservoir 的部分即可，不 須移除整附人工陰莖"},"answer":"E","reference":"2) / 11.手術及併發 參考資料(摘錄 ：Campbell Walsh logy 12e, p.1586 Campbell Walsh Urology 12e, p.1592 Campbell Walsh Urology 12e, p.1594 Campbell Walsh Urology 12e, p.1593 pbell Walsh logy 12e, 594-1595","sourcePage":441},{"id":"11-102","category":"手術及併發症","categoryOrder":11,"number":102,"question":"關於手術相關併發症及處理，下列敘述何者有誤? (11 症/","options":{"A":"泌尿科腹腔鏡手術的併發症，其總發生率在 4% 內，而死亡率則是相對少見的，發生率為 0.03-0.08%","B":"經腹膜腹部手術 (Transperitoneal Abdominal Surgery) 的主要併發症中，最常見的為血管損傷 (2.8%) ，其次為鄰近器官的損傷 (Adjacent organ injury, 1.1%)","C":"Veress needle 若是意外進入腸道或膀胱時，只要 退針即可，無需進一步治療；而執行 Veress needle 前有使用鼻胃管或尿管做減壓的動作，可預防此併 發症的發生","D":"對於氣體栓塞 (gas embolism)的治療是立即排氣 (desufflation)，給予 100% 的 FiO2，並將患者置 於右側臥位 (right lateral position) 及頭低姿 態 (head-down position) 讓氣泡停留在右心避免 輸出 (outflow)","E":"直腸損傷是根治性前列腺切除術中最常見的腸道 併發症，而傳統開腹和機器人輔助之前列腺切除術 的直腸損傷發生率相同"},"answer":"D","reference":"2) / 11.手術及併發 參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume I, Chapter 14 (p.220-232) Chapter 17 (p.269-281) 應是左側臥位 left lateral decubitus (右 朝上)","sourcePage":441},{"id":"11-103","category":"手術及併發症","categoryOrder":11,"number":103,"question":"下列有關於泌尿科或是外科手術的基礎準則，何者敘述 有誤?","options":{"A":"腹腔鏡手術的禁忌症包括無法矯正的凝血功能異 常、明顯的腹壁感染、大量腹腔或後腹腔積血、廣 泛性腹膜炎和疑似惡性腫瘤腹水等","B":"當懷疑廣泛的腹腔粘連時，從 Palmer point （兩 側鎖骨中線的肋下處）是 Veress needle 入針的首 選位置。","C":"考慮到胎兒器官形成的完成和引產機會的減少，妊 娠中期 (second trimester) 是進行必要手術的首 選時間","D":"目前研究指出，術後加速康復(Enhanced Recovery After Surgery, ERAS) 能夠使住院時間縮短 30%， 併發症減少 50%，並降低了再入院率及醫療成本","E":"ERAS 的要素包括，從一般常規隔夜禁食改變為手術 前 6 小時避免固體食物及術前 2 小時飲用碳水化 合物飲料，尋求體液平衡 (fluid balance) 而不 是大量靜脈輸液、及早拔除引流管路及早期活動等"},"answer":"B","reference":"(112) / 11.手術及併發 症/參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume I, Chapter 14 (p.203-204) Palmer point 是指左側 鎖骨中線的肋下處","sourcePage":442},{"id":"11-104","category":"手術及併發症","categoryOrder":11,"number":104,"question":"70 歲女性接受過根除性膀胱切除及 ileal neobladder 重建手術，病理報告為 pT2N0 urothelial carcinoma， 無 carcinoma in situ。目前追蹤滿五年，腎功能及電 腦斷層正常，尿液培養無細菌，病人亦無尿液排空及尿 失禁問題。下列處置何者適當？","options":{"A":"不需再例行追蹤，有症狀再複診即可","B":"持續每年腹部電腦斷層及腎功能檢查，追蹤至術後 10 年","C":"每年膀胱內視鏡追蹤，檢查次發性惡性腫瘤 (secondary malignancy)之發生","D":"每年膀胱攝影(cystogram)和腎功能追蹤，以評估 是否有輸尿管逆流 (reflux)","E":"每一至二年腎臟超音波、血液生化檢查，以及 vitamin B12 濃度檢查"},"answer":"E","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： Campbell 12ed. Ch141 p. 3255","sourcePage":443},{"id":"11-105","category":"手術及併發症","categoryOrder":11,"number":105,"question":"以下有關尿道懸吊 mesh 手術相關的併發症，下列敘述 何者錯誤？","options":{"A":"有關於 mesh 相關併發症的名詞定義，exposure 表 示因為陰道上皮被分離或未癒合，使 mesh 能夠被 看見；extrusion 表示 mesh 逐漸穿出某個身體構 造；contraction 表示 mesh 的體積縮小","B":"比較 sling 置入時的 retropubic approach 和 trans-obturator approach，retropubic approach 有顯著較高的膀胱受傷機率，風險因子是 BMI 較 低，或是做過其他 incontinence surgery 的病人","C":"當 mesh 因為產生併發症而需要移除時，移除「足 夠」的 mesh 來消除併發症即可，不一定需要完整 移除全部的 mesh。","D":"以膀胱內視鏡檢查 mesh 暴露於膀胱內時，應將膀 胱灌注至鼓脹之狀態才能完整檢查","E":"放置 mesh 後導致的鼠蹊部疼痛，在 TVT (Tension Free Vaginal Tape) sling 較常發生，但通常都是 暫時性的，在幾週之後會緩解"},"answer":"E","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： Campbell 12ed. Ch126 p. 2877, 2878, 2881-2883","sourcePage":443},{"id":"11-106","category":"手術及併發症","categoryOrder":11,"number":106,"question":"有關膀胱癌手術進行 ileal conduit diversion，輸尿 管腸道吻合(ureteral-intestinal anastomosis)之併 發症，下列敘述何者錯誤？","options":{"A":"吻合處狹窄可能原因包括缺血、尿液滲漏、感染等","B":"若是非吻合處之狹窄，最常發生於左側輸尿管跨越 過 inferior mesenteric artery 的位置。","C":"吻合處狹窄為長期上泌尿道及腎功能惡化之主要 原因","D":"吻合處發生併發症機率最低的方式為 Wallace 吻 合法","E":"以 endourologic methods 來治療吻合處狹窄，左 側輸尿管之成功率較低"},"answer":"C","reference":"(112)/ 11.手術及併發 症/參考資料(摘錄自)： Campbell 12ed. Ch139 p. 3184, 3192, 3193","sourcePage":443},{"id":"11-107","category":"手術及併發症","categoryOrder":11,"number":107,"question":"關於佩尼羅氏病(Peyronie’s disease)之手術治療， 何者錯誤？","options":{"A":"Plication 手術包括 Nesbit procedure, Yachi procedure, 缺點是易造成陰莖長度變短","B":"保守治療無效即可考慮手術，唯須待陰莖變形已 穩定 6 個月後方能進行","C":"Plaque Incision or Partial Excision and Grafting 適合彎曲角度>60 度的病患","D":"病患接受 Grafting 手術前, 必須有足夠強度的勃 起硬度(Strong preoperative erection)","E":"Grafting 手術後, 必須衛教病患拉直陰莖及日間 服用 PDE 5 inhibitor"},"answer":"E","reference":"(112) )/ 11.手術及併 發症/參考資料(摘錄 自)： Campbell 12th ch.73 p1618-p1623","sourcePage":444},{"id":"11-108","category":"手術及併發症","categoryOrder":11,"number":108,"question":"關於尿道狹窄的手術治療，下列何者敘述是錯誤的?","options":{"A":"尿道擴張(Urethral dilation)是最古老最有效的 方法","B":"若要進行重建, 放置恥骨上造廔管(suprapubic tube)可幫助醫師找到狹窄的區域。","C":"尿道內切開術(Internal urethrotomy)最常見的併 發症是狹窄復發","D":"Ultrasonography 本身無法精確的測量 spongiofibrosis 的長度","E":"以上皆錯誤"},"answer":"A","reference":"(112) )/ 11.手術及併 發症/參考資料(摘錄 自)： Campbell 12th ch.82 (A)p1817 (B)p1829 (C)p1818 (D)p1815","sourcePage":444},{"id":"11-109","category":"手術及併發症","categoryOrder":11,"number":109,"question":"關於經皮腎臟造廔取石術 PCNL, 下列何者敘述錯誤？","options":{"A":"對於馬蹄腎(Horseshoe kidney)的病患, 從 lower pole 進入集尿系統最安全也方便","B":"對於鹿角結石的病患, 目標是結石完全清除, 因 為殘餘 Infected stone debris 可能導致石頭再生 (stone regrowth)","C":"經由腎盞穹窿穿刺可減少出血併發症","D":"若懷疑氣胸或血胸, C-arm 通常足以檢查出來","E":"以上皆錯誤"},"answer":"A","reference":"(112) )/ 11.手術及併 發症/參考資料(摘錄 自)： Campbell 12th ch.94","sourcePage":444},{"id":"11-110","category":"手術及併發症","categoryOrder":11,"number":110,"question":"port site hernia，這是一種特殊類型的疝氣，通常發 生在腹腔鏡手術的 trocar port 穿刺點，下列敘述何者 有誤？","options":{"A":"根據最近的回顧，port site hernia 的發生率範圍 從 0.3%到 5.4%。這表明 port site hernia 雖然是 一種罕見的併發症，但在不同研究中的發生率存在 一定的變化","B":"影響 port site hernia 發展的因素包括年紀較長、 先前有疝氣病史、手術時間和切口器械尺寸。相較 於 10 毫米的 trocars，12 毫米的 trocars 更容易 引起 port site hernia","C":"port site hernia 在術後平均出現的時間為 68 天","D":"單孔腹腔鏡手術（LESS）相較於一般腹腔鏡手術有 較高的切口疝氣的發生率","E":"對於較大的 fascia 缺陷，利用可吸收線和 fascia 縫合器進行八字型(figure-of-eight)縫合通常就 足夠了"},"answer":"C","reference":"(113) C, The mean time to presentation is 9.6 days 1：Campbell Urology 書 名或雜誌名 2: 12nd edition 3: Chapter 17th 4: Page 278","sourcePage":445},{"id":"11-111","category":"手術及併發症","categoryOrder":11,"number":111,"question":"針對預防手術後靜脈栓塞(venous thromboembolism)的 敘述，何者錯誤？","options":{"A":"目前最常使用的風險評估是經 American College of Chest Physicians 修訂的 Caprini score","B":"一般認為預防深層靜脈栓塞(Deep vein thrombosis)的時機，機械性方法(mechanical methods)要在正手術前開始使用，藥物則是術前 24 小時開始","C":"根據 Caprini score，沒有重大出血風險屬於 moderate risk group 的病人，可以使用低劑量未 分段肝素(low-dose unfractionated heparin)、 低分子量肝素(low-molecular-weight heparin)或 是間歇性氣動加壓(intermittent pneumatic compression)","D":"BMI 24，沒有任何其他疾病、藥物及家族史的 40 歲男性，接受左側輸尿管鏡碎石手術 (ureteroscopic lithotripsy)建議使用間歇性氣 動加壓","E":"45 歲男性患有右側腎盂泌尿上皮癌(≤cT1N0M0)，無 凝血功能障礙及任何藥物使用，接受腹腔鏡腎臟輸 尿管切除手術，建議出院後使用低分子量肝素"},"answer":"B","reference":"(113)/Campbell-Walsh Urology 12e P.278-280","sourcePage":445},{"id":"11-112","category":"手術及併發症","categoryOrder":11,"number":112,"question":"下列敘述何者錯誤","options":{"A":"做左腎切除時，若有明顯傷及胰臟，可在同次手術 中加上遠端胰臟切除(distal pancreatectomy)","B":"實行根除性攝護腺切除手術時，相較於傳統開腹手 術及機器手臂手術，腹腔鏡手術有較高的腸道損傷 比率，","C":"導氣針(Veress needle)若不慎扎入腸道，馬上移 除後不須特別修補","D":"使用不帶刀的 trocar (nonbladed trocar)有較高 的 incisional hernia 發生機率","E":"當腹腔鏡手術造成術後發生延遲的腸道損傷，抽血 檢查較常出現 leukopenia 而非 leukocytosis"},"answer":"D","reference":"(113) 1. Campbell-Walsh Urology 2. 12th ed 3. Chapter 17 4. P275-279","sourcePage":446},{"id":"11-113","category":"手術及併發症","categoryOrder":11,"number":113,"question":"下列哪個術中擺位姿勢不當所可能傷害的神經有誤?","options":{"A":"截石臥位 (lithotomy positions)–脛後神經 (posterior tibial nerve)","B":"截石臥位 (lithotomy positions)–腓神經 (peroneal nerve)","C":"伏臥位 (prone position)–脛前神經(Anterior tibial nerve)","D":"側臥位 (lateral position)–薦椎神經叢 (sacral plexus)","E":"仰臥位 (supine position)–坐骨神經 (sciatic nerve injury)"},"answer":"D","reference":"(113) 1. Campbell-Walsh Urology 2. 12th ed 3. Chapter 17 P261-262","sourcePage":446},{"id":"11-114","category":"手術及併發症","categoryOrder":11,"number":114,"question":"以下因素不會增加術後感染的機率？","options":{"A":"高齡","B":"抽煙","C":"慢性使用止痛藥","D":"遠處有感染部位","E":"長期住院"},"answer":"C","reference":"(113)/ Campbell Urology12ed. P175","sourcePage":446},{"id":"11-115","category":"手術及併發症","categoryOrder":11,"number":115,"question":"關於泌尿科手術導致腸道受傷下列敘述何者有誤?","options":{"A":"腸道受傷的症狀大多會在手術後的 24 小時內出現","B":"大部分延遲出現的腸道損傷,是由於過度和不當使 用電燒手術造成的熱性損傷所致","C":"使用單極電凝裝置時,如果功率設定在 60 瓦,持續 時間為 2 秒鐘,其熱量傳播範圍可以超過 20 毫米","D":"使用雙極電凝可以顯著降低熱量傳播範圍,因此應 該是首選的電凝止血術式","E":"大多數在手術過程中發現到的腸道表層燒傷可以 通過在受影響的腸道區域上進行 serosal 縫合來 修復"},"answer":"A","reference":"(113) A, Symptoms typically occur within 24 to 48 hours after surgery 1. ：Campbell Urology 書名或雜誌名 2. 12nd edition 3. Chapter 17th Page 276-277","sourcePage":446},{"id":"11-116","category":"手術及併發症","categoryOrder":11,"number":116,"question":"下列有關腎上腺腫瘤(adrenal tumor)切除手術的敘 述，何者錯誤？","options":{"A":"對於尺寸小於 4 公分且影像學標準低風險的病患追 蹤監測即可","B":"原發性高醛固酮症(primary aldosteronism)的病 人術後可能會發生低血鉀","C":"嗜鉻性細胞瘤(pheochromocytoma)的病人術後可 能會發生低血壓","D":"庫興氏症候群(Cushing syndrome)的病人術後可能 會發生低血糖","E":"大於 6 公分的腫瘤需積極切除，建議開放手術(open surgery)"},"answer":"D","reference":"(113)參考資料(摘錄 自)： Campbell-Walsh-Wein Urology, 12th Edition, 2021, Chapter 107, Box.107.7, Fig.107.3 Postoperative Complications of Adrenal Surgery Cushing syndrome 1.Inadequate steroid replacement leading to hypocorticism 2. Fracture secondary to osteoporosis 3. Hyperglycemia 4. Poor wound healing 5. Increased risk of infections","sourcePage":447},{"id":"11-117","category":"手術及併發症","categoryOrder":11,"number":117,"question":"以下對於泌尿道手術與尿液滲漏(urine leaks)的敘 述，請問何者正確？","options":{"A":"為了避免 urine leaks，在部分腎臟切除手術時， 腎集尿系統(Collecting system)應優先以不可吸 收縫線進行 watertight 縫合","B":"部分腎臟切除手術後，若發生 urine leaks 則應儘 早將輸尿管導管(ureteral stent)移除，避免影響 集尿管系統切口癒合","C":"臨床上具意義的尿液滲漏，在開放式根除性攝護腺 切除術(open radical prostatectomy)中通常表現 為腹膜內液體積聚，而在機器手臂輔助手術 (robotic prostatectomy)後則較可能表現為腹膜 外液體積聚","D":"部分腎臟切除手術中，與 urine leaks 相關的因子 包括腫瘤是否為內生性(endophytic)、溫缺血時間 (warm ischemia time)以及腫瘤是否位於腎門部位 (hilar location)","E":"膀胱尿道吻合處的尿液滲漏(Vesicourethral urine leakage)發生時，可以將導尿管接上的持續 低壓吸引系統，以確保最大程度地引流尿液，減少 經由吻合缺損處的滲漏"},"answer":"D","reference":"(114)Campbell-Walsh Urology, 12th Edition, Chapter 17, p.263 p.264 p.267 p.263 p.269","sourcePage":447},{"id":"11-118","category":"手術及併發症","categoryOrder":11,"number":118,"question":"關於恥骨後懸吊術（retropubic suspension）的併發 症，下列敘述何者錯誤？","options":{"A":"根據 meta-analysis，恥骨後懸吊術後需要輸血的 比率約為 0.3-0.8%","B":"Burch 手術後發生腸疝（enterocele）的機率約為 3-17%","C":"術前已有膀胱過動症的患者，術後持續有 urgency 症狀的機率約為 66%","D":"術後排尿困難的發生率約為 3-32%，主要原因是尿 道軸線的過度矯正 (overcorrection of the urethral axis)","E":"恥骨後懸吊術後發生症狀性骨盆腔器官脫垂需要 手術治療的比率小於 5%"},"answer":"A","reference":"(114) 1. Campbell Walsh Wein Urology, 12th Edition: Ch.123, p.2769-2771 A: 3-8%","sourcePage":448},{"id":"11-119","category":"手術及併發症","categoryOrder":11,"number":119,"question":"關於經皮腎臟碎石手術(PCNL)之併發症，下列敘述何者 錯誤？","options":{"A":"高達 7%的 PCNL 患者可能會發生重大併發症，而輕 微併發症發生率大約為 25%","B":"需要血管攝影栓塞治療的動靜脈瘻管或假性動脈 瘤發生率小於 1%","C":"術後發燒（>38.5°C）約發生在近四分之一的患者 中","D":"肋上穿刺造成氣胸或胸腔積液需要引流的風險在 歷史文獻中可高達 8%-18%","E":"年手術量超過 120 例的醫療中心具有最高的結石清 除率和最低的併發症發生率"},"answer":"D","reference":"(114) 1. Campbell Walsh Wein Urology, 12th Edition: Ch.94, p.2107 D: 1.8%-8%","sourcePage":448},{"id":"11-120","category":"手術及併發症","categoryOrder":11,"number":120,"question":"關於泌尿手術併發症的病理生理機制與處理策略，下列 ( 1 敘述何者錯誤？","options":{"A":"輸尿管陰道瘻管的診斷中，雙染料墊片試驗是膀胱 灌注甲基藍並口服 pyridium，若墊片出現藍色染色 表示輸尿管瘻管，橙色染色則表示膀胱陰道瘻管 A","B":"部分腎切除術後尿液滲漏的預測因子包括腫瘤內 生性生長、溫缺血時間延長及腎門部位置，其中腎 盂解剖變異和患者年齡與超過 30 天的 prolonged leak 顯著相關","C":"機器人部分腎切除術中可利用預置輸尿管導管逆 行灌注稀釋亞甲藍生理食鹽水來識別集尿系統破 口，並應在實質重建前以可吸收縫線進行 watertight 修補","D":"當尿液滲漏合併引流管虹吸效應時，除了停止負壓 吸引外，還可考慮 ureteroscopic caliceal fulguration 合併 fibrin sealant application 作 為新興治療選擇","E":"輸尿管熱損傷的機制包括 monopolar 和 bipolar sealing devices 造成的 pinpoint thermal injury，其中大部分可能無症狀，但可導致 delayed stricture formation 或 necrosis"},"answer":"A","reference":"114) . Campbell Walsh Wein Urology, 12th Edition: Ch.17, p.263-267 : 結果相反","sourcePage":449},{"id":"11-121","category":"手術及併發症","categoryOrder":11,"number":121,"question":"關於泌尿科手術的敘述，下列何者正確? (","options":{"A":"根據 Surgical Wound Classification，未感染的 傷口但有重大無菌技術破壞是屬於 Clean contaminated wound","B":"flat wire baskets 是使用軟式輸尿管鏡移除結石 時最安全的器械。當結石體積過大而無法安全取出 時，它們能夠可靠地釋放結石","C":"具親水性塗層的導線（hydrophilic-coated wires ）因過於滑順，容易從病人體內滑出，因此不適合 作為可靠的安全導線（safety wire）","D":"有心律調節器或植入式心律轉換除顫器的病人，在 進行可能使用雙極電燒的手術前，應諮詢裝置製造 商，以確保手術過程中不會產生干擾。有時可能需 要在手術期間暫時關閉這些裝置","E":"Ho:YAG laser 的波長為 1064 奈米，其在組織中 的穿透深度約為 1 公分"},"answer":"C","reference":"114) A: Campbell-Walsh Urology 12th ed. Chapter 8 p.128 -contaminated wound B: Campbell-Walsh Urology 12th ed. Chapter 13 p.198 - 三爪抓鉗（ three-pronged grasping forceps） C: Campbell-Walsh Urology 12th ed. Chapter 13 p.197 D: Campbell-Walsh Urology 12th ed. Chapter 15 p.236 - 單極電刀 E: Campbell-Walsh Urology 12th ed. Chapter 15 p.240 -Nd:YAG 雷射","sourcePage":449},{"id":"11-122","category":"手術及併發症","categoryOrder":11,"number":122,"question":"關於手術中病患體溫的描述，以下何者不正確？","options":{"A":"正常體溫(Normothermia)是指中心體溫介於 36°C 到 38°C","B":"低體溫(Hypothermia)會延長 2.6 天住院治療","C":"低體溫(每下降 1 度)會增加 16%的出血量及增加 22%輸血需求","D":"低體溫會損害免疫機制和血管擴張，導致局部組織 缺氧，增加傷口感染風險","E":"維持正常體溫的策略包括使用加溫毯、加溫靜脈輸 液、加溫沖洗液、在腹腔鏡使用加溫加濕的 CO 2 氣 體，以及升高手術室環境溫度"},"answer":"D","reference":"(114)參考資料 Campbell-Walsh-Wein Urology, 12th Edition, 2021, Chapter 10, p145-151 Hypothermia increases the risk of SSI by impairing immune mechanisms and vasoconstriction, resulting in regional tissue hypoxia.","sourcePage":450},{"id":"11-123","category":"手術及併發症","categoryOrder":11,"number":123,"question":"關於腎移植手術及其併發症，下列敘述何者錯誤？","options":{"A":"排尿功能障礙為常見的併發症。成因為膀胱過小、 既有的解剖障礙以及免疫抑制劑影響之間的交互 作用","B":"腎細胞癌的發生率比一般族群高，KDIGO 指引建議 要例行用腎臟篩檢","C":"淋巴囊腫的相關危險因子包括肥胖、受贈者年齡、 透析治療時間、急性排斥反應","D":"顯微血尿的鑑別診斷包含 BK virus 感染","E":"如果術前發現病人有明顯的攝護腺增大，應該在移 除尿管前給予 alpha-blocker 並積極治療便秘 題號 答案 考題"},"answer":"B","reference":"(114)第 12 版 Campbell, Chapter 88 (A) p1939 (B) p1941 Despite the high incidence of RCC, the Kidney Disease: Improving Global Outcomes (KDIGO) guidelines do not endorse screening of the native kidneys post transplantation because no evidence exists that the benefits of screening outweigh any potential harm. 不建議例行篩檢 (C) p1939 (D) p1936 (E) p1939 年度 類別 參考資料","sourcePage":450},{"id":"12-001","category":"外傷","categoryOrder":12,"number":1,"question":"腎臟外傷的評估及處置下列何者有誤?","options":{"A":"關於受傷機轉的了解相當重要，像是撞擊速度及 墜落高度等等，腎臟對於減速型損傷 (deceleration injury)尤為脆弱","B":"與腋後線(posterior axillary line)相比，腋前 線(anterior axillary line)的創傷更容易傷及 重要的腎臟結構，如腎門","C":"血尿程度不見得和受傷嚴重度相關聯，但血尿仍 算是泌尿系統受傷的良好指標，所有遭受鈍傷 (blunt trauma)且有顯微血尿(microhematuria) 的病人應接受進一步電腦斷層檢查","D":"當腎臟發生嚴重損傷時，依情況可以考慮以血管 栓塞(angioembolization)或腎臟探查(renal exploration)來治療，例如腎盂輸尿管接合處撕 裂傷(ureteropelvic junction avulsion)即為緊 急治療的絕對適應症","E":"同時評估是否併發其他腹內臟器受傷很重要，同 側肋骨骨折也會提高腎損傷的發生率"},"answer":"C","reference":"(110)/12.外傷/參考資 料(摘錄自)： Campbell-Walsh 12th edition, Chapter 90, p.1982-1992 (C) All patients with blunt trauma with microhematuria and hypotension (defined as a systolic pressure of less than 90 mm Hg at any time during evaluation and resuscitation)","sourcePage":451},{"id":"12-002","category":"外傷","categoryOrder":12,"number":2,"question":"關於膀胱損傷的診斷及處置，下列何者有誤?","options":{"A":"明顯血尿的骨盆腔骨折患者做膀胱造影 (Cystography)是合理的","B":"若尿道口有血性分泌物(bloody discharge)或因 為血塊阻塞尿道導致尿管放置困難，可改採取順 行性膀胱攝影","C":"施行經恥骨後間隙尿道吊帶術(retropubic sub-urethral sling procedures)時，若懷疑膀 胱損傷，應施行膀胱鏡檢查","D":"膀胱損傷若傷及膀胱頸(bladder neck)，應立即 手術修補","E":"近一半的膀胱損傷是醫源性的"},"answer":"B","reference":"(110)/12.外傷/參考資 料(摘錄自)： Campbell-Walsh 12th edition, Chapter 133, p.3054-3057 (B) 順行性的膀胱攝影 不足以診斷膀胱損傷; 此外，若尿道口有血性分 泌物(bloody discharge) 或因為血塊阻塞尿道導 致尿管放置困難，應懷疑 合併尿道損傷而改做 retrograde urethrography","sourcePage":451},{"id":"12-003","category":"外傷","categoryOrder":12,"number":3,"question":"關於尿道損傷（Urethral Injuries）, 以下敘述何者 為非?","options":{"A":"82% 的骨盆骨折和尿道損傷男性患者出現某種程 度的性功能障礙","B":"尿道損傷後性功能障礙，可能因神經損傷、動脈 供血不足（arterial insufficiency）、靜脈漏 （venous leak）等等","C":"因尿道損傷接受後尿道成形(posterior urethroplasty)術後，約 5% 到 15% 的患者在吻 合口處復發性狹窄","D":"後尿道成形術後吻合口處如復發性狹窄，以內視 鏡（例如：DVIU, direct-vision internal urethrotomy）治療效果良好","E":"尿道損傷經重建手術後發生的尿失禁比率大約 40%"},"answer":"E","reference":"(110)/12.外傷/參考資 料(摘錄自)： Campbell-Walsh Urology, 11th ed ch 101, p2391","sourcePage":451},{"id":"12-004","category":"外傷","categoryOrder":12,"number":4,"question":"下列何者不是腎臟受傷之後的晚期併發症( ( Late 料 ？ Complications) C","options":{"A":"高血鉀症","B":"腎水腫(hydronephrosis)","C":"高血壓","D":"動靜脈廔管(Arteriovenous fistula)","E":"結石"},"answer":"A","reference":"110)/12.外傷/參考資 (摘錄自)：Smith 18t, h 18, p. 287","sourcePage":452},{"id":"12-005","category":"外傷","categoryOrder":12,"number":5,"question":"關於腎臟創傷後造成的併發症(complication)，何者 料 有誤? C","options":{"A":"受傷後的尿液滲漏(urinary extravasation)大多 e 數會自我緩解；若持續滲漏，可先考慮放置輸尿 p 管支架(ureteral stent)治療，甚至輔以經皮腎 造口引流術(percutaneous nephrostomy)或經皮 ( 尿液囊腫引流術(percutaneous urinoma drain) a a","B":"腎周膿瘍(Perinephric abscess)是腎臟創傷後常 p 見的併發症，可能與部分腎臟缺血(partial renal e ischemia)有關 u","C":"創傷後高血壓(arterial hypertension)大部分會 p 在受傷後期出現(later postinjury period)，機 轉可能是部分腎臟缺血(partial renal ischemia)進而活化腎素-血管收縮素系統 (renin-angiotensin axis)","D":"遲發性出血(delay renal bleeding)大多數在受 傷後三周內出現，初步治療以 bed rest 為主，嚴 重者可考慮血管栓塞(angioembolization)","E":"腎臟創傷後可能伴隨腎功能下降"},"answer":"B","reference":"(110)/12.外傷/參考資 (摘錄自)： ampbell-Walsh 12th dition, Chapter 90, .1982-1992 B) Perinephric bscess rarely occurs fter renal injury; ersistent urinary xtravasation and rinoma are the typical recursors.","sourcePage":452},{"id":"12-006","category":"外傷","categoryOrder":12,"number":6,"question":"關於輸尿管外傷的治療，下列敘述何者正確 ?","options":{"A":"最常在手術中傷到輸尿管的手術為大腸直腸外科 的手術","B":"Open surgery 導致的外傷，至少 1/3 都可以在當 下被發現，並且立即修補後都有不錯的預後","C":"CT urography without delay image 對於偵測輸 尿管損傷是最好的工具","D":"輸尿管直接接合(End-to-end ureteroureterostomy)為最常見下段輸尿管的重 接合手術","E":"大部分可直接 primary repair 就好不需放置 double J stenting"},"answer":"B","reference":"(110)/12.外傷/參考資 料(摘錄自)： Campbell-Walsh 12th edition, Chapter 90, p.1992-1996 (A)OBSGYN (C) CT urography with delay image (D)中上段輸尿管","sourcePage":453},{"id":"12-007","category":"外傷","categoryOrder":12,"number":7,"question":"有關外陰部外傷,以下何者為非？","options":{"A":"陰莖外傷修補手術比保守治療有更快的恢復期, 並有較低的陰莖彎曲後遺症(penile curvature)","B":"陰莖外傷修補手術可以容許 7 天內的延遲 (surgical delay up to 7 days),並不會引響修 補的結果","C":"Penile fracture 保守治療而有陰莖彎曲後遺症 (penile curvature)之機率小於 10%","D":"即使沒有 testicular rupture, 嚴重的 intratesticular hematoma 還是要手術探查清 除,以避免高壓造成的睪丸壞死","E":"陰囊穿刺傷建議要手術探查"},"answer":"C","reference":"(110)/12.外傷/參考資 料(摘錄自)：Campbell 12 版, P.3048-3053","sourcePage":453},{"id":"12-008","category":"外傷","categoryOrder":12,"number":8,"question":"下列何者並非膀胱手術修補之絕對適應症?","options":{"A":"腹膜外膀胱損傷併膀胱頸損傷","B":"腹膜內膀胱損傷","C":"腹膜外膀胱損傷且放置導尿管 2 週後仍癒合不良","D":"合併開放性骨盆腔骨折之腹膜外膀胱損傷","E":"腹膜外膀胱損傷併嚴重血尿及血塊阻塞"},"answer":"C","reference":"(110)/12.外傷/參考資 料(摘錄自)：Campbell 12th Chapter 133,p3056 (C) 不一定需要手術修 補","sourcePage":453},{"id":"12-009","category":"外傷","categoryOrder":12,"number":9,"question":"關於男性陰莖骨折(Penile fracture)的敘述何者錯 誤?","options":{"A":"病史詢問及理學檢查對於陰莖骨折(penile fracture)的診斷是可靠的","B":"若陰莖被人咬傷，給予沖洗及清創後可直接初級 縫合(primary suture)，被動物咬傷則不應立即 做初級縫合","C":"若陰莖骨折患者有血液自尿道分泌(bloody urethral discharge)，應考慮逆行尿道造影 (retrograde urethrography)或膀胱鏡 (cystoscopy)檢查評估尿道損傷並在手術探查 (surgical exploration)前確定損傷的性質和位 置","D":"大多數陰莖骨折發生在腹側(ventral) 或外側 (lateral)","E":"如果 Buck’s fascia 完整，就可能有典型的茄子 狀變形 (eggplant deformity)"},"answer":"B","reference":"(110)/12.外傷/參考資 料(摘錄自)： Campbell-Walsh 12th edition, Chapter 133, p.3048-3051 (B)不可 primary suture","sourcePage":453},{"id":"12-010","category":"外傷","categoryOrder":12,"number":10,"question":"關於尿道損傷的敘述,何者為非?","options":{"A":"未成年女孩發生尿道損傷之機率比成年女性來得 高","B":"男性後段尿道損傷在進行手術修補後，尿失禁發 生率低於 4%，但約 5-15%會反覆尿道狹窄","C":"男性病患因車禍跌坐至地上，尿道口有血尿滲 出，建議可安排逆行性尿道攝影評估是否有尿道 損傷","D":"男性被診斷為後段尿道損傷，建議先放置經 皮膀胱造廔管作為膀胱尿液引流，待二至三個月 後再做尿道修補手術","E":"尿道損傷修補手術之術前評估，利用超音波診斷 尿道狹窄，其準確性比逆行性尿道攝影差"},"answer":"E","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：Campbell 12th Chapter 133,p3056-3059 (E) 超音波準確率較高","sourcePage":454},{"id":"12-011","category":"外傷","categoryOrder":12,"number":11,"question":"以下對於腎臟損傷的敘述何者為非?","options":{"A":"急診 12 歲小朋友因車禍受傷，驗小便後看到有顯 微性下的血尿（microscopic hematuria）時，建 議安排電腦斷層確認是否有腎臟損傷","B":"當病人疑似腎臟出血但病況不穩定無法安排電腦 斷層時，會安排 one shot IVP。做法是在注射顯 影劑 IV push（2 mL/Kg）後五分鐘立刻照一張腹 部 X 光確認是否有腎臟損傷","C":"若腎臟損傷達到 AAST grade IV 時，也可以不需 動手術，經由小心照護而康復","D":"當病人電腦斷層發現腎臟周圍有 4cm 腫塊且有看 到顯影劑滲漏時代表可能有腎臟的嚴重損傷，要 排除是否有急速的腎臟出血","E":"若腎臟出血嚴重到需要手術介入時，最好的手術 方式為經腹探查（transabdominal approach）"},"answer":"B","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：Campbell 12th Chapter 90,p1984-1992 (B)注射顯影劑後 10 分鐘 照 X 光。","sourcePage":454},{"id":"12-012","category":"外傷","categoryOrder":12,"number":12,"question":"關於輸尿管損傷的敘述，以下何者為非？","options":{"A":"最常見的醫源性輸尿管損傷為婦產科的骨盆手術 如卵巢腫瘤移除（54%），其次是大腸直腸手術 （14%）","B":"術中腹腔血管繞道手術（如 aortoiliac and aortofemeral bypass surgery )後發生腎積水的 機率約為 12%~20%，但預後通常良好","C":"輸尿管損傷不一定會有血尿，甚至約 25%~45%的病 人在遭受外傷後，會連顯微鏡下血尿都沒呈現","D":"當外傷造成的輸尿管損傷，在緊急狀況下依傷口 位置來判定輸尿管受傷的部位，其敏感度 （sensitivity）約 75%","E":"輸尿管鏡檢查時可能會發生輸尿管穿孔，藉由置 放輸尿管支架來治療，通常沒有後續併發症"},"answer":"A","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：Campbell 12th Chapter 90,p1992-2002 (A)最常見為子宮切除手 術。","sourcePage":455},{"id":"12-013","category":"外傷","categoryOrder":12,"number":13,"question":"下列有關陰莖外傷之敘述何者錯誤?","options":{"A":"美國泌尿科學會(AUA) guidelines 建議在超音波 檢查結果不明確的情況下使用 MRI 檢查陰莖骨折。","B":"可用 2-0 可吸收縫線修復受損白膜(tunica albuginea)、4-0 可吸收縫線修復尿道(urethra)。","C":"可用 11-0 nylon 修復動脈(dorsal artery)、9-0 nylon 修復靜脈(dorsal vein)、10-0 nylon 修復 神經(dorsal nerve)","D":"由於顯微手術的進步，超過 50%的陰莖外傷患者術 後能夠重拾勃起功能","E":"承(D)約 20%的患者術後能夠恢復正常感覺"},"answer":"E","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：第 12 版 Campbell Chapter 133 ( A ) page 3049 (B) page 3051 (C) page 3051 (D) page 3050 (E) page 3050","sourcePage":455},{"id":"12-014","category":"外傷","categoryOrder":12,"number":14,"question":"下列有關腎臟外傷之敘述何者錯誤?","options":{"A":"腹部鈍性損傷後兒童腎臟損傷的風險比成年人高 50%","B":"動靜脈電腦斷層掃描 (arteriovenous CT)，通常 在打顯影劑(contrast)後 80 秒，是檢測腎臟動脈 損傷的絕佳時機","C":"於注射顯影劑後 10-15 分鐘之延遲掃描(delayed scanning)，能看出腎臟實質撕裂和尿外滲 (parenchymal lacerations and urinary extravasation)","D":"符合以下其中一項的病患可能為嚴重腎臟外傷： 血腫(hematoma)大於 3.5 cm、內側腎裂傷(medial renal laceration)、顯影劑外滲(contrast extravasation)","E":"靜脈注射腎盂檢查(IVP)是一項快速的診斷工 具，只需要打顯影劑 2 mL/kg 後 10 分鐘拍攝一張 照片"},"answer":"D","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：第 12 版 Campbell Chapter 90 (A)page 1984 (B)page 1985 (C)page 1985 (D)page 1985 (E)page 1985","sourcePage":455},{"id":"12-015","category":"外傷","categoryOrder":12,"number":15,"question":"下列有關輸尿管外傷之敘述何者錯誤?","options":{"A":"輸尿管損傷的總體發生率在 0.5-10%","B":"輸尿管損傷常與分離沾黏(lysis of adhesion)有 關","C":"一項研究顯示，醫源性輸尿管損傷中，子宮切除 術(hysterectomy)佔 54%、結直腸手術 (colorectal surgery)佔 14%、卵巢腫瘤(ovarian tumor)切除術佔 8%","D":"重複剖腹產(cesarean section)也可能導致很大 比例的輸尿管損傷，一項研究顯示高達 23%","E":"腎水腫(hydronephrosis)常見於主髂動脈和主股 動脈繞道手術(aortoiliac and aortofemoral bypass surgery)佔 12-20%"},"answer":"B","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：第 12 版 Campbell Chapter 90 (A)page 1993 (B)page 1993 (C)page 1993 (D)page 1993 (E)page 1993","sourcePage":456},{"id":"12-016","category":"外傷","categoryOrder":12,"number":16,"question":"下列有關泌尿系統外傷之敘述何者錯誤?","options":{"A":"選擇性血管栓塞術(selective angioembolization, SAE)是一種有用的替代腎切 除術(nephrectomy)之方法。目前，沒有一個絕對 標準來預測 SAE 療效","B":"肉眼可見之血尿、血流動力學不穩定、第五級創 傷和尿液外滲是 SAE 失敗的重要預測因子","C":"在 Multi-Institutional Genito-Urinary Trauma Study (MiGUTS)的研究顯示，導管引流和手術修 復在初步治療腹膜外膀胱損傷(extraperitoneal bladder injuries)之併發症有顯著差異","D":"承(C)選項之研究，重要的預測併發症之因素是伴 隨尿道或膀胱頸(urethral or bladder neck)損 傷","E":"子宮切除術(hysterectomy)中的膀胱和輸尿管 (bladder and ureter)損傷越來越少見，低於歷 史發生率"},"answer":"C","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：(A)、(B) Eur Urol Focus. 2021 Jan 25;S2405-4569 (21) 00009-2. (C)、(D) J Urol. 2020 Sep; 204(3): 538-544. (E) World J Urol. 2020 Aug; 38(8): 2049-2054.","sourcePage":456},{"id":"12-017","category":"外傷","categoryOrder":12,"number":17,"question":"有關腎臟外傷,以下何者為非？","options":{"A":"腎臟外傷程度與血尿嚴重度不一定相關","B":"腎臟實質外傷合併集尿系統損傷在 American Association for the surgery of trauma organ injury severity scale for the kidney 屬於 Grade III","C":"顯微血尿且無休克病患可以不做影像學檢查並觀 察","D":"如經復甦急救後,生命徵象仍不穩定的腎臟外傷 病患,建議即刻手術或血管栓塞處置","E":"腎臟外傷合併尿液滲漏通常可以保守治療並自行 恢復"},"answer":"B","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：Campbell 12 版, P.1983-1992","sourcePage":457},{"id":"12-018","category":"外傷","categoryOrder":12,"number":18,"question":"有關輸尿管外傷,以下何者為非？","options":{"A":"如有懷疑,可作 CT urogram 或 retrograde ureterogram","B":"Delayed diagnosed injury 如 retrograde stenting 無法完成,建議先放 nephrostomy tube","C":"Low third ureteral injury 可考慮 reimplantation 或 Psoas hitch","D":"Upper or middle third ureteral injury 可考慮 direct ureteroureterostomy 或 transureteroureterostomy","E":"輸尿管<50% transection 在 American Association for the surgery of trauma organ injury severity scale for the ureter 屬於 Grade III"},"answer":"E","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：Campbell 12 版, P.1992-2002","sourcePage":457},{"id":"12-019","category":"外傷","categoryOrder":12,"number":19,"question":"有關膀胱外傷,以下何者為非？","options":{"A":"膀胱損傷常合併骨盆骨折,但僅約 10%的骨盆骨折 會合併膀胱損傷","B":"Intraperitoneal bladder injury 需要急診手術 處理","C":"如有 bladder neck injury 可以先觀察,保守治療","D":"膀胱外傷合併直腸或陰道外傷應急診手術處理","E":"斷層掃描如見 intraperitoneal fluid 應要考慮 膀胱損傷"},"answer":"C","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：Campbell 12 版, P.3055-3061","sourcePage":457},{"id":"12-020","category":"外傷","categoryOrder":12,"number":20,"question":"有關尿道外傷,以下何者為非？","options":{"A":"骨盆骨折合併尿道損傷建議做恥骨上膀胱造瘻 (suprapubic catheter drainage)","B":"穩定之病患可做 primary alignment","C":"Straddle fractures 在男性較多,約占 pelvic fracture 的 10%","D":"在有 pelvic fracture 時,大於 17 歲女性比小於 17 歲者更容易有尿道損傷","E":"Anastomotic urethroplasty 適合用在 Straddle injury 造成的 anterior urethral stricture"},"answer":"D","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：Campbell 12 版, P. 3055-3061","sourcePage":458},{"id":"12-021","category":"外傷","categoryOrder":12,"number":21,"question":"在急診室看到的所有外傷中，約有百分之多少與泌尿 生殖系統有關。","options":{"A":"1%","B":"5%","C":"10%","D":"20%","E":"25%"},"answer":"C","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：Smith 18th Ch 18, p. 280","sourcePage":458},{"id":"12-022","category":"外傷","categoryOrder":12,"number":22,"question":"關於腎臟外傷，以下何者為非？","options":{"A":"腎臟外傷的出血在 80-85% 的病例中會自然停止","B":"腎臟外傷造成血尿嚴重的程度和腎臟受傷嚴重程 度不一定成正相關","C":"腹部、腰、或背部直接鈍性創傷是腎臟外傷最常 見的機制，佔所有的 80-85%","D":"超音波是檢測和分期腎臟和腹膜後 （retroperitoneal）損傷的最佳影像學工具 （imaging study）","E":"腹膜後血腫消退可能會引起輕微發燒（大約 38.3 度），但發燒超過這個溫度可能代表有感染"},"answer":"D","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：Smith 18t, Ch 18, p. 280","sourcePage":458},{"id":"12-023","category":"外傷","categoryOrder":12,"number":23,"question":"關於膀胱破裂（bladder rupture），以下何者為非？","options":{"A":"在大約 20%的病例中，膀胱破裂可能與後尿道 （posterior urethral injuries）損傷有關","B":"當膀胱充滿到接近容量時，直接撞擊下腹部可能 會導致膀胱破裂","C":"當骨盆因鈍器外傷骨折時，骨折碎片刺穿膀胱之 損傷，主要是腹膜內破裂（intraperitoneal rupture）","D":"發生膀胱腹膜內破裂（intraperitoneal rupture），如果尿液有感染，會發生腹膜炎和急 腹症（acute abdomen）","E":"膀胱破裂患者直腸檢查時，由於盆腔血腫較大， 地標（Landmark）可能模糊不清"},"answer":"C","reference":"(110)/ 12.外傷/參考資 料(摘錄自)：Smith 18t, Ch 18, p. 290 Campbell-Walsh Urology, 11th ed ch 101, p2392","sourcePage":458},{"id":"12-024","category":"外傷","categoryOrder":12,"number":24,"question":"關於腎臟外傷的敘述，以下何者正確","options":{"A":"當發現患者有血，尤其合併加速/減速傷害或是穿 刺傷害時，便要考慮有無 collecting system 受 損的可能，且血尿的嚴重程度和腎臟損傷的程度 呈現正相關","B":"腎臟容易在高速加速傷害下受到嚴重損傷，高速 加速傷害容易造成 renal hilum 或是 ureteropelvic junction 的傷害，進一步導致 renal artery thrombosis 或是 ureteropelvic disruption 等傷害","C":"當發生腹腔的穿刺傷害時，容易造成腎臟穿刺損 傷，有高達 80%以上的患者會於腹腔穿刺傷時合併 腎臟穿刺傷害","D":"與鈍器撞擊傷害相比，儘管腎臟的穿刺傷害會造 成較顯著的失血量與較高的手術機率，但會因此 需要實施 Nephrectomy 的機率卻沒有顯著上升","E":"從腋前線造成的刀械穿刺傷較容易造成腎血管或 腎門的損傷，相較之下，腋後線的穿刺傷較容易 造成單純的腎實質損傷"},"answer":"E","reference":"(111) 參考資料(摘錄自)： th Campbell Urology 12 ; P.1982-1983","sourcePage":459},{"id":"12-025","category":"外傷","categoryOrder":12,"number":25,"question":"關於輸尿管外傷的敘述，以下何者錯誤?","options":{"A":"與傳統開腹手術相比，腹腔鏡或機器人手術是否 伴隨著更高比率的輸尿管損傷仍有爭議，然而， 腹腔鏡或機器人手術在手術當下即發現輸尿管損 傷的比率較低，因此，術者仍應小心此併發症","B":"輸尿管鏡手術亦有可能造成輸尿管損傷，其危險 因子包含：肥胖、抽菸、結石的成分、曾接受過 腹腔或後腹腔手術","C":"若輸尿管損傷在一周內發現，則可以考慮立即修 補(immediate repair)，若超過一周之後才發現， 則可以選擇於傷害造成的六周之後再行延後修補 (delay repair)","D":"針對下段的輸尿管損傷，可以考慮的術式包含 Ureteroneocystostomy, Psoas bladder hitch, Boari flap","E":"懷疑有輸尿管損傷時，可以考慮執行的檢查包含 CT urography, Retrograde ureterography，其 中，執行 CT 時必須等大約 10 分鐘讓顯影劑流進 collecting system"},"answer":"B","reference":"(111) 參考資料(摘錄自)： th Campbell Urology 12 ; P.1992-1996","sourcePage":459},{"id":"12-026","category":"外傷","categoryOrder":12,"number":26,"question":"關於 Penile fracture 的敘述，何者正確?","options":{"A":"Tunica albuginea 是一個內縱外環(inner longitudinal, outer circular)的雙層組織，當 勃起的陰莖遭受外力彎折時，容易在 proximal shaft 形成 transverse laceration","B":"雖然 Penile fracture 可能會發生在 penile shaft 的任何地方，但最常發生在 suspensory ligament 的遠端，也經常發生在陰莖的背側，因 為那是 tunica albuginea 最薄的地方","C":"當 Penile fracture 發生時，若伴隨 Buck’s fascia 破裂，血液會滯留在 skin 和 tunica 中間， 形成典型的 eggplant deformity","D":"當 Penile fracture 發生時，Urethral injury 常合併發生，此時為避免進一步尿道損傷，要先 執行 urethrography，不可用膀胱鏡檢查作為代替","E":"對於診斷 Penile fracture，MRI 是一個非侵入性 且準確的檢查可以去偵測 tunica albuginea disruption，但由於 MRI 非常昂貴而且費時，目 前建議用在 ultrasound 檢查 equivocal 的患者"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell Urology 12th; P.3048-3050","sourcePage":460},{"id":"12-027","category":"外傷","categoryOrder":12,"number":27,"question":"以下何者不是腎臟外傷之手術探查(surgical exploration)的絕對適應症？","options":{"A":"Urinary extravasation from parenchymal injury","B":"Hemodynamic instability with no response to resuscitation","C":"Pulsatile renal hematoma","D":"Renal vascular pedicle avulsion","E":"Ureteropelvic junction avulsion"},"answer":"A","reference":"(111) 參考資料(摘錄自)： th Campbell Urology 12 ; P.1988","sourcePage":460},{"id":"12-028","category":"外傷","categoryOrder":12,"number":28,"question":"關於尿道損傷的治療，何者錯誤?","options":{"A":"由於 Posterior urethral injuries 經常合併 pelvic fracture，在治療此類患者時，根據 AUA urotrauma guidelines，當骨科醫師計畫在患者 腹側進行外固定時，應避免放置 suprapubic cystostomy 以減少感染","B":"對於病情穩定的患者，處理 posterior urethral injuries 的原則是 primary realignment 和 delayed reconstruction","C":"Posterior urethral injuries 經常伴隨 erectile dysfunction 的後遺症，其中的原因包含 cavernous nerve injury, arterial insufficiency, venous leak 和 direct corporal injury","D":"Anterior urethral injuries 造成的 urethral stricture 不建議使用 endoscopic incision，因 其治療的復發率非常高","E":"對於 Anterior urethral injuries 的患者在進行 手術治療之前，應針對 urethral stricture 進行 詳細檢查，其中，urethral ultrasound 甚至可能 比 retrograde urethrography 來更準確"},"answer":"A","reference":"(111) 參考資料(摘錄自)： th Campbell Urology 12 ; P.3057-3061","sourcePage":460},{"id":"12-029","category":"外傷","categoryOrder":12,"number":29,"question":"下列關於腎臟損傷的敘述何者錯誤？","options":{"A":"小兒腎臟損傷只要尿液檢查鏡檢下紅血球多於五 顆（RBC greater than 5 RBCs/HPF），就會建議 做進一步的腎臟影像檢查，比方說腹部骨盆腔電 腦斷層檢查","B":"只要透過仔細的分級以及病人篩選，即便是 gradeV 的腎臟損傷，也不一定要開刀處理","C":"對於成人腎臟損傷，超音波評估具有立即性以及 高度的特異性（specificity）","D":"對於 gradeI-III 的非複雜性腎臟損傷病人而言， 並不需要規則性的追蹤電腦斷層","E":"腎臟損傷若合併有直腸損傷，在腸損傷修補完畢 後，相對於手術處理腎臟，密切觀察腎損傷的狀 態也是可以接受的選擇"},"answer":"C","reference":"(111) （Ａ）Campbell 12th edition, p1984. Indications for renal imaging: 5. All pediatric patients with greater than 5 RBCs/HPF. The preferred imaging test is an abdominal/pelvic CT using IV contrast with immediate and delayed images. （Ｂ）Campbell 12th edition, p1986. Most experts agree that patients with grades IV and V injuries more often require surgical exploration, but even these high-grade injuries can be managed without renal operation if carefully staged and selected. （Ｃ）Campbell 12th edition, p1986. Sonography is typically used in the immediate evaluation of abdominal injuries, but has poor specificity in the adult renal patient for renal injury. （Ｄ）Campbell 12th edition, p1987. Routine follow-up CT imaging is not needed for uncomplicated Grade I-III injuries. （Ｅ）Campbell 12th edition, p1988. Operative Management: Relative indications are (2) renal injury together with colon/pancreatic injury(these patients have a higher complication rate if their renal injury is not repaired at the time of colon/pancreatic injury, but the renal injury may be closely observed after repair of the enteric injury)","sourcePage":461},{"id":"12-030","category":"外傷","categoryOrder":12,"number":30,"question":"關於陰莖骨折的評估及處置，何者正確？","options":{"A":"陰莖骨折指的是白膜破裂，而白膜內縱外環為雙 層構造，主要由 collagen 以及 elastin 構成","B":"中東地區常見的陰莖骨折原因為自我傷害的行為","C":"若問診後高度懷疑陰莖骨折，建議安排進一步影 像檢查以確立診斷","D":"若臨床問診及超音波皆無法明確判斷是否為陰莖 骨折，則建議做電腦斷層以幫助診斷","E":"雖然手術相對於保守治療有較好的預後，但陰莖 骨折手術最遲可以延後兩週再執行而不會影響預 後"},"answer":"B","reference":"(111) （Ａ）Campbell 12th edition, p3048. Penile fracture is the disruption of the tunica albuginea with ruptu
