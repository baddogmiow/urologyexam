可能性。請問以 1. 下對於 ROSI 的敘述，何者錯誤?","options":{"A":"Microfluidics 及 single-cell sequencing 是分 離、取得及處理 round spermatid 重要的技術","B":"過去無精症患者，接受顯微取精 microdissection testicular sperm extraction (micro-TESE) 得到 成熟的精子機率大約 40% 到 60%","C":"非阻塞性無精症患者，接受 micro-TESE 若沒有發現 正常精子，約 10%的病人可在術中 找到 round spermatids","D":"根據目前提出的研究報告，ROSI 懷孕及產出的小 孩，並沒有較高的先天異常機率","E":"根據 2021 年一篇統整了近三十年文獻的 2. meta-analysis， ROSI 的 pregnancy rate 以及 delivery rate 皆在 5%以下，遠低於正常精子人工受 孕結果"},"answer":"C","reference":"0)/7.男性學(含生殖)/ 資料(摘錄自)： Round spermatid injection into human oocytes: a systematic review and meta-analysis Brent M Hanson et. al. Asian Journal of Andrology (2021) 23, 1–7; doi: 10.4103/aja.aja_85_2 0; published online: 09 February 2021 Round Spermatid Injection Kelli X. Gross, MD et. al. Urol Clin N Am 47 (2020) 175–183 https://doi.org/10.1 016/j.ucl.2019.12.00 4","sourcePage":269},{"id":"7-037","category":"男性學(含生殖)","categoryOrder":7,"number":37,"question":"請問下列關於性功能相關的描述何者正確? (11","options":{"A":"在達文西攝護腺根除手術時，如果能保留 internal 參考 pudendal arteries，術後性功能的恢復速度較快 Cam","B":"Corpus spongiosum 受 ischiocavernosus, ch6 bulbocavernosus muscle 壓迫，在勃起時，動脈血 68. 流由 Bulbar and spongiosal arteries 及 Dorsal 4)p artery 供應，而靜脈回流則沒有阻力","C":"下視丘中的 Nucleus paragigantocellularis，藉 oxytocin neurons 經由 lumbosacral spinal autonomic and somatic efferents 傳遞訊號，促進 陰莖勃起","D":"Pudendal nerve 藉由 Low-intensity continuous 造 成陰莖勃起及膀胱頸關閉，而藉由 High-intensity continuous 完成射精","E":"腦中調控高潮的區域中，primary area 包含 Mesodiencephalic transition zone，secondary area 包含 Brodmann areas 7/40, 18, 21, 23, and 47，而 Amygdala 則會抑制高潮"},"answer":"E","reference":"0)/7.男性學(含生殖)/ 資料(摘錄自)： pbell 12th edition, 8, p1487, p1490(table 2),p1491(tab68.3,68. 1493(table 68.8)","sourcePage":269},{"id":"7-038","category":"男性學(含生殖)","categoryOrder":7,"number":38,"question":"請問下列生殖相關疾病的描述，何者正確?","options":{"A":"若在顯微鏡下看不到成熟精子，但有造經時期的產 物，稱為 maturation arrest. 若發育的過程停在 meiosis phase I, 此病人的情況屬於 early maturation arrest","B":"Kallmann syndrome 病人如果 prolactin 上升範圍介 於 20 to 50 µg/L 不需要特別治療，若上升明顯且 有 MRI 異常發現，但不需手術時，只需給予 bromocriptine 或 cabergoline 治療，其中 cabergoline 副作用較少","C":"目前研究已知約 30% 的 Kallmann syndrome 與 KAL1 gene 或是 GNRHR gene 異常有關，KAL1 gene 製造 anosmin-1 影響胚胎神經發育，而 GNRHR gene，製造 gonadotropin-releasing hormone (GnRH) receptor, PIT1, PROP1,等其他產物","D":"Prader-Willi syndrome 會有暴食、肥胖、睪丸小及 認知障礙等問題，疾病基因是位在 chromosome 15q11-q13，在健康者的 maternal chromosome 不活 化而 paternal chromosome 活化; 而在 Prader-Willi syndrome 患者, maternal genes 活 化而 paternal ones 不活化","E":"Disorders of sex development (DSD) 可分成五類， 其中 46,XX DSD (female pseudohermaphroditism) 為第三類，根據基因分析結果與 SF1 mutation 有關"},"answer":"B","reference":"(110)/7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell 12th edition, ch66, p1449","sourcePage":270},{"id":"7-039","category":"男性學(含生殖)","categoryOrder":7,"number":39,"question":"下列何者不是目前定義的早洩問題分類(Premature ejaculation)?","options":{"A":"Life long premature ejaculation","B":"Acquire premature ejaculation","C":"Objective premature ejaculation","D":"Subjective premature ejaculation","E":"Natural variable premature ejaculation"},"answer":"C","reference":"(110)/7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell 12th chap 71 p1564-p1565","sourcePage":270},{"id":"7-040","category":"男性學(含生殖)","categoryOrder":7,"number":40,"question":"Princeton Consensus 對勃起功能障礙病患的 cardiac risk stratification (心臟風險分級)，何者為高風險?","options":{"A":"穩定型心絞痛 (stable angina)","B":"NYHA class III","C":"history valvular disease (心臟瓣膜疾病史)","D":"高血壓未控制","E":"二年前曾發生心肌梗塞"},"answer":"D","reference":"(110)/7.男性學(含生殖)/ 參 考資料(摘錄自)： Campbell 12th chap 69 , p1513-p1520","sourcePage":270},{"id":"7-041","category":"男性學(含生殖)","categoryOrder":7,"number":41,"question":"關於娛樂性用藥 (recreational drugs)與酒精對生殖功 能之影響，何者正確?","options":{"A":"大麻 (cannabis) 對生殖功能之影響為持續時間相 關(duration-dependent)而非劑量相關 (dose-dependent)","B":"長期飲酒與雄激素增加但降低精子品質有關","C":"使用大麻 (cannabis) 會顯著抑制 FSH 表現","D":"男性飲酒會降低卵胞漿內單精子注射 (intracytoplasmic sperm injection, ICSI)的成功 率結果","E":"使用古柯鹼(cocaine)會增加異常型態(abnormal morphology)之精子比例，但不會改變精子濃度 (sperm concentration)"},"answer":"D","reference":"(110)/7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell 12th chap 66 , p1430-p1440 J Urol . 2019 Oct;202(4):674-681. (Systematic Review)","sourcePage":271},{"id":"7-042","category":"男性學(含生殖)","categoryOrder":7,"number":42,"question":"下列關於性腺生理的敘述，何者正確?","options":{"A":"濾泡刺激素(FSH)主要由腦下垂體前葉 (anterior pituitary gland)製造，主要作用於萊氏細胞 (Leydig cell)，促進細精管(seminiferous tubule) 的發育","B":"WNT4 和 DAX1 兩種基因會改變 SRY 基因 (sex-determining region Y gene) 的活性，使其抑 制女性器官的發育","C":"老化(aging)會使體內萊氏細胞(Leydig cell)和 testosterone binding proteins 的數量同時減少， 而血液中濾泡刺激素(FSH)濃度上升","D":"一但基因決定性別，一部分的睪固酮(testosterone) 便會經由 5α-reductase 的作用產生 dihydrotestosterone (DHT)，促使內生殖器 (internal genitalia)的發育","E":"睪固酮(testosterone)和 β-內啡肽 (β-Endorphin)皆會抑制促性腺激素釋放激素 (GnRH)的分泌"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell Urology 12版, Chapter 64, Page 1390-1393. 詳解: (A) Sertoli cell (B) 使SRY活化仍會引發女 性器官的發育。 (C) Testosterone binding proteins數量增加而非 減少 (D) DHT促進External genitalia的發育 (E) Sex steroids (Testosterone)和 Opioid (B-Endorphi)會 抑制體內 GnRH 的分泌。","sourcePage":271},{"id":"7-043","category":"男性學(含生殖)","categoryOrder":7,"number":43,"question":"下列關於勃起功能障礙(Erectile Dysfunction, ED)的描 述，何者正確?","options":{"A":"身心疾病(psychogenic illness) 與糖尿病 (diabetes mellitus)是引發 ED 的重要風險因子 (risk factor)","B":"高泌乳激素血症(Hyperprolactinemia)會導致男性 患者性慾減低(loss of libido)，ED 和早洩 (premature ejaculation)","C":"肥胖會造成性荷爾蒙結合球蛋白(Sex hormone-binding globulin , SHBG)濃度上升，進而 讓 testosterone 失去其生物活性 (bioavailability)而導致 ED 的發生","D":"PDE5i 禁止與 nitrite 類藥物共用，若不慎使用造成 低血壓，需盡快給予解毒劑(pharmacologic antidote) 阻斷其交互作用(interaction)","E":"病患若患有心律不整(certain arrhythmias)，可在 安排心臟科檢查前，先行嘗試使用口服藥物治療其 ED"},"answer":"A","reference":"(111)參考資料(摘錄自)： Campbell Urology 12 版, Chapter 68, Page 1503. Chapter 69, Page 1513-1533 詳解: (A)正確 (B)不會造成早洩 (C)下降 (D)No pharmacologic antidote to the PDE5 inhibitor/nitrate interaction exists. (E)高風險病患(unstable or refractory angina, a recent history of myocardial infarction, certain arrhythmias, or uncontrolled hypertension) 則需待情況 . 穩定，方可進行 ED 方面的 治療。","sourcePage":271},{"id":"7-044","category":"男性學(含生殖)","categoryOrder":7,"number":44,"question":"下列關於男性不孕症的描述，何者正確?","options":{"A":"精索靜脈曲張(Varicocele)為男性不孕最常見的原 因","B":"因卡曼氏症候群(Kallmann Syndrome）而引起不孕的 病患，可發現其血液中濾泡刺激素(FSH)濃度上升， 合併睪固酮(testosterone)濃度下降","C":"囊狀纖維化(cystic fibrosis)的病人最常見的共 病，為遺傳性單側輸精管缺失","D":"因 Y 染色體 azoospermia factor c 區域缺失(AZFc deletion)而造成的不孕，仍可考慮採取睪丸取精 (TESE)進行治療","E":"針對兒童或青少年的精索靜脈曲張(varicocele)，可 採用後腹腔手術的方式減少對 testicular artery 的傷害且不易復發"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell Urology 12版, Chapter 66, Page 1429-1450 Chapter 67, Page 1476-1450 詳解: (A)最多為idiopathic (B) FSH濃度下降 (C)雙側輸精管缺失。 (D) AZFa,b deletion 則 TESE無效。 (E)容易復發","sourcePage":272},{"id":"7-045","category":"男性學(含生殖)","categoryOrder":7,"number":45,"question":"下列關於陰莖勃起生理機制的描述，何者正確?","options":{"A":"陰莖勃起時，海綿體平滑肌因細胞內鈣離子濃度增加 而放鬆，造成動脈管壁舒張而充血","B":"頸椎脊髓損傷的病人仍可透過 cerebral impulse 來 啟動 psychogenic erection","C":"當 ischiocavernosus muscle 產生 reflex contraction 時，即為陰莖海綿體內壓力上升至最高 的時候","D":"一氧化氮是啟動勃起功能中重要的神經傳遞物質，主 要是透過 adernergic cholinergic fiber 釋放","E":"神經末梢合成的一氧化氮(nNOS)負責維持海綿體的 勃起"},"answer":"C","reference":"(111)參考資料(摘錄自)： Campbell Urology 12 版, Chapter 68, Page1488-1498. 詳解: (A)鈣離子濃度減少 (B) T9 以上受損無法透過 cerebral impulse 來啟動 psychogenic erection。 (D) Nonadernergic noncholinergic fiber (E) eNOS","sourcePage":272},{"id":"7-046","category":"男性學(含生殖)","categoryOrder":7,"number":46,"question":"下列敘述，何者正確?","options":{"A":"使用睪固酮補充治療勃起功能障礙(ED)，可先嘗試三 至六個月並追蹤成效，若無改善則需增加使用劑量， 以避免對睪固酮產生耐受性(resistance)","B":"肌肉注射的睪固酮劑型半衰期短，至多不超過 12 小 時","C":"若 ED 病患有服用 non-selective beta blocker 治 療高血壓，若無禁忌症可考慮更換為 calcium channel blocker，以排除 reversible ED.","D":"使用選擇性的血管栓塞(selective embolization) 來治療非缺血性的陰莖異常勃起(non-ischemic priapism)，不會導致 ED 的發生","E":"一旦診斷確定為缺血性的 priapism，需盡快使用口 服藥物，若效果不佳則改為 emergent decompression"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell Urology 12 版, Chapter 69, Page1515-1531； Chapter 70, Page1547-1562 詳解: (A) 不建議再嘗試，而是直 接停藥 (B) 不小於12小時 (D) 15%仍會發生 ED (E)不建議口服藥物，直接 進行 emergent decompression","sourcePage":273},{"id":"7-047","category":"男性學(含生殖)","categoryOrder":7,"number":47,"question":"下列有關陰莖勃起機轉過程的描述，何者有誤?","options":{"A":"睡覺時的勃起是發生在快速動眼期 (Rapid eye movement; REM)","B":"陰莖勃起過程中在 tumescence phase (勃起期)時, pudendal arterial flow(會陰動脈血流)開始下降","C":"整個陰莖勃起和消退的過程可分成 7 個時期，其中在 Rigid erection phase 時 intracavernosal pressure 會超過 systolic pressure (收縮壓)，幾 乎沒有血流會通過 cavernous artery (海綿體動脈)","D":"陰莖勃起達到高潮後 pudendal nerve 才開始影響整 個消退的過程","E":"很多神經傳導物質(neurotransmitters)跟陰莖勃起 有關，包括 dopamine, serotonin, oxytocin, nitric oxide, norepinephrine 等"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Wash 12th edition, Chapter 68 p.1488-1489, 1495","sourcePage":273},{"id":"7-048","category":"男性學(含生殖)","categoryOrder":7,"number":48,"question":"以下有關 Nitric Oxide (NO)-sGC-cGMP 路徑在陰莖勃起 功能的角色，以下何者為非?","options":{"A":"NO isoform 中，以 nNOS (一氧化氮合成酶)和 eNOS 在陰莖勃起功能中扮演重要角色","B":"磷酸二酯酶 PDE (Phosphodiesterases)負責催化 cAMP, cGMP 水解變成 AMP, GMP。其中 PDE5 在終止 cGMP 的傳訊扮演重要的角色，增加 PDE5 的活性會降 低勃起的能力","C":"當 cGMP 被 PDE 降解後，cavernous smooth muscle 會收縮進而達到陰莖勃起的能力","D":"cGMP 會活化 PKG (Protein Kinase G)，進而打開 smooth muscle cell 內鉀離子通道和關閉鈣離子通 道","E":"smooth muscle 細胞質內的低鈣離子濃度會造成平滑 肌的放鬆"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Wash 12th edition, Chapter 68 p.1497-1500","sourcePage":273},{"id":"7-049","category":"男性學(含生殖)","categoryOrder":7,"number":49,"question":"以下有關男性生殖能力的描述，何者有誤?","options":{"A":"在男性生殖分化中，位於 Y 染色體長臂 (long arm) 上的 SRY(sex-determining Y gene)基因扮演重要角 色","B":"在生殖發育過程中，睪丸裡的 Sertoli cells 會分泌 müllerian- inhibiting substance (MIS)，進而去 抑制 müllerian duct 發育成子宮和輸卵管","C":"性類固醇(Sex steroids)對調節 GnRH(Gonadotropin-Releasing Hormone)的分泌是 屬於負回饋","D":"精子是在副睪獲得活動和成熟的能力，溫度和雄性素 的濃度會影響成熟的過程","E":"精子是纖毛細胞(ciliated cells)，擁有”9+2” axonemal 結構讓精子活動"},"answer":"A","reference":"(111) 參考資料(摘錄自)： C a m pbell-Wash 12th edition, Chapter 64 p.1391-1392, 1404-1406","sourcePage":274},{"id":"7-050","category":"男性學(含生殖)","categoryOrder":7,"number":50,"question":"以下對於睪固酮補充製劑的描述，何者有誤?","options":{"A":"補充睪固酮的過程中需定期追蹤 PSA 值，做肛門指診","B":"一開始補充以長效型製劑為先，可使濃度穩定減少副 作用","C":"口服的睪固酮補充製劑較容易有肝毒性","D":"貼布或凝膠類補充劑可能會有皮膚刺激的副作用","E":"睪固酮補充製劑可能造成的副作用包括紅血球增生 症(erythrocytosis)，睡眠呼吸中止，排尿症狀等"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Wash 12th edition, Chapter 69 p.1529-1531","sourcePage":274},{"id":"7-051","category":"男性學(含生殖)","categoryOrder":7,"number":51,"question":"以下有關 peyronie's disease 的治療，何者有誤?","options":{"A":"Potaba 藥物的作用機轉為減少 serotonin level，進 而增強組織的抗纖維特性(antifibrotic property)","B":"Tamoxifen 可以縮小 plaque 的大小","C":"Pentoxifylline 可以阻斷經由 TGF-ß1(Transforming growth factor)路徑造成的發 炎反應，改善陰莖的彎曲程度","D":"CCH(Xiaflex)是 FDA-approved 的藥物，從細菌 C. histolyticum製造出來可以選擇性裂解膠原蛋白 (collagen) types I 和 III","E":"低能量震波直接破壞 plaque，可以改善 peyronie's disease 造成的疼痛"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Wash 12th edition, Chapter 73 p.1616-1617","sourcePage":274},{"id":"7-052","category":"男性學(含生殖)","categoryOrder":7,"number":52,"question":"關於下視丘-腦下垂體-性腺軸 (hypothalamic-pituitary-gonadal axis)的發展, 以下 何者為非？","options":{"A":"SRY 基因位在Ｙ染色體短臂上，單獨決定性別發展 (sex determination)，若出現 SRY 基因, WNT4 跟 DAX1 基因即無法促進女性性腺發展","B":"肽類激素(kisspeptin)的表現會促進促性腺激素釋 放激素(gonadotropin-releasing hormone,GnRH)的 釋放","C":"睪丸間質細胞(Leydig cell)會合成類胰島素生長因 子-3 (insulin-like growth factor-3)促進睪丸從 腹腔移動到陰囊內","D":"在睪丸發育的過程中，史脫立細胞(Sertoli cells) 會合成穆勒氏管抑制物質 (müllerian-inhibiting substance)，使初期的生殖細胞呈現靜止狀態","E":"在青春期，男女性的生長發育會跟肽類激素 (kisspeptin)，褪黑激素(melatonin)及瘦體素 (leptin)有關"},"answer":"A","reference":"(111) 參考資料(摘錄自)：12th Campbell Urology, Chapter 64. P. 1392","sourcePage":275},{"id":"7-053","category":"男性學(含生殖)","categoryOrder":7,"number":53,"question":"有關不孕症的評估,下列敘述何者錯誤？","options":{"A":"只有 30%克林氏症候群 (Klinefelter syndrome)的 病患會發生身體形態的改變，像是身高增加","B":"雄激素受體(Androgen receptor)的基因會位在 Y 染 色體長臂的 Xq11-12，如果發生突變會造成不孕","C":"卡曼氏症候群（Kallmann Syndrome）的治療是使用 人绒毛膜促性腺激素(human chorionic gonadotropin)跟重組的濾泡刺激素(recombinant follicle stimulating hormone)","D":"當無精症患者的濾泡刺激素(follicle-stimulating hormone, FSH)濃度小於 7.6 IU/L 且睪丸長軸大於 4.6 公分，九成以上的機會是屬於阻塞型無精症","E":"在做輸精管造影術時，灌注顯影劑的方向不可以朝向 副睪丸"},"answer":"B","reference":"(111) 參考資料(摘錄自)：12th Campbell Urology, Chapter 66. P. 1444, 1445, 1447, 1449","sourcePage":275},{"id":"7-054","category":"男性學(含生殖)","categoryOrder":7,"number":54,"question":"下列有關陰莖勃起的機轉,何者錯誤？","options":{"A":"在勃起狀態時，尿道海綿體(corpus spongiosum)跟 龜頭(glans)的壓力只有陰莖竇狀海綿體(corpora cavernosa)的 1/3 至 1/2","B":"球海綿體肌(bulbocavernosus muscles)收縮會導致 硬勃起(rigid-erection phase)","C":"血清素受器 5-HT1A 會抑制勃起功能跟促進射精","D":"磷酸二酯脢（PDE）有 11 型，直接抑制 PDE3 也可以 促進勃起功能","E":"活化海綿體平滑肌上的鉀離子通道，會造成過極化跟 平滑肌的放鬆"},"answer":"B","reference":"(111) 參考資料(摘錄自)：12th Campbell Urology, Chapter 68. P. 1489, 1491,1494, 1499","sourcePage":275},{"id":"7-055","category":"男性學(含生殖)","categoryOrder":7,"number":55,"question":"下列關於佩洛尼氏症(Peyronie disease)的敘述，何者錯 誤？","options":{"A":"如果沒有給予治療，<13%的病患在發病的 12 至 18 個月會有部分改善，一半以上的病患會有更嚴重的陰 莖彎曲","B":"有 48%的患者，會同時合併中重度憂鬱症","C":"結締組織疾病(Collagen disorder)如掌腱膜攣縮症 (Dupuytren disease)也會跟佩洛尼氏症有關","D":"注射膠原蛋白酶(Collagenase Clostridium Histolyticum)可以用來治療佩洛尼氏症，其機轉是 降解結締組織內的第二型膠原蛋白（type II collagen）","E":"至少需維持六個月穩定的陰莖彎曲 (stable deformity)，才可以進行手術治療"},"answer":"D","reference":"(111) 參考資料(摘錄自)：12th Campbell Urology, Chapter 73. P. 1599, 1601, 1613, 1617","sourcePage":276},{"id":"7-056","category":"男性學(含生殖)","categoryOrder":7,"number":56,"question":"下列關於男性學及生殖相關疾病處置的敘述,何者錯誤？","options":{"A":"精液濃度≤ 1 million/ml 時，必須檢查 Y 染色體上 的小片段缺損(Y-chromosome microdeletions)","B":"40 歲以上反覆出現血精(haemospermia)的患者，須 考慮生殖泌尿道腫瘤的可能性，必要時需安排肛門指 檢,超音波或膀胱鏡檢查","C":"使用第五型磷酸二酯酶抑制劑(phosphodiesterase type5 inhibitor)治療勃起功能障礙時，需考慮可能 造成異常勃起(priapism)的危險因子，包括合併使用 陰莖注射血管擴張劑(intracavernous injection), 精神藥物,麻醉藥物(narcotic use)，每天使用 （daily dosing）","D":"治療男性不孕症時，不可以使用睪固酮 (testosterone)","E":"男性不孕症患者出現囊性纖維化穿膜傳導調節蛋白 (cystic fibrosis transmembrane conductance regulator,CFTR)基因突變時，檢查女性伴侶有無 CFTR 基因突變是必要的;如果女性伴侶也同時帶有 CFTR 基因突變，他們的小孩有囊腫性纖維化(cystic fibrosis)的機率是 50%"},"answer":"C","reference":"(111) 參考資料(摘錄自)： European Association of Urology Guidelines on Male Sexual and Reproductive Health: 2021 Update on Male Infertility European Association of Urology Guidelines on Sexual and Reproductive Health—2021 Update: Male Sexual Dysfunction EUROPEAN UROLOGY 80 (2021) 333–357","sourcePage":276},{"id":"7-057","category":"男性學(含生殖)","categoryOrder":7,"number":57,"question":"以下關於佩洛尼氏症(Peyronie's disease PD)的敘述何 者正確？","options":{"A":"Type I collagen 在白膜中以外環內縱的形式分布， 其中因為在五點鐘和七點鐘方向缺乏縱走層的組織 導致 PD 易形成 dorsal curvature","B":"白人族群以及年紀較輕接受手術這兩項因子為攝護 腺全切除病人術後發生 PD 的危險因子","C":"和 PD 有關的 collagen disorders 包含了 Ledderhose disease, Dupuytren disease 以及 Cystic fibrosis。","D":"治療 PD 的口服藥物中，Potaba 可以減少斑塊的大小 並且改善彎曲的程度，同樣地 Pentoxifylline 也可 以減少三成的彎曲程度","E":"Nicardipine 和 Verapamil 兩種鈣離子通道阻斷劑為 針對 PD 病灶的注射藥物，前者可減少彎曲程度，後 者則否"},"answer":"B","reference":"(111) Campbell Walsh Urology, 12th ed. Ch73. P1602-1603/1616-1617 A. 內環外縱 B. 正確 C. 沒有 Cystic fibrosis D. Potaba 不會改善彎曲程 度 前者無法減少彎曲程度，後 者可以。","sourcePage":277},{"id":"7-058","category":"男性學(含生殖)","categoryOrder":7,"number":58,"question":"下列關於代謝性疾病對於性功能影響的敘述何者正確？","options":{"A":"第二型糖尿病(type 2 diabetes mellitus)可能造成 女性性慾低下(low sexual desire)，第一型糖尿病 (type 1 diabetes mellitus)則否","B":"甲狀腺素亢進(hyperthyroidism)為延遲性射精 (delayed ejaculation)的危險因子，而甲狀腺素低 下(hypothyroidism)的病人在經過治療後可改善早 洩(premature ejaculation)的問題","C":"勃起功能障礙(erectile dysfunction)的危險因子 中，心血管疾病(cardiovascular disease)的危險對 比值(odds ratio)高於糖尿病","D":"性荷爾蒙結合球蛋白(sex-hormone binding globulin, SHBG)在甲狀腺素亢進的病人身上會增 加，反之；在甲狀腺素低下的病人身上則會減少","E":"有研究發現糖尿病在 Peyronie's Disease (PD)的病 患中盛行率超過 40%，明顯高於一般人口的盛行率"},"answer":"D","reference":"(111) Campbell Walsh Urology, 12th ed. Ch.74 p1642/Ch.71 p1574; Ch71 p1569/Ch.69 p1515/Ch.66 p1437/Ch.73 p1600 A. 兩者均會 B. Hypo 造成 delayed ejaculation; 治療 hyper 可改善 PE C. DM>CV disease D. 對 33%,非超過 40%","sourcePage":277},{"id":"7-059","category":"男性學(含生殖)","categoryOrder":7,"number":59,"question":"下列有關戴玉田(Yutian Dai)等人透過神經電生理學檢 查應用在早洩(premature ejaculation, PE)的研究何者 正確？","options":{"A":"研究團隊透過神經電生理檢查將 Lifelong PE 以及 Acquired PE 的病人分作 4 個 group: (1) Penile sensory hyperexcitability type, (2) Penile sympathetic hyperexcitability type, (3) Mixed type, (4) Normal type","B":"神經電生理的檢查以 Somatosensory evoked potentials(SEP)以及 Sympathetic skin response(SSR)兩項 test 為主，其中 SEP 及 SSR 均為 非侵入式的檢查","C":"Penile sensory hyperexcitability type 的 group 於每次性行為 1~2 小時前口服 dapoxetine 30mg or 60 mg，Penile sympathetic hyperexcitability type 則是使用複方的 lidocaine cream 於每次性交前塗抹 在陰莖，mix type 和 normal type 則是同時併用兩 種治療方式","D":"在所有神經電生理學檢查異常的病患中，各自接受對 應的治療長達 12 周後，有超過 85%的病人 Intravaginal ejaculation latency time(IELT)>2 minutes，然而最終仍然只有接近六成的病人 IELT>5 minutes","E":"在副作用方面，研究顯示使用 compound lidocaine cream 的病患有 10%的病人會發生 erectile dysfunction(ED)，使用口服 dapoxetine 發生頭 暈、噁心、嘔吐等副作用的發生率均在 15%上下"},"answer":"B","reference":"(111) J Urol. 2022 Jan; 207(1): 172–182. Published online 2021 Aug 30. A. 此篇研究未納入 Acquired PE 的族群。 B. 正確 C. 前兩個 group 治療方式 相反 D. IELT>5 minutes 的病人 可高達八成 Side effects 均為 5%左右","sourcePage":277},{"id":"7-060","category":"男性學(含生殖)","categoryOrder":7,"number":60,"question":"下列關於 priapism 的敘述何者正確？","options":{"A":"保守治療包括對陰莖局部麻醉並以小口徑的蝴蝶針 (20-22 gauge)透過龜頭穿刺到陰莖海綿體內抽吸鮮 紅色的動脈血","B":"若保守治療失敗需進一步進行海綿體內治療，目前第 一線治療藥物為 Phenylephrine，每 3~5 分鐘注射一 次，每次 200μg 直到達到消退，Phenylephrine 每 小時的最大注射劑量為 2mg","C":"服用 Hydrochlorothiazide、propranolol 等控制高 血壓的藥物為造成 priapism 的可能原因","D":"患有血液疾病包括地中海型貧血(thalassemia)、多 發性骨髓瘤(multiple myeloma)以及接受血液透析 (hemodialysis)的病人都較正常人容易發生 priapism","E":"如果陰莖異常勃起超過 24 小時就考慮直接進行人工 陰莖植入術"},"answer":"D","reference":"(111) EAU Guideline on Sexual and Reproductive health 2022 : 9.1.3; Figure 13 Campbell Walsh Urology, 12th ed. Ch.70 p 1542 Box 70.1 A. 大口徑(wide bore) 16-18G B. 每小時的最大注射劑量 為 1mg C. Hydrochlorothiazide 不會 D. 正確 48 小時","sourcePage":278},{"id":"7-061","category":"男性學(含生殖)","categoryOrder":7,"number":61,"question":"以下關於男性不孕症的診斷何者正確？","options":{"A":"關於睪丸切片術後的併發症：最常見的併發症為術後 發生副睪發炎，最嚴重的併發症為產生巨大血腫導致 需要引流","B":"Vasography 的絕對適應症需同時符合無精症 (Azoospermia)以及理學檢查至少摸到一條輸精管並 且在睪丸切片後確認病患有完整的造精功能，三者缺 一不可","C":"克林菲特氏症(Klinefelter’s syndrome)為男性不 孕症中最常見的染色體異常疾病，其中 47,XXY genotype 的發生率為每五千至一萬個活產嬰兒就有 一個被診斷患有此疾病","D":"Kallmann syndrome 為 hypogonadotrophic hypogonadism，發生率在男性族群中約為 1/10000， 其遺傳方式以體染色體顯性遺傳(autosomal dominant)為主，但在少部分人身上可發現到為體染 色體隱性遺傳(autosomal recessive)","E":"以上均正確"},"answer":"B","reference":"(111) Campbell Walsh Urology, 12th ed. Ch.67 p1456-1457/Ch.66 p1445-1447 A. 最常見為血腫最嚴重為 不經意切到副睪 (inadvertent biopsy of the epididymis) B. 正確 C. 五百到一千 Kallmann 主要為隱性遺傳","sourcePage":278},{"id":"7-062","category":"男性學(含生殖)","categoryOrder":7,"number":62,"question":"關於男性生殖器官的解剖構造敘述，何者正確？","options":{"A":"Testicular a.為主要 testis 動脈供應來源，左側源 自腹主動脈，右側源自右腎動脈","B":"Deferential a.亦為 testis 動脈供應來源，源自 external iliac a.，經由 superior vesical a.形 成","C":"Cremasteric a.也是 testis 動脈供應來源，源自 external iliac a.，經由 superior epigastric a. 形成","D":"陰 莖 由 外 至 內 的 解 剖 構 造 ， 分 別 為 skinBuck fasciadartos fasciatunica albuginea","E":"副 睪 的 動 脈 供 應 分 兩 個 部 分 ，Caput 及 corpus epididymis 為 testicular a. 供 應 ， 而 Cauda epididymis 為 deferential a.供應之"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume II, Chapter 63 (p 1372, 1375, 1385)","sourcePage":279},{"id":"7-063","category":"男性學(含生殖)","categoryOrder":7,"number":63,"question":"下列對於影響 GnRH 的藥物及關於 GnRH 的敘述，何者為 是？","options":{"A":"Opioids 如 ß-Endorphin 及 Insulin，有正回饋的作 用","B":"Leptin 及 Testosterone 亦有正回饋的作用","C":"Kisspeptins 及 FSH 則有負回饋的作用","D":"PGE2 與 LH 亦有負回饋的作用","E":"目前已知的 GnRH 唯一功能為刺激腦下垂體前葉，進 而使其分泌 FSH 及 LH，且半衰期為 5-7 mins"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume II, Chapter 64 (p 1390, 1391)","sourcePage":279},{"id":"7-064","category":"男性學(含生殖)","categoryOrder":7,"number":64,"question":"關於男性不孕症及取精手術的敘述，何者為是？","options":{"A":"Kallmann syndrome 的病人通常會有較高 及 較 低 的 testosterone level ， 故 亦 hyper-gonadotropic hypo-gonadism","B":"對於取精的成功概率，Klinefelter synd 患略低於 post-orchiopexy 之病患","C":"於 Sertoli cell only 的病人而言，無法以 不孕症的治療方式","D":"對於 Y chromosome 之 AZFa 及 AZFb delet 的病患，雖然取精效果不佳，但是還是有一 比","E":"所謂 Asthenozoospermia 指的是有大於 progressive motile spermatozoa"},"answer":"B","reference":"(111) 的 LH/FSH 稱 之 為 為 參考資料(摘錄自)： Campbell-Walsh Urology, rome 的病 12E, Volume II, Chapter 66-67 (p 1439, 1447, 取精作為 1475) ions 型態 定的成功 32%以上的","sourcePage":280},{"id":"7-065","category":"男性學(含生殖)","categoryOrder":7,"number":65,"question":"關於男性勃起功能及相關疾病之敘述，下列何者","options":{"A":"5-HT2C、Dopamine D1, D4 及 r-aminobut 有促進勃起的作用","B":"5-HT1A、Opioids 及 Melanocortins 則有抑 作用","C":"早洩的生理機轉，目前認為可能是 Hypose of 5-HT2C receptors 或是 Hypersensit 5-HT1A receptors","D":"Sildenafil 及 Tadalafil 皆會對高脂質性 互作用","E":"根據統計，導致 Erectile dysfunction 的 有很多，常見的有糖尿病及身心科用藥患者 壓目前研究顯示並非危險因子"},"answer":"C","reference":"為是？ (111) yric acid 參考資料(摘錄自)： 制勃起的 Campbell-Walsh Urology, 12E, Volume II, Chapter nsitivity 68-69, 71 (p 1495, ivity of 1502-1505, 1515, 1532, 1564) 食物有交 危險因子 ，而高血","sourcePage":280},{"id":"7-066","category":"男性學(含生殖)","categoryOrder":7,"number":66,"question":"關於 Priapism 或 Peyronie’s disease 的敘述 非？","options":{"A":"所謂的 ischemic type 又稱為 Veno-Occ Priapism，一般來說 gas 的分析 PO2<30 m 要緊急處理的類型","B":"Ischemic type 對比 non-ischemic type 來 易發生 fully rigid 以及劇烈疼痛的情 hematological abnormalities 較相關","C":"所謂的 non-ischemic type 又稱為 High Priapism，一般來說 perineal trauma 容易","D":"與 Peyronie’s disease 相 關 的 a Conditions，包括有 aging、糖尿病、hypog 勃 起 功 能 障 礙 、 prostate cancer 及 disorders","E":"Peyronie’s disease 的手術 indication，除了有因 變形或是硬度不足造成的無法性交外，還需要疾病進 程為 stable disease 的狀態，所謂 stable disease 指的是至少 6 個月無疼痛及變形加劇的情形"},"answer":"D","reference":"，何者為 (111) lusive 的 參考資料(摘錄自)： mHg，是需 Campbell-Walsh Urology, 12E, Volume II, Chapter 說，較容 70、73 (p 1539-1540, 1549, 形，且與 1600-1602, 1616-1618) -Flow 的 造成 ssociated onadism、 collagen","sourcePage":280},{"id":"7-067","category":"男性學(含生殖)","categoryOrder":7,"number":67,"question":"有關男性不孕症之敘述，下列何者錯誤?","options":{"A":"最常見原因為病因不明(idiopathic)，其次是精索靜 脈曲張(varicocele)","B":"長期使用鴉片類藥物(opioids)除會導致低促性腺激 素性腺功能低下症(hypogonadotropic hypogonadism)，同時也會直接抑制睪丸造精功能 (spermatogenesis)","C":"治療發炎性腸道疾病(inflammatory bowel disease) 使用 mesalazine，如造成患者精蟲數目減少與活動 力不佳(oligoasthenospermia)，可使用 sulfasalazine 來取代","D":"癌症孩童如睪丸曾接受放射線治療劑量大於 7.5Gy 以上，未來生育能力會降低","E":"發生睪丸扭轉後，約有一半患者會產生造精負面影響 (adverse spermatogenic effects)"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, chapter 66 male infertility: p.1429-1433","sourcePage":281},{"id":"7-068","category":"男性學(含生殖)","categoryOrder":7,"number":68,"question":"有關陰莖生理學之描述，下列何者正確?","options":{"A":"陰莖之交感神經源自於 T10-T12 而副交感神經則是 源自於 S2-S4","B":"Bulbourethral artery 主要供應尿道海綿體(corpus spongiosum)和龜頭(glans)之血流","C":"神經傳導物質如 NO、prostaglandin F (PGF )和 2α 2α endothelin-1 均可使平滑肌放鬆而引發陰莖勃起","D":"當陰莖勃起時，龜頭(glans)與尿道海綿體(corpus spongiosum)的壓力約為陰莖海綿體(corpora cavernosa)的 1/3 至 1/2","E":"抑制 phosphodiesterase type 6 (PDE6)也可使平滑 肌放鬆引發陰莖勃起"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, chapter 68 Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction: p.1489-1499","sourcePage":281},{"id":"7-069","category":"男性學(含生殖)","categoryOrder":7,"number":69,"question":"有關延遲射精(delayed ejaculation)之敘述，下列何者 正確?","options":{"A":"常見原因有糖尿病、性腺功能低下(hypogonadism) 與甲狀腺亢進(hyperthyroidism)","B":"約 15%的 Complete upper motor neuron 損傷患者可 保有射精功能","C":"Carbergoline 為 central D2 agonist，可增加泌乳 激素(prolactin)分泌，進而改善延遲射精","D":"Selective serotonin reuptake inhibitors 也可用 來治療延遲射精","E":"藥物治療對心因性(psychogenic)與神經性 (neuropathic)延遲射精的效果不佳"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, chapter 71 Disorders of Male Orgasm and Ejaculation, p.1574-1579","sourcePage":281},{"id":"7-070","category":"男性學(含生殖)","categoryOrder":7,"number":70,"question":"有關 Peyronie’s disease 治療之敘述，下列何者正確?","options":{"A":"口服 Potaba 因價格便宜且容易服用，常於急性期時 用來預防陰莖彎曲惡化","B":"口服 Tamoxifen 可增加細胞中 TGF-β 濃度，進而減 少發炎反應及纖維化，可顯著改善硬塊大小與陰莖彎 曲","C":"陰莖彎曲介於 60-90 度且術前勃起硬度滿意的患 者，優先建議 Tunica plication 手術治療","D":"Ventral deformity 的患者可使用 plaque incision and grafting (PIG) 手術治療，長期效果佳","E":"若病人合併勃起功能障礙，人工陰莖植入優先建議使 用 inflatable penile prothesis"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, chapter 73 Diagnosis and Management of Peyronie’s Disease, p1617-1624","sourcePage":282},{"id":"7-071","category":"男性學(含生殖)","categoryOrder":7,"number":71,"question":"一位男性病患因不孕來門診求治，經檢查發現為雄性素受 體不敏感(androgen receptor insensitivity)，下列何 者較不可能出現？","options":{"A":"顯著升高的睪固酮","B":"輕微升高的黃體生成素","C":"正常的濾泡促進激素","D":"輕微下降的雌激素","E":"基因檢測發現 X 染色體長臂上 Xq11-12 突變"},"answer":"D","reference":"(111)/Campbell’s Urology 12th edition, Ch66. p.1449","sourcePage":282},{"id":"7-072","category":"男性學(含生殖)","categoryOrder":7,"number":72,"question":"下列關於早洩 premature ejaculation(PE)何者正確？","options":{"A":"與 5-HT1a receptor 敏感性減弱(hyposensitivity) 有關","B":"盛行率 acquired PE 比 variable PE 高","C":"Dapoxetine 為長效型 SSRI(selective serotonin reuptake inhibitors)，可增加 2.5 至 3 倍的陰道內 射精前持續時間","D":"PE 和慢性攝護腺發炎及副甲狀腺亢進有關，須優先 排除這些疾病","E":"Lidocaine-prilocaine 局部麻醉噴劑建議在性行為 前提早五分鐘使用，噴灑在龜頭而非陰莖幹(penile shaft)的皮膚上"},"answer":"E","reference":"(111)/Campbell’s Urology 12th edition, Ch71. p.1564, 1568, 1571, 1572","sourcePage":282},{"id":"7-073","category":"男性學(含生殖)","categoryOrder":7,"number":73,"question":"下列和男性性生理學有關之中樞神經傳導物質(central neurotransmitter)的功能敘述，何者錯誤？","options":{"A":"Dopamine(多巴胺) D2 receptor – 促進儲精囊排空 (seminal emission)","B":"Serotonin(血清素)裡的 5HT1A – 抑制勃起、促進 射精","C":"γ-aminobutyric acid(γ-氨基丁酸) – 促進勃起 訊號(enhance erectile signals)","D":"Melanocortins(黑色素皮質素)的 MCR4 – 促進勃起 (enhance erection)","E":"Prolactin(催乳激素) – 抑制性功能(suppresses sexual function)"},"answer":"C","reference":"(111)/Campbell’s Urology 12th edition, Ch68. p.1495","sourcePage":283},{"id":"7-074","category":"男性學(含生殖)","categoryOrder":7,"number":74,"question":"下列泌尿道治療何者較不會引發醫源性的陰莖異常勃起 (iatrogenic priapism)？","options":{"A":"冷刀尿道切開術(cold-knife urethrotomy)","B":"經尿道膀胱頸切開手術(transurethral bladder neck incision)","C":"Nesbitt 海綿體整形術(corporoplasty)","D":"深背靜脈血管手術(deep dorsal vein arterialization)","E":"海綿體內注射(Intracavernous injections) alprostadil"},"answer":"B","reference":"(111)/Campbell’s Urology 12th edition, Ch70. p.1544, 1546","sourcePage":283},{"id":"7-075","category":"男性學(含生殖)","categoryOrder":7,"number":75,"question":"關於睪丸的解剖及生理，下列何者錯誤？","options":{"A":"正常的男性每天睪固酮的製造量約為 5 克","B":"與上部或下部區域相比，睾丸中段（midsection）的 血管相對較少。","C":"FSH 作用的主要部位是曲細精管（seminiferous tubules）內的 Sertoli cells","D":"睪固酮(testosterone)血中濃度在一生中有三個高 峰，分別為胚胎孕期 20-26 週，出生 2 個月及 10-19 歲","E":"間質組織（interstitial tissue）佔人類睾丸總體 積的 20% 到 30%"},"answer":"D","reference":"(111)/Campbell’s Urology 12th edition, Ch64. p.1393-1397","sourcePage":283},{"id":"7-076","category":"男性學(含生殖)","categoryOrder":7,"number":76,"question":"關於 Peyronie’s Disease 的口服藥物治療機轉，下列何 者錯誤？","options":{"A":"Vitamin E，抗氧化劑，降低氧化壓力","B":"Tamoxifen，誘導 TGF-beta 產生，使 macrophage 失 去活性及抑制 B 淋巴球，以避免纖維化","C":"Colchicine，Microtubule depolymerization，抑制 細胞有絲分裂、流動性、白血球粘附和膠原蛋白的跨 細胞運動，並刺激膠原酶的產生","D":"Carnitine，增加 mitochondrial respiration，減 少自由基產生","E":"Pentoxifylline，阻斷 TGF-β1 導致發炎機轉；防 止第一型膠原蛋白沉積並且是一種非特異性 phosphodiesterase inhibitor，降低血小板活性"},"answer":"B","reference":"(111)The Campbell Urology 12th Edition Chapter 73, P 1616 Table 73.1","sourcePage":283},{"id":"7-077","category":"男性學(含生殖)","categoryOrder":7,"number":77,"question":"在評估睪固酮補充療法時應注意事項，下列何者為非？","options":{"A":"評估患者的糖尿病病史和風險","B":"近期有計劃生育者不建議補充睪固酮","C":"評估患者嚴重睡眠呼吸中止症的風險","D":"將睾酮缺乏症的診斷限制在睾酮水平明顯低下的有 症狀男性","E":"與病人討論睾固酮補充療法的潛在風險"},"answer":"A","reference":"(111)The Campbell Urology 12th Edition Chapter 65, P 1425","sourcePage":284},{"id":"7-078","category":"男性學(含生殖)","categoryOrder":7,"number":78,"question":"關於高風險血精(high risk haemospermia) 的治療及診 斷，下列何者錯誤？","options":{"A":"大於 40 歲男性","B":"無症狀的血精","C":"以經直腸指診及 PSA 做為攝護腺癌篩檢工具","D":"用陰囊超音波檢查是否有睪丸腫瘤","E":"膀胱鏡檢查，必要時做切片"},"answer":"B","reference":"(111)EAU-Guidelines-on- Sexual-and-Reproductive -Health-2022 Figure 9 Management algorithm for haemospermia","sourcePage":284},{"id":"7-079","category":"男性學(含生殖)","categoryOrder":7,"number":79,"question":"下列關於早洩之敘述，何者正確?","options":{"A":"男性功能低下和甲狀腺功能低下為造成早洩的最常 見原因","B":"根據美國研究統計，陰道內射精前持續時間(IELT) 小於 1 分鐘的盛行率並不高，在一般族群中約為 5.5%","C":"早洩量表 Index of Premature Ejaculation (IPE) 在診斷及篩檢早洩上，有高度的價值","D":"精神及行為治療，在長期治療早洩，有好的療效","E":"藥物治療上，如 Dapoxetine 等 SSRI，是透過抑制血 清素神經系統中突觸裂隙（synaptic cleft）5-HT 再吸收之運輸，使血清素神經傳遞刺激增加"},"answer":"E","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology 12th Edition Chapter 71 Page 1565, 1565e1, 1570e1,1571, 1571e1","sourcePage":284},{"id":"7-080","category":"男性學(含生殖)","categoryOrder":7,"number":80,"question":"下列何種藥物最不會造成勃起功能障礙(Erectile dysfunction)?","options":{"A":"Flutamide","B":"Propranolol","C":"Cimetidine","D":"Thiazide diuretics","E":"Enalapril"},"answer":"E","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th Edition, 2021, Chapter 69, p1513-1538 switching antihypertensive therapies from thiazide diuretics and beta-blockers to calcium channel blockers and renin-angiotensin system inhibitors","sourcePage":284},{"id":"7-081","category":"男性學(含生殖)","categoryOrder":7,"number":81,"question":"治療因鐮刀型紅血球疾病所造成的缺血性陰莖異常勃起 (ischemic priapism)時，會合併以下方法治療。但是只 用以下何種方法單一治療時，被證實(牛津大學實證醫學 中心證據等級第四級以上)是無效的?","options":{"A":"給予交換輸血 (exchange transfusion)","B":"抽出陰莖海綿體內之缺氧血液","C":"陰莖海綿體內注射交感神經 (α-adrenergic)促進 藥物","D":"給予止痛劑、氧氣","E":"給予充足水分、碳酸氫鹽 (bicarbonate)"},"answer":"A","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1539-1563","sourcePage":285},{"id":"7-082","category":"男性學(含生殖)","categoryOrder":7,"number":82,"question":"下列有關影響男性性功能的中樞神經傳導物質 (central neurotransmitters)與其功能描述，何者正確?","options":{"A":"Dopamine 作用在 D3 and D5 receptor 可促進勃起功 能","B":"Serotonin 作用在 5-HT1A receptor 可促進勃起功能","C":"Prolactin 可促進勃起與射精功能","D":"Central norepinephrine 可促進性功能","E":"Oxytocin 可抑制性功能"},"answer":"D","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, chapter 68 Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction: neuroanatomy and neurophysiology of penile erection","sourcePage":285},{"id":"7-083","category":"男性學(含生殖)","categoryOrder":7,"number":83,"question":"下列有關 克林那費爾特症候群 (Klinefelter syndrome) 之描述，何者不正確的？","options":{"A":"其染色體為 47XXY","B":"發生率為 600 分之 1","C":"FSH 和 LH 會升高，睪固酮會下降","D":"可能會出現肌肉虛弱、身高較矮、體毛稀少和缺乏性 慾","E":"可能會出現男性女乳症，得乳癌的機率偏高"},"answer":"D","reference":"(112)/參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th Edition, 2021, Chapter 66, p1428-1452 Patients tend to be taller than average, mainly because of the disproportionate length of their legs, which is present even in childhood.","sourcePage":285},{"id":"7-084","category":"男性學(含生殖)","categoryOrder":7,"number":84,"question":"以下關於電擊取精的步驟順序排列何者為正確?(1)以 3~5 伏特開始電擊，以每 1 伏特增加並收集精液。(2)注 入 10cc buffer(HEPES-BSA) (3)將電擊探頭放入直腸(4) 放入尿管收集尿液中精蟲(5)放入尿管排空膀胱。","options":{"A":"4--> 2--> 3--> 1--> 5","B":"5--> 2--> 3--> 1--> 4","C":"5--> 3--> 1--> 2--> 4","D":"4--> 3--> 1--> 2--> 5","E":"2--> 3--> 1--> 4--> 5"},"answer":"B","reference":"(112)/7.男性學(含生殖)/ 參考資料(摘錄自)：第 12 版 Campbell Urology Chapter 67 p. 1472","sourcePage":286},{"id":"7-085","category":"男性學(含生殖)","categoryOrder":7,"number":85,"question":"以動脈血管重接手術 (arterial revascularization)治 療動脈型勃起功能障礙 (arteriogenic ED)時，下列敘述 中那一項條件最不適合手術?","options":{"A":"年紀小於 55 歲的病人","B":"不抽菸的病人","C":"無糖尿病的病人","D":"無陰莖靜脈漏血的病人","E":"竇狀海綿體動脈狹窄的病人"},"answer":"E","reference":"(112)/7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1513-1538","sourcePage":286},{"id":"7-086","category":"男性學(含生殖)","categoryOrder":7,"number":86,"question":"下列關於佩洛尼氏病(Peyronie’s disease)之敘述何者 正確?","options":{"A":"其盛行率隨年齡增加而上升,被認為與許多共病,例 如高血壓, 高血脂, 糖尿病與睪固酮指數上升有關","B":"致病機轉為陰莖海綿體白膜(Tunica albuginea)受 傷後的纖維化,最常發現在陰莖腹側(ventral side) 而導致陰莖向下彎曲(ventral curvature)","C":"目前實證上並無口服藥物可以改善彎曲角度, 但局 部塗抹藥物(topical therapy)及體外震波治療 (extracorporeal shock wave therapy)可減少陰莖 彎曲角度","D":"針對硬塊內注射藥物 verapamil 及 IFN alfa-1b(intralesional injection)可有效減少陰 莖彎取角度及改善性功能","E":"針對矯正陰莖彎曲以手術為 gold standard,不論使 用陰莖植入物(penile prosthesis)與否"},"answer":"E","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh Urology 12th edition Ch 73 p.1600-1626 (A)與 Low testosterone 有 關 (B)最常造成 dorsal curvature。 (C)選項描述之三種治療方 式均無法減少 curvature。 (D)應為 IFN-alfa-2b 而非 IFN-alfa-1b","sourcePage":286},{"id":"7-087","category":"男性學(含生殖)","categoryOrder":7,"number":87,"question":"關於下列造成男性不孕的問題，何者最容易於顯微取精 (Micro-TESE)時取得精蟲?","options":{"A":"Klinefelter Syndrome","B":"化學治療後 (post-chemotherapy)","C":"AZFc Y Chromosome Microdeletions","D":"AZFa Y Chromosome Microdeletions","E":"Sertoli cell-only syndrome"},"answer":"C","reference":"(112)/7.男性學(含生殖)/ 參考資料(摘錄自)：第 12 版 Campbell Urology Chapter 66 p. 1445~1550 and p 1475 Table 67.5","sourcePage":287},{"id":"7-088","category":"男性學(含生殖)","categoryOrder":7,"number":88,"question":"下列關於 Kallman Syndrome 之敘述何者為正確?","options":{"A":"發生率於西方約為十萬分之一，大部分為 antosomal recessive 的遺傳","B":"可能造成影響的基因包含 KAL1 gene、GHRHR (gonadotropin-releasing hormone receptor) gene、GPR53 (G protein-coupled Kisseptin recetor gene 等的變異","C":"治療無精症的方式通常為皮下注射 HCG (human chorionic gonadotropin)1500 到 5000IU 每週 2~3 次，伴隨 hMG (Human menopausal menopausal gonadotropin)75IU 皮下每週一次","D":"大約 3 到 6 個月的治療就可以在精液中發現精蟲","E":"Clomiphne citrate 可用來增加病患的男性荷爾蒙濃 度，可從 25mg/天上調至 100mg/天"},"answer":"E","reference":"(112)/7.男性學(含生殖)/ 參考資料(摘錄自)：第 12 版 Campbell Urology Chapter 66 p. 1447~1448","sourcePage":287},{"id":"7-089","category":"男性學(含生殖)","categoryOrder":7,"number":89,"question":"關於陰莖勃起的 0~7 期別(phase)，pudendal arterial flow 最高及 intracoporeal pressure 最高的期別時間 為?","options":{"A":"latent-> tumescence, tumescence","B":"tumescence -> full erection, rigid erection","C":"tumescence -> full erection, full erection","D":"latent-> tumescence, rigid erection","E":"latent-> tumescence, full erection"},"answer":"D","reference":"(112)/7.男性學(含生殖)/ 參考資料(摘錄自)：第 12 版 Campbell Urology Chapter 68 p. 1489","sourcePage":287},{"id":"7-090","category":"男性學(含生殖)","categoryOrder":7,"number":90,"question":"在先天性無精症病患，一次睪丸取精(TESE)或顯微取精 (Micro-TESE)失敗後，進行 salvage 顯微取精 (Micro-TESE)時，下列那一項原因最不會影響到取精的結 果?","options":{"A":"病患年齡較大","B":"睪丸較小","C":"較低術前 FSH 及 LH 的數值","D":"術前睪固酮濃度較低","E":"前一次取精失敗時病理報告 (hypospermatogenesis，maturation arrest， sertoli only syndrome)"},"answer":"D","reference":"(112)/7.男性學(含生殖)/ 參考資料(摘錄自)： Andrology.2023;1–15 Predictors of successful salvage microdissection testicular sperm extraction (mTESE) after failed initial TESE in patients with non-obstructive azoospermia:A systematic review and meta-analysis","sourcePage":287},{"id":"7-091","category":"男性學(含生殖)","categoryOrder":7,"number":91,"question":"有關藥物引起的勃起功能障礙(erectile dysfunction, ED),下列敘述何者正確?","options":{"A":"α2-Blocker 可以減少 ED 的發生率, 但可能會引起 射精功能障礙","B":"在無禁忌症的情況下, 由於 Thiazide diuretics 及 calcium channel blockers 會引起 ED, 因此若需要 更換高血壓藥物, 建議可以改用 angiotensin-converting enzyme inhibitors 或 angiotensin II receptor antagonists 類藥物","C":"目前已知 antiandrogen 類藥物中, androgen receptor antagonist, Luteinizing hormone-releasing hormone agonists, 5α-Reductase inhibitors 等機轉的藥物, 皆會引 起 ED","D":"目前已知抽菸及酒精, 不論是大量使用或是小量使 用, 皆會引起 ED","E":"Tricyclics 與選擇性血清素再吸收抑制(Selective serotonin reuptake inhibitors, SSRI)皆會引起 ED, 其機轉為 peripheral anticholinergic 及 β-adrenergic effects"},"answer":"C","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh Urology 12th edition Ch 68 p.1506-1509 (A)此描述為 α1-Blocker (B) CCB 較不會引起 ED, 反 而是建議可以使用 CCB 作為 thiazide 類控制高血壓的 替代藥物。 (D) 少量使用酒精反而因 vasodilatory effect 及 suppression of anxiety 可 以改善勃起功能。 (E)此機轉為 tricyclics 的 機轉, SSRI 的機轉為刺激 5-HT2 及 5-HT3 receptors","sourcePage":288},{"id":"7-092","category":"男性學(含生殖)","categoryOrder":7,"number":92,"question":"下列關於持續陰莖勃起症(priapism), 何者敘述正確?","options":{"A":"定義為不論是否在性刺激的情況下，持續勃起超過 3 個小時","B":"造成 priapism 的血液疾病最廣為人知的是 sickle cell disease(SCD)，且易引起的是非缺血性持續陰 莖勃起症(non-ischemic priapism)；據統計有 SCD 的男性終其一生 priapism 的盛行率可達 70%","C":"缺血性持續陰莖勃起症(ischemic priapism)其發生 率比非缺血性持續陰莖勃起症高，症狀上較會引起陰 莖疼痛, 大多為 trauma 引起","D":"針對缺血性持續陰莖勃起症的治療，除了給予 desmopression；使用細針抽吸(aspiration)之外， 還可以使用 β-adrenergic drug intracavernous injection or irrigation","E":"若接受 shunting 手術之後還是無法改善 ischemic priapism，為避免患者後續的 severe fibrosis，陰 莖長度減短及勃起功能障礙，應和患者討論盡早使用 人工陰莖植入(penile implantation)"},"answer":"E","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh Urology 12th edition Ch 70 p.1539-1560 (A) 4 小時 (B) SCD 易引起的是 ischemic priapism, 且 盛行率據統計為 29%-42%, 不超過 5 成。 (C) Trauma 引起的主要為 non-ischemic priapism ICI 應使用 alpha-adrenergic drug。","sourcePage":288},{"id":"7-093","category":"男性學(含生殖)","categoryOrder":7,"number":93,"question":"下列關於早洩(premature ejaculation, PE)的敘述何者 錯誤?","options":{"A":"The International Society for Sexual Medicine (ISSM)定義原發性早洩(lifelong PE)之 Intravaginal ejaculatory latency time (IELT) 為 1 分鐘；續發性早洩(acquired PE)之 IELT 為 3 分鐘","B":"原發性早洩(lifelong PE)之致病機轉為 5-HT2c 受體 敏感性增加(hypersensitivity)及 5-HT1a 受體敏感 性減低(hyposensitivity)","C":"續發性早洩(acquired PE)之危險因子包含勃起功能 障礙(erectile dysfunction)，甲狀腺亢進 (hyperthyroidism)，慢性下尿路感染(chronic lower urogenital infection)等","D":"雖說治療效果有限，但尋求早洩治療的患者都應接受 性心理治療(psychosexual therapy)","E":"口服的選擇性血清素再吸收抑制(selective serotonin reuptake inhibitors, SSRI)以及局部塗 抹麻醉藥(topical anesthetic drugs)對於治療 PE 都有所幫助"},"answer":"B","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh Urology 12th edition Ch 71 p.1564-1572 (B)應為 5-HT2c receptor hyposensitivity 及 5-HT1a receptor hypersensitivity。","sourcePage":289},{"id":"7-094","category":"男性學(含生殖)","categoryOrder":7,"number":94,"question":"有關男性睪固酮(testosterone)的描述，以下何者有誤?","options":{"A":"睪丸的 Leydig cells 可以製造睪固酮 (testosterone)","B":"正常的睪固酮(testosterone)會代謝成兩個最主要 的活性代謝產物，包括 dihydrotestosterone (DHT) 和 estradiol","C":"隨著年紀增長，睪固酮 (testosterone)的製造會逐 漸下降，可能會進入到男性更年期","D":"後側腦下垂體(posterior pituitary gland)分泌的 LH 和 FSH 會影響睪固酮 (testosterone)的製造","E":"血液中的睪固酮 (testosterone)濃度在一生中的變 化，主要會有 4 個時期呈現 testosterone peaks"},"answer":"D","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh Urology 12th p.1374, p. 1391~1393, 1396","sourcePage":289},{"id":"7-095","category":"男性學(含生殖)","categoryOrder":7,"number":95,"question":"有關陰莖勃起功能的描述，以下何者有誤?","options":{"A":"在 Flaccid 期時，陰莖的動脈會放鬆，而靜脈叢是 呈現收縮的狀態，以促進靜脈血流回 emissary veins (導靜脈)","B":"在 rigid-erection 勃起期間，陰莖海綿體內壓力 (intracavernous pressure)可以超過收縮壓 (systolic blood pressure)","C":"骨盆神經叢(pelvic plexus)和海綿體神經 cavernous nerves 的刺激和勃起有關","D":"腦部區域例如海馬迴(Hippocampus)也和勃起功能有 關","E":"睪固酮(testosterone)低下也有可能會導致勃起功 能障礙"},"answer":"A","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh Urology 12th p.1488~1491, 1503","sourcePage":289},{"id":"7-096","category":"男性學(含生殖)","categoryOrder":7,"number":96,"question":"以下哪個原因跟勃起功能障礙的關係最小?","options":{"A":"使用非選擇性 Beta-blocker 的降血壓藥","B":"心臟血管疾病","C":"泌尿道結石","D":"攝護腺肥大","E":"糖尿病"},"answer":"C","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh Urology 12th p.1513-1515","sourcePage":290},{"id":"7-097","category":"男性學(含生殖)","categoryOrder":7,"number":97,"question":"有關陰莖異常勃起(Priapism)的描述，以下何者有誤?","options":{"A":"跟性刺激無關的持續勃起超過 4 小時","B":"最常見的 priapism 是非缺血性 priapism (nonischemic priapism)，主要是因為陰莖受傷而造 成的，為泌尿科的急症","C":"反覆性且疼痛的 priapism 常發生在鐮刀型紅血球疾 病(sickle cell disease (SCD))的病人身上","D":"缺血性 priapism (ischemic priapism)血液裡的 Pco2 > 60mmHg","E":"缺血性 priapism (ischemic priapism)持續的時間 越久，未來導致勃起功能障礙(erectile dysfunction)的機會就越大"},"answer":"B","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh Urology 12th p.1540, 1549, 1554 Smith 19th p.625","sourcePage":290},{"id":"7-098","category":"男性學(含生殖)","categoryOrder":7,"number":98,"question":"以下有關男性不孕症的描述，何者有誤?","options":{"A":"Klinefelter syndrome 的基因表現是 XXY，是最常見 基因異常造成男性不孕的原因","B":"每個無精症的病人需要做睪丸切片，以鑑別診斷造成 不孕症的原因是來自造精功能障礙(spermatogenic dysfunction)或是阻塞","C":"Kallmann syndrome 是一種 hypogonadotropic hypogonadism，治療可給予 HCG 和 rFSH","D":"理學檢查如果發現雙側沒有輸精管(Congenital bilateral absence of the vas deference; CBAVD)， 8 成的病人可能有 cystic fibrosis (CF)基因突變","E":"精索靜脈曲張好發在左側，容易發生在睪丸內分泌和 外分泌功能同時增加的青春期時"},"answer":"B","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh Urology 12th p.1445, 1447 Smith 19th p.713, 722","sourcePage":290},{"id":"7-099","category":"男性學(含生殖)","categoryOrder":7,"number":99,"question":"一名男性被診斷為無精症，下列敘述何者最偏向精蟲生成 功能障礙，而非阻塞性？","options":{"A":"睪丸長軸 4.2 公分，FSH 4 IU/L","B":"睪丸長軸 4.3 公分，FSH 10 IU/L","C":"具生物效用的睪固酮(Bioavailable testosterone) 166 ng/dL, FSH 6 IU/L","D":"LH 2 IU/L, FSH 2 IU/L","E":"具生物效用的睪固酮(Bioavailable testosterone) 160 ng/dL, LH 9 IU/L"},"answer":"E","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh-Wein Urology 12th Edition Chapter 66 Page 1435, 1437","sourcePage":291},{"id":"7-100","category":"男性學(含生殖)","categoryOrder":7,"number":100,"question":"下列何者非末期腎病變導致勃起功能障礙的原因？","options":{"A":"Low NO","B":"Neuropathy","C":"Low Prolactin","D":"Atherosclerosis","E":"Depression"},"answer":"C","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh-Wein Urology 12th Edition Chapter 68 P1511","sourcePage":291},{"id":"7-101","category":"男性學(含生殖)","categoryOrder":7,"number":101,"question":"在進行精索靜脈曲張手術時，下列何者靜脈結構應保留？","options":{"A":"External spermatic veins","B":"Internal spermatic veins","C":"Gubernacular veins","D":"Deferential veins","E":"Cremasteric veins"},"answer":"D","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh-Wein Urology 12th Edition Chapter 71 P1476","sourcePage":291},{"id":"7-102","category":"男性學(含生殖)","categoryOrder":7,"number":102,"question":"下列關於佩羅尼氏病(Peyronie's disease)之敘述，何者 正確？","options":{"A":"糖尿病的盛行率在佩羅尼氏病的患者中超過 40%，比 一般人高出許多","B":"攝護腺癌接受電療、男性荷爾蒙低下症、結締組織疾 病都是可能造成佩羅尼氏病之症狀","C":"Pentoxifylline 作用為阻斷發炎反應中 TGF-β1–mediated pathway，是目前唯一有安慰劑 對照實驗證實有效治療佩羅尼氏病的口服藥物","D":"佩羅尼氏病手術治療中，斑塊切除及移植手術 (Plaque incision and grafting)的適應症為陰莖長 度小於 9 公分、嚴重陰莖彎曲及術前勃起硬度不佳","E":"放置人工陰莖治療佩羅尼氏病，採用手動塑形 (Manual modeling)時，尿道損傷為文獻記載中最常 見之不良事件"},"answer":"E","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh-Wein Urology 12th Edition Chapter 73 Page 1600, 1602, 1611, 1621, 1624","sourcePage":291},{"id":"7-103","category":"男性學(含生殖)","categoryOrder":7,"number":103,"question":"對於早洩(Premature ejaculation)病患的治療，在使用 每日治療(daily treatment)選擇性血清素再回收抑制劑 (Selective Serotonin Reuptake Inhibitors)及三環類 抗抑鬱藥(Tricyclic Antidepressants)的描述，下列何 者錯誤？","options":{"A":"可以使用 paroxetine 10 to 40 mg, clomipramine 12.5 to 50 mg, sertraline 50 to 200 mg, fluoxetine 20 to 40 mg, citalopram 20 to 40 mg","B":"使用 2 到 3 天會有效果","C":"可能會造成陰莖持續勃起症(Priapism)","D":"長期使用可能會造成體重增加及增加糖尿病的風險","E":"應避免突然停藥"},"answer":"B","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th Edition, 2021, Chapter 71, p1564-1581 Ejaculation delay usually occurs within 5 to 10 days of starting treatment , but the full therapeutic effect may require 2 to 3 weeks of treatment and is usually sustained during long-term use","sourcePage":292},{"id":"7-104","category":"男性學(含生殖)","categoryOrder":7,"number":104,"question":"下列何種因素會減少人工陰莖植入手術(penile prosthesis implantation)的術後感染風險？","options":{"A":"糖尿病","B":"年齡","C":"單獨使用 vancomycin and gentamicin","D":"使用 antifungals","E":"身體質量指數 (Body mass index)"},"answer":"D","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)：THE JOURNAL OF UROLOGY, February 2023, Vol. 209, p399-409 The use of vancomycin and gentamicin alone for antimicrobial prophylaxis in primary penile implant surgery is independently associated with a greater risk of implant infection, while the use of antifungals decreases the risk of infection.","sourcePage":292},{"id":"7-105","category":"男性學(含生殖)","categoryOrder":7,"number":105,"question":"下列物質對於促性腺激素釋放激 (gonadotropin-releasing hormone)的分泌調節機制何 者錯誤？","options":{"A":"鴉片類物質(opioids)藉由負回饋(negative feedback) 機制來調節","B":"胰島素(insulin)藉由正回饋(negative feedback) 機制來調節","C":"前列腺素(prostaglandin)藉由負回饋(negative feedback) 機制來調節","D":"瘦素(leptin)藉由正回饋(negative feedback) 機制 來調節","E":"睪固酮(testosterone)藉由負回饋(negative feedback)機制來調節"},"answer":"C","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell’s Urology, 12th ed, chapter 64, p. 1391, TABLE 64.1","sourcePage":292},{"id":"7-106","category":"男性學(含生殖)","categoryOrder":7,"number":106,"question":"關於陰莖勃起異常(priapism)何者錯誤？","options":{"A":"非缺血性陰莖勃異常(nonischemic priapism)通常 不會有疼痛的症狀","B":"缺血性陰莖勃起異常(ischemic priapism) 和血液學 方面疾病，如鐮刀型紅血球疾病(sickle cell disease), 多發性骨髓瘤(multiple myeloma)及蠶豆 症(glucose-6-phosphate dehydrogenase deficiency)相關","C":"患有 Sickle cell disease 的病人終生有 29%到 42% 的機率發生缺血性陰莖勃起異常","D":"超過 24 小時後處理缺血性陰莖勃起異常(ischemic priapism)可緩解疼痛，但無益於於保存勃起功能 (preserving potency)","E":"用來治療注意力不足過動症 (attention-deficit/hyperactivity disorder)的 藥物 methylphenidate 亦會造成陰莖勃起異常"},"answer":"D","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell’s Urology, 12th ed, chapter 70, p.1539-1545","sourcePage":293},{"id":"7-107","category":"男性學(含生殖)","categoryOrder":7,"number":107,"question":"關於以下敘述何者正確？","options":{"A":"Klinefelter syndrome 是最常見的男性不孕症基因 缺陷，通常可由外觀上做鑑別診斷","B":"目前有研究指出，禁慾一天為分析精液參數(seminal parameters)的最佳時機","C":"因阻塞造成的無精症(azoospermia)通常檢測其血清 FSH 濃度≧7.6 IU/L，且理學檢查睪丸長軸大於 4.6 公分","D":"以單一精蟲顯微注射數(intracytoplasmic sperm injection)進行人工受孕(in vitro Fertilization) 時，由副睪取得的精子較從睪丸處取得的精子有較高 的授精及懷孕率","E":"當懷疑因 Prolactin 過高造成的男性不孕，不論上升 多少都應執行顱部核磁共振影像"},"answer":"B","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell’s Urology, 12th ed, chapter 66, p.1437, 1439, 1445, 1448","sourcePage":293},{"id":"7-108","category":"男性學(含生殖)","categoryOrder":7,"number":108,"question":"關於輸精管副睪吻合術(vasoepididymostomy)何者錯 誤？","options":{"A":"應由富含顯微手術經驗之泌尿科醫師操作此類手術","B":"手術適應症為高度陽性(highly positive) 血清抗精 子抗體(antisperm antibodies)，經陰囊探查輸精管 內無精子且無輸精管或射精管阻塞之病人","C":"現行手術方式有 longitudinal intussusception, end-to-end 及 end-to-side 三種手術方式，但目前 多採取 longitudinal intussusception (LIVE) technique。主要原因是此種手術法較為簡單且成功 率較高","D":"執行 end-to-side 輸精管副睪吻合術優點在於可將 副睪向上移動(upward mobilization)以連接較長的 輸精管缺損","E":"不論採取何種手術方式皆建議於術中保存精子"},"answer":"D","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell’s Urology, 12th ed, chapter 67, p.1468, 1469","sourcePage":293},{"id":"7-109","category":"男性學(含生殖)","categoryOrder":7,"number":109,"question":"關於勃起功能障礙(erectile dysfunction)的敘述何者 正確？","options":{"A":"引起勃起功能障礙的各種成因中，高血壓的勝算比 (odds ratio)較 BMI >30 kg/m2 高","B":"藥物引起的勃起功能障礙約佔 25%，包括血壓藥 non-selective alpha blocker 及抗憂鬱用藥如 selective serotonin reuptake inhibitors","C":"內分泌相關問題造成的勃起功能障礙的病人可能會 發現 testosterone deficiency, hypothyroidism 及糖尿病等情況","D":"PDE5 inhibitors 和蛋白酶抑制劑(protease inhibitor)如 ritonavir 併用時，因 ritonavir 會 加強 CYP3A4 pathway 作用而需增加 PDE5inhibitors 的劑量","E":"PDE5 inhibitors 的藥物副作用以消化不良 (dyspepsia)最為常見，其盛行率約 7% 到 16%"},"answer":"A","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell’s Urology, 12th ed, chapter 69, p.1515, 1528, 1553","sourcePage":294},{"id":"7-110","category":"男性學(含生殖)","categoryOrder":7,"number":110,"question":"以肉毒桿菌素(Botulinum Neurotoxin A) 100 UI 陰莖海 綿體內注射，來治療勃起功能障礙的方法：根據最新歐洲 泌尿科醫學會的指引，建議施行或不施行的等級為何?","options":{"A":"強烈建議施行 (strong recommendations)","B":"建議可施行 (weak recommendations)","C":"無建議 (no recommendations)","D":"建議不施行 (weak recommendations not to do)","E":"強烈建議不施行 (strong recommendations not to do)"},"answer":"C","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)：EAU Guidelines on Sexual and Reproductive Health, 2023, page 48-63","sourcePage":294},{"id":"7-111","category":"男性學(含生殖)","categoryOrder":7,"number":111,"question":"性高潮後病情症候群 (postorgasmic illness syndrome) 最常與下列何種性功能障礙同時出現?","options":{"A":"勃起功能障礙","B":"早發性射精","C":"遲發性射精","D":"逆行性射精","E":"射精疼痛"},"answer":"B","reference":"(112) /7.男性學(含生殖)/ 參考資料： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1564-1581","sourcePage":295},{"id":"7-112","category":"男性學(含生殖)","categoryOrder":7,"number":112,"question":"一位正常發育的男性(無男性荷爾蒙缺乏症候群)，其一生 血中睪固酮 (testosterone)濃度的高低，下列何者最恰 當? 其抽血時間點都在早上九點 ㄅ為 2 個月大的血中睪固酮濃度 ㄆ為 2 歲大的血中睪固酮濃度 ㄇ為 17 歲大的血中睪固酮濃度 ㄈ為 25 歲大的血中睪固酮濃度 ㄉ為 35 歲大的血中睪固酮濃度","options":{"A":"ㄈ > ㄇ > ㄉ > ㄅ > ㄆ","B":"ㄈ > ㄇ > ㄉ > ㄆ > ㄅ","C":"ㄉ > ㄈ > ㄇ > ㄆ > ㄅ","D":"ㄈ > ㄉ > ㄇ > ㄅ > ㄆ","E":"ㄈ > ㄉ > ㄇ > ㄆ > ㄅ"},"answer":"D","reference":"(112) /7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1390-1410","sourcePage":295},{"id":"7-113","category":"男性學(含生殖)","categoryOrder":7,"number":113,"question":"血液中睪固酮的生物可利用性會受到性荷爾蒙結合球蛋 白(sex hormone–binding globulin, SHBG)影響。下列 何者不會導致 SHBG 濃度下降?","options":{"A":"糖尿病","B":"甲狀腺機能低下","C":"腎病症候群 (nephrotic syndrome)","D":"類固醇治療 (glucocorticoids and androgenic steroid therapy)","E":"雌激素治療 (estrogen therapy)"},"answer":"E","reference":"(112)/ 男性學(含生殖)/參 考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, chapter 66 male infertility: laboratory evaluation of male infertility.","sourcePage":295},{"id":"7-114","category":"男性學(含生殖)","categoryOrder":7,"number":114,"question":"下列有關恆久性勃起(priapism)之診斷與治療描述，何者 正確？","options":{"A":"當懷疑患者為 high-flow priapism，應盡早做 penile arteriography 來確認病兆，決定治療策略","B":"High-flow priapism 對保守性治療效果不佳，宜盡 早做 angioembolization 來避免勃起功能惡化","C":"研究顯示三到四成 Sickle cell disease 男性患者終 其一生可能發生 High-flow priapism","D":"Low-flow priapism 最常見的原因是外傷造成","E":"注意力不足與過動症用藥如 Methylphenidates 與 Atomoxetin，可能引發 low-flow priapism"},"answer":"E","reference":"(112)/ 男性學(含生殖)/參 考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, chapter 70 Priapism: Epidemiology of Priapism AND Penile Imaging AND Interventional Angiography in the Management of Arterial (Nonischemic, High-Flow) Priapism","sourcePage":295},{"id":"7-115","category":"男性學(含生殖)","categoryOrder":7,"number":115,"question":"關於佩洛尼氏病(Peyronie`s disease)的非手術治療描 述，下列何者正確？","options":{"A":"維生素 E 具有抗氧化功能，研究顯示可以顯著改善斑 塊大小與陰莖彎曲角度","B":"Pentoxifylline 可增強 TGF-β 作用與抗發炎機制， 進而抑制 Collagen type II 與 Ⅳ生成","C":"CCH(Collagenase clostridium histolyticum) 是第 一個美國 FDA 核可治療佩洛尼氏病的藥物，作用機轉 是可選擇性降解 Collagen type II 與 Ⅳ","D":"低能量震波治療可顯著改善斑塊大小與陰莖彎曲程 度，可當作第一線治療","E":"陰莖牽引治療 (Penile traction)有助於改善患者 陰莖長度、周長(girth)與彎曲角度，是具潛力與療 效的非手術治療"},"answer":"E","reference":"(112)/ 男性學(含生殖)/參 考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, chapter 73 Diagnosis and Management of Peyronie’s Disease: Nonsurgical Treatment of Peyronie's Disease","sourcePage":296},{"id":"7-116","category":"男性學(含生殖)","categoryOrder":7,"number":116,"question":"下列有關藥物影響男性生殖與性功能的敘述，何者錯誤？","options":{"A":"Opioids 類麻醉藥物會作用在下視丘，抑制 LH 釋放 來減少 Testosterone 生成","B":"長期使用 Opioids 類麻醉藥物，不僅會造成 hypogonadotropic hypogonadism，還會降低睪丸精 子生成(spermatogenesis)","C":"停止使用 Opioids 類麻醉藥物後，雄性激素最快可在 一個月內恢復","D":"服用抗精神病藥物如 risperidone，可能引發 prolactin level 下降而導致性慾下降","E":"服用 selective serotonin reuptake inhibitors (SSRIs) 類抗精神病藥物，可能產生延遲射精或無法 射精等副作用"},"answer":"D","reference":"(112)/ 男性學(含生殖)/參 考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, chapter 66 male infertility: Spermatotoxicity","sourcePage":296},{"id":"7-117","category":"男性學(含生殖)","categoryOrder":7,"number":117,"question":"性傳染疾病造成生殖器潰瘍有梅毒 (Treponema pallidum) 皰疹 (herpes simplex virus) 及軟性下疳 (Haemopilus ducreyi) 等常見的致病原,其常見的依序 為？","options":{"A":"梅毒 > 皰疹 > 軟性下疳","B":"皰疹 > 梅毒 > 軟性下疳","C":"軟性下疳 > 皰疹 > 梅毒","D":"軟性下疳 > 梅毒 > 皰疹","E":"梅毒 > 軟性下疳 >皰疹"},"answer":"B","reference":"(113) / Smith 19 th p248","sourcePage":296},{"id":"7-118","category":"男性學(含生殖)","categoryOrder":7,"number":118,"question":"PRP(platelet-rich plasma)又稱高濃度血小板血漿，目 前可以用來治療勃起功能障礙是用什麼方式給藥?","options":{"A":"陰莖海綿體內注射","B":"肌肉內注射","C":"靜脈內緩慢注射","D":"口服","E":"安置於皮下注射裝置緩慢吸收"},"answer":"A","reference":"(113)/參考資料(摘錄自)： Campbell-Walsh-Wein Urology , 12th edition Ch69. P1537","sourcePage":297},{"id":"7-119","category":"男性學(含生殖)","categoryOrder":7,"number":119,"question":"在評估女性性功能障礙時，女性性功能量表(Female Sexual Function Index, FSFI)較常為臨床所使用，請問 下列敘述何者並非其評估的六個面向(domain)之一？","options":{"A":"潤滑度(lubrication)","B":"性慾(desire)","C":"信心(confidence)","D":"性高潮(orgasm)","E":"疼痛(pain)"},"answer":"C","reference":"(113) 解題說明請註明 1. Campbell-Walsh Urology 2. 12th Edition 2020 3. Chapter74 4. P.1629 In 2000, the Female Sexual Function Index (FSFI) was developed based on the Diagnostic and Statistical Manual of Mental Disorders (DSM-IV-TR) definitions of sexual dysfunction and the Consensus Report of the International Consensus Development Conference on Female Sexual Dysfunction (Basson et al., 2000). It is a brief, 19-item, multidimensional self-report instrument that assesses six domains of sexual function: (B)desire, arousal, (A)lubrication, (D)orgasm, satisfaction, and (E)pain.","sourcePage":297},{"id":"7-120","category":"男性學(含生殖)","categoryOrder":7,"number":120,"question":"如果陰莖彎曲是向右下，那我們做摺縫手術(Plication) 的位置是陰莖海綿體白膜的?","options":{"A":"右下","B":"右上","C":"左上","D":"左下","E":"正中"},"answer":"C","reference":"(113)/ 參考資料(摘錄自)： Campbell-Walsh-Wein Urology , 12th edition Ch73. P1618-1620","sourcePage":297},{"id":"7-121","category":"男性學(含生殖)","categoryOrder":7,"number":121,"question":"在精液分析中，使用哪種測試方法可以非破壞性地評估精 子活力，並且可用於體外受精 (IVF)？","options":{"A":"彗星試驗 (comet assay)","B":"免疫珠試驗 (immunobead assay)","C":"低滲脹試驗 (HOS test)","D":"混合抗球蛋白反應試驗 (MAR test)","E":"TUNEL 試驗"},"answer":"C","reference":"(113)/Campbell-Walsh-We in Urology 12th Edition Chapter 66 Page 1440-1442","sourcePage":298},{"id":"7-122","category":"男性學(含生殖)","categoryOrder":7,"number":122,"question":"45 歲王小姐主訴近一年性慾明顯下降，無性交疼痛。月 經規律，無重大內科病史，憂鬱症服用 fluoxetine 已一 年，病情相對穩定，荷爾蒙抽血正常，因性慾下降造成伴 侶關係緊張，下烈哪一項處置最合適？","options":{"A":"考慮調高 fluoxetine 劑量，以改善潛在的情緒性性 慾 低落","B":"因荷爾蒙正常，可考慮心理治療","C":"使用 Bremelanotide 來改善性慾","D":"停用 fluoxetine，改用 mirtazapine","E":"考慮局部陰道雌激素或陰道雷射治療"},"answer":"D","reference":"(114) Campbell-Walsh-Wein Urology, 12th ed., Chapter 74 抗憂鬱藥物造成的 HSDD 應 優先移除致病原因，而非考 慮其他 HSDD 或 FSD 治療","sourcePage":298},{"id":"7-123","category":"男性學(含生殖)","categoryOrder":7,"number":123,"question":"下列有關血睪屏障(Blood-Testis Barrier)，何者正確?","options":{"A":"曲細精管(seminiferous tubules)周圍的肌樣細胞 （myoid cells）能直接形成 tight junctions，決 定屏障的選擇性","B":"在睪丸部分結構如輸出小管與副睪中，少量精子抗原 洩漏可誘導免疫耐受(immune tolerance)","C":"Galectin-1 是主要由精母細胞分泌的醣蛋白，促進 自然殺手細胞活性以清除異常細胞","D":"青春期前睪丸外傷可能因血睪屏障受傷，導致誘發抗 精子抗體，造成免疫性不孕(immunologic infertility)","E":"Sertoli 細胞主要藉由吞噬抗原方式直接消滅活性 T 細胞，維持免疫抑制環境"},"answer":"B","reference":"(114)/Campbell Walsh Urology 12 th edition, Chap 64, p1398-1399 (A) 肌樣細胞提供機械支 撐與結構保護，但不形 成 tight junctions (B) 正確 (C) Galectin-1 是由 Sertoli 細胞表現 (D) 青春期前不會 主要透過分泌免疫抑制因 子、調節細胞激素環境，非 直接吞噬活化 T 細胞","sourcePage":298},{"id":"7-124","category":"男性學(含生殖)","categoryOrder":7,"number":124,"question":"下列關於男性生殖器官血流的供應何者正確?","options":{"A":"睪丸具有三套血流供應，最主要來自於睪丸動脈 (testicular artery)，其中睪丸動脈的血管直徑大 於另外兩條動脈之和","B":"提睪肌動脈(Cremasteric artery)源自於上膀胱動 脈（superior vesical artery）","C":"下副睪動脈(Inferior epididymal artery)源自於提 睪肌動脈(Cremasteric artery)","D":"輸精管結紮手術後，若輸精管的血管被結紮，則輸精 管靠近睪丸的一端將完全由輸精管動脈 (deferential artery)及其分支提供血液供應","E":"假使因為手術而結紮掉副睪周圍的血管，只要下副睪 動脈(Inferior epididymal artery)保持完整，副睪 的血流供應仍然會足夠"},"answer":"A","reference":"(114) 解題說明請註明 1. Campbell Walsh Urology, 12th edition, 2021, Chapter 67 2. Table 67.1 & p. 1454 3. A:正確 4. B: Superior Vesicle Artery 5. C: deferential artery 6. D: branches of the testicular artery and epididymal artery E: superior epididymal artery","sourcePage":298},{"id":"7-125","category":"男性學(含生殖)","categoryOrder":7,"number":125,"question":"關於男性健康 Men’s Health 下面各項敘述何者有誤？","options":{"A":"根據第四次普林斯頓共識 (Princeton IV Consensus ) ，PDE5 抑制劑在心血管疾病方面的角 色是有正面影響的","B":"根據第四次普林斯頓共識 (Princeton IV Consensus )，勃起功能障礙可能比心血管疾病提早 約 2-5 年發生","C":"Coronary artery calcium (CAC) score 可以用來作 為心血管以及陰莖動脈阻塞的風險評估","D":"男性的心理健康也是重要的議題，根據統計男性自殺 的比例較女性高四倍","E":"Riociguat （用來治療肺動脈高壓的藥物）目前已可 以跟 PDE5 抑制劑併用"},"answer":"E","reference":"(114) 解題說明請註明 J Sex Med. 2024 Jan30;21(2):90-116. Campbell 12th edition Chapter 65 Integrated Men’s Health: Androgen Deficiency, Cardiovascular Risk, and Metabolic Syndrome 1411-1427","sourcePage":299},{"id":"7-126","category":"男性學(含生殖)","categoryOrder":7,"number":126,"question":"關於勃起功能障礙(Erectile dysfunction)的敘述下列 何者為是？","options":{"A":"血管內皮釋放的一氧化氮（NO）可增加海綿體平滑肌 細胞內 cyclic AMP 進而放鬆血管壁","B":"Prostaglandin E1 以及 Papaverine 主要是藉由 ATP 轉化為 cyclic AMP 的機制進而放鬆血管壁","C":"新型抗焦慮藥物 Newer anxiolytics (bupropion, buspirone) 比起傳統 Antipsychotics, Antidepressants, Anxiolytics 更容易造成勃起功 能障礙","D":"Nitric oxide, cGMP, Protein kinase G 以及 Rho-kinase (calcium sensitization pathway)對於 海綿體平滑肌皆能夠達到放鬆的效果而產生勃起反 應","E":"陰莖在勃起反應時，海綿體內壓力(Intracavernous pressure) 在 Latent Phase 會逐漸上升"},"answer":"B","reference":"(114) Campbell 12th edition Chapter 68 Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction 1485-1512","sourcePage":299},{"id":"7-127","category":"男性學(含生殖)","categoryOrder":7,"number":127,"question":"關於 Priapism 的描述下列何者錯誤?","options":{"A":"Sickle cell disease (SCD)的男性若患有 Stuttering Priapism，通常至壯年才會發生第一次 episode","B":"對於 Ischemic Priapism，症狀發生 36 小時後的 intervention 對於 potency 的保留並無益處","C":"對於 Nonischemic Priapism，患者常有 history of blunt trauma to the perineum or an iatrogenic needle injury","D":"對於 Nonischemic Priapism，blood gas 並不會有 hypoxia, hypercarbia, or acidosis","E":"曾經發生過 ischemic priapism 是 stuttering priapism 的 risk factor"},"answer":"A","reference":"(114)Campbell-Walsh Urology, 12th edition, P2093-2097 (A)Males with SCD may experience stuttering priapism from childhood; in these patients the pattern of stuttering may increase in frequency and duration, leading to a full episode of unrelenting ischemic priapism.","sourcePage":300},{"id":"7-128","category":"男性學(含生殖)","categoryOrder":7,"number":128,"question":"在精液分析（Semen Analysis）中，Bulk Semen Parameters 是用來評估男性生育力的量化指標，下列何者不包含在 內?","options":{"A":"精液 pH 值 (Semen pH)","B":"精液量(Semen volume)","C":"精子濃度（Sperm concentration）","D":"精子數量 (Total number)","E":"精子存活率(Sperm vitality) 題號 答案 考 題"},"answer":"A","reference":"(114) 解題說明請註明 1. Campbell Walsh Urology, 12th edition, 2021, Chapter 66 A: p. 1439 Historically, semen pH was reported, but its measurement is no longer recommended because environmental conditions may alter it, and the original intent of using pH to gauge whether obstruction exists is hampered by the vast difference in size between a hydrogen ion and sperm head 年度 類別 參考資料","sourcePage":300},{"id":"8-001","category":"小兒泌尿","categoryOrder":8,"number":1,"question":"關於小兒泌尿道逆流(VUR)與泌尿道感染(UTI)，哪一項描 述不恰當？","options":{"A":"對於無症狀以及低度逆流的孩童可以給予密切觀察追 蹤就好","B":"持續性抗生素預防 (Continuous antibiotic prophylaxis) 的使用可以減少泌尿道感染，也可以減 少腎臟結疤或者後續慢性腎臟病","C":"在等待治療逆流時，應該正視膀胱及腸道功能是否正 常，因為膀胱與腸道失能（bladder and bowel dysfunction）與泌尿道感染發生率有關","D":"是否手術主要按照腎臟功能及逆流程度決定，但是如 果病患偏好決定性治療（definitive treatment）則 應該給予手術矯正","E":"依照美國小兒科醫學會小兒尿路指引建議，對於 2 個 月到 24 個月大的小孩，排尿膀胱尿道攝影檢查(VCUG) 的適應症為反覆性發燒性尿路感染(febrile UTI)或者 腎臟超音波顯示腎水腫、腎變形結疤"},"answer":"B","reference":"(110)/8.小兒泌尿/參考 資料(摘錄自)： Campbell-Walsh Urology 12th，ch29, p496, 500, 516; EAU guideline 2021 paediatric p72; AAP clinical practice guideline(doi:10.1542/ peds.2011-1330)","sourcePage":301},{"id":"8-002","category":"小兒泌尿","categoryOrder":8,"number":2,"question":"關於小兒神經管缺陷(neural tube defects)所引起的神經 性膀胱排尿障礙 (neurogenic bladder dysfunction)，以 下敘述何者錯誤?","options":{"A":"常與母親葉酸缺乏相關，其他風險因子還包括妊娠糖 尿病、妊娠肥胖以及低社經地位","B":"脊椎骨缺陷位置可能與實際受影響的神經位置無關","C":"脊髓脊膜膨出(myelomeningocele)的發生位置以 Lumbar spine 最高","D":"治療處置的首要目標在於避免腎臟功能的惡化","E":"有逼尿肌外尿道括約肌共濟失調 (detrusor sphincter dyssynergia)的患者其上泌尿道功能惡化 機率較無共濟失調的患者高"},"answer":"C","reference":"(110)/8.小兒泌尿/參考 資料(摘錄自)：Campbell 12ed, Chapter 34, Neuromuscular Dysfunction of the Lower Urinary Tract in Children, p624-629 ＆ table 34.7","sourcePage":301},{"id":"8-003","category":"小兒泌尿","categoryOrder":8,"number":3,"question":"一位於孕母妊娠期間不曾接受過產檢的兩天大男嬰，被發 現有雙側腎臟及輸尿管水腫而由兒科轉介，經過一系列超 音波檢查後其 voiding cystourethrogram 結果如圖示，試 問有關箭頭所指處之疾病敘述何者錯誤？","options":{"A":"是造成小兒下尿路阻塞(lower urinary tract obstruction)最常見的原因","B":"超音波可見此疾病獨有的“keyhole sign“","C":"多數患者會合併膀胱輸尿管逆流(vesicoureteral reflux)","D":"部分患者可觀察到肺臟或腎臟發育不全(pulmonary hypoplasia or kidney dysplasia)","E":"若持續的膀胱引流仍無法解決上泌尿道的擴張且反覆 感染，高位改道(high diversion)的處置是建議的"},"answer":"B","reference":"(110)參考資料(摘錄 自)：Chapter 33, Posterior Urethral Valves, p602-615; EAU guidelines on pediatric urology 2021, 3.18.1 Posterior urethral valves","sourcePage":302},{"id":"8-004","category":"小兒泌尿","categoryOrder":8,"number":4,"question":"以下關於產前超聲檢查的敘述，何者正確?","options":{"A":"10 週前的胎兒，羊水中含有胎兒的尿液","B":"10~12 週大的胎兒，羊水中無胎兒的尿液","C":"20 週大的胎兒，尿液還不會流入胎兒膀胱","D":"儘管膀胱循環正常，但胎兒膀胱從未完全排空","E":"在胎兒腎臟中，顯著的皮質髓質分化不會與腎積水混 淆"},"answer":"D","reference":"(110)參考資料(摘錄自)： Campbell-Walsh-Wein Urology 12th Edition Review (2020, Elsevier) Chapter24. P.294","sourcePage":302},{"id":"8-005","category":"小兒泌尿","categoryOrder":8,"number":5,"question":"下列有關隱睪症的描述何者錯誤?","options":{"A":"Leydig cell 所分泌的荷爾蒙如 INSL3 和睪固酮 (testosterone)，會在第 14 至 16 週妊娠時期出現高 峰的濃度，主要是為了促進睪丸下降","B":"睪丸所產生的荷爾蒙如 INSL3(insulin-like 3)和睪 固酮主要的功能是刺激睪丸繫帶的成長及促進睪丸在 初期妊娠 (first trimester)的下降","C":"單側隱睪症的病童出現開放性的鞘狀突( patent processus vaginalis )機率是 87%左右","D":"隱睪症的病童約有 16% 至 75% 在手術中會發現副睪丸 及睪丸之間分離的異常","E":"在 7 歲至 12 歲的兒童，發生回縮睪丸( retractile testes) 的機率是 4% to 15%左右"},"answer":"B","reference":"(110)Campbell-Walsh Urology , 11th edition ; 2016: p.3430-p.3452","sourcePage":303},{"id":"8-006","category":"小兒泌尿","categoryOrder":8,"number":6,"question":"媽媽在幫一歲半的美美洗澡時意外發現美美沒有陰道，趕 緊帶來泌尿科門診評估，醫師檢查發現美美的兩側小陰唇 下三分之二完全密合在一起，封住了陰道的開口，可以看 得到尿道開口，會陰皮膚無異常。關於小陰唇粘連(labial adhesion)，以下敘述何者錯誤？","options":{"A":"好發於兩歲前","B":"不會發生在新生兒","C":"跟雌激素過低有關","D":"通常不會自然緩解","E":"治療方式包括塗抹雌激素藥膏及手術分離粘連"},"answer":"D","reference":"(110)Campbell-Walsh Urology, 12th Edition, pp986-987","sourcePage":303},{"id":"8-007","category":"小兒泌尿","categoryOrder":8,"number":7,"question":"有關胎兒及新生兒時期賀爾蒙分泌的敘述，下列何者不恰 當？","options":{"A":"胎兒時期的萊氏細胞（Fetal Leydig cells）與成人 時期是不同群細胞，會在第一孕期六到七週時分泌睪 固酮，最初期的分泌與促性腺激素（gonadotropin） 無關","B":"胎兒時期的塞特利氏細胞（Fetal Sertoli cell）會 製造抗穆氏管荷爾蒙（antimüllerian hormone (AMH)）使胎兒的穆氏管（müllerian duct）慢慢退 化，而此種賀爾蒙在出生後就立即跟著其他賀爾蒙下 降","C":"下視丘-腦垂體-性腺軸 （hypothalamic-pituitary-gonadal axis）的活化發 生在新生兒期，這種現象被稱為“迷你青春期”","D":"這種出生後的賀爾蒙上升（surge）會伴隨著睪丸的變 大，主要是由於塞特利氏細胞（Sertoli cell）和生 殖細胞（germ cell）的增生","E":"出生之後，睪固酮（testosterone）以及類胰島素 3 （insulin-like 3 (INSL3)）會有第二次的上升，三 到六個月後會下降，之後直到青春期才會再上升"},"answer":"B","reference":"(110)Campbell-Walsh Urology 12th, ch46, p 950, 951","sourcePage":303},{"id":"8-008","category":"小兒泌尿","categoryOrder":8,"number":8,"question":"有關小兒包莖(phimosis)的敘述及處理方式何者有誤？","options":{"A":"包莖的發生率在六至七歲的男童約 8%，而截至十八歲 時約 1%","B":"保守性療法及類固醇藥膏塗抹是 Primary phimosis 的 第一線治療方式","C":"類固醇藥膏塗抹無顯著副作用且不會對下視丘-腦垂 體-腎上腺系統(Hypothalamic-Pituitary-Adrenal Axis)造成影響","D":"Secondary phimosis 是包皮環切手術(circumcision) 的絕對適應症","E":"Primary phimosis 合併 hypospadias 是包皮環切手術 的相對適應症"},"answer":"E","reference":"(110)EAU guidelines on pediatric urology 2021, p11-13; TUA guidelines 2020ed, p441-446","sourcePage":304},{"id":"8-009","category":"小兒泌尿","categoryOrder":8,"number":9,"question":"下列有關陰囊急症(acute scrotum)的描述何者錯誤?","options":{"A":"鞘膜內的睪丸扭轉(intravaginal testicular torsion)大部分發生於 10 歲之後，而且發生的高峰期 是在 12 至 16 歲之間","B":"雖然大部分陰囊急症的病人有提睪肌反射及超音波顯 示良好的睪丸血流，應該可以排除睪丸扭轉，但還是 要配合病史及臨床症狀來考慮是否扭轉","C":"睪丸扭轉確診的病人如果超過 24 小時沒有處置，可能 會造成睾丸切除的機率約 80%以上","D":"大約 60%以上的睪丸扭轉的病人都曾經發生過急性睪 丸疼痛而且自己緩解","E":"青春期之前的小朋友如果發生陰囊急症，最常見的原 因是睾丸附件 (appendix testis) 或副睪附件 (appendix epididymis) 的扭轉"},"answer":"D","reference":"(110)/8.小兒泌尿/參考 資料(摘錄自)： Campbell-Walsh Urology, 11th edition ; 2016: p.3388–p.3392","sourcePage":304},{"id":"8-010","category":"小兒泌尿","categoryOrder":8,"number":10,"question":"下列有關夜間遺尿(Nocturnal enuresis)的描述何者錯誤?","options":{"A":"兒童的夜間遺尿的致病機轉主要牽涉到三個器官是: 膀胱的夜間容量減少及腦部的喚醒中樞不成熟及腎臟 的夜間多尿(因抗利尿激素不足)","B":"五歲的小朋友發生夜間遺尿的機率約 30%左右，不過隨 著年齡增長每年約 15%的小朋友會自行緩解","C":"夜間遺尿分為兩種，一種是單一症狀的夜間遺尿 (MSE) ，另一種是非單一症狀的夜間遺尿(NMSE)","D":"以 Desmopressin 治療夜間遺尿，約 30%的病人會完全 改善不會尿床，約 40%的病人會明顯的改善而減少尿床 次數","E":"根據 ICCS (international children continence society) 的定義:兒童的夜間多尿(nocturnal polyuria)的定義是，夜間的總尿量大於預估的膀胱容 量(根據年齡估算)的 130%"},"answer":"B","reference":"(110)/8.小兒泌尿/參考 資料(摘錄自)： Campbell-Walsh Urology, 11th edition ; 2016: p.3311–p.3316","sourcePage":304},{"id":"8-011","category":"小兒泌尿","categoryOrder":8,"number":11,"question":"下面有關於雙套輸尿管合併輸尿管囊腫(ureterocele)或 異位輸尿管(ectopic ureter)的敘述何者錯誤? 資","options":{"A":"治療這類病人的目標:是改善阻塞，避免逆流以及防止 R 感染造成腎功能的破壞","B":"輸尿管囊腫在經過尿道切開術手術之後，發生逆流的 機率約是 0%至 50%","C":"膀胱內的輸尿管囊腫(intravesical ureterocele) 接 受經尿道切開術的預後，比膀胱外的輸尿管囊腫 (extravesical ureterocele)接受經尿道切開術的預 後較差","D":"同側兩條輸尿管的吻合術是治療雙套輸尿管的手術選 項之一","E":"在執行矯正雙套輸尿管的手術，要盡量避免在進入膀 胱肌肉層的兩條輸尿管上做分離的動作"},"answer":"C","reference":"(110)/8.小兒泌尿/參考 料(摘錄自)：Curr Urol ep. 2018;19(2):14","sourcePage":305},{"id":"8-012","category":"小兒泌尿","categoryOrder":8,"number":12,"question":"下列有關於診斷兒童下泌尿道功能異常(LUTD)的描述何者 錯誤? 資","options":{"A":"排尿日誌是一項診斷兒童下泌尿道功能異常的最有用 C 的工具之一 U","B":"為了診斷兒童下泌尿道功能異常，我們在執行身體檢 2 查時特別要注意下背部是否有不正常的皮膚表徵 (cutaneous manifestations)，是為了排除脊椎閉鎖 不全這類疾病","C":"尿流速測定(uroflowmetry)可以提供病患尿流量曲線 及尿流速，可以初步評估膀胱的排尿的功能","D":"兒童的夜間遺尿(尿床)如果合併白天的下泌尿道功能 異常的症狀，就稱為是非單一症狀的夜間遺尿 (NMSE)，這類病童大約佔所有夜間遺尿兒童的 10%左右","E":"膀胱超音波檢查可以評估膀胱容量及餘尿，並且可以 同時觀察到直腸是否有大便過於囤積的問題"},"answer":"D","reference":"(110)/8.小兒泌尿/參考 料(摘錄自)： ampbell-Walsh rology , 11th Edition ; 016: p.3306-p.3316","sourcePage":305},{"id":"8-013","category":"小兒泌尿","categoryOrder":8,"number":13,"question":"三歲的翔翔最近剛成功戒除尿布，某天在馬桶前小便時， 媽媽突然發現翔翔的龜頭上有兩個開口，但尿液只從比較 資 偏腹側的開口出來。以下敘述何者錯誤？ C","options":{"A":"診斷為尿道下裂(hypospadias) 1","B":"跟胚胎時期尿道板(urethral plate)缺血可能有關","C":"有可能合併其他先天構造異常，其中以膀胱輸尿管逆 流(vesicoureteral reflux)最常見","D":"膀胱尿道內視鏡是必要檢查","E":"通常有症狀才需要治療"},"answer":"A","reference":"(110)/8.小兒泌尿/參考 料(摘錄自)： ampbell-Walsh Urology, 2th Edition, pp883-884","sourcePage":305},{"id":"8-014","category":"小兒泌尿","categoryOrder":8,"number":14,"question":"17 歲的小宇從小就有小便速度慢及便秘的問題，過去不覺 得困擾所以不曾就醫，最近由於症狀變嚴重，因此到泌尿 資 科求診。身體檢查發現下背臀上的皮膚顏色較深且有明顯 C 毛髮，尿流速檢查顯示尿量 433mL，最大尿流速 15.7mL/s，1 平均尿流速 7.8mL/s，以下關於診斷評估的敘述何者正確？","options":{"A":"必須安排脊髓電腦斷層排除脊髓病兆","B":"脊髓病兆的位置可預測神經性膀胱的型式","C":"必須安排尿路動力學檢查來預測上泌尿道受損的風險","D":"若是小宇膀胱收縮力已受損甚至完全無收縮力 (absent activity)，則未來腎臟功能受損機率非常高","E":"大都為良性病兆直接壓迫神經，只要手術完全切除病 兆，很有機會恢復"},"answer":"C","reference":"(110)/8.小兒泌尿/參考 料(摘錄自)： ampbell-Walsh Urology, 2th Edition, ch34","sourcePage":306},{"id":"8-015","category":"小兒泌尿","categoryOrder":8,"number":15,"question":"10 歲的小裕大概一個多月前發現左邊陰囊腫大，晚上最 腫，早上睡醒會稍微消腫。身體檢查發現疑似陰囊積水， 資 超音波檢查顯示左側陰囊積水(hydrocele)且在睪丸內有 C 一個大概 0.7x0.9cm 的腫瘤，AFP 及 Beta-HCG 抽血數值皆 1 正常。以下關於小裕睪丸腫瘤的診斷及治療之敘述何者有 p 誤?","options":{"A":"最有可能是畸胎瘤(teratoma)","B":"手術必須經由 inguinal approach","C":"手術中必須採集腫瘤組織送冰凍切片(frozen section)做再次確認","D":"若為良性腫瘤可單純切除腫瘤，保留正常睪丸組織","E":"陰囊積水應為次發於睪丸腫瘤之陰囊積水(secondary hydrocele)，不需要特別處理"},"answer":"E","reference":"(110)/8.小兒泌尿/參考 料(摘錄自)： ampbell-Walsh Urology, 2th Edition, p1121-1125","sourcePage":306},{"id":"8-016","category":"小兒泌尿","categoryOrder":8,"number":16,"question":"學生健康檢查發現 12 歲的小志有左側精索靜脈曲張，體檢 醫師開了轉診單請小志來泌尿科門診評估。身體檢查發現 資 左側有 grade III 精索靜脈曲張(varicocele)，小志主訴 C 沒有任何不舒服的症狀。以下關於精索靜脈曲張之敘述何 1 者有誤？","options":{"A":"青少年之盛行率和成年男性差不多","B":"比較高瘦的青少年比較常見","C":"有可能造成患側睪丸生長速度較慢","D":"睪丸大小可用來預測精液的品質，評估精索靜脈曲張 對於未來生育能力的影響","E":"陰囊水腫(hydrocele)是精索靜脈曲張手術最常造成 的併發症"},"answer":"D","reference":"(110)/8.小兒泌尿/參考 料(摘錄自)： ampbell-Walsh Urology, 2th Edition, pp899-902","sourcePage":306},{"id":"8-017","category":"小兒泌尿","categoryOrder":8,"number":17,"question":"關於小兒隱睪症，下列敘述何者較為恰當？","options":{"A":"繼發性隱睪症（secondary cryptochidisum）的定義 是出生時睪丸未正常下降，後來自動下降並未手術， 但隨後發現睪丸不在陰囊正確位置內","B":"根據 2021 EAU guideline 對於摸不到的睪丸, 核磁共 振與超音波等影像檢查通常能提供的資訊有限，另超 音波也缺乏診斷的敏感度，所以上述影像檢查並未普 遍被建議","C":"若是摸不到睪丸，大部分應是萎縮掉了而非在腹部裡 面","D":"若是一開始摸不到睪丸，病人需要做進一步診斷，沒 有其他理學檢查優先於腹腔鏡檢查","E":"最佳的睪丸固定手術時機建議是 6-18 個月，手術後有 研究證實比起控制組，可以改善精子數目也能使受孕 率變好"},"answer":"B","reference":"(110)/8.小兒泌尿/參考 資料(摘錄自)： Campbell-Walsh Urology 12th，ch46, p949, 959,960, 972 EAU2021 pediatric guidline, 3.2.2.2, 3.2.3.3 image study","sourcePage":307},{"id":"8-018","category":"小兒泌尿","categoryOrder":8,"number":18,"question":"在手術前關於尿道下裂評估下列敘述何者為非？","options":{"A":"病人若合併有隱睪症(cryptochidism)或者性器模稜 兩可(ambiguous genitalia)，要做檢查排除性分化失 調(DSD: disorder of sexual differentiation)","B":"75-80%是遠端型（distal type）會以尿道開口的位置 來區分嚴重度","C":"若術前病人龜頭部分太小（<14mm）則建議給予雄性素 治療，有使用時要注意下列的副作用（情緒起伏、掉 毛、持續勃起、貧血）直到停藥後 3 個月","D":"GMS 尿道下裂分數（The GMS(glans/meatus/shaft) hypospadias score）可用來評估嚴重度，然而因為其 中對於陰莖腹側彎曲（ventral curvature）的程度不 太準確，所以後來通常在手術術中記錄用","E":"小孩開始對生殖器有意識始於 18 個月，所以能在 12 個月前手術能減少他們的焦慮與改善性心理的預後"},"answer":"C","reference":"(110)/8.小兒泌尿/參考 資料(摘錄自)： Campbell-Walsh Urology 12th，ch45,p907, 908, 910","sourcePage":307},{"id":"8-019","category":"小兒泌尿","categoryOrder":8,"number":19,"question":"尿道下裂手術術後，預後的評估也會參考病人自己的評 分，關於評分表 Hypospadias Objective Penile Evaluation (HOPE) Score，以下何者不是其中的項目","options":{"A":"尿道開口的位置 （Position of meatus）","B":"龜頭的大小 (Size of glans)","C":"龜頭的形狀 (Shape of glans)","D":"包皮的形狀 (Shape of skin)","E":"陰莖的旋轉 (Torsion)"},"answer":"B","reference":"(110)/8.小兒泌尿/參考 資料(摘錄自)： Campbell-Walsh Urology 12th, ch45, p 943","sourcePage":307},{"id":"8-020","category":"小兒泌尿","categoryOrder":8,"number":20,"question":"對於有神經性排尿功能障礙(neurogenic voiding dysfunction)的病童中，其臨床處置及建議以下何者錯 誤？","options":{"A":"教導有逼尿肌外尿道括約肌共濟失調(detrusor sphincter dyssynergia)合併輸尿管膀胱逆流的孩童 以 Credé maneuver 幫助排空膀胱，避免壓力過高而逆 流","B":"給予膀胱過動(overactive bladder)的孩童口服 Oxybutin，起始劑量為 0.2mg/kg 一天兩次","C":"開立 Pseudoephedrine 給因膀胱出口阻力低下而導致 漏尿的孩童，起始劑量為 0.4mg/kg 一天兩次","D":"建議膀胱順應性(compliance)差的孩童膀胱內肉毒桿 菌(Botulinum toxin)注射，建議劑量為 5 to 12 IU/kg，上限 360IU","E":"建議膀胱容量小、順應性差且保守性治療效果不佳的 孩童接受膀胱擴大手術(augmentation cystoplasty)"},"answer":"A","reference":"(110)/8.小兒泌尿/參考 資料(摘錄自)：Campbell 12ed, Chapter 34, Neuromuscular Dysfunction of the Lower Urinary Tract in Children, p632-639","sourcePage":308},{"id":"8-021","category":"小兒泌尿","categoryOrder":8,"number":21,"question":"關於小兒尿道下裂，何者正確?","options":{"A":"妊娠 8 至 12 週負責陰莖正常發育的主要媒介物質為 testosterone","B":"隱睪症(cryptorchidism)為最常與尿道下裂合併出現 之先天異常","C":"多數患者尿道異位開口(etopic urethral meatus)於 陰莖遠端，其合併發生性發展障礙 (disorder of sexal development)的機率與近端異位者相當","D":"計畫接受手術治療的青春期前患者，術前給予睪固酮 補充(testosterone cypionate)可降低術後併發症的 機率","E":"成人接受尿道下裂之手術，術後產生併發症之機率較 兒童來的低"},"answer":"D","reference":"(110)/8.小兒泌尿/參考 資料(摘錄自)：Campbell 12ed, Chapter 45, Hypospadias, p905-910","sourcePage":308},{"id":"8-022","category":"小兒泌尿","categoryOrder":8,"number":22,"question":"下列有關單側腎臟發育不全(Unilateral renal agenesis) 的敘述，何者正確？","options":{"A":"對側輸尿管的異常不可能同時發生，如輸尿 管腎盂接合處阻塞、膀胱輸尿管逆流","B":"好發於女性(男：女=1：1.8)","C":"併發生殖道的異常(reproductive duct abnormalities)較常發生於男性","D":"約 20%的病人併有同側輸尿管的缺失","E":"腎臟的缺失較好發於左側"},"answer":"E","reference":"(110)/8.小兒泌尿/參考 資料(摘錄自)：Wein, A. (2016). Campbell-Walsh Urology. 11th ed. Philadelphia: Elsevier Saunders, Chapter 130 P.2980-2983","sourcePage":308},{"id":"8-023","category":"小兒泌尿","categoryOrder":8,"number":23,"question":"有關夜間遺尿症(nocturnal enuresis)，下列敘述何者正 確？","options":{"A":"單一症狀遺尿症(monosymptomatic enuresis)的治療 選項不包括行為治療(behavioral modification)、鬧 鈴治療(enuresis alarm)","B":"Desmopressin 鼻噴劑的劑型較不易造成水中毒(water intoxication)的副作用","C":"Oxybutynin 不可作為 Desmopressin 治療效果不佳的 合併用藥使用(combination therapy)","D":"“非單一症狀遺尿症”定義為遺尿症合併任何日間的 下泌尿道症狀(daytime LUTS)","E":"Imipramine 幾乎不會有心血管相關之副作用"},"answer":"D","reference":"(110)/8.小兒泌尿/參考 資料(摘錄自)：Wein, A. (2016). Campbell-Walsh Urology. 11th ed. Philadelphia: Elsevier Saunders, Chapter 143 P.3311-3315","sourcePage":309},{"id":"8-024","category":"小兒泌尿","categoryOrder":8,"number":24,"question":"下列有關小兒生殖泌尿相關疾病的敘述，何者正確？","options":{"A":"雙套輸尿管的患者中，上套輸尿管（upper moiety of ureter）較易發生膀胱輸尿管逆流(VUR)，而下套輸尿 管（lower moiety of ureter）較易發生輸尿管囊腫 （ureterocele）","B":"排泄功能障礙症候群（Dysfunctional elimination syndrome）不會導致孩童的泌尿道感染及 VUR 的產生","C":"治療睪丸扭轉執行去旋轉治療(detorsion manual) 時，應向內側旋轉(inwards rotation)","D":"單側腎臟未發育（unilateral renal agenesis）發生 率為右側大於左側，若發現男性單側腎臟未發育，同 側附睪也很可能異常","E":"睪丸附件扭轉(Torsion of the appendix testis)是 在青春期前的孩童睪丸疼痛最常見診斷，大部分不需 特別治療"},"answer":"E","reference":"(110)/8.小兒泌尿/參考 資料(摘錄自)：Wein, A. (2016). Campbell-Walsh Urology. 11th ed. Philadelphia: Elsevier Saunders, Chapter 122 P.2823-2848 Chapter 127 P.2933 Chapter 130 P2980-2981 Chapter 137 P3134-3172","sourcePage":309},{"id":"8-025","category":"小兒泌尿","categoryOrder":8,"number":25,"question":"有關小兒泌尿生殖系統疾病的敘述,下列何者正確?","options":{"A":"Ehlers-Danlos syndrome Williams Elfin facies syndrome 及 Menkes syndrome 皆和 congenital bladder diverticulum 無關","B":"無肛症（Imperforate anus)患者很少會合併排尿障 礙，如逼尿肌過動和逼尿肌尿道外括約肌共濟失調","C":"外陰性別不明（Ambiguous genitalia）最常見的成因 是混合性腺發育不良（mixedgonad dysgenesis）","D":"Hutch diverticulum 是指 peri-ureter 的 diverticulum，隨著時間進展可能破壞抗逆流機制， 在一些 matched control study 中，膀胱輸尿管逆流 是否合併 Hutch diverticulum 不影響膀胱輸尿管逆流 自行改善的機會","E":"腹內隱睪症（Abdominal cryptorchidism）和副睪解 剖構造異常無關"},"answer":"D","reference":"(110)/8.小兒泌尿/參考 資料(摘錄自)：Wein, A. (2016). Campbell-Walsh Urology. 11th ed. Philadelphia: Elsevier Saunders, Chapter 137, p3151 Chapter 138, P3178 Chapter 142, p3290 Chapter 148, p3442","sourcePage":309},{"id":"8-026","category":"小兒泌尿","categoryOrder":8,"number":26,"question":"關於發生在小兒的神經母細胞瘤（Neuroblastoma），下列 敘述何者錯誤?","options":{"A":"MYCN 基因片段放大為不良預後因子，出現在約 20%的 病人","B":"患病小於一歲為良好預後因子","C":"若腫瘤生長在骨盆腔，則為良好預後因子","D":"約 30%的病人診斷時同時有轉移病灶","E":"大多數(大於 80%)的病人在 5 歲前即被診斷"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th p 1087-1110","sourcePage":310},{"id":"8-027","category":"小兒泌尿","categoryOrder":8,"number":27,"question":"關於小兒泌尿系統影像檢查的敘述，下列何者正確?","options":{"A":"對於小兒隱睪(undescended testis)，超音波為檢測 的良好工具，具有診斷以及定位的高敏感性","B":"在超音波檢查下發現有腎臟腫瘤，可根據腫瘤相對應 的好發年紀來診斷，考量到輻射劑量對於小兒的影 響，通常不建議進一步接受含顯影劑電腦斷層檢查","C":"若超音波呈現膀胱壁增厚合併鑰匙孔徵象(keyhole sign)伴隨雙側腎盂輸尿管積水，表示病人可能有膀胱 腫瘤導致的下泌尿道阻塞","D":"腎臟皮質攝影(DMSA renal cortical scintigraphy) 可用來檢測急性腎臟感染及不可逆的腎臟皮質疤痕 (renal scar)，通常在治療後六個月檢查可檢測出絕 大多數的固定腎臟疤痕","E":"根據 Society for Fetal Urology (SFU)的腎盂積水分 級，第三級為腎盞積水擴張並合併腎實質變薄"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th Chapter 24, P412 P418 P405-406, P409","sourcePage":310},{"id":"8-028","category":"小兒泌尿","categoryOrder":8,"number":28,"question":"關於皺梅腹症候群(Prune belly syndrome)的敘述，下列 何者錯誤?","options":{"A":"此症候群有三大表徵，為腹部肌肉缺損、男性雙側隱 睪、泌尿道重度畸形","B":"輸尿管異常以膨脹、曲折為表現，且輸尿管近端異常 少於遠端異常","C":"約有 75%的病人伴有膀胱輸尿管逆流(vesicoureteral reflux)","D":"膀胱異常多以大量擴張及臍尿管處假性氣室 (pseudodiverticulum)表現，且八成以上伴隨有解尿 困難及殘尿過多的問題","E":"若合併膀胱開口阻塞，建議盡早施行恥骨上膀胱造廔 引流尿液"},"answer":"D","reference":"(111) Campbell-Walsh Urology 12th Chapter 32, P581-2, 591","sourcePage":310},{"id":"8-029","category":"小兒泌尿","categoryOrder":8,"number":29,"question":"對於小兒生殖泌尿系統的胚胎發育，下列何者錯誤?","options":{"A":"在第四周至第六周期間，內胚層泄殖腔會被泌尿直腸 隔膜(Urorectal septum)分為泌尿生殖竇(Urogenital sinus)以及肛門直腸管(Anorectal canal)","B":"後腎(metanephros)在第六周開始會由骶骨區向腰椎 區移動，如果在上移前兩側腎臟下極發生融合，所產 生馬蹄腎(horseshoe kidney)，會因受到下腸繫膜動 脈(inferior mesenteric artery)的阻擋而無法移至 正確位置","C":"約在第八到十二周，睪固酮就會刺激副中腎管 (paramesonephric duct)形成副睪、輸精管及儲精囊","D":"後腎(metanephros)形成後，於第十周會開始產生尿 液，此時若有下泌尿道的異常就開始顯現","E":"胎兒的腎臟於第二十二至二十四周建立腎臟外側皮質 以及內側髓質，前者約占胎兒出生時腎臟總體 70%"},"answer":"C","reference":"(111) Campbell-Walsh Urology 12th Chapter 20, P318, 330-339","sourcePage":310},{"id":"8-030","category":"小兒泌尿","categoryOrder":8,"number":30,"question":"關於尿道下裂，下列敘述何者正確?","options":{"A":"約 75%-80%的為近端尿道下裂","B":"相較於近端尿道下裂，遠端尿道下裂合併小兒隱睪比 例較高，合併出現需安排染色體檢查及後續檢查排除 性發展障礙","C":"不建議常規執行 voiding cystourethrogram 以及 renal bladder ultrasound 輔助檢查","D":"早期修復(一歲之前)接受手術修復容易造成性心理發 展異常","E":"若病人龜頭直徑為 16mm，此為手術併發症的危險因子"},"answer":"C","reference":"(111) Campbell-Walsh Urology 12th Chapter 45, P907, P908, P910 P945","sourcePage":311},{"id":"8-031","category":"小兒泌尿","categoryOrder":8,"number":31,"question":"關於小兒神經性膀胱(Neurogenic bladder)，下列何者錯 誤?","options":{"A":"在兒童中，神經性逼尿肌-括約肌功能障礙 (Neurogenic detrusor-sphincter dysfunction) 最 常見的原因是骨髓增生異常(myelodysplasia )","B":"神經性逼尿肌-括約肌功能障礙 (Neurogenic detrusor-sphincter dysfunction) 可能導致不同形 式的下尿路功能障礙(LUTD)，並最終導致失禁、尿路 感染、膀胱輸尿管逆流(VUR)，而且會造成腎臟瘢痕 (Renal scar)","C":"與膀胱增大(bladder augmentation)相比，對於抗膽 鹼能藥物難治的兒童，使用尿路上皮下 (suburothelial)或逼尿肌內(intradetrusoral)注射 肉毒桿菌毒素 A (onabotulinum toxin A)是一種替代 且侵入性較小的選擇","D":"泌尿道感染在患有神經性膀胱的兒童中很常見，為了 預防腎臟瘢痕(Renal scar)，有無症狀都要治療的尿 路感染","E":"對抗膽鹼藥物(anticholinergics)無效的兒童，肉毒 桿菌(botulinum toxin)注射到逼尿肌中，已經被證明 對臨床症狀上和尿動力學結果都有益處"},"answer":"D","reference":"(111) 參考資料(摘錄自)： 2022 EAU guidelines Paediatric Urology 3.12.7. (D) 泌尿道感染在患有神 經性膀胱的兒童中很常 見,但是治療只有有症狀 的尿路感染才需要治療。","sourcePage":311},{"id":"8-032","category":"小兒泌尿","categoryOrder":8,"number":32,"question":"關於尿道下裂手術修補併發症下列何者為非？","options":{"A":"尿道下裂手術併發症可以由尿道整形術成效與皮膚修 補兩個方面來評估","B":"最為常見的併發症為尿道皮膚廔管，長期追蹤發生率 小於百分之十，但即使完善修補修後，仍有百分之二 十的再發生率","C":"尿道口狹窄的定義為阻塞尿路症狀併客觀尿道狹窄， 青春期前小於 8Fr、青春期後小於 12Fr","D":"反覆陰莖彎曲定義為殘存背側、腹側或側彎超過 30 度，再次手術時必須完全撕脫(degloving)包皮併人工 勃起確認情況","E":"Lichen 硬化腫塊在大部分的案例中保守治療是有效 的，因小兒會在發育過程中逐漸軟化緩解，少部分案 例需手術切除"},"answer":"E","reference":"(111) 參考資料： Campbell 12th Ch45,p934~941 (E)大部分需要手術治療","sourcePage":312},{"id":"8-033","category":"小兒泌尿","categoryOrder":8,"number":33,"question":"關於小兒夜間遺尿，下列何者為非？","options":{"A":"此症狀是有強烈的基因相關性，目前有證據與染色體 12、13、22 相關","B":"病生理學上與大腦控制睡眠、膀胱夜間容量、腎臟夜 間多尿相關","C":"評估上區分單症狀夜間遺尿與非單症狀夜間遺尿非常 重要，會影響到後續治療選擇","D":"在單症狀夜間遺尿在行為治療效果不佳時，如評估為 夜間多尿、膀胱容量正常時，首選治療為抗膽鹼藥物 (anti-cholinergic)治療","E":"當 DDAVP 治療失敗後，可以嘗試與定時警示(alarm therapy)治療或抗膽鹼藥物(anti-cholinergic)共同 使用來增進治療效果"},"answer":"D","reference":"(111) 參考資料： Campbell 12th ch.35 p660~p665 (D) 夜間多尿治療為 DDAVP","sourcePage":312},{"id":"8-034","category":"小兒泌尿","categoryOrder":8,"number":34,"question":"當兒童有排空膀胱功能異常併神經性膀胱功能異常時，以 下策略何者為非?","options":{"A":"主要尿路動力學原因有三種:膀胱收縮不良、迫尿肌括 約肌協同不良、去神經化","B":"當原因是膀胱收縮不良時，可以使用間歇性導尿、夜 間導管置入引流","C":"當原因是膀胱收縮不良且初步處理效果不佳時，可以 嘗試做膀胱擴大整形術、尿路分流或肉毒桿菌注射","D":"當原因是迫尿肌括約肌協同不良時，可以使用毒蕈鹼 阻斷劑(anti-muscarinic)作為治療","E":"當原因是迫尿肌括約肌協同不良且初步處理效果不佳 時，可以嘗試神經調節(neuromodulation)治療"},"answer":"C","reference":"(111) 參考資料： Campbell 12th Ch34,p626, table34.2 (C) 應使用神經調節 (neuromodulation)接續 治療","sourcePage":312},{"id":"8-035","category":"小兒泌尿","categoryOrder":8,"number":35,"question":"下列關於小兒微創手術（minimally invasive surgery），( 何者正確? C","options":{"A":"腹腔鏡手術後會減弱發炎反應，因此若腹腔鏡手術不 U 慎有內臟損傷可能沒有伴隨典型的 peritoneal sign e","B":"在小兒腹腔鏡手術，即便是<10mmHg 的氣腹壓力，都可 C 能明顯的改變心臟 preload 及 afterload。在經食道心 A 臟超音波可觀察到左心室射出率（LVEF）大幅下降","C":"Hypercapnia 會造成腦部灌流增加，研究發現，手術中 若能維持正常的血中二氧化碳濃度，比較不會有腦內 壓增加的現象。因此手術中監測 end tidal CO2 是一 項重要的指標","D":"小兒術前 Hostile abdomen index 評估 2-4 分，代表 有較高發生出血及需要腸造口的風險，術前應盡告知 義務","E":"由於小兒體型很小，5mm 的 trocar port 都還是會發生 omental hernia， 因此建議 3mm 以上的 trocar port B 都需要確實關閉 C h 是 D E 管"},"answer":"A","reference":"111)/ ampbell-Walsh rology 12th dition hapter 27 P462-469 . A diminished postoperative inflammatory response may result in postoperative complications such as visceral injury presenting without peritoneal signs. （P468） . 會改變 preload afterload 但是不會影響 cardiac performance， 不會改變 LVEF . 即便沒有觀察到 ypercapnia，腦部灌流還 會增加，目前機制未知。 . 3-4 分 . 建議小兒所有 port 不 大小都要關","sourcePage":313},{"id":"8-036","category":"小兒泌尿","categoryOrder":8,"number":36,"question":"以下關於小兒膀胱發育異常，何者錯誤？ (","options":{"A":"若在胎兒 12 週大時，超音波下若沒有發現膀胱，建議 C 可以 15-20 分鐘再掃一次 U","B":"膀胱發育不全(bladder agenesis)發生率約 e 1:600,000，女生為主。少數活產嬰兒全部都有異位性 C 輸尿管(ectopic ureter)","C":"巨大膀胱(megacystis)的鑑別診斷需區分阻塞性 ( (obstructive)及非阻塞性(non-obstructive)，其中以 ( 尿道閉鎖及狹窄(urethral atresia/stenosis)為最常 ( 見原因 a","D":"囊性膀胱炎(Cystitis cystica)為一種慢性發炎的表 ( 現，最好的治療是長期服用抗生素 (","E":"小兒出血性膀胱炎(hemorrhagic cystitis)常常和血 液惡性疾病使用 cyclophosphamide 及 ifosfamide 有 關。及早發現，減少尿管刺激及口服 sodium pentosan polysulfate 可作為治療"},"answer":"C","reference":"111)/ ampbell-Walsh rology 12th dition hapter 30 P.518-526 1) 對 2) 對 3) 以 PUV 為最大宗 57%， tresia 及 stenosis 僅 7% 4) 對 P526 5) 對 P526","sourcePage":313},{"id":"8-037","category":"小兒泌尿","categoryOrder":8,"number":37,"question":"下列關於小兒結石，何者錯誤?","options":{"A":"小兒結石以草酸鈣結石為主，與大人相仿。而單純尿 酸(pure uric acid)結石卻比較少見","B":"有代謝性異常(metabolic abnormality)的兒童相較一 般兒童有 5 倍的結石復發風險","C":"原發型高草酸鹽尿症(Primary hyperoxaluria)是罕見 的遺傳性腎臟代謝疾病，其特點是腎臟中草酸排除過 多與鈣鹽結石形成增加，並發展為腎結石和慢性腎病","D":"胱氨酸尿症 Cystinuria 是一種體隱性遺傳，由於 SLC3A1 or SLC7A9 gene 突變導致近端腎小管胺基酸運 輸蛋白缺陷，再吸收下降，導致 cystine 的排出增加","E":"使用 D-penicillamine 治療 cystinuria 可減少雙硫鍵 的形成，減少胱胺酸(Cystine)六角形結晶。副作用 多，需積極監測銅及鋅濃度"},"answer":"C","reference":"(111)/ Campbell-Walsh Urology 12th edition Chapter 43 P.854-870 (A) 對 (B) 對 (C) 是肝臟代謝疾病， liver overproduction P858 (D) P859 (E) P870","sourcePage":314},{"id":"8-038","category":"小兒泌尿","categoryOrder":8,"number":38,"question":"以下哪一項不符合小兒高風險腎臟外傷（high risk criterion of renal trauma）的敘述？","options":{"A":"同側輸尿管在 CT 分泌期(excretory phase) 未顯影","B":">25%的腎臟實質壞死（devitalized）","C":"腎臟周圍血腫>3.5 公分","D":"動脈期(Arterial phase) CT 時血管周圍顯影劑外滲","E":"腎臟內側在 CT 分泌期(excretory phase)發現顯影劑 外滲"},"answer":"C","reference":"(111)/ Campbell Review 12th edition Chapter 52 P177 Campbell-Walsh Urology 12th Edition Chapter 52 P1069 C >2.2cm(小兒)","sourcePage":314},{"id":"8-039","category":"小兒泌尿","categoryOrder":8,"number":39,"question":"關於 Matthew et al.對小兒 Exstrophy- Epispadias complex 病患做膀胱黏膜切片的發現，何者錯誤？","options":{"A":"做手術修補時間點，會影響膀胱黏膜病理變化","B":"此病患族群 uroplakin-II 顯現較低","C":"此病患族群 p63 顯現較高","D":"延遲修補和新生兒時期修補相比，會有較高鱗狀分化 (squamous metaplasia)的比例","E":"此研究有助於臨床手術修補的時間點選擇"},"answer":"C","reference":"(111)/ “Urothelial Differences in the Exstrophy- Epispadias Complex: Potential Implications for Management”Journal of Urology, 2021, 205(5), 1460-1465 (C) 顯現較低","sourcePage":314},{"id":"8-040","category":"小兒泌尿","categoryOrder":8,"number":40,"question":"有關下列組織胚胎來源，何者不是從 Urog
