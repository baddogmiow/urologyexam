egory":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":10,"question":"依目前的文獻記載，下列何種分子預測標記(molecular prognostic marker)和 ”淋巴轉移增加”與”存活降 低”有關?","options":{"A":"CDKN2A P","B":"TP53","C":"Squamous cell carcinoma antigen (TA-4)","D":"MMP-9","E":"Ki-67"},"answer":"B","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell’s Urology, 12th ed, Part VII, Chapter 79. .1759, Table 79.11","sourcePage":125},{"id":"4-011","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":11,"question":"下列有關於陰莖癌(Penile cancer)的敘述，何者是正確 的?","options":{"A":"危險因子包括沒有在新生兒期接受包皮環切術 (neonatal circumcision)、包皮嵌頓(paraphimosis)","B":"陰莖癌最常發生的位置是冠狀溝(coronal sulcus)","C":"主要擴散方式是經由淋巴系統，最先被侵犯的是骨盆 腔淋巴結(pelvic lymph node)","D":"陰莖癌可能分泌類副甲狀腺素胜肽 (PTH-related peptide)，在沒有骨轉移的清況下引發高血鈣 (hypercalcemia)","E":"在非肥胖病人，鼠蹊部觸診是診斷鼠蹊部淋巴結的 Gold standard，為了區分淋巴結腫脹是發炎或是轉 移，目前認為服用 6 週抗生素較細針抽吸細胞(fine needle aspiration)為佳"},"answer":"D","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition, p.1743-1756","sourcePage":125},{"id":"4-012","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":12,"question":"下列關於尿道癌(urethral cancer)的敘述，何者正確 ?","options":{"A":"尿道癌最常發生在 bulbar urethra","B":"尿道癌常經由淋巴直接轉移到遠處，區域淋巴結 (regional lymph nodes)的侵犯少見","C":"抽菸是尿道癌危險因子","D":"尿道癌之病理結果大多為鱗狀細胞癌 (squamous cell carcinomas)，其次是泌尿上皮癌(urothelial carcinomas)","E":"尿道狹窄病史與尿道癌無關"},"answer":"A","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh 12th edition, Chapter 80 p.1776,1777","sourcePage":126},{"id":"4-013","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":13,"question":"下列關於病毒相關的陰莖病灶(Virus-related penile lesions)，何者有誤?","options":{"A":"Condyloma acuminatum 與 bowenoid papulosis 都跟 HPV 的感染有關","B":"Kaposi sarcoma 被證明與 herpes virus 有強烈相關 聯","C":"Bowenoid papulosis 與 HPV type 16 有關，在組織學 上亦屬於 carcinoma in situ 且惡性度極高","D":"感染 HPV 的危險因子包含多重性伴侶、危險性行為、 以及抽菸","E":"HPV type 16 and 18 的致癌性跟 E6 與 E7 tumor virus transforming protein 關聯性最大"},"answer":"C","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh 12th edition, Chapter 79 p.1742,1743","sourcePage":126},{"id":"4-014","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":14,"question":"下列關於腎上腺切除術(Adrenalectomy)的各項敘述，何者 不正確?","options":{"A":"原發性高醛固酮症（Primary aldosteronism）若術前 確實有皮質醇(cortisol)分泌，術前應給予皮質醇 (cortisol)補充","B":"嗜鉻細胞瘤(Pheochromocytoma)術前應給予 α-adrenergic blockers 至少兩週","C":"嗜鉻細胞瘤術前若選擇 Phenoxybenzamine 這類 noncompetitive α-adrenergic blocker，宜直接與 beta blockers 合併使用，以避免心跳加速(rebound tachycardia)之副作用","D":"腎上腺切除術的適應症包括內分泌腫瘤(functional tumor)、疑似腎上腺癌及其他器官癌症之單一轉移","E":"腫瘤大小是決定是否手術的重要因素，大於 6 公分的 腫瘤有 25%是惡性"},"answer":"C","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell- Walsh Urology 12th edition, Chapter 107 p.2409-2410","sourcePage":126},{"id":"4-015","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":15,"question":"一位 34 歲右側睪丸胚胎性癌(100% embryonal carcinoma) 病人為 clinical stage IIIA，根據 IGCCCG criteria 分 類為 good risk，接受初步化療(3 cycles of bleomycin\u0002etoposide-cisplatin)之後，腫瘤指數皆正 常，追蹤電腦斷層可見主動脈腔內區域有一個 1.7 cm 的腫 塊（診斷時為 4.8 cm）、在主動脈旁區域有一個 0.8 cm 的 腫塊（診斷時為 2.3 cm），雙側肺部也有結節，右下葉為 0.6 cm (診斷時為 1.4 cm）、左上葉為 0.8 cm (診斷時為 1.6 cm)。請問下一步處置何項最恰當?","options":{"A":"二線化療: Vinblastine-ifosfamide-cisplatin","B":"二線化療: Etoposide-Cisplatin","C":"盡量切除剩餘腫瘤，含雙側後腹腔淋巴清除","D":"肺部結節做 CT-guided biopsy","E":"先觀察，半年後追蹤腫瘤指數及電腦斷層"},"answer":"C","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)：按 照 NCCN guideline version 2.2021，","sourcePage":127},{"id":"4-016","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":16,"question":"以下關於 adrenal tumor 評估的敘述，何者正確?","options":{"A":"傳統上大於 6cm 有可能為 malignancy 應該考慮切除， 但目前許多專家討論的結果是以 4cm 為界限，特別是 老年人","B":"應注意 follow 腫瘤的生長速度，特別是生長超過 20% diameter (且>5mm)時，有超過一半的病人都是 malignant","C":"是 malignancy 的機會跟年齡是有關的，愈年長， malignancy 的機會愈高","D":"Gd MRI wash out study 的診斷效果比較差, CT contrast wash out 才是 gold standard","E":"Non-contrast CT 上看 tumor <10HU 基本上就確定是 adrenal cortical adenoma, 不需要再做 metabolic workup"},"answer":"D","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell Urology 12th ed, chapter 106","sourcePage":127},{"id":"4-017","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":17,"question":"下列關於 adrenal cortical carcinoma 的描述，何者正 確？","options":{"A":"鮮少是 hormonally active(少於 5%)","B":"在 MRI 經常是 homogenous intensity, 但是 heterogenous enhancement","C":"有時會有 local vascular thrombosis，見於 pathologic examination，image survey 是看不到的","D":"FDG PET CT 可以幫忙鑑別區分它和 cortical adenoma, 但 sensitivy=60%, specificity=100%","E":"通常診斷是綜合臨床和影像的證據來的"},"answer":"E","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell Urology 12th ed, chapter 3","sourcePage":127},{"id":"4-018","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":18,"question":"關於 Kaposi sarcoma 的敘述，何者是錯誤的？","options":{"A":"目前分成四種，其中 classic Kaposi sarcoma 指的是 因為 immunosuppressant 藥物造成的","B":"因為 immunosupressant 藥物造成的 Kaposi sarcoma，通常在藥物調整後就可以縮小","C":"Kaposi sarcoma 會發生在 penis，在 homosex 的 AIDS 病人是有比較高的關聯的","D":"Penile Kaposi sarcoma 目前已知和 human herpes virus 8 有蠻高的關聯性","E":"除手術外，也可以用 radiation 或是 Nd-YAG laser"},"answer":"A","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell Urology 12th ed, chapter 79","sourcePage":128},{"id":"4-019","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":19,"question":"下列有關於腎上腺皮質於出生時之敘述，何者為是？","options":{"A":"包含了胚胎及成人的組成成分","B":"已經完全發育","C":"重量大約只有成人時期的一半","D":"在一歲前會持續增大","E":"只含有單一組織帶( histologic zone)"},"answer":"A","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.106, P2354-2355","sourcePage":128},{"id":"4-020","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":20,"question":"下列有關於低劑量 dexamethasone 抑制測驗(Low-dose dexamethasone suppression test, LD-DST)之敘述，何者為是？","options":{"A":"午夜時測量唾液皮質醇(cortisol)濃度","B":"請病人於晚上 11 點服用 10mg dexamethasone 後於隔 日早晨測量尿液皮質醇濃度","C":"請病人於晚上 11 點服用 1mg dexamethasone 後於隔日 早晨測量血液皮質醇濃度","D":"病人服用 1mg dexamethasone 後留測 24 小時尿液皮質 醇","E":"住院接受 1mg dexamethasone 點滴注射後每六小時測 量血液皮質醇濃度"},"answer":"C","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.106, P2364","sourcePage":128},{"id":"4-021","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":21,"question":"患有嗜鉻細胞瘤(Pheochromocytoma)的病人有可能出現哪 些基因突變，以下何者為非?","options":{"A":"RET (REarranged during Transfection ) 致癌基因","B":"VHL（von Hippel-Lindau）腫瘤抑制基因","C":"雄性素受體基因(Androgen receptor gene)","D":"MAX（MYC 相關因子 X）","E":"第 1 型神經纖維瘤病(Neurofibromatosis type I)"},"answer":"C","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： NEJM, 381(6) , 2019: p554","sourcePage":128},{"id":"4-022","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":22,"question":"有關下列敘述，何者非陰莖鱗狀上皮癌之危險因子？","options":{"A":"吸菸","B":"人類乳突病毒(HPV)感染","C":"包莖(Phimosis)","D":"淋病(gonorrhea)","E":"以上皆是"},"answer":"D","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.79, P1743","sourcePage":129},{"id":"4-023","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":23,"question":"二十四歲男性主訴右側陰囊無痛性腫塊，陰囊超音波顯示 右側睪丸內實質腫塊，左側無異狀。血清腫瘤指標顯示 hCG: 96mU/mL(上限:<5mU/mL); AFP: 58ng/mL(上限: <11ng/ML)。請問下列何者為最正確之組織學診斷？","options":{"A":"純畸胎瘤(pure teratoma)","B":"純精母細胞瘤(pure seminoma)","C":"純胚胎性癌(pure embryonal carcinoma)","D":"卵黃囊瘤(pure yolk sac tumor)","E":"絨毛膜癌(choriocarcinoma)"},"answer":"C","reference":"((110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.76, P1686","sourcePage":129},{"id":"4-024","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":24,"question":"一位 33 歲男性來到你的門診，無過去病史，主訴於半年前 開始體重減輕，偶有乾咳的情況。最近幾週愈發容易覺得 呼吸費力，常常覺得胸痛且偶而會有發燒。胸腔電腦斷層 檢查發現於前縱膈腔有一超過十公分大的腫瘤向右側肺葉 擠壓造成支氣管狹窄合併肋膜腔積水，陰囊超音波檢查未 發現異常，抽血檢驗發現甲型胎兒蛋白(AFP): 7674 ng/mL、絨毛膜促性腺激素(β-HCG): < 5 mIU/mL、乳酸脫 氫酶(LDH):403 IU/L，針對接下來的檢查與治療，何者為 非？","options":{"A":"睪丸評估沒有異常的情況之下，可直接開始化療，不 需要切片確認診斷","B":"化學治療的效果良好，五年存活率可達 80%","C":"Ifosfamide/Etoposide/Cisplatin 四個 cycles 在肺 功能不好的病人為第一線化療藥物的選擇","D":"腫瘤組織在顯微鏡下以蘇木精-伊紅染色(H&E stain) 有機會觀察到 Schiller-Duval Body","E":"第一線化療過後若有剩餘的腫瘤則須在第二線化療之 前以手術清除剩餘腫瘤"},"answer":"B","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell Urology 12th edition, Chap76, p1688, p1682, p1697, p1684, p1698","sourcePage":129},{"id":"4-025","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":25,"question":"關於陰莖癌的患者接受腹股溝淋巴結廓清術(Inguinal lymph node dissection, ILND)，以下敘述何者為非？","options":{"A":"對於 T stage 為 T1b 但摸不到淋巴結的病人，可依據 原病灶在陰莖上的位置選擇做單側或雙側的 Modified ILND","B":"Modified ILND 相較於 Standard ILND，保留了隱靜脈 (saphenous vein)","C":"摸不到腹股溝淋巴結的病人中也有大約 25%的病人有 淋巴轉移","D":"病理結果在左側腹股溝取到 3 顆有轉移的淋巴結且有 淋巴結外侵犯(Extranodal extention)，則接下來必 須考慮做左側的骨盆腔淋巴結廓清術","E":"若一開始在雙側腹股溝皆摸到可移動的淋巴結，且切 片後確認為淋巴轉移，則應該在淋巴結廓清術前先行 投與 TIP regimen 做化學治療"},"answer":"A","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell Urology 12th edition Chap81, p1790, p1792, p1794 NCCN guideline version 1.2021, penile cancer","sourcePage":130},{"id":"4-026","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":26,"question":"關於庫欣氏症候群(Cushing syndrome), 以下何者為是？","options":{"A":"過量使用類固醇會導致外因性庫欣氏症候群 (Exogenous Cushing syndrome)，低劑量或外用型類 固醇就能避免 Exogenous Cushing syndrome 的發生","B":"只有不到 5%的庫欣氏症候群是由腎上腺良性腺瘤分 泌過量 cortisol 所引起的","C":"異位性促腎上腺皮質激素(Ectopic Adrenocorticotropic hormone)最常見的來源為胰島 細胞瘤(Islet cell tumor)","D":"在接受了低劑量類固醇隔夜抑制測試(Over night low dose dexamethasone suppression test)後，若無法 抑制 cortisol 的產生便可能患有非促腎上腺皮質激 素依賴型(ACTH independent)庫欣氏症候群","E":"若要區分促腎上腺皮質激素的來源為下視丘或是外源 性腫瘤可以於皮質釋素刺激測驗(CRH stimulating test)後做上岩樣竇採樣(superior petrosal sinus sampling)"},"answer":"D","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell Urology 12th edition Chap106, p2361, p2362, p2364, p2365","sourcePage":130},{"id":"4-027","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":27,"question":"下列哪一項並非腹腔鏡腎上腺切除術的相對禁忌症？","options":{"A":"過度肥胖","B":"惡性嗜鉻細胞瘤","C":"切除後原位置復發的腎上腺腫瘤","D":"未侵犯周圍組織的腎上腺皮質腺癌","E":"男性化型腎上腺瘤(Virilizing adrenal tumor)"},"answer":"C","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell Urology 12th edition Chap107, p2407","sourcePage":130},{"id":"4-028","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":28,"question":"關於艾迪森氏症(Addison’s disease)，下列何項敘述錯 誤？","options":{"A":"在西方國家中，造成艾迪森氏症最常見的原因為自體 免疫腎上腺炎(autoimmune adrenalitis)","B":"礦物性皮質素(Mineralocorticoid)的缺乏是繼發性 (secondary)艾迪森式症最常見的表現","C":"腎上腺危象(Adrenal crisis)由於症狀的表現常常被 誤診為急性腹症(Acute abdomen)","D":"治療方面可給予 hydrocortisone 15-25 mg/day，一 天分兩到三次用藥，並將每日劑量的一半到三分之二 於早上起床後立即使用","E":"若檢驗出抗 21-hydroxylase 抗體則可確定病人的艾 迪森氏症是由自體免疫腎上腺炎造成"},"answer":"B","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell Urology 12th edition Chap106, p2381, p2382 Lancet, 2003 May 31;361(9372):1881-93.","sourcePage":131},{"id":"4-029","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":29,"question":"下列有關腎上腺切除(adrenalectomy)之適應症何者有誤?","options":{"A":"有功能性的腎上腺腫瘤(functional adrenal mass)","B":"所有大於 4 公分的腎上腺腫瘤","C":"腎上腺腫瘤在影像追蹤期間，長大二公分","D":"影像上疑似惡性腎上腺腫瘤","E":"無症狀但大於 12 公分的骨髓性脂肪瘤(myelolipoma)"},"answer":"B","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition Chapter 106 P.2404 Box 106.6","sourcePage":131},{"id":"4-030","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":30,"question":"關於生殖細胞瘤(germ cell tumor)，下列敘述何者錯誤?","options":{"A":"在美國，睪丸癌是 20-40 歲男性最常見的癌症","B":"2%病人有雙側生殖細胞瘤，且異時性(metachronous lesion)最常見","C":"大約有 5%的生殖細胞瘤起源於生殖腺外 (extragonadal site)","D":"精原細胞癌(seminoma)相較於非精原細胞癌 (nonseminoma germ cell tumor)，對放療和化療的反 應較好","E":"畸胎瘤(teratoma)對化療的反應良好"},"answer":"E","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition Chapter 76 P.1680, 1684, 1692","sourcePage":131},{"id":"4-031","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":31,"question":"關於睾丸旁腫瘤(paratesticular tumor)，下列敘述何者 錯誤?","options":{"A":"粗估有 75%的睾丸旁腫瘤起源於精索(spermatic cord)","B":"Adenomatoid tumor 是最常見的睪丸旁腫瘤，有 75% 會侵犯到副睪","C":"Cystadenoma of the epididymis 會發生在 Hippel-Lindau syndrome 的病人","D":"Paratesticular mesothelioma 起源於 tunica vaginalis，多為無痛性腫塊","E":"Rhabdomyosarcoma 是成人最常見的 paratesticular sarcoma 組織型態"},"answer":"E","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition Chapter 76 P.1709","sourcePage":131},{"id":"4-032","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":32,"question":"關於陰莖腫瘤，下列何者錯誤?","options":{"A":"慢性發炎、衛生習慣不佳、抽菸、性傳染病是陰莖鱗 狀細胞癌(Penile squamous cell carcinoma)的危險 因子","B":"人類第六型乳突病毒(Human herpesvirus 6)和卡波西 肉瘤(Kaposi Sarcoma)的形成有關","C":"可藉由嬰兒包皮環切手術和人類乳突病毒(Human herpesvirus, HPV)疫苗來預防陰莖癌的發生","D":"HPV 16, 18, 31, 33 型和陰莖惡性腫瘤關係較大，HPV 6, 11 型和尖型溼疣(Condyloma accuminata)較相關","E":"若陰莖鱗狀細胞癌的病灶有淋巴血管侵犯，不管理學 檢查是否有淋巴腫大，都需做腹股溝前哨淋巴結切片 術或腹股溝淋巴廓清手術"},"answer":"B","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh-Wein Urology Twelfth Edition p1472-1475 NCCN guideline Penile cancer ver 1.2021.","sourcePage":132},{"id":"4-033","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":33,"question":"下列何者不是腎上腺切除手術適應症?","options":{"A":"庫欣氏病 (Cushing disease)","B":"雙側原發性高醛固酮症 (Bilateral primary adrenal hyperplasia)","C":"肺癌併單一腎上腺轉移","D":"嗜鉻細胞瘤 (Pheochromocytomas)","E":"無症狀的 7 公分腎上腺腫瘤"},"answer":"A","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh-Wein Urology Twelfth Edition, p2407","sourcePage":132},{"id":"4-034","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":34,"question":"針對嗜鉻細胞瘤 (Pheochromocytomas)手術後的病人照 顧,下列何者正確?","options":{"A":"手術後，病人不會有高血壓","B":"術前應給予 α 型－腎上腺素性阻斷劑 (α-adrenergic blockers)至少兩週","C":"為避免術中血壓升高，在手術前應給予利尿劑","D":"優先給予 β 型－腎上腺素阻斷劑(β-adrenergic blockers)作為術前血壓控制藥物","E":"術中若出現高血壓, 優先給予長效型降壓藥物"},"answer":"B","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh-Wein Urology Twelfth Edition, p2409","sourcePage":132},{"id":"4-035","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":35,"question":"20 歲男性，曾因左側睪丸破裂接受睪丸切除術。此次因右 側陰囊腫大求診，在超音波下，發現右側睪丸有 4 公分睪 丸腫瘤，下列敘述何者錯誤?","options":{"A":"須檢查血液中 AFP, beta-HCG, LDH 濃度","B":"不應施行經陰囊睪丸切片 (trans-scrotal testicular biopsy)","C":"單純精原細胞癌(Pure seminoma) 不會分泌 AFP","D":"手術前可儲存精子","E":"可嘗試右側部份睪丸切除手術 (partial orchiectomy)"},"answer":"E","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh-Wein Urology Twelfth Edition p1686","sourcePage":133},{"id":"4-036","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":36,"question":"關於腎上腺惡性腫瘤 Adrenocortical carcinoma (ACC) 相關敘述何者錯誤？","options":{"A":"屬於罕見惡性腫瘤，發生率約每百萬人之中 0.7-2 人，女生較常見","B":"大部分為偶發性(sporadic)且發生於單側，約 12-16% 病人雙側發生且大多有遺傳疾病病史","C":"好發年齡分布屬於雙峰型(Bimodal)，較常見於 10 歲 孩童以及 40-50 歲成人","D":"和成人相比，兒童的 ACC 預後普遍較佳","E":"文獻指出近 20 年來因為健康檢查的普及，意外發現的 腎上腺腫瘤變多，但整體存活率沒有進步"},"answer":"B","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell 12th ch.106 p.2384","sourcePage":133},{"id":"4-037","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":37,"question":"下列關於遺傳性嗜鉻細胞瘤(Pheochromocytoma)以及其基 因配對何者錯誤？","options":{"A":"Familial paraganglioma syndrome type 4 (PGL-4)： SDHA","B":"Familial paraganglioma syndrome type 1 (PGL-1)： SDHD","C":"Neurofibromatosis type 1：NF1","D":"Multiple endocrine neoplasia (MEN) type 2A： RET","E":"Multiple endocrine neoplasia (MEN) type 2B： RET"},"answer":"A","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell 12th ch.106 p.2374 (table 106.6)","sourcePage":133},{"id":"4-038","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":38,"question":"下列有關陰莖癌預後分子標記(Prognostic molecular marke)表現的敘述何者錯誤？","options":{"A":"Human papillomavirus (HPV) p16INK4a：存活率上升， 復發率下降","B":"TP53：存活率下降","C":"Ki-67：表現高者存活率較差","D":"E-cadherin：表現低者存活率較差","E":"MMP-9：表現高者復發率較高"},"answer":"C","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell 12th ch. 79 p.1759 (table 79.11)","sourcePage":133},{"id":"4-039","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":39,"question":"有關睪丸癌的敘述何者正確？","options":{"A":"睪丸生殖細胞瘤(GCT)約有 20%機會雙側發生，故評估 時應檢查雙側超音波","B":"雙側睪丸生殖細胞瘤(GCT)，同時性(synchronous)發 生的機會較異時性(metachronous)發生的機會低，前 者約佔所有 GCT 的 5%","C":"若診斷為睪丸性腺胚细胞瘤(Gonadoblastoma)，兩側 睪丸切除術是必須的，因其有高機率(40%)侵犯兩側。","D":"在大於 50 歲的病人中，非霍奇金氏淋巴瘤 (non-Hodgkin lymphoma)是最常見的睪丸腫瘤，其中 約有 15%病人侵犯雙側睪丸","E":"常見轉移到睪丸的腫瘤包含原發自 prostate, lung, melanoma, colon 和 kidney 的惡性腫瘤，其中約有 35% 病人侵犯雙側睪丸"},"answer":"C","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell 12th ch.76 p.1685, 1686, 1708, 1709","sourcePage":134},{"id":"4-040","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":40,"question":"下列有關尿道癌的敘述何者錯誤?","options":{"A":"在男性局部遠端尿道癌的案例，傳統上建議 1cm 為手 術安全邊緣，但近年也有文獻提出 0.5cm 擁有極佳的 局部控制","B":"在觸摸不到淋巴結的尿道癌病人身上，鼠蹊部淋巴結 廓清手術對於存活率的益處似乎不大","C":"局部性的攝護腺尿道腫瘤病人，若是表淺性 High grade 可以使用 BCG 灌藥治療，反應率至少 70%，且搭 配 TURP 更能提升","D":"尿道憩室(urethra diverticula)是女性尿道癌的誘 發因素，約 6%尿道憩室病人有尿道癌","E":"女性尿道癌的患者中，發生於遠端的腫瘤，相較近端 或全段尿道者，前者較常見，且預後較好"},"answer":"E","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell 12th ch.80 p.1778,1779,1782, 1783","sourcePage":134},{"id":"4-041","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":41,"question":"53 歲男性，無痛性右睪丸腫塊，最可能是以下何種惡性腫 瘤?","options":{"A":"精原細胞癌(seminoma)","B":"絨毛膜癌(choriocarcinoma)","C":"淋巴癌(lymphoma)","D":"陰莖癌轉移","E":"性腺胚细胞瘤(Gonadoblastoma)"},"answer":"C","reference":"(111) 參考資料(摘錄自)：Smith General Urology 19th Edition, Chap 22, page 13/20","sourcePage":134},{"id":"4-042","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":42,"question":"生殖細胞癌(germ cell tumor) 多是由淋巴途徑轉移，只 有以下哪種癌例外，多經血液途徑轉移?","options":{"A":"絨毛膜癌(choriocarcinoma)","B":"精原細胞癌(seminoma)","C":"畸胎瘤 (teratoma)","D":"畸胎癌 (teratocarcinoma)","E":"胚胎性癌(embryonal carcinoma)"},"answer":"A","reference":"(111) 參考資料(摘錄自)：Smith General Urology 19th Edition, Chap 22, page 3/20","sourcePage":135},{"id":"4-043","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":43,"question":"針對陰莖癌患者併腹股溝淋巴結轉移之治療，以下何者為 非?","options":{"A":"無觸摸到腹股溝淋巴結，局部陰莖癌期別為 T1G1，追 蹤監測即可。","B":"無觸摸到腹股溝淋巴結，局部陰莖癌期別為 T1G3，執 行腹股溝淋巴清除術。","C":"觸摸到固定的(fixed)腹股溝淋巴結，先執行前導性化 療(neoadjuvant chemotherapy)，有療效者再行腹股 溝淋巴清除術","D":"腹股溝淋巴清除術後，病理期別為 pN2，執行輔助性 化療(adjuvant chemotherapy)","E":"單側骨盆腔淋巴轉移，執行放射治療"},"answer":"E","reference":"(111) 參考資料(摘錄自)：EAU Guidelines on Penile Cancer 2022, page 20-21","sourcePage":135},{"id":"4-044","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":44,"question":"腎上腺皮質癌(adrenal cortical carcinoma) 的內分泌功 能評估中，以下何種結果發生率最高?","options":{"A":"無功能性 (nonfunctional)","B":"庫欣氏症 (Cushing syndrome)","C":"女性化 (Feminization)","D":"男性化 (Virilization)","E":"醛固酮過高 (Hyperaldosteronism)"},"answer":"B","reference":"(111) 參考資料(摘錄自)：Campbell Urology 12E, Ch106,p2385","sourcePage":135},{"id":"4-045","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":45,"question":"以下何者非腎上腺切除(adrenalectomy)的適應症?","options":{"A":"5 公分不規則邊緣的偶見瘤(incidentaloma)","B":"在未打顯影劑電腦斷層下，腫瘤 HU 值為 15","C":"雙側腎上腺增生(bilateral adrenal hyperplasia)","D":"18F-FDG-PET 下腎上腺腫瘤 FDG 顯影較肝臟低","E":"其他部位癌症併單一腎上腺轉移"},"answer":"D","reference":"(111) 參考資料(摘錄自)：Campbell Urology 12E, Ch107,p2407","sourcePage":135},{"id":"4-046","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":46,"question":"50 歲女性診斷右腎上線皮質惡性腫瘤 Adrenal cortical carcinoma (ACC)，下列敘述何者正確？","options":{"A":"若檢驗發現病人 insulin-like growth factor (IGF) 表現增加，需高度懷疑 Beckwith-Wiedemann syndrome 和 Li-Fraumeni syndrome 等兩項遺傳性疾病","B":"病人若出現雄性化(virilization)的表徵可能跟腫瘤 分泌 17-ketosteroids 和 DHEA 有關，大約有四成的 ACC 會單獨以雄性化作為表徵","C":"影像學的發現有將近六成的 ACC 會大於 5cm","D":"臨床上接近一半的病人在發現 ACC 時已經被診斷為第 四期，五年的存活率僅剩不到 5%","E":"Mitotane 為一種透過靜脈注射的化療藥物，它除了有 直接的細胞毒殺作用外，還可以形成 free radicals 對癌細胞造成 oxidative damage"},"answer":"D","reference":"(111) Campbell Walsh Urology, 12th ed. Ch106. P2384-2385/2387","sourcePage":136},{"id":"4-047","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":47,"question":"下列關於嗜鉻細胞瘤 Pheochromocytoma (PCC)的敘述何者 正確？","options":{"A":"Multiple endocrine neoplasia (MEN) type 2A 和 type 2B 的病人有 50%的 risk 會發生 PCC，與之相關的基因 為 SDHD","B":"Familial paraganglioma syndrome type 4 (PGL-4) 和 Familial paraganglioma syndrome type 1(PGL-1) 發生 PCC 的風險接近 20%，其中 PGL-1 因為 SDHB mutation 發生腫瘤轉移的機會遠遠高過 PGL-4","C":"相較於 von Hippel-Lindau syndrome 病人身上的 PCC，在 MEN-2 病人身上的 PCC 製造較少量的 epinephrine","D":"以往 PCC 被稱作 10% tumor 的稱謂，近來已經有所改 變，因為其中有 25%的病人為 extra-adrenal tumor， 另外高達 30%的病人和家族遺傳有關","E":"以上均正確"},"answer":"D","reference":"(111) Campbell Walsh Urology, 12th ed. Ch.106 P2373-2374","sourcePage":136},{"id":"4-048","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":48,"question":"下列有關嗜鉻細胞瘤術前的準備何者正確？","options":{"A":"在術前的一到兩周應給予口服的 Phenoxybenzamine，其目的為 β-blockade","B":"對於一些頑固性高血壓的病人也可以選擇一開始直接 給予鈣離子通道阻斷劑包含 Nicardipine 以及 Verapamil","C":"手術前的血壓控制目標為坐姿時 140/90mm Hg","D":"手術前一天應避免給予過多輸液並給予利尿劑控制血 壓","E":"術後須特別留意病人發生高血糖(hyperglycemia)的 症狀"},"answer":"B","reference":"(111) Campbell Walsh Urology, 12th ed. Ch.106 p2379-2380","sourcePage":136},{"id":"4-049","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":49,"question":"下列關於陰莖腫瘤的敘述何者正確？","options":{"A":"HPV 16 18 31 33 和惡性腫瘤的關係較大，其中 HPV 16 型和 18 型還會導致 verrucous carcinoma","B":"感染淋病和梅毒並不會增加 penile cancer 的機會","C":"Lichen sclerosus 為 penile cancer 的風險因子， 此疾病和感染 HPV 有密切關係","D":"不論成人或嬰幼兒時期，割包皮都能降低得到陰莖癌 的風險","E":"在陰莖癌病人身上若發現 E-cadherin 這個 marker 量 表現高時，通常代表存活率較差"},"answer":"B","reference":"(111) Campbell Walsh Urology, 12th ed. Ch.79 p1743-1744","sourcePage":137},{"id":"4-050","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":50,"question":"以下關於睪丸腫瘤的敘述何者正確？","options":{"A":"有兩成的病人在一開始診斷睪丸癌時就發現遠端轉移","B":"病人術前 Alpha-Fetoprotein(AFP) 值超出正常值許 多倍幾乎可排除 seminoma 和 yolk sac tumor 的可能","C":"Embryonal carcinoma 和 Choriocarcinoma 均會使得 serum HCG 上升，如果發現 HCG 值非常高時要想到 Embryonal carcinoma 造成的 brain metastases","D":"轉移性的 teratoma 預後和完整執行 post-chemotherapy surgery(PCS)有關，對於化療後 殘存的腫瘤執行 PCS，長期的存活率可高達 90%","E":"轉移性的 seminoma 中有 15% 的病人 serum HCG 會升 高，追蹤 HCG 的數值可以用來當作改變治療方式的指 標"},"answer":"D","reference":"(111) Campbell Walsh Urology, 12th ed. Ch.76 p1680-1684/1692/1698/1707","sourcePage":137},{"id":"4-051","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":51,"question":"下列關於用來區分良性跟惡性的腎上腺腫瘤的的 Weiss criteria, 何者錯誤？","options":{"A":"Weiss criteria 是依據九個病理特徵來判斷腎上腺腫 瘤為良性或惡性","B":"如果有出現三個以上的 Weiss criteria 就可以算是惡 性腫瘤, 敏感性(sensitivity) 96%，特異性 (specificity) 100%","C":"在 Weiss criteria 中，以細胞分裂比率(mitotic rate)跟病患的預後最有相關","D":"在孩童的腎上腺腫瘤及有嗜酸細胞特徵(oncocytic features) 的成人腎上腺腫瘤，使用 Weiss criteria 要特別注意，建議使用其他診斷標準替代","E":"Weiss criteria 分類系統根據腫瘤構造(tumor structure)，細胞學(cytology)及侵犯程度(invasion status)來決定"},"answer":"B","reference":"(111) 參考資料(摘錄自)：12th Campbell Urology, Chapter 106. P. 2386","sourcePage":137},{"id":"4-052","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":52,"question":"下列關於家族遺傳性高醛固酮症(familial hyperaldosteronism, FH)的敘述何者錯誤？","options":{"A":"第一型 FH 是自體顯性疾病，是因為 CYP11B1 跟 CYP11B2 基因異常所導致","B":"第二型 FH 的病患可能會有 7p22 region 的突變","C":"第一型 FH 容易有早發性的頑固型高血壓(refractory hypertension) 的情況，也有早發性高血壓及腦中風 的家族史","D":"第二型 FH 也會有原因不明的增生或產生醛固酮之腺 瘤(idiopathic hyperplasia or aldosterone-producing adenomas)，不容易跟零星性 的原發性高醛固酮症(sporadic primary aldosteronism)做區分","E":"第三型 FH 的臨床特徵會有單邊性腎上腺增生，頑固型 高血壓，嚴重低血鉀症"},"answer":"E","reference":"(111) 參考資料(摘錄自)：12th Campbell Urology, Chapter 106. P. 2368","sourcePage":138},{"id":"4-053","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":53,"question":"下列關於男性生殖細胞瘤(germ cell tumor)的敘述, 何者 錯誤？","options":{"A":"發生雙側生殖細胞瘤的機會為 2%","B":"有隱睪症的那側睪丸，會提高 4-6 倍發生睪丸癌的機 會，但如果在青春期前做睪丸固定，可以將風險降至 2-3 倍","C":"一等親有睪丸腫瘤的病患，診斷睪丸腫瘤的時間會比 一般人提早 2-3 年","D":"睾丸精母細胞瘤(spermatocytic tumors)是從睪丸原 位生殖細胞腫瘤(germ cell neoplasia in situ)發展 而來","E":"在美國，睪丸癌是 20-40 歲男性最常見的腫瘤，以及 是 15-19 歲男性第二常見的腫瘤"},"answer":"D","reference":"(111) 參考資料(摘錄自)：12th Campbell Urology, Chapter 76. P. 1680","sourcePage":138},{"id":"4-054","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":54,"question":"下列關於睪丸的腫瘤的敘述，何者錯誤？","options":{"A":"睪丸間質細胞瘤(Leydig cell tumors)會跟克林氏症 候群 (Klinefelter syndrome)及遺傳性平滑肌瘤病 與腎細胞癌(hereditary leiomyomatosis and renal cell carcinoma)有關","B":"大多數的睪丸間質細胞瘤都是良性的，但有 20%的病 患會有惡性轉移的機會","C":"從診斷睪丸間質細胞瘤到發生轉移通常會在兩年內， 且預後差","D":"轉移性的睪丸間質細胞瘤有化學治療抗性 (chemoresistant)，所以靠手術摘除是較為合適的治 療","E":"如果睪丸間質細胞瘤有下列至少一項的病理特徵: 浸 潤型的邊界（infiltrative borders），腫瘤大於五公 分, 中度或重度的核異型(nuclear atypia)，壞死 （necrosis)，淋巴血管侵犯(lymphovascular invasion)，每 10 高倍率視野看到大於五個有絲分(>5 mitosis per 10 high-power fields)，就需要做預防 性的後腹膜腔淋巴清除術"},"answer":"B","reference":"(111) 參考資料(摘錄自)：AUA update series 2021, p345; Lesson 35 Adult Non-Germ Cell Tumors of the Testis and Scrotum","sourcePage":138},{"id":"4-055","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":55,"question":"下列關於庫欣症候群 (Cushing Syndrome)，何者錯誤？","options":{"A":"正常人血液中 Cortisol 濃度最高的時間在早晨，最低 (Nadir) 大約在晚上 11 點","B":"50%以上的 Cushing Syndrome 患者會有尿路結石。治 療 Cushing Syndrome 亦可降低此類患者結石的機率","C":"異位 ACTH 分泌症侯群患者（Ectopic Adrenocorticotropic Hormone Syndrome）若無法定 位原始腫瘤位置或原始腫瘤無法切除時，治療準則為 雙側腎上腺切除搭配終身類固醇補充治療","D":"Nelson Salassa syndrome 是指雙側腎上腺切除術後 Glucocorticoid 低下所造成的相關症狀","E":"外源性庫欣症候群（Exogenous Cushing Syndrome） 是西方國家中最常見 Hypercortisolism 的原因"},"answer":"D","reference":"(111) 參考資料(摘錄自)：Campbell Walsh Wein Urology, 12th Edition, Ch. 106, P.2360~2366 (D) Nelson Salassa syndrome 是指雙側腎 上腺切除術後有 8~30%的病人因為正回饋， 導致 pituitary adenoma 增生造成的動眼神 經壓迫、視交叉壓迫、腦壓上升的現象。","sourcePage":139},{"id":"4-056","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":56,"question":"根據 2022 年 NCCN guideline 對於 Pheochromocytoma 的 診斷及治療何者錯誤？","options":{"A":"應測量病患之 24-hour urine fractionated metanephrines 及 normetanephrines","B":"建議先使用 Alpha blocker、限制水份攝取、低鹽飲 食治療 7~14 天以穩定血壓","C":"可加入 Beta-blocker 或 calcium channel blocker 治 療","D":"若無法完全切除，可考慮 RT ± cytoreductive resection","E":"若無法完全切除或有遠端轉移，可使用 Sunitinib 37.5 mg QD 治療"},"answer":"B","reference":"(111) 參考資料(摘錄自)：NCCN guidelines 2022, Neuroendocrine and Adrenal Tumors (B)應該要補充水份、高鹽飲食來增加 Volume，為術中可能發生的低血壓做準備。","sourcePage":139},{"id":"4-057","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":57,"question":"根據第八版 AJCC 對於 Penis cancers TNM staging 的敘述 何者錯誤？","options":{"A":"T2 指腫瘤侵犯 corpus spongiosum","B":"T3 指腫瘤侵犯 urethra","C":"T4 指腫瘤侵犯鄰近組織（例如：scrotum, prostate, pubic bone）","D":"N1 指存在可移動或單側鼠蹊部淋巴結轉移","E":"N3 指存在固定鼠蹊部淋巴結或骨盆腔淋巴結轉移"},"answer":"B","reference":"(111) 參考資料(摘錄自)：Campbell Walsh Wein Urology, 12th Edition, Ch. 79, P.1748~1751 (B) T3 指腫瘤侵犯 corpus cavernosum， Urethra 侵犯和預後無關。","sourcePage":140},{"id":"4-058","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":58,"question":"關於 Advanced germ cell tumor 的 IGCCCG （International Germ Cell Cancer Collaborative Group）risk group 分類，何者正確？","options":{"A":"IGCCCG 評估之項目包含 tumor marker 之數值，AJCC 之 TNM staging 則不包含。","B":"Tumor marker 是參考 orchiectomy 術前的數值","C":"對於復發之 Germ Cell Tumor 亦可使用 IGCCCG 來重 新分類","D":"Nonseminoma 若為 Mediastinal primary，則會被歸類 為 poor prognosis","E":"Seminoma 若有 Non-pulmonary visceral metastases，則會被歸類為 poor prognosis"},"answer":"D","reference":"(111) 參考資料(摘錄自)：Campbell Walsh Wein Urology, 12th Edition, Ch. 76, P.1690~1691 (A) 兩者 Tumor marker 皆有包含在內 (B) 術後 (C) 復發者不適用 (E) Seminoma 在 IGCCCG 分類裡面沒有 poor prognosis。","sourcePage":140},{"id":"4-059","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":59,"question":"關於 Seminoma 及 Nonseminoma germ cell tumor 的敘述何 者錯誤？","options":{"A":"Clinical stage 1 的病人發生潛在性轉移(Occult metastasis)的比率，Seminoma 較 Nonseminoma 低","B":"對於放射線治療及 platin-based 化療的反應， Seminoma 較 Nonseminoma 好","C":"Seminoma 之病人若接受放射線治療後再度復發，或是 對於化療沒有反應，則要考慮腫瘤可能已轉變為 Nonseminoma","D":"Nonseminoma 的第一線治療不包含放射線治療","E":"在 metastatic seminoma 的病人，tumor marker level 可作為預後及治療的參考"},"answer":"E","reference":"(111) 參考資料(摘錄自)：Campbell Walsh Wein Urology, 12th Edition, Ch. 76, P.1692 (E)在 metastatic seminoma 的病人中只有 15% HCG 會上升，因此 tumor marker 無法作 為治療選擇的參考。","sourcePage":140},{"id":"4-060","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":60,"question":"下列關於 Queyrat 增殖性紅斑(erythroplasia of Queyrat)的敘述何者不正確？","options":{"A":"鮑恩氏病(Bowen disease)若發生在男性龜頭時，疾病 名稱為 Queyrat 增殖性紅斑","B":"病灶處通常是沒有症狀的，確診需要經由切片檢查","C":"此疾病與第 16 和 18 型人類乳突病毒(human papillomavirus)的感染有相關性","D":"塗抹 imiquimod 藥膏是可以考慮的一種治療方式","E":"幾乎不會發展成為侵襲性癌"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 11th Edition, 2016, Chapter 37, p846-847 10%-33%病患會發展成侵襲性 癌的可能","sourcePage":141},{"id":"4-061","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":61,"question":"下列關於陰莖乳房外柏哲德氏病(Extramammary Paget disease; EMPD)的敘述何者不正確？","options":{"A":"屬於一種罕見的表皮細胞間鱗狀上皮癌 (intraepithelial Squamous cell carcinoma)","B":"臨床上不易和 Queyrat 增殖性紅斑(erythroplasia of Queyrat)區分","C":"主要的症狀是局部不舒服及搔癢","D":"在顯微鏡下，免疫組織染色呈現 cytokeratin 7 陽性 及 S-100 protein 陰性","E":"可能和泌尿道腫瘤有相關"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 11th Edition, 2016, Chapter 37, p875 The tumor behaves as a slow-growing intraepithelial adenocarcinoma with cells derived from apocrine glands.","sourcePage":141},{"id":"4-062","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":62,"question":"陰莖癌的病患接受骨盆腔淋巴切除(pelvic lymph node dissection)時，發現較常發生淋巴轉移的部位為何？","options":{"A":"Obturator","B":"Presacral","C":"Internal iliac","D":"External iliac","E":"Common iliac"},"answer":"D","reference":"(111) 參考資料(摘錄自)： THE JOURNAL OF UROLOGY, January 2021, Vol. 205, p145-151 50.0% (86/172), 36.6% (63/172), 7.0% (12/172) and 6.4% (11/172) of pelvic LNs were from the external iliac, obturator, common iliac and internal iliac packages, respectively","sourcePage":141},{"id":"4-063","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":63,"question":"關於隔夜 1 mg dexamethasone 抑制測驗(Overnight 1 mg Dexamethasone Suppression Test)，會請病患於晚上 11 點至午夜 12 點服用 1 mg Dexamethasone，並且於隔天何時 檢驗皮質醇濃度？","options":{"A":"7 AM 至 8 AM","B":"8 AM 至 9 AM","C":"9 AM 至 10 AM","D":"10 AM 至 11 AM","E":"11 AM 至 12 PM"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 11th Edition, 2016, Chapter 65, p1572 serum cortisol is measured between 8 AM and 9 AM","sourcePage":141},{"id":"4-064","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":64,"question":"關於血清醛固酮與腎素比值(aldosterone to renin ratio; ARR)，在採血檢查血清醛固酮濃度及血清張力素活 性時，建議請病患停用下列何種藥物，以減少影響 ARR 值 檢驗的可靠度？","options":{"A":"Doxazosin","B":"Propranolol","C":"Captopril","D":"Valsartan","E":"Amlodipine"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 11th Edition, 2016, Chapter 65, p1573 patients on β-blockers who continue therapy through testing may show a false-positive rise in ARR","sourcePage":142},{"id":"4-065","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":65,"question":"關於睪丸癌 stage IS 的敘述，下列何者為正確? a. pure seminoma 以及 nonseminoma 都可能產生 stage IS 的狀況 b. stage IS 代表施行 orchiectomy 之後，image 上已無腫 瘤，考量半衰期在追蹤一段時間後，tumor marker 仍 然處於異常狀況 c. hyperthyroidism ,hypogonadism 或 drug abuse 可能 使 beta-HCG 呈現假陽性輕微上升，需排除 d. 治療建議為 BEPx3 cycles 或 EPx4 cycles e. 後腹腔轉移機會很高，也可以考慮 RPLND","options":{"A":"a,b,c,d,e","B":"a,b,c,d","C":"b.c.d","D":"b,d,e","E":"b,c.d"},"answer":"B","reference":"(111) NCCN guideline Version 2.2022","sourcePage":142},{"id":"4-066","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":66,"question":"下列關於 germ cell tumor(GCT)敘述，何者正確?","options":{"A":"若在後腹腔腫瘤中發現 GCT，一定是由睪丸轉移而來","B":"睪丸腫瘤，Seminoma 和 nonseminoma 不可能同時存在","C":"睪丸癌典型症狀為無痛性睪丸腫瘤，若有疼痛腫大情 形，則偏向感染，可排除惡性腫瘤","D":"術前 AFP 異常上升，接受睪丸根除性切除後，病理顯 示 pure seminona，仍要當 nonseminoma 處理","E":"Seminoma 沒有 tumor marker，故無法以 beta-HCG 或 AFP 追蹤病人狀況"},"answer":"D","reference":"(111) Campbell 12th edition,Chapter 76","sourcePage":142},{"id":"4-067","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":67,"question":"關於睪丸癌手術的敘述，何者正確? a. Radical orchiectomy 採 inguinal incision，目的是 要 early control of testis blood flow 並且能夠切 除高位的 spermatic cord b. 若病人有 massive lung metastasis 或 retroperitoneal metastasis，應先考慮化學治療， radical orchiectomy 可以延後施行 c. Testis-sparing surgery 建議加上 adjuvant radiation therapy d. 因為睪丸的淋巴迴流左右不相同，施行後腹腔淋巴結廓 清手術時(RPLND)，在某些病人可以 aorta 中線做分 界，只做當側淋巴廓清手術 e. 化學治療可能造成組織纖維化，造成 aorta 或 IVC 沾 黏，進行 RPLND 時可能造成大流血，故化療後不建議 RPLND","options":{"A":"a,b,c,d","B":"b,c,d,e","C":"b,c,d","D":"a,b,c","E":"c,d"},"answer":"A","reference":"(111) Campbell 12th edition, Chapter 77","sourcePage":143},{"id":"4-068","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":68,"question":"下列敘述何者不是原發性高醛固酮症(primary aldosteronism) screening 的適應症？","options":{"A":"高血壓合併睡眠呼吸中止症","B":"連續一週以上測到嚴重的高血壓(>150/100 mmHg)","C":"早發性高血壓或中風","D":"高血壓合併低血鉀","E":"高血壓合併家族史原發性高醛固酮症"},"answer":"B","reference":"(111) 參考資料(摘錄自) ：Campbell-Walsh Urology, 12th edition, Chapter 106. p. 2369","sourcePage":143},{"id":"4-069","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":69,"question":"下列關於診斷腎上腺嗜鉻細胞瘤(pheochromocytoma) 的 敘述何者為錯誤？","options":{"A":"電腦斷層呈現 well-circumscribed 的病灶，由於腫 瘤富含血管，llipid content 較少，CT 值約為 35 HU(Hounsfield unit)","B":"血液中 metanephrines 濃度比 catecholamines 的濃 度上升對偵測腫瘤更敏感","C":"在做 Plasma-free metanephrines 檢查之前五天應停 用 acetaminophen, 三環抗憂鬱劑，以及 phenoxybenzamine，避免檢驗呈現偽陽性","D":"檢查其他部位的腎上腺嗜鉻細胞瘤可以使用 MIBG 核 子醫學掃描，尤其對於具有 VHL 和 SDHB 基因突變的腫 瘤有非常好的敏感性","E":"不建議常規實行腎上腺腫瘤切片來確立診斷"},"answer":"D","reference":"(111) 參考資料(摘錄自) ：Campbell-Walsh Urology, 12th edition, Chapter 106. p. 2375-2377","sourcePage":143},{"id":"4-070","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":70,"question":"一位 34 歲的男性，診斷為右側 NSGCT 第三期，病理報告為 embryonal carcinoma，IGCCCG criteria 為 good risk， 病人接受了完整的 3 cycles BEP(bleomycin, etoposide, cisplatin)後，tumor marker 皆回到正常值。化療過後追 蹤的 CT 顯示 interaortocaval region 有一個 1.7 公分的 腫瘤 （初診斷時為 4.8 cm），paraaortal region 有一個 0.8 cm（初診斷時為 2.3 cm）。肺部 CT 也看到右側 0.6 cmpulmonary nodule (初診斷時為 1.4 cm )，以及左側 0.8 cm pulmonary nodule (初診斷時為 1.6 cm)。請問這個病 人接下來最適當的治療為何？","options":{"A":"4 cycles of VeIP (vinblastine, ifosfamide,cisplatin)","B":"切除 interaortocaval mass","C":"雙側 postchemotherapy RPLND","D":"雙側 thoracotomy 及切除 residual pulmonary Nodules","E":"針對 pulmonary nodules 做 CT guided-biopsy"},"answer":"C","reference":"(111) 參考資料(摘錄自) ：Campbell-Walsh Urology, 12th edition, Chapter 76. p. 1697-1700","sourcePage":144},{"id":"4-071","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":71,"question":"關於 nonsquamous malignant neoplasms 的陰莖腫瘤，下 列敘述何者錯誤？","options":{"A":"Basal cell carcinoma 通常有比較高的治癒率以及相 對較低的轉移風險","B":"Sarcoma 較容易局部復發，不容易有區域或遠端轉移","C":"Melanoma 的侵犯性較強，針對復發或晚期的腫瘤可考 慮使用免疫治療","D":"Extramammary Paget disease (EMPD) 初期主要是在 intraepidermal 傳播，主要治療選擇為廣泛性的局部 切除並達到 negative margins，invasive EMPD 的預 後通常很好","E":"轉移性的陰莖腫瘤預後通常很差，臨床表現常為 Priapism"},"answer":"D","reference":"(111) 參考資料(摘錄自) ：Campbell-Walsh Urology, 12th edition, Chapter 79. p. 1772-1775","sourcePage":144},{"id":"4-072","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":72,"question":"下列何者關於 Familial hyperaldosteronism subtype 對 應到的 germline mutation 以及敘述何者有誤？","options":{"A":"FH type I 通常為 CYP11B1/CYP11B2 germline chimeric gene","B":"FH type II 通常為 CLCN2 chloride channel germline Mutations","C":"FH type III 通常為 germline ARMC5 mutations","D":"type IV 通常為 germline CACNA1H gene mutations","E":"germline CACNA1D mutations 常伴隨有癲癇及其他神 經學症狀"},"answer":"C","reference":"(111) 參考資料(摘錄自): Young Jr, W. F. (2019). Diagnosis and treatment of primary aldosteronism: practical clinical perspectives. Journal of Internal Medicine, 285(2), 126-148.","sourcePage":145},{"id":"4-073","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":73,"question":"下列關於嗜鉻細胞瘤(Pheochromocytoma)的敘述何者錯 誤?","options":{"A":"目前惡性嗜鉻細胞瘤只能通過呈現臨床轉移來定義， 病理表現方面的診斷價值有限","B":"遺傳性的嗜鉻細胞瘤佔了整體腫瘤的 30%","C":"多發性內分泌腫瘤(Multiple endocrine neoplasia) type 2A 的突變基因為 RET","D":"家族性副神經結瘤症候群第四型(Familial paraganglioma syndrome type 4)的突變基因為 SDHD (mitochondrial succinate dehydrogenase subunits D)，有高的機率產生惡性嗜鉻細胞瘤","E":"遺傳性的嗜鉻細胞瘤會較年輕就發病，並且呈現多發 性(multifocal)或雙側表現"},"answer":"D","reference":"(111) 參考資料(摘錄自)： (111) Campbell-Walsh 12th edition, Chapter 106,P2373-2375,Table 106.6","sourcePage":145},{"id":"4-074","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":74,"question":"下列何者為腹腔鏡腎上腺切除術的絕對的禁忌症 (Absolute contraindications)?","options":{"A":"嚴重的心肺疾病(cardiopulmonary disease)","B":"惡性嗜鉻細胞瘤(Malignant pheochromocytoma)","C":"明顯腹部沾黏","D":"腎上腺腫瘤大於 12 公分","E":"局限性的腎上腺皮質腺癌(adrenal cortical carcinoma )，無周邊侵犯"},"answer":"A","reference":"(111) Campbell-Walsh 12th edition, Chapter 107, P2407 Box107.2 Campbell-Walsh 12th edition Review. Chapter 107","sourcePage":145},{"id":"4-075","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":75,"question":"在 clinical stage IIA-IIB 非精母生殖細胞瘤(NSGCT)的 病人，下列哪些因子跟潛在遠端轉移(occult distant metastases)有關，除了?","options":{"A":"睪丸切除後 hCG 持續上升","B":">3 公分的後腹腔腫瘤","C":"淋巴血管侵犯(Lymphovascular invasion)","D":"睪丸腫瘤合併陰囊皮膚侵犯","E":"在原淋巴轉移路徑(primary landing zone)外的後腹 腔淋巴結腫大"},"answer":"C","reference":"(111) Campbell-Walsh 12th edition Review. Chapter 76 Question 15","sourcePage":145},{"id":"4-076","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":76,"question":"50 歲男性，右側睪丸精母細胞瘤(seminoma),clinical stage III, IGCCCG good-risk,在接受三個周期的 bleomycin-etoposide-cisplatin 化學治療後,有一顆 2.5 公分旁主動脈(para-aortic)殘餘腫瘤(治療前為 4 公 分)，治療後轉移肺結節已經完全緩解, 血清腫瘤指數在正 常範圍內，請問下一步何者最適當?","options":{"A":"對殘餘腫瘤進行放射治療","B":"在化療後六周後使用 PET/CT scan 追蹤","C":"追蹤觀察","D":"手術切除殘餘腫瘤","E":"使用二線化療: paclitaxel-ifosfamide-cisplatin"},"answer":"C","reference":"(111) NCCN guideline version 2. 2022 Campbell-Walsh 12th edition Review. Chapter 76. Question 23","sourcePage":146},{"id":"4-077","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":77,"question":"下列關於陰莖鱗狀上皮細胞癌 (Penile squamous cell carcinoma) 之敘述，何者錯誤?","options":{"A":"初期淋巴轉移會轉移到闊筋膜(fascia lata)的底下","B":"癌細胞可造成高血鈣 (Hypercalcemia)，即便未偵測 到骨轉移。","C":"對於腹股溝淋巴結的評估，腹股溝觸診比 CT 或淋巴攝 影(lymphangiography)更為優先","D":"陰莖癌最重要的預後因子為是否存在淋巴結轉移的情 形","E":"施行腹股溝淋巴廓清術，只有一個淋巴結顯示侵犯， 後續不用做骨盆腔淋巴結廓清術"},"answer":"A","reference":"(111) Campbell-Walsh 12th edition, Chapter 79 Tumors of the Penis, P1742-1765","sourcePage":146},{"id":"4-078","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":78,"question":"關於睪丸生殖細胞瘤(germ cell tumor，GCT)的描述，下 列何者正確? 1. Choriocarcinoma 以及約 15%的 Seminoma 因含有滋 養細胞(cytotrophoblasts)，會表現出 beta-HCG 升高 2. Mixed germ cell tumor 常混有 Yolk sac tumor， eosinophilic hyaline globules 為其病理特徵之 一 3. Teratoma with somatic-type malignancy 大多發 生在睪丸腫瘤，對一般化學治療有抗性且預後差 4. Germ cell neoplasia in situ (GCNIS)是大部分 GCT 的前驅病灶，若睪丸癌檢體中同時存在 GCNIS 則有較差的預後 5. Embryonal carcinoma 惡性度高，即便血清 tumor markers 皆正常亦常發生轉移","options":{"A":"125","B":"235","C":"25","D":"345","E":"45"},"answer":"C","reference":"(112) 參考資料(摘錄自)： Campbell Walsh Wein Urology, 12th Edition p. 1682-1684 (1) 應為 syncytiotrophoblast (3) 多發生於轉移腫瘤而非 睪丸 (4) 與預後無關","sourcePage":146},{"id":"4-079","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":79,"question":"以下關於 Seminoma 的敘述，何者正確?","options":{"A":"Clinical stage I (CS I)seminoma 患者，若採 surveillance 作為根除性睪丸切除術後的治療選 擇，需定期追蹤電腦斷層， 因容易復發於同側腹股溝","B":"原發腫瘤大小(>4cm)及有無淋巴血管侵犯是 CS I seminoma 5 年復發的重要預測因子","C":"Clinical stage I seminoma 患者，若選擇於根除性 睪丸切除術後，對後腹腔及同側骨盆腔行放射治療， 則不需定期追蹤腹部電腦斷層","D":"Clinical stage IIA/B seminoma 患者，建議常規對 左鎖骨上窩進行預防性放射治療","E":"Clinical stage IIC/III seminoma 患者，若為 IGCCCG high risk group 建議接受 4 cycles 的 BEP 化療"},"answer":"C","reference":"(112) 參考資料(摘錄自)： Campbell Walsh Urology, 12th ed. Ch76 p.1702-1706","sourcePage":147},{"id":"4-080","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":80,"question":"有關腎上腺切除手術的適應症，何者不正確?","options":{"A":"腎上腺偶見瘤 Incidentaloma 大小 ≥6 cm","B":"腎上腺偶見瘤在未顯影之電腦斷層掃描影像>10 HU","C":"腎上腺偶見瘤 18F 去氧葡萄糖正子掃描 (18F-FDG-PET)呈現去氧葡萄糖攝取(FDG uptake)增 加但少於肝臟攝取值","D":"有症狀的腎上腺髓質脂肪瘤 myelolipomas","E":"有症狀的腎上腺囊腫 adrenal cysts"},"answer":"C","reference":"(112) 參考資料(摘錄自)： Campbell 12th; page 11057,11058","sourcePage":147},{"id":"4-081","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":81,"question":"關於腎上腺手術的敘述何者錯誤?","options":{"A":"Conn syndrome 病患在接受腎上腺手術前可以使用 spironolactone 治療至少 1~2 週","B":"腎上腺切除術的絕對禁忌症包括廣泛的轉移性疾病","C":"4-6 公分的腎上腫瘤，約有 25%的機率為惡性","D":"Cushing syndrome 源自於單一腎上腺腺瘤為部分腎上 腺切除術的適應症","E":"部分腎上腺切除術適用於 MEN type IIA"},"answer":"C","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/ 參考資料(摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 107 (A)p.2409 Hypertension and hypokalemia should be corrected preoperatively, and this may occasionally require an aldosterone antagonist (spironolactone). (B)p.2407 Absolute contraindications to adrenalectomy include extensive metastatic disease,uncorrected coagulopathy,and severe cardiopulmonary disease that precludes anesthesia (C)p.2406 Approximately 6% of adrenal lesions between 4 and 6 cm are malignant, and most guidelines recommend surgical resection if the lesions show features suspicious of malignancy (D) (E) p.2421 Box 107.5 Indications for Partial Adrenalectomy","sourcePage":147},{"id":"4-082","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":82,"question":"關於陰莖癌的器官保存治療，下列何者不正確？","options":{"A":"一般來說，可作為 Tis、Ta，以及病理 Grade 1-2 的 T1 腫瘤之治療選擇 C U","B":"針對遠端腫瘤，可考慮局部腫瘤切除、包皮環切等， 1 並應有兩公分的 surgical margin","C":"Mohs microsurgery 能在手術當下即時辨識出腫瘤邊 界，整題而言優於巨觀切除搭配術中冷凍切片","D":"局部切除後若邊緣有殘餘的 CIS，可使用 topical therapy 作為輔助治療","E":"相較於 Nd:YAG，CO2 雷射因只能穿透約 0.1 mm，復發 比率最高可能達 50%"},"answer":"C","reference":"(112) /4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： ampbell Walsh Wein rology, 12th Edition p. 751-1752 (C) 兩者比較下，Mohs microsurgery may offer no additional benefit","sourcePage":148},{"id":"4-083","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":83,"question":"有關人類乳突瘤病毒(Human Papillomavirus，HPV)類型與 陰莖疾病的關係，何者不正確?","options":{"A":"HPV 病毒類型 6, 11 與尖圭濕疣(condylomata)有關","B":"HPV 病毒類型 33, 35 與陰莖惡性病變有關","C":"HPV 病毒類型 58, 59 與尖圭濕疣(condylomata)有關","D":"HPV 病毒類型 42, 44 與尖圭濕疣(condylomata)有關","E":"HPV 病毒類型 16, 18 與陰莖惡性病變有關"},"answer":"C","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： Campbell 12th; page 8110","sourcePage":148},{"id":"4-084","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":84,"question":"以下關於陰莖腫瘤的敘述，何者正確? (112) 瘤/參","options":{"A":"erythroplasia of Queyrat 和 Bowen disease 的主要 Campb 差異在於有無 loss of rete pegs 12th","B":"陰莖癌(squamous cell carcinoma)最好發於陰莖中段 Ch79","C":"電腦斷層並不適合陰莖癌原發部位的分期評估(T stage)","D":"陰莖癌(squamous cell carcinoma)最常見初始轉移部 位為 fascia lata 之下的鼠蹊部淋巴結","E":"Sentinel lymph node biopsy 可以有效偵測 microscopic metastases"},"answer":"C","reference":"/4.腎上腺&外生殖器腫 考資料(摘錄自)： ell Walsh Urology, ed. P.1742-1751","sourcePage":149},{"id":"4-085","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":85,"question":"下哪個腫瘤標記(tumor marker)與陰莖鱗狀細胞癌的淋巴 (112) 瘤/參 轉移或存活無關？ 解題說","options":{"A":"CDKN2A 1. Ca","B":"TA-4 Ur","C":"p16 2. 12","D":"TP53 3. Ch","E":"Ki-67 pp175"},"answer":"A","reference":"/4.腎上腺&外生殖器腫 考資料(摘錄自)： 明請註明 mpbell Walsh Wein ology th Edition 2021 apter 79 9, table 79.11","sourcePage":149},{"id":"4-086","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":86,"question":"關於陰莖腫瘤(penile tumors)下列敘述何者正確？ (112) 瘤/","options":{"A":"陰莖轉移性腫瘤(penile metastases)最常見的症狀 參考資 是泌尿道阻塞 Urolo","B":"陰莖基底細胞癌(basal cell carcinoma)作為陰莖常 見的腫瘤，其侵犯性較低，手術切除通常可以治癒","C":"龜頭的陰莖原位癌(carcinoma in situ)又稱為 Bowen disease","D":"陰莖黑色素瘤(melanoma)侵犯性強，手術成效不彰， P174 主要治療以化學治療為主","E":"硬化性苔癬病變(lichen sclerosus)、生殖器濕疣 (condylomata)與偽上皮增生性角化雲母狀龜頭炎 (pseudoepitheliomatous keratotic and micaceous balanitis)均與陰莖惡性腫瘤有關"},"answer":"E","reference":"/ 4.腎上腺&外生殖器腫 料(摘錄自)：Campbell gy 12E, Ch79, P1774 P1772 P1742 P1772 2","sourcePage":149},{"id":"4-087","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":87,"question":"下列關於生殖細胞腫瘤(germ cell tumors)的敘述何者正 (112) 瘤/ 確？","options":{"A":"畸胎瘤(teratoma)生長快速，其治療除了手術切除之 外，化學治療也能顯著減少腫瘤體積","B":"經陰囊睪丸切除(transscrotal orchiectomy)會增加 睪丸癌局部復發率或骨盆及腹股溝淋巴的轉移率","C":"約 0.5~0.9%的生殖細胞腫瘤病人會在對側睪丸發現 生殖細胞原位瘤(germ cell neoplasia in situ)","D":"生殖細胞腫瘤的病人若合併睪丸萎縮(atrophic testis)、隱睪病史(history of cryptoorchidism) 或年紀大於 40 歲需考慮對側睪丸切片","E":"隱睪(cryptoorchidism)病人若在青春期前接受睪丸 固定手術(orchiopexy)治療，其睪丸癌的發生率可以 降到跟沒有隱睪症的族群一樣"},"answer":"B","reference":"/ 4.腎上腺&外生殖器腫 參考資料(摘錄自)：Campbell Urology 12E, Ch76, (A) P1684 (B) P1686 (C) P1688 (D) P1688 (E) P1680","sourcePage":149},{"id":"4-088","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":88,"question":"病患劉先生 65 歲右側睪丸腫瘤接受手術，術後一週腫瘤指 數為 AFP: 12800ng/mL, hCG: 25800iU/L, LDH: 150iU/L， 病理診斷為 embryonal carcinoma，電腦斷層發現肺部轉 移，根據 NCCN Guidelines for Testicular Cancer Version 1.2023 此時建議劉先生接受哪種配方的化學治療最為適 合？","options":{"A":"Bleomycin/etoposide/cisplatin for 3 cycles","B":"Bleomycin/etoposide/cisplatin for 4 cycles","C":"Etoposide/cisplatin for 3 cycles","D":"Etoposide/cisplatin for 4 cycles","E":"Etoposide/ifosfamide/cisplatin for 4 cycles"},"answer":"E","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/ 參考資料(摘錄自)： NCCN Guidelines for Testicular Cancer Version 1.2023 NSEM-6","sourcePage":150},{"id":"4-089","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":89,"question":"關於腎上腺皮質癌(adrenal cortical carcinoma)下列敘 述何者正確？","options":{"A":"腎上腺皮質癌有可能合併內分泌異常，其中有超過一 半為非功能性(nonfunctional)","B":"在功能性(functional)的腎上腺皮質癌中最常見的內 分泌異常為庫欣氏症(Cushing syndrome)","C":"腎上腺皮質癌極其罕見，其發生率約為 0.07~0.2%","D":"腎上腺皮質癌的預後極差，就算是腫瘤分期 T1N0M0 的病人也只有不到 20%的五年存活率","E":"Li-Fraumeni syndrome 跟腎上腺皮質癌發生有關，其 表現為 p53 的過度表現(overexpression)"},"answer":"B","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/ 參考資料(摘錄自)：Campbell Urology 12E, Ch106, (A) P2385 (B) P2385 (C) P2384 (D) P2387 P2384","sourcePage":150},{"id":"4-090","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":90,"question":"下列關於腎上腺疾病的敘述何者正確?","options":{"A":"與第二型家族性高醛固酮症相關的基因突變位置為 7q22","B":"Cushing syndrome 的病人在接受雙側腎上腺切除術 後，超過一半的病人會產生 Nelson-Salassa syndrome","C":"腎上腺的 Myelolipoma，病程發展相當惡性，一旦診 斷需積極手術切除","D":"先天性腎上腺增生(Congenital adrenal hyperplasia)為體染色體隱性遺傳疾病，約有 95% 的 患者是缺乏 21-hydroxylase 這個酵素","E":"可以利用嗜鉻細胞瘤會吸收 123I-MIBG 的特性，來治 療轉移的嗜鉻細胞瘤"},"answer":"D","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/ 參考資料(摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 106 (A) p.2368 Linkage analysis suggests that mutations in the 7p22 region are responsible for FH type II in some families (B)p.2366 This is known as the Nelson- Salassa syndrome (also known as Nelson syndrome), which is found in 8% to 29% of patients who have undergone bilateral adrenalectomy in large series. (C) p.2392 The clinical course is benign, and surgery is indicated only for extremely large or symptomatic lesions (D) p.2383 The disorder is autosomal recessive and associated with a deficiency in the enzyme 21-hydroxylase in over 95% of cases (E)p.2830 Given the selective uptake of MIBG by pheochromocytoma cells, systemic treatment of metastatic disease with radioactive 131I-MIBG may be instituted.","sourcePage":150},{"id":"4-091","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":91,"question":"下列有關陰莖腫瘤的描述何者錯誤?","options":{"A":"陰莖皮角 (Cutaneous Horn)是由死去的上皮細胞一 層一層堆積形成，有可能變成 carcinoma，具癌化風 險，切除後仍須密切追蹤","B":"Condyloma acuminatum (尖狀濕疣)，俗稱的菜花，常 見的性傳染疾病，由人類乳突狀病毒 HPV 感染所致， 其中 HPV type 31、33 比較容易有惡性變化","C":"陰莖癌可能會產生副甲狀腺相關激素，活化 osteoclastic bone resorption","D":"陰莖癌患者若發現一處以上腹股溝淋巴結轉移或是腫 瘤出現 extracapsular nodal extension，應建議接 受 pelvic lymphadenectomy","E":"根據 2023 年 NCCN Guideline，陰莖癌病灶若吃到 corpus spongiosum 合併尿道侵犯，是為 T3 的 lesion"},"answer":"E","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/ 參考資料(摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 79 (A)p. 1742 Because this tumor may evolve into a carcinoma or may develop as a result of an underlying carcinoma, careful histologic evaluation of the base and close follow-up of the excision site are essential (B)p.1742 Types 16, 18, 31, 33, 35, 39, 45, 51, 52, 58, and 59 have a higher association with malignant disease (C)p. 1747 Parathyroid hormone and related substances may be produced by tumor and metastases that activate osteoclastic bone resorption (D)p.1762 PLND is now recommended when more than one inguinal lymph node exhibits metastasis or when ENE of cancer is present. (E) T2: Tumor invades into corpus spongiosum (either glans or ventral shaft) with or without urethral invasion","sourcePage":151},{"id":"4-092","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":92,"question":"下列成年男性germ cell tumor (GCT) 的subtypes，何者 不是源自germ cell neoplasia in situ (GCNIS)？","options":{"A":"spermatocytic tumor","B":"embryonal tumor","C":"teratoma","D":"choriocarcinoma","E":"classic seminoma"},"answer":"A","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/ 參考資料(摘錄自)： Campbell-Walsh Urology, 12th edition Review. Chapter 76 p.284、288 answer: Spermatocytic tumor. GCNIS is the common precursor lesion for all types of adult male GCT with the exception of spermatocytic tumor. Pediatric GCTs do not typically arise from GCNIS.","sourcePage":152},{"id":"4-093","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":93,"question":"下列有關睪丸腫瘤的敘述，下列何者錯誤？","options":{"A":"Sex Cord-Stromal Tumors 有 90% 都是良性。","B":"睪丸腫瘤也有可能為轉移性腫瘤，但很少見，通常來 自肝臟的轉移。","C":"Adenomatoid Tumor 腺癌樣瘤起源於 mesothelial， 是最常見的睪丸旁腫瘤(para-testicular tumor)。","D":"Paratesticular mesothelioma 源於 tunica vaginalis，通常被認為是無痛的睪丸旁腫塊或是陰囊 水腫旁的贅生物。","E":"Primary testicular non-Hodgkin lymphoma 很少 見，約 35％的患者是雙側睪丸侵犯，25%的患者出現 全身症狀。"},"answer":"B","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/ 參考資料(摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 76 （Ａ）p.1707 Approximately 90% of these tumors are benign and 10% are malignant. （Ｂ）p.1709 Metastases to the testis are rare. Bilateral involvement occurs in 15% of patients. The most common primary tumors are prostate, lung, melanoma, colon, and kidney cancer （C）p.1709 Adenomatoid tumor is of mesothelial origin and is the most common paratesticular tumor (D)p.1709 Paratesticular mesothelioma arises from the tunica vaginalis and usually is seen as a painless paratesticular mass or tunical vegetations in association with a hydrocele ( E )p.1709 Primary testicular non-Hodgkin lymphoma (NHL) is a rare tumor and represents only 1% to 2% of all cases of lymphoma. Bilateral testicular involvement occurs in 35% of cases. Approximately 25% of men have systemic symptoms (fever, night sweats, weight loss).","sourcePage":153},{"id":"4-094","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":94,"question":"以下關於睪丸畸胎瘤(teratoma)之敘述，何者正確?","options":{"A":"一般多會伴隨不正常的腫瘤指標(tumor marker)表現","B":"有高機率因體細胞轉化(somatic transformation)而 形成惡性腫瘤，如: 横纹肌肉瘤 (rhabdomyosarcoma)、腺癌(adenocarcinoma)、原始 性神經外胚瘤(primitive neuroectodermal tumor)","C":"成人混合型生殖細胞瘤(mixed GCT)中約半數包含畸 胎瘤成分","D":"對於成年人睪丸畸胎瘤，區分 mature 及 immature teratoma 對於臨床治療評估相當重要，但在組織學上 兩者不易區分","E":"畸胎瘤的體細胞惡性轉化(somatic-type malignancy)大多發生自睪丸"},"answer":"C","reference":"(112)/4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： Campbell Walsh Urology, 12th ed. Ch76 p.1684","sourcePage":154},{"id":"4-095","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":95,"question":"以下關於 NSGCT(nonseminoma germ cell tumor)之敘述， 何者正確?","options":{"A":"clinical stage I NSGCT 可依有無淋巴血管侵犯或絨 毛膜癌(choriocarcinoma)區分高或低的轉移風險","B":"對於高轉移風險的 clinical stage I NSGCT 建議執行 RPLND 或 induction chemotherapy (BEP X 4 cycles) 以降低復發機率","C":"針對 CSIIC/III NSGCT 執行一線化療後殘餘腫瘤切除 (post-chemotherapy surgery)，有過半的病理報告與 原發 GCT 成分相同","D":"若化療後殘餘腫瘤切除(post-chemotherapy surgery)的病理報告出現腫瘤壞死是不好的預後因子","E":"輔助性化療(Adjuvant chemotherapy)對於 stage II NSGCT，可降低復發機率並增加長期存活率"},"answer":"C","reference":"(112)/4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： Campbell Walsh Urology, 12th ed. Ch76 p.1693-1702","sourcePage":154},{"id":"4-096","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":96,"question":"關於附睾、精索腫瘤敘述，下列者錯誤？","options":{"A":"附睾原發性腫瘤通常是良性的，最常見的是腺瘤樣腫 瘤(Adenomatoid tumors)","B":"附睾的腺瘤樣腫瘤，通常發生在 30~40 歲","C":"附睾的囊腺瘤(Cystadenomas)，約 30% 的病例是雙 側，並且常與 von Hippel-Lindau 相關","D":"精索腫瘤通常是惡性的，最常見的是橫紋肌肉瘤 (rhabdomyosarcoma)","E":"對於橫紋肌肉瘤治療，通常是後腹膜腔淋巴腺切除術 (RPLND)，輔助放療和化療(adjuvant radiotherapy and chemotherapy)一起進行"},"answer":"D","reference":"(112)/4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： 答案通常是良性 Smith & Tanagho's General Urology, 19ed. Chapter 22: Genital Tumors 14/20","sourcePage":154},{"id":"4-097","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":97,"question":"對於睪丸腫瘤相關敘述，下列何者錯誤？","options":{"A":"胎兒蛋白(a-FP) 是一種糖蛋白，分子量為 70,000 Da，半衰期為 5-7 天。精原細胞瘤(Seminoma) 的 a-FP 絕對不會高","B":"人絨毛膜促性腺激素(hCG) 是一種糖蛋白，分子量為 38,000 Da，半衰期為 24~36 小時，絨毛膜癌 (Choriocarcinoma) 的 hCG 上升機率是 100%","C":"乳酸脫氫酶 (LDH) 是一種細胞酶，分子量為 134,000 Da，半衰期為 24 小時。常與 NSGCTs(non-seminoma germ cell tumors)中的腫瘤負荷(Tumor burden)相 關。","D":"No nonpulmonary visceral metastases 在 seminoma 治療分類預後是屬於 good risk","E":"Nonpulmonary visceral metastases 在 non-seminoma 治療分類預後是屬於 good risk"},"answer":"E","reference":"(112)/4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： 答案是 No nonpulmonary Smith & Tanagho's General Urology, 19ed. Chapter 22: Genital Tumors 6,7,11/20","sourcePage":155},{"id":"4-098","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":98,"question":"有關睪丸腫瘤的 TNM stage , 下列何者錯誤？","options":{"A":"腫瘤局限於睾丸(Tumor limited to testis)，無淋巴 血管浸潤(without lymphovascular invasion)是 pT1","B":"腫瘤局限於睾丸(Tumor limited to testis)，有淋巴 血管浸潤(with lymphovascular invasion)是 pT2","C":"腫瘤直接侵犯精索(Tumor directly invades spermatic cord) ，無淋巴血管浸潤(without lymphovascular invasion)是 pT3","D":"腫瘤直接侵犯精索(Tumor directly invades spermatic cord) ，有淋巴血管浸潤(without lymphovascular invasion)是 pT4","E":"LDH, a-FP, hCG 均在正常值以內是屬於 S0"},"answer":"D","reference":"(112)/4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： 答案是 T3 Smith & Tanagho's General Urology, 19ed. Chapter 22: Genital Tumors 4~5/20","sourcePage":155},{"id":"4-099","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":99,"question":"關於腎上腺腫瘤敘述，下列何者錯誤？","options":{"A":"關於 Cushing syndrome 最常見外源性的原因是醫源 性類固醇使用","B":"關於 Cushing syndrome 最常見內源性的原因是 Cushing disease","C":"關於 Conn syndrome，最常見的原因是腺瘤(adenoma)","D":"嗜鉻細胞瘤(pheochromocytoma)典型三症狀是： headache, episodic sudden perspiration, and tachycardia","E":"腎上腺外的嗜鉻細胞瘤的位置以沿著交感神經鏈 (sympathetic chain)最常見"},"answer":"C","reference":"(112)/4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： 答案是 Bilateral hyperplasia 1. CAMPBELL-WALSH UROLOGY 12ed. Chaper 106 Pathophysiology, Evaluation, and Medical Management of Adrenal Disorders Fig106.6, 106.12, 106.16","sourcePage":155},{"id":"4-100","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":100,"question":"陰莖癌有可觸摸的腹股溝淋巴結轉移時，下列何種情況可 (1 瘤 以不須先切片直接進行後續治療？ NC","options":{"A":"T2N2M0，Grade 3，單側腹股溝單一可移動淋巴結 4 1. 公分","B":"T1bN2M0，Grade 2，雙側腹股溝可移動淋巴結 1 公分 (D","C":"T1aN1M0，Grade 1，單側腹股溝單一可移動淋巴結 3 IL 公分 le","D":"T2N2M0，Grade 2，單側腹股溝兩顆可移動淋巴結 1 考 公分 IL","E":"T3N3M0，Grade 3，單側腹股溝單一固定淋巴結 2 公分"},"answer":"D","reference":"12) /4.腎上腺&外生殖器腫 /參考資料(摘錄自)： CN Guidelines Version 2023 Penile Cancer )屬於 palpable non-bulky N with high-risk primary sion，應逕自進行 ILND 或 慮 neoadjuvant C/T then ND","sourcePage":156},{"id":"4-101","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":101,"question":"根據 NCCN Guidelines，Non-seminomatous germ cell (1 瘤 tumor (NSGCT)可考慮進行後腹腔淋巴結廓清術的情況，下 參 列何者為非？ NC","options":{"A":"pT2N0M0S0 的主要治療 1.","B":"pT3N1M0S0 的主要治療","C":"pT2N2M0S1，化療完成後抽血及影像檢查皆正常時的後 (E 續治療 co","D":"pT1N1M1aS0，化療完成後抽血及影像檢查皆正常時的 血 後續治療","E":"pT3N0M0S1，化療完成後抽血及影像檢查皆正常時的後 續治療"},"answer":"E","reference":"12) /4.腎上腺&外生殖器腫 / 考資料： CN Guidelines Version 2023 Testicular Cancer )Stage IS 化療後達 mplete response 及正常抽 ，應選擇 surveillance","sourcePage":156},{"id":"4-102","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":102,"question":"三十歲男性，主訴高血壓及陣發性頭痛。抽血檢查血漿中 (1 瘤 catecholamine 濃度 1100 ng/L，服用 0.3 mg clonidine 參 三小時後 catecholamine 濃度為 400 ng/L。下列何者為該 Ca 患者最可能的診斷？ Ur","options":{"A":"腎動脈狹窄 (renal artery stenosis) 23","B":"嗜鉻細胞瘤 (pheochromocytoma)","C":"原發性高血壓 (essential hypertension) 在 神","D":"腎上腺增生 (adrenal hyperplasia) 會","E":"特發性高醛固酮症 (idiopathic 細 hyperaldosteronism) 在 st"},"answer":"C","reference":"12) /4.腎上腺&外生殖器腫 / 考資料： mpbell Walsh Wein ology, 12th Edition p. 77 原發性高血壓患者中，交感 經 norepinephrine 的製造 被 clonidine 抑制，而嗜鉻 胞瘤則否。Clonidine test 診斷 renal artery enosis、adrenal hyperplasia、idiopathic hyperaldosteronism 沒有角 色。","sourcePage":156},{"id":"4-103","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":103,"question":"以下關於腎上腺構造及其生理學的敘述何者正確?","options":{"A":"Zona glomerulosa 中含有 aldosterone synthase (CYP11B1)可製造 aldosterone，Zona fasciculata 中則含有 11β-hydroxylase enzymes (CYP11B2)可製 造 cortisol","B":"血漿中超過 90% normetanephrine (norepinephrine metabolite)，以及約 20% metanephrine (epinephrine metabolite)是來自腎上腺髓質","C":"Norepinephrine 以及 Epinephrine 皆可由 catechol-O-methyltransferase [COMT]轉變成 Free metanephrines","D":"Zona glomerulosa 分泌的 aldosterone 有很好的留 Na 效果，會造成體內鈉離子濃度上升","E":"Adrenocorticotropic hormone (ACTH)上升會刺激 Zona glomerulosa 分泌 aldosterone，最終導致 Zona glomerulosa 萎縮"},"answer":"C","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition, Chapter 106, P.2356-2360","sourcePage":157},{"id":"4-104","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":104,"question":"關於 Adrenal incidentaloma 之鑑別診斷及檢查之敘述何 者正確?","options":{"A":"Subclinical Cushing Syndrome 佔 Adrenal incidentaloma 僅約 10%且幾乎不可能轉變成 Cushing syndrome","B":"Cushing syndrome 除了使用 low dose dexamethasone 診斷之外，也可以使用 24-hour urinary free cortisol (UFC)協助診斷","C":"小於 40 歲的病人，有單側大於 1 公分之 adenoma，建 議先做 Adrenal vein sampling 再決定手術","D":"Pheochromocytoma 因富含血管，低脂肪的特性，需使 用 Enhanced CT 使其 attenuation HU>10 與 adenoma 做鑑別診斷","E":"Pigmented Nodular Adrenocortical Disease 在 Cushing syndrome 約占 1%，是 McCune-Albright syndrome 的特徵"},"answer":"A","reference":"(112) / 4.腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition, Chapter 106, P.2360-2376","sourcePage":157},{"id":"4-105","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":105,"question":"關於腎上腺手術相關的敘述，下列何者正確?","options":{"A":"電腦斷層 Enhancement washout of <50% and delayed attenuation > 25 HU on contrasted CT，有符合腎 上腺腫瘤的手術適應症","B":"局部復發 2cm 腎上腺腫瘤，可考慮使用達文西機械手 臂進行切除","C":"左側腎上腺切除手術中過程不順利，造成脾臟出血而 必須切除脾臟，應立刻給予肺炎鏈球菌 (pneumococcus),流感嗜血桿菌疫苗(Haemophilus influenzae type B),以及腦脊髓膜炎 (meningococcus)之疫苗","D":"執行部分腎上腺切除術，適度的 mobilization 能保留 更多腎上腺之血流供給","E":"病態肥胖的病人接受 open adrenalectomy 不適合用 retroperitoneal approach，原因在於後腹腔過多的 脂肪會使腎上腺難以分離"},"answer":"C","reference":"(112) / 4.腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition, Chapter 107, P.2407-2423","sourcePage":157},{"id":"4-106","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":106,"question":"下列關於陰莖腫瘤的敘述何者錯誤？","options":{"A":"Buschke-Lowenstein tumor 會侵犯周圍組織，但不會 遠端轉移","B":"Kaposi sarcoma 易發生在移植病患，且會隨免疫抑制 劑的劑量調整而消退","C":"小於十分之一的 Lichen sclerosus 會發產為陰莖癌","D":"Neonatal circumcision 可預防陰莖原位癌和惡性腫 瘤的發生","E":"Mohs microsurgery 無法提供比陰莖癌切除術中 Forzen-section assessment 更高的 negative margin detection rate"},"answer":"D","reference":"(112) / 4.腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition, Chapter 79","sourcePage":158},{"id":"4-107","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":107,"question":"有關生殖細胞瘤原位腫瘤(Germ Cell Tumor Neoplasia in Situ，GCTIS)，何者不正確?","options":{"A":"在睪丸切除的檢體看到 GCTIS 與預後或復發無關","B":"由位於曲細精管底部的未分化生殖細胞組成","C":"在兒童生殖細胞瘤是很常見的","D":"曲細精管內的缺少精子發生過程(Spermatogenesis)","E":"由 GCTIS 衍生的精母細胞瘤(seminoma)及非精母細胞 瘤生殖細胞瘤(NSGCT)分別各占 52-56% 44-48%"},"answer":"C","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： Campbell 12th; page 7824","sourcePage":158},{"id":"4-108","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":108,"question":"有關男性尿道及男性尿道癌的描述，何者不正確?","options":{"A":"前段尿道包含陰莖尿道及球狀尿道","B":"前段尿道癌有 80%為鱗狀細胞癌","C":"腺癌主要在膜狀尿道及前列腺尿道","D":"後段尿道包含前列腺尿道及膜狀尿道","E":"後段尿道癌主要為泌尿上皮癌"},"answer":"C","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： Campbell 12th; page 8268","sourcePage":158},{"id":"4-109","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":109,"question":"有關腹腔鏡腎上腺切除手術的相對及絕對禁忌，何者不正 確?","options":{"A":"懷孕","B":"先前腎上腺腫瘤手術切除後局部復發","C":"兩側腎上腺增生 Bilateral adrenal hyperplasia","D":"嚴重心肺疾病","E":"侵襲性腎上腺皮質癌併侵入腎血管"},"answer":"C","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： Campbell 12th; page 11060, 11061","sourcePage":159},{"id":"4-110","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":110,"question":"一名 55 歲男性在龜頭上切除了一個 1 厘米、生長緩慢的 紅色斑塊。 在顯微鏡下，上皮顯示全層分化異常(full thickness dysplasia)、多形性細胞和有絲分裂。如下圖。 CDKN2 免疫染色呈強陽性，Ki67 在所有細胞層中呈陽性。 關於此病灶，以下哪項陳述是正確的？","options":{"A":"診斷為分化型陰莖上皮內瘤樣增生樣 (Differentiated Penile intraepithelial neoplasia hyperplasia-like)","B":"很難將這種病變灶與鱗狀增生(squamous hyperplasia)區分開來","C":"人類乳突瘤病毒 16 型(HPV16)是此病灶中最常見的基 因型","D":"它是最常見的侵襲性陰莖癌亞型的前型(precursor)","E":"這種腫瘤通常與硬化性苔蘚(lichen sclerosus)有關"},"answer":"C","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： 解題說明請註明 1. Diagnostic Histopathology 25(10) 2019 pp 390-97; 2. Campbell Walsh Wein Urology 12th Edition 2021 3. Chapter 59 & 79 4. pp1296; 1742 HPV16 is the most frequent genotype identified in the lesion. This is HPV related PeIN. 67% of basaloid PeIN are positive for HPV16 genotype.","sourcePage":159},{"id":"4-111","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":111,"question":"一位 69 歲的男性因以下病灶到您的診所就診， 經過局部使用類固醇和抗真菌藥膏治療，病灶仍然存在。 病理切片顯示全層異型性 (full thickness atypia)(如下 圖) 這種病灶稱為什麼？","options":{"A":"Buschke–Löwenstein tumor","B":"鮑溫樣丘疹病 (Bowenoid papulosis)","C":"奎瑞氏紅皮增生症 (Erythroplasia of Queyrat)","D":"卡波西肉瘤 (Kaposi Sarcoma)","E":"佩吉特病 (Paget’s disease)"},"answer":"B","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/ 解題說明請註明 1. Campbell Walsh Wein Urology 2. 12th Edition 2021 3. Chapter 59 4. pp 1296-99 full thickness atypia is the character of Bowenoid papulosis","sourcePage":159},{"id":"4-112","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":112,"question":"下列敘述，哪項是錯誤的？","options":{"A":"在老年男性中，最常見的睾丸惡性腫瘤是淋巴瘤","B":"為了避免誤判，睪丸癌化療結束與實施 18F-FDG PET/CT 掃描之間應至少間隔 4 週","C":"對睪丸癌的病人來說，對側睾丸微石症 (microlithiasis)會增加原位生殖細胞瘤(Germ Cell Tumor Neoplasia in Situ)的風險","D":"精母細胞瘤(spermatocytic tumor)與隱睾症病史和 原位生殖細胞瘤無關","E":"睾丸網腺癌(Adenocarcinoma of the rete testis) 是一種高度惡性的腫瘤，且化療和放療對此腫瘤無效"},"answer":"B","reference":"(112)/ 4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： 解題說明請註明 1. Campbell Walsh Wein Urology 2. 12th Edition 2021 3. Chapter 128;3;76 4. pp2920.e13; 44; 1680; 1682; 1708 There should be a minimum of 6 weeks between the end of chemotherapy and acquisition of an 18F-FDG PET/CT scan to avoid any false-positive findings resulting from chemotherapy-induced inflammatory and granulomatous tissues or false-negative results resulting from temporary suppression of tumor cell activities","sourcePage":160},{"id":"4-113","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":113,"question":"關於腎上腺的敘述，下列何者錯誤？","options":{"A":"Accessory adrenal tissue 也被稱為腎上腺殘餘組 織，可能由皮質或髓質組織組成。儘管腎上腺殘餘組 織在 50%的新生兒中可以發現，但該組織通常會萎 縮，大約只有 1%的成人中還有存在","B":"ACTH-independent bilateral macronodular adrenal hyperplasia(AIMAH)為多個大型的結節取代腎上腺組 織，每個腎上腺的重量可以超過 60 克，同時也是 autosomal dominant Carney complex 的特徵之一","C":"在高血壓患者中，有原發性高醛固酮症的患者，其被 診斷出中風的機率增加了 4 倍，心肌梗塞的機率增加 了 6.5 倍，心房顫動的機率增加了 12 倍","D":"基於家族性高醛固酮症(familial primary aldosteronism)的罕見性，不該對所有患者進行基因 篩檢。然而，當病患有高醛固酮症家族史、早發病(<20 歲)或家族中有年輕型腦中風的患者應考慮進行基因 檢測","E":"在遺傳性嗜鉻細胞瘤(hereditary Pheochromocytoma)當中，第四型遺傳性副神經節瘤症 候群 (Familial paraganglioma syndrome)發展成惡 性腫瘤的可能性高過第一型遺傳性副神經節瘤症候群"},"answer":"B","reference":"(113) Campbell-Walsh Urology 12th ed. Chapter 106 A: p.2356 B: p.2362 要更改為 McCune-Albright syndrome 而非 autosomal dominant Carney complex； primary pigmented nodular adrenocortical disease (PPNAD) 才與 autosomal dominant Carney complex 有 關 C: p.2368 D: p.2370 E: p.2374, table106.6","sourcePage":161},{"id":"4-114","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":114,"question":"下列關於腎上腺及相關疾病的敘述，何者錯誤？","options":{"A":"利用 CT washout study 可鑑別 Lipid poor adenoma 與其他 adrenal lesion，然 Renal cell carcinoma 轉 移至腎上腺影像特徵會與 lipid poor adenoma 相似","B":"6 公分以上的 Adrenal cortical carcinoma，open surgery 會比 laparoscopic surgery 有較少的 Peritoneal seeding，然而即便手術切除，其五年存 活率仍不到 6 成","C":"Pheochromocytoma 在切除術後，高血壓大多會改善， 然約 16%的病人會有腫瘤復發，其中 Extra-adrenal disease, hereditary pheochromocytoma 以及 large tumor 有較高的 Hazard ratio 發生復發","D":"執行左側腎上腺切除，因誤傷脾臟而需切除脾臟時， 需記得術後施打 meningococcus 以及 B 型肝炎 (Hepatitis B)疫苗","E":"Conn syndrome 的病人在初診斷時，6 成~9 成血鉀正 常，血鈉大多落在正常範圍，而鑑別 Subtype 能提供 較準確的治療給患者"},"answer":"D","reference":"(113)/ Campbell’s Urology, 12th ed, chapter 106, p. 2397 key point p. 2387 p. 2380 p. 2423 p. 2368 & 2372","sourcePage":161},{"id":"4-115","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":115,"question":"下列關於腎上腺及相關疾病的敘述，何者錯誤？","options":{"A":"腎上腺腫瘤導致 Cushing syndrome 所造成的 Cushingoid phenotype 大多會在腎上腺切除術後 7 至 9 個月改善","B":"雙側腎上腺切除術後發生 Nelson syndrome 的機率大 概是 8~29%","C":"血液中超過 90%的 metanephrine 以及超過 20%的 normetanephrine 來源於腎上腺髓質(adrenal medulla)，這兩者是經由兒茶酚-O-甲基轉移酶 catechol o- methyltransferase (COMT) 催化產生的","D":"Aldosterone level 較不是由 ACTH 調控，主要是由 angiotensin II 透過腎素-血管收縮素系統 (RAAS)及 血中鉀離子調節，因此 Zona glomerulosa 在 Pituitary failure 時較不會萎縮","E":"Cushing disease 女性患者佔 2/3，且大多原因為腦 下垂體之 Corticotropin-producing macroadenoma"},"answer":"E","reference":"(113)/ Campbell’s Urology, 12th ed, chapter 106, p. 2362 p. 2365 p. 2360 p. 2360 p. 2361","sourcePage":162},{"id":"4-116","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":116,"question":"關於腎上腺皮質癌(Adrenal cortical carcinoma)的敘 述，下列何者錯誤？","options":{"A":"可以根據 CpG island hypermethylated phenotype (CIMP)，得知 DNA 甲基化的程度，來預測病患五年的 存活率。高度甲基化的病患存活率將遠低於低度甲基 化的病患","B":"在過往有癌症病史的病患上，新發現的腎上腺腫瘤， 超過一半是屬於轉移性的病灶","C":"18F-FDG PET 能有效區分腎上腺良性或惡性腫瘤，其 敏感性和特異性分別高達 97%和 91%，也能區分是否為 轉移病灶","D":"根據 FIRM-ACT 臨床試驗的結果，mitotane 加上 etoposide, doxorubicin, cisplatin 是目前全身性 治療的首選，能夠改善 objective response rate 及 progression free survival","E":"在兒童中，超過 90%的腎上腺皮質癌在發病時是具有 功能性的，其中男性化(virilization)是最常見的臨 床表現"},"answer":"C","reference":"(113)Campbell-Walsh Urology 12th ed. Chapter 106 A: p.2384 CpG island hypermethylated phenotype (CIMP) was categorized in low, intermediate, and high subtypes. Five-year survival was significantly associated with CIMP category and was 80% for CIMP-low, 43% for CIMP-intermediate, and 0% for CIMP-high. B: p.2388 It has been estimated that in patients with a history of a previous malignancy, over 50% of newly discovered adrenal lesions are metastatic C: p.2385 無法區分是否為轉移病灶 The sensitivity and specificity of 18F-FDG PET in diagnosing benign from malignant tumors was 97% and 91% in a meta-analysis. However, 18F-FDG PET cannot distinguish ACC from other malignancies and metastases. D: p.2388 E: p.2388 More than 90% of ACCs in children are functional at the time of presentation, with virilization being the most common clinical manifestation, occurring in 55% to 70% of patients","sourcePage":162},{"id":"4-117","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":117,"question":"下列關於腎上腺嗜鉻細胞瘤(pheochromocytoma)的敘述何 者錯誤?","options":{"A":"嗜鉻細胞瘤的惡性只能透過是否有轉移來定義","B":"儘管手術預後良好，高達 16%的患者在切除後多年仍 可能復發","C":"在沒有α-blockade 的情況下，β antagonists 會透 過阻斷 beta1-receptor-mediated dilation of arteriolies 而增強腎上腺素對α1 receptor 的作用","D":"血壓正常且無症狀的患者不需要術前的α-blockade","E":"嗜鉻細胞瘤在 unenhanced CT 上，其 Hounsfield units 通常大於 10 HU"},"answer":"C","reference":"(113)/ 參考資料(摘錄自)： Campbell-Walsh-Wein Urology , 12th edition, Ch106. P2373-2380 (C)Arteriolar dilation of beta 2 receptor","sourcePage":163},{"id":"4-118","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":118,"question":"一名 50 歲男性健康檢查意外發現左側腎上腺腫瘤 (Adrenal incidentaloma)，直徑大小約 3.5 公分，有關此 病患的後續處置，下列描述何者錯誤？","options":{"A":"所有意外發現的腎上腺腫瘤都需要安排內分泌學檢查","B":"一般而言腫瘤越大，其惡性機率越高","C":"必要時可安排腎上腺切片，切片後常見診斷為嗜鉻細 胞瘤(Pheochromocytoma)","D":"首次內分泌檢查若無異常，無變化則不必重複檢查","E":"若影像追蹤發現腫瘤變大超過 1 公分即可安排手術切 除"},"answer":"C","reference":"(113)/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition Chapter 106 P.2399, 2403 (C)切片前必須先排除嗜鉻細 胞瘤診斷","sourcePage":163},{"id":"4-119","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":119,"question":"下列關於 Germ cell tumor(GCT)的敘述，何者錯誤？","options":{"A":"在青春期前執行 Orchidopexy 能將發生睪丸癌的機率 從 4~6 倍下降至 2~3 倍，","B":"IGCCCG risk classification 是用來評估 metastatic GCT 患者的預後","C":"AFP 的半衰期在 5~7 天，而 HCG 的半衰期是 24~36 小 時","D":"幾乎所有 GCT 患者在接受完化學治療後都會造成 azoospermia ; 然若化療前精液分析在正常範圍內， 約 5 成的患者，可在 1 年內恢復到原先數值","E":"若在後腹腔的 Primary landing zone 有 5~9mm 的淋巴 腫大就應當視為局部淋巴轉移，而左側及右側的睪丸 腫瘤 Primary landing zone 並不相同"},"answer":"D","reference":"(113)/ Campbell’s Urology, 12th ed, chapter 76, p. 1680 p. 1691 key point p. 1686 p. 1690 p. 1689","sourcePage":164},{"id":"4-120","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":120,"question":"腹腔鏡腎上腺切除術的絕對禁忌症?","options":{"A":"明顯的腹腔沾黏","B":"腎上腺腫瘤大於 12 公分","C":"腎上腺皮質癌 (Cortical carcinoma)有血栓在下腔 靜脈","D":"惡性嗜鉻細胞瘤 (pheochromocytoma)","E":"以上皆是"},"answer":"C","reference":"(114)/ Campbell’s Urology 12th edition Chapter 107","sourcePage":164},{"id":"4-121","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":121,"question":"有關男性原發性尿道惡性腫瘤的敘述，下列何者最不正確?","options":{"A":"Squamous cell carcinoma 常見於前段尿道","B":"Adenocarcinoma 常見於球狀尿道","C":"Urothelial carcinoma 常見於後段尿道","D":"前段尿道的腫瘤，位於陰莖尿道多於球狀尿道","E":"惡性腫瘤的形態，由多到少依序為 urothelial carcinoma > squamous cell carcinoma > adenocarcinoma"},"answer":"D","reference":"(114) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1539-1563","sourcePage":164},{"id":"4-122","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":122,"question":"下列何者並非腎上腺嗜鉻細胞瘤(adrenal pheochromocytomas)的影像特點?","options":{"A":"病灶邊界清晰","B":"脂質含量高","C":"血管分布豐富","D":"在未注射顯影劑的電腦斷層中，病灶的 Hounsfield unit(HU)大於 10 單位","E":"在延遲期影像(delayed imaging)中常見顯影劑快速 洗脫的現象(rapid contrast washout)"},"answer":"B","reference":"(114)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell’s Urology, 12th ed, Part XII, Chapter 106. P.2375 (B)脂質含量低","sourcePage":164},{"id":"4-123","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":123,"question":"下列關於男性生殖細胞腫瘤的敘述何者錯誤？","options":{"A":"雖然畸胎瘤在病理上屬於良性，但具有基因不穩定 性，因此仍可能出現惡性轉化","B":"雙側腫瘤發生率接近 2%，其中異時性 （Metachronous)雙側 GCT 比同步(Synchronous)性雙 側 GCT 更常見","C":"含有 i(12p) 的染色體異常可作為診斷 GCT 的輔助 依據，特別在找不到原發病灶時","D":"血中 β-hCG 在轉移性精原細胞瘤患者中約有 15%會 升高，常被用來評估病情變化及調整治療計劃。","E":"畸胎瘤即使出現在轉移部位，也常是來自其他類型 GCT 的分化產物，而非原發"},"answer":"D","reference":"(114)Campbell Walsh Wein Urology, 12th Edition, Chapter 7 P1684,1692 (D)血清腫瘤標記物在精原細 胞瘤患者中對於追蹤療效的 參考價值有限。","sourcePage":165},{"id":"4-124","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":124,"question":"下列有關於陰莖癌(Penile cancer)的手術治療，何者是錯 誤的?","options":{"A":"對於小病灶、低分級與低期別（Tis、Ta、T1；第 1 級與第 2 級）之患者，是適合進行器官保留手術以維 持性生活品質的理想對象","B":"器官保留的目標是，在可能的情況下保留龜頭組織以 維持感覺功能，若無法保留龜頭，則設法保留陰莖長 度","C":"手術方式包括有限切除（limited excision）、莫氏手 術（Mohs surgery）及雷射燒灼（laser ablation）","D":"與傳統截除術(Amputation)相比，器官保留術後的復 發率及存活率明顯較差，因此術後仍需積極追蹤","E":"對於大型或深層侵犯的病灶，傳統截除術 (Amputation)仍是標準治療方式，以迅速控制腫瘤 題號 答案 考 題"},"answer":"D","reference":"(114)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell’s Urology, 12th ed, Part VII, Chapter 79. P.1753 (D)與傳統截除術 (Amputation)相比，器官保留 術後的局部復發率整體上較 高，但若能早期偵測並治療復 發，則初期存活率不會受到負 面影響 年度 類別 參考資料","sourcePage":165},{"id":"5-001","category":"生理解剖","categoryOrder":5,"number":1,"question":"下列關於男性生殖的解剖生理何者為非？","options":{"A":"血睪障壁（blood testis barrier）主要是為了阻止成 人免疫系統攻擊不認識之減數分裂後的精子，換句話 說，在青春期未有初精（spermache）前，睪丸的損傷 並不會誘發抗精子的抗體產生","B":"攝護腺、儲精囊、副睪、輸精管等器官是睪固酮 （testosterone）轉化成二氫睪酮 （DHT(dihydrotestosterone)）後，主要由 DHT 刺激發 育","C":"輸精管的肌肉層有三層，除了中間層為環狀肌肉，另兩 層是縱向","D":"精子在副睪運輸需要 2-12 天，然而在副睪的精子是不 會游動的，所以其運輸主要是靠細胞的收縮以及內部液 體的流動","E":"精子在副睪停留的時間主要與每天精子的製造有關，雖 說射精的頻率並不是影響停留時間的主因，但是近期的 射精排空（recent emissions”會影響在接近輸精管的 副睪尾端精子的運輸"},"answer":"B","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 12th，ch64, P1392, 1399, 1404, 1406","sourcePage":166},{"id":"5-002","category":"生理解剖","categoryOrder":5,"number":2,"question":"下列有關下泌尿道的神經傳導何者為非？","options":{"A":"副交感神經末梢釋放乙醯膽鹼(Acetylcholine)作用在 Muscarinic receptor 上導致膀胱逼尿肌收縮","B":"膀胱平滑肌的交感神經腎上腺素受體(Adrenergic receptor)主要為 Beta-3 受體","C":"膀胱頸內括約肌的交感神經腎上腺素受體(Adrenergic receptor)主要為 alpha 受體","D":"支配尿道括約肌的副交感神經其神經傳導物質是乙醯 膽鹼(Acetylcholine)","E":"非腎上腺非乙醯膽鹼（nonadrenergic, noncholinergic）神經傳導，其神經傳導物質為 ATP， 也會出現在人類膀胱平滑肌上"},"answer":"D","reference":"(110)/5.生理解剖/參考 資料(摘錄自)：Mc Aninch JW, Lue TF. In Smith and Tanagho’s general urology by Porten SP, Presti JC Jr editors, 19th edition; chapter 22, Lance publication. 2020;454","sourcePage":166},{"id":"5-003","category":"生理解剖","categoryOrder":5,"number":3,"question":"關於肉毒桿菌毒素於膀胱的作用，何者正確?","options":{"A":"無法當作口服抗膽鹼藥物治療無效後的選擇","B":"肉毒桿菌毒素不僅抑制 ACh 的釋放來抑制傳入神經 (afferent nerve)活動，也可以通過從釋放神經遞質來 抑制傳出神經(efferent nerve)活動","C":"肉毒桿菌毒素比起抗膽鹼藥物，較不容易因殘尿量增加 而須放置尿管","D":"肉毒桿菌毒素由重鍊(heavy chain)及輕鍊(light chain)兩部分組成，由重鍊部分負責後續作用造成肌肉 放鬆","E":"肉毒桿菌可抑制逼尿肌收縮，也可以抑制感覺神經的作 用"},"answer":"E","reference":"(110)/5.生理解剖/參考 資料(摘錄自)：Campbell walsh Urology, 11th edition, P1682-1683","sourcePage":166},{"id":"5-004","category":"生理解剖","categoryOrder":5,"number":4,"question":"有關男性內生殖器的動脈血流供應，下列敘述何者錯誤?","options":{"A":"睪丸的血流供應有三套，分別來自 external spermatic artery, internal spermatic artery, 和 deferential artery","B":"供應副睪丸血流的 superior epididymal artery 來自 testicular artery, 而 inferior epididymal artery 來自 deferential artery","C":"輸精管於儲精囊端的血流供應來自 deferential artery，而睪丸端的血流供應來自 deferential artery 和 inferior epididymal artery","D":"儲精囊的血流供應不僅來自 vesiculodeferential branch of superior vesical artery，也有來自 Prostatovesicular branch of inferior vesical artery","E":"供應攝護腺膀胱頸交接處(prostatovesical junction)的血流主要來自 inferior vesical artery 分支出的 capsular artery"},"answer":"E","reference":"(110)/5.生理解剖/參考 資料(摘錄自)：Campbell 12ed, Chapter 63, Surgical, Radiographic, and Endoscopic Anatomy of the Male Reproductive System, p1370, 1375, 1377, 1380","sourcePage":167},{"id":"5-005","category":"生理解剖","categoryOrder":5,"number":5,"question":"下列關於陰莖的描述何者錯誤?","options":{"A":"大約 15%的男性勃起時的弧度是朝下的","B":"白膜(Tunica albuginea)最脆弱的地方位於陰莖的 5 點到 7 點鐘之間","C":"人類陰莖海綿體(Copora cavernosa)的中隔並沒有將 兩片陰莖海綿體完全分開","D":"內陰動脈(internal pudendal a.)是供應陰莖血流的主 要動脈，由內髂動脈(internal iliac a.)分支而來","E":"陰莖的軀體神經是源自於第 3、4、5 薦椎"},"answer":"E","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology, 11th edition, p514,612-616","sourcePage":167},{"id":"5-006","category":"生理解剖","categoryOrder":5,"number":6,"question":"以下關於女性骨盆及會陰部解剖生理學之敘述，何者正確?","options":{"A":"陰蒂複合體(Clitoro-urethro-vaginal complex/clitoral complex)包含近端陰道、陰蒂以及 尿道，是女性主要的性反應區，並且有共同的神經支配 及血流供應","B":"小陰唇(labia minora)有別於大陰唇(labia majora)， 是由無脂肪的海綿組織形成，其上有許多皮脂腺與汗 腺，並且是子宮圓韌帶(uterine round ligament)的遠 端附著處","C":"根據 Delancey level of support，主韌帶(cardinal ligaments)和子宮薦韌帶(uterosacral ligaments)為 第一級支持(level 1 support)，對子宮、子宮頸和陰 道有支持作用，然而闊韌帶(broad ligaments)和圓韌 帶(round ligaments)對骨盆腔支持沒有顯著作用","D":"女性體內的睪固酮(testosterone)與性慾，高潮和性反 應有關，由腎上腺和卵巢各產生約 50%","E":"血管活性腸胜肽(Vasoactive intestinal polypeptide, VIP)主要受體於心血管及腸胃系統，對 女性生殖系統沒有影響"},"answer":"C","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell’s Urology 12th edi; chapter 74, pp1627-8, chapter 108,pp2438-9. chapter 115, pp2597-8","sourcePage":167},{"id":"5-007","category":"生理解剖","categoryOrder":5,"number":7,"question":"下列腎臟及輸尿管構造的敘述何者錯誤?","options":{"A":"腎臟外側駝峰狀突起較常見於右側","B":"正常成人的每一顆腎臟約有 40 萬到 120 萬個腎單位","C":"輸尿管在骨盆腔的部分約佔總長度的一半","D":"在所有新生兒先天性異常中，約有 20-30%會影響到腎 臟及輸尿管","E":"腎臟的靜脈循環跟動脈比起來較少有變異"},"answer":"A","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology, 11th edition, p967-973","sourcePage":168},{"id":"5-008","category":"生理解剖","categoryOrder":5,"number":8,"question":"有關男性外生殖器的解剖構造，下列敘述何者錯誤？","options":{"A":"陰囊左右側的淋巴分別回流至該側的 superficial inguinal lymph nodes","B":"陰囊前側及後側的神經支配分別來自 ilioinguinal nerve 和 genitofemoral nerves","C":"包皮的淋巴回流至 superficial and subinguinal lymph nodes","D":"陰莖體的淋巴於回流前匯聚至背側 (dorsal side) 而 後回流至雙側的 inguinal lymph nodes","E":"陰莖的神經支配大多來自背側的 dorsal nerve 和少部 分腹側的 perineal nerve"},"answer":"B","reference":"(110)/5.生理解剖/參考 資料(摘錄自)：Campbell 12ed, Chapter 63, Surgical, Radiographic, and Endoscopic Anatomy of the Male Reproductive System, p1385-1389","sourcePage":168},{"id":"5-009","category":"生理解剖","categoryOrder":5,"number":9,"question":"有關膀胱和尿道的解剖生理學，以下敘述何者錯誤？","options":{"A":"膀胱壁的膠原蛋白(collagen)以第 I, III, 和 IV 型 最常見","B":"與正常的膀胱相比，順應性較差的膀胱中第三型和第一 型膠原蛋白的比值是上升的","C":"與正常的膀胱相比，順應性較差的膀胱有較高的結締組 織/平滑肌比率(connective tissue to smooth muscle ratio)","D":"男性尿道括約肌(rhabdosphincter)的快縮肌 (fast-twitch fiber)與慢縮肌(slow-twitch fiber) 比率較女性的高","E":"在骨盆底運動及電刺激治療應力性尿失禁(stress incontinence)的成功患者身上發現，可能是因為慢縮 肌轉換成快縮肌(conversion of slow-twitch to fast twitch straited muscle fibers)的因素"},"answer":"E","reference":"(110)/5.生理解剖/參考 資料(摘錄自)：Campbell 12ed, Chapter 110, Physiology and Pharmacology of the Bladder and Urethra, p2464, 2467","sourcePage":168},{"id":"5-010","category":"生理解剖","categoryOrder":5,"number":10,"question":"有關各式藥物作用在膀胱與尿道的結果，以下敘述何者有 誤？","options":{"A":"Anticholinergic agents 抑制蕈鹼性受器(muscarinic receptor)而降低膽鹼的刺激(cholinergic stimulation)，進而減低膀胱內壓","B":"Potassium channel openers 能增加膜電位，進而減少 膀胱不穩定的收縮","C":"Prostaglandin synthesis inhibitors 能減少平滑肌 的張力而促使膀胱放鬆","D":"Muscarinic agonists 可強化膽鹼的刺激(cholinergic stimulation)反應，是低活動性逼尿肌(Detrusor underactivity)的建議藥物選項之一","E":"Afferent nerve inhibitors 可減少膀胱感覺神經的傳 入而減少逼尿肌過動(Detrusor overactivity)的發生"},"answer":"D","reference":"(110)/5.生理解剖/參考 資料(摘錄自)：Campbell 12ed, Chapter 110, p.2499, Table 110.4; Chapter 118, p.2660 Fig.118.7","sourcePage":169},{"id":"5-011","category":"生理解剖","categoryOrder":5,"number":11,"question":"下列關於陰囊的解剖構造的描述何者錯誤?","options":{"A":"陰囊的皮膚含有豐富的皮脂腺、汗腺及皮下脂肪","B":"外陰動脈(external pudendal a.)供應陰囊前壁的血液 循環，血管的走向與陰囊的皺褶平行，且並未跨過中縫 (median raphe)","C":"精索筋膜(spermatic fascia)的血液供應是由提睪肌 (cremasteric)、睪丸(testicular)及輸精管 (deferential)動脈的分支而來","D":"陰囊的淋巴流入同側腹股溝淺淋巴結(superficial inguinal nodes)","E":"陰囊的後部受到會陰神經的陰囊分支以及股後皮神經 的分支所支配"},"answer":"A","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology, 11th edition, p513-514","sourcePage":169},{"id":"5-012","category":"生理解剖","categoryOrder":5,"number":12,"question":"下列關於後腹腔構造的描述何者錯誤?","options":{"A":"腹外斜肌起源自第 5 到 12 肋骨","B":"腹股溝韌帶是由腹外斜肌的腱膜構成","C":"利用 Dorsal lumbotomy incision 可以進到後腹腔而不 需要切斷任何肌肉","D":"當第 10 到 12 肋骨骨折時，需高度懷疑後腹腔內構造受 損","E":"腰大肌起源自第 1 到 5 腰椎"},"answer":"E","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology, 11th edition, p765-771","sourcePage":169},{"id":"5-013","category":"生理解剖","categoryOrder":5,"number":13,"question":"下列關於攝護腺切除手術解剖構造的敘述何者正確?","options":{"A":"骨盆腔背部靜脈叢(Dorsal venous complex)走在巴克 氏筋膜(Buck’s fascia)上方，陰莖海綿體(Copora cavernosa)之間","B":"內骨盆筋膜(endopelvic fascia)覆蓋在攝護腺後方表 面","C":"德農維利葉氏筋膜(Denonvilliers' fascia)外即為骨 盆腔肌肉","D":"在分攝護腺外側時，所謂筋膜內分離(intrafascial dissection)是指德農維利葉氏筋膜(Denonvilliers' fascia)之內","E":"Retzius-Sparing 機械手臂輔助根除性攝護腺切除手 術(Robot-Assisted Radical Prostatectomy)不須打斷 恥骨攝護腺韌帶(puboprostatic ligaments)"},"answer":"E","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Retzius-Sparing Robot-Assisted Robotic Prostatectomy, Urologic Clinics of North America, 2021-02-01, 卷 48, 期 1, 頁面 11-23","sourcePage":170},{"id":"5-014","category":"生理解剖","categoryOrder":5,"number":14,"question":"關於膀胱的神經肌肉的描述，下列何者較恰當?","options":{"A":"副交感節後神經直接支配膀胱的平滑肌，會形成網狀曲 張（varicosities）包覆肌原纖維（myofibrils）此系 統的目的是讓每個肌纖維都能被神經突觸直接支配","B":"交感的支配在膀胱頸使其收縮，膀胱頸閉鎖在避免逆行 射精扮演重要角色，然而卻觀察到女性的膀胱頸交感神 經的密度比男性高","C":"膀胱的順應性（compliance）在儲尿的時候主要是由膀 胱的形狀、膀胱壁的組成、尿灌注的速度等因子來決 定，中樞神經並不是其中的影響因子","D":"在儲尿的時候，能藉由膀胱的感覺反射使括約肌收縮， 逼尿肌放鬆維持禁尿狀態，正常此反射的感覺神經是藉 由脫髓鞘的Ｃfiber 傳遞","E":"膀胱的傳入神經路徑有三條，分別是骨盆神經（pelvic nerve）、下胃神經（hypogastric nerve）、以及陰部神 經（pudendal nerve）"},"answer":"E","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 12th，ch110,p2461, 2465, 2478, 2482,2487","sourcePage":170},{"id":"5-015","category":"生理解剖","categoryOrder":5,"number":15,"question":"增進膀胱調節的感覺傳入的能力，可以改善排尿的狀況，下 列哪個受器或者離子通道在感覺傳入路徑（afferent pathway）不具有角色？","options":{"A":"TRPV1 (TRP:transient receptor potention channel)","B":"TRPV4","C":"TRPM8","D":"Glutamate receptor","E":"Cannabinoid (CB) receptors"},"answer":"D","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 12th，ch110,p2485, 2485","sourcePage":170},{"id":"5-016","category":"生理解剖","categoryOrder":5,"number":16,"question":"下列哪個中樞神經傳導物質，不會加強勃起與性功能？","options":{"A":"Dopamine","B":"Opioids","C":"Serotonin","D":"NO (Nitric oxide)","E":"Melanocortins"},"answer":"B","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 12th，ch68, P1495","sourcePage":171},{"id":"5-017","category":"生理解剖","categoryOrder":5,"number":17,"question":"關於腎上腺的解剖，下列何者為是？","options":{"A":"腎上腺的血液供應來自上中下腎上腺動脈，不同於靜 脈，腎上腺的動脈會分支成 10-50 條小動脈後再穿入腎 上腺","B":"大部分左邊的下腎上腺動脈來自腎動脈，而右邊的下腎 上腺動脈則來自主動脈","C":"小動脈流經皮質後，血液並不會再流入髓質，髓質 （medulla）有另一套血流供應(medullary arterioles)","D":"腎上腺髓質由交感的節後神經元直接支配","E":"剛出生時皮質分層也尚未完成，隨著促腎上腺皮質素 （ACTH）的刺激，分層才愈趨確定，一開始在嬰兒時期， 皮質的束狀帶（zona fasiculata）是比較沒有分化的 一層"},"answer":"A","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 12th，ch105, P2345, 2346, 2351","sourcePage":171},{"id":"5-018","category":"生理解剖","categoryOrder":5,"number":18,"question":"順應性差的膀胱與正常膀胱相比，結締組織與平滑肌的比例 顯著增加。可以得出結論，順應性差的膀胱儲存功能差是繼 發於膀胱壁結締組織含量的改變，尤其是 ( ) 型膠原蛋白 增加。","options":{"A":"I","B":"II","C":"III","D":"IV","E":"X"},"answer":"C","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh-Wein Urology, 110, 2461-2513.e15, 12th edition","sourcePage":171},{"id":"5-019","category":"生理解剖","categoryOrder":5,"number":19,"question":"了解促腎上腺皮質激素釋放激素 (CRH) 的分泌受到下丘腦 視交叉上核的嚴格控制並遵循晝夜節律模式很重要。健康受 試者的皮質醇水平最低點是在( )左右觀察到的。即使這種 生理節律的微小擾動也被認為是病理性的。","options":{"A":"晚上 7 點","B":"晚上 9 點","C":"晚上 11 點","D":"凌晨 1 點","E":"早上 8 點"},"answer":"C","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh-Wein Urology, 106, 2354-2404.e8 , 12th edition","sourcePage":171},{"id":"5-020","category":"生理解剖","categoryOrder":5,"number":20,"question":"5α-還原酶(5α-reductase)非常重要，因為產物雙氫睾酮 （dihydrotestosterone (DHT) 在胎兒發育過程中對前列腺 的分化很重要。在前列腺生理學中，5α-還原酶基因的表達 受( )中的雄激素調節。","options":{"A":"前列腺","B":"前列腺和腎上腺","C":"前列腺和肝臟","D":"前列腺和睪丸","E":"睪丸"},"answer":"C","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh-Wein Urology, 143, 3274-3304.e9, 12th edition","sourcePage":172},{"id":"5-021","category":"生理解剖","categoryOrder":5,"number":21,"question":"下列關於草酸鈣結石與近幾年免疫學的發展其關聯性敘 述，何者正確？","options":{"A":"人類單核細胞 monocyte 暴露於草酸鈣晶體後，透過脂 多醣的途徑，使巨噬細胞極化成 M2 巨噬細胞，因此產 生發炎反應，促進結石形成","B":"表達Ｍ1 的相關基因會抑制結石形成，表達Ｍ2 的相關 基因會促進結石形成","C":"Ｍ1 巨噬細胞會吞噬草酸鈣晶體，在 72 小時內分解晶 體","D":"人類單核細胞暴露於草酸鈣晶體後，隨計量之增加會使 粒線體產生過多超氧自由基，草酸鈉晶體則在極高濃度 才會產生類似反應，促進結石形成","E":"腎小管上皮細胞上的雄性素受體如果基因 剔除 （knockout），會使巨噬細胞及極化成 M1，顯示結石與 雄性素的表達有相關性"},"answer":"D","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： 1.Dominguez-Gutierrez PR, Kwenda EP, Khan SR, Canales BK. Immunotherapy for stone disease. Curr Opin Urol 2020; 30(2):183-189. 2.Dominguez-Gutierrez PR, Kusmartsev S, Canales BK, Khan SR. Calcium Oxalate Differentiates Human Monocytes Into Inflammatory M1 Macrophages. Front Immunol 2018; 22:9:1863. 3. Patel M, Yarlagadda V, Adedoyin O, Saini V, Assimos DG, Holmes RP, Mitchell T. Oxalate induces mitochondrial dysfunction and disrupts redox homeostasis in a human monocyte derived cell line. Redox B
