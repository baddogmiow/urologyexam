re of the corpus cavernous…The tunica albuginea is a bilaminar structure(inner circular, outer longitudinal) （Ｂ）Campbell 12th edition, p3048. In the Middle East, self-inflicted fractures predominate resulting from the practice of “taqaandan,” in which the erect penis is forcibly bent during masturbation or as a means to achieve rapid detumescence after coitus. （Ｃ）Campbell 12th edition, p3048. The diagnosis of penile fracture is often straightforward and can be made reliably by history and physical examination…The typical history and clinical presentation of penile fracture usually make adjunctive imaging studies unnecessary. （Ｄ）Campbell 12th edition, p3049. AUA guidelines recommend MRI in the setting of equivocal ultrasound findings for penile fracture. （Ｅ）Although surgery is the better than conservative management, surgical delay of up to 7 days after the time of injury does not adversely affect the results of repair.","sourcePage":463},{"id":"12-031","category":"外傷","categoryOrder":12,"number":31,"question":"有關陰囊及其附屬構造創傷的敘述，何者正確?","options":{"A":"直接性的陰囊鈍傷(scrotal contusion)造成睪丸 破裂(rupture)的比例約占百分之十","B":"如果陰囊超音波無法對於診斷是否發生睪丸破裂 (rupture)有任何定論，使用電腦斷層或磁振造影 可以增加確診比率(detection rates)","C":"大範圍的陰囊積血(hematocele)不管睪丸是否有 鈍傷(contusion)或破裂(rupture)都應該需要手 術治療","D":"不管睪丸是否破裂(rupture)，大範圍陰囊積血的 病患，初期採取保守治療相對於早期接受手術， 最後演變成需要睪丸切除(orchiectomy)的比例 並無差異","E":"若睪丸白膜大範圍破損嚴重，行手術修補時可考 慮使用 Darto’s fascia 當做皮瓣(flap)"},"answer":"C","reference":"(111) (A) EAU guidelines on urological trauma(2022), p30. Testicular rupture is found in approximately 50% of cases of direct blunt scrotal trauma (B) EAU guidelines on urological trauma(2022), p31. If scrotal US is inconclusive, testicular CT or MRI may be helpful [336]; however, these techniques did not specifically increase the detection rates of testicular rupture. (C) EAU guidelines on urological trauma(2022), p32. Therefore, large haematoceles should be treated surgically, irrespective of the presence of testicular contusion or rupture. (D) EAU guidelines on urological trauma(2022), p32. Cass, A.S., et al. Testicular injuries. Urology, 1991. 37: 528. Early surgical intervention results in preservation of the testis in more than 90% of cases compared to delayed surgeries which result in orchiectomy in 45-55% of patients. (E) EAU guidelines on urological trauma(2022), p32. If there is extensive destruction of the tunica albuginea, mobilisation of a free tunica vaginalis flap can be performed for testicular closure","sourcePage":464},{"id":"12-032","category":"外傷","categoryOrder":12,"number":32,"question":"若發生下段輸尿管損傷選擇做 transuretero-ureterostomy 時，下列哪一個選項為其 禁忌症(contraindication)?","options":{"A":"有泌尿道結石病史","B":"有輸尿管創傷病史","C":"病態性肥胖症(Morbid obesity)","D":"神經性膀胱","E":"胸椎骨折"},"answer":"A","reference":"(111) <<Campbell-Walsh-Wein Urology 12th Edition Review>> <<Campbell-Walsh-Wein Urology 12th Edition, chap.37 p683.>> TUU(transuretero-uret erostomy), when fashioned appropriately, is successful and carries minimal risk for leakage or obstruction (Hendren and Hensle, 1980;Hodges, et al., 1963; Iwaszko et al., 2010; Mure et al., 2000; Noble et al., 1997).A history of previous calculi remains a relative contraindication to TUU. 若要做 TUU 的病人有結石 病史，假使復發的輸尿管 結石發生在 donor ureter，要施行碎石手術 會很困難; 若沒有其他 非得做 TUU 的理由，有結 石病史的患者要做 TUU 應 當做最後的手段而且要 緊密追蹤 [Reference: Iwaszko, M. R., Krambeck, A. E., Chow, G. K., & Gettman, M. T. (2010). Transureteroureterost omy Revisited: Long-Term Surgical Outcomes. The Journal of Urology, 183(3), 1055–1059.]","sourcePage":465},{"id":"12-033","category":"外傷","categoryOrder":12,"number":33,"question":"下列哪個選項不是施行膀胱修補手術的適應症?","options":{"A":"腹膜外膀胱破裂合併血尿","B":"因非泌尿道相關的創傷而行剖腹探查術中造成的 腹膜外膀胱破裂","C":"腹膜外膀胱破裂合併膀胱頸損傷","D":"正常血中肌酸酐、腹膜內膀胱破裂的穩定病人","E":"腹膜外膀胱破裂合併陰道裂傷"},"answer":"A","reference":"(111) <<Campbell-Walsh-Wein Urology 12th Edition Review>> An uncomplicated extraperitoneal bladder rupture with gross hematuria can be often managed with indwelling Foley and observation. If the gross hematuria cannot be managed with Foley due to clots, then open repair would be indicated.","sourcePage":466},{"id":"12-034","category":"外傷","categoryOrder":12,"number":34,"question":"根據最新 American Association for the Surgery of Trauma Organ Injury Severity Scale for the Kidney 的腎臟創傷分級系統，在腎臟受鈍傷傷害時，電腦斷 層發現高度(第四度、第五度)腎臟創傷。下列敘述是 關於可能需要非保守治療的高風險條件，那一項條件 最不恰當?","options":{"A":"腎臟周圍(perirenal)有較大的血塊，如：大人血 塊超過 2.2 公分","B":"電腦斷層顯影劑滲漏至血管外","C":"腎臟內側(medial side)撕裂傷","D":"單側腎臟超過 25%無血流進入","E":"電腦斷層 excretory phase 時，尿液滲漏到集尿 系統外，但遠端輸尿管無顯影劑"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1065-1086","sourcePage":467},{"id":"12-035","category":"外傷","categoryOrder":12,"number":35,"question":"根據最新 American Association for the Surgery of Trauma Organ Injury Severity Scale for the Kidney 的腎臟創傷分級系統，在小兒腎臟與大人腎臟受鈍傷 傷害時，電腦斷層發現多處腎臟裂傷進入集尿系統， 造成破碎的腎臟(shattered kidney)，但沒有腎動靜 脈受損。此情形屬於第幾度腎臟傷害?","options":{"A":"小兒第三度/大人第三度","B":"小兒第四度/大人第四度","C":"小兒第五度/大人第四度","D":"小兒第四度/大人第五度","E":"小兒第五度/大人第五度"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1065-1086 & 1982-2004","sourcePage":467},{"id":"12-036","category":"外傷","categoryOrder":12,"number":36,"question":"根據最新 American Association for the Surgery of Trauma Organ Injury Severity Scale for the Ureteral Injury 的輸尿管創傷分級系統，在輸尿管受 穿刺傷傷害時，電腦斷層發現輸尿管有 60%的破裂 (transection)，此情形屬於第幾度輸尿管傷害?","options":{"A":"第一度","B":"第二度","C":"第三度","D":"第四度","E":"第五度"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1065-1086","sourcePage":468},{"id":"12-037","category":"外傷","categoryOrder":12,"number":37,"question":"當輸尿管受傷多久時間內，建議可以直接修補。超過 此一時間後，就建議先插腎造廔管，之後再延遲修補 (delayed repair)?","options":{"A":"一天","B":"二天","C":"三天","D":"一週","E":"二週"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1065-1086","sourcePage":468},{"id":"12-038","category":"外傷","categoryOrder":12,"number":38,"question":"根據最新 American Association for the Surgery of Trauma Organ Injury Severity Scale for the Bladder Injury 的膀胱創傷分級系統，在膀胱受鈍傷傷害時， 下列何種情形屬於第三度膀胱傷害?","options":{"A":"腹膜外膀胱破裂 1 公分","B":"腹膜外膀胱破裂 3 公分","C":"腹膜內膀胱破裂 5 公分","D":"腹膜內膀胱破裂 7 公分","E":"腹膜內膀胱破裂 9 公分，且裂開到膀胱頸"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1065-1086","sourcePage":468},{"id":"12-039","category":"外傷","categoryOrder":12,"number":39,"question":"關於腎臟鈍挫傷，下列敘述何者為正確敘述?","options":{"A":"血尿是其中重要的臨床指標，通常與 American Association for the surgery(AAST) of trauma Organ Injury Severity Scale 呈正相關，級數越 高血尿情況越嚴重。","B":"小兒外傷病患如果有血尿(5RBCs/HPF)皆建議做 Contrast-enhanced CT，因小孩子外傷後分泌高 兒茶分胺(Catacholamine)，失血量>50%才會有低 血壓的狀況。","C":"手術的絕對適應症包括：嚴重尿液外溢(urinary extravasation)或是腎損傷合併大腸、胰臟損傷。","D":"AAST Grade IV & V 病人考慮 surgical intervention，比起 conservative treatment 的 病人才可降低住院天數及腎臟保留率","E":"以上皆非"},"answer":"B","reference":"(111) 參考資料(摘錄自)：第 12 版 Campbell P.1982-1989","sourcePage":468},{"id":"12-040","category":"外傷","categoryOrder":12,"number":40,"question":"關於尿道受傷，以下何者為非?","options":{"A":"骨盆腔骨折合併的尿道受傷臨床 triad: 尿道口 有血(blood at meatus)、膀胱脹(palpable full bladder)、排不出尿(inability to urinate)","B":"對骨盆腔骨折病人考慮做肛門指診檢查，因這些 病人有 5%左右合併 Rectal injury，且常會有高 騎位攝護腺(high-riding prostate)","C":"若是陰莖骨折相關的尿道受傷，軟式輸尿管鏡 Flexible cysto-urethroscopy 優於 Retrograde urethrography(RUG)，因 RUG 有較高的 False positive rate","D":"尿道損傷的病人考慮立即做尿道成形術 (Immediate urethroplasty)，可讓術後的病人在 2-3 周內自行排尿的機率提高","E":"輕微的醫源性尿道損傷(iatrogenic urethral injuries)或是尿道鈍傷(urethral contusions) 不需要尿道分流(urinary diversion)"},"answer":"B","reference":"(111) Campbell Walsh Wein Urology12th Edition,, pg 3057-3060) EAU guildines uretheral injury 4.4","sourcePage":469},{"id":"12-041","category":"外傷","categoryOrder":12,"number":41,"question":"下列關於陰莖骨折(penile fracture)之敘述何者正 確?","options":{"A":"陰莖白膜(tunica albuginea)為內縱外環的雙層 構造，白膜破裂則稱為陰莖骨折","B":"性交導致的陰莖骨折最常見於白膜最薄的背側或 外側，通常為一至二公分的橫向破口","C":"懷疑陰莖骨折導致尿道損傷時需常規進行 urethrography","D":"Penile ultrasonography可用於排除陰莖骨折， 或用於定位出白膜破裂處","E":"在受傷七天內接受手術之效果不優於保守治療"},"answer":"D","reference":"(111) Campbell-Walsh Urology 12th ed Ch.133. p.3048-3049","sourcePage":469},{"id":"12-042","category":"外傷","categoryOrder":12,"number":42,"question":"下列何者非膀胱破裂的 immediate repair indication?","options":{"A":"Cystography 骨盆腔有火焰狀(flame-shaped)的 顯影劑表現","B":"合併膀胱頸、直腸、陰道損傷","C":"開放性骨盆腔骨折","D":"生命徵象穩定，但因其他因素須接受開腹手術之 病患","E":"電腦斷層發現膀胱內有骨頭碎片"},"answer":"A","reference":"(111) Campbell-Walsh Urology 12th ed Ch.133. p.3056","sourcePage":469},{"id":"12-043","category":"外傷","categoryOrder":12,"number":43,"question":"關於腎臟外傷，下列敘述何者正確?","options":{"A":"血液動力學穩定下，CT 影像呈現腎臟有 medial extravasation 及 delayed phase 無法看見 distal ureter 顯影劑存在，下一步採取保守治療是合理 的做法","B":"在 HGRT(high grade renal trauma)病人之中，相 較於 surgical repair，接受 angioembolisation 有較佳的 kidney salvage rate","C":"血液動力學穩定下，CT 影像呈現 AAST grade V， 應建議病人安排腎臟探查手術","D":"FAST(focused assessment with sonography for trauma )對 retroperitoneal hematoma 的 specificity 高，對上泌尿道外傷評估非常重要","E":"血液動力不穩定(休克情形下)，為達立即止血的 目的，手術應該從患處腰部直接進入後腹腔"},"answer":"B","reference":"(111) (1)2022 EAU guideline on urological trauma (2) Campbell-Walsh Urology 12th edition, Chapter 90, P.1982-1992 (3)Journal of urology, Utility and Outcome of Angioembolization for High-Grade Renal Trauma Management in a Large Hospital-Based Trauma Registry, Vol. 207, 1077-1085, May 2022","sourcePage":470},{"id":"12-044","category":"外傷","categoryOrder":12,"number":44,"question":"有關前尿道損傷(anterior urethral injury)，以下 選項何者為非?","options":{"A":"最常見的原因是跨騎傷(straddle injury)","B":"尿道攝影(urethrography)是必要的檢查","C":"臨床症狀包括尿道口出血、血尿、及尿滯留","D":"需立即建立尿液引流，可經由恥骨上膀胱造瘻或 X 光導引尿道導尿管放置","E":"不會發生 Buck’s fascia 的破損及造成會陰部 的 Butterfly sign"},"answer":"E","reference":"(112) 參考資料(摘錄自)： Campbell 12ed. Chapter 133. Page 3060","sourcePage":470},{"id":"12-045","category":"外傷","categoryOrder":12,"number":45,"question":"有關小兒輸尿管外傷，下列敘述何者正確?","options":{"A":"約 40%的小兒輸尿管損傷伴隨腎損傷","B":"不到 20%的小兒輸尿管損傷病患不伴隨血尿","C":"即時剖腹探查下，仍有高達 10%小兒輸尿管損傷被 延誤診斷","D":"AUA urotrauma guidelines 建議電腦斷層必須施 打顯影劑，並以動脈像觀察斷端出血點為主要診 斷發現","E":"建議損傷修復後進行後續影像學檢查。在輸尿管 支架移除後 4 至 6 週內進行靜脈注射泌尿系統 攝影檢查"},"answer":"C","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology 12th Edition (Elsevier) P.1078-1079","sourcePage":470},{"id":"12-046","category":"外傷","categoryOrder":12,"number":46,"question":"下列何者情況之下，腎臟外傷可先觀察，無需立即剖 腹探查？","options":{"A":"病患血壓不穩,對輸液急救反應不佳","B":"腎臟血腫有逐漸擴大的跡象","C":"腎門血管有撕裂傷","D":"尿液滲漏合併腎實質損傷","E":"腎盂輸尿管會合處撕裂傷"},"answer":"D","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Campbell-Walsh Urology 19th P. 9182","sourcePage":471},{"id":"12-047","category":"外傷","categoryOrder":12,"number":47,"question":"下列有關於小兒腎臟外傷後引起的高血壓的敘述何者 有錯？","options":{"A":"第三級的腎臟外傷的病人，腎臟結疤的機率約 50%","B":"腎臟外傷後如果持續出現高血壓，必須安排影像 檢查排除動靜脈廔管或假性動脈瘤的可能","C":"腎臟外傷後腎臟體積縮小，而且功能小於 20%的病 人容易產生高血壓","D":"三級以上的腎臟外傷後引起的高血壓的比例約是 5% 至 15%","E":"第一級與第二級腎臟外傷的病人發生腎臟結痂的 機率低，所以不建議重複做影像檢查"},"answer":"D","reference":"(112) / 12.外傷/參考資 料(摘錄自)： 1. Campbell Uroloy 2. 12 版; 2021 3. Chapter 52 4. P. 4756--P.4794","sourcePage":471},{"id":"12-048","category":"外傷","categoryOrder":12,"number":48,"question":"關於陰莖損傷的敘述，何者不正確？","options":{"A":"性行為造成的陰莖骨折可能伴隨較高比例的尿道 C 損傷 U","B":"陰莖骨折通常經由病史及臨床表現即足以診斷， p 超音波則可用來排除陰莖骨折或定位","C":"陰莖骨折一般建議盡早進行手術探查修補，手術 與保守治療相比有更少的併發症比率","D":"陰莖截肢後，建議使用顯微手術重建，因直接巨 觀吻合對恢復勃起功能幫助不大","E":"槍傷所造成的陰莖損傷，其中約有 15%-50%合併尿 道損傷"},"answer":"D","reference":"(112) / 12.外傷/參考資 料(摘錄自)： ampbell Walsh Wein rology, 12th Edition . 3048-3050 (D) 直接巨觀吻合亦能 有良好勃起功能，唯陰莖 感覺遜於顯微手術重建","sourcePage":471},{"id":"12-049","category":"外傷","categoryOrder":12,"number":49,"question":"下列有關尿道外傷的敘述何者錯誤?","options":{"A":"臨床醫師針對尿道外傷的病人，在手術後追蹤有 關狹窄復發、性功能障礙、尿失禁等三種可能的 併發症，至少要追蹤 3 年","B":"針對病況穩定的，骨盆骨折引起的後尿道外傷的 病人，可以採取初步的對齊尿道 (Primary realignment) 的內視鏡手術方式","C":"骨盆骨折引起的後尿道外傷的病例，平均約 50% 的病人會出現性功能障礙","D":"在骨盆骨折引起的後尿道外傷中，球部尿道與膜 部尿道的交接處，比攝護腺尿道與膜部尿道的交 接處，更容易因為外傷而導致受損","E":"後尿道重建手術後，約有 5%至 15%的病人，會在 尿道吻合處出現復發性的狹窄"},"answer":"A","reference":"(112) / 12.外傷/參考資 料(摘錄自)： 1. Campbell Uroloy 2. 12 版; 2021 3. Chapter 133 P. 14032--P.14045","sourcePage":472},{"id":"12-050","category":"外傷","categoryOrder":12,"number":50,"question":"下列有關於輸尿管外傷的敘述，何者錯誤？","options":{"A":"整體而言，輸尿管外傷約占所有泌尿系統外傷的 1%到 2.5%","B":"根據美國外傷外科醫師學會的定義，第四級的輸 尿管外傷是指輸尿管的撕裂傷超過 50%但是還沒 有完全斷裂","C":"電腦斷層泌尿道攝影(CT Urography)合併延遲影 像是用來診斷輸尿管外傷最佳的檢查工具","D":"根據文獻報導，在開放手術當中能夠在手術當場 立即發現輸尿管外傷的比例約 34%，有的報告甚至 更少","E":"根據 AUA 泌尿道外傷的處理準則，如果手術後超 過一個禮拜才發現輸尿管外傷，建議先做引流等 病情穩定，在六週之後才進行徹底的輸尿管重建"},"answer":"B","reference":"(112) / 12.外傷/參考資 料(摘錄自)： 1. Campbell Uroloy 2. 12 版; 2021 3. Chapter 90 4. P. 9192--P.9225","sourcePage":472},{"id":"12-051","category":"外傷","categoryOrder":12,"number":51,"question":"下列有關前尿道外傷與前尿道狹窄的敘述何者錯誤?","options":{"A":"跨騎式傷害 (straddle injury)是造成前尿道外 傷最常見的原因","B":"針對複雜性的前尿道狹窄，而且經過多次失敗的 手術治療的病例，可以建議病人做會陰部的尿道 造廔口 (perineal urethrostomy)手術","C":"針對陰莖尿道的長段狹窄，最好的手術方式是， 游離皮瓣的增大尿道成形術 (free graft augmentation urethroplasty) 的尿道重建手術","D":"針對前尿道外傷，可以採取早期初步的對齊尿道 (Primary realignment) 的內視鏡手術方式","E":"針對 1.5 公分的陰莖尿道的狹窄的最佳的治療策 略是，切除狹窄並做初步的吻合(Primary anastomosis)手術"},"answer":"E","reference":"(112) / 12.外傷/參考資 料(摘錄自)： 1. Campbell Uroloy 2. 12 版; 2021 3. Chapter 133 4. P. 14032--P.14045","sourcePage":472},{"id":"12-052","category":"外傷","categoryOrder":12,"number":52,"question":"下列有關於以血管栓塞來治療腎臟外傷的敘述何者有 錯？","options":{"A":"血管栓塞治療第四級的腎臟外傷成功率約為 89%，而治療第五級的腎臟外傷成功率約為 76%","B":"針對血流動力學狀態而言，如果是穩定患者的成 功率約為 90%，但不穩定患者的成功率只有 63%","C":"需要血管栓塞的適應症是:顯影劑經由血管嚴重 持續外滲、動靜脈瘺 (arteriovenous fistula) 和假性動脈瘤","D":"血管栓塞失敗的重要預測因子是:肉眼可見的血 尿、血液動力學不穩定、第四級腎臟創傷和尿液 外滲","E":"血管栓塞失敗後的開放手術通常會導致腎切除"},"answer":"D","reference":"(112) / 12.外傷/參考資 料(摘錄自)： 1. Eur Urol Focus 2. 2022 Jan 3. Volume 8 4. P. 253-258","sourcePage":473},{"id":"12-053","category":"外傷","categoryOrder":12,"number":53,"question":"下列關於輸尿管創傷 (Ureteral trauma) 之敘述，下 列何者錯誤?","options":{"A":"根據 American Association for the Surgery of Trauma Organ Injury Severity Scale for the Ureter，完全斷裂合併 < 2 公分血管損傷 (Complete transection with <2 cm devascularization )屬於 Grade IV 的損傷","B":"就算病人沒有血尿，也不能完全排除輸尿管損傷 的可能性","C":"要做輸尿管吻合時，為避免縫合處滲漏，須將周 圍組織完全的剝除乾淨","D":"在輸尿管損傷後放置雙 J 導管，建議至少需放置 6 周以上，並考慮逆行性輸尿管攝影以確保沒有滲 漏","E":"若病患遭受重大創傷並合併輸尿管損傷，應等病 患穩定後再考慮手術修補"},"answer":"C","reference":"(112) / 12.外傷/參考資 料(摘錄自)：Campbell Walsh Urology, 12th edition, 2021, Chapter 89, p. 2651-2662","sourcePage":473},{"id":"12-054","category":"外傷","categoryOrder":12,"number":54,"question":"下列關於醫源性輸尿管損傷，下列何者錯誤?","options":{"A":"雷射碎石手術的普及，提高了輸尿管鏡碎石手術 中輸尿管損傷的機率","B":"相較於腹腔鏡手術，傳統 open 手術有較低的輸 尿管損傷機率","C":"相較於其他婦產科手術，子宮切除術有最高的輸 尿管損傷機率","D":"腹腔鏡手術較傳統開腹手術容易發現醫源性輸尿 管斷裂，要術中進行修補時不一定要轉為開腹手 術","E":"醫源性輸尿管滲漏多數為術後發現，症狀包括無 尿、廔管形成、疼痛、感染、腎水腫及血尿"},"answer":"D","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Campbell Walsh Urology, 12th edition, 2021, Chapter 89, p. 2651-2662","sourcePage":474},{"id":"12-055","category":"外傷","categoryOrder":12,"number":55,"question":"下列關於尿道損傷的敘述何者錯誤?","options":{"A":"未成年女性 (< 17 歲) 相較於成年女性，有較低 的尿道損傷機率，因為骨盆相對更有彈性","B":"相較於攝護腺尿道及膜狀尿道交界處 (prostatomembranous junction)，球狀尿道及膜 狀尿道交界處 (bulbomembranous junction) 更 容易因骨盆骨折受傷","C":"尿道斷裂的臨床症狀 triad 包括無法解尿 (inability to urinate)、尿道口有血 (blood at the meatus) 及可觸診到的膀胱脹尿 (palpably full bladder)","D":"懷疑尿道損傷做尿道攝影時，病人宜採側臥並由 16 號 urthral catheter 注入 25ml 的顯影劑","E":"對於嚴重尿道受損的男性病患，應先考慮恥骨上 膀胱造廔引流尿液，之後再考慮重建手術"},"answer":"A","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Campbell Walsh Urology, 12th edition, 2021, Chapter 133, p. 4029-4049","sourcePage":474},{"id":"12-056","category":"外傷","categoryOrder":12,"number":56,"question":"下列關於陰莖及睪丸外傷的敘述何者錯誤?","options":{"A":"陰莖白膜為雙層結構，內層為環狀、外層為縱向， 其中由內層負責主要的強度及厚度，且強度最脆 弱的位子在腹外側 (ventrolaterally)","B":"婚外情的性行為更容易發生陰莖骨折","C":"修補白膜時，建議使用可吸收的 2-0 或 3-0 縫線 做間斷縫合 (interrupted sutures)","D":"陰囊腫脹和瘀血程度和睪丸受損程度不一定成正 比","E":"早期手術修補可提高睪丸保留的機會，及加快病 程回歸正常生活，若一開始行保守治療，則之後 做睪丸切除的機率較高"},"answer":"A","reference":"(112) / 12.外傷/參考資 料(摘錄自)：Campbell Walsh Urology, 12th edition, 2021, Chapter 133, p. 4029-4037","sourcePage":474},{"id":"12-057","category":"外傷","categoryOrder":12,"number":57,"question":"下列關於膀胱受損的敘述何者錯誤?","options":{"A":"若是骨盆骨折的患者合併肉眼可見的血尿，則應 立即做膀胱攝影確認是否有膀胱破裂","B":"實行膀胱攝影時，應注入顯影劑直到病人表達不 適或是達到 350ml，且灌注顯影劑前、灌注顯影 劑後、引流出顯影劑後皆須拍攝一張","C":"若病患沒有合併其他併發症且為腹膜外膀胱破裂 (extraperitoneal bladder rupture) 可以優先 考慮保守治療","D":"若有沒被診斷出的膀胱損傷，病患可能會發生酸 中毒、氮血症、腸阻塞或是腹膜炎","E":"合併直腸或陰道損傷、所有骨盆骨折及有膀胱頸 損傷皆為立即手術修補的適應症"},"answer":"E","reference":"(112) / 12.外傷/參考資 料(摘錄自)：Campbell Walsh Urology, 12th edition, 2021, Chapter 133, p. 4029-4049","sourcePage":475},{"id":"12-058","category":"外傷","categoryOrder":12,"number":58,"question":"關於尿道損傷敘述下列何者為非?","options":{"A":"外傷骨盆骨折易傷及膜性尿道,跨坐式則是傷及 前尿道。","B":"尿道口有血流出跡象時不可放置導尿管,先安排 尿道攝影確立診斷。","C":"接下來,施行上恥骨膀胱造瘻。","D":"後尿道損傷斷裂施行早期的修補與吻合術,有高 達一半的病患有陽痿,尿道狹窄併發症。","E":"後尿道損傷延遲性 3 個月後尿道重建,術後狹窄比 例<5% ,陽痿則是<2%。"},"answer":"C","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Smith & Tanagho’s General Urology 19th Chapter 18 P.302-304","sourcePage":475},{"id":"12-059","category":"外傷","categoryOrder":12,"number":59,"question":"陰莖持續勃起症(Priapism)的敘述何者為非?","options":{"A":"分為缺血型,非缺血型及斷續型(stuttering)。","B":"小孩當中最常見的原因是鎌狀紅血球症。","C":"針對非缺血型陰莖持續勃起症,起初的治療可採 用打點滴,給氧,鹼化藥物。","D":"非缺血型陰莖持續勃起症,通常是外傷造成的","E":"陰莖持續勃起尚未超過 2 小時或是斷續型陰莖持 續勃起症,可先口服偽麻黃鹼 (pseudoephedrine)。"},"answer":"C","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Campbell-Walsh Urology 19th P.7158-P.7165","sourcePage":475},{"id":"12-060","category":"外傷","categoryOrder":12,"number":60,"question":"根據美國外傷醫學會的分類,腎臟損傷分級,病患腎臟 實質裂傷貫穿皮質髓質,進入集尿系統,分類是?","options":{"A":"Grade I","B":"Grade II","C":"Grade III","D":"Grade IV","E":"Grade V"},"answer":"D","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh Urology 19th P.9169","sourcePage":475},{"id":"12-061","category":"外傷","categoryOrder":12,"number":61,"question":"跟據 Urotrauma Guideline 2020: AUA guideline 對於腎臟外傷病人合併血壓不穩及對輸液反應不佳, 電腦斷層呈現腎周圍血腫幾公分以上?及腎實質裂傷 Gr 3 以上 , 需立即採取介入治療,包括血管栓塞或是 手術(Angioembolization or surgery)","options":{"A":"3 公分","B":"4 公分","C":"5 公分","D":"6 公分","E":"7 公分"},"answer":"B","reference":"(112) / 12.外傷/參考資 料(摘錄自)： The Journal of Urology Urotrauma Guideline 2020: AUA Gduideline","sourcePage":476},{"id":"12-062","category":"外傷","categoryOrder":12,"number":62,"question":"下列有關後段尿道損傷的敘述，何者錯誤？","options":{"A":"尿道口有血的情況下，應避免放置尿管","B":"對於病情穩定的患者，Primary realignment 可在 受傷後幾天內進行","C":"Realignment 後，尿管需放置 4-6 週，並且保留膀 胱造口","D":"Primary realignment 後通常可避免後續發生尿 道狹窄的情形","E":"Delayed reconstruction 可在 2-3 個月後進行"},"answer":"D","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Campbell-Walsh Urology 12th Edition, Page 3057-3060 (D) After realignment, when the urethral catheter is removed after 4 to 6 weeks, it is imperative to retain a suprapubic catheter because an overwhelming majority of patients, despite realignment, will develop posterior urethral stenosis","sourcePage":476},{"id":"12-063","category":"外傷","categoryOrder":12,"number":63,"question":"下列有關輸尿管損傷的敘述，何者錯誤？","options":{"A":"術後一週內發現的輸尿管損傷可以立即修補，若 超過一週，則建議至少六週後才進行修補手術， 藉此避開不利修補手術的 inflammatory phase","B":"若放置 ureteral stent，目前一般共識為放置六 週","C":"對於上段輸尿管損傷，可考慮的術式包含 ureteroureterostomy，autotransplantation， bowel interposition","D":"輸尿管鏡造成的輸尿管穿孔，通常不會造成後續 的 complication，以 ureteral stenting 處理即 可","E":"autotransplantation 雖然對於術後的腎功能不 會有影響，但因為手術風險較高，是在 nephrectomy 之前最後的選擇"},"answer":"E","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Campbell-Walsh Urology 12th Edition, Page 1992-2004 This maneuver remains the final option before nephrectomy. Despite great efforts, renal units are sometimes lost after autotransplantation, occurring between 5% and 10% (Bodie et al., 1986; Cowan et al., 2015; Eisenberg et al., 2008)","sourcePage":476},{"id":"12-064","category":"外傷","categoryOrder":12,"number":64,"question":"有關睪丸損傷之敘述，何者正確？","options":{"A":"鈍傷造成大約 25%的睪丸損傷","B":"Hematoma 的程度和睪丸損傷的嚴重度相關","C":"超音波可以快速以非侵入性的確定睪丸完整性及 血流狀況","D":"儘早手術探查及修補可增加 testicular salvage 的機會，並保留生殖及內分泌功能，若在三天內 進行手術，salvage rate 高過 90%","E":"修補睪丸時，破裂的白膜(tunica albuginea)應 以較細之不可吸收線(non-absorbable suture)縫 合關閉"},"answer":"D","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Campbell-Walsh Urology 12th Edition, Page 3051-3053 (A) Testicular injury results from blunt trauma in about 75% of cases (Cass and Luxenberg, 1991; McAninch et al.,1984) (B) Swelling and ecchymosis are variable, and the degree of hematoma may not correlate with the severity of testicular injury; (C) A normal or equivocal ultrasound study should not delay surgical exploration when physical examination findings suggest testicular damage; definitive diagnosis is often made in the operating room (AUA Urotrauma Guidelines, Statement 30) (E) The tunica albuginea should be closed with small absorbable sutures after removal of necrotic and extruded seminiferous tubules.","sourcePage":477},{"id":"12-065","category":"外傷","categoryOrder":12,"number":65,"question":"腎臟外傷(Renal trauma)何時不需要做腎臟探查手術 (Renal exploration)?","options":{"A":"選擇性血管栓塞(selective angioembolization) 後仍持續血行動力不穩定的患者","B":"影像顯示持續性(persistent)或甚至有症狀 (symptomatic)的尿液滲漏","C":"ASST renal injury scale Grade 5","D":"穿刺傷(penetrating injury)","E":"擴展中(expanding)或脈搏性(pulsatile)的腎旁 血腫(peri-renal hematoma)"},"answer":"B","reference":"(112) / 12.外傷/參考資 料(摘錄自)：EAU Guidelines on Urological Trauma 4.1.7, 2022 (B) Proceed with renal exploration in the presence of: • persistent haemodynamic instability; • Grade 5 vascular or penetrating injury; • expanding or pulsatile peri-renal haematoma.","sourcePage":478},{"id":"12-066","category":"外傷","categoryOrder":12,"number":66,"question":"關於腎臟創傷的手術探查，下列何者有誤？","options":{"A":"腎動脈血栓、腎臟合併結腸或胰臟損傷等狀況屬 C 相對手術適應症 U","B":"若腎臟 nonviable tissue 超過 25%且合併腎實質 p 撕裂傷，因產生併發症機率較高，應考慮進行手 術探查","C":"建議採經腹膜式剖腹探查，因常合併其他的腹內 器官損傷如肝臟、脾臟等","D":"在腎臟探查前是否需在主動脈與下腸繫膜動脈間 打開後腹腔以控制腎血管，在較新的研究中未有 定論","E":"是否需要切除腎臟的預測因素包括較高的 ISS、高 度腎損傷，以及血液動力學不穩定"},"answer":"D","reference":"(112) / 12.外傷/參考資 料(摘錄自)： ampbell Walsh Wein rology, 12th Edition . 1988-1991 (D)應為下腸繫膜靜脈","sourcePage":478},{"id":"12-067","category":"外傷","categoryOrder":12,"number":67,"question":"根據 AAST 輸尿管損傷的分級，下列何者不正確？","options":{"A":"子宮全切除術時不慎將右側輸尿管橫斷<50%，屬 W 於 Grade II 1","B":"槍傷患者，剖腹探查診斷兩側近端輸尿管挫傷血 腫無缺血，屬於 Grade I","C":"復發性骨盆腫瘤切除，術中發現兩側遠端輸尿管 橫斷>50%，屬於 Grade III","D":"實行右側輸尿管鏡碎石術，併發輸尿管完全橫斷 且有超過 2 公分的缺血，屬於 Grade V","E":"乙狀結腸切除術時造成左側中段輸尿管完全橫斷 但缺血 2 公分，屬於 Grade IV"},"answer":"B","reference":"(112) / 12.外傷/參考資 料(摘錄自)：Campbell alsh Wein Urology, 2th Edition p. 1992 (B) 雙側損傷則升一 級，至多 Grade III","sourcePage":479},{"id":"12-068","category":"外傷","categoryOrder":12,"number":68,"question":"根據 EAU Guidelines，關於骨盆骨折合併尿道損傷下 列何者錯誤？ E","options":{"A":"女性發生率要小於男性，可能與陰道支撐提供更 U 好的延展性或者較少不穩定骨折有關 p","B":"因恥骨上膀胱造廔可能增加植入物的感染風險， 建議減少使用於實行恥骨內固定手術者","C":"即便已實行 early re-alignment，仍有近一半的 患者會產生尿道狹窄","D":"女性傷患，若狀況允許建議於七天內修補尿道， 發生併發症的比率最低","E":"男性傷患因手術難度以及高併發症等原因，不建 議於 48 小時內立即重建，但合併攝護腺或膀胱頸 損傷者應盡速手術修補"},"answer":"B","reference":"(112) / 12.外傷/參考資 料(摘錄自)： AU Guidelines on rological Trauma 2023 . 26-30 (B) 不會增加植入物感 染的風險","sourcePage":479},{"id":"12-069","category":"外傷","categoryOrder":12,"number":69,"question":"手術造成醫源性膀胱損傷的發生率，由多到少排序何 者正確？ G 1. 治療惡性腫瘤之腹腔鏡/機械手臂子宮根除術 U 2. 恥骨後中段尿道吊帶術(Retropubic p mid-urethral sling) 3. 經閉孔中段尿道吊帶術(Transobturator mid-urethral sling) 4. 經陰道人工網膜手術(Transvaginal mesh surgery) 5. 恥骨後男性吊帶術(Retropubic male sling)","options":{"A":"1>2>5>4>3","B":"1>5>2>4>3","C":"5>2>1>4>3","D":"2>5>1>3>4","E":"5>2>1>3>4"},"answer":"C","reference":"(112) / 12.外傷/參考資 料(摘錄自)：EAU uidelines on rological Trauma 2023 . 20 1. Laparoscopic/Robotic radical hysterectomy (malignant): 4.19-4.59% 2. Mid-urethral sling (retropubic route): 4.91-5.5% 3. Mid-urethral sling (transobturator route): 1.61% 4. Transvaginal mesh surgery: 2.84% 5. Retropubic male sling: 8.0-19%","sourcePage":479},{"id":"12-070","category":"外傷","categoryOrder":12,"number":70,"question":"病患腹部或背部外傷後，被送來急診室，懷疑有腎臟 損傷，照會泌尿科。您認為必須絕對馬上(absolute indication)進行剖腹探查或緊急栓塞的情形如下。以 下選項何者為非？","options":{"A":"hemodynamic instability with no or transient response to resuscitation","B":"expanding/pulsatile renal hematoma","C":"suspected renal vascular pedicle avulsion","D":"ureteropelvic junction avulsion","E":"urinary extravasation with significant renal parenchymal devascularization"},"answer":"E","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Campbell 12ed. Chapter 90. Page 1988","sourcePage":480},{"id":"12-071","category":"外傷","categoryOrder":12,"number":71,"question":"一位外傷病人，其經腹部電腦斷層影像後，被判定為 高度懷疑腎臟損傷。這個判定應該是基於以下的發 現。以下何選項除外？","options":{"A":"medial hematoma","B":"medial urinary extravasation","C":"lack of contrast enhancement of the parenchyma","D":"delayed contrast enhancement of the parenchyma","E":"active intravascular contrast extravasation"},"answer":"D","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Campbell 12ed. Chapter 90. Page 1992","sourcePage":480},{"id":"12-072","category":"外傷","categoryOrder":12,"number":72,"question":"處理輸尿管損傷的原則羅列如下，何者為非？","options":{"A":"Mobilize the injured ureter carefully, sparing the adventitia widely, so as not to devascularize the ureter further","B":"Debride the ureter minimally but judiciously until edges bleed, especially in high-velocity gunshot wounds","C":"Tunnel ureteroneocystostomies to prevent future vesicoureteral reflux","D":"Repair ureters with spatulated, tension-free, stented watertight anastomosis, using fine absorbable sutures and retroperitoneal drainage afterward","E":"Retroperitonealize the ureteral repair by closing peritoneum over it if possible"},"answer":"C","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Campbell 12ed. Chapter 90. Page 1996","sourcePage":480},{"id":"12-073","category":"外傷","categoryOrder":12,"number":73,"question":"有關小兒腎臟外傷，下列敘述何者正確？","options":{"A":"交感神經張力維持正常血壓的能力一般比成人弱","B":"FAST 超音波診斷雖可快速透過評估積液與特定臟 器損傷，但其敏感性或特異性仍不佳","C":"比起超音波，AUA 較推薦使用電腦斷層作為評估工 具","D":"AAST OIS 腎損傷分級，無集尿系統損傷最高可歸 類到第 4 級","E":"EAU urogenital trauma guidelines 建議第 4 與 5 級腎損傷於 48 小時重複追蹤電腦斷層"},"answer":"C","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Campbell-Walsh-Wein Urology 12th Edition (Elsevier) P.1065-1070","sourcePage":481},{"id":"12-074","category":"外傷","categoryOrder":12,"number":74,"question":"有關小兒腎臟外傷，下列敘述何者正確？","options":{"A":"AAST OIS 4 級腎傷害有接近 100% 的腎疤痕風險","B":"AUA urotrauma guidelines 闡明 1 到 3 級腎損傷， 腎疤痕 (renal scarring) 組織生成可忽略，故 不需要特別影像追蹤","C":"2 級腎損傷後仍有 10%風險產生腎損傷相關高血 壓，可能與腎實質缺血導致腎素上升、血管新生 等機轉有關","D":"小兒腎外傷後發生慢性腎病或末期腎病的情況非 常罕見，但進行單側腎切除術之病患有 10%風險產 生末期腎病","E":"腎損傷後慢性腰痛在小兒為長期且常見問題，建 議使用尿液分析、超音波、甚至 CT 進一步評估"},"answer":"A","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Campbell-Walsh-Wein Urology 12th Edition (Elsevier) P.1077-1078","sourcePage":481},{"id":"12-075","category":"外傷","categoryOrder":12,"number":75,"question":"有關小兒生殖器外傷，下列敘述何者正確？","options":{"A":"小兒生殖器外傷常與虐兒事件有關，占比可高達 1/3 男童與 1/7 女童。","B":"AUA urotrauma guidelines 中，表皮挫傷 (contusion) 並未列在內","C":"女童跨騎傷(straddle injury)約占 80%的陰道外 傷，因易伴隨處女膜外傷而建議會診婦產科","D":"在睪丸外傷病例，充足的病史詢問與身體檢查可 支持手術介入，不需要影像學檢查","E":"兒童睪丸外傷在急性陰囊手術病例中佔不到 5%， 大致分為穿刺與鈍傷兩大類"},"answer":"E","reference":"(112) / 12.外傷/參考資 料(摘錄自)： Campbell-Walsh-Wein Urology 12th Edition (Elsevier) P.1083-1084","sourcePage":481},{"id":"12-076","category":"外傷","categoryOrder":12,"number":76,"question":"有關膀胱損傷的敘述，下列何者正確？","options":{"A":"膀胱損傷後在執行膀胱攝影時，骨盆中火焰狀 (flame-shaped)的對比劑分布是腹膜外滲漏的特 徵","B":"膀胱損傷最常見的合併損傷是後尿道受損","C":"腹膜內膀胱損傷通常與骨盆骨骨折有關。腹膜外 膀胱損傷常見的是由穿刺性傷或對脹滿的膀胱頂 部直接撞擊所致的爆裂性損傷引起","D":"膀胱損傷患者如果需要骨盆骨內固定骨板植入 時，為避免尿液接觸骨板，應避免同時行膀胱修 補","E":"膀胱損傷合併陰道損傷時，不是 immediate repair 的 indication，應以 Foley catheter diversion 後觀察為主"},"answer":"A","reference":"(113) 第 12 版 Campbell 第 101 章 Genital and Lower Urinary Tract Trauma， Bladder injury 章節 (A) 正確 (B) 最常合併骨盆骨折 (C) 穿刺傷→腹膜內，骨 盆骨折→腹膜外 (D) 應同時執行修補以 避免後續尿液滲漏影響 骨板 (E)是 immediate repair indication","sourcePage":482},{"id":"12-077","category":"外傷","categoryOrder":12,"number":77,"question":"有關小兒腎臟的描述，下列何者錯誤?","options":{"A":"較少腎臟旁脂肪與肌肉的保護","B":"位置較高位，有助於肋骨的保護","C":"由於脊椎骨較柔軟，較容易導致輸尿管拉扯受傷","D":"大約 5-20%的小兒鈍挫傷會同時傷到腎臟","E":"小兒腎臟外傷導致需要腎臟切除的比率僅約佔 5%"},"answer":"B","reference":"(113) 1. Campbell 12th 2. 52 章, p1065 B 較低位，導致肋骨無法 有效保護","sourcePage":482},{"id":"12-078","category":"外傷","categoryOrder":12,"number":78,"question":"根據 American Association for the Surgery of Trauma Organ Injury Severity Scale (AAST-OIS) for the Kidney 的配對，下列何者有誤？","options":{"A":"非擴展性(nonexpanding)腎周圍血腫，局限於腎 後腹腔：Grade I","B":"腎皮質撕裂(laceration)深度小於 1 公分，無尿 液外滲：Grade II","C":"腎皮質撕裂(laceration)深度超過 1 公分，無集 尿系統破裂或尿液外滲：Grade III","D":"腎主要動脈或靜脈受傷伴有受控性出血 (contained hemorrhage)：Grade IV","E":"腎門部位撕裂(avulsion of renal hilum)，導致 腎去血管化(devascularization)：Grade V"},"answer":"A","reference":"(113) Campbell 12th edition, page 1983: nonexpanding perirenal hematoma confined to renal retroperitoneum 為 Grade II","sourcePage":482},{"id":"12-079","category":"外傷","categoryOrder":12,"number":79,"question":"有關 Penile fracture, 下列何者錯誤?","options":{"A":"Penile fracture 通常發生在劇烈的性行為期 間，當勃起的陰莖滑出陰道並撞擊會陰或恥骨 時，會產生屈曲損傷","B":"白膜 (Tunica albuginea) 的強度和厚度主要是 由縱向的外層決定","C":"白膜 (Tunica albuginea) 最薄的部位是在陰莖 的 Ventrolateral region","D":"合併尿道損傷的發生率在亞洲、中東和地中海地 區 (20%) 顯著高於美國和歐洲 (3%)，因較多比 例是自我傷害的行為","E":"不建議使用海綿體造影術(Cavernosography)"},"answer":"D","reference":"(113)合併尿道損傷的發 生率在美國和歐洲高於 亞洲、中東和地中海地 區，因較多比例是性行為 (intercourse) 造成的 損傷。 th Campbell 12 ed. Chapter 133. P.3048-3049","sourcePage":483},{"id":"12-080","category":"外傷","categoryOrder":12,"number":80,"question":"關於腎血管損傷與重建後結果的敘述，下列何者錯 誤？","options":{"A":"腎動脈鈍性血栓形成最常見於減速性外傷，常因 動脈內膜撕裂（intimal disruption）所致","B":"若原本雙側腎臟功能皆正常，當發生單側重大腎 血管損傷，應優先考慮及時切除受損側腎臟以保 障患者生命安全。。","C":"即使腎動脈重建手術成功，仍有高達 43% 的患者 可能出現術後高血壓","D":"對於腎動脈撕脫傷（renal artery avulsion）， 最佳處理方式為手術重建，而非僅以血管內支架 （endovascular stent）治療","E":"若為雙側腎門（hilar）損傷，需考慮積極進行再 血管化（revascularization），但成功避免洗腎 的機會僅不到兩成"},"answer":"E","reference":"(114)/ Campbell-Walsh-Wein Urology 12th edition Chpater 90 1988-1991 (E) 若為雙側 hilar 損 傷，可考慮積極 revascularization，因有 56% 機會避免洗腎","sourcePage":483},{"id":"12-081","category":"外傷","categoryOrder":12,"number":81,"question":"兒童的腎臟損傷，失血多並不一定會產生低血壓，除 非失血超過 50%以上，其可能原因是兒童受傷後有比較 高的何種物質分泌所致？","options":{"A":"Serotonin","B":"Hydrocortisone","C":"Catecholamine","D":"Renin","E":"Acetylcholine"},"answer":"C","reference":"(114)依據 1. Campbell Urology 2. 12 th edi、2021 年度 3. Chapter 90 Upper tract injury 1984 頁","sourcePage":483},{"id":"12-082","category":"外傷","categoryOrder":12,"number":82,"question":"成人鈍性骨盆骨折合併疑似膀胱破裂（blunt pelvic fracture with suspected bladder rupture）時，下 列敘述何者最不正確？","options":{"A":"具骨盆骨折與巨觀血尿（gross hematuria）之病 患，應行逆行性 CT 膀胱造影（retrograde CT cystography），並需主動注入≥300 mL 稀釋造影 劑以充盈膀胱，否則易漏診小裂傷","B":"對於腹膜內膀胱破裂（intraperitoneal rupture），無論伴隨其他腹腔損傷與否，均應立 即手術修補；延遲處理恐致化學性腹膜炎或敗血 症","C":"膀胱破裂的手術修復，通常建議採用雙層縫合 （two-layer closure）技術以確保水密性並防止 尿液外滲，且術後應放置恥骨上膀胱造瘻管 （suprapubic cystostomy tube）以確保充分引 流","D":"發現尿道口出血且導尿失敗時，應先行逆行性尿 道造影（retrograde urethrogram）以評估尿道 完整性，而非反覆嘗試置放尿道導管","E":"在診斷膀胱破裂的準確度上，CT 膀胱造影與傳統 膀胱造影（plain cystography）具有相近的敏感 度與特異度，但前者更能同時評估膀胱頸損傷及 腹腔合併傷"},"answer":"C","reference":"(114) 1.EAU Guidelines on Urological Trauma -2025 2.Smith Urology 19ᵗʰ ed., Chapter 18, p. 296","sourcePage":484},{"id":"12-083","category":"外傷","categoryOrder":12,"number":83,"question":"下列關於小兒腎臟外傷的敘述何者正確？","options":{"A":"鈍性腎外傷若出現下列情況：肉眼血尿、顯微血 尿併收縮壓低於 120 mmHg、快速減速傷害、嚴重 的側腹撞擊，或有可疑的相關損傷或體檢發現（如 肋骨骨折、側腹瘀青、合併腹部損傷、腹部穿刺 傷）需進一步影像評估","B":"如果超過 25%的腎實質失去活性（devitalized ），這與顯著較高的血管栓塞和開放手術比率有關","C":"在 Grade 4、5 腎臟損傷根據 High-risk criteria，perirenal hematoma>3.5cm 才需 intervention","D":"美國泌尿科醫學會（AUA）泌尿創傷指南建議，對 於第 4 至第 5 級損傷，應在受傷後 72 小時進行腹 部與骨盆的 contrast-enhanced CT","E":"腎臟疤痕形成的風險在第 1 至第 2 級損傷中可忽 略不計，在第 3 級損傷中約為 30%，而在第 4 至第 5 級損傷中則為 80%"},"answer":"B","reference":"(114) 1. Campbell Walsh Wein Urology 12th Ed. Chap. 52 P1065~P1078","sourcePage":484},{"id":"12-084","category":"外傷","categoryOrder":12,"number":84,"question":"關於陰莖離斷重接手術(penile replantation surgery)，下列敘述何者正確？","options":{"A":"巨大出血風險高，因此不建議立即進行血管重建","B":"微血管重建雖複雜，但無法改善陰莖的感覺回復","C":"即使缺乏顯微手術設備，也應嘗試以肉眼方式進 行接合","D":"阻斷的陰莖應直接浸泡於冰水中保存，避免乾燥","E":"若未能即時重接，建議改以陰囊皮膚包覆尿道行 永久造口"},"answer":"C","reference":"(114) 1. Campbell-Walsh Urology 2. 12th 3. Chapter 133 4. P.3049-3051 答案:C 雖然微血管重建可提高 功能與感覺回復，但即便 無顯微設備，仍應嘗試進 行肉眼重接，因仍有超過 五成患者能維持勃起功 能。陰莖應以雙層袋法保 存，不可直接接觸冰塊以 避免冷傷害。","sourcePage":485}];
(function(){
"use strict";

var STORAGE_KEY = 'urology_quiz_state_v1';
var MASTERY_STREAK = 3; // 需連續答對幾次才從錯題本移除

var QUESTIONS_BY_ID = {};
QUESTIONS.forEach(function(q){ QUESTIONS_BY_ID[q.id] = q; });

/* ---------------- global state (persisted) ---------------- */
var G = {
  wrongProgress: {},   // id -> 目前連續答對次數 (0,1,2...) ; key 存在 = 仍在錯題本
  totalAnswered: 0,
  totalCorrect: 0,
  session: null         // 進行中但尚未完成的作答輪次（用於中途關閉後續作）
};

function loadState(){
  try{
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw){
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object'){
        if (parsed.wrongProgress && typeof parsed.wrongProgress === 'object'){
          G.wrongProgress = parsed.wrongProgress;
        } else if (parsed.wrongIds && typeof parsed.wrongIds === 'object'){
          // 舊版資料格式遷移 (布林值 -> 連續答對計數)
          G.wrongProgress = {};
          Object.keys(parsed.wrongIds).forEach(function(id){ G.wrongProgress[id] = 0; });
        }
        G.totalAnswered = parsed.totalAnswered || 0;
        G.totalCorrect = parsed.totalCorrect || 0;
        Object.keys(G.wrongProgress).forEach(function(id){
          if (!QUESTIONS_BY_ID[id]) delete G.wrongProgress[id];
          else if (typeof G.wrongProgress[id] !== 'number') G.wrongProgress[id] = 0;
        });

        if (parsed.session && Array.isArray(parsed.session.listIds) && parsed.session.listIds.length){
          var validIds = parsed.session.listIds.filter(function(id){ return QUESTIONS_BY_ID[id]; });
          if (validIds.length === parsed.session.listIds.length && parsed.session.idx < validIds.length){
            G.session = parsed.session;
          } else {
            G.session = null; // 題庫已更新導致對不上，捨棄舊進度避免出錯
          }
        }
      }
    }
  }catch(e){ /* localStorage unavailable (private mode etc.) - continue in-memory only */ }
}

function saveState(){
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
      wrongProgress: G.wrongProgress,
      totalAnswered: G.totalAnswered,
      totalCorrect: G.totalCorrect,
      session: G.session
    }));
  }catch(e){ /* ignore quota / privacy errors */ }
}

function resetState(){
  var ok = window.confirm('確定要清除本機的作答紀錄、錯題本與未完成的作答進度嗎？此動作無法復原。');
  if (!ok) return;
  G.wrongProgress = {};
  G.totalAnswered = 0;
  G.totalCorrect = 0;
  G.session = null;
  saveState();
  refreshHomeStats();
}

/* ---------------- shared state ---------------- */
var homeMode = 'quiz'; // 'quiz' | 'flash'

var round = {
  list: [], idx: 0, answered: 0, correct: 0,
  modeLabel: "", isReview: false, currentLocked: false
};

var flash = {
  list: [], idx: 0, modeLabel: "", flipped: false
};

var screens = {
  home: document.getElementById('screen-home'),
  quiz: document.getElementById('screen-quiz'),
  summary: document.getElementById('screen-summary'),
  flash: document.getElementById('screen-flash'),
  wrongbrowse: document.getElementById('screen-wrongbrowse')
};

function showScreen(name){
  Object.keys(screens).forEach(function(k){
    screens[k].classList.toggle('active', k === name);
  });
  window.scrollTo(0,0);
}

function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var OPT_LETTERS = ['A','B','C','D','E'];

function isRandom(){
  return document.getElementById('toggle-random').checked;
}

function getCategoryGroups(){
  var byOrder = {};
  var names = {};
  QUESTIONS.forEach(function(q){
    (byOrder[q.categoryOrder] = byOrder[q.categoryOrder] || []).push(q);
    names[q.categoryOrder] = q.category;
  });
  var orders = Object.keys(byOrder).map(Number).sort(function(a,b){return a-b;});
  return { orders: orders, byOrder: byOrder, names: names };
}

/* ---------------- home screen ---------------- */
function buildCategoryList(){
  var g = getCategoryGroups();
  var wrap = document.getElementById('cat-list');
  wrap.innerHTML = '';
  g.orders.forEach(function(order){
    var count = g.byOrder[order].length;
    var el = document.createElement('div');
    el.className = 'cat-item';
    el.innerHTML =
      '<span class="cat-name-row">' +
        '<span class="cat-order mono">' + order + '</span>' +
        '<span class="cat-name">' + g.names[order] + '</span>' +
      '</span>' +
      '<span class="cat-count mono">' + count + ' 題</span>';
    el.addEventListener('click', function(){
      var list = g.byOrder[order].slice();
      if (isRandom()) list = shuffle(list);
      if (homeMode === 'quiz'){
        startSession(list, g.names[order], false);
      } else {
        startFlashcards(list, g.names[order]);
      }
    });
    wrap.appendChild(el);
  });
}

function setHomeMode(mode){
  homeMode = mode;
  document.querySelectorAll('.mode-tab').forEach(function(btn){
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  var startTitle = document.getElementById('start-section-title');
  var catTitle = document.getElementById('cat-section-title');
  var mainBtnText = document.getElementById('btn-start-all-main');
  var mockBtn = document.getElementById('btn-mock-exam');
  var reviewBtn = document.getElementById('btn-review-wrong');
  var browseBtn = document.getElementById('btn-browse-wrong');
  if (mode === 'quiz'){
    startTitle.textContent = '開始刷題';
    catTitle.textContent = '分類練習';
    mainBtnText.textContent = '開始刷全部題目';
    mockBtn.style.display = '';
    reviewBtn.style.display = '';
    browseBtn.style.display = '';
  } else {
    startTitle.textContent = '開始複習';
    catTitle.textContent = '分類單字卡';
    mainBtnText.textContent = '瀏覽全部單字卡';
    mockBtn.style.display = 'none';
    reviewBtn.style.display = 'none';
    browseBtn.style.display = 'none';
  }
}

function refreshHomeStats(){
  document.getElementById('stat-total').textContent = QUESTIONS.length;
  document.getElementById('btn-start-all-sub').textContent = QUESTIONS.length + ' 題';
  document.getElementById('stat-answered').textContent = G.totalAnswered;
  document.getElementById('stat-accuracy').textContent =
    G.totalAnswered ? Math.round(G.totalCorrect / G.totalAnswered * 100) + '%' : '–';
  var wrongCount = Object.keys(G.wrongProgress).length;
  document.getElementById('stat-wrong').textContent = wrongCount;

  var reviewBtn = document.getElementById('btn-review-wrong');
  var reviewSub = document.getElementById('btn-review-wrong-sub');
  reviewBtn.disabled = wrongCount === 0;
  reviewSub.textContent = '目前 ' + wrongCount + ' 題';

  var browseBtn = document.getElementById('btn-browse-wrong');
  var browseSub = document.getElementById('btn-browse-wrong-sub');
  browseBtn.disabled = wrongCount === 0;
  browseSub.textContent = '目前 ' + wrongCount + ' 題';

  refreshResumeBanner();
}

function startAll(){
  var list = isRandom() ? shuffle(QUESTIONS) : QUESTIONS.slice();
  if (homeMode === 'quiz'){
    startSession(list, '全部', false);
  } else {
    startFlashcards(list, '全部');
  }
}

function startReview(){
  var list = Object.keys(G.wrongProgress).map(function(id){ return QUESTIONS_BY_ID[id]; }).filter(Boolean);
  if (list.length === 0) return;
  if (isRandom()) list = shuffle(list);
  startSession(list, '錯題複習', true);
}

/* ---- 模擬考：全部 12 大類按題數比例平均抽出共 30 題 ---- */
function buildMockExam(targetTotal){
  var g = getCategoryGroups();
  var totalQ = QUESTIONS.length;
  var quotas = {};
  var floors = {};
  var remainders = [];
  var sumFloor = 0;

  g.orders.forEach(function(order){
    var raw = g.byOrder[order].length / totalQ * targetTotal;
    var f = Math.floor(raw);
    floors[order] = f;
    sumFloor += f;
    remainders.push({ order: order, rem: raw - f });
  });

  var remaining = targetTotal - sumFloor;
  remainders.sort(function(a,b){ return b.rem - a.rem; });
  for (var i = 0; i < remaining; i++){
    floors[remainders[i % remainders.length].order]++;
  }

  var picked = [];
  g.orders.forEach(function(order){
    var pool = shuffle(g.byOrder[order]);
    var quota = Math.min(floors[order], pool.length);
    picked = picked.concat(pool.slice(0, quota));
  });
  return shuffle(picked);
}

function startMockExam(){
  var list = buildMockExam(30);
  startSession(list, '模擬考', false);
}

/* ---------------- quiz screen ---------------- */
function saveSession(currentAnsweredLetter){
  G.session = {
    listIds: round.list.map(function(q){ return q.id; }),
    idx: round.idx,
    answered: round.answered,
    correct: round.correct,
    modeLabel: round.modeLabel,
    isReview: round.isReview,
    currentAnsweredLetter: currentAnsweredLetter || null
  };
  saveState();
}

function clearSession(){
  G.session = null;
  saveState();
}

function startSession(list, modeLabel, isReview){
  round = { list: list, idx: 0, answered: 0, correct: 0, modeLabel: modeLabel, isReview: isReview, currentLocked: false };
  document.getElementById('quiz-mode-badge').textContent = modeLabel;
  showScreen('quiz');
  renderQuestion();
  saveSession(null);
}

function resumeSession(){
  if (!G.session) return;
  var list = G.session.listIds.map(function(id){ return QUESTIONS_BY_ID[id]; }).filter(Boolean);
  if (list.length === 0 || G.session.idx >= list.length){
    clearSession();
    refreshHomeStats();
    return;
  }
  round = {
    list: list,
    idx: G.session.idx,
    answered: G.session.answered,
    correct: G.session.correct,
    modeLabel: G.session.modeLabel,
    isReview: G.session.isReview,
    currentLocked: false
  };
  document.getElementById('quiz-mode-badge').textContent = round.modeLabel;
  showScreen('quiz');
  renderQuestion();
  if (G.session.currentAnsweredLetter){
    var q = round.list[round.idx];
    applyAnswerVisuals(q, G.session.currentAnsweredLetter);
    round.currentLocked = true;
  }
}

function discardSession(){
  clearSession();
  refreshHomeStats();
}

function refreshResumeBanner(){
  var banner = document.getElementById('resume-banner');
  if (G.session && G.session.listIds && G.session.idx < G.session.listIds.length){
    banner.hidden = false;
    document.getElementById('resume-info').textContent =
      G.session.modeLabel + ' · 第 ' + (G.session.idx + 1) + ' / ' + G.session.listIds.length + ' 題';
  } else {
    banner.hidden = true;
  }
}

function updateEcg(){
  var pct = round.list.length ? Math.round((round.idx) / round.list.length * 100) : 0;
  document.getElementById('ecg-fill').style.width = pct + '%';
}

function renderQuestion(){
  var q = round.list[round.idx];
  round.currentLocked = false;

  document.getElementById('quiz-position').textContent = '第 ' + (round.idx + 1) + ' / ' + round.list.length + ' 題';
  document.getElementById('quiz-accuracy').textContent =
    '答對率 ' + (round.answered ? Math.round(round.correct / round.answered * 100) + '%' : '—');
  updateEcg();

  document.getElementById('quiz-cat').textContent = q.category;
  document.getElementById('quiz-page').textContent = '原文 p.' + q.sourcePage;
  document.getElementById('quiz-question').textContent = q.question;

  var optWrap = document.getElementById('quiz-options');
  optWrap.innerHTML = '';
  OPT_LETTERS.forEach(function(letter){
    var text = q.options[letter];
    if (!text) return;
    var btn = document.createElement('button');
    btn.className = 'option selectable';
    btn.type = 'button';
    btn.dataset.letter = letter;
    btn.innerHTML =
      '<span class="opt-letter mono">' + letter + '</span>' +
      '<span class="opt-text"></span>' +
      '<svg class="opt-icon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';
    btn.querySelector('.opt-text').textContent = text;
    btn.addEventListener('click', function(){ selectOption(letter); });
    optWrap.appendChild(btn);
  });

  document.getElementById('quiz-explain').hidden = true;
  var progEl = document.getElementById('explain-progress');
  progEl.hidden = true;
  document.getElementById('btn-next').disabled = true;
  document.getElementById('btn-next').textContent = '作答後解鎖下一題';
}

/* 純畫面呈現：套用已作答的視覺狀態（正常作答與「續作」時共用） */
function applyAnswerVisuals(q, letter, progressMsgOverride){
  var isCorrect = letter === q.answer;

  var buttons = document.querySelectorAll('#quiz-options .option');
  buttons.forEach(function(btn){
    var l = btn.dataset.letter;
    btn.classList.remove('selectable');
    btn.classList.add('locked');
    if (l === q.answer){
      btn.classList.add('correct');
    } else if (l === letter){
      btn.classList.add('incorrect');
    } else {
      btn.classList.add('dim');
    }
  });

  var banner = document.getElementById('explain-banner');
  banner.className = 'explain-banner ' + (isCorrect ? 'correct' : 'incorrect');
  banner.textContent = isCorrect ? ('✓ 答對了') : ('✗ 答錯了，正確答案為 ' + q.answer);

  var progEl = document.getElementById('explain-progress');
  var progressMsg = progressMsgOverride;
  if (progressMsg === undefined){
    if (isCorrect && Object.prototype.hasOwnProperty.call(G.wrongProgress, q.id)){
      var n = G.wrongProgress[q.id];
      progressMsg = '🎯 錯題本進度：已連續答對 ' + n + ' / ' + MASTERY_STREAK + ' 次，再答對 ' + (MASTERY_STREAK - n) + ' 次就會從錯題本移除';
    } else if (!isCorrect){
      progressMsg = '已加入錯題本，需連續答對 ' + MASTERY_STREAK + ' 次才會移除';
    } else {
      progressMsg = null;
    }
  }
  if (progressMsg){
    progEl.hidden = false;
    progEl.textContent = progressMsg;
  } else {
    progEl.hidden = true;
  }

  var refEl = document.getElementById('explain-ref');
  refEl.textContent = q.reference && q.reference.trim() ? q.reference : '（此題無額外參考資料）';

  document.getElementById('quiz-explain').hidden = false;
  document.getElementById('quiz-accuracy').textContent =
    '答對率 ' + (round.answered ? Math.round(round.correct / round.answered * 100) + '%' : '—');

  var nextBtn = document.getElementById('btn-next');
  nextBtn.disabled = false;
  nextBtn.textContent = (round.idx + 1 >= round.list.length) ? '完成本輪' : '下一題';
}

function selectOption(letter){
  if (round.currentLocked) return;
  round.currentLocked = true;

  var q = round.list[round.idx];
  var isCorrect = letter === q.answer;
  var progressMsg = '';
  var justMastered = false;

  round.answered++;
  G.totalAnswered++;
  if (isCorrect){
    round.correct++;
    G.totalCorrect++;
    if (Object.prototype.hasOwnProperty.call(G.wrongProgress, q.id)){
      G.wrongProgress[q.id]++;
      if (G.wrongProgress[q.id] >= MASTERY_STREAK){
        delete G.wrongProgress[q.id];
        justMastered = true;
      } else {
        progressMsg = '🎯 錯題本進度：已連續答對 ' + G.wrongProgress[q.id] + ' / ' + MASTERY_STREAK + ' 次，再答對 ' + (MASTERY_STREAK - G.wrongProgress[q.id]) + ' 次就會從錯題本移除';
      }
    }
  } else {
    G.wrongProgress[q.id] = 0;
    progressMsg = '已加入錯題本，需連續答對 ' + MASTERY_STREAK + ' 次才會移除';
  }

  applyAnswerVisuals(q, letter, justMastered ? ('🎉 已連續答對 ' + MASTERY_STREAK + ' 次，此題已從錯題本移除！') : (progressMsg || null));
  saveSession(letter);
  refreshHomeStats();
}

function goNext(){
  if (!round.currentLocked) return;
  round.idx++;
  if (round.idx >= round.list.length){
    updateEcg();
    clearSession();
    showSummary();
  } else {
    renderQuestion();
    saveSession(null);
  }
}

function exitQuiz(){
  if (round.answered > 0 && round.answered < round.list.length){
    var ok = window.confirm('尚未完成本輪，確定要離開並放棄這份進度嗎？（若只是想暫時離開，可以直接關閉分頁，下次打開會自動詢問是否繼續）');
    if (!ok) return;
  }
  clearSession();
  refreshHomeStats();
  showScreen('home');
}

/* ---------------- summary screen ---------------- */
function showSummary(){
  var pct = round.answered ? Math.round(round.correct / round.answered * 100) : 0;
  document.getElementById('summary-accuracy').textContent = pct + '%';
  document.getElementById('summary-detail').textContent = '答對 ' + round.correct + ' / ' + round.answered + ' 題（' + round.modeLabel + '）';
  document.getElementById('summary-correct').textContent = round.correct;
  document.getElementById('summary-wrong').textContent = round.answered - round.correct;
  var wrongCount = Object.keys(G.wrongProgress).length;
  document.getElementById('summary-total-wrong').textContent = wrongCount;

  document.getElementById('btn-summary-review').disabled = wrongCount === 0;

  refreshHomeStats();
  showScreen('summary');
}

/* ---------------- flashcard screen ---------------- */
function startFlashcards(list, modeLabel){
  flash = { list: list, idx: 0, modeLabel: modeLabel, flipped: false };
  document.getElementById('flash-mode-badge').textContent = modeLabel;
  showScreen('flash');
  renderFlashcard();
}

function updateFlashEcg(){
  var pct = flash.list.length ? Math.round((flash.idx) / flash.list.length * 100) : 0;
  document.getElementById('flash-ecg-fill').style.width = pct + '%';
}

function renderFlashcard(){
  var q = flash.list[flash.idx];
  flash.flipped = false;
  document.getElementById('flash-card').classList.remove('flipped');
  document.getElementById('flash-position').textContent = '第 ' + (flash.idx + 1) + ' / ' + flash.list.length + ' 張';
  updateFlashEcg();

  document.getElementById('flash-cat').textContent = q.category + ' · 第' + q.number + '題';
  document.getElementById('flash-question').textContent = q.question;
  document.getElementById('flash-answer-letter').textContent = q.answer;
  document.getElementById('flash-answer-text').textContent = q.options[q.answer] || '';
  document.getElementById('flash-ref').textContent = q.reference && q.reference.trim() ? q.reference : '（此題無額外參考資料）';
}

function flipFlashcard(){
  flash.flipped = !flash.flipped;
  document.getElementById('flash-card').classList.toggle('flipped', flash.flipped);
}

function flashPrev(){
  flash.idx = (flash.idx - 1 + flash.list.length) % flash.list.length;
  renderFlashcard();
}
function flashNext(){
  flash.idx = (flash.idx + 1) % flash.list.length;
  renderFlashcard();
}
function exitFlashcards(){
  refreshHomeStats();
  showScreen('home');
}

/* ---------------- wrong-bank browse screen (唯讀,看題目+答案) ---------------- */
function renderWrongBrowse(){
  var ids = Object.keys(G.wrongProgress);
  var list = ids.map(function(id){ return QUESTIONS_BY_ID[id]; }).filter(Boolean);
  // 依類別+題號排序，方便對照原始題庫
  list.sort(function(a,b){
    return a.categoryOrder - b.categoryOrder || a.number - b.number;
  });

  document.getElementById('wrongbrowse-title').textContent = '錯題本瀏覽（' + list.length + ' 題）';

  var wrap = document.getElementById('wrongbrowse-list');
  wrap.innerHTML = '';

  if (list.length === 0){
    var empty = document.createElement('div');
    empty.className = 'wb-empty';
    empty.textContent = '目前錯題本是空的。去刷題模式作答，答錯的題目會自動出現在這裡。';
    wrap.appendChild(empty);
    return;
  }

  list.forEach(function(q){
    var streak = G.wrongProgress[q.id] || 0;
    var card = document.createElement('div');
    card.className = 'wb-card';

    var metaRow = document.createElement('div');
    metaRow.className = 'wb-meta-row';
    metaRow.innerHTML =
      '<span class="chip chip-cat">' + q.category + ' · 第' + q.number + '題</span>' +
      '<span class="chip chip-page">原文 p.' + q.sourcePage + '</span>' +
      '<span class="wb-streak mono">連續答對 ' + streak + ' / ' + MASTERY_STREAK + '</span>';
    card.appendChild(metaRow);

    var qEl = document.createElement('p');
    qEl.className = 'wb-question';
    qEl.textContent = q.question;
    card.appendChild(qEl);

    var optsWrap = document.createElement('div');
    optsWrap.className = 'wb-options';
    OPT_LETTERS.forEach(function(letter){
      var text = q.options[letter];
      if (!text) return;
      var isAns = letter === q.answer;
      var opt = document.createElement('div');
      opt.className = 'wb-option' + (isAns ? ' wb-correct' : '');
      opt.innerHTML =
        '<span class="wb-letter mono">' + letter + '</span>' +
        '<span></span>';
      opt.querySelector('span:last-child').textContent = text;
      optsWrap.appendChild(opt);
    });
    card.appendChild(optsWrap);

    var refBlock = document.createElement('div');
    refBlock.className = 'wb-ref';
    refBlock.innerHTML = '<div class="explain-label">解析 / 參考資料</div><p class="explain-text"></p>';
    refBlock.querySelector('p').textContent = q.reference && q.reference.trim() ? q.reference : '（此題無額外參考資料）';
    card.appendChild(refBlock);

    wrap.appendChild(card);
  });
}

function openWrongBrowse(){
  renderWrongBrowse();
  showScreen('wrongbrowse');
}
function exitWrongBrowse(){
  refreshHomeStats();
  showScreen('home');
}

/* ---------------- wire up ---------------- */
document.querySelectorAll('.mode-tab').forEach(function(btn){
  btn.addEventListener('click', function(){ setHomeMode(btn.dataset.mode); });
});
document.getElementById('btn-start-all').addEventListener('click', startAll);
document.getElementById('btn-mock-exam').addEventListener('click', startMockExam);
document.getElementById('btn-review-wrong').addEventListener('click', startReview);
document.getElementById('btn-browse-wrong').addEventListener('click', openWrongBrowse);
document.getElementById('btn-wrongbrowse-exit').addEventListener('click', exitWrongBrowse);
document.getElementById('btn-next').addEventListener('click', goNext);
document.getElementById('btn-exit').addEventListener('click', exitQuiz);
document.getElementById('btn-reset-data').addEventListener('click', resetState);

document.getElementById('btn-summary-review').addEventListener('click', startReview);
document.getElementById('btn-summary-restart').addEventListener('click', function(){
  var base = round.isReview ? Object.keys(G.wrongProgress).map(function(id){return QUESTIONS_BY_ID[id];}).filter(Boolean) : round.list;
  if (round.isReview && base.length === 0){
    refreshHomeStats();
    showScreen('home');
    return;
  }
  var list = isRandom() ? shuffle(base) : base.slice();
  startSession(list, round.modeLabel, round.isReview);
});
document.getElementById('btn-summary-home').addEventListener('click', function(){
  refreshHomeStats();
  showScreen('home');
});

document.getElementById('flash-card').addEventListener('click', flipFlashcard);
document.getElementById('btn-flash-prev').addEventListener('click', flashPrev);
document.getElementById('btn-flash-next').addEventListener('click', flashNext);
document.getElementById('btn-flash-exit').addEventListener('click', exitFlashcards);

document.getElementById('btn-resume-continue').addEventListener('click', resumeSession);
document.getElementById('btn-resume-discard').addEventListener('click', discardSession);

/* ---------------- init ---------------- */
loadState();
buildCategoryList();
setHomeMode('quiz');
refreshHomeStats();

})();

</script>
