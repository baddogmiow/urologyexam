3159","sourcePage":77},{"id":"3-006","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":6,"question":"關於膀胱內藥物灌注治療，何者錯誤？","options":{"A":"膀胱內灌注 BCG 相較於灌注化療藥物有較高的 efficacy 但同時也帶來較強的副作用","B":"BCG 和化療藥物灌注都被證實可以降低膀胱腫瘤 的 recurrence 及 progression","C":"肉眼可見血尿為 BCG 的絕對禁忌症","D":"BCG maintenance therapy 可以帶來更好的治療 結果","E":"BCG 作用機轉的第一步為結合 bladder wall 內 的 fibronectin，進而誘導後續一系列的免疫反 應"},"answer":"B","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell Walsh Urology,12th edition, Chapter 136, p.3099-3102","sourcePage":77},{"id":"3-007","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":7,"question":"肌肉侵襲性膀胱癌(muscle invasive bladder cancer)的內在分子亞型(intrinsic molecular subtype)可分為 luminal 及 basal 兩種亞型，請問以 下何者不屬於 basal subtype 的特色?","options":{"A":"較具侵襲性 (more aggressive)","B":"具有鱗狀分化 (squamous differentiation)","C":"有較多的 FGFR3, KRT20 的突變(high levels of FGFR3, KRT20 mutations)","D":"會表現出 CK5, CK6, CK14 (expression of CK5, CK6, CK14)","E":"FOXA1 及 GATA3 的 RNA 及蛋白質表現較低 (low levels of FOXA1 and GATA3 RNA and protein expression)"},"answer":"C","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, Chapter 135","sourcePage":77},{"id":"3-008","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":8,"question":"根據三期臨床試驗｢Javelin bladder 100｣，針對無 法手術切除之局部侵犯性或轉移性尿路上皮癌 (unresectable locally advanced or metastatic urothelial cancer)，先給予 4-6 個療程(cycles) 之 gemcitabine 加上 cisplatin 或 carboplatin 的化 學治療後，再使用 avelumab 接續治療(maintenance therapy)，對照組為 best supportive care，請問 以下描述何者不正確?","options":{"A":"該研究僅針對接受化療 4-6 個療程(cycles)後 無惡化之病患進行研究","B":"Avelumab 是在化療療程結束之後立刻接著施打","C":"接受 avelumab 接續治療可明顯延長整體存活期 (overall survival)，avelumab 組與對照組的 中位整體存活期(median overall survival)分 別為 21.4 個月與 14.3 個月，風險比(hazard ratio)為 0.69","D":"接受 avelumab 接續治療可延長疾病無惡化存活 期(progression free survival)，avelumab 組 與對照組的中位疾病無惡化存活期(median progression free survival)分別為 3.7 個月與 2.0 個月，風險比(hazard ratio)為 0.62","E":"出現≧grade 3 的藥物副作用(adverse events) 比例，avelumab 組為 47.4%，對照組為 25.2%"},"answer":"B","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： N Engl J Med 2020;383:1218-30","sourcePage":78},{"id":"3-009","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":9,"question":"腎囊腫(Renal Cysts)是最常見的無症狀良性腎臟腫 瘤，但是必須仔細評估是否存在有惡性病灶需要治 療，根據 Bosniak Classification of Renal Cysts， 下圖複雜性腎囊腫(左為 CT 影像，右為手術標本相 片)，應屬於那一級？","options":{"A":"II.","B":"IIF.","C":"III.","D":"IV.","E":"V."},"answer":"D","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)：p 1300, chap. 56 Benign Renal Tumors, part X Neoplasms of the Upper Urinary Tract, Campbell-Walsh Urol, 11th edi. 說明：Bosniak Classification of Renal Cysts 並無 class V。","sourcePage":78},{"id":"3-010","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":10,"question":"有關於上泌尿道尿路上皮癌(Upper Tract Urothelial Cancer, UTUC)的描述，下列何者錯誤？","options":{"A":"研究報告顯示膀胱尿路上皮癌(Urinary Bladder Urothelial Carcinoma, UBUC)患者有 2%到 4%會發展出上泌尿道尿路上皮癌(UTUC)","B":"雖然差異頗大，但諸多研究報告顯示有 15%到 75%的上泌尿道尿路上皮癌(UTUC)患者，會在 5 年內產生膀胱癌","C":"若同時存在原位癌(Carcinoma in Situ, CIS) 的病灶，多發性和雙側性上泌尿道尿路上皮癌 (UTUC)的風險就會增高","D":"期別(Stage)是目前針對上泌尿道尿路上皮癌 (UTUC)患者存活率最重要的預測指標","E":"根據 American Joint Committee on Cancer (AJCC) and TNM Staging and Classification Systems 上泌尿道尿路上皮癌(UTUC)的分期，若 腫瘤經腎臟實質(parenchyma)侵犯到腎外脂肪 組織(perinephric fat)時，其 T 分期應屬於 T3"},"answer":"E","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)：p 1365, chap. 58 Urothelial Tumors of the Upper Urinary Tract and Ureter, Campbell-Walsh Urol, 11th edi. 說明：應為 T4。","sourcePage":79},{"id":"3-011","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":11,"question":"有關於侵犯性(Invasive)膀胱癌的膀胱保留 (Bladder preservation)治療政策，比較合理可以接 受三重療法(Trimodal Therapy，即經尿道刮除、放 射及化學治療)的理想條件，下列何者錯誤？","options":{"A":"良好的基本膀胱功能","B":"內視鏡下完全切除可見之腫瘤","C":"不可有原位癌(Carcinoma in Situ, CIS)的病灶 存在","D":"小而單一之腫瘤","E":"腫瘤未造成腎積水(hydronephrosis)"},"answer":"C","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)：p 2233, chap. 94 Management of Metastatic and Invasive Bladder Cancer, Campbell-Walsh Urol, 11th edi. 說明：局限性的 CIS 是可以 的。","sourcePage":79},{"id":"3-012","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":12,"question":"對於侵犯肌肉層的膀胱癌(muscle-invasive bladder cancer)患者接受前輔助性化學治療 (neoadjuvant chemotherapy)有諸多考慮，下列何者 錯誤？","options":{"A":"前輔助性化學治療只需短暫的三個週期，因為很 快會接受手術治療，所以不必擔心因疾病的進展 而延誤","B":"手術前接受全身系統性的化學治療通常耐受性 會比較好，而且手術後的化學治療常因手術併發 症或虛弱而被延後","C":"前輔助性化學治療對於顯微轉移 (micrometastatic disease)會有更及時的效 益，尤其是潛在的癌細胞量較少的時候","D":"前輔助性化學治療具有降期(downstage)和縮小 病灶的能力，如此便可以有更高的手術邊緣 (surgical margins)陰性率，這是一個已知的膀 胱切除術後局部復發的重要指標","E":"前輔助性化學治療可提供臨床醫師評估個別患 者對治療的反應，提供後續治療的參考"},"answer":"A","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)：p 2230, chap. 94 Management of Metastatic and Invasive Bladder Cancer, Campbell-Walsh Urol, 11th edi. 說明：前輔助性化學治療針對 於無療效反應的病人，反而會 延誤手術治療，而造成疾病的 進展。","sourcePage":80},{"id":"3-013","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":13,"question":"關於腎臟血管平滑肌脂肪瘤(AML)的敘述，下列何者 為非？","options":{"A":"好發於中年女性","B":"結節性硬化症(tuberous sclerosis complex, TSC)患者常合併 AML，其病因為基因 TSC1,9q; TSC2,16p 之突變","C":"TSC1 轉譯出的 tuberin 以及 TSC2 轉譯出的 hamartin，有抑制 mTOR pathway 的作用，以抑 制細胞增長及血管新生","D":"Everolimus 已被 FDA 批准用來治療 TSC 引起的 AML","E":"懷孕是自發性出血的危險因子"},"answer":"C","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell Walsh Urology,12th edition, Chapter 96, p.2125-2128","sourcePage":80},{"id":"3-014","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":14,"question":"關於 Familial RCC 的敘述，下列何者為錯？","options":{"A":"Von Hippel-Lindau disease 為 VHL 基因突變所 引起，VHL 基因為第三對體染色體上之腫瘤抑制 基因(tumor suppressor gene)","B":"Hereditary papillary RCC syndrome (HPRC) 常 見 c-MET 腫瘤抑制基因(tumor suppressor gene)的突變","C":"Hereditary leiomyomatosis and RCC syndrome (HLRCC)常見 type 2 papillary RCC，是較具侵 犯性的遺傳性 RCC","D":"Birt-Hogg-Dube (BHD) syndrome 常見由 distal nephron 衍生出來的 chromophobe RCC 及 oncocytomas","E":"Succinate dehydrogenase-deficient RCC (SDH-RCC)較常見 type 2 papillary RCC"},"answer":"B","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell Walsh Urology,12th edition, Chapter 97, p.2141-2145","sourcePage":80},{"id":"3-015","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":15,"question":"關於膀胱腫瘤的敘述，下列何者錯誤？","options":{"A":"抽菸及職業暴露是最常見的環境暴露危險因子","B":"男性發生率較女性高且腫瘤通常較為侵犯(more advanced)，預後也較差","C":"膀胱鏡及切片仍是膀胱腫瘤的標準診斷工具 (gold-standard test)","D":"Urine cytology 對於 high-grade tumor 有較高 的 sensitivity","E":"可分為 luminal subtypes 及 basal-squamous subtypes，luminal subtypes 通常較不具侵犯 性"},"answer":"B","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell Walsh Urology,12th edition, Chapter 135, p.3075-3087","sourcePage":81},{"id":"3-016","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":16,"question":"一名 76 歲男性因膀胱癌接受膀胱內 Bacillus Calmette-Cuerin(BCG)灌注，於第二次誘導性治療 (induction instillation)後出現持續超過兩天的 39℃高燒及嚴重的下泌尿道症狀，請問下列處置何者 較為恰當？","options":{"A":"可使用 ciprofloxacin 治療","B":"使用單一抗結核藥物治療(monotherapy)即可","C":"應使用 rifampin 加上 pyrazinamide 的合併治療","D":"下次 BCG 灌注時應考慮將劑量減半或減為 1/3","E":"即使沒有影響到其他 solid organ，也應立即停 止整個 BCG 治療流程"},"answer":"D","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell Walsh Urology,12th edition, Chapter 135, p.3075-3087","sourcePage":81},{"id":"3-017","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":17,"question":"以下病患皆是膀胱原位癌(CIS)的患者，何者是膀胱 灌注卡介苗(BCG)適合治療的對象？","options":{"A":"於開始灌注卡介苗(BCG)後三個月出現 T1 high grade 復發","B":"於開始灌注卡介苗(BCG)後三個月及六個月皆出 現原位癌(CIS)復發","C":"於開始灌注卡介苗(BCG)後三個月及六個月皆出 現 Ta high grade 復發","D":"完全性尿失禁(total incontinence)之病人","E":"膀胱輸尿管逆流之病人"},"answer":"E","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12ed. Ch136 p.3101 box 136.1 EAU guideline NMIBC, 2021, table 7.2","sourcePage":81},{"id":"3-018","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":18,"question":"有關肌肉層侵犯膀胱癌(MIBC)病人之治療，下列敘述 何者錯誤？","options":{"A":"散在性(multi-focal)的腫瘤因為難以手術切 除，使用同步化學放射治療 CCRT (concurrent chemoradiotherapy)是較為適當的選擇","B":"膀胱功能是決定是否使用膀胱保留治療的重要 考慮之一","C":"目前沒有確切證據來比較膀胱保留治療以及膀 胱根除術的治療效果","D":"若腫瘤引起腎臟水腫，則不適合進行膀胱保留治 療","E":"連續療程(continuous-course)之三體性治療 (Trimodality therapy)須在同步化學放射治療 CCRT(concurrent chemoradiotherapy)結束後 三至四個月後再進行內視鏡治療效果評估"},"answer":"A","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12ed. Ch137 p.3122-3123","sourcePage":82},{"id":"3-019","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":19,"question":"關於膀胱癌病人之膀胱替代，下列敘述何者錯誤？","options":{"A":"肥胖之病人，由於腹壁過厚，在做造口時會增加 手術困難，因此有時更適合原位(orthotopic) 人工膀胱","B":"原位癌(CIS)、散在性腫瘤(multifocal tumor) 以及膀胱外侵犯(extravesical disease)之病 人，不應做原位(orthotopic)人工膀胱","C":"所有接受禁尿性尿路分流(continent urinary diversion)之病人皆需有能力自我導尿","D":"尿道狹窄之病人是原位(orthotopic)人工膀胱 之禁忌症","E":"原位人工膀胱術前不須做膀胱頸或攝護腺尿道 之切片，術中用冷凍切片(frozen section)進行 確認即可"},"answer":"B","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12ed. Ch141 p.3235-3239","sourcePage":82},{"id":"3-020","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":20,"question":"60 歲王先生被診斷有右側 RCC，同時併有腎衰竭、肝 指數異常及高血鈣的狀況，無遠端轉移，關於此病人 之情況下列何者正確？","options":{"A":"可給予輸液、利尿劑及 Zoledronic acid 治療高 血鈣","B":"Paraneoplastic syndrome 發生率與腫瘤侵犯程 度相關，其中高血鈣最常見","C":"可能為 Stauffer syndrome,與 IL6 濃度升高有 關, ALP 為最常見之肝指數異常,而 ALT 異常之 比例不到 5 成","D":"Stauffer syndrome 其他常見表現如 thrombocytopenia, neutropenia, fever 及 weight gain","E":"此病人接受手術後 paraneoplastic syndrome 有 機會改善，然而 Stauffer syndrome 之肝功能異 常大多無法回復"},"answer":"C","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12ed. Ch 97 p2155~p2156","sourcePage":82},{"id":"3-021","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":21,"question":"初診斷單顆 1cm 之腎腫瘤，何者較不適合 Active surveillance？","options":{"A":"腎乳突癌(papillary RCC) 併遺傳性 7q31 染色 體變異及該基因相關之腎臟癌家族史","B":"腎乳突癌(papillary RCC) 併遺傳性 1q42-43 染 色體變異及該基因相關之腎臟癌家族史","C":"腎乳突癌(papillary RCC) 併遺傳性 10q23 染色 體變異及該基因相關之腎臟癌家族史","D":"亮細胞癌(clear cell RCC) 併遺傳性 3p25 染色 體變異及該基因相關之腎臟癌家族史","E":"Bosniak 4 腎囊腫"},"answer":"B","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12ed. Ch 97 p2173, 2142, 2144","sourcePage":83},{"id":"3-022","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":22,"question":"腎臟囊腫(renal cyst)是腎臟最常見的良性腫瘤，關 於臨床經常用來判斷腎臟囊腫的惡性程度量表， Bosniak classification，以下敘述何者錯誤？","options":{"A":"Bosniak I 無需進一步的處置和追蹤","B":"Bosniak IIF 由於惡性程度的機率略高於 Bosniak II，因此建議定期的追蹤","C":"一個 2cm 腫瘤擁有均勻的高顯影強度且其囊腫 壁平滑無顯影，將歸類於 Bosniak IIF","D":"Bosniak III 及 IV 在注射顯影劑下可觀察到囊 腫壁顯影的增強","E":"Bosniak IV 的惡性率高於七成"},"answer":"C","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12ed, Chapter 96, Benign Renal Tumors, p2122, table 96.1; Chapter 97, Malignant Renal Tumors, p2137, table 97.3","sourcePage":83},{"id":"3-023","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":23,"question":"李醫師從患者身上切下了一個最大徑六公分的腎臟 腫瘤，其肉眼剖面如圖Ａ，顯微鏡放大後可見許多嗜 伊紅細胞 (eosinophilic cells)如圖Ｂ，而免疫染 色後 CK7 呈現陰性反應，CD117 呈現陽性反應。下列 有關此腫瘤的敘述何者錯誤?","options":{"A":"此腫瘤是良性的","B":"此腫瘤好發於單側腎臟並且大多無臨床症狀","C":"此腫瘤的免疫染色 vimentin 呈現陽性反應","D":"Birt-Hogg-Dube syndrome 與此腫瘤有高度相關 性","E":"有鑒於此腫瘤的特性，若需要手術的患者也會盡 量使用 nephron-sparing 的手術方式處理"},"answer":"C","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12ed, Chapter 96, Benign Renal Tumors, p2123-2125","sourcePage":83},{"id":"3-024","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":24,"question":"關於家族性遺傳性上泌尿道上皮癌 (Familial/hereditary UTUCs)，Lynch Syndrome 的 敘述何者錯誤？","options":{"A":"這是一種自體顯性的遺傳疾病","B":"患者發病的年齡通常小於 60 歲","C":"此疾病與基因 MLH1, MSH2, MSH6, 和 PMS2 的突 變有關","D":"男性因 Lynch Syndrome 罹患 UTUC 的累積危險性 (cumulative risk)較女性高","E":"病人有較高的可能性合併有腸胃道、消化道及皮 膚的癌症"},"answer":"D","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12ed, Chapter 98, Urothelial Tumors of the Upper Urinary Tract and Ureter, p2185","sourcePage":84},{"id":"3-025","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":25,"question":"62 歲的王先生被診斷出 NMIBC (non-muscle invasive bladder cancer)，後續接受了六次膀胱內 BCG 灌注誘導治療(induction therapy)及二次維持 治療(maintenance therapy)療程，未達半年腫瘤復 發，其刮除後的病理顯示為 CIS (carcinoma in situ)，下列何者錯誤？","options":{"A":"病人可視為 BCG unresponsive NMIBC","B":"若病人身體情況允許，應建議病人接受膀胱根除 性切除手術","C":"追加 BCG 灌注誘導治療為優先選項","D":"可建議病人膀胱 valrubicin 灌注治療","E":"可建議免疫檢查點抑制劑(checkpoint inhibitor)如 pembrolizumab"},"answer":"C","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12ed, Chapter 136, Management Strategies for Non–Muscle-Invasive Bladder Cancer (Ta, T1, and CIS), p3105-3107; NCCN Guidelines Version 3.2021 Bladder Cancer","sourcePage":85},{"id":"3-026","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":26,"question":"有關腎臟良性腫瘤，下列何者為非？","options":{"A":"診斷腎臟腫瘤時，cytokeratin-7 (CK7)陽性常 見於 oncocytoma","B":"最常見具顯影性的腎臟良性腫瘤為 oncocytoma","C":"Bosniak 分期 IIF 的腎臟囊腫(Renal cyst)影像 學追蹤若無明顯變化，則惡性機率< 1%","D":"造成自發性後腹腔出血最常見的腎臟腫瘤為血 管肌肉脂肪瘤(angiomyolipoma, AML)","E":"tuberous sclerosis complex (TSC)相關的 angiomyolipoma，可以考慮使用 everolimus 來 治療"},"answer":"A","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition Chapter 96 Page 2122 Page 2123 Page 2128","sourcePage":85},{"id":"3-027","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":27,"question":"對於 renal cell carcinoma(RCC)的敘述，何者正確？","options":{"A":"papillary RCC 第一型預後較第二型差","B":"Clear cell papillary RCC 與 VHL disease 基 因突變無關","C":"超過 80%是從 proximal tubule 生成","D":"Chromophobe RCC 與 Fumarate hydratase (FH) gene (1q42-43)突變有關","E":"病理特徵表現多為 hypovascular"},"answer":"C","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition Chapter 97 Page 2149","sourcePage":85},{"id":"3-028","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":28,"question":"有關泌尿上皮癌（urothelial carcinoma），何者錯 誤？","options":{"A":"在根除性腎臟輸尿管切除手術後，預後與腫瘤位 置與分期相關","B":"輸尿管腫瘤最常發生在遠端輸尿管","C":"遠端輸尿管腫瘤發生率約佔整體輸尿管的 50%","D":"膀胱腫瘤五年內復發率約為 15~75%","E":"腫瘤擴散是靠淋巴及血液"},"answer":"C","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12th P.2194","sourcePage":85},{"id":"3-029","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":29,"question":"根據第八版 AJCC TNM 分類，那一個腫瘤不是 pT3a?","options":{"A":"4.2 公分的 RCC 有 renal sinus fat invasion","B":"13 公分的 RCC 有 renal vein involvement","C":"5.7 公分的 RCC 有 invasion of perinephric fat","D":"4.7 公分的 RCC 有 invasion into adrenal gland","E":"6.6 公分的 RCC 有 collecting system involvement"},"answer":"D","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12th; page 9981","sourcePage":86},{"id":"3-030","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":30,"question":"有關膀胱癌的職業相關危險因素中，何者不正確?","options":{"A":"香菸工人相對風險 1.72 倍","B":"染料工人相對風險 1.58 倍","C":"掃煙囪工人相對風險 1.53 倍","D":"護理人員相對風險 1.49 倍","E":"醫師相對風險 1.51 倍"},"answer":"E","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12th; page 14127","sourcePage":86},{"id":"3-031","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":31,"question":"肌肉侵犯型膀胱癌使用手術前化學治療可改善存活 從:","options":{"A":"16 月到 42 月","B":"23 月到 54 月","C":"37 月到 51 月","D":"46 月到 77 月","E":"75 月到 85 月"},"answer":"D","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12th; page 14333","sourcePage":86},{"id":"3-032","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":32,"question":"有關 Clear cell papillary renal cell carcinoma (CCPRCC)臨床病理及分子特徵何者正確?","options":{"A":"多為單發","B":"多為兩側性","C":"同側多發 如果屬異質性腫瘤(heterogenous) 預後較好","D":"與 VHL disease 無關","E":"腫瘤常常快速進展"},"answer":"B","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： European Urology 2021;79(4):468-477","sourcePage":86},{"id":"3-033","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":33,"question":"IMDC (International Metastatic RCC Database Consortium) criteria 可用於轉移性腎細胞癌的風 險評估，以下何者不是其中的風險因子？","options":{"A":"Karnofsy PS <80%","B":"Interval from diagnosis to treatment <1 year","C":"LDH > 1.5x upper limit of normal","D":"Hb < low limit of normal","E":"Corrected calcium > upper limit of normal"},"answer":"C","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell Walsh Urology,12th edition, Chapter 104, p.2325","sourcePage":86},{"id":"3-034","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":34,"question":"根據最新版 EAU guideline，對於 metastatic RCC 的治療，下列何者為對？","options":{"A":"Nivolumab + Ipilimumab 被建議使用在 all IMDC risk group 的病患","B":"Cabozantinib 被建議使用在 all IMDC risk group 的病患","C":"Pembrolizumab 被建議使用在 VEGF-target therapy 治療失敗後的二線治療","D":"Cabozantinib 可以用在 VEGF-refractory disease","E":"若病患無法接受 immune checkpoint inhibitor 的治療, Pazopanib 可以做為替代的第一線治 療, 但治療效果不如 Sunitinib"},"answer":"D","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： 2021 EAU guideline on RCC, 7.4 and Figure 7.1, p.42-50","sourcePage":87},{"id":"3-035","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":35,"question":"關於使用腸胃道進行尿液分流(intestinal urinary diversion)的敘述，何者錯誤？","options":{"A":"使用胃做尿液分流容易導致 hypokalemia 及 metabolic alkalosis","B":"使用胃做尿液分流會造成後續 aldosterone 下 降","C":"使用迴腸(ileum)做尿液分流容易導致 hyperchloremic acidosis 及 hypokalemia","D":"Submucosal tunnel 的 anti-reflux 機制, 較容 易在大腸(colon)尿液分流上完成","E":"使用迴腸(ileum)做尿液分流容易有後續 Vit.B12 吸收不良的問題"},"answer":"B","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell Walsh Urology,12th edition, Chapter 139, p.3162, Table 139.15","sourcePage":87},{"id":"3-036","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":36,"question":"75 歲男性，身體健康狀況良好且日常生活均能自我 照料，2 年前診斷有右側腎臟腫瘤合併肺部轉移，接 受右側腎臟切除手術後病理檢查顯示為亮細胞腎細 胞癌(clear cell renal cell carcinoma) pT3a，醫 師開立了 Sunitinib 給他使用(37.5mg，服用兩週休 息一週)，治療之後肺部轉移的病灶顯著減小，但在 經過 15 個月的治療之後，發現肺部轉移病灶增加， 醫師考慮幫他調整藥物。請問依照現有的大規模三期 臨床試驗結果(phase III randomized clinical trial)，以下何者作為下一線治療藥物可以提升整體 存活期(overall survival)?","options":{"A":"Pazopanib","B":"Everolimus","C":"Axitinib","D":"Nivolumab","E":"Pembrolizumab"},"answer":"D","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： NCCN guidelines 2021, EAU guidelines 2021","sourcePage":87},{"id":"3-037","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":37,"question":"下列何種腎細胞癌(renal cell carcinoma, RCC)的 亞型(subtypes)是源自於集尿小管(collecting duct)?","options":{"A":"Clear cell RCC","B":"Type 1 papillary RCC","C":"Type 2 papillary RCC","D":"Chromophobe RCC","E":"Succinate dehydrogenase deficient renal carcinoma"},"answer":"D","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, Chapter 97","sourcePage":88},{"id":"3-038","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":38,"question":"烏腳病（Blackfoot Disease）是一種盛行於台灣西 南沿海，特別是北門、學甲等鄉鎮地區的流行性末梢 血管疾病，由台灣醫學會報告於 1954 年正式提出， 1956 年後大量發生，嚴重性引起衛生當局和醫學界 的注意。烏腳病和濱海地區民眾飲用含有砷過量的深 井水，造成慢性砷中毒有關。在烏腳病盛行地區也發 現上泌尿道尿路上皮癌(Upper urinary tract urothelial carcinoma, UTUC)的發生率上升。關於 此區之 UTUC 的敘述，以下何者錯誤?","options":{"A":"男性較為好發，男性比女性約為 2:1","B":"發生年齡較輕，大約 55–60 歲","C":"輸尿管比腎盂常發生","D":"與烏腳病的直接關聯性(direct relationship) 並不明確","E":"當時此區域發生的 UTUC 個案數大約佔全台灣 25%"},"answer":"A","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, Chapter 98","sourcePage":88},{"id":"3-039","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":39,"question":"有關上泌尿道尿路上皮癌(Upper urinary tract urothelial carcinoma, UTUC)的成因、診斷與治療， 下列敘述何者錯誤?","options":{"A":"肥胖(obesity, BMI>30)雖然不是產生 UTUC 的危 險因子，但是會影響 UTUC 治療的預後","B":"在根除性手術前的輸尿管鏡檢查 (Ureteroscopy, URS)雖然有助於診斷 UTUC，但 也會增加膀胱內尿路上皮癌復發的比例","C":"核磁共振尿路造影(Magnetic resonance urography, MRU)診斷 UTUC 的精準度較電腦斷層 尿路造影(Computed tomography urography, CTU)為高，但因價錢較高、花費時間較久以致 CTU 仍推薦為一線診斷工具","D":"若一男性同時在單側輸尿管、膀胱、及攝護腺尿 道發現有尿路上皮癌，則可稱此病人有全尿路上 皮病(Panurothelial Disease)","E":"在開完一側根除性腎輸尿管切除術的 UTUC 病 人，術後 eGFR>60，若決定要接受輔助性化學治 療(adjuvant chemotherapy)，縱使其腎毒性較 強，仍應優先考慮順鉑類化療(cisplatin-based chemotherapy)"},"answer":"C","reference":"(111) 參考資料(摘錄自)：Campbell Walsh Urology, 12th edition, 2020, Chapter 98 and 99, (A) p.2196 Fig 98.5 (B)p.2190-2191 (C)p.2191-2192 (D)p.2194 (E)p.2222-2223","sourcePage":88},{"id":"3-040","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":40,"question":"有關腎臟腫瘤的定位治療(Focal therapy)，下列敘 述何者錯誤?","options":{"A":"冷凍治療(Cryoablation, CA)的理想治療溫度 要低於攝氏-40 度，而射頻燒灼術 (Radiofrequency ablation, RFA)的理想治療溫 度要高於攝氏 70 度","B":"大部份使用冷凍治療成功的腎臟腫瘤會在一年 內的影像追蹤中看到體積減少 50%","C":"冷凍治療產生術後出血的比例較射頻燒灼術為 高","D":"腹腔鏡(Laparoscopic)定位治療與經皮 (Percutaneous)定位治療兩者產生併發症的比 例沒有顯著差異","E":"(E) 冷凍治療與射頻燒灼術在腫瘤局部復發率 (local recurrence rate)與整體存活率 (overall survival)上沒有顯著差異"},"answer":"D","reference":"(111) 參考資料(摘錄自)：Campbell Walsh Urology, 12th edition, 2020, Chapter 103, (A) p.2310, 2312 (B)p.2314 (C)p.2320 (D)p.2318-2320 (E)p.2318","sourcePage":89},{"id":"3-041","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":41,"question":"有關非肌肉侵犯型膀胱癌(Non-muscle invasive bladder cancer)的治療原則，下列敘述何者錯誤?","options":{"A":"若經尿道膀胱腫瘤切除術(Transurethral resection of bladder tumor, TURBT)後，病理 組織顯示為高分級(High grade)T1，則應該請病 人在六周內重複手術(Repeat TURBT)","B":"若病人有低分級(Low grade)膀胱腫瘤，則 TURBT 術後六小時內給予一劑膀胱內化學治療 (intravesical chemotherapy)可以有效降低腫 瘤進展(progression)","C":"卡介苗(Bacillus Calmette-Guérin vaccine, BCG)是唯一一種可以降低或延緩高分級(High grade)膀胱腫瘤進展(progression)的膀胱內灌 注藥劑","D":"若病人有高分級(High grade)膀胱腫瘤，且 TURBT 術後經歷兩次膀胱 BCG 灌藥的療程 (course)，腫瘤卻持續復發，應建議病人做膀胱 切除手術(cystectomy)","E":"戒菸、增加飲水量、減少高油脂食物攝取是可以 建議病人預防復發的生活習慣改變(Life style modification)"},"answer":"B","reference":"(111) 參考資料(摘錄自)：Campbell Walsh Urology, 12th edition, 2020, Chapter 136, (A) p.3096 (B)p.3109 (C)p.3103 (D)p.3107 (E)p.3110","sourcePage":89},{"id":"3-042","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":42,"question":"有關腎臟囊腫(Renal cyst)、多囊性腎臟 (Polycystic kidney disease, PKD)、後天性囊性腎 臟疾病(Acquired cystic kidney disease, ACKD)， 下列敘述何者正確?","options":{"A":"若將實質(solid)及囊性(cystic)腫瘤合在一起 計算的話，腎臟囊腫是第二常見的良性腫瘤，僅 次於嗜酸細胞瘤(Oncocytoma)","B":"產生腎臟囊腫的危險因子包含年紀、女性、抽 菸、高血壓等","C":"若一個腎臟囊腫在含顯影劑的電腦斷層 (Contrast-enhanced CT)底下發現明顯可測量 的顯影(enhancement)，則該囊腫一定至少有 Bosniak 分級 III 以上","D":"偶發性(Sporadic)腎臟囊腫是從近曲小管 (proximal convoluted tubule)源發，而洗腎後 產生的後天性囊性腎臟疾病則是從遠曲小管 (distal convoluted tubule)源發","E":"因後天性囊性腎臟疾病(ACKD)所產生的腎細胞 癌(Acquired cystic disease associated RCC)，其預後較一般的亮細胞(Clear-cell)腎細 胞癌較差"},"answer":"C","reference":"(111) 參考資料(摘錄自)：Campbell Walsh Urology, 12th edition, 2020, Chapter 96 (A)p.2123 (B)p.2121 (C)p.2122 (D)p.2121 (E)p.2150","sourcePage":90},{"id":"3-043","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":43,"question":"有關非尿路上皮源發的膀胱癌(Nonurothelial malignancy)，下列敘述何者正確?","options":{"A":"膀胱小細胞癌(Small cell carcinoma)對於化療 效果差，建議以根除性手術搭配放射治療作為首 要選擇","B":"因為脊隨損傷(Spinal cord injury)而需要長期 放置導尿管的病人，發生膀胱鱗狀細胞癌 (Squamous cell carcinoma)的比例較高，且此 機率並不因為改成間歇性導尿(intermittent self-catheterization)而下降","C":"膀胱腺癌(Adenocarcinoma)需要先排除遠處轉 移的可能，其中最常見的來源為胃及肺臟","D":"膀胱腺癌的危險因子包含幼年的膀胱外翻 (Bladder exstrophy)、血吸蟲病 (schistosomiasis)、及慢性尿路阻塞","E":"臍尿管腺瘤(Urachal adenocarcinoma)在膀胱 鏡中最常看到侵犯膀胱的地方為膀胱的後壁 (posterior wall)"},"answer":"D","reference":"(111) 參考資料(摘錄自)：Campbell Walsh Urology, 12th edition, 2020,Chapter 135 (A)p.3089 (B)p.3089 (C)p.3090 (D)p.3090 (E)p.3090","sourcePage":90},{"id":"3-044","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":44,"question":"下列關於人體對抗泌尿道腫瘤之免疫機轉之敘述何 者為非?","options":{"A":"腫瘤和免疫系統相互對抗之過程，可由一開始的 清除過程(elimination)到共存 (equilibrium)，最後進展到逃脫期(escape)","B":"BCG 灌注主要是刺激 marcophage 吞噬致病原 (pathogen)並分泌 cytokines 及 chemokines 並 吸引 neutrophil 產生發炎反應，這是一種調節 過的免疫反應(adaptive immune response)","C":"常見表現在 T cell 上的檢查點分子(immune checkpoint molecule)包含了 CLTA4,CD28,TCR,LAG3 以及 PD1 等","D":"BCG 灌注後受到刺激的 CD4 Helper T cell 會轉 化為 Th1 及 Th2 cells，產生較強的 Th1 response 會有較好的治療成效","E":"在膀胱癌的上皮細胞上，大約有 15~35%的病患 會有 PD-L1 的表現，表現愈高，腫瘤的惡性度 (tumor grade)愈高，預後也較差"},"answer":"B","reference":"(111) 參考資料(摘錄自)：第 12 版 Campbell Urology Chapter 61 p. 1333~1338","sourcePage":91},{"id":"3-045","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":45,"question":"下列何者不是用來治療轉移性泌尿道上皮癌的一線 or 二線化療藥物?","options":{"A":"MVAC(methotrexate, vinblastine, doxorubicin, cisplatin)","B":"GC(gemcitabine, cisplatin)","C":"Paclitaxel","D":"Docetaxel","E":"Mitomycin"},"answer":"E","reference":"(111) 參考資料(摘錄自)：第 12 版 Campbell Urology Chapter 137 p. 3127~3129","sourcePage":91},{"id":"3-046","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":46,"question":"根據 2017 年 TCGA(The Cancer Genome Atlas nomenclature)有關 muscle invasive bladder cancer 分子亞型之分類(molecular subtype of bladder cancer)，下列何種 subtype 不包含在內?","options":{"A":"Luminal-papillary","B":"Luminal-infiltrated","C":"Basal/Squamous","D":"TP53-like","E":"Neuronal"},"answer":"D","reference":"(111) 參考資料(摘錄自)：第 12 版 Campbell Urology Chapter 135 p. 3086~3087","sourcePage":92},{"id":"3-047","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":47,"question":"Erdafitinib(Balversa)是新一代治療轉移性泌尿道 上皮癌的口服藥物,下列針對 Erdafitinib 的敘述何 者是錯誤的?","options":{"A":"Erdafitinb 是一種酪氨酸激酶抑制劑(tyrosine kinase inbitor),作用在成纖維細胞生長因子 受體(fibroblast growth factor receptors， FGFR)上","B":"大約有 20%的 advanced urothelial carcinoma 病患有 FGFR 的突變，其中上泌尿道 urothelial carcinoma 表現的比例更高","C":"根據 BLC2001 study 的 long-term outcome，轉 移性泌尿道上皮癌病患的 objective response rate (ORR)約為 40%.","D":"常見的副作用包括皮膚及腸胃道症狀，特別要注 意的是低磷酸鹽血症(Hypophosphatemia)及眼 睛異常","E":"最常見需要治療 Grade 3~4 的副作用是口腔黏膜 炎(stomatitis)及低血鈉(hyponatraemia)"},"answer":"D","reference":"(111) 參考資料(摘錄自)： 1. N Engl J Med 2019;381:338-348, 2. Lancet Oncol . 2022 Feb;23(2):248-258.","sourcePage":92},{"id":"3-048","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":48,"question":"下列關於 Janus family of kinase，何者正確?","options":{"A":"JAK kinases 平時不會持續性的表現，僅在 cytokine receptor 被活化時，JAK kinases 才 會被活化","B":"JAK kinases 只調控一種特定的 cytokine receptor","C":"Cytokine 與 receptor 結合後，造成 dimerization，進一步使 JAK 被活化","D":"JAK kinases 與 STATs 的磷酸化無關","E":"JAK1 及 JAK2 的突變與 severe combined immunodeficiency 有關"},"answer":"C","reference":"(111) 參考資料(摘錄自)：(111) Campbell-Walsh 11th edition Review Chapter 18. P201.","sourcePage":92},{"id":"3-049","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":49,"question":"下列為 chromosomal rearrangement 與泌尿道腫瘤的 配對，何者正確?","options":{"A":"Fusion of BCR to Abl – Urothelial cancer","B":"TMPRSS2-ERG gene fusions - Renal cell carcinoma","C":"MiTF/TFE gene family translocation –Renal cell carcinoma","D":"Isochromosome 8q –Urothelial cancer","E":"Loss of chromosome 9 –Prostate cancer"},"answer":"C","reference":"(111) 參考資料(摘錄自)：(111) Campbell-Walsh 11th edition Review Chapter 19. P210","sourcePage":93},{"id":"3-050","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":50,"question":"關於 Von Hippel-Lindau syndrome (VHL)，下列敘 述何者錯誤?","options":{"A":"屬於自體顯性遺傳","B":"由位於 chromosome 2 的 tumor suppressor gene (VHL)突變所導致","C":"epididymal cyst 可能是其臨床表現之一","D":"腎臟外的表現還包含 pheochromocytoma, cerebellar hemangioblastomas, retinal angiomas","E":"renal cell carcinoma 不會出現在大多數的病 人身上"},"answer":"B","reference":"(111) 參考資料(摘錄自)：(111) Campbell-Walsh 11th edition Review Chapter 131. P1051.","sourcePage":93},{"id":"3-051","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":51,"question":"Cisplatin chemotherapy 對以下哪種膀胱腫瘤的效 果最差?","options":{"A":"High grade urothelial cancer","B":"Squamous cell cancer","C":"Micropapillary cancer","D":"Small cell cancer","E":"Adenocarcinoma"},"answer":"C","reference":"(111) 參考資料(摘錄自)：(111) Campbell-Walsh 11th edition Review Chapter 92. P794.","sourcePage":93},{"id":"3-052","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":52,"question":"對於單一小於 2 公分的 ureteral cancer, stage T3N0 病人的治療方法， 何者最不適合？","options":{"A":"endoscopic ablation of ureteral tumor","B":"renal autotransplantation","C":"ileal ureter","D":"radical nephroureterectomy","E":"segmental ureterectomy"},"answer":"A","reference":"(111) Campbell’s Urology 12th edition, chapter 99, page 2200-2216","sourcePage":93},{"id":"3-053","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":53,"question":"下列何者最不適合做 partial cystectomy?","options":{"A":"urachal cancer","B":"solitary tumor at bladder dome","C":"single diverticulum tumor","D":"MIBC with remote CIS","E":"NMIBC in diverticulum"},"answer":"D","reference":"(111) Campbell’s Urology 12th edition, chapter 137, page 3124","sourcePage":93},{"id":"3-054","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":54,"question":"何者不是 second TURBT 的條件?","options":{"A":"病理報告是 T1 with high grade","B":"incomplete resection of blader tumor","C":"腫瘤大於 2 公分","D":"與第一次間隔 2-6 週","E":"第一次 TURBT 沒有刮到肌肉層"},"answer":"C","reference":"(111) Campbell’s Urology 12th edition, chapter 136, page 3096","sourcePage":94},{"id":"3-055","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":55,"question":"關於 MIBC, stage T4aN0 的治療何者為非?","options":{"A":"建議 neoadjuvant chemotherapy","B":"建議 neoadjuvant radiation","C":"延持膀胱切除手術時間不應超過三個月","D":"Multimodality treatments 包括 TURBT, chemotherapy, 與 radiotherapy","E":"膀胱切除手術前的腸道準備與否，視病人情況決 定"},"answer":"B","reference":"(111) Campbell’s Urology 12th edition, chapter 137, page 3119","sourcePage":94},{"id":"3-056","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":56,"question":"非肌肉侵犯型膀胱癌(non-muscle invasive bladder cancer)中，與疾病進展相關最重要危的險因子為?","options":{"A":"期別(stage)","B":"分級(grade)","C":"原位癌(carcinoma in situ)","D":"淋巴血管侵犯(lymphovascular invasion)","E":"乳突狀或非乳突狀(papillary or non-papillary)"},"answer":"B","reference":"(111) 參考資料(摘錄自)：Campbell Walsh Wein Urology, 12th Edition, p3094","sourcePage":94},{"id":"3-057","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":57,"question":"目前 pembrolizumab 廣泛使用於泌尿腫瘤領域，截至 2022 年的 NCCN 指引中，以下關於 pembrolizumab 治 療的敘述何者錯誤？","options":{"A":"可考慮 Stage 2,3 亮細胞腎臟癌的病人術後使用 pembrolizumab 輔助治療(adjuvant treatment)","B":"Stage 4 或復發性亮細胞腎臟癌的病人，轉移處 若完全切除可考慮輔助性使用 pembrolizumab","C":"表淺性膀胱癌中，部分 BCG unresponsive 的病 人可以考慮 pembrolizumab 注射治療","D":"轉移性泌尿上皮癌，病人接受 Cisplatin 後接續 pembrolizumab 使用可增加存活率(overall survival)","E":"搭配 Axitinib 或 Lenvatinib，可用於 Stage 4 或復發性亮細胞腎臟癌的第一線治療"},"answer":"D","reference":"(111) 參考資料： NCCN Guidelines Version 2.2022, bladder cancer; NCCN Guidelines Version 1.2023, kidney cancer","sourcePage":94},{"id":"3-058","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":58,"question":"根據三期臨床試驗｢Javelin bladder 100｣，針對無 法手術切除之局部侵犯性或轉移性尿路上皮癌 (unresectable locally advanced or metastatic N urothelial cancer)，先給予 4-6 個療程(cycles) 之 gemcitabine 加上 cisplatin 或 carboplatin 的 化學治療後，再使用 avelumab 接續治療 (maintenance therapy)，對照組為 best supportive care，請問以下描述何者錯誤？","options":{"A":"整體病人中，使用 avelumab 的組別較對照組在 Overall survival 有顯著進步","B":"PD-L1 陽性的病人中，使用 avelumab 的組別較 對照組在 Overall survival 也有顯著進步","C":"Avelumab 組產生嚴重 (Grade 3 以上) 副作用的 病人將近一半(47.4%)，較對照組多","D":"雖然療效顯著，但 avelumab 組有約一成(11.9%) 病患因為副作用中斷治療","E":"收案條件為所有使用過一線含鉑 (Cisplatin-based)化學治療病人 (All-comer)，無論其治療反應為和"},"answer":"E","reference":"(111) 參考資料： Engl J Med 2020; 383:1218-1230","sourcePage":95},{"id":"3-059","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":59,"question":"關於乳突狀腎細胞癌(papillary renal cell carcinoma)，下列敘述何者正確？","options":{"A":"第一型(Type 1 papillary RCC) 通常侵犯性較 高，預後較差","B":"第二型(Type 2 papillary RCC) 預後優於亮細 胞癌(clear cell RCC) L","C":"部分第一型(Type 1 papillary RCC)和 Fumarate hydratase 基因突變有關","D":"第二型(Type 2 papillary RCC) 和 HLRCC syndrome (Hereditary leiomyomatosis and renal cell cancer)有關","E":"近期臨床究顯示 Sunitinib 治療效果優於 Cabozantinib"},"answer":"D","reference":"(111) 參考資料(摘錄自)：Campbell Walsh Wein Urology, 12th Edition, p2149-2152; ancet. 2021 Feb 20;397(10275):695-703.","sourcePage":95},{"id":"3-060","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":60,"question":"下列有關膀胱癌的分子亞型(molecular subtypes) 的敘述何者錯誤?","options":{"A":"UNC (University of North Carolina)將膀胱癌 分成管腔(luminal)跟基底(basal)兩大類。","B":"此外，UNC 分類中的 claudin-low 亞型，富含 RB1、EP300 及 NCOR1。","C":"MDA (MD Anderson Cancer Center)除了將膀胱 癌分成管腔(luminal)跟基底(basal)兩大類，並 獨立出 TP53-like 次分類。","D":"TP53-like 次分類與化療抗藥性及預後不良相 關。","E":"Lund 將膀胱癌分成 Uro A、Genomically unstable、Infiltrated 及 SCC-like 等四類。"},"answer":"E","reference":"(111) 參考資料(摘錄自)：第 12 版 Campbell: Chapter 135, page 3087. (E) 錯誤，應為五類。","sourcePage":95},{"id":"3-061","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":61,"question":"下列有關膀胱癌的敘述何者錯誤?","options":{"A":"2017 年的一項 TCGA (The Cancer Genome Atlas) 的研究確定了 5 種肌肉侵犯型膀胱癌(MIBC)的 亞型","B":"管腔(luminal)細胞，以高表現量的 FGFR3、 GATA3、KRT20 和 PPARG 突變為特徵","C":"基底鱗狀(basal-squamous)細胞以低表現量的 CK5、CK6、CK14 和高表現量的 FOXA1 為特徵","D":"此外，該研究確定了一部分患者有高突變負荷 (mutational load)，由 APOBEC-mediated mutagenesis 所驅動","E":"該 APOBEC 相關患者有 75%的 5 年存活率，遠高 於典型的 MIBC 患者"},"answer":"C","reference":"(111) 參考資料(摘錄自)：第 12 版 Campbell: Chapter 135, page 3087. (C) 錯誤，應為高表現量的 CK5、CK6、CK14 和低表現量 的 FOXA1 為特徵。","sourcePage":96},{"id":"3-062","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":62,"question":"下列何者非膀胱癌灌注 BCG (Bacille Calmette- Guérin)的絕對禁忌?","options":{"A":"免疫功能低下(immunocompromised)的患者","B":"肉眼可見之血尿(gross hematuria)","C":"輸尿管逆流(ureteral reflux)","D":"完全尿失禁(total incontinence)","E":"BCG 敗血症病史"},"answer":"C","reference":"(111) 參考資料(摘錄自)：第 12 版 Campbell: Chapter 136, page 3102. (C)沒有充分的證據。","sourcePage":96},{"id":"3-063","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":63,"question":"下列有關腎細胞癌(renal cell carcinoma，RCC)的 敘述何者錯誤?","options":{"A":"亮細胞(clear cell) RCC 跟 VHL gene (3p25) 突 變(mutation)有關","B":"乳突狀(papillary) RCC 第一型跟染色體三倍體 症(trisomy) 7 及 17 有關","C":"乳突狀(papillary) RCC 第二型起源於近端小管 (proximal tubule)，相較於乳突狀 RCC 第一型 預後較差","D":"難染性(chromophobe) RCC 跟 TPS3 及 PTEN 突變 有關","E":"腎髓樣癌(renal medullary carcinoma)起源於 集尿管(collecting duct)，預後佳"},"answer":"E","reference":"(111) 參考資料(摘錄自)：第 12 版 Campbell: Chapter 97, page 2149-2150. (E)錯誤，應為預後不佳。","sourcePage":96},{"id":"3-064","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":64,"question":"自然(Nature)期刊在 2021 年發表以循環腫瘤 DNA(circulating tumour DNA，ctDNA)作為泌尿上皮 癌輔助免疫治療(atezolizumab)之論文，下列敘述何 者錯誤?","options":{"A":"與觀察組相比，治療組(atezolizumab)的 ctDNA 陽性患者的無病存活率(disease-free survival)和總存活率(overall survival)有所 提高","B":"對於 ctDNA 陰性的患者，治療組(atezolizumab) 與觀察組之間的無病存活率或總存活率沒有差 異","C":"在第 6 週時，治療組(atezolizumab)的 ctDNA 清 除率高於觀察組(p=0.0204)","D":"對 ctDNA 陽性患者腫瘤的轉錄學分析 (transcriptomic analysis)顯示細胞週期 (cell-cycle)和角蛋白(keratin)的基因表現量 較低","E":"對於 ctDNA 陽性並接受 atezolizumab 治療的患 者，非復發與基底鱗狀(basal-squamous)細胞基 因特徵相關，而復發與血管生成(angiogenesis) 和纖維母細胞(fibroblast) TGFβ 特徵相關"},"answer":"D","reference":"(111) 參考資料(摘錄自)：Nature. 2021 Jul;595(7867):432-437. doi: 10.1038/s41586-021-03642- 9. (D)錯誤，應為表現量較高。","sourcePage":97},{"id":"3-065","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":65,"question":"常見的 VHL disease 臨床表徵包括那些?","options":{"A":"Angiomyolipoma, pheochromocytoma, fibrofolliculoma","B":"RCC, pheochromocytoma, fibrofolliculoma","C":"Angiomyolipoma, pheochromocytoma, hemangioblastoma","D":"RCC, thyroid carcinoma, leiomyoma","E":"RCC, pheochromocytoma, hemangioblastoma"},"answer":"E","reference":"(111) 參考資料：Campbell Urology 12th ed. Chapter 97, p.2141 ( Schmidt and Linehan, 2016 )","sourcePage":97},{"id":"3-066","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":66,"question":"在散發性 Sporadic Clear cell RCC 中最常被發現的 突變?","options":{"A":"Activation of the met proto-oncogene","B":"Activation of the VHL gene","C":"Inactivation of p53","D":"Inactivation of the VHL gene s","E":"Inactivation of genes on chromosome 9"},"answer":"D","reference":"(111) Campbell Urology 12th ed. Chapter 97, p.2152 Chromosome 3 alterations occur in more than 90% of clear cell RCCs, leading to mutation or inactivation of the VHL, in over 75% of poradic cases.","sourcePage":97},{"id":"3-067","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":67,"question":"對轉移性 Clear Cell RCC 病人使用第一線 VEGFR antagonist 後仍為 PD，下列何種處方可能有延長 progression-free survival 的效果?","options":{"A":"Bevacizumab","B":"Bevacizumab + IFN-a","C":"High-dose IL-2","D":"Axitinib","E":"Low-dose subcutaneous IL-2"},"answer":"D","reference":"(111) Campbell Urology 12th ed. Chapter 104, p.2336-2337","sourcePage":98},{"id":"3-068","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":68,"question":"根據 Campbell Urology 第 12 版，針對轉移性亮細胞 腎臟癌(metastatic clear-cell renal cell carcinoma, mccRCC)之二線治療的陳述，下列為非？","options":{"A":"Axitinib 相較於 Sorafenib，具有顯著更佳的 無惡化存活(progression-free survival, PFS)，但沒有顯著更佳的整體存活(overall survival, OS)","B":"Cabozantinib 相較於 Everolimus，具有顯著更 佳的 PFS，同時也有顯著更佳的 OS","C":"Nivolumab 相較於 Everolimus，沒有顯著更佳 的 PFS，但有顯著更佳的 OS","D":"Lenvatinib + Everolimus 相較於單用 Everolimus，具有顯著更佳的 PFS，同時也有顯 著更佳的 OS","E":"目前針對 mccRCC 之二線治療指引，皆係出於 phase III randomized controlled 臨床試驗的 結果"},"answer":"E","reference":"(111) 參考資料(摘錄自)：Campbell Urology 第 12 版 104 章 Lenvatinib + Everolimus vs. Lenvatinib vs. Everolimus 之臨床試驗僅為 phase II","sourcePage":98},{"id":"3-069","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":69,"question":"根據 Campbell Urology 第 12 版，肌肉侵犯型膀胱癌 (muscle-invasive bladder cancer)接受根除性膀胱 全切除後，有關後續上泌尿道復發的陳述，下列為 非？","options":{"A":"機率不高，只有大約 2-8%左右","B":"High grade 但 pTa-T1，則未列為危險因子","C":"原位癌 (carcinoma in situ)是危險因子","D":"遠端輸尿管的腫瘤，即使術中輸尿管切緣無腫瘤 侵犯，仍是危險因子","E":"最容易出現復發的期間，是術後 2-4 年，而非 2 年內"},"answer":"B","reference":"(111) 參考資料(摘錄自)：Campbell Urology 第 12 版 137 章 High grade 但 pTa-T1，仍為 危險因子","sourcePage":98},{"id":"3-070","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":70,"question":"根據 Campbell Urology 第 12 版，肌肉侵犯型膀胱癌 (muscle-invasive bladder cancer)接受根除性膀胱 全切除後，有關後續遠端尿道復發的陳述，下列何者 為非？","options":{"A":"初始腫瘤侵犯膀胱頸是危險因子","B":"初始腫瘤侵犯陰道是危險因子","C":"鼠蹊部(inguinal)淋巴侵犯是危險因子","D":"閉孔部(obturator)淋巴侵犯是危險因子","E":"在膀胱切除同時進行尿道全切除，目前仍未有定 論，因為大約只有 60%會尿道發現腫瘤"},"answer":"D","reference":"(111) 參考資料(摘錄自)：Campbell Urology 第 12 版 137 章 閉孔部(obturator)淋巴侵犯 未被列為危險因子","sourcePage":99},{"id":"3-071","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":71,"question":"根據 Campbell Urology 第 12 版，有關肌肉侵犯型膀 胱癌(muscle-invasive bladder cancer, MIBC)與轉 移型膀胱癌(metastatic bladder cancer, mBC)之全 身性治療，下列何者為非？","options":{"A":"對於 MIBC，無論 cN0 或 cN+，術前使用化療，具 備 level 1 的證據指出有助於整體存活","B":"對於 MIBC，術後使用化療，即便針對 pT3-4 或 N+，目前仍未具備 level 1 的證據指出有助於整 體存活","C":"對於 MIBC，術前使用 Platinum-based 化療，有 助於整體存活率，無論是 Cisplatin 或 Carboplatin","D":"對於 mBC，第一線單用癌症免疫治療，相較於使 用 Platinum-based 化療，並沒有顯著提升整體 存活，無論是 Cisplatin 或 Carboplatin","E":"對於 mBC，FDA 通過二線使用癌症免疫治療是基 於其整體存活率明顯優於 Taxane 類，因此 Taxane 藥物目前已不適合作為 mBC 的二線治療 選項"},"answer":"C","reference":"(111) 參考資料(摘錄自)：Campbell Urology 第 12 版 137 章 對於 MIBC 不適合用 Neo-adjuvant Cisplatin 者，Carboplatin 並非合適之 替代，因並無顯著優於未接受 Neo-adjuvant 化療","sourcePage":99},{"id":"3-072","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":72,"question":"根據 NCCN Guideline for kidney cancer 2023 第一 版，針對轉移性 clear cell type renal cell carcinoma，有關第二線治療的選項，下列何者未列 入「category 1」其中？","options":{"A":"Lenvatinib + Everolimus","B":"Axitinib","C":"Cabozantinib","D":"Tivozanib","E":"Nivolumab"},"answer":"A","reference":"(111) 參考資料(摘錄自)：NCCN guideline for kidney cancer 2023 第一版 詳見目前(111.7)最新版指引 所示","sourcePage":99},{"id":"3-073","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":73,"question":"有關於 2023 年 5 月刊登於 NEJM 的 COSMIC-313 trial，下列何者錯誤?","options":{"A":"參與病患皆為未曾接受治療的 advanced/metaststic clear cell type renal cell carcinoma","B":"研究族群針對 intermediate or poor risk group","C":"控制組的病人使用 nivolumab 和 ipilimumab","D":"實驗組相較於控制組並沒有更長的 progression-free survival","E":"最常見的 grade 3/4 adverse evens 為 elevated liver function enzyme"},"answer":"D","reference":"(112) 參考資料(摘錄自): N Engl J Med 2023; 388:1767-1778 DOI: 10.1056/NEJMoa2212851","sourcePage":100},{"id":"3-074","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":74,"question":"關於腎臟之血管肌肉脂肪瘤 (angiomyolipoma, AML)，下列敘述何者為非?","options":{"A":"為最常見之自發性後腹腔出血原因","B":"發生於遺傳性疾病 lymphangioleiomyomatosis (LAM)病患時，可使用 Everolimus 治療","C":"發生於遺傳性疾病 tuberous sclerosis 病患 時，為 TSC1 或 TSC2 基因產生突變","D":"若發現腫瘤內產生 3 mm 之血管瘤 (aneurysm)， 不管腫瘤大小應立即治療","E":"若病患產生自發性出血，治療首選為腎血管栓塞"},"answer":"D","reference":"(112) 參考資料(摘錄自): 解題說明請註明 1. Campbell-Walsh-Wein Urology 2. 12th edition, 2021 3. Chapter 96 p2125-2128","sourcePage":100},{"id":"3-075","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":75,"question":"以下關於 Von Hippel–Lindau syndrome 的敘述，何 者正確?","options":{"A":"Hereditary papillary RCC syndrome 與 VHL syndrome 皆為體隱性遺傳","B":"Type 1 VHL 相較於 type 2，有較高比例發生嗜 鉻細胞瘤","C":"腎細胞瘤為 VHL syndrome 患者最常見的死亡原 因","D":"VHL syndrome 常見的腫瘤包含腎細胞瘤、嗜鉻 細胞瘤、血管母細胞瘤、視網膜血管瘤，其共同 特色為高度核細胞質比(high N/C ratio)","E":"VHL syndrome 造成的腎細胞癌與 hepatocyte growth factor 過度表現有關"},"answer":"C","reference":"(112)參考資料(摘錄自): Campbell Walsh Urology, 12th ed. Ch97 p. 2141-2145 (A) Hereditary papillary RCC syndrome 與 VHL syndrome 的基因遺傳模式相 同(AD)。 (B) Type 2 較高 (C) 正確 (D) VHL syndrome 常見的腫 瘤包含腎細胞瘤、嗜鉻細胞 瘤、血管母細胞瘤、視網膜血 管瘤，其共同特色為高度血管 性。 (E) VHL syndrome 造成的腎 細胞癌與 VEGF 過度表現有 關。","sourcePage":100},{"id":"3-076","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":76,"question":"有關於體染色體顯性多囊性腎臟病(autosomal dominant polycystic kidney disease, ADPKD)的敍 述, 何者正確?","options":{"A":"ADPKD 的病人需定期追蹤影像檢查因為有 7%的 病人會發展成 RCC","B":"ADPKD 的囊腫起源於近曲小管","C":"ADPKD 囊腫的增加與腎臟透析的時間成正比, 囊 腫的發生與腎功能下降有關","D":"ADPKD 是遺傳性腎臟囊腫疾病與纖毛功能缺陷 相關, 主要是 polycystin-1 (chromosome 16) 和 polycystin-2 (chromosome 4) 的變異相關","E":"ADPKD 常合併肝臟囊腫和胰臟囊腫, 診斷標準是 雙側至少各兩顆腎臟囊腫合併其他器官囊腫"},"answer":"D","reference":"(112) 參考資料(摘錄自): 第 12 版 Campbell Ch. 96 P. 2121-2123、第 19 版 Smith Ch. 33 P. 547-549 A,B: ADPKD 的起源與 Acquired cystic kidney disease (ACKD)不同, 後者為 近曲小管, 與 clear cell RCC 相似因而有惡性傾向。 C.ADKPD 的成長是每年指數 級增加, 反之 ACKD 與洗腎時 間長短有關, 洗越久囊腫會 越長越大和多.E, ADPKD 的診 斷是根據診斷時的年齡和腎 囊腫的表現而確定的,不需合 併其他器官的囊臐。","sourcePage":101},{"id":"3-077","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":77,"question":"關於泌尿上皮癌症後線用藥 Enfortumab Vedotin 之 敘述，何者錯誤?","options":{"A":"Nectin-4 是一種高度表現在泌尿道上皮癌的 細胞黏著分子(cell-adhesion molecule)，與腫 瘤細胞成長跟分化相關","B":"Enfortumab vedotin 是一種針對 nectin-4 的 抗體藥物複合體(antibody drug conjugate, ADC)","C":"Enfortumab vedotin 是由人類多株抗體(human polyclonal antibody)和微管蛋白聚合抑制劑 (monomethyl auristatin E, MMAE)構成","D":"EV301 收錄的條件為局部侵犯性或轉移的泌尿 道上皮癌的病人，使用過鉑金類化療藥物和 PD-1 / PD-L1 抑制劑，仍然惡化的病人","E":"常見的副作用為掉髮、周邊感覺神經病變、搔 癢、疲倦、高血鈣"},"answer":"C","reference":"(112) 參考資料(摘錄自): 參考資料(摘錄自)： N Engl J Med. 2021 Mar 25;384(12):1125-1135. (C) 單株(monoclonal)","sourcePage":101},{"id":"3-078","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":78,"question":"有關 COSMIC-313 trial，下列敘述何者錯誤？","options":{"A":"為一個 phase 3，double-blind trial，收錄了 尚未治療過的 IMDC intermediate or poor risk advanced clear-cell renal-cell carcinoma， experimental group 接受了 cabozantinib + nivolumab + ipilimumab)治療，control group 接受 placebo + nivolumab + ipilimumab 的 outcomes","B":"Primary endpoint 為 progression-free survival(PFS)，secondary endpoint 為 overall survival(OS)","C":"Cabozantinib + nivolumab + ipilimumab 組別 比 placebo + nivolumab + ipilimumab 有比較 好的 12-month PFS(hazard ratio = 0.73)","D":"在 Subgroup analysis 當中，cabozantinib + nivolumab + ipilimumab 無論 IMDC risk 是 intermediate 還是 poor risk 都有顯著較好的 PFS","E":"Cabozantinib + nivolumab + ipilimumab 組別 當中，有高達 79%發生了 grade 3 或 4 的 adverse events，其中最常見的 grade 3 或 4 的 adverse events 為肝功能異常，且大約有 91%的病人因為 adverse events 而調整藥物劑量"},"answer":"D","reference":"(112) 參考資料(摘錄自): N Engl J Med 2023; 388:1767-1778 詳解： (D)Subgroup analysis 中 caboznatinib + nivolumab + ipilimumab 只有 intermediate risk group 有 顯著較好的 PFS，poor risk 沒有。 (A) (B) (C) (E)正確","sourcePage":101},{"id":"3-079","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":79,"question":"以下關於 bladder urothelial carcinoma 的敘述， 何者正確？","options":{"A":"TUR-BT 造成的膀胱穿孔一般以 intraperitoneal 為主","B":"BCG (Bacillus Calmette-Guérin) intravesicle instillation 是藉由 INF-ɤ 、 IL-2 和 IL-6 調節，增強 T-helper type 1 的腫 瘤毒殺表現","C":"根除性膀胱切除術術後 5 年的尿道復發率約為 8%","D":"為及早發現肺部轉移，建議所有膀胱癌病人都應 常規追蹤胸部影像檢查","E":"美國 FDA 已核可 Pembrolizumab 用於不適合手術 的 BCG-unresponsive, high risk NMIBC"},"answer":"C","reference":"(112)/ 參考資料(摘錄自): Campbell Walsh Urology, 12th ed. Ch136 (A) TUR-BT 造成的膀胱穿孔 一般以 extaperitoneal 為主 (B) BCG intravesicle instillation 是藉由 INF- ɤ 、IL-2 和 IL-12 調節，增 強 T-helper type 1 的腫瘤毒 殺表現。 (C) 正確 (D) 為及早發現 bladder UC 的肺部轉移，建議 MIBC 病人 都應常規追蹤胸部 X-ray。 (E) 美國 FDA 已核可 Pembrolizumab 用於 BCG-unresponsive, high risk NMIBC with CIS。","sourcePage":102},{"id":"3-080","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":80,"question":"一位 62 歲男性因血尿來就醫, 膀胱鏡發現腫瘤在膀 胱頂部 (dome)，經尿道切片 (transurethral biopsy) 的病理報告顯示肌肉浸潤性尿路上皮癌 (muscle-invasive urothelial carcinoma)和小細胞 癌 (small cell carcinoma),影像顯示沒有轉移。請 問下一步的處置是甚麼？","options":{"A":"膀胱灌注卡介苗治療","B":"部分膀胱切除術 (partial cystectomy)","C":"根治性膀胱前列腺切除術 (radical cystoprostatectomy)","D":"體外放射治療 (external beam radiotherapy)","E":"化學放射治療(chemoradiation therapy)"},"answer":"E","reference":"(112) 參考資料(摘錄自): 第 12 版 Campbell Ch. 135 P. 3087-3090 說明: 膀胱小細胞癌應作為 轉移性疾病考慮和治療，即使 沒有膀胱外疾病的影像證 據。膀胱小細胞癌對化療非常 敏感，主要的治療方式是放化 療(chemoradiation therapy)或化療後進行膀胱 切除術","sourcePage":102},{"id":"3-081","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":81,"question":"下列關於良性腎臟腫瘤的描述何者錯誤？","options":{"A":"根據 EXIST-2 study 的結果，Everolimus 可以 使用在 TSC-，LAM-associated AML 的患者上","B":"Metanephric adenoma 在染色下呈現 WT1(+), CD57 (+), AMACR(-)","C":"Oncocytoma 可能有腎靜脈侵犯的表現","D":"發生在腎臟的 Leiomyoma 最常見的位置在 Renal capsule","E":"因 Reninoma 引起高血壓的患者在手術切除後都 能改善"},"answer":"E","reference":"(112)/ 參考資料(摘錄自): Campbell Urology, 12th, p2123, 2128, 2131, 2132","sourcePage":103},{"id":"3-082","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":82,"question":"47 歲女性來評估腎囊腫疾病 (renal cyst disease), 以下哪個符合體染色體顯性多囊性腎臟病 (autosomal dominant polycystic kidney disease)？","options":{"A":"每個腎臟各有一顆 Bosniak I 的簡單腎囊腫 (simple renal cyst)","B":"每個腎臟各有兩顆 Bosniak I 的簡單腎囊腫","C":"右腎有一顆 Bosniak I 的簡單腎囊腫 (simple renal cyst) 及兩顆肝囊腫 (hepatic cysts)","D":"左腎有一顆 Bosniak III 的複雜腎囊腫 (complex renal cyst) 和右腎一顆 Bosnisk I 簡單腎囊腫","E":"右腎有兩顆 Bosniak I 簡單腎囊腫"},"answer":"B","reference":"(112) 參考資料(摘錄自): 第 12 版 Campbell Ch. 96 P. 2121-2123、第 19 版 Smith Ch. 33 P. 547-549. 說明: 在 30 歲至 59 歲的病人 中, 影像上要符合每顆腎臟 各有 2 顆囊腫。","sourcePage":103},{"id":"3-083","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":83,"question":"下列有關於膀胱泌尿上皮癌的分子生物學 (molecular biology)敘述何者錯誤?","options":{"A":"FGFR3 mutation 之 isoform 於 bladder cancer cell 中為 IIIc","B":"CDKN2 和 RB1 的 inactivation 在 muscle-invasive bladder carcinoma (MIBC) 中相當常見","C":"膀胱原位癌 (CIS)不會有 FGFR3 mutation","D":"FGFR3 mutation 模式為 point mutation","E":"RAS mutation 在 NMIBC 發生率高於 MIBC"},"answer":"E","reference":"(112)/3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell-Walsh 12th edition, Chapter 135, P. 3083-3086 (E) 應為相同","sourcePage":103},{"id":"3-084","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":84,"question":"下列有關於泌尿上皮癌 (urothelial carcinoma)的 敘述何者正確?","options":{"A":"Smoking 會造成 N-acetyltransferase 2 (NAT2) mutation","B":"經產婦有較低罹患膀胱癌的風險","C":"Inverted papilloma 沒有惡性可能","D":"Ureteral tumor 以 upper ureter 最多、middle ureter 次之","E":"Panurothelial disease 指的是疾病侵犯膀胱和 一個膀胱外泌尿道"},"answer":"B","reference":"(112)/3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell-Walsh 12th edition, Chapter 98, 135 (A) P. 3076 (B) P. 3073 (C) P. 2188 (D) P. 2194 (E) P. 2194","sourcePage":104},{"id":"3-085","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":85,"question":"Angiomyolipoma (AML)為一常見的腎臟腫瘤，以下敘 述何者正確?","options":{"A":"India ink artifact 是指 AML 的 MRI imaging finding","B":"有 15%的病人會有 Beckwith-Wiedemann syndrome，造成 spontaneous retroperitoneal hemorrhage","C":"Tuberous sclerosis complex (TSC)多為體染色 體隱性遺傳(Autosomal recessive)","D":"育齡女性(Child-bearing age)如有 AML，不建 議做預防性介入","E":"AML 的免疫染色(immunohistochemical stains) 常有 HMB-45 和 CK-7 陽性反應"},"answer":"A","reference":"(112)/3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell-Walsh 12th edition, Chapter 96 P. 2125-2127","sourcePage":104},{"id":"3-086","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":86,"question":"下列關於腎臟腫瘤的描述何者錯誤?","options":{"A":"Collecting Duct RCC 會表現 Ulex europaeus agglutinin-1 (UEA-1)","B":"Clear cell RCC 相較其他類型的 RCC 對 VEGF 標 靶治療、檢查點抑制劑(checkpoint inhibitor) 等治療效果較好","C":"Renal Medullary Carcinoma 常在診斷時就已局 部侵犯和轉移","D":"Chromophobe RCC 約有 40%的患者有 multicentricity 的表現","E":"Type 1 Papillary RCC 常有 Y 染色體缺失的表 現"},"answer":"D","reference":"(112)/ 3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell Urology, 12th, p2152, 2154, 2155","sourcePage":104},{"id":"3-087","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":87,"question":"下列關於泌尿上皮癌治療的敘述何者錯誤?","options":{"A":"針對局部侵襲(locally advance)或轉移之上泌 尿道泌尿上皮癌，Erdafitinib 被 FDA 核可作為 有 FGFR1, FGFR2 基因變化患者的第二線治療","B":"Sacituzumab govitecan 在 TROPHY-U-01 試驗中 常見的副作用有嗜中性球低下和腹瀉","C":"針對局部侵襲上泌尿道泌尿上皮癌的患者在腎 臟輸尿管切除術後 90 天內接受 Gemcitabine–platinum 化學治療可以改善無病 存活率( disease-free survival )","D":"Nivolumab 可以做為術前使用過鉑金類化療 (platinum-based neoadjuvant therapy)患者的 輔助治療(adjuvant therapy)","E":"Pembrolizumab 加上 enfortumab vedotin-ejfv 可以做為局部侵襲或轉移泌尿上皮癌且不適合 cisplatin 治療的患者使用"},"answer":"A","reference":"(112)/ 3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): 1. J Clin Oncol. 2021 Aug 1;39(22):2474-2485 2. NCCN guideline on Bladder Cancer 2023 Lancet. 2020 Apr 18;395(10232):1268-1277","sourcePage":105},{"id":"3-088","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":88,"question":"下列關於膀胱腫瘤的敘述何者錯誤?","options":{"A":"儘管 Papilloma 是良性腫瘤，但仍會有 fibroblast growth factor receptor-3 (FGFR3) 突變的表現","B":"Nephrogenic adenoma 是由創傷、手術或異物長 期刺激形成，切除後很常再復發","C":"Urothelial hyperplasia 和 Reactive atypia 都被視為是 Precursor malignant lesions","D":"Cystitis cystica 及 cystitis glandularis 皆 和 Von Brunn nests 的增生有關","E":"Leukoplakia 已不再被視為癌前病變 (premalignant)"},"answer":"B","reference":"(112)/ 3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell Urology, 12th, p3081, 3082,","sourcePage":105},{"id":"3-089","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":89,"question":"下列關於膀胱腫瘤及其治療的敘述何者錯誤?","options":{"A":"根據 AUA risk stratification, 一年內復發、 單一小於三公分的 low grade Ta 膀胱癌是 intermediate risk","B":"針對有淋巴轉移的臍尿管腫瘤(urachal carcinoma)可以考慮 FOLFOX 等用於大腸直腸癌 的化療藥物組合","C":"術後立即接受膀胱化學治療灌注(immediate postoperative intravesical chemotherapy) 能降低五年疾病進展機會(risk of progression)","D":"若膀胱癌有 Micropapillary, plasmacytoid 等 組織變化表現，有較大風險進展成肌肉侵犯膀胱 癌","E":"單一、體積小且非 carcinoma in situ(CIS)的 肌肉侵犯腫瘤接受部分膀胱切除和根除性膀胱 切除的結果相近"},"answer":"C","reference":"(112)/ 3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell Urology, 12th, p3143 NCCN guideline on Bladder Cancer 2023","sourcePage":105},{"id":"3-090","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":90,"question":"下列關於腎臟囊腫之敘述，何者為非？","options":{"A":"於電腦斷層檢查發現 4 公分之 hyperdense lesion，歸類為 Bosniak II 之腎臟囊腫","B":"於電腦斷層檢查發現囊腫壁有結節性鈣化 (nodular calcification)，歸類為 Bosniak IIF 之腎臟囊腫","C":"於電腦斷層檢查發現 Bosniak III 之腎臟囊腫， 惡性腫瘤之機率為 50%","D":"尿毒症病患產生 acquired renal cystic disease (ARCD)，接受腎臟移植術後囊腫常會縮 小","E":"腎竇囊腫 (renal sinus cyst)最常見原因為淋 巴管擴張"},"answer":"A","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): 解題說明請註明 1. Campbell-Walsh-Wein Urology 2. 12th edition, 2021 3. Chapter 39, 96 p772-775, p2121-2123","sourcePage":106},{"id":"3-091","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":91,"question":"遺傳性疾病 Birt-Hogg-Dube (BHD) Syndrome 產生之 腎腫瘤最常見之細胞型態為何？","options":{"A":"angiomyolipoma","B":"chromophobe renal cell carcinoma","C":"papillary renal cell carcinoma","D":"clear cell renal cell carcinoma","E":"lymphoma"},"answer":"B","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): 解題說明請註明 1. Campbell-Walsh-Wein Urology 2. 12th edition, 2021 3. Chapter 97 p2133-2145","sourcePage":106},{"id":"3-092","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":92,"question":"下列哪一種遺傳性疾病為上泌尿道尿路上皮癌 (upper tract urothelial carcinoma, UTUC)之好發 族群？","options":{"A":"Tuberous sclerosis","B":"Zinner syndrome","C":"Birt-Hogg-Dube (BHD) syndrome","D":"Lynch syndrome","E":"von Hippel-Lindau disease"},"answer":"D","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): 解題說明請註明 1. Campbell-Walsh-Wein Urology 2. 12th edition, 2021 3. Chapter 98 p2185","sourcePage":106},{"id":"3-093","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":93,"question":"下列何種膀胱腫瘤病理化驗常呈現 Von Brunn nests？","options":{"A":"Inverted papilloma","B":"Cystitis cystica","C":"Leukoplakia","D":"Nephrogenic adenoma","E":"Bladder paraganglioma"},"answer":"B","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): 解題說明請註明 1. Campbell-Walsh-Wein Urology 2. 12th edition, 2021 3. Chapter 135 p3082","sourcePage":107},{"id":"3-094","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":94,"question":"關於膀胱泌尿上皮癌的診斷與治療，下列何者正 確？","options":{"A":"Nadofaragene firadenovec 是一種重組腺病毒 又名 rAd-IFNa/Syn3，能將 interferon alfa-2a cDNA 送入膀胱上皮細胞達到抗癌效果","B":"根據 NCCN guideline 建議，clinical stage IIIB(含)以上患者建議進行分子基因測試，其包 含 FGFR2 或 FGFR3 的變異分析","C":"Keynote 361 trial 顯示，Pembrolizumab 加上 chemotherapy 作為第一線治療轉移性泌尿上皮 癌，相較單用 chemotherapy 有顯著較好的 progression-free survival，平均能延長 2.7 個月的 survival","D":"Sacituzumab govitecan 是一種抗體-藥物的偶 聯物，可以聯合 anti-Trop-1 與 SN-38 達到抗癌 效果，但在 TROPHY-U-01trial 中高達 35%患者 出現 neutropenia","E":"EV-103 trial 為一 phase 3 randomized controlled trial，支持 Stage IV 且 cisplatin-ineligible 患者一線併用 Pembrolizumab 與 enfortumab vedotin-ejfv， median overall survival (OS)為 26.1 個月"},"answer":"B","reference":"(112)/3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): NCCN guideline for bladder cancer, version 3, 2023 詳解： (A) 為interferon alfa-1b cDNA (B) 正確 (C) Did NOT significantly improve PFS (D) anti-Trop-2 E: EV-103 為 phase 2 trial","sourcePage":107},{"id":"3-095","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":95,"question":"下列關於上泌尿道泌尿上皮癌(upper urinary tract urothelial carcinoma, UTUC)的敘述何者正確？","options":{"A":"與 high-grade bladder UC 相比，high-grade UTUC 較常發現有 FGFR3、CDKN2B 以及 HRAS 的 mutation","B":"Hereditary nonpolyposis colorectal carcinoma (HNPCC) syndrome 與 familial/hereditary UTUC 有關，此類病人有 較高得到大腸癌，乳癌，腎臟癌的機會","C":"HNPCC syndrome 的病人在 mismatch repair endonuclease PMS2、MutS protein homolog 1、 MutS protein homolog 2、MutS protein homolog 6 上常有突變","D":"依據 EUA guideline 建議，UTUC 病患若有一等 親在 55 歲得到子宮內膜癌，則建議病患要做 hereditary UTUC 基因檢查","E":"臨床上可用 Rotterdam criteria 來幫助判斷病 患是否有 HNPCC syndrome"},"answer":"A","reference":"(112)/3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell 12ed, Chapter 98, page 2185-2187 EAU guideline for upper urinary tract urothelial carcinoma, 2023 詳解： (A) 正確 (B) 無乳癌，腎臟癌 (C) 為 MLH1 (MutL homolog 1)不是 MutS protein homolog 1 (D) 一等親<50 歲才要 Amsterdam criteria","sourcePage":107},{"id":"3-096","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":96,"question":"關於 Hereditary leiomyomatosis and renal cell carcinoma (HLRCC) syndrome 的敘述，下列何者正 確？","options":{"A":"HLRCC 的腎腫瘤常為多顆且侵犯雙側腎臟","B":"為抑癌 fumarate hydratase (FH) 基因缺失導 致","C":"為體染色體隱性(autosomal recessive, AR)遺 傳","D":"女病患最常出現腫瘤處依序為：子宮>腎臟>皮膚","E":"NCCN guideline 建議治療 HLRCC 轉移患者可使 用 Everolimus + Bevacizumab"},"answer":"B","reference":"(112)/3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell 12ed, chapter 11, page 2144 NCCN for kidney cancer, version 4, 2023 (HERED-RCC-D) 詳解： (A) 常為單顆且單側 (B) 正確 (C) 為體染色體顯性遺傳 (D) 最常出現在皮膚及子宮 平滑肌瘤，腎臟 only 15% to 20% Erlotinib + bevacizumab， There are no specific FDA-approved therapies for HLRCC. Treatment with erlotinib plus bevacizumab demonstrated benefit in patients with metastatic RCC from HLRCC.","sourcePage":108},{"id":"3-097","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":97,"question":"根據 NCCN guideline 建議，針對 ureter urothelial cell carcinoma 做完 radical nephroureterectomy 或者 nephron-sparing surgery 的病人術後 adjuvant treatment 以及 follow up 的建議下列何者正確？","options":{"A":"接受 nephron-sparing surgery 病患，術後病理 報告為 pT0 或 PT1 病人，僅需定期追蹤膀胱鏡、 urine cytology、及 Abdomen + pelvis CT/MRI","B":"接受 radical nephroureterectomy 病患，若術 前無接受 neoadjuvant platinum-based chemotherapy，且術後病理報告為 pT3，則建議 與病患討論加做 adjuvant platinum-based chemotherapy，或 adjuvant immunotherapy (pembrolizumab)","C":"接受 radical nephroureterectomy 病患，若術 前已接受 neoadjuvant platinum-based chemotherapy，且術後病理報告為 ypT2，則建 議與病患討論加做 adjuvant immunotherapy (nivolumab)","D":"接受 radical nephroureterectomy 病患，若術 前已接受 neoadjuvant platinum-based chemotherapy，術後病裡報告為 ypN+，則建議 與病患討論加做 adjuvant chemotherapy","E":"接受 radical nephroureterectomy 病患，若術 前無接受 neoadjuvant platinum-based chemotherapy，術後病理報告為 pT2，則建議與 病患討論加做 adjuvant platinum-based chemotherapy 或 immunotherapy"},"answer":"C","reference":"(112)/3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): NCCN guideline for bladder cancer, version 3, 2023 詳解： (A) Nephro-sparing surgery 術後需做輸尿管 鏡檢查 (B) NCCN 建議之 adjuvant immunotherapy 藥物為 nivolumab (C) 正確 (D) 術前已做 neoadjuvant chemotherapy 術後建議 加做 nivolumab 治療 無接受 neoadjuvant chemotherapy 之 pT2 病患， 不建議加做輔助性治療","sourcePage":108},{"id":"3-098","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":98,"question":"以下關於 upper urinary tract urothelial carcinoma(UTUC)的敘述，何者正確?","options":{"A":"吸菸為 UTUC 的重要危險因子，戒菸 10 年將有助 於降低 30-50%的發生機率","B":"根據 POUT trial，advance UTUC 患者術後接受 adjuvant platinum-based chemotherapy，在 disease free survival 和 overall survival 都有統計學上的差異","C":"CT 對於 UTUC TNM stage 的分期準確率大於五成","D":"Tumor grade 是 UTUC 術後最重要的單一預後因 子","E":"Inverted papilloma 雖是良性病灶，但潛藏的 惡性機率在膀胱高於輸尿管"},"answer":"C","reference":"(112)/3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell Walsh Urology, 12th ed. Ch98/99 p.2187-2189 p. 2199-2225 POUT trail (A) 吸菸為 UTUC 的重要危險 因子，戒菸 10 年將有助於降 低 60-70%的發生機率。 (B) 根據 POUT trial， advance UTUC 患者術後接受 adjuvant platinum-based chemotherapy，在 disease free survival 都有統計學上 的差異。OS 無 (C) CT 對於 UTUC TNM stage 的分期準確率大於五成。(V, 60%) (D) Tumor “stage”是 UTUC 術後最重要的單一預後因子。 (E) Inverted papilloma 雖 是良性病灶，但潛藏的惡性機 率在輸尿管(18%)>膀胱 (<1%)。","sourcePage":109},{"id":"3-099","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":99,"question":"以下關於 advanced renal cell carcinoma(RCC)的 敘述，何者正確?","options":{"A":"對於轉移性的 clear cell RCC 患者進行 cytoreductive nephrectomy，有高機率在轉移 部位發生 true spontaneous regression","B":"腫瘤>10cm、組織惡性度高、分期較嚴重及 sarcomatoid 分化，皆可能造成腫瘤組織中 PD-1 陽性淋巴球的表現下降","C":"使用 Cabozantinib 治療時，可能造成疲倦、腹 瀉、Hand-foot syndrome 的副作用，但大部分 患者可藉由降低劑量持續治療","D":"腫瘤>10cm 發生 direct invasion 的機率顯著高 於 metastasis，術後病理切片約半數以上的可 見直接侵襲的證據","E":"根除性腎臟切除術同時合併淋巴切除術，不建議 常規執行，雖然在試驗中能改善 progression-free survival，但在低風險族群 的實際淋巴轉移率很低"},"answer":"C","reference":"(112)/3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell Walsh Urology, 12th ed. Ch104 p.2324-2346 (A) 對於轉移性的 clear cell RCC 患者進行 cytoreductive nephrectomy，有低機率(<1%) 在轉移部位發生 true spontaneous regression。 (B) 大顆腫瘤、組織惡性度 高、分期較嚴重及 sarcomatoid 分化，皆會造成 腫瘤組織中 PD-1 陽性淋巴球 的表現上升。 (C) 正確 (D) 大顆的腫瘤發生 metastasis 的機率顯著高於 direct invasion，術後病理 切片只有 40%在疑似 direct invasion RCC 上有直接侵襲 的證據。 (E) 根除性腎臟切除術同時 合併淋巴切除術，不建議常規 執行，不能改善 progression-free survival，因在低風險族群的 實際淋巴轉移率很低。P.2177","sourcePage":110},{"id":"3-100","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":100,"question":"以下關於 bladder cancer 的敘述，何者正確?","options":{"A":"PTEN、RB 及 FGFR-3 是 bladder urothelial carcinoma in situ 常見的基因突變。","B":"Erdafitinib 已被 FDA 核可用於具 FGFR 2/3 突 變的轉移性膀胱癌治療，是一種 AMP-competitive inhibitor","C":"Leiomyosarcoma 是膀胱最常見的肉瘤型態，男 女發生比約 2:1，通常與吸菸關連不大","D":"Pyranzinamide 可用於治療因 BCG instillation 所造成的器官感染","E":"膀胱的 Small cell carcinoma 多為轉移性病 灶，若原發部位無法明確的情況下，則建議只進 行局部放射線治療"},"answer":"C","reference":"(112)/3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell Walsh Urology, 12th ed. Ch135 p.3090 (A) PTEN、RB 及 TP53 是 bladder urothelial carcinoma in situ 常見的基 因突變。 (B) Erdafitinib 已被 FDA 核 可用於具 FGFR 2/3 突變的轉 移性膀胱癌治療，是一種 ADP-competitive inhibitor (C) 正確 (D) Pyranzinamide 可用於 治療因 BCG instillation 所 造成的器官感染。 (E) 膀胱的 Small cell carcinoma 多為轉移性病 灶，若原發部位無法明確的情 況下，仍建議進行 chemoradiation 的系統性治 療。","sourcePage":110},{"id":"3-101","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":101,"question":"有關 Belzutifan 用於腎臟惡性腫瘤的治療，下列何 者錯誤？","options":{"A":"Belzutifan 又稱 MK-6482，為第二代 Hypoxia-inducible factor (HIF)-2α 的抑制 劑","B":"目前美國 FDA 核准 Belzutifan 於腎臟惡性腫瘤 的適應症，只有 Von-Hipple Lindau(VHL) disease-associated renal cell carcinoma(RCC)，其他腎臟惡性腫瘤並不適用","C":"根據 NCCN guideline for Kidney cancer 2023 第四版，Belzutifan 可以使用於患有 VHL-associated RCC 且不需要立即手術的病人 使用","D":"根據 LITESPARK-004 這個 phase 2， open-label，single-arm trial 於 2021 年發表 在 NEJM 的文章顯示，Belzutifan 用於 VHL-associated RCC 的患者，經過中位數 21.8 個月後的追蹤，objective response rate 為 49%","E":"Belzutifan 最常見的副作用為 skin rash 以及 hepatotoxicity"},"answer":"E","reference":"(112)/3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): N Engl J Med 2021; 385:2036-2046 NCCN guideline for kidney cancer, Version 4.2023 詳解： (E) 最常見的副作用為 anemia、fatigue 以及 dyspnea","sourcePage":111},{"id":"3-102","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":102,"question":"關於 renal cell carcinoma (RCC)之描述，何者正 確？","options":{"A":"目前已知 RCC 之危險因子包括抽菸、肥胖、高血 壓、接觸 aromatic hydrocarbons","B":"遺傳性 clear cell RCC 與 von Hippel-Lindau )VHL 基因突變有關，通常為發 生於單側腎臟之單一腫瘤","C":"Type 1 papillary RCC 與 fumarate hydratase 突變有關，預後較 Type 2 佳","D":"Hereditary leiomyomatosis and renal cell carcinoma (HLRCC)常見 type 2 papillary RCC， 較具侵犯性需積極手術切除","E":"Tuberous sclerosis complex (TCS)除與 AML 有 關也有機會形成 RCC，但 RCC 之形成與 mTOR pathway 無關"},"answer":"D","reference":"(112)/3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell 12ed, Chapter 97, page 2140-2145 詳解： (A) 接觸化學物質尚未建立 關 (B) bilateral and multifocal (C) FH 為 type 2 pRCC (D) 正確 TSC1/TSC2 complex downregulate mTOR pathway","sourcePage":111},{"id":"3-103","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":103,"question":"關於已轉移之 Upper urinary tract urothelial carcinoma 病患的 systematic treatment 建議，下 列何者正確？","options":{"A":"針對 cisplatin eligible 病患若第一線選擇接 受 gemcitabine and cisplatin，治療後如果達 到 complete response，只需觀察無需加做其他 治療","B":"針對 cisplatin eligible 病患若第一線選擇接 受 DDMVAC with growth factor support，治療 後如果達到 partial response，只需觀察無需 加做其他治療","C":"針對 cisplatin ineligible 病患若第一線選擇 接受 pembrolizumab，治療後如果 progression disease，第二線藥物在病患為 FGFR negative 的情況下，可考慮使用 Enfortumab vedotin-ejfv 治療","D":"針對 cisplatin eligible 病患若第一線選擇接 受 gemcitabine and cisplatin，治療後如果 progression disease，第二線藥物在病患為 PD-L1 positive 的情況之下，Atezolizumab 為 preferred regimen 其中之一","E":"針對 cisplatin ineligible 病患若第一線選擇 接受 pembrolizumab，治療後如果 progression disease，第二線藥物不可選擇 Gemcitabine and carboplatin 做治療"},"answer":"C","reference":"(112)/3. 腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell 12ed, Chapter 99, page 2222-2224 NCCN guideline for bladder cancer, Version 2.2023 詳解 (A) (B) 應加做 avelumab maintenance therapy (C) 正確, Erdafitnib 才不 行 (D) Atezolizumab 只在第一 線為 preferred regimen (E) cisplatin ineligible chemo naïve 病患二線可選擇 gemcitabine and carboplatin","sourcePage":112},{"id":"3-104","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":104,"question":"關於膀胱癌中 Nadofaragene firadenovec 治療，下 列何者為非？","options":{"A":"是針對 BCG-unresponsive 之非肌肉侵犯型膀胱 癌(non-muscle invasive bladder cancer)的治 療選擇之一","B":"其原理為藉由腺病毒(adenovirus)作為載體 (vector)，將一段 human interferon alfa-2a gene 植入尿路上皮","C":"給藥方式為 75 mL 膀胱內灌注，若追蹤無 high-grade recurrence 則每三個月重複給予","D":"12-month complete response rate 整體為 30.5%，其中無 Tis 者有更好的治療效果","E":"治療引起的不良反應絕大多數為 Grade 1-2 的輕 微症狀，如疲倦、膀胱痙攣等"},"answer":"B","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): NCCN Guidelines Version 3.2023 Bladder Cancer Lancet Oncol. 2021 Jan;22(1):107-117 (B)應為 interferon alfa-2b","sourcePage":113},{"id":"3-105","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":105,"question":"關於轉移性腎細胞癌的治療，下列何者不正確？","options":{"A":"Low risk clear cell type 的 preferred regimens 皆為 TKI + IO 併用","B":"Intermediate/high risk clear cell type 的 preferred regimens 亦包括 IO + IO 併用","C":"Sunitinib 為治療 non-clear cell type 的 preferred regimen","D":"對於已使用過 IO 但無效的 clear cell type， preferred regimen 為 cabozantinib","E":"單獨使用 Everolimus 不是 clear cell type 的 一線治療選項"},"answer":"D","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell Walsh Wein Urology, 12th Edition p. 2329-2343 NCCN Guidelines Version 4.2023 Kidney Cancer (D) Subsequent therapy 無 preferred regimen","sourcePage":113},{"id":"3-106","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":106,"question":"根據 2021 EAU NMIBC prognostic factor risk groups，下列何者不屬於 high risk？","options":{"A":"75 歲、多發性 Ta LG 腫瘤且大小為 5 公分","B":"60 歲、單一 5 公分的 T1 LG 腫瘤併 CIS","C":"65 歲、單一 3 公分的 T1 HG 腫瘤且無 CIS","D":"70 歲、多發性 Ta HG 腫瘤且大小為 4 公分","E":"70 歲、單一 4 公分 T1 HG 腫瘤併 CIS"},"answer":"E","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): EAU Guidelines 2023: Non-muscle-invasive Bladder Cancer (E)應為 very high risk group","sourcePage":113},{"id":"3-107","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":107,"question":"54 歲無個人病史男性，被診斷有 cT2 膀胱癌。經過 兩個周期(cycle)的 cisplatin 以及共 40 Gy 的放射 治療，mid-treatment TURBT 病理報告為 high-grade T1 urothelial carcinoma，下一步建議如何治療？","options":{"A":"Repeat TURBT","B":"完成整個 chemoradiation 療程","C":"將化療 regimen 改成 ddMVAC","D":"BCG induction","E":"根除性膀胱攝護腺切除術"},"answer":"E","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell Walsh Wein Urology, 12th Edition p. 3122 mid-treatment TURBT 為 split-course trimodal bladder preservation therapy 中用來評估療效的 方式，若仍存在 invasive carcinoma，在適合手術的患 者應建議行根除性手術；無侵 襲性癌者則繼續 consolidative chemoradiotherapy to 60 to 64 Gy","sourcePage":113},{"id":"3-108","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":108,"question":"關於上泌尿道泌尿上皮癌的治療，何者有誤？","options":{"A":"儘管對側腎功能正常，low-risk UTUC 仍應該考 慮 kidney-sparing treatment","B":"即便術前分期為 cN0，high-risk UTUC 手術時也 應該考慮 lymphadenectomy","C":"相較於採取 template lymphadenectomy 方式， 淋巴結移除的數量對於預後的影響更大","D":"術前已進行 cisplatin-based neoadjuvant chemotherapy，若病理報告為 ypT2N0Mx 則應考 慮 adjuvant nivolumab","E":"對於遠端輸尿管 high-risk UTUC，distal ureterectomy 與 radical nephroureterectomy 的治療效果相似，因此可做為治療選擇之一"},"answer":"C","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): Campbell Walsh Wein Urology, 12th Edition p. 2199 EAU Guidelines 2023: Upper Urinary Tract Urothelial Carcinoma (C) The use of a LND template is likely to have a greater impact on patient survival than the number of removed LNs","sourcePage":114},{"id":"3-109","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":109,"question":"有關於腎細胞癌 (renal cell carcinoma) 相關的副 腫瘤症候群(paraneoplastic syndrome), 下列哪項 敍述為錯誤?","options":{"A":"副腫瘤症候群 (Paraneoplastic syndromes) 較 常見於轉移性疾病，約有 10%~20% 腎細胞癌 (renal cell carcinoma) 的病人會出現副腫瘤 症候群","B":"最常見的副腫瘤症候群(paraneoplastic syndrome) 是高血鈣, 約有 13%的腎細胞癌 (renal cell carcinoma)病人會出現，可以透過 大量補水和利尿劑使用，或使用雙膦酸鹽 (bisphosphonates)、皮質類固醇 (corticosteroids) 或降鈣素 (calcitonin) 來 控制","C":"3%~20%的病人會出現 Stauffer 綜合徵 (Stauffer syndrome), 它是一種與腎細胞癌 (renal cell carcinoma)相關的非轉移性的肝功 能異常, 只有 10%的病人在切除腎臟後可回復正 常","D":"一般來說，與腎細胞癌 (renal cell carcinoma) 相關的副腫瘤症候群 (paraneoplastic syndrome) 的治療需要手術切除或全身性抗腫 瘤治療以減輕疾病負擔，高血鈣除外","E":"RCC 是副腫瘤性紅細胞增多症 (paraneoplastic erythrocytosis) 的最常見原 因，有 3%-10%的病人會發生"},"answer":"C","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): 第 12 版 Campbell Ch. 97 P. 2155-2157、第 19 版 Smith Ch. 20 P. 329-335 說明: 有 60%-70% Stauffer syndrome 的病人在切除腎臟 後可回復到正常。","sourcePage":114},{"id":"3-110","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":110,"question":"與 renal cryoablation 比較, radiofrequency ablation (RFA)的缺點為?","options":{"A":"RFA 的出血風險較高","B":"無法通過腹腔鏡使用 RFA","C":"RFA 無法監測治療範圍","D":"cancer-specific survival 較低","E":"local tumor recurrence 機率較低"},"answer":"C","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): 第 12 版 Campbell Ch. 102 P. 2304-2305 Ch. 103 P.2309-2323 說明:採用 RFA 治療腎臟病變 的主要缺點是難以在實時影 像引導下監測治療,因為它不 像冷融治療有冰球的痕跡。冷 凍消融的出血風險更高。 RFA 可通過腹腔鏡、經皮或開放方 式使用。 RFA 和冷凍消融術 的癌症特異性存活率、局部腫 瘤復發風險是相當。","sourcePage":115},{"id":"3-111","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":111,"question":"下列關於腎臟癌風險因子的敘述何者最正確？","options":{"A":"前三大的風險因子依序為：抽煙、高血壓、肥胖","B":"抽菸是最重要的風險因子，戒菸之後風險不會下 降","C":"肥胖是第三主要的風險因子，BMI 每上升 1，相 對風險上升 1.07","D":"長期使用非類固醇消炎藥也是風險因子之一","E":"肥胖相關潛在機轉包含：insulin-like growth factor-2 (類胰島素生長因子-2) 表現、血中雄 性激素上升、 高血壓性腎硬化(arteriolar nephrosclerosis )、局部發炎"},"answer":"D","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): 參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, Chapter 97, p.2140-2141 A (抽煙、肥胖、高血壓) B 會下降 C (第二) E (insulin-like growth factor-1、雌性)","sourcePage":115},{"id":"3-112","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":112,"question":"下列關於腎細胞癌和家族性腎細胞癌(familial renal cell carcinoma)的敘述何者最正確？","options":{"A":"Type 1 papillary RCC，也稱作家族性腎細胞癌 (Hereditary papillary renal carcinoma, HPRC) ，在 pRCC 中較常見，細胞源自 proximal tubule，顯微鏡下腫瘤細胞為 eosinophilic cells with high-grade nuclei，多為單顆、單 側","B":"Type 2 papillary RCC，也稱作遺傳性平滑肌瘤 性腎細胞癌 (Hereditary leiomyomatosis and renal cell cancer, HLRCC )，細胞源自 proximal tubule，顯微鏡下腫瘤細胞為 basophilic cells with low-grade nuclei，常 是多發、雙側","C":"按照發生率排列分別是：Clear cell RCC、 Chromophobe RCC、Papillary RCC","D":"TSC1 基因位於 9q34，轉譯出 hamartin 蛋白， 有抑制 HIF-VEGF pathway 的作用，以抑制細胞 增長及血管新生","E":"TSC2 基因位於 16p13，轉譯出 tuberin 蛋白， 有抑制 mTOR pathway 的作用，以抑制細胞增長 及血管新生"},"answer":"E","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): 參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, Chapter 97 (A) P.2149（basophilic, low-grade，多發、雙側） (B) P.2144、P.2149 eosinophilic, high-grade，多為單顆、單側） (C) p.2153 (Clear cell RCC、Papillary RCC、 Chromophobe RCC) (D) P.2145 (mTOR pathway)","sourcePage":115},{"id":"3-113","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":113,"question":"下列關於上尿路上皮癌(upper tract urothelial carcinoma, UTUC)，何者的敘述最正確？","options":{"A":"遺傳性 UTUC (Familial UTUCs )與 Lynch syndrome 相關，主要是 MSH2 (MutS protein homolog 2)、MSH6 (MutS protein homolog 6)、 MLH2(MutL homolog 2)、PMS6 (mismatch repair endonuclease PMS6)等 DNA mismatch gene 的 突變，其中以 MSH2、MSH6 突變較易產生 UTUC","B":"與 Lynch syndrome 直接較高關聯性的癌症包含 胃癌、大腸癌、胰臟癌、上泌尿道上皮癌以及膀 胱癌","C":"UTUC 發生機率腎盂多於輸尿管，而輸尿管的發 生率由大而小依序則是：近、中、遠端輸尿管","D":"抽菸、肥胖、馬兜鈴酸、砷、瑪黛茶(Yerba mate)、烷基化劑(Alkylating agents)都是上尿 路泌尿上皮癌 (upper urinary tract urothelial carcinoma)之危險因子，其中抽菸 者會比非抽菸者高出 2.3 到 7 倍罹病的風險且 與劑量可能有關，並會隨著戒菸而下降","E":"原位癌即使尚未侵犯至基底膜及肌肉層，原位癌 仍是雙側、多處泌尿上皮癌、復發、惡化的危險 因子之一"},"answer":"E","reference":"(112) /3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自): 參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, Chapter 98, (A) Campbell p.2185; EAU guildline UTUC, P.8, 25: MLH1、PMS2 (B) p.2185（膀胱癌並無直接 高度相關） (C) p.2192（遠端輸尿管、 中、近） (D) p.2186-2188 肥胖未經證 實為危險因子 (E) p.2194, 2196","sourcePage":116},{"id":"3-114","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":114,"question":"當懷疑病患有遺傳性上泌尿道上皮腫瘤時，請問下列 危險因子何者為非？","options":{"A":"年紀小於 60 歲","B":"個人病史懷疑有遺傳性非息肉性大腸直腸腫瘤 症候群(hereditary nonpopyposis colorectal carcinoma syndrome, HNPCC)相關腫瘤","C":"個人一等親內親屬在小於 50 歲即罹患遺傳性非 息肉性大腸直腸腫瘤症候群(hereditary nonpopyposis colorectal carcinoma syndrome, HNPCC)相關腫瘤","D":"個人一等親內親屬有兩位小於 50 歲即罹患遺傳 性非息肉性大腸直腸腫瘤症候群(hereditary nonpopyposis colorectal carcinoma syndrome, HNPCC)相關腫瘤","E":"個人一等親內親屬有四位小於 60 歲即罹患遺傳 性非息肉性大腸直腸腫瘤症候群(hereditary nonpopyposis colorectal carcinoma syndrome, HNPCC)相關腫瘤"},"answer":"E","reference":"(113) 1. Campbell-Walsh-Wein Urology 2. 12th edition, 2021 3. Page 2186, Fig. 98.1 A: 正確 B: 正確 C: 17% D: 正確 E: 無此類相關說明","sourcePage":117},{"id":"3-115","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":115,"question":"關於腎細胞癌的相關敘述，下列何者正確？","options":{"A":"亮細胞型態的腎細胞癌(clear cell renal cell carcinoma)，其相關染色體變異位置在染色體 8p、9p、14q","B":"乳突細胞型態的腎細胞癌(papillary renal cell carcinoma)，其相關染色體變異位置在染 色體 7 跟 18 的三倍體(trisomy)","C":"嫌色細胞型態的腎細胞癌(chromophobe renal cell carcinoma)，其相關基因變異位置為 TPS3 及 PTEB","D":"後天性腎囊疾病造成之腎細胞癌(Acquired cystic disease-associated renal cell carcinoma)其染色體變異位置為 chromosome 4p 缺損","E":"集尿管腎細胞癌(collecting duct carcinoma) 其基因變異位置在 VHL 基因"},"answer":"A","reference":"(113)/ 1. Campbell-Walsh-Wein Urology 2. 12th edition, 2021 3. Page 2149-2151, Table 97.9 A: 正確 B: trisomy of chromosome 7, 17 C: PTEN D: 3p E: VHL 基因變異應與 VHL 疾 病相關，與 clear cell renal cell carcinoma 有關","sourcePage":117},{"id":"3-116","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":116,"question":"以下關於上尿路尿路上皮癌(upper tract urothelial carcinoma，UTUC)敘述，何者正確？","options":{"A":"目前證據顯示鎮痛藥濫用(analgesic abuse)會 稱增加 22%輸尿管腫瘤風險","B":"Brunn 巢(von Brunn nests) 常為惡性，需積極 治療","C":"電腦斷層 (Computed tomography urography) 有最高的診斷準確性(diagnostic accuracy)","D":"輸尿管腫瘤在上段（upper ureter）最常見","E":"晚期疾病(Advanced disease)的特徵是血尿、排 尿疼痛和腰痛"},"answer":"C","reference":"(113)/ Campbell 12ed, Chapter 98 Urothelial Tumors of the Upper Urinary Tract and Ureter, p2188, 2192, 2194","sourcePage":117},{"id":"3-117","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":117,"question":"針對 2024 年更新的 EAU guideline，關於轉移性膀 胱癌的治療策略，下列哪些描述是正確的？","options":{"A":"對於適合組合治療的轉移性尿路上皮癌患者，應 首選鉑類化療(platinum-based chemotherapy) 聯合免疫檢查點抑制劑（checkpoint inhibitor） Pembrolizumab","B":"在無法使用 Enfortumab vedotin 的情況下，僅 應考慮使用單一的免疫檢查點抑制劑，如 Pembrolizumab 或 Atezolizumab","C":"在接受過鉑類化療及免疫檢查點抑制劑治療後 的患者，使用 Enfortumab vedotin 顯示出顯著 的 survival benefit","D":"在轉移性尿路上皮癌患者中，無論風險等級和治 療歷史，均應優先選擇鉑類化療","E":"使用 PD-1 抑制劑 Atezolizumab 在高 PD-L1 表達 的轉移性尿路上皮癌患者中已證實比鉑類化療 更具生存優勢"},"answer":"C","reference":"(113)/ EAU Guidelines, 2024, Muscle-invasive and Metastatic Bladder Cancer, section 7.7. 答案參考原文: Enfortumab vedotin after prior platinum chemotherapy and checkpoint inhibitor immunotherapy has demonstrated a significant survival benefit as compared to chemotherapy.","sourcePage":118},{"id":"3-118","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":118,"question":"下列有關膀胱癌之敘述，何者為非？","options":{"A":"Micropapillary urothelial carcinoma 於男性 發生率遠大於女性","B":"膀胱之 Small cell carcinoma 與 APOBEC-mediated mutational 相關，常有 TP53、 RB1 及 TERT promoter 之突變","C":"膀胱之 Squamous Cell Cancer 與慢性發炎及 S. haematobium有關；在 schistosomiasis 盛行地 區，Squamous Cell Cancer 為最常見之膀胱癌","D":"Plasmacytoid variant of urothelial carcinoma 相較 micropapillary variant 常見， 約佔 10%的泌尿上皮癌","E":"Sarcomatoid variant of urothelial carcinoma 約佔膀胱癌的 0.3~0.6%，預後不佳"},"answer":"D","reference":"(113) 解題說明請註明 1. Campbell 2. 12th 3. Volume III P.3088-3089","sourcePage":118},{"id":"3-119","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":119,"question":"下列有關泌尿上皮癌與 Lynch syndrome 之相關連敘 述，何者為非?","options":{"A":"家族性上泌尿道上皮癌與 Lynch syndrome 相 關，其與 mismatch repair (MMR) genes 之突變 有關","B":"與 Lynch syndrome 相關之基因突變包含了 MLH1 (MutL homolog 1)、MSH2 (MutS protein homolog 2)、MSH6 (MutS protein homolog 6)及 PMS2 (mismatch repair endonuclease PMS2)","C":"Lynch syndrome 與年輕、女性之上泌尿道上皮 癌相關","D":"Lynch syndrome 對膀胱泌尿上皮癌之影響較上 泌尿道上皮癌明顯","E":"除了上泌尿道上皮癌外，Lynch syndrome 也與 大腸癌、胃癌及卵巢癌相關聯"},"answer":"D","reference":"(113) 解題說明請註明 1. Campbell 2. 12th 3. Volume II P.2185","sourcePage":119},{"id":"3-120","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":120,"question":"根據 NCCN Guideline for kidney cancer 2024 第四 版，針對轉移性 clear cell type renal cell carcinoma，有關 poor/intermediate risk 第一線治 療的選項，下列何者未列入「category 1」其中？","options":{"A":"Axitinib + pembrolizumab","B":"Cabozantinib + pembrolizumab","C":"Lenvatinib + pembrolizumab","D":"Ipilimumab + nivolumab","E":"Cabozantinib + nivolumab"},"answer":"B","reference":"(113)NCCN guideline for kidney cancer 2024 第四版","sourcePage":119},{"id":"3-121","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":121,"question":"以下關於膀胱切除後使用不同腸胃道於尿道分流手 術(Urinary diversion)的敘述何者正確?","options":{"A":"為了確保足夠的血液灌流並降低壞死的風險，小 腸段末端所清除的腸繫膜不應超過 6 公分","B":"避免在中結腸動脈 (middle colic artery)與左 結腸動脈 (left colic artery)的交界處又稱 Sudeck’s 點 (Sudeck’s point)進行吻合，以 避免結腸缺血 (ischemia of colon)","C":"使用胃 (Stomach) 於尿道分流手術，造成低血 鈉、低血鉀、鹼中毒，及特有的 Hematuria-dysuria syndrome","D":"使用Ileum，造成高血氯、低血鉀、高血鈣、酸中毒，術後腸阻塞的機率約10%；相較於使用迴腸，使用結腸進行尿路改道的術後腸阻塞需再次手術的機率較低","E":"（原始文件此選項內容缺漏，僅提供解析：與迴腸尿路分流相比，使用結腸進行尿路分流術後需再次手術的腸阻塞發生率較低，此為正確敘述）"},"answer":"E","reference":"(114) 1.Campbell-Walsh-Wein Urology, 12ᵗʰ ed., Ch. 139 “Use of Intestinal Segments in Urinary Diversion”, pp 3160-3162. 說明： (A) P.3161 Key Points: No more than 8 cm of mesentery should be cleared from the end of a small bowel segment to allow for adequate perfusion and minimize the risk for necrosis. 為 8 公分不是 6 公分。 (B) P.3161 Key Points: Two main watershed areas are found in the colon where, if possible, anastomosis should be avoided: Griffith’s point near the splenic flexure (middle colic artery and left colic artery) and Sudeck’s point near the rectosigmoid junction (most inferior sigmoidal branch and superior rectal artery) Sudeck’s point 是位於直腸 乙狀結腸交界處。 (C)P.3162 The advantages of the stomach over other intestinal segments for urinary intestinal diversion are that it is less permeable to urinary solutes, it has a net excretion of chloride and protons rather than a net absorption of them, and it produces less mucus. Urodynamically, it behaves as other intestinal segments do. When it is used in urinary reconstruction, electrolyte imbalance rarely ensues in patients with normal renal function, although hypochloremic metabolic alkalosis has been described. 沒有低血鈉。 (D)P.3162 Loss of significant portions of the ileum results in nutritional problems because of lack of vitamin B12 absorption, diarrhea because of lack of bile salt reabsorption, and fat mal- absorption. 為低血鈣。 (E)P.3162 Key Points: There is a lower rate of postoperative bowel obstruction requiring reoperation colon versus ileal urinary diversion 正 確。","sourcePage":119},{"id":"3-122","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":122,"question":"VHL 症候群腫瘤抑制蛋白調節下列哪一種腎細胞癌生 物攻擊性介質的表達？","options":{"A":"鹼性纖維細胞生長因子","B":"血管內皮細胞生長因子","C":"表皮生長因子受體","D":"肝細胞生長因子 (分散因子)","E":"P-醣蛋白 (多重抗藥性外排蛋白)"},"answer":"B","reference":"(114)Campbell-Walsh-Wein, 12th edition, Ch.97, p.2141","sourcePage":121},{"id":"3-123","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":123,"question":"關於高危險性上泌尿道上皮腫瘤的敘述下列何者為 非？","options":{"A":"腎水腫","B":"尿液細胞學為高惡性度","C":"腫瘤大於 2 公分","D":"多發性疾病(multifocal disease)","E":"曾因膀胱腫瘤接受過經尿道膀胱腫瘤刮除手術（transurethral resection of bladder tumor）"},"answer":"E","reference":"(113)/ 1.Campbell-Walsh-Wein Urology 2.12th edition, 2021 3.Page 2198, Fig. 98.6 A: 正確 B: 正確 C: 正確 D: 正確 E: 應為接受過根除性膀胱切 除手術","sourcePage":121},{"id":"3-124","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":124,"question":"一名 58 歲男性因 4 公分的腎臟腫瘤而接受部分腎臟 切除手術，病理報告顯示腫瘤呈瀰漫性嗜酸性球細胞 倂有腎臟周圍脂肪侵犯，下列何種免疫化學染色有助 於嗜酸性細胞瘤的診斷？","options":{"A":"細胞角蛋白-7 (Cytokeratin-7)","B":"雌激素受體 (Estrogen receptor)","C":"黑色素瘤抗體 45 (HMB-45)","D":"黑色素-A (Melan-A)","E":"WT1 題號 答案 考 題"},"answer":"A","reference":"(114)Campbell-Walsh-Wein, 12th edition, Ch.96, p.2123 年度 類別 參考資料","sourcePage":122},{"id":"4-001","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":1,"question":"一位 38 歲女性，血壓偏高且藥物控制效果不佳，且無相關 家族病史，在確診為原發性高醛固酮症(primary aldosteronism)後，電腦斷層發現右側 2 公分腎上腺腫 瘤，左側腎上腺無腫瘤，則下列敘述何者較不正確?","options":{"A":"安排右側腎上腺切除手術","B":"必須安排腎上腺靜脈取樣(adrenal vein sampling)","C":"病人可能出現低血鉀及代謝性鹼中毒","D":"可以加上 Spironolactone 以控制血壓","E":"術前若皮質醇(cortisol)有升高，可以在術前補充類 固醇"},"answer":"B","reference":"(110)/4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： Campbell-Walsh-Wein Urology Twelfth Edition p2370, 2409","sourcePage":123},{"id":"4-002","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":2,"question":"關於疑似腎上腺皮質癌(adrenocortical carcinoma)，所 需要做的功能性評估(functional evaluation)，不包括下 列何者?","options":{"A":"Low-dose dexamethasone suppression test","B":"Aldosterone-to-renin ratio (只有當病人有高血壓 或低血鉀時才做)","C":"ACTH","D":"Serum norepinephrine","E":"DHEA-S"},"answer":"D","reference":"(110)/4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition Chapter 106 P.2385 Table 106.13","sourcePage":123},{"id":"4-003","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":3,"question":"關於 carcinoma in situ of penis 的敘述，何者錯誤？","options":{"A":"Bowen disease 現在已知跟 internal malignancy 完 全沒有關聯性，不再需要去 survey 腹內臟器","B":"Erythroplasia of Quarat 發生在 penile glans","C":"Bowenoid papulosis 算是惡性度比較高的 CIS，有 10~20%會發展成 invasive carcinoma","D":"Bowenoind papulosis 特別跟 HPV infection 有關聯 性","E":"治療包括 conservative resection, laser 和 5-FU ointment"},"answer":"C","reference":"(110)/4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： Campbell Urology 12th ed, chapter 79","sourcePage":123},{"id":"4-004","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":4,"question":"下列何者是陰莖癌前病變(premalignant penile lesion) 的機率最低?","options":{"A":"Lichen sclerosis","B":"Bowenoid papulosis","C":"Bowen’s disease","D":"Paget’s disease","E":"Condylomata lata"},"answer":"E","reference":"(110)/4.腎上腺&外生殖器腫 瘤/參考資料(摘錄自)： EAU guideline on Penile Cancer 2020 P9 3.4 Table 4","sourcePage":123},{"id":"4-005","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":5,"question":"關於 penile ca 的手術治療敘述，何者正確？","options":{"A":"適合做 organ preservation 的 indication 包含 Tis, T1, T2, grade1 和 grade 2","B":"Tumor 在 microscopy 下侵犯的範圍可能跟 tumor grading 是有關聯的，safety margin 可能可以依此調 整","C":"Glans resurfacing 是手術移除 glans 上有 tumor 的 skin，保留下 subepithelial tissue 和 copora spongiosa","D":"經過 Mohs micrographic surgery 後，recurrence rate 和 partial penectomy 是一樣的","E":"術前應做 PET CT 以決定 penile ca 的深度(T stage)"},"answer":"B","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell Urology 12th ed, chapter 79","sourcePage":123},{"id":"4-006","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":6,"question":"關於Germ cell tumors of the testis敘述何者錯誤?","options":{"A":"根據 2016 WHO 分類，睪丸 spermatocytic tumor, prepubertal type teratoma, epidermoid cyst 皆屬 於 germ cell tumors unrelated to germ cell neoplasia in situ (GCNIS)","B":"GCNIS 屬於生殖細胞腫瘤( GCT)之前驅病灶 (precursor lesion)，可用低劑量放射治療處理","C":"不同於 NSGCT(non-seminoma germ cell tumor)，精 母細胞瘤(seminoma)之 IGCCCG 風險分類僅依據是否 有肺外臟器轉移( nonpulmonary visceral metastases)決定","D":"AFP 正常，LDH-1 升高可排除 choriocarcinoma，且此 腫瘤不具有 radiosensitive 特性","E":"治療上，患側睪丸保留手術治療(testis-sparing surgery)在對側睪丸正常情形下，是不予考慮的術式"},"answer":"D","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell’s Urology, 12th ed, Part VII, Chapter 76. P. 1681~1693.","sourcePage":124},{"id":"4-007","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":7,"question":"關於睪丸secondary tumor敘述下列何者錯誤？","options":{"A":"常見轉移性腫瘤來源包括攝護腺、肺臟、大腸及腎臟","B":"轉移性睪丸腫瘤約 15%為雙側性","C":"Leukemic Infiltration 常見於男孩 acute lymphocytic leukemia 之復發，經放射治療後預後不 錯","D":"非霍奇金氏淋巴瘤（non-Hodgkin lymphoma）是 50 歲以上男性最常見睪丸腫瘤","E":"睪丸淋巴瘤病患約25%有發燒、夜間盜汗及體重減輕等 全身性症狀"},"answer":"C","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell’s Urology, 12th ed, Part VII, Chapter 76. P. 1709.","sourcePage":124},{"id":"4-008","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":8,"question":"針對陰莖原位癌(Carcinoma in situ, CIS)，下列敘述何 者為非?","options":{"A":"又稱 penile intraepithelial neoplasia(PEIN) P","B":"Bowenoid papulosis(BP), Paget’s disease(PD), 及 erythroplasia of Queryrat(EQ)皆屬於 CIS","C":"Bowenoid papulosis 好發於陰莖幹部(shaft)且不會 進展為侵襲性疾病","D":"若未治療，EQ 有 10~33%進展為侵襲性癌","E":"遠端轉移並不常見，故治療上可考慮器官保留方式， 如 Nd:YAG laser ablation"},"answer":"B","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： Campbell’s Urology, 12th ed, Part VII, Chapter 79. .1742","sourcePage":124},{"id":"4-009","category":"腎上腺&外生殖器腫瘤","categoryOrder":4,"number":9,"question":"對於陰莖癌原發病灶之治療何者為非?","options":{"A":"CO2 laser 在 nodal recurrence rate 遠高於其他種 laser ablation","B":"龜頭侷限 Tis 病灶可採用 imiquimod cream 局部塗藥 治療","C":"包皮 Ta 病灶應以手術切除為主","D":"龜頭之侷限性淺層 T1, grade 3 病灶可採用 glansectomy 或 radiotherapy 治療","E":"採用”器官保留術式”相較”全或部分陰莖切除術” 之局部復發率較高，但若及早治療則早期存活率未受 影響"},"answer":"A","reference":"(110)/4. 腎上腺&外生殖器 腫瘤/參考資料(摘錄自)： 1. Campbell’s Urology, 12th ed, Part VII, Chapter 79. P.1751~1753. 2. EAU guideline. Penile cancer; Table 10.","sourcePage":125},{"id":"4-010","cat
