<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>泌尿科考古題刷題 · 115年</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B1A18;
  --surface:#242220;
  --surface-2:#2C2A26;
  --surface-3:#353330;
  --border:#3E3B36;
  --ink:#E4DFD5;
  --muted:#A79F91;
  --muted-2:#756D5F;
  --accent:#8FB996;
  --accent-ink:#132015;
  --accent-dim:rgba(143,185,150,.16);
  --correct:#8FBF7F;
  --correct-dim:rgba(143,191,127,.16);
  --incorrect:#D98C6B;
  --incorrect-dim:rgba(217,140,107,.15);
  --amber:#E0B074;
  --amber-dim:rgba(224,176,116,.16);
  --radius:16px;
  --radius-sm:10px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans TC','IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  background:
    radial-gradient(60% 40% at 50% 0%, rgba(143,185,150,.05), transparent 60%),
    var(--bg);
}

.screen{display:none;min-height:100vh;min-height:100dvh;}
.screen.active{display:flex;flex-direction:column;}

/* ---------- shared buttons ---------- */
.btn{
  font-family:inherit;
  border:none;
  border-radius:var(--radius);
  padding:16px 18px;
  font-size:1.02rem;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  transition:transform .12s ease, filter .15s ease, opacity .15s ease;
  -webkit-user-select:none;
  user-select:none;
  min-height:56px;
}
.btn:active{transform:scale(.98);}
.btn-block{width:100%;}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:disabled{background:var(--surface-3);color:var(--muted-2);cursor:not-allowed;}
.btn-secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid transparent;}
.btn-review{background:var(--surface-2);color:var(--amber);border:1px solid rgba(224,176,116,.35);}
.btn-review:disabled{color:var(--muted-2);border-color:var(--border);cursor:not-allowed;}
.btn-mock{background:var(--surface-2);color:var(--accent);border:1px solid rgba(143,185,150,.4);}
.btn .btn-main{font-size:1rem;}
.btn .btn-sub{font-size:.8rem;opacity:.75;font-weight:500;font-family:'IBM Plex Mono',monospace;}

.icon-btn{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--ink);
  width:40px;height:40px;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  flex:none;
  cursor:pointer;
}
.icon-btn:active{transform:scale(.94);}

/* ---------- home ---------- */
.home-wrap{
  padding:calc(28px + var(--safe-top)) 20px calc(40px + var(--safe-bottom));
  display:flex;flex-direction:column;gap:26px;
}
.home-header{text-align:center;}
.pulse-line{width:100%;height:34px;margin-bottom:14px;opacity:.9;}
.pulse-svg{width:100%;height:100%;}
.pulse-svg polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;
  filter:none;}
.home-header h1{
  margin:0;
  font-size:1.7rem;
  letter-spacing:.02em;
  font-weight:700;
}
.home-sub{
  margin:6px 0 0;
  color:var(--muted);
  font-size:.9rem;
  font-family:'IBM Plex Mono',monospace;
}
.home-stats{display:flex;gap:10px;}
.stat-chip{
  flex:1;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px 8px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.stat-num{font-family:'IBM Plex Mono',monospace;font-size:1.25rem;font-weight:600;color:var(--accent);}
.stat-label{font-size:.72rem;color:var(--muted);}

.resume-banner{
  background:var(--amber-dim);
  border:1px solid rgba(224,176,116,.4);
  border-radius:var(--radius);
  padding:14px 16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.resume-text{display:flex;flex-direction:column;gap:3px;}
.resume-title{font-size:.9rem;font-weight:700;color:var(--amber);}
.resume-info{font-size:.8rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.resume-actions{display:flex;gap:8px;}
.resume-actions .btn{flex:1;min-height:46px;padding:10px 12px;font-size:.88rem;}
.resume-actions .btn-ghost{background:var(--surface-2);border:1px solid var(--border);color:var(--muted);}

.section-title{
  font-size:.82rem;
  color:var(--muted);
  letter-spacing:.08em;
  margin:0 0 12px;
  font-weight:600;
  text-transform:uppercase;
}
.home-section{display:flex;flex-direction:column;gap:10px;}
.mode-row{display:flex;justify-content:flex-end;margin-bottom:2px;}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;}
.toggle input{display:none;}
.toggle-track{
  width:40px;height:24px;border-radius:20px;
  background:var(--surface-3);
  border:1px solid var(--border);
  position:relative;
  transition:background .15s ease;
  flex:none;
}
.toggle-thumb{
  position:absolute;top:2px;left:2px;
  width:18px;height:18px;border-radius:50%;
  background:var(--muted);
  transition:transform .15s ease, background .15s ease;
}
.toggle input:checked + .toggle-track{background:var(--accent-dim);border-color:var(--accent);}
.toggle input:checked + .toggle-track .toggle-thumb{transform:translateX(16px);background:var(--accent);}
.toggle-label{font-size:.88rem;color:var(--muted);}

.cat-list{display:flex;flex-direction:column;gap:8px;}
.cat-item{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  cursor:pointer;
  transition:background .12s ease, transform .1s ease;
}
.cat-item:active{transform:scale(.98);background:var(--surface-2);}
.cat-name-row{display:flex;align-items:center;gap:10px;}
.cat-order{
  font-family:'IBM Plex Mono',monospace;
  font-size:.75rem;
  color:var(--bg);
  background:var(--accent);
  width:22px;height:22px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  flex:none;
  font-weight:700;
}
.cat-name{font-size:.95rem;}
.cat-count{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:.82rem;}

.home-footnote{
  font-size:.72rem;
  color:var(--muted-2);
  line-height:1.6;
  text-align:center;
  margin:6px 0 0;
}
.reset-link{
  background:none;border:none;
  color:var(--muted-2);
  font-size:.76rem;
  text-decoration:underline;
  text-underline-offset:3px;
  margin:2px auto 0;
  padding:8px;
  cursor:pointer;
  font-family:inherit;
}
.reset-link:active{color:var(--incorrect);}

/* ---------- mode tabs ---------- */
.mode-tabs{
  display:flex;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:4px;
  gap:4px;
}
.mode-tab{
  flex:1;
  border:none;
  background:transparent;
  color:var(--muted);
  font-family:inherit;
  font-size:.88rem;
  font-weight:600;
  padding:11px 8px;
  border-radius:8px;
  cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
.mode-tab.active{
  background:var(--accent);
  color:var(--accent-ink);
}

/* ---------- quiz ---------- */
.quiz-topbar{
  display:flex;align-items:center;gap:12px;
  padding:calc(14px + var(--safe-top)) 16px 12px;
  background:var(--bg);
  position:sticky;top:0;z-index:5;
  border-bottom:1px solid var(--border);
}
.quiz-progress-wrap{flex:1;min-width:0;}
.quiz-progress-text{
  display:flex;align-items:center;gap:6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:.78rem;
  color:var(--muted);
  margin-bottom:6px;
}
.quiz-progress-text .dot{opacity:.5;}
#quiz-accuracy{color:var(--accent);}
.ecg-bar{position:relative;height:20px;width:100%;overflow:hidden;border-radius:4px;background:var(--surface-2);}
.ecg-bg{position:absolute;inset:0;width:100%;height:100%;opacity:.35;}
.ecg-bg polyline{fill:none;stroke:var(--muted-2);stroke-width:2;}
.ecg-fill{position:absolute;inset:0;width:0%;height:100%;overflow:hidden;transition:width .35s ease;}
.ecg-fg{position:absolute;left:0;top:0;height:100%;width:400px;max-width:none;}
.ecg-fg polyline{fill:none;stroke:var(--accent);stroke-width:2.4;}
.mode-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:.7rem;
  color:var(--muted);
  background:var(--surface-2);
  border:1px solid var(--border);
  padding:5px 9px;
  border-radius:8px;
  flex:none;
  white-space:nowrap;
}

.quiz-scroll{flex:1;overflow-y:auto;padding:18px 16px 24px;-webkit-overflow-scrolling:touch;}
.quiz-card{display:flex;flex-direction:column;gap:16px;}
.quiz-meta-row{display:flex;gap:8px;}
.chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:.72rem;
  padding:5px 10px;
  border-radius:8px;
  background:var(--surface-2);
  color:var(--muted);
  border:1px solid var(--border);
}
.chip-cat{color:var(--accent);border-color:rgba(143,185,150,.35);}
.quiz-question{
  font-size:1.14rem;
  line-height:1.75;
  font-weight:600;
  margin:0;
}

.options{display:flex;flex-direction:column;gap:10px;}
.option{
  display:flex;
  align-items:flex-start;
  gap:12px;
  text-align:left;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:14px 14px;
  cursor:pointer;
  font-family:inherit;
  font-size:.98rem;
  line-height:1.65;
  color:var(--ink);
  min-height:56px;
  transition:background .12s ease, border-color .12s ease, transform .08s ease;
}
.option:active{transform:scale(.985);}
.option .opt-letter{
  font-family:'IBM Plex Mono',monospace;
  font-weight:700;
  font-size:.9rem;
  width:26px;height:26px;border-radius:8px;
  background:var(--surface-3);
  color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  flex:none;
  margin-top:1px;
}
.option .opt-text{flex:1;padding-top:2px;}
.option .opt-icon{flex:none;width:20px;height:20px;margin-top:3px;opacity:0;transform:scale(.6);transition:opacity .15s ease, transform .15s ease;}

.option.selectable:active{background:var(--surface-2);}
.option.correct{background:var(--correct-dim);border-color:var(--correct);}
.option.correct .opt-letter{background:var(--correct);color:#06251F;}
.option.correct .opt-icon{opacity:1;transform:scale(1);color:var(--correct);}
.option.incorrect{background:var(--incorrect-dim);border-color:var(--incorrect);}
.option.incorrect .opt-letter{background:var(--incorrect);color:#2A0808;}
.option.incorrect .opt-icon{opacity:1;transform:scale(1);color:var(--incorrect);}
.option.dim{opacity:.45;}
.option.locked{cursor:default;}

.explain{
  display:flex;flex-direction:column;gap:12px;
  animation:fadeUp .25s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.explain-banner{
  font-weight:700;
  font-size:.98rem;
  padding:12px 14px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;gap:8px;
}
.explain-banner.correct{background:var(--correct-dim);color:var(--correct);}
.explain-banner.incorrect{background:var(--incorrect-dim);color:var(--incorrect);}
.explain-progress{
  font-family:'IBM Plex Mono',monospace;
  font-size:.78rem;
  padding:9px 12px;
  border-radius:var(--radius-sm);
  background:var(--amber-dim);
  color:var(--amber);
  border:1px solid rgba(224,176,116,.3);
}
.explain-block{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:14px;
}
.explain-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:.72rem;
  color:var(--muted);
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:6px;
}
.explain-text{margin:0;font-size:.88rem;line-height:1.8;color:var(--muted);white-space:pre-wrap;}

.quiz-bottombar{
  position:sticky;bottom:0;
  padding:12px 16px calc(14px + var(--safe-bottom));
  background:linear-gradient(180deg, rgba(11,18,32,0) 0%, var(--bg) 30%);
}

/* ---------- summary ---------- */
.summary-wrap{
  flex:1;
  padding:calc(40px + var(--safe-top)) 24px calc(30px + var(--safe-bottom));
  display:flex;flex-direction:column;align-items:center;gap:14px;
  text-align:center;
}
.summary-title{margin:0;font-size:1.3rem;font-weight:700;}
.summary-big{
  font-family:'IBM Plex Mono',monospace;
  font-size:3.4rem;
  font-weight:700;
  color:var(--accent);
  line-height:1;
  margin-top:6px;
}
.summary-sub{color:var(--muted);margin:0 0 8px;font-size:.92rem;}
.summary-stats{display:flex;gap:10px;width:100%;margin-bottom:10px;}
.summary-wrap .btn{margin-top:2px;}

/* ---------- flashcards ---------- */
.flash-scroll{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 16px;
  overflow:hidden;
}
.flash-card-wrap{
  width:100%;
  max-width:460px;
  perspective:1600px;
}
.flash-card{
  position:relative;
  width:100%;
  height:min(58vh, 480px);
  min-height:340px;
  border:none;
  background:transparent;
  padding:0;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.2,.2,1);
  font-family:inherit;
  display:block;
}
.flash-card.flipped{transform:rotateY(180deg);}
.flash-face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:20px;
  border:1.5px solid var(--border);
  background:var(--surface);
  padding:26px 22px;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  text-align:left;
}
.flash-front{
  align-items:flex-start;
  gap:16px;
  justify-content:flex-start;
}
.flash-back{
  transform:rotateY(180deg);
  align-items:center;
  justify-content:flex-start;
  gap:14px;
  text-align:center;
  background:var(--surface-2);
  border-color:rgba(143,185,150,.4);
}
.flash-q{
  font-size:1.12rem;
  line-height:1.75;
  font-weight:600;
  margin:0;
}
.flash-hint{
  margin-top:auto;
  padding-top:14px;
  font-size:.74rem;
  color:var(--muted-2);
  align-self:center;
  font-family:'IBM Plex Mono',monospace;
}
.flash-answer-letter{
  font-family:'IBM Plex Mono',monospace;
  font-size:2.6rem;
  font-weight:700;
  color:var(--accent);
  width:64px;height:64px;
  border-radius:16px;
  background:var(--accent-dim);
  border:1.5px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  flex:none;
}
.flash-answer-text{
  font-size:1.02rem;
  line-height:1.65;
  font-weight:600;
  margin:0;
}
.flash-ref-block{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  text-align:left;
}

.flash-nav{
  display:flex;
  gap:10px;
}
.flash-nav-btn{
  flex:1;
  justify-content:center;
}
/* ---------- wrong-bank browse ---------- */
.wrongbrowse-scroll{
  flex:1;
  overflow-y:auto;
  padding:16px 16px calc(30px + var(--safe-bottom));
  display:flex;
  flex-direction:column;
  gap:14px;
  -webkit-overflow-scrolling:touch;
}
.wb-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.wb-meta-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.wb-streak{
  font-family:'IBM Plex Mono',monospace;
  font-size:.72rem;
  color:var(--amber);
  background:var(--amber-dim);
  border:1px solid rgba(224,176,116,.3);
  padding:4px 9px;
  border-radius:8px;
  white-space:nowrap;
}
.wb-question{font-size:1rem;line-height:1.7;font-weight:600;margin:0;}
.wb-options{display:flex;flex-direction:column;gap:7px;}
.wb-option{
  display:flex;gap:10px;align-items:flex-start;
  border-radius:var(--radius-sm);
  padding:10px 12px;
  font-size:.9rem;
  line-height:1.6;
  background:var(--surface-2);
  border:1px solid var(--border);
}
.wb-option.wb-correct{background:var(--correct-dim);border-color:var(--correct);color:var(--ink);}
.wb-option .wb-letter{
  font-family:'IBM Plex Mono',monospace;
  font-weight:700;
  font-size:.82rem;
  width:22px;height:22px;border-radius:7px;
  background:var(--surface-3);
  color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  flex:none;
}
.wb-option.wb-correct .wb-letter{background:var(--correct);color:var(--accent-ink);}
.wb-ref{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px 14px;
}
.wb-empty{
  text-align:center;
  color:var(--muted);
  padding:60px 20px;
  font-size:.9rem;
  line-height:1.8;
}

::-webkit-scrollbar{width:0;height:0;}

@media (min-width:521px){
  #app{border-left:1px solid var(--border);border-right:1px solid var(--border);}
}

</style>
</head>
<body>
<div id="app">

  <!-- ================= HOME SCREEN ================= -->
  <section id="screen-home" class="screen active">
    <div class="home-wrap">
      <header class="home-header">
        <div class="pulse-line" aria-hidden="true">
          <svg viewBox="0 0 400 40" preserveAspectRatio="none" class="pulse-svg">
            <polyline points="0,20 40,20 55,20 65,4 75,36 85,20 100,20 140,20 155,20 165,4 175,36 185,20 200,20 240,20 255,20 265,4 275,36 285,20 300,20 340,20 355,20 365,4 375,36 385,20 400,20" />
          </svg>
        </div>
        <h1>泌尿科考古題</h1>
        <p class="home-sub">115 年筆試考古題 · <span id="stat-total">0</span> 題 · 12 大類</p>
      </header>

      <div class="resume-banner" id="resume-banner" hidden>
        <div class="resume-text">
          <span class="resume-title">偵測到上次未完成的作答</span>
          <span class="resume-info" id="resume-info"></span>
        </div>
        <div class="resume-actions">
          <button class="btn btn-primary" id="btn-resume-continue">繼續上次進度</button>
          <button class="btn btn-ghost" id="btn-resume-discard">捨棄</button>
        </div>
      </div>

      <div class="home-stats" id="home-stats">
        <div class="stat-chip">
          <span class="stat-num" id="stat-answered">0</span>
          <span class="stat-label">已作答</span>
        </div>
        <div class="stat-chip">
          <span class="stat-num" id="stat-accuracy">–</span>
          <span class="stat-label">答對率</span>
        </div>
        <div class="stat-chip">
          <span class="stat-num" id="stat-wrong">0</span>
          <span class="stat-label">錯題本</span>
        </div>
      </div>

      <section class="home-section">
        <h2 class="section-title">學習模式</h2>
        <div class="mode-tabs" id="mode-tabs">
          <button class="mode-tab active" data-mode="quiz" type="button">刷題測驗</button>
          <button class="mode-tab" data-mode="flash" type="button">單字卡複習</button>
        </div>
      </section>

      <section class="home-section">

const QUESTIONS = [{"id":"1-001","category":"結石","categoryOrder":1,"number":1,"question":"對於體外震波碎石震波產生器(generator)的描述何者是錯誤?","options":{"A":"電動液壓式 (electrohydraulic)、電磁式 (electromagnetic)、和壓電式 (piezoelectric) 是目前三種 主要的震波產生器","B":"電動液壓式震波產生器是利用水下火花放電(spark discharge)的方式產生一種球形的擴張性震波(spherical extending shockwave)","C":"電動液壓式震波可以有效的擊碎結石，而且每個所產生的震波 壓力變動差異不大","D":"電磁式震波產生器所產生的震波能量與電動液壓式震波產生 器比較，有較好的控制而且一致性高(controllable and reproducible)","E":"壓電式的震波優點是造成皮膚的疼痛感較小，幾乎可以不用麻 醉，但是也造成結石比較不易粉碎"},"answer":"C","reference":"(110)/1.結石/參考資料 (摘錄自)：Campbell Urology 12th Edition, p.2094-2095","sourcePage":1},{"id":"1-002","category":"結石","categoryOrder":1,"number":2,"question":"下列有關攝護腺結石之敘述何者正確?","options":{"A":"約 80%造成臨床症狀","B":"以攝護腺前葉比例居多","C":"多數攝護腺結石成分為 carbonate apatite","D":"攝護腺結石的存在與 chronic prostatitis/chronic pelvic pain syndrome (CP/CPPS) 的症狀相關","E":"攝護腺結石的存在與 PSA 升高及攝護腺癌風險有關"},"answer":"D","reference":"(110)/1.結石/參考資料 (摘錄自)： CAMPBELL-WALSH UROLOGY 12ed. P.2117-2132","sourcePage":1},{"id":"1-003","category":"結石","categoryOrder":1,"number":3,"question":"下列關於 hypercalciuria 在結石的病生理學何者錯誤?","options":{"A":"type 1 absorptive hypercalciuria 為 diet dependent，症 狀一般較 type 2 輕微","B":"primary hyperparathyroidism 是 resorptive hypercalciuria 常見原因，必要時可切除副甲狀腺","C":"renal hypercalciuria 患者常出現副甲狀腺素升高現象，但 血鈣卻正常","D":"結石成分含高比例磷酸鈣，同時表現高尿鈣，需考慮副甲狀腺 亢進","E":"AUA guidelines 不推薦常規 dietary calcium loading tests 來區分高鈣尿症的類型"},"answer":"A","reference":"(110)/1.結石/參考資料 (摘錄自)： CAMPBELL-WALSH UROLOGY 12ed. P.2050-2053","sourcePage":1},{"id":"1-004","category":"結石","categoryOrder":1,"number":4,"question":"關於懷孕婦女的結石下列何者為正確?","options":{"A":"尿中的鈣離子濃度與檸檬酸濃度都會降","B":"懷孕期間腎血流量增加，會使腎小球濾過率增加 70~90%","C":"大多數的結石為磷酸鈣","D":"BMI 越高的孕婦其結石發生率越高","E":"近端輸尿管結石可透過經陰道超音波檢查"},"answer":"C","reference":"(110)/1.結石/參考資料 (摘錄自)： Campbell-Walsh Urology,11th, p.1287~1288","sourcePage":1},{"id":"1-005","category":"結石","categoryOrder":1,"number":5,"question":"關於磷酸氨鎂結石(magnesium ammonium phosphate)的敘述何者為 錯誤?","options":{"A":"感染性尿路結石完全是由六水磷酸氨鎂(magnesium ammonium phosphate hexahydrate (MgNH PO • 6H O)所組成 4 4 2","B":"磷酸氨鎂最早是瑞典一位地質學家在海鳥糞中發現的，為紀念 其老師 H.C.G. von Struve，而命名為 Struvite","C":"其形成的機轉是因為泌尿道感染中的細菌會將尿液中的尿素 分解成氨和二氧化碳然後進一步形成磷酸氨鎂結石","D":"此種尿路結石形成的尿液酸鹼值大多是鹼性環境","E":"大腸桿菌雖然是泌尿道感染常見的腸道細菌，但是它並沒有能 夠分解尿素的能力"},"answer":"A","reference":"(110)/1.結石/參考資料 (摘錄自)： Campbell Urology 12th Edition, p.2030-2031","sourcePage":2},{"id":"1-006","category":"結石","categoryOrder":1,"number":6,"question":"下列對於結石成因和盛行率，何者錯誤？","options":{"A":"一般來說，結石整體盛行率男生比女生高，但是黑人則是女生 大於男生","B":"磷酸鈣結石在女性較多，並且尿多呈鹼性","C":"肥胖容易有尿酸結石，主要原因是尿中的尿酸增加影響","D":"肥胖因為有許多結石形成的促發因子，而有草酸鈣結石的形成","E":"影響尿酸結石形成的三大要素包含：尿 PH 值低、高尿酸尿、 尿量少"},"answer":"C","reference":"(110)/1.結石/參考資料 (摘錄自)：Campbell Walsh Wein Urology - 12th Edition, (91 章節, 2006, 2008 頁)( 92 章 節, 2048, 2058 頁)","sourcePage":2},{"id":"1-007","category":"結石","categoryOrder":1,"number":7,"question":"以下關於腎小管酸中毒(renal tubular acidosis，RTA)和高鈣尿 (Hypercalciuria)的敘述，何者為錯誤的?","options":{"A":"Type 1 RTA 是遠曲小管發生缺損，會產生磷酸鈣結石","B":"RTA type 1 女多於男生","C":"Ammonium chloride loading challenge 可以用於診斷遠端 RTA","D":"對於 Absorptive Hypercalciuria 的病人來說，即使攝取的鈣 增加，血鈣仍都不會增加","E":"飲食嚴格的限鈣實際上會增加結石復發的風險"},"answer":"D","reference":"(110)/1.結石/參考資料 (摘錄自)：Campbell Walsh Wein Urology - 12th Edition, (91 章節, 2019 頁)( 92 章節, 2049, 2055 頁)","sourcePage":2},{"id":"1-008","category":"結石","categoryOrder":1,"number":8,"question":"針對懷孕結石病患的治療，何者描述錯誤？","options":{"A":"在懷孕結石病患如結石無法自然排出合併感染或腎水腫時， 放置 ureteral stent or percutaneous nephrostomy 是合理 的處理方式","B":"有症狀的懷孕結石病患也可以直接執行輸尿管鏡碎石手術， 減少放置 stent 的不適感","C":"第一產程(first trimester) 的懷孕結石病患上段(upper third)輸尿管結石也可考慮體外震波碎石術，影響胎兒的機會 很低","D":"輸尿管鏡碎石手術最適合的執行時機是第二產程(second trimester)時","E":"無症狀的懷孕結石病患只需保守治療即可"},"answer":"C","reference":"(110)/1.結石/參考資料 (摘錄自)：European Urology Guidline 2021 Ch. 3.4.14.1.1","sourcePage":2},{"id":"1-009","category":"結石","categoryOrder":1,"number":9,"question":"下列有關尿路結石(urolithiasis)的敘述何者有誤?","options":{"A":"Thiazide 可以用於鑑別診斷 Resorptive hypercalciuria，使 Renal hypercalciuria 病人 PTH 回到正常值","B":"當 sodium nitroprusside spot test 呈現紫色的時候可以診 斷 Cystinuria","C":"尿液的滯留是造成 Horseshoe Kidney 結石的主要原因","D":"懷孕時因為腎臟血流增加導致腎臟的鈣、鈉、尿酸濾出增加， 所以發生結石的機率是增加的","E":"懷孕時發生的結石以磷酸鈣為主"},"answer":"D","reference":"(110)/1.結石/參考資料 (摘錄自)：Campbell Walsh Wein Urology - 12th Edition, (91 章節, 2034, 2035 頁)( 92 章 節, 2052, 2060 頁)","sourcePage":3},{"id":"1-010","category":"結石","categoryOrder":1,"number":10,"question":"下列關於原發膀胱結石的敘述，何者正確？","options":{"A":"主要結石成分是草酸鈣和 ammonium acid urate，所以要限制 動物性蛋白質攝取","B":"因為成分有 ammonium acid urate，所以尿液是酸性的","C":"好發於 2-4 歲的男生","D":"常以急性尿滯留的方式表現","E":"移除後常常容易復發"},"answer":"C","reference":"(110)/1.結石/參考資料 (摘錄自)：Campbell Walsh Wein Urology - 12th Edition, (91 章節, 2048 頁)( 95 章節, 2114 頁)","sourcePage":3},{"id":"1-011","category":"結石","categoryOrder":1,"number":11,"question":"關於下尿路結石，下列敘述何者正確？","options":{"A":"原發性膀胱結石（Primary bladder stones）好發於小孩，且 男女比約 9 : 1；常為多發表現且移除後也容易復發","B":"次發性膀胱結石（Secondary bladder stones）常與潛在的膀 胱病理有關，易見於西方國家大於 60 歲的男性；可能源自於 上尿路排至膀胱後無法排出的膀胱結石（23~37%）或是膀胱內 異物所致的膀胱結石","C":"臨床上具有至少一種前列腺炎症狀的患者，其出現顯著前列腺 結石的可能性相較於年齡匹配（age-matched）的無症狀組會 高出 4.2 倍","D":"化療溶解(Chemo dissolution)作為膀胱結石的唯一治療方法 既耗時又不完全有效，所以不建議做為長期導尿管置放患者預 防導管所致結石的處置","E":"當人工新膀胱(Neobladder)、高危患者、裝有人工尿道括約肌 或陰莖假體等患者其發生膀胱結石時，體外震波碎石手術 （Extracorporeal shock wave lithotripsy, ESWL）是一種 很好的治療方式"},"answer":"E","reference":"(110)/1.結石/參考資料 (摘錄自)： Campbell-Walsh-Wein Urology, 12th, Chapter 95, p.2114-2120.","sourcePage":3},{"id":"1-012","category":"結石","categoryOrder":1,"number":12,"question":"關於腎臟結石，下列敘述何者正確？","options":{"A":"馬蹄腎的腎結石發生率約為 25~30%，大多數的結石由草酸鈣 與磷酸鈣組成，最常見的部位是腎盂和後下極腎盞；依據患者 的結石大小或位置，其可選擇的手術治療的方式有體外震波碎 石手術（Extracorporeal shock wave lithotripsy, ESWL）、 硬式輸尿管鏡（ureterorenoscopy, URS）、經皮穿腎截石術 （Percutaneous nephrolithotomy, PCNL）等","B":"對於直徑小於或等於 2 公分且電腦斷層掃描掃描下大於 1000 亨氏單位（Hounsfield unit, HU）的腎結石，體外震波碎石 手術（Extracorporeal shock wave lithotripsy, ESWL）的 結石廓清率約為 50~70%","C":"根據歐洲泌尿科協會（EAU）和美國泌尿科協會（AUA）尿路結 石治療指引，針對直徑小於或等於 2 公分、電腦斷層掃描掃描 下大於 1000 亨氏單位（Hounsfield unit, HU）或腎臟下部的 腎結石，軟式輸尿管鏡可做為第一線之治療方式","D":"針對直徑小於或等於 1 公分的腎結石，硬式輸尿管鏡 （ureterorenoscopy, URS）的結石廓清率約為 80~90%，且最 近的系列報告甚至有更高的結石廓清率；此外，URS 的結石廓 清率甚至與顯微經皮穿腎截石術（micro-Percutaneous nephrolithotomy, micro-PCNL）相當","E":"針對直徑大於或等於 2 公分的腎結石，經皮穿腎截石術 （Percutaneous nephrolithotomy, PCNL）可做為第一線之治 療方式；根據文獻回顧，PCNL 總體併發症的發生率約為 35~45%，如輸血率約 15~20%、胸部併發症約 5~10%、嚴重敗血 症約 3~5%、延遲性出血需要血管栓塞術約 3~5%、器官損傷約 1%、死亡約小於 1%"},"answer":"D","reference":"(110)/1.結石/參考資料 (摘錄自)： Campbell-Walsh-Wein Urology, 12th, Chapter 93, p.2069-2093.e10","sourcePage":3},{"id":"1-013","category":"結石","categoryOrder":1,"number":13,"question":"關於尿路結石的致病機轉（Pathogenesis），下列敘述何者錯誤？","options":{"A":"吸收性高鈣尿症(Absorptive hypercalciuria)的特點是血清 鈣正常，PTH 正常或抑制，空腹尿鈣正常，尿鈣升高","B":"腎性高鈣尿症（Renal hypercalciuria）是由於腎鈣的再吸收 不全，刺激 PTH 分泌而導致空腹高鈣尿症","C":"再吸收性高鈣尿症（Resorptive hypercalciuria）主要是由 於原發性甲狀旁腺功能亢進，但也可見於肉芽腫性疾病；因腺 體功能亢進造成 PTH 分泌過多，刺激腎臟合成 1,25-(OH)2D3， 致使腸道之鈣離子吸收增加，進而使血清鈣離子升高，最後造 成腎小球濾出的鈣離子增加","D":"尿酸結石（Uric acid stone）形成的最重要決定因素是尿液 的 pH 過低；其可能肇因於胰島素抗性（insulin resistance） 和過量酸生成導致的腎臟產氨作用（renal ammoniagenesis） 不全","E":"感染性結石的形成需要酸化尿液，當產生脲酶的細菌 （urease-producing bacteria）感染人體時，便會造成此種 狀況，並造成磷酸銨鎂（magnesium ammonium phosphate hexahydrate, MgNH PO •6H O)、磷酸鈣(calcium 4 4 2 phosphate)、碳磷灰石(carbonate apatite, Ca [PO ] • CO ) 10 4 6 3 等結石的生成"},"answer":"E","reference":"(110)/1.結石/參考資料 (摘錄自)： Campbell-Walsh-Wein Urology, 12th, Chapter 91, p.2005-2035.e9","sourcePage":4},{"id":"1-014","category":"結石","categoryOrder":1,"number":14,"question":"含鈣結石可能源於多個病因，下列何者最不適合:","options":{"A":"吸收性高鈣尿症","B":"原發性高草酸尿症","C":"腎臟性高鈣尿症","D":"原發性高鎂尿症","E":"骨鬆性高鈣尿症"},"answer":"D","reference":"(110)/1.結石/參考資料 (摘錄自)： Campbell-Wash Urology,11th edition, Vol 2, P.1182.","sourcePage":4},{"id":"1-015","category":"結石","categoryOrder":1,"number":15,"question":"尿路結石的流行率與下列何者最無相關性:","options":{"A":"糖尿病","B":"動脈硬化","C":"肥胖","D":"心血管疾病","E":"蛋白尿"},"answer":"E","reference":"(110)/1.結石/參考資料 (摘錄自)： Campbell-Wash Urology,11th edition, Vol 2, P.1173.","sourcePage":5},{"id":"1-016","category":"結石","categoryOrder":1,"number":16,"question":"腎結石形成的機轉，下列何者錯誤:","options":{"A":"尿液過飽和","B":"草酸鈣結石是最常見的結石","C":"在腎小管初始端的結晶多為磷酸鈣結石","D":"Tamm-Horsfall 蛋白是促進結石形成的因子","E":"體外震波碎石術有可能增加腎結石的發生"},"answer":"D","reference":"(110)/1.結石/參考資料 (摘錄自)： Campbell-Wash Urology,11th edition, Vol 2, P.1179.","sourcePage":5},{"id":"1-017","category":"結石","categoryOrder":1,"number":17,"question":"鈣結石是尿路結石的常見成份，關於鈣代謝，下列何者錯誤?","options":{"A":"鈣的吸收主要在小腸，依食物內的鈣攝取而定","B":"副甲狀腺素會促進腎小管內磷的再吸收，進而影響鈣代謝","C":"鈣的吸收與維生素 D 有相關","D":"飲食中草酸的吸收受到腸內鈣離子濃度的影響","E":"含鈣結石約佔所有腎結石的 80%"},"answer":"B","reference":"(110)/1.結石/參考資料 (摘錄自)： Campbell-Wash Urology,11th edition, Vol 2, P.1182.","sourcePage":5},{"id":"1-018","category":"結石","categoryOrder":1,"number":18,"question":"從電腦斷層影像預測輸尿管結石自行排出的可能性，最好的結石阻 塞預測因子?","options":{"A":"結石的密度(HU density)","B":"阻塞部位輸尿管壁的厚度","C":"阻塞部位上端輸尿管直徑","D":"阻塞部位下端輸尿管直徑","E":"腎盂積水的程度"},"answer":"B","reference":"(110)/1.結石/參考資料 (摘錄自)： Endouology.2021: Vol 35,N0.4.","sourcePage":5},{"id":"1-019","category":"結石","categoryOrder":1,"number":19,"question":"檸檬酸(Citrate)在尿液中扮演抑制結石生成的角色，下列敘述何 者正確?","options":{"A":"在含鈣結石(Calcium stone)病患中，病患除了低檸檬酸尿症 (hypocitraturia)外，並無其他明顯異常","B":"影響尿液中檸檬酸(Citrate)分泌最主要因素為 檸檬酸的攝 入量","C":"Type I renal tubular acidosis (Type I RTA)的病患，常會 表現高檸檬酸尿(Hypercitraturia)，其主要原因為 RTA 造成 的 metabolic acidosis，且為結石生成最主要的因素","D":"使用 Thiazide 治療結石，會導致高尿酸症，須注意尿酸結石 之生成","E":"檸檬酸鉀(Potassium Citrate) 治療尿路結石，須注意低血鉀 與腸胃道相關的副作用"},"answer":"D","reference":"(110)/1.結石/參考資料 (摘錄自)：Campbell- Walsh Urology, 11th Chapter 51, P 1182-1190","sourcePage":5},{"id":"1-020","category":"結石","categoryOrder":1,"number":20,"question":"與傳統 Non-contrast abd CT 相比，ultra-low dose CT 輻射降低 了幾倍?","options":{"A":"2 倍","B":"20 倍","C":"40 倍","D":"60 倍","E":"80 倍"},"answer":"B","reference":"(110)/1.結石/參考資料 (摘錄自)：AUA Update Series (2020) Lesson 20 Management of Asymptomatic Renal Calculi and Residual Fragments P197","sourcePage":6},{"id":"1-021","category":"結石","categoryOrder":1,"number":21,"question":"下列有關尿路結石相關的敘述何者正確 ?","options":{"A":"慢性腹瀉是導致高檸檬酸尿症的常見原因之一","B":"慢性便秘是導致高草酸尿症的常見原因之一","C":"第三型吸收性高尿鈣症 (Type III absorptive hypercalciuria)站結石形成原因的 5% ，主要是由腸道吸收 過多的鈣導致","D":"尿液酸性化可以幫助磷酸氨鎂結石的分解 (dissolution of struvite stone)","E":"使用碳酸酐酶抑制劑 (carbonic anhydrase inhibitors)有 50-60%發生尿路結石機會"},"answer":"D","reference":"(110)/1.結石/參考資料 (摘錄自)：Smith & Tanaghos general urology, 18th, Ch. 27, p. 249-279","sourcePage":6},{"id":"1-022","category":"結石","categoryOrder":1,"number":22,"question":"關於攝取水分與產生尿路結石的敘述何者為錯誤？","options":{"A":"一些大型觀察性研究發現喝水的量與尿路結石的發生率成反 比","B":"在一項前瞻性隨機分派試驗中發現，對第一次尿路結石的患者 建議大量攝取水分，並且排出大量尿液者的結石復發率約 12%，而未聽從建議的一組患者則復發率高達 27%","C":"地域性的差異會影響尿路結石的發生率","D":"所飲用的水不管是硬水還是軟水對於結石的發生率影響並沒 有定論","E":"以上敘述皆為錯誤"},"answer":"E","reference":"(110)/1.結石/參考資料 (摘錄自)：Campbell Urology 12th Edition, p.2009","sourcePage":6},{"id":"1-023","category":"結石","categoryOrder":1,"number":23,"question":"體外震波碎石對人體的生物影響 (bioeffect)何者敘述是正確的?","options":{"A":"對輸尿管遠端結石進行體外震波後，可能會立刻造成精蟲品質 下降，但通常在三個月內就會恢復正常","B":"有大型的研究證實體外震波碎石術與新產生的高血壓有關連 性","C":"體外震波碎石術會造成腎臟些微的損傷，因此有證據顯示和慢 性腎病的發生有關連性","D":"有大型的研究證實體外震波碎石術與糖尿病的進展 (development)有關連性","E":"接受過體外震波碎石術的患者有較高的機率結石復發"},"answer":"A","reference":"(110)/1.結石/參考資料 (摘錄自)：Campbell Urology 12th Edition, p.2097-2100","sourcePage":6},{"id":"1-024","category":"結石","categoryOrder":1,"number":24,"question":"讓體外震波碎石術有較佳治療效果的方式中何者是錯誤的？","options":{"A":"仔細選擇結石的位置和病人的體型來進行體外震波碎石術，可 增加結石的清除率","B":"利用較大的 F focal zone 可讓結石的再次處理率 2 (retreatment rate)下降","C":"震波頭與人體皮膚接觸的地方要塗上偶和介質(coupling medium)，避免有空氣的間隙，例如凝膠","D":"震波擊碎結石要像鈥雷射一樣，要以高頻率做 dusting 的效 果，震波頻率要以 120sw/min 的方式，結石才會夠粉碎較易排 出","E":"碎石過程中應常常以 X 光透視來確認結石碎裂的狀況，而非必 要擊發到預定的次數"},"answer":"D","reference":"(110)/1.結石/參考資料 (摘錄自)：Campbell Urology 12th Edition, p. 2100-2102","sourcePage":7},{"id":"1-025","category":"結石","categoryOrder":1,"number":25,"question":"下列關於結石生成抑制劑與其機轉之敘述，何者錯誤？","options":{"A":"Nephrocalcin 在近端腎曲小管和粗上升支中合成，可抑制單 水草酸鈣聚集","B":"Citrate 是草酸鈣和磷酸鈣結石的抑制劑","C":"Uropontin 可抑制草酸鈣生長，並減少晶體與腎臟上皮細胞的 結合","D":"Tamm-Horsfall 在尿中含量多，可抑制單水草酸鈣成長","E":"RNA 可抑制晶體成核(nucleation)與生長"},"answer":"D","reference":"(110)/1.結石/參考資料 (摘錄自)： CAMPBELL-WALSH UROLOGY 12ed. P.2014","sourcePage":7},{"id":"1-026","category":"結石","categoryOrder":1,"number":26,"question":"根據 EAU Guidelines (2021)，下列何者非結石患者(stone former) 得到 chronic kidney disease/end-stage kidney disease 的風險 因子？","options":{"A":"Female gender","B":"Struvite stones","C":"Previous obstructive nephropathy","D":"Febrile UTI","E":"Ileal conduit"},"answer":"D","reference":"(110)/1.結石/參考資料 (摘錄自)： CAMPBELL-WALSH UROLOGY 12ed P.2009-2062 & EAU-Guidelines-on-Uro lithiasis-2021","sourcePage":7},{"id":"1-027","category":"結石","categoryOrder":1,"number":27,"question":"EAU Guidelines (2021)將腎結石與慢性腎病(CKD)風險分為四個等 級(possible, moderate, high, and very high risk)，何者正確？","options":{"A":"結石在 single kidney 為非常高風險","B":"primary hyperoxaluria 為中度風險","C":"cystine stones 為高風險","D":"autosomal recessive polycystic kidney 為非常高風險","E":"neurological bladder 為可能風險"},"answer":"C","reference":"(110)/1.結石/參考資料 (摘錄自)： CAMPBELL-WALSH UROLOGY 12ed P.2009-2062 & EAU-Guidelines-on-Uro lithiasis-2021","sourcePage":7},{"id":"1-028","category":"結石","categoryOrder":1,"number":28,"question":"一名 40 歲的女性，在評估反覆尿路感染時發現了一顆 2.5 公分大 的磷酸銨鎂結石(Struvite)，因此接受了 PCNL。 術中使用超音波 導引從第 11 肋骨上穿刺進入，手術過程平順。但在手術完成後術 中的 X-ray 發現到一個非常小的水胸(hydrothorax)。病人的血液 動力學或呼吸系統都沒有受損的跡象。接下來的步驟是?","options":{"A":"先拔管，在恢復室先照一張胸部 X 光片並諮詢胸外科是否放 置 pig-tail","B":"先拔管，持續觀察胸部 X 光，若胸水擴大或患者出現發燒、 呼吸不穩，則放置胸管","C":"先不拔管，轉加護病房。持續觀察胸部 X 光，若胸水擴大或 患者出現發燒、呼吸不穩，則放置胸管","D":"術中抽吸胸水，然後連續胸片觀察是否拔管","E":"術中直接放置胸管引流"},"answer":"E","reference":"(110)/1.結石/參考資料 (摘錄自)：AUA Update Series (2021) Lesson 16: Complications of Percutaneous Nephrolithotomy P152 &158","sourcePage":7},{"id":"1-029","category":"結石","categoryOrder":1,"number":29,"question":"哪些是 SWL 後發展為尿石街(steinstrasse)的風險因素包括","options":{"A":"結石體積大、shock wave rate 太快、肥胖","B":"Hounsfield unit 高、shock wave rate 太快、肥胖","C":"術前放 stent、腎積水、SWL 能量設定過高","D":"結石體積大、術前放 stent、Hounsfield unit 高","E":"結石體積大、Hounsfield unit 高、腎積水"},"answer":"E","reference":"(110)/1.結石/參考資料 (摘錄自)：AUAUpdate Series (2021) Lesson 11: Complications of Shock Wave Lithotripsy P111","sourcePage":8},{"id":"1-030","category":"結石","categoryOrder":1,"number":30,"question":"為了在 SWL 後，有最佳的 stone-free rate 及儘量減少 SWL 時的腎 損傷，我們可以如何調整?","options":{"A":"將震波頻率(shock wave rate)設置為每分鐘 120 次，來盡快 完成治療","B":"使用 ramping protocol，將震波頻率(shock wave rate)設置 為每分鐘 120 次，並提供計劃的最大擊發次數","C":"使用耦合凝膠(Coupling Gel)引入氣泡，將震波頻率(shock wave rate)設置為每分鐘 90 次，並提供計劃的最大擊發次數","D":"將震波頻率(shock wave rate)設置為每分鐘 60 到 90 次， 減少對耦合凝膠(Coupling Gel)的處理(minimal handling) 並使用常規影像","E":"使用 ramping protocol，將震波頻率(shock wave rate)設置 為每分鐘 90 到 120 次，減少對耦合凝膠(Coupling Gel)的處 理(minimal handling)並使用常規影像"},"answer":"D","reference":"(110)/1.結石/參考資料 (摘錄自)：AUAUpdate Series (2021) Lesson 11: Complications of Shock Wave Lithotripsy P111","sourcePage":8},{"id":"1-031","category":"結石","categoryOrder":1,"number":31,"question":"有關於尿路結石的影像學評估何者正確？","options":{"A":"超音波是非侵入性的檢查，有無輻射傷害、敏感度 (sensitivity)高的優點，然而特異性(specificity)較低是其 缺點","B":"靜脈注射顯影劑的腎盂顯影 (intravenous pyelography)也 是臨床上常用的檢查，其特異性、敏感度都比無顯影劑的 KUB 高，且輻射暴露是電腦斷層的十分之一","C":"無顯影劑電腦斷層 (Non-contrast CT)是診斷尿路結石的 gold standard，敏感度與特異性分別可以高達 98%與 97%；然 而讓病人造成輻射暴露是其缺點，平均一個無顯影劑的腹骨盆 腔電腦斷層的輻射劑量大約是 10 毫西弗(mSV)","D":"對於無法接受輻射暴露的患者，核磁共振(MRI)也是評估尿路 結石的檢查之一，敏感度與特異性較無顯影劑電腦斷層更高， 然而檢查費時是其缺點","E":"對於懷孕患者，因其不能接受輻射暴露的檢查，核磁共振是第 一線檢查工具"},"answer":"C","reference":"(110)/1.結石/參考資料 (摘錄自)：Campbell Walsh Wein Urology - 12th Edition Ch 92. 2037-2040","sourcePage":8},{"id":"1-032","category":"結石","categoryOrder":1,"number":32,"question":"下列有關於腎臟結石的論述何者為是？","options":{"A":"腎臟結石在小於 20 歲的族群相對少見，但近年來兒童發生腎 結石的盛行率在以每年 5-10%上升中","B":"在美國人口中以非洲裔美國人的盛行率最高，其次是拉丁裔， 再其次是白人，最低的是亞裔美國人","C":"來自美國國家健康與營養調查[National Health and Nutrition Examination Survey (NHANES)]的資料顯示在 2007-2010 年腎結石的盛行率已來到 18.8%","D":"早年男性尿路結石的發生率遠大於女性，近期的研究則發現男 女性的結石發生率沒有差異","E":"據台灣健保資料庫的研究，最常因為腎結石、輸尿管結石、腎 絞痛而就醫的月份在 6 月"},"answer":"A","reference":"(110)/1.結石/參考資料 (摘錄自)：Campbell Walsh Wein Urology - 12th Edition, Ch91 pg.2005 -2010.","sourcePage":9},{"id":"1-033","category":"結石","categoryOrder":1,"number":33,"question":"下列關於結石的礦物質代謝，何者為是？","options":{"A":"25-羥維生素 D3(25-hydroxyvitamin D3)會受到低血磷或者副 甲狀腺素的刺激在肝臟轉換成 1,25-二羥維生素 D3(1,25(OH)2D3)","B":"鈣的再吸受主要發生在近曲小管(proximal tubule) 和亨爾 式環的粗上升支(thick ascending limb of the loop of Henle)，而亨爾式環的粗上升支的再吸受是透過主動運輸來執 行","C":"鎂的吸收是透過維生素 D 來調節；鎂的吸收主要發生在小腸， 以被動運輸佔多數","D":"草酸的吸受主要發生在小腸，其中佔了大約 80%，其餘的在大 腸吸收","E":"磷主要在小腸吸收，除了維生素 D，腸道 pH 值(luminal pH) 也會影響磷的吸收，較低的 pH 值會促進磷的運輸"},"answer":"C","reference":"(110)/1.結石/參考資料 (摘錄自)：Campbell Walsh Wein Urology - 12th Edition, Ch91 pg. 2015, 2016, 2017","sourcePage":9},{"id":"1-034","category":"結石","categoryOrder":1,"number":34,"question":"下列有關於尿路結石的手術治療，何者為非？","options":{"A":"對於年長病患，經皮腎臟造廔取石(PCNL)手術成功率並不比年 輕病患低，但是產生併發症的機會較高","B":"病態性肥胖的患者，體外震波碎石(ESWL)的成功率會因皮膚至 結石距離(skin-to-stone distance)過長而降低。Perks et al.(2008)指出對於單一 0.5-2 公分的結石其皮膚至結石距離 小於 9 公分且石頭在電腦斷層的衰減度(attenuation)小於 900 HU，體外震波碎石有高於 9 成的治療成功機會","C":"對於做過尿路改道(urinary diversion)的結石患者接受體外 震波的成功率較低，大約 6-7 成","D":"對於腎移植的結石患者，接受經皮腎造廔取石的成功率約為明 顯低於未接受移植的結石患者","E":"Newman et al 在 1988 提出在體外震波碎石後臨床無意義殘餘 碎片(clinically insignificant residual fragments, CIRF) 的定義是小於等於 4mm 且未造成阻塞、無感染、無症狀的碎片"},"answer":"D","reference":"(110)/1.結石/參考資料 (摘錄自)：Campbell Walsh Wein Urology - 12th Edition Ch 93. 2090-2093","sourcePage":9},{"id":"1-035","category":"結石","categoryOrder":1,"number":35,"question":"根據 2022 European Association of Urology (EAU)尿路結石治 療建議指引，下列敘述何者錯誤？","options":{"A":"進行結石治療前，常規尿液檢查或尿液細菌培養鑑定是必要的","B":"若病患有泌尿道感染時，是絕對不可接受侵入性結石手術治療 的","C":"病患在接受結石手術治療前，預防性抗生素是建議給予的。","D":"孕婦尿路結石時，絕對不可以為其施行 Extracorporeal shock wave lithotripsy (ESWL)","E":"當病患的尿路結石是必要處理之狀況，且病患之抗凝血劑或抗 血栓製劑無法停用時，逆行性硬式/軟式輸尿管鏡結石碎石術 是可以考慮的手術治療方式"},"answer":"B","reference":"(111) 參考資料(摘錄自)：2022 European Association of Urology (EAU)結石治 療建議指引 http://uroweb.org/gui deline/urolithiasis/","sourcePage":10},{"id":"1-036","category":"結石","categoryOrder":1,"number":36,"question":"關於下尿路結石，下列敘述何者正確？","options":{"A":"臨床上具有至少一種前列腺炎症狀的患者，其出現顯著前列 腺結石的可能性相較於年齡匹配（age-matched）的無症狀組 會高出 5.8 倍","B":"原發性膀胱結石（Primary bladder stones）好發於小孩， 且男女比約 9 : 1；常為多發表現且移除後也容易復發","C":"次發性膀胱結石（Secondary bladder stones）常與潛在的 膀胱病理有關，易見於西方國家大於 40 歲的男性；可能源自 於上尿路排至膀胱後無法排出的膀胱結石（23~37%）或是膀胱 內異物所致的膀胱結石","D":"當人工新膀胱(Neobladder)、高危患者、裝有人工尿道括約 肌或陰莖假體等患者其發生膀胱結石時，體外震波碎石手術 （Extracorporeal shock wave lithotripsy, ESWL）是一種 很好的治療方式","E":"化療溶解(Chemo dissolution)作為膀胱結石的唯一治療方法 既耗時又不完全有效，所以不建議做為長期導尿管置放患者預 防導管所致結石的處置"},"answer":"D","reference":"(111)/1.結石/參考資料 ( 摘錄自)： Campbell-Walsh-Wein Urology, 12th, Chapter 95, p.2114-2120.","sourcePage":10},{"id":"1-037","category":"結石","categoryOrder":1,"number":37,"question":"關於尿路結石的致病機轉（Pathogenesis），下列敘述何者錯誤？","options":{"A":"腎性高鈣尿症（Renal hypercalciuria）是由於腎鈣的再吸收 不全，刺激 PTH 分泌而導致空腹高鈣尿症。","B":"感染性結石的形成需要酸化尿液，當產生脲酶的細菌 （urease-producing bacteria）感染人體時，便會造成此種 狀況，並造成磷酸銨鎂（magnesium ammonium phosphate hexahydrate, MgNH PO •6H O)、磷酸鈣(calcium 4 4 2 phosphate)、碳磷灰石(carbonate apatite, Ca [PO ] • CO ) 10 4 6 3 等結石的生成。","C":"尿酸結石（Uric acid stone）形成的最重要決定因素是尿液 的 pH 過低；其可能肇因於胰島素抗性（insulin resistance） 和過量酸生成導致的腎臟產氨作用（renal ammoniagenesis） 不全。","D":"腎性高鈣尿症（Renal hypercalciuria）是由於腎鈣的再吸收 不全，刺激 PTH 分泌而導致空腹高鈣尿症。","E":"再吸收性高鈣尿症（Resorptive hypercalciuria）主要是由 於原發性甲狀旁腺功能亢進，但也可見於肉芽腫性疾病；因腺 體功能亢進造成 PTH 分泌過多，刺激腎臟合成 1,25-(OH)2D3， 致使腸道之鈣離子吸收增加，進而使血清鈣離子升高，最後造 成腎小球濾出的鈣離子增加。"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th, Chapter 91, p.2005-2035.e9","sourcePage":10},{"id":"1-038","category":"結石","categoryOrder":1,"number":38,"question":"關於尿路結石之治療，下列敘述何者正確？","options":{"A":"針對直徑小於或等於 1 公分的腎結石，硬式輸尿管鏡 （ureterorenoscopy, URS）的結石廓清率約為 80~90%，且最 近的系列報告甚至有更高的結石廓清率；此外，URS 的結石廓 清率甚至與顯微經皮穿腎截石術（micro-Percutaneous nephrolithotomy, micro-PCNL）相當。","B":"對於直徑小於或等於 2 公分且電腦斷層掃描掃描下大於 1000 亨氏單位（Hounsfield unit, HU）的腎結石，體外震波碎石 手術（Extracorporeal shock wave lithotripsy, ESWL）的 結石廓清率約為 50~70%。","C":"針對直徑大於或等於 2 公分的腎結石，經皮穿腎截石術 （Percutaneous nephrolithotomy, PCNL）可做為第一線之治 療方式；根據文獻回顧，PCNL 總體併發症的發生率約為 35~45%，如輸血率約 15~20%、胸部併發症約 5~10%、嚴重敗血 症約 3~5%、延遲性出血需要血管栓塞術約 3~5%、器官損傷約 1%、死亡約小於 1%。","D":"若病患長期因複雜性腎結石所致患側之腎臟功能不全 (腎絲 球過濾率, eGFR < 15%)，針對患側執行腎臟切除手術是絕對 不建議的結石治療方式。","E":"若病患因輸尿管結石已嘗試 6 至 8 周的保守藥物治療後，結石 仍未排除，倘若病患欲繼續觀察並佐以藥物治療，我們可順其 要求，並不需為其提供更近一步的積極處理。"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th, Chapter 93, p.2069-2093.e10","sourcePage":11},{"id":"1-039","category":"結石","categoryOrder":1,"number":39,"question":"關於體外震波碎石手術（Extracorporeal shock wave lithotripsy, ESWL），下列敘述何者錯誤？","options":{"A":"ESWL 的衝擊波（shock wave）是通過多種不同的機制，如壓 縮力、拉力等將石頭破碎","B":"可以通過在低功率設置下開始治療並以緩慢的速度將功率提 高到標準治療能量來減少 ESWL 造成的併發症","C":"ESWL 與腎臟的解剖損傷有關，且迄今對人體的廣泛研究顯示 ESWL 對人體並不會造成長期的併發症","D":"通過確保患者與碎石機的最佳耦合、以慢速到中速（60 次電 擊/分鐘）進行治療、提高功率設置以及使用全身麻醉進行治 療等，皆可以增強 ESWL 治療的有效性","E":"根據文獻統計，病態性肥胖症（Morbid Obesity）的病患，通 過適當的麻醉、精確的定位與碎石機能量之調整，並不會減低 ESWL 碎石的成功機率"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th, Chapter 94, p.2094-2113.e3 and Chapter 93, 2069-2093.e10","sourcePage":11},{"id":"1-040","category":"結石","categoryOrder":1,"number":40,"question":"根據美國泌尿科學會指引(AUA guideline)2016 版關於結石處理的 原則，下列何者錯誤？","options":{"A":"孕婦之輸尿管結石，因輸尿管生理角度改變，其自行排出的比 率較低","B":"接受 PCNL 之兒童，術前應接受不含顯影劑之低劑量電腦斷層 掃描","C":"內視鏡手術術中，發現膿尿時，應立即建立引流方式且中斷手 術","D":"軟式腎臟鏡(Flexible nephroscopy)應為標準(standard) PCNL 手術之慣例步驟","E":"超過 10mm 的下端(lower pole)腎臟結石不應以體外震波碎石 為第一線治療"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Surgical Management of Stones: AUA/Endourology Society Guideline (2016) 詳解：孕婦結石排除率與 常人無異，若症狀控制良 好，應以保守觀察為第一 線治療。","sourcePage":12},{"id":"1-041","category":"結石","categoryOrder":1,"number":41,"question":"關於結石的流行病學，下列敘述何者錯誤？","options":{"A":"結石的發生跟體重和 BMI 有直接正向關係，這個正向關係對於 男性與女性都一樣","B":"結石發生率跟水質有關係，飲用硬水比軟水得到結石機會高","C":"高 BMI 的人得結石比例較高原因是比低 BMI 的人排出更多的草 酸鹽、尿酸、鈉離子、磷離子","D":"肥胖跟尿酸結石形成的關聯主要受尿液 pH 值影響","E":"結石發生跟心臟血管疾病也呈正相關"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 11th, p1173","sourcePage":12},{"id":"1-042","category":"結石","categoryOrder":1,"number":42,"question":"以下哪一個不是結石形成的抑制劑？","options":{"A":"檸檬酸鹽 Citrate","B":"腎鈣素 Nephrocalcin","C":"尿橋蛋白 uropontin","D":"物質Ａ Substance A","E":"Tamm-Horsfall 蛋白"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 11th, p1179","sourcePage":12},{"id":"1-043","category":"結石","categoryOrder":1,"number":43,"question":"下列何種病菌可能產生脲酶（Urease）比率大大低於其他者？","options":{"A":"Cryptococcus","B":"Klebsiella pneumoniae","C":"Proteus morganii","D":"Staphylococcus aureus","E":"T-strain Mycoplasma"},"answer":"B","reference":"(111)/1.結石/參考資料 (摘錄自)： Campbell-Walsh Urology 11th, p1195","sourcePage":12},{"id":"1-044","category":"結石","categoryOrder":1,"number":44,"question":"下列關於結石與懷孕婦女的關係，何者錯誤？","options":{"A":"大多數有症狀的結石發生在妊娠中期與晚期（2nd & 3rd trimesters）","B":"高達 90%的孕婦會出現生理性腎積水(Physiologic hydronephrosis)，並持續至產後 4 ~ 6 週","C":"大多數生理性積水發生在左側","D":"造成孕婦生理性腎積水原因可能是黃體素（progesterone）、 妊娠子宮（gravid uterus）、子宮靜脈充血（engorged uterine vein）","E":"懷孕婦女腎臟的生理變化是腎血流量增加，導致腎小球濾過率 增加 30～ 50%，從而增加濾過的鈣、鈉和尿酸"},"answer":"C","reference":"(111)/1.結石/參考資料 (摘錄自)： Campbell-Walsh Urology 11th, p1199","sourcePage":13},{"id":"1-045","category":"結石","categoryOrder":1,"number":45,"question":"懷孕婦女發生結石處理原則，下列敘述何者錯誤？","options":{"A":"孕婦暴露輻射線可能會導致畸胎，普遍來說輻射劑量閾值< 50 mGy 被認為是安全的","B":"如果孕婦真的要照輻射線，最好是第 8 週之前或第 23 週之後","C":"核磁共振檢查（MRI）優於電腦斷層(CT)，能量建議是 1.5 Tesla (T) MRI","D":"體外震波（ESWL）與經皮穿腎取石手術（PNL）都是絕對禁忌 症","E":"孕婦的輸尿管鏡檢查最好在妊娠中期（2nd trimester）由經驗 豐富的泌尿科醫生進行。同時也要照會新生兒科和產科醫師"},"answer":"D","reference":"(111) 參考資料(摘錄自)：EAU guideline 2022 on Urolithiasis/ 3. Guidelines/ 3.3.3., 3.4.14.","sourcePage":13},{"id":"1-046","category":"結石","categoryOrder":1,"number":46,"question":"關於原發性高草酸尿，以下何者為非?","options":{"A":"定義是尿中草酸一天超過 40 mg","B":"是屬於體染色體隱性遺傳","C":"第一型最具侵襲性，通常在 20-30 歲進展到洗腎，如果要治療 建議肝臟及腎臟移植","D":"第二型是因為肝臟 glyoxylate reductase/hydroxypyruvate reductase (GRHPR)缺乏，如果進展到腎臟衰竭，治療方式以 單純腎臟移植即可","E":"第三型原發性高草酸尿是因為 4-hydroxy-2-oxoglutarate aldolase (HOGA)變異，進展到腎臟衰竭機率和第二型差不 多，治療方式以單純腎臟移植即可"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell urology 12th, p 2021","sourcePage":13},{"id":"1-047","category":"結石","categoryOrder":1,"number":47,"question":"主要影響尿中檸檬酸的排泄量的是以下何者?","options":{"A":"血液酸鹼值","B":"尿中鈉的含量","C":"檸檬酸的攝入量","D":"胰島素敏感性","E":"尿中鈣的含量"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell urology 12th, p2024","sourcePage":13},{"id":"1-048","category":"結石","categoryOrder":1,"number":48,"question":"關於馬蹄腎的結石處理以下何者為非?","options":{"A":"結石發生率約 15-20%","B":"2 公分以上的結石，PCNL 碎石率和一般腎臟差不多","C":"如果選擇 PCNL，肋膜損傷風險較一般腎臟風險稍高，故建議 要術前電腦斷層評估","D":"1.5 cm 以下不在下極的結石可以考慮以輸尿管鏡或是體外震 波的方式碎石","E":"最常見的結石位置在腎盂和後下極腎盞"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell urology 12th, p2078","sourcePage":14},{"id":"1-049","category":"結石","categoryOrder":1,"number":49,"question":"有關尿路結石的敘述何者為非？","options":{"A":"上尿路結石的發生率是男大於女","B":"取高的 BMI 及體重有較高的風險罹患尿路結石","C":"尿路結石與許多慢性疾病有關，例如糖尿病、代謝症候群、慢 性腎病等","D":"尿路結石的成分例如草酸鈣在正常人體尿液中的濃度與在水 中的溶解度是相同的","E":"Randall plague 的位置是在亨氏彎細枝的 基底膜(basement membrane)形成"},"answer":"D","reference":"(111) 參考資料(摘錄自)： (A)(B)(C) Campbell-Walsh Urology 12th Chap 91, P. 2009 (D) Campbell-Walsh Urology 12th Chap 91, P. 2010 (E) Campbell-Walsh Urology 12th Chap. 91, P. 2011","sourcePage":14},{"id":"1-050","category":"結石","categoryOrder":1,"number":50,"question":"下列有關鈣的代謝的敘述何者為是？","options":{"A":"同時攝取富含鈣質的豆腐加上富含草酸的菠菜會增加草酸鈣 的吸收使草酸鈣結石的發生機會增加","B":"太陽照射皮膚可以幫助把 7-dehydrocholesterol 轉化為 previtamin D ，previtamin D 隨後於腎臟近曲小管羥化為 3 3 25(OH)D ，再到小腸中促進鈣質吸收 3","C":"吸收型高尿鈣症(Absorptive hypercalciuria)由於飲食吸收 過多的鈣，會持續使血中鈣濃度上升，進而使腎臟對鈣的過濾 增加","D":"限制鈣質的攝取對於治療第一型吸收型高尿鈣症(Type 1 Absorptive hypercalciuria)的治療是沒有幫助的","E":"Thiazide 類藥物能夠降低腎臟排出鈣，可用來治療再吸收型 高尿鈣症(resorptive hypercalciuria)，以減少尿中鈣離子 濃度"},"answer":"D","reference":"(111) 參考資料(摘錄自)： (A)(B) Campbell-Walsh Urology 12th Chap.91, P. 2015 (C)(D) Campbell-Walsh Urology 12th Chap.91, P. 2019 (E) Campbell-Walsh Urology 12th Chap.91, P. 2020","sourcePage":14},{"id":"1-051","category":"結石","categoryOrder":1,"number":51,"question":"請問下列哪種食物不屬於高草酸含量的食物？","options":{"A":"大黃(Rhubarb)","B":"甜菜(Beets)","C":"堅果(Nuts)","D":"青花菜(Broccoli)","E":"馬鈴薯(Potatoes)"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th Chap.91, P. 2023","sourcePage":15},{"id":"1-052","category":"結石","categoryOrder":1,"number":52,"question":"一位 40 歲的婦女長期在你的門診追蹤腎臟結石，經過結石分析發 現主要成分為磷酸鈣，你會給她什麼治療的建議？","options":{"A":"Brushite stone 的尿液酸鹼值超過 6.8，治療可以使用 L-甲 硫胺酸(L-methionine)來酸化尿液","B":"高尿鈣症引起的磷酸鈣結石可以用 hydrochlorothiazide 治 療，起始劑量為 25mg/day","C":"Brushite stone 和泌尿道感染相關，所以容易復發，治療結 石之前必須先控制泌尿道感染","D":"介於一至兩公分大小以內的 Brushite stone 建議做體外震波 碎石治療，而超過兩公分以上的則建議以內視鏡手術為主","E":"病人被檢查出有原發性副甲狀腺功能亢進，建議以降鈣素 (Calcitonin)治療，治療劑量為 100 IU/day"},"answer":"B","reference":"(111)/1.結石/參考資料 (摘錄自)： (A)(B)(C)(E) EAU guideline: Urolithiasis, 4.5 Calcium phosphate stones (D) Campbell-Walsh Urology 12th Chap.93, P. 2077","sourcePage":15},{"id":"1-053","category":"結石","categoryOrder":1,"number":53,"question":"一位病人來到你的診間，主述在健康檢查發現有腎臟結石。你幫病 人排了電腦斷層後發現病人是馬蹄腎，請問哪個敘述最適當？","options":{"A":"位於上腎盞(upper pole calyces)一公分大的結石可以用體外 震波來處理","B":"位於下腎盞(lower pole calyces)一公分大的結石較適合用體 外震波來處理","C":"位於下腎盞(lower pole calyces)兩公分大的結石可以選擇經 皮腎造廔取石術，但由於馬蹄腎的結構異常，石頭的清除率相 較於一般正常的腎臟為低","D":"由於馬蹄腎輸尿管進入腎盂的交界處(ureteropelvic junction)較一般正常腎臟低，所以在處理上腎盞的結石時容 易有角度受限的情況","E":"馬蹄腎的 upper pole 會比一般腎臟還要來的偏後外側，所以 經皮腎造廔取石術的通道(Tract)建立也會比做一般腎臟還要 外側，打洞時要特別注意避免傷害到大腸"},"answer":"A","reference":"(111) 參考資料(摘錄自)： (A)(B) Campbell-Walsh Urology 12th Chap.93, P. 2078 (C) Campbell-Walsh Urology 12th Chap.93, P. 2080 (D) Campbell-Walsh Urology 12th Chap.93, P. 2079 (E) Campbell-Walsh Urology 12th Chap.93, P. 2080","sourcePage":15},{"id":"1-054","category":"結石","categoryOrder":1,"number":54,"question":"下列關於結石 chemolysis 何者敘述錯誤?","options":{"A":"Percutaneous irrigation chemolysis 可能是感染結石的一 種選擇，理論上也適用於尿酸結石","B":"由尿酸或磷酸銨組成的結石，可以通過 Oral chemolysis 來溶 解","C":"Oral chemolitholysis 是基於通過應用鹼性檸檬酸鹽或碳酸 氫鈉鹼化尿液","D":"Chemolysis 在較高的 pH 值下更有效，但可能會促進磷酸鈣 結石的形成","E":"Alkalinisation 加上 Tamsulosin 可增加遠端輸尿管尿酸結石 的排出率"},"answer":"B","reference":"(111)/ 參考資料(摘錄自)：2022 EAU guidelines Urolithiasis 3.4.4. Chemolysis (B) Stones composed of uric acid, but not sodium or ammonium urate stones, can be dissolved by oral chemolysis.","sourcePage":15},{"id":"1-055","category":"結石","categoryOrder":1,"number":55,"question":"下列結石成分與其預防藥物(Pharmacological substances)配對 何者錯誤?","options":{"A":"Uric acid - Febuxostat","B":"Calcium oxalate - Pyridoxine","C":"Calcium phosphate- Sodium bicarbonate","D":"Calcium oxalate – Allopurinol","E":"2,8-Dihydroxyadenine – Allopurinol"},"answer":"C","reference":"(111)/ 參考資料(摘錄自)：2022 EAU guidelines Urolithiasis 4.3.1. Table 4.6 (C) Sodium bicarbonate is for Calcium oxalate, Uric acid, Cystine","sourcePage":16},{"id":"1-056","category":"結石","categoryOrder":1,"number":56,"question":"下列何者不是 Obligate urease-producing bacteria?","options":{"A":"Corynebacterium urealyticum","B":"Providencia stuartii","C":"Providencia rettgeri","D":"Morganella morganii","E":"Ureaplasma urealyticum"},"answer":"B","reference":"(111)/ 參考資料(摘錄自)： 2022 EAU guidelines Urolithiasis 4.8.3. Table 4.10 (B)Providencia stuartii 是 Facultative urease-producing bacteria","sourcePage":16},{"id":"1-057","category":"結石","categoryOrder":1,"number":57,"question":"下列有關結石手術，何者敘述錯誤?","options":{"A":"未校正的凝血障礙(Uncorrected coagulopathy)是體外震波 碎石術(SWL)和經皮腎造廔取石術(PCNL)的絕對禁忌症，可進 行輸尿管鏡手術(URS)，但會增加手術的併發症(morbidity)","B":"先前的腎臟手術不是經皮腎造廔取石術(PCNL)手術的絕對禁 忌症","C":"對於無法暫停抗血小板製劑的病人，可以使用輸尿管鏡(URS) 加上 holmium:yttrium-aluminum-garnet (Ho:YAG)雷射碎石 手術","D":"老長者的經皮腎造廔取石術(PCNL)成功率和年輕人相比基本 沒有變化，但併發症發生率較高","E":"大多數數據證實，結石廓清率 (stone-free rates)不受肥胖 影響，但主要併發症發生率較高"},"answer":"A","reference":"(111)/ 參考資料(摘錄自)： Campbell Walsh Wein Urology - 12th Edition page 2089-2090 (A) 不會增加 Uncorrected coagulopathy is a contraindication to SWL and PCNL; however, URS can be successfully undertaken in such circumstances with little to no increase in surgical morbidity.","sourcePage":16},{"id":"1-058","category":"結石","categoryOrder":1,"number":58,"question":"關於胱氨酸尿症(Cystinuria)之敘述，下列何者為非?","options":{"A":"治療胱氨酸尿症(Cystinuria)的主要目標是通過降低胱氨酸 (cystine)濃度（低於 250 mg/L）和增加胱氨酸溶解度來降低 結石形成的風險","B":"α-Mercaptopropionylglycine (Tiopronin)是首選的硫醇藥 物，因為它的副作用較少","C":"胱氨酸尿症(Cystinuria)是於 SLC3A1 和 SLC7A9 基因突變 導致遠端小管吸收失敗的遺傳性疾病","D":"胱氨酸尿症(Cystinuria)的一線治療包括補水、限鈉/蛋白質 和鹼化尿液","E":"對於對飲食調整和鹼化反應不好的病人，建議使用硫醇藥物 (Thiol drugs)"},"answer":"C","reference":"(111)/1.結石/參考資料 (摘錄自)：Campbell Walsh Wein Urology - 12th Edition page 2061, 2063 (C)近端小管","sourcePage":17},{"id":"1-059","category":"結石","categoryOrder":1,"number":59,"question":"一位 Lesch-Nyhan syndrome 患者，因痛風問題長期以 Allopurinol 控制高尿酸血症，最近右腰痠痛前來你的門診並在電腦斷層發現有 右側輸尿管結石，請問下列敘述何者正確?","options":{"A":"可能有先天 purine salvage enzyme GRHPR 缺失的問題，使得 結石容易發生","B":"若結石成分為 Xanthine stone，理論上在 KUB 即可顯影，未 必需要電腦斷層檢查","C":"Xanthine stone 無法溶解，給予 potassium citrate 鹼化尿 液沒有幫助","D":"Allopurinol 可降低血中尿酸濃度，改善 metabolism 缺失， 進而降低 xanthine 結石形成機會","E":"以上皆非"},"answer":"C","reference":"(112) /1.結石/參考資 料(摘錄自)： 解題說明請註明 1. Campbell 2. 12 版次 2032 頁次","sourcePage":17},{"id":"1-060","category":"結石","categoryOrder":1,"number":60,"question":"下列關於體內碎石手術何者有誤?","options":{"A":"親水性電擊碎石術 electrohydraulic lithotripsy 其電擊產 生的震波是未聚焦的，而且當能量達到 1300 毫焦耳時，產生 的泡泡直徑可超過 1.5 公分","B":"無論結石的成分種類，鈥雷射均能將結石擊碎為其優點之一","C":"當鈥雷射碎石的能量設定為較低焦耳、頻率設定為較高赫茲， 產生的碎石較大較適合使用器械將碎石取出","D":"當鈥雷射碎石機的頻率設定 50 赫茲或以上搭配較低雷射能量 其產生的碎石大小相較於低頻率的雷射產生的碎石較小","E":"超聲碎石術(ultrasonic lithotripsy)的原理為由電能驅動 共振版發出 23000 至 25000 赫茲的超聲波擊碎石頭，但組織不 會隨超聲波共振"},"answer":"C","reference":"(112)參考資料(摘錄自) Campbell-Walsh-W ein Urology, 12th edition, 2021, Chapter 43 p858 (A) chapter 94, p2105 (B)p2110 (C)p2111, fragmentation mode 能 量應為 0.6-1.0J 較高能 量, 頻率應為 6-10Hz 較 低能量 (D)p2111 (E)p2112","sourcePage":17},{"id":"1-061","category":"結石","categoryOrder":1,"number":61,"question":"針對 Renal calculi 與其結晶名字的配對，何者錯誤?","options":{"A":"Calcium oxalate monohydrate 的結晶名字是 Whewellite","B":"Tricalcium phosphate 的結晶名字是 Whitlockite","C":"Calcium oxalate dihydrate 的結晶名字是 Weddellite","D":"Calcium hydrogen phosphate dihydrate 的結晶名字是 Brushite","E":"Magnesium ammonium phosphate 的結晶名字是 Whitelace"},"answer":"E","reference":"(112) 參考資料(摘錄自)：Chap 92 P.2045 (E)Struvite","sourcePage":18},{"id":"1-062","category":"結石","categoryOrder":1,"number":62,"question":"有關下泌尿道結石，何者錯誤?","options":{"A":"攝護腺結石患者，常合併 Escherichia coli, enterococci, Klebsiella species 感染，進行攝護腺按摩後之分泌物 (expressed prostatic secretions, EPS)出現較多的白血 球，且與攝護腺癌發生位置無關","B":"尿道結石可分為原發結石(primary urethral calculi)與移行 結石(migratory urethral calculi)，依據結石成分分析後發 現，移行結石主要來自膀胱結石","C":"膀胱切開取石術 (Open cystolithotomy)已非現今處理巨大 膀胱結石之首選","D":"處理前尿道結石(Anterior urethral calculi)，不須將結石 推回膀胱(retrograde relocation)，直接採取原位碎石 (in-situ lithotripsy)即可","E":"Primary bladder stone 通常好發在 2-4 歲之幼童，男 女比約 9:1-33:1"},"answer":"B","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, Page 2112-2120 (B) It was commonly believed that the bladder was the source of migratory calculi, but recent evidence has suggested that the s o u r c e o f t h e s e migratory calculi could as well be the upper urinary tract calculi. The evidence in favor is threefold.","sourcePage":18},{"id":"1-063","category":"結石","categoryOrder":1,"number":63,"question":"下列有關於結石形成抑制物 (crystal formation inhibitor)的敘 述何者正確?","options":{"A":"Citrate 可抑制尿酸結石的結晶形成 (crystallization)","B":"結石的形成包括成核(nucleation)、結晶成長(crystal growth)、結晶聚集 (crystal aggregation)與結晶固化 (consolidation)","C":"Nephrocalcin 於近曲小管 (proximal renal tubule)和厚上 升段(thick ascending limb)合成，於人體有四種異構體 (isoform)","D":"Tamm-Horsfall protein 可抑制單水草酸鈣結晶的生長 (growth)與聚合 (aggregation)","E":"即使懷孕婦女會分泌較多的結石形成抑制物 (crystal formation inhibitor)進入尿液中，結石風險仍高過一般婦女"},"answer":"C","reference":"(112) 參考資料(摘錄自): Campbell-Walsh 12th edition, Chapter 91, P. 2010, 2014, 2035 (A) 無抑制因子 (B) 無固化 (D) 僅聚合 (E) 相同","sourcePage":18},{"id":"1-064","category":"結石","categoryOrder":1,"number":64,"question":"關於馬蹄腎(horseshoe kidneys)的敘述，下列何者錯誤?","options":{"A":"其結石發生率約為 20%，尤其易在腎盂及下腎盞(lower pole calyx)產生結石","B":"如果腎結石大於兩公分，馬蹄腎病人接受經皮腎造廔碎石 (PCNL)的結石廓清率比正常腎臟病人差，併發症也較多","C":"針對一公分的上腎盞結石，若無水腎可選擇體外震波處理","D":"其輸尿管與腎盂輸尿管接合處(ureteropelvic junction)比 起正常腎臟更高位且靠內側，易受峽部(isthmus)血管壓迫產 生水腎","E":"其上腎盞較靠背側及外側，比起下腎盞更適合建立 PCNL 通道"},"answer":"B","reference":"(112) 參考資料(摘錄自): Campbell 12th, Chapter 93, page 2078-2080; Chapter 94, page 2016 詳解 (B) Ch. 93, p. 2080, 結 石廓清率沒差。","sourcePage":18},{"id":"1-065","category":"結石","categoryOrder":1,"number":65,"question":"下列哪一種疾病與腎臟鈣結石(calcium nephrolithiasis)的形成 無關?","options":{"A":"遠端腎小管性酸中毒(distal renal tubular acidosis)","B":"副甲狀腺功能亢進(hyperparathyroidism)","C":"維生素 D 缺乏(vitamin D deficiency)","D":"甲狀腺功能亢進(hyperthyroidism)","E":"慢性胰臟炎(chronic pancreatitis)"},"answer":"C","reference":"(112) 參考資料(摘錄自): 解題說明請註明 1. Campbell-Walsh-Wei n Urology 2. 12th edition, 2021 3. Page 2049, BOX 92.4 分別說明 A. 有關 B. 有關 C. vitamin D excess D. 有關 E. 有關","sourcePage":19},{"id":"1-066","category":"結石","categoryOrder":1,"number":66,"question":"下列關於形成結石的常見電解質之代謝機制，下列敘述何者錯誤？","options":{"A":"於腸道腔室中，相較於草酸鈣，磷酸鈣更容易受到酸鹼值的影 響","B":"尿液中的鈣離子於近端腎小管再吸收 60-65%、於亨爾氏套吸 收 25-30%、於遠曲小管再吸收 8-10%","C":"鎂離子經大腸及小腸吸收，其運送方式是主要是藉由主動吸收","D":"Oxalobactor formigenes 為一分解草酸鹽的細菌，會影響草 酸鹽在腸道的吸收","E":"SLC26A6 為一種陰離子通道運輸蛋白，因在動物實驗顯示缺乏 SLC26A6 的老鼠其血清及尿液中的草酸鹽較高，因此推定與腸 道分泌草酸鹽有關"},"answer":"C","reference":"(112) Campbell-Walsh-W ein Urology, 12th edition, 2021, Chapter 91, p 2015-2017 (C)主要是藉由被動吸收","sourcePage":19},{"id":"1-067","category":"結石","categoryOrder":1,"number":67,"question":"下列關於結石的藥物治療，下列敘述何者錯誤？","options":{"A":"Thiazide 常用於預防高鈣尿症病人的結石復發，低血鉀為使 用 thiazide 的副作用之一，而檸檬酸鉀與氯化鉀在治療因 thiazide 引發的低血鉀具有相同的效果","B":"文獻顯示 Pyridoxine 能提高丙胺酸乙醛酸胺轉移酶 alanine glyoxylate aminotransferase (AGXT)的活性並對於第一型高 草酸尿症的患者有幫助","C":"對於有高尿酸尿症的病人，Allopurinol 能抑制單鈉鹽尿酸引 發的促進草酸鈣結晶形成反應，以減緩草酸鈣結石的形成","D":"對於胱胺酸尿症(cystinuria)的病人，選擇使用檸檬酸鉀而不 是檸檬酸鈉作為鹼化尿液的治療，會降低硫普羅寧 (tiopronin)治療胱胺酸尿症的效果","E":"醋羥胺酸(Acetohydroxamic acid)為一口服尿素酶抑制劑，除 了能減少感染性結石的復發率還能溶解現有的感染性結石，但 約有 3%-15%的病人會發生溶血性貧血的副作用"},"answer":"D","reference":"(112) /1.結石/ Campbell-Walsh-W ein Urology, 12th edition, 2021, Chapter 92, (A)p2051, p2056 (B)p2057 (C)p2058, (D)p2061 使用檸檬酸鈉 而不是檸檬酸鉀 (E)p2064-2065","sourcePage":19},{"id":"1-068","category":"結石","categoryOrder":1,"number":68,"question":"關於體外震波碎石的原理，下列敘述何者錯誤？","options":{"A":"水電式(electrohydraulic)碎石機其優點在於良好的碎石效 率","B":"擠壓分裂(squeezing-splitting)作用，於震波在反射後產生 的負壓波伸張結石時產生","C":"剪應力(shear stress)作用，於震波經過結石造成分子結構產 生垂直於波行進方向的位移時產生，根據文獻顯示效果優於碎 裂(spallation)作用","D":"壓電式(piezoelectric) 碎石機因其能量較小，可考慮在體外 震波碎石期間不使用麻醉為其優點之一","E":"伴隨震波產生的氣泡維持約 200 微秒並於迅速塌陷後形成空 洞化(cavitation)"},"answer":"B","reference":"(112) /1.結石/參考資 料(摘錄自)： Campbell-Walsh-W ein Urology, 12th edition, 2021, Chapter 94, (A) p2094, (B) p 2096 震波在反射後產生 的負壓波伸張結石此 為碎裂作用。震波行經結 石及周圍液體因傳遞速 度不同時產生擠壓才 為擠壓作用 (C) p2094, (D)(E) p2097","sourcePage":20},{"id":"1-069","category":"結石","categoryOrder":1,"number":69,"question":"下列關於軟式輸尿管鏡雷射碎石手術及經皮穿腎取石術的敘述何 者正確？","options":{"A":"根據 2023 年 Journal of Urology 的文章 Risk Factors for Increased Stent-associated Symptoms Following Ureteroscopy for Urinary Stones: Results From STENTS， 從 424 位接受輸尿管鏡碎石手術並於術後放置輸尿管導管的 病人觀察記錄顯示，年齡、體重、憂鬱症病史及過去有無嚴重 輸尿管導管置放疼痛病史等，均與術後疼痛強度有關","B":"根據 2022 年 World Journal of Urology 的文章 Outcomes and lessons learnt from practice of retrograde intrarenal surgery (RIRS) in a paediatric setting of various age groups: a global study across 8 centres，統計 314 位平 的兒童做軟式輸尿管鏡碎石手術顯示，受術對象為年齡小於 12 歲者與較高的併發症有相關性","C":"根據 2020 年 10 月 Journal of Urology 的文章－effects of Silicone Hydrocoated Double Loop Ureteral Stent on Symptoms and Quality of Life in Patients Undergoing Flexible Ureteroscopy for Kidney Stone: A Randomized Multicenter Clinical Study，顯示矽膠材質的輸尿管導管有 較低的術後不適感及較低的感染率","D":"根據 2020 年 BMC urology 的文章－The effect of preoperative ureteral stenting in retrograde Intrarenal surgery: a multicenter, propensity score-matched study，統計 727 位接受軟式輸尿管鏡的病人顯示，術前放置 輸尿管導管會有較高的術中輸尿管鞘置放成功率及結石清除 率","E":"根據 2020 年 Journal of urology 的文章－A Randomized Controlled Trial of Preoperative Prophylactic Antibiotics for Percutaneous Nephrolithotomy in Moderate to High Infectious Risk Population: A Report from the EDGE Consortium，這篇多家醫院的隨機臨床試驗統 計 123 位接受 PCNL 手術，結果顯示，鹿角型結石的病人經由 事後檢定(post hoc)顯示，術後敗血症的機率與術前使用 7 天抗生素或術前使用 2 天抗生素無關"},"answer":"E","reference":"(112) /1.結石/參考資 料(摘錄自)：(A)2023/1 JU, Risk Factors for Increased Stent-associated Symptoms Following Ureteroscopy for Urinary Stones: Results From STENTS, 與性別無關 (B)2022/2 World J of Urology, Outcomes and lessons learnt from practice of retrograde intrarenal surgery (RIRS) in a paediatric setting of various age groups: a global study across 8 centres, 5 歲 以下 (C) 2020/10 JU Effects of Silicone Hydrocoated Double Loop Ureteral Stent on Symptoms and Quality of Life in Patients Undergoing Flexible Ureteroscopy for Kidney Stone: A Randomized Multicenter Clinical Study , silicone DJ 感 染率(7.4%), non-silicone DJ 感染率 (5.5%) (D)2020/9 BMC urology, The effect of preoperative ureteral stenting in retrograde Intrarenal surgery: a multicenter, propensity score-matched study, 與結石清除率無關 (E) 2020/12 JU, A Randomized Controlled Trial of Preoperative Prophylactic Antibiotics for Percutaneous Nephrolithotomy in Moderate to High Infectious Risk Population: A Report from the EDGE Consortium, 正確","sourcePage":20},{"id":"1-070","category":"結石","categoryOrder":1,"number":70,"question":"1. 中年女性罹患乾燥症(Sjögren's syndrome)，因反覆結石前來 門診，近一步檢查發現抽血發現鉀離子 2.1，血氧分析 GAS pH 7.31，24 小時尿液鈣濃度 523mg/day，尿液 pH 5.8，bacteria 2+。請問關於評估和處置，下列敘述何者正確？","options":{"A":"病人可能有 type 2 RTA，需要會診腎臟內科治療","B":"此疾病可能和 proximal renal tubule 對 HCO3-的再吸收缺失 有關","C":"口服 Potassium citrate 是一種適當的治療選擇","D":"該疾病常發生 nephrolithiasis，但和 nephrocalcinosis 無 關","E":"以上皆非"},"answer":"C","reference":"(112) /1.結石/參考資 料(摘錄自)： 解題說明請註明 1. Campbell 2. 12 版次 p2055","sourcePage":21},{"id":"1-071","category":"結石","categoryOrder":1,"number":71,"question":"健康檢查意外發現左側腎臟鹿角結石(staghorn stone)，無腰痛或 血尿症狀，由健檢醫師轉診至你的門診治療，其合理的治療？","options":{"A":"病人尿液培養結果陰性，故只需在手術房給予術前抗生素，無 需常規抗生素治療","B":"鹿角結石為感染性結石，不可用體外震波治療","C":"經皮穿腎取石手術(PCNL)手術過程為求視野清晰達到 stone free，應盡量使用蒸餾水當作灌注液體","D":"若手術中不慎發生 colon perforation，應立即移除腎造廔 管，並終止手術","E":"治療完成後建議口服 Acetohydroxamic acid 預防再次發生鹿 角結石"},"answer":"E","reference":"(112) /1.結石/參考資 料(摘錄自)： 解題說明請註明 1. Campbell 2. 12 版次 2064 2075 2104 2107 頁 次","sourcePage":22},{"id":"1-072","category":"結石","categoryOrder":1,"number":72,"question":"關於藥物引起的結石，下列何者正確？","options":{"A":"Topiramate 會使得實驗室檢查發現代謝性酸中毒、高尿鈣、 低尿中檸檬酸和尿中 pH 上升。使用 Potassium citrate 可能 使尿中 pH 更高，無法避免結石","B":"Indinavir 造成的結石在 KUB 上無法顯影，但是在 CT 上明顯 可見，故 CT 是診斷 Indinavir 的重要工具","C":"若藥物半衰期越長，越容易使尿中濃度越高，增加結石機率","D":"Ammonium acid urate calculi 可能和瀉藥使用有關非","E":"以上皆非"},"answer":"D","reference":"(112) /1.結石/參考資 料(摘錄自)： 解題說明請註明 1. Campbell 2. 12 版次 p2066","sourcePage":22},{"id":"1-073","category":"結石","categoryOrder":1,"number":73,"question":"請問下列哪一類病人非高危險泌尿道結石形成者，無需接受新陳代 謝評估(Metabolic evaluation)?","options":{"A":"兒童第一次發生疼痛症狀泌尿道結石","B":"更年期女性有骨質疏鬆症，經常因結石問題來泌尿科門診","C":"中年反覆罹患結石問題合併長期慢性腹瀉","D":"長期追蹤攝護腺癌男性，近期診斷病理性骨折及結石問題","E":"中年女性罹患甲狀腺病史首次結石就醫"},"answer":"E","reference":"(112) /1.結石/參考資 料(摘錄自)： 解題說明請註明 4. Campbell 5. 12 版次 6. Chapter 92 Box 92.1","sourcePage":22},{"id":"1-074","category":"結石","categoryOrder":1,"number":74,"question":"有關 RIRS(Retrograde intra-renal surgery)之敘述，何者錯誤？","options":{"A":"過長的手術時間會增加併發症風險，一般希望將手 術時間控制在 90 分鐘內","B":"對於非複雜性的 URS(complete stone removal), 術後放置 double J stent 一至兩週與術後放置 ureter catheter 一天效果相當","C":"高能量雷射(high-power laser)相較於低能量雷射 (low-power laser) 可顯著縮短手術時間，提升臨床成效 (clinical outcomes)","D":"α-blocker 可減少 stent 相關症狀以及絞痛次數","E":"pre-stenting 僅對處理腎臟結石有 outcome 上的影響，對 ureter stone 則無"},"answer":"C","reference":"(112) /1.結石/參考資 料(摘錄自)：2023 EAU Guidelines on Urolithiasis 3.4.6 (C) Compared to low-power lasers, high-power laser reduces procedural time although the reported difference in clinical outcomes were non-significant","sourcePage":22},{"id":"1-075","category":"結石","categoryOrder":1,"number":75,"question":"有關泌尿道結石之敘述，何者錯誤？","options":{"A":"白種人、西班牙人、非裔美国人、亞洲人中，白種 人有最高的泌尿道結石發生率，其次依序為西班牙人，亞洲人 以及非裔美国人","B":"上泌尿道結石發生在男性的比例比女性高","C":"不管在男女性族群，BMI(body mass index)高低與 結石的生成都有高度相關，其中又以女性更為明顯","D":"柑橘類的果汁和蘇打水可以降低結石的生成，但沒 辦法做為水的替代選擇","E":"感染性結石容易形成鹿角石，常常在鹼性尿液中形 成"},"answer":"D","reference":"(112) /1.結石/參考資 料(摘錄自)：Campbell Chap 91. P2006 (P 2009 keypoint) The prevalence and incident risk of stone disease directly correlated with weight and body mass index (BMI) in both sexes, although the magnitude of the association was greater in women than in men (D)P 2054. Keypoint. Citrus juices (particularly lemon and orange) and low-calorie citrus soda with citric acid may decrease stone risk and be an alternative to water. (E)P 2065. Keypoint. Infection calculi commonly produce staghorn stones and form in alkaline urine.","sourcePage":23},{"id":"1-076","category":"結石","categoryOrder":1,"number":76,"question":"下列何者不是 Metabolic stone 評估上的 indication?","options":{"A":"腸胃疾病(Intestinal disease)","B":"骨質疏鬆(Osteoporosis)","C":"單一腎臟(Solitary kidney)","D":"痛風病史(Gout)","E":"成分是 compacted calcium phosphate 的腎結石"},"answer":"E","reference":"(112) /1.結石/參考資 料(摘錄自)：Chap 92. P 2040 BOX 92.1 Stones composed of cystine, uric acid, struvite","sourcePage":23},{"id":"1-077","category":"結石","categoryOrder":1,"number":77,"question":"下列關於泌尿道結石的敘述何者錯誤","options":{"A":"一般而言男性較女性為多，但隨著近年年輕女性盛行率的增加 兩者已經越來越接近","B":"結石成分中含鈣質的結石佔約 80%，其中又以草酸鈣為最多約 佔 60%","C":"過高的 BMI、水分攝取不足、在炎熱環境工作的職業、勞力密 集的職業皆為結石生成的危險因子","D":"結石的患者有更高的機率合併糖尿病、心血管疾病、慢性腎臟 病","E":"電腦斷層攝影 (Computed Tomography) 為診斷結石的 gold standard，其 sensitivity 為 98% 且 specificity 為 97%"},"answer":"C","reference":"(112) /1.結石/參考資 料(摘錄自)： Campbell Walsh Urology, 12th edition, 2021, Chapter 91, p. 2668-2672 & Chapter 92, p.2708-2709","sourcePage":24},{"id":"1-078","category":"結石","categoryOrder":1,"number":78,"question":"以下皆為結石形成的促進引子( Promotor)，除了何者為抑制因子 (Inhibitor)","options":{"A":"草酸鹽 Oxalate","B":"尿酸鹽 Urate","C":"檸檬酸鹽 Citrate","D":"鈉 Sodium","E":"胱胺酸 Cystine"},"answer":"C","reference":"(112) /1.結石/參考資 料(摘錄自)：Campbell Walsh Urology, 12th edition, 2021, Chapter 91, p. 2677-2678","sourcePage":24},{"id":"1-079","category":"結石","categoryOrder":1,"number":79,"question":"下列關於電解質及鹽類代謝的敘述何者錯誤","options":{"A":"第一型吸收型高尿鈣症(Absorptive Hypercalciuria type 1) 其血中副甲狀腺素(PTH)會持平或降低","B":"草酸鹽 Oxalate 攝取的 6-14% 會被吸收，其中小腸及大腸約 莫各佔吸收比率的一半","C":"鎂離子 Mg 主要在近端小腸以被動方式吸收並由維他命 D (vitamin D) 來做調節","D":"飲食中約 60% 的磷(Phosphorus)會被吸收，若小腸中的 PH 較低則吸收較少，反之若 PH 較高則吸收較多","E":"促進鈣質吸收的 1,25(OH) D 其前驅物 7-dehydrocholesterol 2 3 在皮膚中被轉化為 previtamin D ，再分別於肝臟及腎臟 3 hydroxylated 最終形成 1,25(OH) D 2 3"},"answer":"C","reference":"(112) /1.結石/參考資 料(摘錄自)： Campbell Walsh Urology, 12th edition, 2021, Chapter 91, p. 2678-2680","sourcePage":24},{"id":"1-080","category":"結石","categoryOrder":1,"number":80,"question":"下列關於尿路結石的敘述何者錯誤","options":{"A":"大部分有症狀的結石發生在第二或第三孕期(second and third trimesters of pregnancy)","B":"懷孕期生理性的腎水腫(hydronephrosis)、增加的腎絲球過濾 率(glomerular filtration rate)、增加的鈣質吸收等等皆為 尿路結石的危險因子","C":"感染性結石容易在富含 amonia 的鹼性尿液中形成，最常見的 菌種為 Proteus mirabilis，而最好發的族群為長者及男性","D":"有些藥物會直接在尿液中形成結石，包括 Indinavir, Ephedrine, Triamterene 等等","E":"過多的維他命 C 及維他命 D 都有可能導致結石的形成"},"answer":"C","reference":"(112) /1.結石/參考資 料(摘錄自)： Campbell Walsh Urology, 12th edition, 2021, Chapter 91, p. 2680-2698","sourcePage":24},{"id":"1-081","category":"結石","categoryOrder":1,"number":81,"question":"下列關於結石處裡的敘述何者錯誤","options":{"A":"震波碎石的禁忌症包括懷孕、凝血功能異常、未治療的泌尿道 感染及遠端輸尿管的阻塞","B":"提高震波碎石(Shock wave lithotripsy)的擊發頻率(>90 shocks/min)可以改善碎石的成效","C":"近端輸尿管 >10mm 的結石應優先考慮 ureteroscopic lithotripsy","D":"Secondary 的尿道結石 (Urethral stones) 較 Primary 常 見","E":"為減少出血量，執行 PCNL (Percutaneous Nephrolithotomy) 時應優先考慮 posterior calyceal access"},"answer":"B","reference":"(112) /1.結石/參考資 料(摘錄自)： Campbell Walsh Urology, 12th edition, 2021, Chapter 93, p. 2749-2759 & Chapter 94, p. 2797-2802","sourcePage":25},{"id":"1-082","category":"結石","categoryOrder":1,"number":82,"question":"下列敘述何者正確?","options":{"A":"馬蹄腎之結石最常出現在腎盂與後上腎盞 (renal pelvis and posterior upper pole calyces)","B":"腎盞憩室 (Calyceal diverticula)最常發生於下腎盞 (lower pole calyx)","C":"當結石與腎盂輸尿管接合處阻塞 (ureteral pelvic junction obstruction, UPJO)同時發生時，應先切開 UPJO 再處理結石","D":"當含有有症狀之上泌尿道結石的腎臟尚有 10%腎功能時，不應 該再做保護腎功能的結石相關治療 (stone specific nephron-sparing treatments)","E":"當輸尿管未阻塞時，結石排出的關鍵在於水壓 (hydrostatic pressure)"},"answer":"D","reference":"(112) )/1.結石/ 參考資料(摘錄自): Campbell-Walsh 12th edition, Chapter 93, P. 2077, 2078, 2085, 2088","sourcePage":25},{"id":"1-083","category":"結石","categoryOrder":1,"number":83,"question":"有關於經皮腎造廔取石術 (Percutaneous nephrolithotomy, PCNL)的敘述，何者正確?","options":{"A":"PCNL 術後 PCN tube drainage 留置的目的不包括引流感染物","B":"上腎盞 (Upper pole calyx) 結石是 PCNL 結石廓清不良的預 測因子","C":"基質結石 (Matrix stone)雖然罕見，但體外震波碎石較 PCNL 有效","D":"PCNL 在馬蹄腎患者的療效較一般患者不佳","E":"PCNL 在腎臟移植患者的療效較一般患者不佳"},"answer":"B","reference":"(112) )/1.結石/ 參考資料(摘錄自): Campbell-Walsh 12th edition, Chapter 93, 94 P. 2075, 2076, 2080, 2104,","sourcePage":25},{"id":"1-084","category":"結石","categoryOrder":1,"number":84,"question":"下列有關高尿草酸症 (Hyperoxaluria)的敘述何者錯誤?","options":{"A":"Lumasiran (RNAi agent)可用於 Type II primary hyperoxaluria 的治療","B":"腸胃道繞道手術約在 6 個月後才會導致 Hyperoxaluria","C":"菠菜豆腐湯不會造成 Hyperoxaluria","D":"囊腫性纖維化 (Cystic fibrosis)病人容易 Hyperoxaluria 可能與抗生素的使用有關","E":"Primary hyperoxaluria 是 glyoxylate 轉化成 glycine 的過 程出現異常"},"answer":"A","reference":"(112) )/1.結石/ 參考資料(摘錄自): Campbell-Walsh 12th edition, Chapter 91, P. 2021-2023 EAU-Guidelines-on-Uro lithiasis-2023, P.51","sourcePage":25},{"id":"1-085","category":"結石","categoryOrder":1,"number":85,"question":"以下關於 Ammonium acid urate stones 的敘述何者正確？","options":{"A":"大部分為 radiopaque stone 並且與 chronic diarrhea、 inflammatory bowel disease、ileostomy、bowel diversions 以及 laxative abuse 有關","B":"Laxative abuse 形成 ammonium acid urate stones 的機轉目 前認為可能跟脫水造成腸胃水分喪失，進而造成 intracellular alkalosis 並且增加 ammonia excretion 有關","C":"低 urine volume 跟高 urine pH 值為 recurrent uric acid stones 以及 ammonium acid urate stones 共同的 risk factor","D":"Obesity (BMI >30)不是 ammonium acid urate stones 的 risk factor","E":"Ammonium acid urate 通常在 pH 6.2 to 6.3 容易結晶"},"answer":"E","reference":"(112)/1.結石/參考資 料(摘錄自): Campbell 12ed, Chapter 91, page 2032 (A) 大部分為 radiolucent stone (B) 造成 intracellular acidosis (C) 低 pH (D) obesity 是 risk factor (E) 正確","sourcePage":26},{"id":"1-086","category":"結石","categoryOrder":1,"number":86,"question":"關於 Randall plaques 的敘述，下列何者錯誤？","options":{"A":"Struvite stone 比其他類型結石患者常出現 Randall plaques 與 interstitial inflammation","B":"腸繞道術後病人產生的 Randall’s plaques 主要由磷灰石鈣 (calcium apatite)構成","C":"Randall’s plaques 起源於亨爾氏細環 (thin loops of Henle)的基底膜(basement membrane)","D":"Brushite stone 患者的 Randall plaques 由磷灰石鈣(calcium apatite)構成","E":"並非所有類型的結石都能在內視鏡下看到 Randall plaques"},"answer":"A","reference":"(112) /1.結石/參考資 料(摘錄自): Campbell 12th, Chapter 91, page 2011-2012; Chapter 92, page 2064 詳解 (A) Struvite 較少出現 Randall plaque。 Randall plaque 常見於 草酸鈣結石患者。","sourcePage":26},{"id":"1-087","category":"結石","categoryOrder":1,"number":87,"question":"以下各種容易有尿路結石的疾病和常見對應的 mineral metabolism disorder，下列何者正確？","options":{"A":"Spinal cord injury: hypercitraturia","B":"Type 1 renal tubular acidosis: hypercitraturia","C":"Secondary hyperparathyroidism: hypocalciuria","D":"Intestinal bypass 術後: hypo-oxaluria","E":"Thiazides: hypocitraturia"},"answer":"E","reference":"(112) /1.結石/參考資 料(摘錄自): Campbell 12ed, Chapter 91 and 95 詳解 (A) Ch. 95, p. 2117 hypocitraturia (B) Ch.91, p. 2025, hypercalciuria +hypocitraturia (C) Ch. 91, p. 2019 hypercalciuria (D) Ch 91, p. 2019 hyperoxaluria (E) Ch 91, p. 2033, 正 確","sourcePage":26},{"id":"1-088","category":"結石","categoryOrder":1,"number":88,"question":"請問下列敘述何者為非？","options":{"A":"蘭德爾腎鈣斑(Randall Plaque)起源於亨耳式套(loops of Henle)的基底膜(basement membrane)","B":"蘭德爾腎鈣斑(Randall Plaque)其成份為鈣磷灰石(calcium apatite)","C":"一旦蘭德爾腎鈣斑(Randall Plaque)於尿路上皮形成穩定表 面後，尿液中的草酸鈣(calcium oxalate)可於此表面上進行 結晶及結石的形成","D":"因肥胖接受腸繞道手術(intestinal bypass)產生腸因性高草 酸尿症(enteric hyperoxaluria)會在集尿管(collecting duct)外部髓質空腔內發現磷灰石(apatite)結晶","E":"鈣磷石(brushite)結石形成時可於集尿管(collecting duct) 內部髓質及末端空腔中發現磷灰石(apatite)鈣斑"},"answer":"D","reference":"(112)/1.結石/參考資 料(摘錄自): 解題說明請註明 1. Campbell-Walsh-Wei n Urology 2. 12th edition, 2021 3. Page 2011-2012 分別說明 A. 正確 B. 正確 C. 正確 D. 內部髓質空腔 E. 正確","sourcePage":27},{"id":"1-089","category":"結石","categoryOrder":1,"number":89,"question":"請問下列敘述何者為非？","options":{"A":"草酸(citrate)可作為草酸鈣(calcium oxalate)及磷酸鈣 (calcium phosphate)結石的抑制物","B":"尿液中的腎鈣蛋白(nephrocalcin)可作為雙水草酸鈣 (calcium oxalate dihydrate)結石形成的抑制物","C":"Tamm-Horsfall 蛋白是尿液中最多的蛋白質，可進一步抑制單 水草酸鈣(calcium oxalate monohydrate)結石的聚合 (aggregation)","D":"骨橋蛋白(osteopontin)可抑制草酸鈣結石結晶(nucleation) 及聚合(aggregation)","E":"尿液中的鎂離子可經由與草酸(oxalate)離子的結合近一步降 低草酸鈣(calcium oxalate)的過飽和(supersaturation)作 用"},"answer":"B","reference":"(112)/1.結石/參考資 料(摘錄自): 解題說明請註明 3. Campbell-Walsh-Wei n Urology 4. 12th edition, 2021 5. Page 2014 分別說明 A. 正確 B. 應為單水草酸鈣 C. 正確 D. 正確 E. 正確","sourcePage":27},{"id":"1-090","category":"結石","categoryOrder":1,"number":90,"question":"下列敘述何者為是？","options":{"A":"鈣離子的吸收主要是在小腸中發生，但與鈣的攝取無關","B":"1,25-Dihydroxyvitamin D 是刺激腸內鈣離子吸收的主要抑 3 制物","C":"副甲狀腺素(parathyroid hormone)可刺激腎臟近曲小管 (proximal tubule)內的 1 alpha 羥化酶(1 alpha-hydroxylase)將 25-hydroxyvitamin D3 轉化成 1,25(OH) D 2 3","D":"副甲狀腺素可加強遠曲小管對鈣離子的在吸收及磷酸離子的 排除","E":"腸道內草酸的吸收主要是與腸腔中的鈉鉀離子與鎂離子有關"},"answer":"C","reference":"(112)/1.結石/參考資料 (摘錄自): 解題說明請註明 6. Campbell-Walsh-Wei n Urology 7. 12th edition, 2021 8. Page 2017 分別說明 A. 有關 B. 主要刺激物 C. 正確 D. 近曲小管 E. 鈣離子及鎂離子","sourcePage":27},{"id":"1-091","category":"結石","categoryOrder":1,"number":91,"question":"下列敘述何者為非？","options":{"A":"根據 Menon 等學者的研究，高尿鈣(hypercalciuria)的定義是 在連續口服 7 天含 400mg 的鈣及 100 mg 的鈉飲食後，尿中每 天排出的鈣超過 100 mg","B":"原發性高草酸尿(primary hyperoxaluria)是因為自體隱性 (autosomal recessive)的乙醛酸(glyoxylate)代謝造成","C":"腎小管性酸中毒(renal tubular acidosis)主要是因為腎小管 對氫離子分泌(hydrogen ion secretion)及重碳酸鹽再吸收 (bicarbonate reabsorption)有缺陷才產生的代謝性酸中毒","D":"第一型腎小管性酸中毒(type 1 renal tubular acidosis)是 因為集尿管功能異常，進而在出現系統性酸中毒時無法酸化尿 液而稱之的一個症候群","E":"決定尿液中胱氨酸(cystine)溶解度的因子包括有尿中胱氨酸 的濃度及尿液酸鹼值等因素"},"answer":"A","reference":"(112)/1.結石/參考資料 (摘錄自): 解題說明請註明 3. Campbell-Walsh-Wei n Urology 4. 12th edition, 2021 5. Page 2018, 2021, 2025, 2029 分別說明 A. 排出的鈣超過 200 mg B. 正確 C. 正確 D. 正確 E. 正確","sourcePage":28},{"id":"1-092","category":"結石","categoryOrder":1,"number":92,"question":"下列有關懷孕與尿路結石的敘述何者正確？","options":{"A":"不同於未懷孕的婦女，尿路結石在懷孕族群中的發生率，白人 孕婦比黑人孕婦來的高","B":"在懷孕晚期(third trimester)有高達 90%的孕婦可以發現腎 水腫（hydronephrosis）及上泌尿道有擴張現象(upper tract dilation)，通常左側輸尿管的擴張程度(ureter dilation) 會比右側明顯","C":"懷孕期間，孕婦的腎臟血流會增加，同時腎絲球過濾率 （glomerular filtration rate）也會增加 30-50%","D":"跟未懷孕的婦女相比，磷酸鈣結石在孕婦中的發生率較低","E":"懷孕過程中，鈣、鈉和尿酸的過濾量會增加，但抑制結石形成 的物質如檸檬酸根（citrate）、鎂和醣蛋白（glycoproteins） 的排出量並沒有增加，導致懷孕婦女的結石發生率比未懷孕婦 女高"},"answer":"C","reference":"(113) A. 錯誤，懷孕婦女與未 懷孕婦女的發生率一樣 為白人高於黑人 B. 錯誤，通常右側輸尿 管擴張會比左側明顯 C. 正確 D. 錯誤，孕婦發生磷酸 鈣結石的機率比未懷孕 婦女高（65.6% vs 31.4%） E. 錯誤，抑制結石形成 的物質也同時增加，所以 孕婦和未懷孕婦女的結 石發生率相同 Campbell-Walsh Urology, 12th, Ch 91, p. 2035","sourcePage":28},{"id":"1-093","category":"結石","categoryOrder":1,"number":93,"question":"下列有關泌尿道結石之敘述,何者錯誤？","options":{"A":"尿酸(uric acid)可以促進草酸鈣結石(calcium oxalate stone)形成","B":"使用高劑量 allopurinol 治療的 Lesch-Nyhan 症候群患者,會 增加含有磷灰石鈣(calcium apatite)成分的結石風險","C":"低鈣飲食(low dietary calcium intake)會增加腸道草酸鹽 (oxalate)的吸收","D":"高草酸尿症(hyperoxaluria)是接受胃繞道手術(Roux-en-Y gastric bypass surgery )的患者最常見的異常尿液檢查結果","E":"在第二型糖尿病合併有尿酸結石(uric acid)的患者中,缺陷 產氨作用(defective ammoniagenesis)是造成尿液 pH 值降 低的最可能的機轉"},"answer":"B","reference":"(113) 4. Campbell-Walsh Urology 12th ed. 5. 12th ed., 2020 6. Chapter 91 7. (A)P. 2024 (B)P. 2032 (C)P. 2023 (D)P. 2022-2023 (E)P. 2028","sourcePage":28},{"id":"1-094","category":"結石","categoryOrder":1,"number":94,"question":"下列關於癌症相關高血鈣(malignancy-associated hypercalcemia)的描述，何者錯誤？","options":{"A":"腫瘤受細胞表面的 calcium-sensing receptor(CaSR)調控製 造的 PTH-related protein(PTHrP)與高血鈣相關","B":"癌症相關的高血鈣裡有六成是肺癌與乳癌","C":"PTHrP 除了會增加腎臟鈣值再吸收，也會刺激 osteoblast 分 化出 osteoclast 促進後續的骨頭溶解吸收","D":"PTHrP 也會刺激 1,25-(OH)2-D3，促進 calcitriol 的製造及腸 胃道鈣質的吸收","E":"類肉瘤肉芽腫(sarcoid granuloma)中的嗜鹼性球細胞會合成 1α- hydroxylase，促進 1,25-(OH)2-D3 的合成，增加腸胃道 鈣質的吸收"},"answer":"E","reference":"(113) 參考資料(摘錄自)： Campbell-Walsh Urology 12ed. Ch91 P2020 (A) P2020 (B) P2020 (C) P2020 (D) P2020 錯誤，P2020，是 sarcoid granuloma 的巨噬細胞 (macrophage)","sourcePage":29},{"id":"1-095","category":"結石","categoryOrder":1,"number":95,"question":"針對下尿路結石敘述，何者為正確？","options":{"A":"原發性的膀胱結石，通常和感染、解剖構造有關。","B":"遊走性尿道結石(Migratory urethral calculi)是尿道結石最 常見的病因，常見於前段尿道","C":"攝護腺結石成分大多由磷酸鈣和草酸鈣組成","D":"接受 augmentation cystoplasty 的女性比男性更容易發生 膀胱結石","E":"Orthotopic neobladder 和 Indiana pouch diversion 比 Kock pouch 有很高的機率產生膀胱結石"},"answer":"D","reference":"(113) Campbell 12ed, Chapter 95 A. 續發性結石 B. 後段尿道 C. 磷酸鈣和碳酸鈣 E. Kock pouch 較高機率 產生","sourcePage":29},{"id":"1-096","category":"結石","categoryOrder":1,"number":96,"question":"有關下泌尿道結石的敘述何著正確？","options":{"A":"原發性膀胱結石比較常在北美跟中東盛行","B":"膀胱結石最常見的症狀是解尿疼痛","C":"脊隨損傷的成人膀胱結石生成的風險在三個月達到高峰，進到 恢復期後是主要是因為不動性高鈣尿(immobilization hypercalciuria)造成","D":"腎移植術後尿路結石並不罕見，常見原因為感染、持續流出阻 塞(persistent outflow obstruction)、縫線、免疫抑制藥物， 且腎臟結石多於膀胱結石","E":"尿道結石在男性更常見，年齡分佈為雙峰，第一個高峰在二、 三十歲，第二個高峰在六、七十歲左右，主因為尿道狹窄、尿 道口狹窄或良性攝護腺增生"},"answer":"D","reference":"(113)/Campbell-Walsh Urology 12e P.2114-2117","sourcePage":29},{"id":"1-097","category":"結石","categoryOrder":1,"number":97,"question":"一位患有尿酸結石的病人接受鹼化尿液的治療，但一年後回診時主 訴排出兩顆結石，經檢驗為磷酸鈣（calcium phosphate）結石。 重新進行了 24 小時尿液收集分析發現尿液 pH 值為 7.4，尿液檸 檬酸根（urinary citrate）為 450 mg/天，尿液尿酸（urinary uric acid）為 875 mg/天。最可能的結石復發原因是？","options":{"A":"病人自行停止服用 potassium citrate","B":"病人日常飲食攝取大量肉類","C":"尿酸在尿中的溶解度降低","D":"尿液過度鹼化","E":"尿中的草酸（oxalate）濃度上升"},"answer":"D","reference":"(113) 尿液過度鹼化至 pH>7.0，進而產生 calcium phosphate stone。 Campbell-Walsh Urology, 12th, Ch 92, p.2047-2048, p.2060; Ch 91, p. 2026-2027.","sourcePage":29},{"id":"1-098","category":"結石","categoryOrder":1,"number":98,"question":"以下何者不是體外震波碎石的禁忌症？","options":{"A":"無法定位的結石","B":"結石旁的動脈瘤","C":"遠端輸尿管阻塞","D":"懷孕","E":"感染性結石（struvite）"},"answer":"E","reference":"(113)Campbell-Walsh Urology, 12th edition, P.2072","sourcePage":30},{"id":"1-099","category":"結石","categoryOrder":1,"number":99,"question":"請問下列敘述何者為非？","options":{"A":"檸檬酸通過多種作用抑制草酸鈣和磷酸鈣結石的形成","B":"兩種尿液醣蛋白 glycoproteins，腎鈣蛋白 nephrocalcin 和 Tamm-Horsfall 蛋白，是單水草酸鈣 calcium oxalate monohydrate 晶體聚集的強效抑制劑","C":"Tamm-Horsfall 蛋白是尿液中最豐富的蛋白質，也是單水草酸 鈣 calcium oxalate monohydrate 晶體聚集的強效抑制劑","D":"骨橋蛋白 Osteopontin 已被證明可促進草酸鈣晶體的成核、生 長和聚集，並增加晶體與腎上皮細胞的結合","E":"維生素 D 的活性形式，1,25(OH) D ,，是最強效的腸道鈣吸收 2 3 刺激劑"},"answer":"D","reference":"(113)Campbell-Walsh Urology 12th Edition, 2021 Page 9269-9294 9. 正確 10. 正確 11. 正確 12. 抑制草酸鈣晶體的 成核、生長和聚集， 並減少晶體與腎上 皮細胞的結合。 正確","sourcePage":30},{"id":"1-100","category":"結石","categoryOrder":1,"number":100,"question":"55 歲男性，長期痛風的病史，服用 Allopurinol 控制高尿酸血症， 這次因為左側急性腎絞痛而到急診求診，起初止痛針效果不彰，因 此安排斷層掃描發現，左側 UPJ 處有 6mm 結石併在左側上腎盞及中 腎盞各有一顆約 10mm 結石，除此之外，此病人腎臟為馬蹄腎 (Horseshoe Kidney)結構，以下敘述何者為誤?","options":{"A":"如果尿酸結石反覆發生，主要原因為尿液 pH 值較低","B":"如果患者選擇 PCNL 治療，在一般腎臟和馬蹄腎的結石清除率 與併發症機率差不多","C":"在 PCNL，馬蹄腎要選擇 upper pole 來進行穿刺較安全","D":"如果 PCNL 術後，持續性的出血，有可能是因為 arterial pseudoaneurysm 造成的","E":"若此患者後續因為尿酸結石，持續接受檸檬酸鉀治療，還是有 機會產生草酸鈣結石復發"},"answer":"E","reference":"(113)Campbell 12ed, Chapter 91-95, p2105 E. 磷酸鈣結石","sourcePage":30},{"id":"1-101","category":"結石","categoryOrder":1,"number":101,"question":"在患有腎結石的兒童中，以下哪項尿液檢查結果最少見？","options":{"A":"高尿酸尿症（Hyperuricosuria）","B":"尿中含有大量的鈉","C":"低檸檬酸尿症（hypocitratutia）","D":"高尿鈣症（hypercalciuria）","E":"尿液製造過少"},"answer":"A","reference":"(113)Uric acid nephrolithiasis 在結石 的病童中非常的少見 （<5%） Campbell-Walsh Urology, 12th, Ch 91, p. 2031-2032","sourcePage":30},{"id":"1-102","category":"結石","categoryOrder":1,"number":102,"question":"根據《Campbell-Walsh Urology》第 12 版〈Urinary Lithiasis〉 章節，下列關於泌尿結石與心血管疾病或代謝症候群之關聯性，何 者正確？","options":{"A":"鈣補充已被證實會導致血管鈣化風險上升","B":"尿液中形成的結晶可循環並沉積於動脈內壁","C":"飲食中高動物蛋白與高鹽攝取與結石形成及心血 管疾病無明顯關聯","D":"肥胖與胰島素阻抗會透過影響腎小管離子處理而 增加結石風險","E":"代謝症候群病患之尿液中 pH 值通常偏高，進而增 加草酸鈣結石的風險"},"answer":"D","reference":"(114) 1. Campbell-Walsh Urology 2. 12th edition, 2021 Chapter 91, p. 2385","sourcePage":31},{"id":"1-103","category":"結石","categoryOrder":1,"number":103,"question":"以下哪一項關於種族與腎結石罹患率的描述正確？","options":{"A":"黑人女性的腎結石發生率高於白人女性","B":"東亞人罹患結石風險較高","C":"白人男性罹患腎結石風險最高","D":"所有族群間的結石風險皆相同","E":"非裔美國人男性和女性的結石風險皆高於拉丁裔"},"answer":"C","reference":"(114)Campbell urology, 12th edition Ch91, Page 2005","sourcePage":31},{"id":"1-104","category":"結石","categoryOrder":1,"number":104,"question":"下列何種結石成分主要影響年輕女性並且與尿液 pH 值偏鹼性有 關？","options":{"A":"感染性結石（Struvite stone）","B":"尿酸（Uric acid）","C":"草酸鈣（Calcium oxalate）","D":"磷酸鈣（Calcium phosphate）","E":"胱氨酸結石（Cystine stone）"},"answer":"D","reference":"(114)Campbell Urology 12th edition 2021, chapter 92, page 2049 之 key points","sourcePage":31},{"id":"1-105","category":"結石","categoryOrder":1,"number":105,"question":"下列何種藥物和結石產生無關？","options":{"A":"Calcium acetate","B":"Laxatives","C":"Acetazolamide","D":"Furosemide","E":"Trimethoprim-sulfamethoxazole 題號 答案 考 題"},"answer":"A","reference":"(114) Campbell-Walsh Urology 12th edition Chapter 92, p.2065 年度 類別 參考資料","sourcePage":31},{"id":"2-001","category":"前列腺疾病含癌症","categoryOrder":2,"number":1,"question":"關於前列腺根除手術何者正確?","options":{"A":"在處理攝護腺血管(prostate pedicle)時，因為其 血流豐富，盡量以電燒(electrocautery)方式來止 血","B":"做深層背部靜脈叢結紮(Ligation deep dorsal venous complex)時盡可能的靠近攝護腺頂部 (prostate apex)，避免大出血","C":"腹膜外手術(Extraperitoneal approach)相較於腹 膜內手術(transperitoneal access)有更大的手術 空間","D":"將前列腺後側與前直腸壁分離是避免直腸損傷的 關鍵手術操作","E":"攝護腺根除手術產生手術邊緣陽性(positive surgical margin)最常見的位置在膀胱頸(Bladder neck)"},"answer":"D","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh 12th edition, Chapter 156, p3571~3575 (A) avoid electrocautery (B) as far distal from the prostatic apex (C) reduced working space (E) apex","sourcePage":32},{"id":"2-002","category":"前列腺疾病含癌症","categoryOrder":2,"number":2,"question":"以下關於攝護腺癌主動監測(Active surveillance)之 敘述何者錯誤？","options":{"A":"格里森分級 6 (grade group 1)無短期遠端轉移風 險","B":"五年內只有約一半的病患分級上升，需進一步評估 積極治療(definitive treatment)","C":"同時存在更高格里森分級之癌細胞的風險因子包 含：PSA density > 0.15ng/mL2，非裔美國人，切 片陽性數量","D":"身體質量指數(BMI)每上升 5 會增加 20%攝護腺癌死 亡風險","E":"low-grade 攝護腺癌病患接受主動監測期間，若有 下泌尿道症狀，可使用 5α-reductase inhibitor 藥物"},"answe
