"C","reference":"(113) ( A) Campbell 11ed, p1087 (B) Campbell 11ed, p1087 (C) Campbell 11ed, p1087 (D) Campbell 11ed, p1087 (E) Campbell 12ed, p1939","sourcePage":361},{"id":"9-089","category":"移植","categoryOrder":9,"number":89,"question":"下列有關移植後之惡性腫瘤(post-transplant malignancy)之敘述何者錯誤?","options":{"A":"腎臟移植患者發生攝護腺癌的發生率與一般民 眾相當","B":"大部分的腎臟癌均發生在原腎臟, 且多為高惡 性度","C":"接受腎臟移植的病患，根據統計，乳癌的長期追 蹤其標準化發病率(standardized incidence ratio, SIR)相對於一般常人反而較低","D":"腎臟移植病人的原本腎臟中若有腎細胞癌(RCC in native kidney)，病人預期餘命短(short life expectancy)且腫瘤<4cm, 可使用冷凍治療 (Cryotherapy)","E":"腎臟癌與膀胱癌發生率較一般人提高"},"answer":"B","reference":"(113)Campbell-Walsh Urology 12th ed、2020 Ch.88 P1940-1941 (B) 低惡性度","sourcePage":361},{"id":"9-090","category":"移植","categoryOrder":9,"number":90,"question":"下列何者情形比較不可能發生在 Donation after circulatory death (DCD)上？","options":{"A":"可同時進行 ABO incompatible transplant","B":"沒有自主呼吸且心律呈現 asystole 至少 5 分 鐘","C":"移植腎長期存活與 standard criteria donor 接 近","D":"Delayed graft function 發生率較高","E":"器官一定會有一段 warm ischemia time"},"answer":"A","reference":"(113)/Campbell-Walsh Urology 11th edition Chapter 47, p.1075","sourcePage":361},{"id":"9-091","category":"移植","categoryOrder":9,"number":91,"question":"兒童腎臟移植常見泌尿系統併發症，不包含下列何 者?","options":{"A":"輸尿管狹窄","B":"膀胱功能障礙","C":"泌尿道結石","D":"尿液滲漏","E":"臨床顯著的逆流"},"answer":"B","reference":"(114)/9.移植/參考資料(摘 錄自)：Campbell’s Urology, 12th ed, Part III, Chapter 51. P.1064 (B) 膀胱功能障礙不常見","sourcePage":361},{"id":"9-092","category":"移植","categoryOrder":9,"number":92,"question":"下列有關腎臟移植手術的敘述何者正確？","options":{"A":"在再灌注(reperfusion)之后，可以靜脈推注 furosemide 和 mannitol，以促進利尿並清除自 由基","B":"當受腎者的髂動脈彎曲(tortuous iliac artery )時，最佳的靜脈吻合位置是在外髂動脈 彎曲處的內側進行","C":"如果存在顯著的髂動脈粥狀硬化或血管過短，則 內髂動脈或主動脈會成為腎動脈吻合的目標血 管","D":"腎門附近的脂肪組織應盡量保留避免結紮，以免 造成輸尿管狹窄","E":"膀胱灌洗液最好使用廣效型抗菌液，如含 bacitracin 或 neomycin–polymyxin B 的沖洗 液並且應該要在手術開始前就以此溶液沖洗膀 胱"},"answer":"E","reference":"(114)解題說明請註明 1. 11ed Campbell-Walsh urology, P1081 2. A) 應在 reperfusion 之前給 B)外側 C)髂總動脈或主動脈，非 internal illiac artery D) 應 ligate 因為這類組織通 常含有淋巴管，否則可能導致 術後淋巴囊腫的發生 E)正確","sourcePage":362},{"id":"9-093","category":"移植","categoryOrder":9,"number":93,"question":"關於免疫抑制劑藥物的作用機轉，下列描述何者不正 確?","options":{"A":"Mycophenolate mofetil 抑制嘌呤合成 (inhibits purine synthesis)","B":"Glucocorticoids 降低細胞激素基因轉錄 (reduce transcription of cytokine genes)","C":"Basiliximab 阻斷白血球介素 2 受體 (block IL-2 receptor)","D":"Tacrolimus 抑制鈣調磷酸酶及白血球介素 2 製 造 (inhibits calcineurin and IL-2 production)","E":"Thymoglobulin 多株抗體用來清除 B 淋巴細胞 (B lymphocyte-depleting preparation)"},"answer":"E","reference":"(114)參考資料(摘錄自)： Campbell-Walsh Urology, 11th edition. Chapter 47,p.1085","sourcePage":362},{"id":"9-094","category":"移植","categoryOrder":9,"number":94,"question":"以下關於腎臟移植免疫抑制劑之敘述，何者正確?","options":{"A":"MMF 會造成 (New-onset diabetes mellitus)","B":"Tacrolimus 為一種 mTOR inhibitor","C":"腹瀉，噁心/嘔吐 為 MMF 常見之副作用","D":"Tacrolimus 會影響腎功能，Cyclosporin 則不 會","E":"Sirolimus, MMF 及 AZA 皆有 產生貧血及白血 球低下之副作用"},"answer":"C","reference":"(114) Smith and Tanagho’s General Urology, 18e, Chapter 36 (A) 錯誤 (B) 錯誤(為 CNI) (C) 正確 (D) 錯誤 (E) 錯誤 (Sirolimus 不會)","sourcePage":362},{"id":"9-095","category":"移植","categoryOrder":9,"number":95,"question":"關於腎臟移植後膀胱癌的敘述，下列何者正確？","options":{"A":"腎臟移植患者發生膀胱癌的風險與一般人群相 似","B":"移植後膀胱癌通常生物學行為較不具侵襲性，預 後良好","C":"移植後膀胱癌診斷的平均時間約為移植後 10 年 以上","D":"腎臟移植患者發生膀胱癌的風險顯著增加，且其 惡性生物學行為更具侵襲性","E":"移植後膀胱癌患者絕對不適合接受膀胱內卡介 苗 (BCG) 治療，因免疫抑制會導致嚴重併發症 題號 答案 考 題"},"answer":"D","reference":"(114)正確答案：D 解析： 資料指出，腎臟移植患者罹患 膀胱癌的風險顯著增加 (SIR = 3.18)，且其惡性生物學行 為更具侵襲性，常伴隨更高的 復發、進展和轉移率。此外， 膀胱內卡介苗可被用於高風 險非肌肉侵犯性膀胱癌患 者。Campbell Chapter: 88 年度 類別 參考資料","sourcePage":363},{"id":"10-001","category":"感染","categoryOrder":10,"number":1,"question":"下列何者不是反覆泌尿道感染(recurrent urinary tract infections)的 risk factor?","options":{"A":"性行為(Sexual activity)","B":"近期有抗生素使用(Recent antimicrobial use)","C":"抽菸(Smoking)","D":"停經(Menopause)","E":"停經前有泌尿道感染病史(History of UTI before menopause)"},"answer":"C","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh Urology 12th Edition Chapter 55 P.1160 BOX 55.11","sourcePage":364},{"id":"10-002","category":"感染","categoryOrder":10,"number":2,"question":"下列何者不是以抗生素治療泌尿道感染的正確觀念?","options":{"A":"抗生素併用止痛藥(urinary analgesics)治療急性膀 胱炎(acute cystitis)可以緩解症狀但是無助於縮短 抗生素療程","B":"避免將 Fluoroquinolones 作為非複雜性泌尿道感染 (uncomplicated urinary tract infection)的第一 線抗生素，因為風險高於利益","C":"Aminoglycosides 一天一次(once daily)的給與方式 比較符合藥物動力學並有助於降低腎毒性 (nephrotoxicity)","D":"Nitrofurantoin 不建議使用在疑似或確定為蠶豆症 (Glucose-6-phosphate dehydrogenase deficiency) 的患者","E":"Trimethroprim-Sulfamethoxazole 較不會影響腸道 菌叢，但是對於腸球菌(Enterococcus)及綠膿桿菌 (Pseudomonas)無效"},"answer":"A","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh Urology 12th edition (A) p.1149 有助於縮短抗 生素療程 (B)(C) p. 1154 (D) p. 1150 (E) p. 1153","sourcePage":364},{"id":"10-003","category":"感染","categoryOrder":10,"number":3,"question":"最不建議在進行泌尿道處置前使用預防性抗生素的狀況 是?","options":{"A":"兩年內曾接受全髖關節置換術(Total hip replacement)的病患","B":"接受人工心臟瓣膜置換術(Prosthetic cardiac valve)的病患","C":"免疫不全(Compromised host factors)的病患","D":"接受尿液分流術(Urinary diversion)的病患","E":"近期曾發生泌尿道感染(Urinary tract infection) 的病患"},"answer":"B","reference":"(110)/10.感染/參考資料 (摘錄自)：(A) (C)(D)(E) Chapter 55, p.1201, Patients with indwelling orthopedic handwares (B) Chapter 55, p.1200, Patient with risk of endocarditis","sourcePage":364},{"id":"10-004","category":"感染","categoryOrder":10,"number":4,"question":"以下關於梅毒(Syphilis)的敘述，何者錯誤？","options":{"A":"神經性梅毒(Neurosyphilis)建議以 Benzathine penicillin G 來治療","B":"第一期及第二期梅毒患者須同時檢測有無 HIV 感染","C":"關於硬性下疳(chancre)，如果不治療病灶也可痊癒","D":"關於雅-赫氏反應(Jarisch-Herxheimer reaction)， 可能出現在開始 penecillin G 療程後的第一個 24 小 時內","E":"非特異性梅毒螺旋體試驗(non-treponemal test)檢 測出的抗體效價(titer)可以用來追蹤梅毒治療效果"},"answer":"A","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh Urology 12th ed. Chapter 58, pp1257-1259","sourcePage":364},{"id":"10-005","category":"感染","categoryOrder":10,"number":5,"question":"根據美國泌尿科醫學會臨床指引(best practice statement)以下關於泌尿科術前預防性抗生素 (antimicrobial prophylaxis)，何者錯誤？","options":{"A":"經尿道膀胱腫瘤切除手術(transurethral resection of the bladder tumor) 建議於術前給予一劑 Cefazolin 或是 TMP-SMX，以免革蘭氏陰性菌(gram negative rod)感染","B":"體外震波碎石術(extracorporeal shockwave lithotripsy) 建議於術前給予一劑 1-2 代 Cephalosporin 或 Clindamycin，以免革蘭氏陰性菌 (gram negative rod)感染","C":"經直腸攝護腺切片手術(transrectal ultrasound guided prostate biopsy )屬於汙染傷口，可以於術 前給予一劑 1-3 代 Cephalosporin+Aminoglycoside，以免革蘭氏陰性 菌(gram negative rod)感染","D":"尿道中段吊帶手術(midurethral sling procedure) 中，如病人對 Cephalosporin 類藥物過敏，可術前給 予一劑 Ampicillin/Sulbactam，以免金黃色葡萄球 菌(S.aureus)感染","E":"包皮環切術(circumcision)屬於乾淨-汙染傷口，可 能不需於術前給予抗生素，如有感染多是金黃色葡 萄球菌(S.aureus)造成"},"answer":"B","reference":"(110)/10.感染/參考資料 (摘錄自)：Lightner DJ, Wymer K, Sanchez J et al: Best practice statement on urologic procedures and antimicrobial prophylaxis. J Urol 2020; 203: 351.","sourcePage":365},{"id":"10-006","category":"感染","categoryOrder":10,"number":6,"question":"以下關於慢性攝護腺炎/慢性骨盆疼痛症候群(chronic prostatitis/chronic pelvic pain syndrome)，何者錯 誤？","options":{"A":"為美國衛生研究院攝護腺炎分類中的第三類 (category III)","B":"UPOINT 表型分類系統中的 N 代表神經性 (neurologic)領域的問題","C":"可能合併有大腸激躁症(irritable bowel syndrome)","D":"根據整合分析研究(meta-analysis)，抗發炎藥物加 上 α 交感神經阻斷劑(anti-inflammatory medications plus α-blockers)的整合治療效果最 好","E":"可以使用 2-glass test 來鑑別診斷慢性細菌性攝護 腺炎(chronic bacterial prostatitis)以及慢性攝 護腺炎/慢性骨盆疼痛症候群"},"answer":"D","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh Urology 12th ed. Chapter 56, pp 1202/1206/1209/1210/121 5","sourcePage":365},{"id":"10-007","category":"感染","categoryOrder":10,"number":7,"question":"在接受腎臟移植病人的族群中，何者不是尿路感染的危 險因子？ (","options":{"A":"屍腎移植 C","B":"糖尿病 1","C":"移植前長期洗腎 p","D":"女性","E":"多囊性原腎臟(polycystic native kidneys)"},"answer":"E","reference":"(110)/10.感染/參考資料 摘錄自)： ampbell-Walsh Urology 2th ed. Chapter 55, 1193","sourcePage":366},{"id":"10-008","category":"感染","categoryOrder":10,"number":8,"question":"關於間質性膀胱炎/膀胱疼痛症候群(interstitial cystitis/bladder pain syndrome)，以下何者錯誤？ (","options":{"A":"在沒有 Hunner 氏潰瘍(Hunner’s ulcer)的間質性膀 C 胱炎/膀胱疼痛症候群患者中，肥大細胞(mast cell) 1 占有重要的角色 5","B":"尿路動力學檢查可見膀胱容量減少以及膀胱敏感度 增加(hypersensitivity)","C":"膀胱鏡下看到腎絲球狀出血(glomerulations)是間 質性膀胱炎/膀胱疼痛症候群的專一性特徵","D":"可以做經尿道 Hunner 氏潰瘍燒灼(fulguration)手術 以減少病人疼痛感","E":"須排除細菌性膀胱炎(bacterial cystitis)、攝護腺 炎(prostatitis)、膀胱癌等情形"},"answer":"C","reference":"(110)/10.感染/參考資料 摘錄自)： ampbell-Walsh Urology 2th ed. review, Chapter 7, Q9/Q18/Q19/Q25/Q28","sourcePage":366},{"id":"10-009","category":"感染","categoryOrder":10,"number":9,"question":"下列關於睪丸副睪炎 epididymo-orchitis，何者為真？","options":{"A":"最常見的病毒性睪丸炎其致病原為流行性腮腺炎 ( （Mumps）病毒，亦會導致副睪炎 C","B":"Mumps 為 RNA 病毒，一半 mumps 睪丸炎病患會出現睪 U 丸萎縮並且導致不孕 P","C":"Mumps 睪丸炎的治療為 Interferon,能完全防止睪丸 萎縮","D":"35 歲以下男性因性接觸傳染副睪炎，其常見致病菌 為 Chlamydia trachomatis、Neisseria gonorrhoeae","E":"CDC 建議，上類(D)其治療方式為 ceftriaxone 250 mg intramuscularly in a single dose PLUS Quinolone 口服 10 天療程"},"answer":"D","reference":"(110)/10.感染/參考資料 摘錄自)： ampbell-Walsh-Wein rology(12th e)：56 1218~1220","sourcePage":366},{"id":"10-010","category":"感染","categoryOrder":10,"number":10,"question":"關於卡介苗 bacille Calmette-Guérin (BCG)灌注，下列 何者為真? (","options":{"A":"0.9% 膀胱癌病患接受 BCG 灌注，會併發卡介苗膀胱 炎 BCG cystitis","B":"Quinolone 類抗生素雖然可以預防 BCG 灌注的副作 用，但也會降低療效，故不建議灌注後預防投于","C":"BCG 對 pyrazinamide 有抗藥性，治療 BCG 毒性時，不 建議處方","D":"嚴重 BCG cystitis，處方口服 isoniazid 和 rifampin 治療 6 個月療程","E":"灌注前單劑 Rifampin 可降低 BCG 灌注的副作用"},"answer":"C","reference":"(110)/10.感染/參考資料 摘錄自)： Campbell-Walsh-Wein Urology(12th e), 60 Campbell-Walsh-Wein Urology(12th e), 136 , 3091-3111","sourcePage":366},{"id":"10-011","category":"感染","categoryOrder":10,"number":11,"question":"關於經直腸攝護腺切片後併發急性攝護腺炎，何者為非?","options":{"A":"致病菌常為廣效性乙內醯胺酶(extended-spectrum β-lactamases; ESBLs)產生菌株，常對 fluoroquinolones 有抗藥性","B":"25% 受到 ESBLs 產生菌株感染的病患會進展為慢性攝 護腺炎","C":"最常見感染菌種為 E.coli","D":"有發燒症狀，抗生素治療可處方廣效性 penicillin、2nd or 3rd generation Cephalosporin、amikacin、carbapenems","E":"若形成膿瘍 prostate abscess 小於 2 公分時，可以 保守性抗生素治療或經皮引流"},"answer":"D","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh-Wein Urology(12th e), 56 P1204~1205","sourcePage":367},{"id":"10-012","category":"感染","categoryOrder":10,"number":12,"question":"關於非淋病尿道炎 (Nongonococcal Urethritis)，何者 為非?","options":{"A":"Mycoplasma Genitalium 為第二常見的非淋病尿道炎 (Nongonococcal Urethritis)致病菌","B":"Gram stained.或 nucleic acid amplification tests(NAATs)均可用於確診 M.genitalium","C":"無併發症的 M.genitaliume 感染病患第一線治療方式 為 azithromycin 或 josamycin，而第二線治療為 moxifloxacin 400 mg 口服 7 到 14 天","D":"Chlamydia 潛伏期為 3 到 l4 天，可能在男性會出現 Reiter syndrome 後遺症","E":"非淋病尿道炎治療後復發，應考慮抗藥性 M. genitalium 或感染 T.vaginalis."},"answer":"B","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh-Wein Urology(12th e), 56 P1252~1254","sourcePage":367},{"id":"10-013","category":"感染","categoryOrder":10,"number":13,"question":"關於腎膿瘍(renal abscess)，下列敘述何者錯誤?","options":{"A":"是由化膿性物質(purulent material)積聚在腎實質 (renal parenchyma)所形成","B":"格蘭氏陽性菌 (gram-positive organisms)感染的腎 膿瘍，多經由血行感染(blood-borne)導致，且尿液 培養出的菌種常與血液培養出的菌種一致","C":"超音波是一種快速又不昂貴的檢查方式之一","D":"膿瘍若小於 3 公分，先單以靜脈抗生素(IV antimicrobial agents alone)治療是合理的","E":"膿瘍若大於 5 公分，經皮引流(percutaneous drainage)是第一線治療首選"},"answer":"B","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh Urology 12th Edition Chapter 55 P.1172-1174","sourcePage":367},{"id":"10-014","category":"感染","categoryOrder":10,"number":14,"question":"關於管路相關泌尿道感染(Catheter-associated urinary tract infection)，下列敘述何者錯誤?","options":{"A":"管路相關菌尿症(catheter-associated bacteriuria)是一常見的院內感染 (hospital-acquired infection)","B":"尿管放置的時間長短(duration of catheterization),女性(female gender)是產生管路 相關菌尿症的重要 risk factor","C":"細菌生物膜(bacterial biofilm)會導致管路相關泌 尿道感染與抗生素抗藥性","D":"當病人有感染症狀的時候才治療","E":"當患者使用抗生素治療，感染治癒後建議追加三天 的口服抗生素"},"answer":"E","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh Urology 12th Edition Chapter 55 P.1190-1191","sourcePage":368},{"id":"10-015","category":"感染","categoryOrder":10,"number":15,"question":"下列關於副睪炎與睪丸炎的敘述何者錯誤?","options":{"A":"對於年齡小於 35 歲的患者，抗生素治療必須將性傳 染病列入考量","B":"多數患者在尿液培養中並無法發現致病菌","C":"急性的睪丸炎與副睪炎常合併發生，比單獨發生急 性副睪炎的機率高","D":"腮腺炎病毒睪丸炎痊癒後仍可能影響精子品質","E":"副睪切除手術治療結核菌副睪炎的適應症之一為抗 結核菌藥物治療 8 周後陰囊腫塊未改善"},"answer":"E","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh Urology 12 th edition Chapter 56 P. 1218,1220~1222","sourcePage":368},{"id":"10-016","category":"感染","categoryOrder":10,"number":16,"question":"關於無症狀菌尿症的治療(screen or treat asymptomatic bacteriuria)，下列敘述何者錯誤?","options":{"A":"對於停經後女性(post-menopausal women)不需要治 療無症狀菌尿症","B":"對於有移植腎的病人(patients with renal transplants)不需要治療無症狀菌尿症","C":"對於反覆泌尿道感染的病人(patients with recurrent urinary tract infections)不需要治療 無症狀菌尿症","D":"對於有良好糖尿病控制的病人(patients with well-regulated diabetes mellitus)不需要治療無 症狀菌尿症","E":"對於即將接受泌尿道手術，且此手術會破壞黏膜層 的病人(prior to urological procedures breaching the mucosa)不需要治療無症狀菌尿症"},"answer":"E","reference":"(110)/10.感染/參考資料 (摘錄自)：EAU guideline on Urological Infections 2021 3.3.8 P12-13","sourcePage":368},{"id":"10-017","category":"感染","categoryOrder":10,"number":17,"question":"下列有關年長者(geriatric population)泌尿道感染的敘 述，何者最正確?","options":{"A":"研究已證實治療年長者的無症狀菌尿(asymptomatic bacteriuria)有助於降低死亡率及改善尿失禁 (Incontinence)","B":"急性意識改變的年長患者，處置上建議都應該優先 進行尿液分析(Urinalysis)及培養(Culture)並治療 菌尿(Bacteriuria)，將有助於病況改善","C":"年長的男性較年長女性容易培養出革蘭氏陽性菌 Staphylococcus saprophyticus","D":"年長女性要以中段尿(midstream urine)出現膿尿 (pyuria) ≥10 WBCs/mm3 來作為預測可能有菌尿 (Bacteriuria)的指標","E":"治療結束後不建議例行的收集尿液培養去釐清是否 根除細菌"},"answer":"E","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh Urology 12th edition (A) p.1188, Screening for Bacteriuria, The treatment of asymptomatic bacteriuria to improve incontinence has not been justified. Although studies have demonstrated decreased survival in bacteriuric patients…. (B) p.1188, Diagnosis, If elderly patients experience mental status changes yet no urinary complaints, they should be hydrated the reassessed….. (C) p.1188, Pathogenesis, Staphylococcus saprophyticus is not seen in this population (D) p.1189, Diagnosis, Pyuria is common in elderly patients, and pyuria alone is not a good predictor of bacteriuria… (E) p.1188, Diagnosis, Obtaining a culture to document clearance of bacteria is never recommended","sourcePage":369},{"id":"10-018","category":"感染","categoryOrder":10,"number":18,"question":"對於梅毒(syphilis)的感染，下列敘述何者為非?","options":{"A":"根據台灣疾病管制署通報資料，梅毒感染的年齡以 25 至 34 歲為多","B":"梅毒主要經由性交及其他性行為之緊密接觸傳染， 也可能經由輸血或共用針頭、針具等方式傳染","C":"感染後在接觸處出現無痛性潰瘍與硬性下疳 (chancre)，發生於男性陰莖時可能合併兩側淋巴腺 腫","D":"非特異性梅毒螺旋體試驗(Nontreponemal test)力價 (Titers)變化可以當作疾病活性及治療反應的指標","E":"對於 Penicillin 過敏的硬性下疳(chancre)患者，建 議以 erythromycin 或 azithromycin 治療"},"answer":"E","reference":"(110)/10.感染/參考資料 (摘錄自)： (A)疾病管制 署網站 (B) Chapter 58, syphilis, p. 1257 (C) Chapter 58, primary syphilis, p. 1257 (D) Chapter 58, nontreponemal tests, p. 1258 (E) Chapter 58, table 58.6, p.1259, 建議以 doxycycline 或 tetracycline 治療","sourcePage":370},{"id":"10-019","category":"感染","categoryOrder":10,"number":19,"question":"對於小於二歲的膀胱輸尿管逆流(Vesico-ureteral reflux, VU reflux)之患者，下列何者是罹患發燒性尿路 感染(febrile urinary tract infection)的最相關之危 險因子?","options":{"A":"被確診時之年齡( Age at diagnosis)","B":"一側性 (Laterality)","C":"膀胱輸尿管逆流指數 ( Vesico-ureteral reflux index, VURx)","D":"膀胱輸尿管逆流等級 ( Vesico-ureteral reflux grading)","E":"遠側輸尿管之直徑比 ( Distal ureteral diameter ratio)"},"answer":"C","reference":"(110)/10.感染/參考資料 (摘錄自)：Angela M. Arlen, Traci Leong, Charlotte Q. Wu et al: Predicting Breakthrough Urinary Tract Infection: Comparative Analysis of Vesicoureteral Reflux Index, Reflux Grade, Ureteral Diameter Ratio. J Urology 2020; 204: 572-577","sourcePage":370},{"id":"10-020","category":"感染","categoryOrder":10,"number":20,"question":"有關於性傳播感染 ( Sexually transmitted infection, STI)之描述，下列那一項是錯誤的？","options":{"A":"生殖器官疣 ( Genital warts) 最常是被人類乳頭狀 瘤病毒 (Human Papillomavirus, HPV) 的第 16, 18 型所感染而形成的","B":"梅毒 (Syphilis) 經由性行為途徑來傳播，只有在黏 膜、皮膚出現病灶時才能夠發生","C":"副睪丸發炎也是性傳播感染的其中一種","D":"非披衣菌非淋病尿道炎 (Nonchlamydial nongonococcal urethritis)的最常見細菌感染，是 生殖支原體 (Mycoplasma genitalium)","E":"治療梅毒 (Syphilis)時，如果病患對盤尼西林 (Penicillin)過敏，可以改用四環素 (Tetracycline)"},"answer":"A","reference":"(110)/10.感染/參考資料 (摘錄自)：Smith 19th Edition, Chapter 16: P 243-257.","sourcePage":370},{"id":"10-021","category":"感染","categoryOrder":10,"number":21,"question":"對於半年內罹患過二次或以上有症狀泌尿道感染的婦 女，可建議進行以下之預防措施，那一個除外？","options":{"A":"性行為後可以服用一劑的預防性抗生素","B":"在罹患了泌尿道感染並治療痊癒後，要多延長服用全 劑量（Full dose）抗生素一星期","C":"日常多飲用蔓越莓果汁","D":"使用低劑量持續性預防抗生素（Low-dose prophylaxis）","E":"給予病人三天份的全劑量抗生素和可收集尿液進行 培養的設備，當病人感覺到有泌尿道感染症狀時，利 用設備收集完小便後即先服用抗生素，並儘快把尿液 檢體送至醫院做檢查"},"answer":"B","reference":"(110)/10.感染/參考資料 (摘錄自)：Campbell 11th edition, P270-274.","sourcePage":371},{"id":"10-022","category":"感染","categoryOrder":10,"number":22,"question":"下列有關於感染之描述，那一個是錯誤的？","options":{"A":"泌尿道之再感染( Reinfection)的菌種，常常和前一 次感染的菌種是相同的","B":"對於無症狀菌尿 (Asymptomatic bacteriuria)，一 般建議不使用抗生素，但孕婦除外","C":"婦女罹患非複雜性膀胱發炎，同樣的抗生素，使用三 天和七天之效果是相當的","D":"嵌頓性包莖是引發佛尼爾氏症 (Fournier Gangrene) 的危險因子之一","E":"即使尿液檢查和尿液細菌培養都是正常，也不能完全 排除尿路感染的可能性"},"answer":"A","reference":"(110)/10.感染/參考資料 ( 摘錄自)：Campbell 11th edition, P267-285.","sourcePage":371},{"id":"10-023","category":"感染","categoryOrder":10,"number":23,"question":"下列哪個狀況，引流(Drainage)是治療的優先選項 (Treatment of choice)?","options":{"A":"非阻塞性的產氣性腎盂腎炎(Emphysematous pyelonephritis) ，使用幾天抗生素治療後都沒有改 善","B":"有 2 公分直徑大的腎臟膿瘍 (Renal abscess)","C":"有 2 公分直徑大的腎周邊膿瘍 (Perinephric abscess)","D":"腎積膿 (Pyonephrosis)","E":"非複雜急性腎臟發炎(Uncomplicated acute pyelonephritis)，使用抗生素 4 天後仍然持續發燒"},"answer":"D","reference":"(110)/10.感染/參考資料 (摘錄自)：：Campbell 11th edition, P279-285.","sourcePage":371},{"id":"10-024","category":"感染","categoryOrder":10,"number":24,"question":"下列有關人類免疫不全病毒(Human Immunodeficiency Virus)之敘述，何者錯誤?","options":{"A":"沒有感染愛滋病毒且有風險行為需要服藥者，可透 過穩定持續服用暴露前預防性投藥 PrEP，讓體內有 足夠的藥物濃度來預防被愛滋病毒感染","B":"除了血液，母子垂直感染外，哺乳亦是傳播途徑之 一","C":"為單股 RNA 病毒","D":"感染樹突細胞(dendritic cell)","E":"急性期時，最佳診斷工具為 Rapid enzyme immunoassay(EIA)"},"answer":"E","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.58, P1264","sourcePage":371},{"id":"10-025","category":"感染","categoryOrder":10,"number":25,"question":"敗血症(septicemia)病人最早出現的臨床表徵為？","options":{"A":"發冷(Chills)","B":"發燒(Fever)","C":"過度換氣(Hyperventilation)","D":"意識狀態改變(Change in mental status)","E":"嗜睡(lethargy)"},"answer":"C","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.55, P1183","sourcePage":372},{"id":"10-026","category":"感染","categoryOrder":10,"number":26,"question":"年輕女性感染急性腎盂腎炎(acute pyelonephritis)，最 常見的原因為何？","options":{"A":"膀胱輸尿管逆流(vesicoureteral reflux)","B":"P 纖毛細菌(P-piliated bacteria)","C":"第一型纖毛細菌(Type 1 piliated bacteria)","D":"反覆泌尿道感染","E":"細菌內毒素(endotoxin)"},"answer":"B","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.55, P1134","sourcePage":372},{"id":"10-027","category":"感染","categoryOrder":10,"number":27,"question":"下列關於泌尿系統結核病之敘述，何者錯誤?","options":{"A":"核磁共振常用於輔助診斷泌尿系統結核病","B":"電腦斷層對侵犯其他器官系統之結核病最有幫助","C":"X 光下常見的發現是鈣化","D":"靜脈注射尿路攝影(Intravenous urography, IVU)常 利用於診斷結核病造成之早期腎病變","E":"靜脈注射尿路攝影(Intravenous urography, IVU)常 見之發現為阻塞性尿路疾病(obstructive uropathy)"},"answer":"A","reference":"(110)/10.感染/參考資料 (摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.60, P1312","sourcePage":372},{"id":"10-028","category":"感染","categoryOrder":10,"number":28,"question":"四十一歲男性於四個月內第二次診斷攝護腺炎，細菌培 養報告顯現相同 E. coli 菌叢，請問下列敘述何者為非？","options":{"A":"若合併尿道分泌物之症狀，需檢測淋病","B":"需安排尿流速檢查及測量餘尿量以排除尿滯留","C":"按摩後收集攝護腺液(Expressed prostatic secretion, EPS)白血球量與症狀並非正相關","D":"需安排電腦斷層泌尿道攝影(computed tomography urography,CTU)","E":"第一線治療藥物為 ciprofloxacin 或 levofloxacin"},"answer":"D","reference":"(110)/10.感染/參考資 料(摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.56, P1204-1206","sourcePage":372},{"id":"10-029","category":"感染","categoryOrder":10,"number":29,"question":"根據 2022 年歐洲泌尿科醫學會指引針對泌尿道感染敘 述，下列何者錯誤?","options":{"A":"復發性尿路感染定義為過去六個月中至少有兩次復 發或一年有三次復發的非複雜性/複雜性尿路感染","B":"使用 D-甘露糖(D-mannose)可減少復發性尿路感染","C":"50 歲以下有復發性尿路感染但無風險因素的婦女， 不需進行廣泛性的常規檢查","D":"復發性尿路感染的風險因素包括膀胱脫垂、尿失 禁、殘尿量增加、性行為等","E":"對於遵從性良好的病人，可考慮自行服用短期抗生 素治療"},"answer":"C","reference":"(111) 參考資料(摘錄自)： EAU Guidelines on Urological Infections 2022","sourcePage":373},{"id":"10-030","category":"感染","categoryOrder":10,"number":30,"question":"下列關於攝護腺炎(prostatitis) 的敘述何者為錯誤？","options":{"A":"根據美國國家衛生院(NIH)的分類，無症狀攝護腺發 炎屬於第一類(Category I)","B":"根據整合分析研究(meta-analysis)，抗生素加上 α 交感神經阻斷劑(antibiotics plus α-blockers)的 整合治療慢性攝護腺炎/慢性骨盆腔疼痛症候群 (chronic prostatitis/chronic pelvic pain syndrome)效果最好","C":"攝護腺炎最常見的致病菌為大腸桿菌(E. coli)","D":"慢性攝護腺炎的表現為同一隻致病菌造成反覆性尿 路感染","E":"經直腸攝護腺切片後的攝護腺發炎，可以 carbapenems, amikacin，或第二/第三代頭孢子素治 療"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th ed. Chapter 56 pp.1202, 1204, 1205, 1215","sourcePage":373},{"id":"10-031","category":"感染","categoryOrder":10,"number":31,"question":"下列關於生殖泌尿道的結核病(genitourinary tuberculosis)的敘述何者為錯誤？","options":{"A":"Mycobacterium avium-intracellulare不會造成結 核病。","B":"在懷疑有合併其他器官的結核病感染時，最常使用 電腦斷層掃描併尿路造影。","C":"在腹部 X 光中最常看見的泌尿道結核病表現為鈣化","D":"靜脈腎盂造影為診斷結核病造成的腎臟早期變化的 最佳方法","E":"靜脈腎盂造影最常見的發現為因疤痕造成的阻塞性 變化"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th ed. review, Chapter 60, Q1, Q10","sourcePage":373},{"id":"10-032","category":"感染","categoryOrder":10,"number":32,"question":"下列關於 Fournier 氏壞疽(Fournier's gangrene)的敘述 何者為錯誤？","options":{"A":"需要緊急大範圍的手術清創","B":"通常不需要切除睪丸","C":"陰囊超音波、X 光皆為診斷工具之一","D":"前驅因子包含肥胖、嵌頓性包莖、糖尿病、尿道狹 窄、近期手術等","E":"手術清創通常須包含陰囊皮膚及肉膜肌層(dartos layer)的清創"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th ed. Chapter 55 pp.1181-1182","sourcePage":373},{"id":"10-033","category":"感染","categoryOrder":10,"number":33,"question":"感染 HIV 的病人並不會增加下列何者癌症的發生率？","options":{"A":"Kaposi 氏肉瘤","B":"睪丸癌","C":"陰莖癌","D":"腎臟癌","E":"攝護腺癌"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th ed. Chapter 58 pp.1267-1268","sourcePage":374},{"id":"10-034","category":"感染","categoryOrder":10,"number":34,"question":"下列關於菌尿症與泌尿道感染的敘述，何者正確?","options":{"A":"孕婦泌尿道感染可以使用的抗生素包括 Penicillins, Cephalosporins 以及|Erythromycin","B":"所有的孕婦的菌尿症(bacteriuria)都需要治療","C":"膿尿(pyuria)合併無症狀菌尿症應該接受抗生素治 療","D":"在腎移植的病人中，男性比女性更容易有復發性 (recurrent)泌尿道感染","E":"復發性非複雜性泌尿道感染(uncomplicated recurrent UTI)的長期影響是導致腎臟結疤(renal scarring)"},"answer":"B","reference":"(111) 參考資料(摘錄自)：(111) Campbell-Walsh 12th edition, Chapter 55, P1187,P1148, P1140, Campbell-Walsh 12th edition, review chapter 55,question 6","sourcePage":374},{"id":"10-035","category":"感染","categoryOrder":10,"number":35,"question":"下列泌尿道疾病與致病菌何者正確?","options":{"A":"在年輕性活躍的女性，有 10%的有症狀下泌尿道感染 是 Staphylococcus epidermidis 造成","B":"在年輕女性，最常導致急性腎盂腎炎的是 P 纖毛 (P-piliated )大腸桿菌","C":"最常導致黃色肉芽腫性腎盂腎炎 (xanthogranulomatous pyelonephritis)的致病菌是 克雷伯氏菌(Klebsiella.)","D":"Xanthogranulomatous pyelonephritis 常會出現 Michaelis-Gutmann bodies","E":"Proteus mirabilis, E. coli, Pseudomonas 在尿液 分析中，會呈現 nitrite 陽性反應"},"answer":"B","reference":"(111) Campbell-Walsh 12th edition, Chapter 55, P1132, P1135, P1177, P1141","sourcePage":374},{"id":"10-036","category":"感染","categoryOrder":10,"number":36,"question":"下列關於睪丸與副睪丸炎何者正確?","options":{"A":"急性副睪丸炎(epididymitis)常見是腮腺炎病毒 (mumps virus)造成的","B":"病毒性睪丸炎(orchitis)最常見的是 mumps virus 造 成的","C":"念珠菌菌尿症(Candiduria)不會造成副睪睪丸炎 (epididymo-orchitis)","D":"性傳染(sexually transmitted infection)急性副睪 丸炎最常見是梅毒螺旋體(Treponema pallidum）， 常發生在 35 歲以下性生活活躍的病人","E":"急性副睪炎和慢性副睪炎是以一個月為區分。"},"answer":"B","reference":"(111) Campbell-Walsh 12th edition, Chapter 56 P1220、P1218","sourcePage":374},{"id":"10-037","category":"感染","categoryOrder":10,"number":37,"question":"關於間質性膀胱炎/膀胱疼痛症候群(Interstitial Cystitis, IC/bladder pain syndrome,BPS) 以 下何者敘述錯誤？","options":{"A":"2009 年 Society for Urodynamics and Female Urology(SUFU) 定義症狀需至少持續 6 個月以上","B":"肥大細胞(Mast cell)分泌 Histamine 產生的發炎反 應，可能是造成 IC/BPS 的最終共同路徑之一","C":"Potassium Chloride Test 已經不被建議來診斷 IC/BPS","D":"有 Hunner ulcer 的病人跟沒有 Hunner ulcer 的病人 相比，有 Hunner ulcer 的病人平均年齡比較大","E":"Ketamine Cystitis 的症狀表現跟 IC/BPS 類似，但是 會有比 Hunner ulcer 更廣泛的發炎反應"},"answer":"A","reference":"(111) Campbell-Walsh 12th edition, Chapter 57 P1224, P1232, P1238, P1229, P1233","sourcePage":375},{"id":"10-038","category":"感染","categoryOrder":10,"number":38,"question":"下列有關於性傳染病(Sexually Transmitted Diseases) 的描述何者正確?","options":{"A":"腹股溝肉芽腫(Granuloma Inguinale)是由於披衣菌 (Chlamydia trachomatis)感染造成","B":"非淋菌性尿道炎(Nongonoccal Urethritis) 在已開 發國家，致病源最常見的為黴漿菌(Mycoplasma Genitalium)","C":"在單純皰疹病毒(HSV)引起的生殖器潰瘍中， HSV-1 比 HSV-2 容易復發","D":"感染人類免疫缺乏病毒(HIV)的病人與正常人相比， 不會提高罹患攝護腺癌的風險","E":"診斷滴蟲陰道炎(Trichomoniasis)需要在顯微鏡底 下看到 clue cells"},"answer":"D","reference":"(111) Campbell-Walsh 12th edition, Chapter 58 P1260, P1253, P1271 Campbell-Walsh 12th edition, Review Chapter 58 Question 10","sourcePage":375},{"id":"10-039","category":"感染","categoryOrder":10,"number":39,"question":"下列關於生殖泌尿道結核感染(Genitourinary tuberculosis)何者正確？","options":{"A":"約有 10%合併有肺部結核感染","B":"約 40%的泌尿道結核感染發生在腎臟","C":"泌尿道結核感染若造成輸尿管狹窄在影像上可能呈 現 beaded-corkscrew 樣貌。而輸尿管開口則可能會 觀察到 golf-hole 型態","D":"生殖泌尿道結核也有可能感染到儲精囊, 但不會影響 生育功能造成不孕","E":"生殖泌尿道結核在藥物治療後,仍有 50%的機率造成 疾病復發"},"answer":"C","reference":"(111) Campbell 12th edition, p1308~1318","sourcePage":375},{"id":"10-040","category":"感染","categoryOrder":10,"number":40,"question":"關於慢性攝護腺炎/慢性攝護腺疼痛症候群(CP/CPPS)何 者錯誤？","options":{"A":"經尿道刮除攝護腺手術不能夠緩解疼痛","B":"使用抗發炎藥物時最好以多重模式治療(multimodal therapy)的方式給予，而不要作為單獨治療","C":"臨床上可以使用 UPOINT 分類來幫助我們治療 CP/CPPS 病人不同的面向，其內容包含 urinary、 physical、organ specific、infection、 neurological/systemic、tenderness of skeletal muscle","D":"在此類病人身上使用 Pentosan polysulfate(PPS)， 對於 NIH-CPSI 生活品質分數會有所改善","E":"此類病人在攝護腺切片上只有約 1/3 能夠發現攝護腺 組織發炎現象"},"answer":"C","reference":"(111) Campbell 12th edition, p1210~1217.","sourcePage":376},{"id":"10-041","category":"感染","categoryOrder":10,"number":41,"question":"關於佛尼爾氏壞疽(Fournier gangrene)的描述何者錯 誤？","options":{"A":"致病的菌種常是多種混合，常見的有 Escherichia coli, Bacteroides spp., Streptococcus pyogenes, Staphylococcus aureus","B":"即便接受積極的治療，Fournier gangrene 的死亡率 仍有 60%","C":"在第一次手術後, 通常 24-48 小時要接受 second-look operation 去排除疾病進展","D":"手術過後常見性功能障礙","E":"危險因子包含酗酒、糖尿病以及會陰部的外傷"},"answer":"B","reference":"(111) Campbell 12th edition, p1289~1290.","sourcePage":376},{"id":"10-042","category":"感染","categoryOrder":10,"number":42,"question":"下列有關攝護腺膿瘍(Prostatic abscess)的敘述，何者 正確?","options":{"A":"若有攝護腺發炎症狀合併高燒或本身有免疫抑制相 關疾病(如糖尿病或愛滋病)或治療超過 72 小時反應 不佳可懷疑是否有攝護腺膿瘍的病灶","B":"3 公分以下的病灶在最近幾年研究發現可考慮單純採 取藥物治療","C":"承(B)，單純採取藥物治療與手術治療輔以藥物治療 相比，使用抗生素的療程時間並無差異","D":"若採取抽吸(Aspiration)引流，復發率最高可達 41%","E":"於攝護腺去頂手術(unroofing)後再輔以攝護腺按摩 已被證實是一個有效引流的方法"},"answer":"E","reference":"(111) Campbell Urology 12th edition, page 1205","sourcePage":376},{"id":"10-043","category":"感染","categoryOrder":10,"number":43,"question":"有關人類乳突病毒疫苗(Human papillomavirus vaccine, HPV vaccine)的敘述，何者錯誤?","options":{"A":"四價(Quadrivalent)的 HPV 疫苗可預防 HPV type 6, 11, 16, 18 感染","B":"九價(9-valent)相較於四價疫苗相比，可多預防 HPV type 31, 33, 45, 52, 與 58 的病毒株","C":"所有的 HPV 疫苗都可預防 HPV type 16 與 18，因為此 兩株病毒株在子宮頸癌的角色佔了約 66%","D":"四價疫苗中可預防 HPV type 6 與 11 的感染，其在會 陰部病毒疣的角色約佔 50%","E":"在 HPV 疫苗的相關研究中，疫苗本身與初次性行為的 時間是否提早、是否增加危險性行為的比率還有對 性傳染病的認知能力無關"},"answer":"D","reference":"(111) Campbell Urology 12th edition, page 1262-1263","sourcePage":377},{"id":"10-044","category":"感染","categoryOrder":10,"number":44,"question":"下列關於攝護腺膿瘍（Prostatic abscess）的描述，何 者最不正確？","options":{"A":"危險因子包括長期導尿，泌尿系統手術病史，老年 及較多共病史","B":"膀胱出口阻塞，長期洗腎，糖尿病，肝硬化及 HIV 也 是好發族群","C":"小於 2cm 的 abscess 可以考慮使用藥物治療即可，手 術引流治療並沒有好處","D":"CT 影像上局限性的或較周邊的病灶，可經由超音波 導引經皮引流治療","E":"若以藥物治療效果不好或膿瘍太大，仍應考慮 TURP 治療"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell 12th Chap. 56 p1205 (手術引流可縮短住院療程 及藥物使用時間)","sourcePage":377},{"id":"10-045","category":"感染","categoryOrder":10,"number":45,"question":"關於泌尿道感染，下列敘述何者有誤？","options":{"A":"大多數腎盂腎炎都是逆行性感染，病原菌多來自於 腸道及皮膚","B":"Gram-negative bacteria 及 endotoxin，懷孕，及下 泌尿道阻塞都會有明顯的 anti-peristaltic effect.","C":"cystitis 造成的 mucosal edema 並不會增加尿液經由 UVJ 逆流的機會","D":"病原菌的致病性，像粘膜粘黏性，是重要的因素","E":"長期自我導尿病患的無症狀箘尿（asymptomatic bacteriuria）不需積極治療"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell 12th Chap. 55 p1129-p1131 （cystitis 造成的 mucosal edema 會）","sourcePage":377},{"id":"10-046","category":"感染","categoryOrder":10,"number":46,"question":"下列有關淋病（Gonorrhea）的敘述，何者正確？ 1. 由 Neisseria gonorrhoeae 造成，是美國最常見的細 菌性感染之性傳染病 2. 淋病和梅毒與愛滋病在台灣均列為第三類法定傳染 病，確診後需進行通報 3. 淋病在女性多無症狀，並不會有慢性骨盆疼痛，或子 宮外孕等後遺症 4. NAATs(nucleic acid amplification test)因有較高 的敏感度，為目前偵測 N. gonorrhoeae 及 C. trachomatis 的建議方式","options":{"A":"1, 2","B":"2, 4","C":"2, 3, 4","D":"1, 3","E":"1, 2, 4"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell 12th Chap. 58 p1252-1254","sourcePage":378},{"id":"10-047","category":"感染","categoryOrder":10,"number":47,"question":"在無症狀菌尿症(Asymptomatic bacteriuria)的懷孕婦女 使用單次劑量(single dose)抗生素相較於短期使用 (short course)會增加下列何者的風險?","options":{"A":"產後泌尿道感染(Postpartum infection)","B":"新生兒急性腎損傷(Neonatal acute kidney injury)","C":"早產(Preterm)","D":"羊膜腔感染症候群(Intraamniotic infectious syndrome，IAIS)","E":"較低的出生體重(Low birthweight)"},"answer":"E","reference":"(111) 參考資料(摘錄自)： EAU guideline, infections, 2022, P. 10","sourcePage":378},{"id":"10-048","category":"感染","categoryOrder":10,"number":48,"question":"下列關於茲卡病毒(Zika virus)敘述，何者正確?","options":{"A":"為 DNA 病毒，最早在 1947 年於烏干達被發現","B":"感染病毒後約 70%無症狀，其它症狀包含:輕度發 燒、結膜炎、肌肉痠痛、頭痛","C":"感染後在男女生殖道和精液中，都可檢測到病毒， 母乳中則驗不到","D":"會伴隨嚴重的神經學表現，例如:水腦症 (hydrocephalus)和格林─巴利症候群 (Guillain-Barre syndrome)","E":"如有受孕需求，男性建議間隔有症狀或最後一次暴 露至少 6 個月的時間，女性則為 8 週"},"answer":"E","reference":"(111)/ Campbell-Walsh Urology 12th edition Chapter 58 P.1263-1264","sourcePage":378},{"id":"10-049","category":"感染","categoryOrder":10,"number":49,"question":"下列 5 種性傳染病 (1) 奈瑟氏淋病菌(Neisseria gonorrhoeae) (2) 梅毒(Syphilis) (3) 軟性下疳(Chancroid) (4) 腹股溝肉芽腫(Granuloma inguinale) (5) 性病淋巴肉芽腫(Lymphogranuloma Venereum, LGV), 潛伏期由短到長排序為何?","options":{"A":"13452","B":"31452","C":"13542","D":"31542","E":"14352"},"answer":"D","reference":"(111)/ Campbell-Walsh Urology 12th edition Chapter 58 P.1252,1257, 1259,1260","sourcePage":378},{"id":"10-050","category":"感染","categoryOrder":10,"number":50,"question":"下列關於腎臟包生絛蟲(Renal Echinococcus)的敘述，何 者正確?","options":{"A":"是一種寄生蟲感染，主要感染來自成蟲階段","B":"羊為最終宿主(definitive host)","C":"腎臟囊泡多為單一(single)且位在腎臟皮質 (cortex)","D":"症狀多為反覆高燒、腰痛、血尿、體重減輕和腰部 腫塊","E":"術前建議先做抽吸(aspiration)確定診斷"},"answer":"C","reference":"(111)/ Campbell-Walsh Urology 12th edition Chapter 55 P.1181.e1","sourcePage":379},{"id":"10-051","category":"感染","categoryOrder":10,"number":51,"question":"39 歲男性沒有慢性疾病。慢性右側睪丸疼痛一年。經過 抗生素及抗發炎藥物治療都未有改善。理學檢查發現右 側睪丸觸診輕微疼痛；肛門指診輕微攝護腺不適；右側 閉孔內肌（obturator internus muscle）壓痛。請問下 一步合適的治療？","options":{"A":"Pregabalin","B":"轉診疼痛科","C":"Gabapentin","D":"骨盆底物理治療","E":"顯微右側精索去神經手術（microsurgical denervation of right spermatic cord"},"answer":"D","reference":"(111)/ Campbell Review 12th edition Chapter 56 P197","sourcePage":379},{"id":"10-052","category":"感染","categoryOrder":10,"number":52,"question":"以下關於女性泌尿道感染，何者敘述錯誤？","options":{"A":"一半的女性終其一生經歷一次的泌尿道感染， 20-40%會經歷復發性泌尿道感染（recurrent UTI）","B":"根據 EAU 指引定義，復發性泌尿感染是指 6 個月以內 ≥2 次以上感染或 1 年內≥3 次以上感染","C":"D-甘露糖（D-mannose）在人體的吸收很快速，但是 不會被拿來當成糖份使用，再由腸胃道排出，因此 少數病人會有腹瀉的副作用","D":"研究發現， D-甘露糖減少實驗鼠腸胃道與 Ecoli 第 一型繖毛（Type 1 fimbriae， FimH）的結合","E":"D-甘露糖能防止細菌附著上黏膜並且預防復發性泌 尿道感染的發生，減少泌尿道不適的症狀，也能延長 泌尿道感染復發的時間，改善病人的生活品質"},"answer":"C","reference":"(111)/ Review Eur Urol Focus . 2021 Sep;7(5):1166-1169.","sourcePage":379},{"id":"10-053","category":"感染","categoryOrder":10,"number":53,"question":"關於 Gonococcal urethritis，以下何者錯誤? (111)","options":{"A":"所有感染 Gonococcal urethritis 的患者都建議同時 Campbell U 檢驗其他的性傳染疾病，包含 Chlamydia, syphilis P.1252-125 和 HIV","B":"感染 Gonococcal urethritis 的患者必續停止性行 為，直到治療完成的 7 天之後以及所有性伴侶都接受 治療為止，且與患者在 60 天內有從事性行為的伴侶 都必須接受檢查","C":"診斷 Gonococcal urethritis 可以採用 Gram stain, culture, nucleic acid amplification test (NAAT) 等方法，其中，Culture 必須用 first-catch urine 來培養，而 NAAT 則可以選擇 first-catch urine 或 是 urethral swabs 作為採集方法","D":"治療 Gonococcal urethritis，若患者對以下藥物沒 有禁忌症，CDC 建議使用肌肉注射 Ceftriaxone 250mg 單劑加上口服 Azithromycin 2g 單次使用","E":"僅有 5-20%的 urethritis 為 Gonococcal urethritis，其餘的皆為 nongonococcal urethritis，在這些患者裡面，又以 C. trachomatis 和 M. genitalium 為大宗"},"answer":"C","reference":"th rology 12 ; 3","sourcePage":380},{"id":"10-054","category":"感染","categoryOrder":10,"number":54,"question":"以下關於 Genital ulcer disease 的敘述，何者錯誤？ (111)","options":{"A":"Genital herpes 是由於 Human simple virus (HSV) Campbell U type I 和 type II 感染所導致，過去以 HSV type II P.1255-126 感染為大宗，然而，近年 HSV type I 的盛行率在先 進國家也逐步升高，常見的症狀為多發性, 伴隨疼痛 的 papular lesions or vesicles，也可能伴隨 aseptic meningitis 或 autonomic dysfunction","B":"Primary syphilis 的潛伏期通常為接觸後的 10 到 90 天，之後會長出 Chancre 並伴隨局部吳無痛性淋巴腫 大，Chancre 為單一顆的無痛性病灶，在 primary syphilis 這個階段，通常不會伴隨全身性的併發症","C":"Chancroid 是革蘭氏陰性桿菌 Haemophilus ducreyi 感染所導致，潛伏期約為一個月至一個半月，症狀 經常由單一或多個伴隨疼痛的紅疹來表現，這些紅 疹會在數天之後轉為膿胞破裂，進而形成潰瘍，有 約一半的患者會伴隨單邊的腹股溝淋巴腫大","D":"Lymphogranuloma Venereum (LGV)是由 C. trachomatis 的其中一類血清型感染導致，C. trachomatis 是一種絕對胞內寄生的致病體，LGV 的 感染可以分為三個階段，依時間先後分為 local infection stage, regional dissemination stage 和 progressive tissue damage stage","E":"Granuloma Inguinale 是由 Klebsiella granulomatis 感染導致，其潛伏期長達接近 50 天，症狀為緩慢生 長的無痛性潰瘍病灶，多半出現在生殖器或會陰 部，僅有 10%會出現鼠蹊部病灶"},"answer":"C","reference":"th rology 12 ; 0","sourcePage":380},{"id":"10-055","category":"感染","categoryOrder":10,"number":55,"question":"以下關於 Genitourinary tuberculosis (GU TB)的敘述， (111) 何者正確? Campbell U","options":{"A":"GU TB 的發生率和地區有非常大的關聯性，有 90%的 P.1307-131 GU TB 發生於發展中國家，且發展中國家的 P.1307 pulmonary TB 患者有 15~20%都伴隨有 GU TB，反之，","B":"P.1308 在已開發國家僅有 2~10%的 pulmonary TB 患者伴隨 腎臟是最常發生 GU TB 的器官，隨著感染進程，患者","C":"P.1310 GU TB，在美國，GU TB 是最常見的 extrapulmonary 目前，診斷 GU TB 的 gold standard 仍是 acid-fast","D":"P.1310 TB 發生處 P.1317 會產生漸進式的腎功能缺損，最後導致整個腎臟失 能，以致 auto-nephrectomy，Auto-nephrectomy 又 可以分為兩種，caseocavernous type 會伴隨 severe scaring 和 calcification，整個腎臟會明顯萎縮， 而 fibrotic type 會形成許多 granulomas 和充滿 inflammatory exudate 的 cavities，慢性感染可能 會導致 renal pelvis 產生 urothelial carcinoma bacilli (AFB) culture，建議使用 first-voided urine 來培養，然而，在 real-world practice 裡 面，AFB culture 的 sensitivity 不高且要花許多時 間，目前已逐漸被 nucleic acid amplification tests (NAATs) 取代，NAATs 不僅 sensitivity 高， 也能用來評估治療後的療效 Tuberculin skin test (TST) 和 interferon-gamma release assays (IGRAs)是兩種 TB 的 screening test，其缺點是沒有辦法分辨 active TB 和 latent TB","E":"有大約五成的 GU TB 患者需要接受手術治療，手術目 的包含解除 urinary obstruction,移除 non-function kidney 等等，最佳的手術時機是確診 GU TB 到開始 TB 用藥之前，以利用手術降低菌落數以 增強 TB 藥物的效果"},"answer":"D","reference":"th rology 12 ; 7 -1309","sourcePage":381},{"id":"10-056","category":"感染","categoryOrder":10,"number":56,"question":"以下何者不是反覆泌尿道感染的危險因子? (111) Campbell U","options":{"A":"肥胖","B":"停經後婦女 P.1160","C":"使用殺精劑(Spermicide)","D":"性行為","E":"最近使用過抗生素"},"answer":"A","reference":"rology 12th;","sourcePage":381},{"id":"10-057","category":"感染","categoryOrder":10,"number":57,"question":"以下何者不是會使得 UTI 被歸類為 complicated UTI 的 host factors?","options":{"A":"Cystocele","B":"Indwelling catheter","C":"Bladder outlet obstruction","D":"Overactive bladder","E":"Diabetes"},"answer":"D","reference":"(111) th Campbell Urology 12 ; P.1158","sourcePage":382},{"id":"10-058","category":"感染","categoryOrder":10,"number":58,"question":"造成腎臟膿瘍(renal abscess)最常見的致病菌種，下列 何者為錯?","options":{"A":"E.coli","B":"Proteus","C":"Klebsiella","D":"Staphylococcus","E":"Pseudomonas spp"},"answer":"D","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 55, p.1172","sourcePage":382},{"id":"10-059","category":"感染","categoryOrder":10,"number":59,"question":"有關性傳染病造成的生殖器潰瘍，下列何者正確?","options":{"A":"二期梅毒的硬性下疳(chancre)通常是無痛的，未治 療也會自然癒合","B":"潛伏期梅毒(latent syphilis)雖無症狀，都需打三 劑 Benzathine penicillin G 來治療","C":"第一型疱疹病毒(HSV-1)的復發率較第二型(HSV-2) 高","D":"軟性下疳(chancroid)通常會痛，azithromycin 或 ceftriaxone 皆可治療","E":"花柳性淋巴肉芽腫(lymphogranuloma venereum)的潰 瘍通常會痛，腹股溝淋巴結不痛"},"answer":"D","reference":"(112) 參考資料(摘錄自)： Campbell 12th edition, page 1256-1260","sourcePage":382},{"id":"10-060","category":"感染","categoryOrder":10,"number":60,"question":"下列與性感染症相關的臨床病灶與可能致病原的組合， 何者錯誤?","options":{"A":"軟性下疳(chancroid)-克雷氏桿菌","B":"扁平濕疣(condyloma lata)-梅毒螺旋體","C":"花柳性淋巴肉芽腫(Lymphogranuloma vereneum, LGV )-披衣菌","D":"子宮頸癌及陰莖癌-高風險型人類乳突病毒 (HPV)16、18、31、33、35","E":"傳染性軟疣(molluscum contagiosum)–雙股螺旋 DNA 病毒中的之軟疣病毒"},"answer":"A","reference":"(112) 參考資料(摘錄自)： 第 12 版 Campbell A p1259 B p1257 C p1260 D p1261 E p1261","sourcePage":382},{"id":"10-061","category":"感染","categoryOrder":10,"number":61,"question":"有關女性的泌尿道感染，下列何者錯誤？","options":{"A":"懷孕時因黃體激素增加導致肌肉放鬆，造成輸尿管 擴張","B":"在老年婦女中，給予陰道雌激素可以降低症狀性尿 路感染的發生率","C":"停經後，陰道液自然鹼化的作用減弱，導致尿路感 染機會增加","D":"所有孕婦應定期接受細菌尿液培養，有菌尿時不管 有沒有症狀都要治療","E":"急性腎盂腎炎的孕婦需住院使用靜脈注射抗生素治 療"},"answer":"C","reference":"(112)/10.感染/參考資料 (摘錄自)： Campbell 12th edition, page 1185, 1187, 2920.e11","sourcePage":383},{"id":"10-062","category":"感染","categoryOrder":10,"number":62,"question":"下列關於泌尿道結核(genitourinary Tuberculosis)的敘 述何者正確？","options":{"A":"經由血行性感染攝護腺時，症狀會較類似急性細菌 性攝護腺發炎，觸診時會有波動感(fluctuation)及 疼痛；而經由泌尿道感染攝護腺時，通常會侵犯尿 道並且有鈣化產生","B":"有一半的患者會需要侵入性治療或手術，且保守治 療開始後 4 到 6 周才是最適合侵入性治療或手術的時 間，能有效降低結核菌菌落量","C":"當患者為無功能性腎臟(nonfunctional kidney)且在 藥物治療下仍有頑固性高血壓，可以考慮進行腎臟 切除，但是大約只有 1/5 的患者高血壓可以得到改善","D":"副睪有感染且保守治療無效，臨床上建議要把副睪 與睪丸一起切除","E":"即使以保守性治療搭配侵入性治療，仍有約五成的 泌尿道結核患者半年內會復發，因此後續建議須追 蹤兩年"},"answer":"B","reference":"(112)/10.感染/參考資料 (摘錄自)： Campbell 12th edition, ch60. p.1309-1318","sourcePage":383},{"id":"10-063","category":"感染","categoryOrder":10,"number":63,"question":"下列關於泌尿道感染的敘述何者正確?","options":{"A":"長期放置尿管的病人約有 10%的下泌尿道感染症狀是 由 S. saprophyticus 引起","B":"生物膜(Biofilm)可保護細菌免受環境挑戰，會使細 菌生長速度變慢","C":"許多泌尿道感染的病菌，可藉由促進 NF-κB 的作用 S 來降低免疫反應","D":"Type 1 pili 常見 E. coli，又稱 mannose-sensitive hemagglutination (MSHA)，易附著在腎臟造成腎盂 腎炎","E":"細菌的抗藥性主要來自於粒線體遺傳"},"answer":"B","reference":"(112)/10.感染/參考資料 Campbell-Walsh Urology, 12th edition. Chapter 55 (A) p.1132 . saprophyticus is recognized as causing approximately 10% of symptomatic lower UTIs in young, sexually active females, whereas it rarely causes infection in males and elderly individuals (B)p.1136 (C) p.1139 It has also been shown that many uropathogenic bacteria can suppress NF-κB, increase apoptosis, and decrease the inflammatory responses (D) p.1134 P pili confer tropism to the kidney; P pili, which are found in most pyelonephritogenic strains of UPEC (E)p.1149 Bacterial resistance may occur because of intrinsic chromosomal mediated resistance or by acquired chromosomal- or extrachromosomal(plasmi d)-mediated resistance caused by exposure oh an organism to antimicrobial agents","sourcePage":383},{"id":"10-064","category":"感染","categoryOrder":10,"number":64,"question":"關於腎臟及泌尿系統感染的敘述何者正確?","options":{"A":"產氣性腎盂腎炎病患若在電腦斷層影像看到腎臟或 腎臟周圍有積液(fluid)，死亡率大於 50%","B":"產氣性腎盂腎炎是泌尿科急症，好發於糖尿病患 者，男性比女性多","C":"急性腎盂腎炎於顯影劑電腦斷層檢查下，受影響的 腎實質表現為灌流增加","D":"軟化斑(Malacoplakia)需切片診斷，在顯微鏡下可 以看到 Michaelis-Gutmann bodies","E":"壞死性筋膜炎(Fournier's gangrene) 感染源自於生 殖器時，感染細菌可能會沿著陰莖和陰囊的 Buck fascia ，會陰的 Colles fascia 和前腹壁的 Scarpa Fascia 擴散"},"answer":"D","reference":"(112)/10.感染/參考資料 (摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 55 (A)p.1171 The presence of renal or perirenal fluid, the presence of bubbly or loculated gas or gas in the collecting system, and the absence of streaky or mottled gas patterns are associated with a less than 20% mortality rate. (B) p.1171 Women are affected more often than men (C)p.1170 Radionuclide imaging may be useful to demonstrate functional changes associated with acute pyelonephritis (decrease in renal blood flow, delay in peak function, and delay in excretion of the radionuclide) (D)p.1179 (E)p.1181 originating in the genitalia, specifically as a result of urethral obstruction, the infecting bacteria probably pass through Buck fascia of the penis and spread along the Dartos fascia of the scrotum and penis, Colles fascia of the perineum, and Scarpa fascia of the anterior abdominal wall.","sourcePage":384},{"id":"10-065","category":"感染","categoryOrder":10,"number":65,"question":"下列有關常見生殖器膿瘍的致病原及描述何者錯誤?","options":{"A":"梅毒(Syphilis)，致病原為 Treponema pallidum，次 級梅毒治療使用單劑 penicillin G","B":"軟性下疳(Chancroid)，致病原為 Haemophilus ducreyi，約一半的病人會出現單側的 inguinal lymphadenitis","C":"皰疹 (HSV) ，致病原為 HSV-1 和 HSV-2，生殖器皰 疹的大多數病例是由 HSV-2 引起","D":"肛門生殖器疣（ Anogenital Wart ），致病原最常見 為 HPV 第 6、11 型，與生殖器癌症較無關","E":"淋巴肉芽腫(Lymphogranuloma Venereum)，致病原為 Chlamydia trachomatis，男性病患較女性病患常見 伴隨疼痛的腹股溝淋巴結"},"answer":"A","reference":"(112)/10.感染/參考資料 (摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 58 (A)p.1259 Table 58.6 Benzathine penicillin G 2.4 million units IM once a week for 3 weeks (B)p.1259 (C)p. 1255 (D)p.1261 (E)p.1260","sourcePage":385},{"id":"10-066","category":"感染","categoryOrder":10,"number":66,"question":"關於淋病性尿道炎 (Gonococcal urethritis)的敘述，何 者錯誤？","options":{"A":"Neisseria gonorrhoeae 所引起的疾病，屬於革蘭氏 陰性雙球菌","B":"即便使用Ceftriazxon加doxycycline治療效果很 好，因再感染率高，仍須六個月後再做檢測","C":"淋病是第三類法定傳染病，需於一週內通報。","D":"常伴隨黃綠色化膿性分泌物 (Purulent discharge)","E":"可能進展成gonococcal bacteremia造成瀰漫性感染"},"answer":"B","reference":"(112)/10.感染/參考資料 (摘錄自)： Smith & Tanagho’s General Urology, 19th edition. Chapter 16 p.244 - p.246 （B）p.246 B ecause of the high rates of reinfection, repeat testing should occur 3 months after treatment regardless of whether sexual partners were treated","sourcePage":386},{"id":"10-067","category":"感染","categoryOrder":10,"number":67,"question":"下列有關人類免疫缺陷病毒(Human immunodeficiency virus)的敘述，下列何者錯誤？","options":{"A":"包皮環切術可降低 HIV 感染的風險","B":"HIV 病毒對於免疫系統的影響在於CD4 T-lymphocytes 逐漸減少","C":"HIV 有兩種類型: HIV-1 和 HIV-2。在美國，HIV-1 感染占大多數","D":"HIV-associated nephropathy (HIVAN) 典型表現為 血清肌酸酐升高和蛋白尿(> 3.5g /天)並出現水腫及 高血壓","E":"小於50歲男性感染HIV，常見勃起功能障礙"},"answer":"D","reference":"(112)/10.感染/參考資料 (摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 58 （Ａ）p.1264 Three randomized, controlled studies performed in sub-Saharan Africa demonstrated that circumcision decreased the risk for HIV infection by 50% to 60% （Ｂ）p.1264 Immunosuppression occurs with the progressive loss of CD4 T-lymphocytes.. （C）p.1264 There are two types of HIV: HIV-1 and HIV-2. Although HIV-1 accounts for the majority of infections in the United States, (D)p.1267 HIVAN is characterized by an elevated serum creatinine and nephrotic-range proteinuria (>3.5g/day), although edema and hypertension are frequently absent. ( E )p.1267 ED is common in HIV-infected men younger than 50 years of age","sourcePage":386},{"id":"10-068","category":"感染","categoryOrder":10,"number":68,"question":"下列關於尿路感染致病菌相關的敘述，何者為錯？","options":{"A":"泌尿道致病性大腸桿菌 (Uropathogenic Escherichia coli, UPEC) 造成女性復發性尿路感染 的上皮細胞受器不僅只出現於陰部的上皮細胞，意 味著上皮細胞的接受力與基因也有關聯，其中以 HLA-A2 較為顯著","B":"停經後婦女因雌激素濃度較低而較易有復發性的尿 路感染，接受荷爾蒙替代療法(postmenopausal hormone therapy)的女性，尿路感染發生率則較低， 也會降低細菌的黏附","C":"甘露糖敏感性鞭毛(Mannose-sensitive Pili)是已被 確認的尿路感染致病因子，主要是其上的 FimH 黏附 蛋白與膀胱尿路上皮的受器的交互作用","D":"大腸桿菌是尿路感染最常見的致病菌種， ST131 亞 型(血清型 O25b:H4)的感染迅速增加，為多重抗藥性 感染的原因","E":"正常人的尿液有抑制致病菌生長的環境，若處於高 滲透壓與低 pH 值的酸性環境時，致病菌的生長將會 被抑制"},"answer":"A","reference":"(112)/10.感染/參考資料 (摘錄自)：Campbell 12ed. Ch55 (A) p1135-1136，應為 HLA-A3 (B) p1136 (C) p1133 (D) p1132 p1137","sourcePage":387},{"id":"10-069","category":"感染","categoryOrder":10,"number":69,"question":"下列關於攝護腺炎的相關敘述，何者錯誤？","options":{"A":"肉芽腫性攝護腺炎(Granulomatous prostatitis)最 常在攝護腺刮除手術或切片後發現","B":"經直腸攝護腺切片後病人的切片後感染與攝護腺 炎，應優先考慮使用第二代~第三代頭孢子素 (cephalosporin)或碳青黴烯(carbapenem)類的抗生 素作為第一線治療","C":"社區型感染的攝護腺炎生率為院內感染的三倍，院 內感染的常見菌種為 P. aeruginosa, enterococci, S. aureus","D":"慢性細菌性攝護腺炎最常見的致病菌有 E. coli, Pseudomonas, Chlamydia, Proteus","E":"對於尿路感染的男性病患，1~2cm 的攝護腺膿瘍建議 以抗生素保守治療為主"},"answer":"D","reference":"(112)/10.感染/參考資料 (摘錄自)：Campbell 12ed. Ch56 (A) p1203 (B) p1204 (C) p1204 (D) p1206 Chlamydia 被認 為是尿道的 contamination. p1205","sourcePage":387},{"id":"10-070","category":"感染","categoryOrder":10,"number":70,"question":"男同性戀患者於不安全性行為後，在生殖器上開始出現 丘疹及潰瘍，同時也有出現尿道搔癢排尿灼熱的症狀， 接著幾個星期後在右側鼠蹊部位按到疼痛性淋巴硬塊， 也開始出現發燒、畏寒、肌肉疼痛的症狀。下列最可能 的診斷為哪一個？","options":{"A":"Genital herpes","B":"Primary syphilis","C":"Lymphogranuloma","D":"Chancroid","E":"Donovanosis"},"answer":"C","reference":"(112)/10.感染/參考資料 (摘錄自)：Campbell 12ed. Ch58 p. 1255-1260","sourcePage":388},{"id":"10-071","category":"感染","categoryOrder":10,"number":71,"question":"關於睪丸疼痛(orchialgia)的敘述，何者錯誤？","options":{"A":"在慢性睪丸疼痛的病患中，Wallerian degeneration 很容易在病患的神經切片(nerve biopsy)發現，此類 病人的切片染色可發現精索中有較多的 calcitonin gene-related peptide (CGRP) positive nerves","B":"與慢性骨盆疼痛症候群(chronic pelvic pain syndrome)相同，抗生素治療很少需要使用","C":"結核性副睪炎(Tubercular Epididymitis)至少需使 用結核藥物達 6 個月，若治療後感染腫塊持續增大則 應考慮手術，手術建議在使用結核藥物的情況下進 行","D":"慢性睪丸疼痛的非藥物低侵入性治療中，研究指出 於精索使用高頻脈衝療法(Pulsed Radiofrequency) 可降低病患的疼痛，且沒有睪丸萎縮或陰囊區域皮 膚去敏化等後遺症","E":"急性睪丸炎中，病毒性睪丸炎相較細菌性睪丸炎較 為少見，病毒性睪丸炎多由腮腺炎病毒(Mumps virus)造成，此病毒也容易在病毒性的急性副睪炎 中檢驗到"},"answer":"E","reference":"(112)/10.感染/參考資料 (摘錄自)：Campbell 12ed. Ch56 (A) p1219-1220， Mumps virus 在 viral epididymitis 少見 (B) p1219 (C) p1219-1220 (D) p1221 p1221","sourcePage":388},{"id":"10-072","category":"感染","categoryOrder":10,"number":72,"question":"關於尿道炎(urethritis)，下列何者正確？","options":{"A":"常是性傳染病(Sexually transmitted disease)造 成，典型症狀有尿道分泌物、排尿疼痛、尿道搔癢 等，但是文獻指出尿道炎常是無症狀","B":"淋病性尿道炎的致病菌為革蘭氏陽性雙球菌，主要 特色是在顯微鏡下可發現病菌在白血球細胞內","C":"最常見的非淋病尿道炎((Nongonococcal Urethritis)的致病菌為 Chlamydia trachomatis， 其治療以口服 Metronidazole 為主","D":"在非淋病尿道炎(Nongonococcal Urethritis)中的致 病菌有，Trichomonas vaginalis屬第二常見，僅次 於 Chlamydia trachomatis","E":"在非淋病尿道炎(Nongonococcal Urethritis)中的致 病菌 Mycoplasma Genitalium，可見於肛交病患中， 診斷方式為以細菌培養後，革蘭氏染色出來"},"answer":"A","reference":"(112)/10.感染/參考資料 (摘錄自)：Campbell 12ed. Ch58 (A) p1252 (B) p1252 (C) p1252-1253 (D) p1252 p1253","sourcePage":388},{"id":"10-073","category":"感染","categoryOrder":10,"number":73,"question":"有關藥物治療外生殖器潰瘍(genital ulcer)的描述，下 列何者錯誤?","options":{"A":"第三級梅毒(沒有神經學病變)使用盤尼西林 (Benzathine penicillin G)2.4 百萬單位注射治療， 每週一次，連續三週","B":"第一次發生外生殖器泡疹可以使用 200 毫克 acyclovir 一天三次，持續一週","C":"潛伏期梅毒可以使用單次盤尼西林(Benzathine penicillin G)2.4 百萬單位注射治療","D":"軟性下疳(chancroid)可以單次口服一克阿奇黴素 (azithromycin)","E":"腹股溝肉芽腫(granuloma inguinale)可以每週口服 一克阿奇黴素(azithromycin)，持續三週"},"answer":"B","reference":"(112)/10.感染/參考資料 (摘錄自)：Smith & Tanagho’s General rology, 19th edition. Chapter 16, p249","sourcePage":389},{"id":"10-074","category":"感染","categoryOrder":10,"number":74,"question":"有關會陰部壞死性筋膜炎(Fournier gangrene)的描述下 列何者為非?","options":{"A":"感染源可以來自表皮、尿道或是直腸","B":"細菌培養呈現多種細菌","C":"感染可以沿著 scarpa fasia of perineum 擴散","D":"24 到 48 小時可以進行第二次清創手術","E":"恥骨上膀胱造廔口手術或是大腸造口手術不需要常 規進行"},"answer":"C","reference":"(112)/10.感染/參考資料 (摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 55, p.1181-1182","sourcePage":389},{"id":"10-075","category":"感染","categoryOrder":10,"number":75,"question":"卡介苗(Bacille Calmette-Guérin,BCG)是用來治療膀胱 癌(non-muscle invasion bladdercancer)的藥物。下列 使用 BCG 治療時的描述，何者錯誤?","options":{"A":"巨觀血尿(gross hematuria)是絕對禁忌症","B":"泌尿道發炎(urinary tract infection)是絕對禁忌 症","C":"完全失禁(total incontinence)是絕對禁忌症","D":"治療過程中發生 BCG 副作用(發燒、血尿)，可以考慮 使用原本 BCG 劑量的一半或是三分之一繼續治療","E":"Pyrazinamide 在治療 BCG 副作用沒有角色"},"answer":"B","reference":"(112)/10.感染/參考資料 (摘錄自)： Campbell-Walsh Urology, 12th edition. Chapter 136, p.3102","sourcePage":389},{"id":"10-076","category":"感染","categoryOrder":10,"number":76,"question":"上圖是一位男性患者生殖器的病灶，下列何者不正確？","options":{"A":"屬於痘病毒（poxvirus, DNA）病毒感染","B":"免疫力正常者，可在 6~12 個月後自行消失","C":"可施打疫苗免疫","D":"常用治療包括手術切除、電燒或雷射去除","E":"病理檢查發現表皮角質細胞胞漿內可見特殊的包涵 體"},"answer":"C","reference":"(112)/10.感染/參考資料 (摘錄自)： 李嘉文、陳煜：性傳染病 臨床圖譜與治療。第三 版、2020，台灣泌尿科醫 學會。pp183-186.","sourcePage":390},{"id":"10-077","category":"感染","categoryOrder":10,"number":77,"question":"一位五十歲女性病患因血尿檢，IVP 顯示左腎無功能，進 行逆行性腎盂攝影，如圖，下列敘述何者正確？","options":{"A":"疑似尿路上皮癌，應考慮腎及輸尿管切除手術","B":"疑似結石應做電腦斷層攝影，準備取石手術","C":"應做尿液耐酸菌細菌培養","D":"考慮做軟式輸尿管鏡切片檢查","E":"屬厭氧菌感染，檢查是否有糖尿病或免疫力低下之 疾病"},"answer":"C","reference":"(112)/10.感染/參考資料 (摘錄自)： Smith’s General Urology. 17th edition, Chapter 14, pp222-223.","sourcePage":390},{"id":"10-078","category":"感染","categoryOrder":10,"number":78,"question":"下列關於尿路系統的微生物組(microbiome)的敘述，何 者正確？","options":{"A":"尿液是無菌的，微生物組僅存在於有尿路感染的病 人的尿液中","B":"利用次世代序列分析(next generation sequencing) 16s DNA 方法，可以找到細菌的 DNA","C":"微生物組都會產生致病毒素，使病人罹患疾病","D":"微生物組提供上皮黏膜細胞缺乏的獨特的代謝與功 能能力，稱為互利共生 R","E":"男性病患透過排尿可以適當的得到膀胱微生物組獨 特的菌種 u"},"answer":"D","reference":"(112)/10.感染/參考資料 (摘錄自)： Patel, S.R., Ingram, C., Scovell, J.M. et al. The Microbiome and Urolithiasis: Current Advancements and Future Challenges. Curr Urol ep 23, 47–56 (2022). https://doi.org/10.1007 /s11934-022-01088-8. 1. Wolfe AJ, Brubaker L. Urobiome updates: advances in urinary microbiome research. Nat Rev Urol. 2019 Feb;16(2):73-74. doi: 10.1038/s41585-018-0 127-5. PMID: 30510275; PMCID: PMC6628711. BAJIC, Petar, et al. Male bladder microbiome relates to lower urinary tract symptoms. European rology focus, 2020, 6.2: 376-382.","sourcePage":391},{"id":"10-079","category":"感染","categoryOrder":10,"number":79,"question":"下列關於急性腎盂腎炎這幾年研究的敘述，何者正確？","options":{"A":"歐洲一個大型研究顯示，病人服用抗凝血劑會增加 菌血症的風險","B":"服用預防性的低分子量的肝素 heparin，可以稍微降 低菌血症與急性腎損傷的風險","C":"經驗法則建議的第一線注射抗生素包括 Cefepime","D":"非複雜型的急性腎盂腎炎，可以考慮使用 nitrofurantoin 口服治療","E":"非複雜型急性腎盂腎炎的定義包括無任何腎臟疾病 或其他共病的停經後婦女"},"answer":"B","reference":"(112)/10.感染/參考資料 (摘錄自)： Steiner SE, Edgren G, Melican K, Richter-Dahlfors A, Brauner A. Effect of anticoagulant and platelet inhibition on the risk of bacteremia among patients with acute pyelonephritis: a retrospective cohort study. BMC Infect Dis. 2022 May 31;22(1):509. doi: 10.1186/s12879-022-0747 4-4. PMID: 35641940; PMCID: PMC9158213. EAU guidelines on urinary tract infection. pp24-27 https://uroweb.org/guid elines/urological-infec tions/chapter/the-guide line","sourcePage":392},{"id":"10-080","category":"感染","categoryOrder":10,"number":80,"question":"下列關於這個病人尿袋圖片的敘述，何者不正確？","options":{"A":"高齡女性長期臥床者患者居多","B":"根據 98 篇文獻報告的統計結果，大腸桿菌的感染最 多","C":"尿液中的白氨酸(Leucin)被細菌分解成顏色產物","D":"尿液常呈鹼性","E":"不能單獨只給抗生素治療，應先更換導尿管"},"answer":"C","reference":"(112)/10.感染/參考資料 (摘錄自)： 1. Sabanis N, Paschou E, Papanikolaou P, Zagkotsis G. Purple Urine Bag Syndrome: More Than Eyes Can See. Curr Urol. 2019 Nov;13(3):125-132. doi: 10.1159/000499281. Epub 2019 Nov 13. PMID: 31933590; PMCID: PMC6944938. 2. Yang HW, Su YJ. Trends in the epidemiology of purple urine bag syndrome: A systematic review. Biomed Rep. 2018 Mar;8(3):249-256. doi: 10.3892/br.2018.1046 . Epub 2018 Jan 23. PMID: 29564123; PMCID: PMC5854937. EAU guidelines on urinary tract infection. pp24-27 https://uroweb.org/guid elines/urological-infec tions/chapter/the-guide line","sourcePage":392},{"id":"10-081","category":"感染","categoryOrder":10,"number":81,"question":"有關腎臟感染，下列何者錯誤？","options":{"A":"無免疫低下者，腎膿瘍(renal abscess)是否使用經 皮引流的臨界直徑大小為 5 公分","B":"腎旁膿瘍(perinephric abscess)進行早期引流的臨 界直徑為 3 公分","C":"感染性水腎(infected hydronephrosis)或膿腎 (pyonephrosis)皆應早期引流","D":"急性多發性細菌性腎炎(acute multifocal bacterial nephritis)應早期引流","E":"產氣性腎盂腎炎(emphysematous pyelonephritis)應 早期引流"},"answer":"D","reference":"(112)/10.感染/參考資料 (摘錄自)： Campbell 12th edition, page 1171-1176","sourcePage":393},{"id":"10-082","category":"感染","categoryOrder":10,"number":82,"question":"有關泌尿道感染的敘述下列何者正確？","options":{"A":"單導的尿液培養若細菌 ≥100 colony forming units (CFUs)/mL 表示有菌尿症","B":"女性及老年人是造成複雜性泌尿道感染 (complicated UTI)的因素之一","C":"若女性反覆性泌尿道感染懷疑是 reinfection 造成， 應積極安排影像檢查","D":"Klebsiella 感染泌尿系統經常會造成無菌性膿尿症 (sterile pyuria)","E":"有尿管的病人，尿中細菌 ≥100,000 CFUs/mL 才代表 有顯著菌尿症"},"answer":"A","reference":"(112)/10.感染/參考資料 (摘錄自)： Campbell 12th edition, page 1130, 1142, 1143, 1147, 1190","sourcePage":393},{"id":"10-083","category":"感染","categoryOrder":10,"number":83,"question":"下列針對單純皰疹病毒(Herpes simplex virus, HSV)造 成之生殖器皰疹的相關敘述，何者為非?","options":{"A":"比起 HSV type 1，HSV type 2 在初次感染後較常反 覆發作","B":"常用的口服抗病毒藥物包括 acyclovir、 valacyclovir 和 famciclovir","C":"口服抗病毒藥物針對復發生殖器皰疹的單次療程 (episodic therapy)，建議於病灶發生三日內使用","D":"口服抗病毒藥物的長期抑制療程(Suppressive therapy)，可減少復發機會與傳遞給伴侶的風險","E":"有症狀的初次發作之生殖器皰疹患者應該都要接受 口服抗病毒藥物的治療"},"answer":"C","reference":"(112)/10.感染/參考資料 (摘錄自)： 第 12 版 Campbell A p1256 B p1257 C p1257 D p1256 E p1256","sourcePage":394},{"id":"10-084","category":"感染","categoryOrder":10,"number":84,"question":"下列針對梅毒(syphilis)患者的敘述何者錯誤?","options":{"A":"硬性下疳(chancre)大多不痛，一期梅毒(primary syphilis )的臨床表徵","B":"斑性丘狀發疹(maculopapular rash)是二期梅毒 (secondary syphilis)最常見的臨床表徵，常出現於 手足掌。","C":"如果沒有接受確切適當的治療，約 35%的梅毒患者會 進入三期梅毒(tertiary syphilis)","D":"三期梅毒包括皮膚梅毒腫(gummatous syphilis)、心 血管性梅毒及神經性梅毒","E":"患者經確切適當的治療後，建議在治療後需追蹤血清 學特異性梅毒螺旋體試驗（treponemal test）即可， 不須追蹤非特異性梅毒螺旋體試驗（non-treponemal test）"},"answer":"E","reference":"(112)/10.感染/參考資料 (摘錄自)： 第 12 版 Campbell A p1257 B p1257 B p1258 D p1258 E p1258","sourcePage":394},{"id":"10-085","category":"感染","categoryOrder":10,"number":85,"question":"下列性感染症的臨床病灶與建議治療藥物的組合，何者錯 誤?","options":{"A":"花柳性淋巴肉芽腫(Lymphogranuloma vereneum, LGV )-Doxycycline 100mg 每日 2 次使用 21 天","B":"陰道滴蟲感染- Metronidazole 2g 單次使用","C":"披衣菌尿道炎-azithromycin 1g 單次使用","D":"軟性下疳-Doxycycline 100mg 每日 2 次使用 7 天","E":"硬性下疳-Benzathine penicillin G 2.4MU.IM 單次 使用"},"answer":"D","reference":"(112)/10.感染/參考資料 (摘錄自)： 第 12 版 Campbell A p1261 B p1272 C p1253 D p1260 E p1259","sourcePage":394},{"id":"10-086","category":"感染","categoryOrder":10,"number":86,"question":"下列針對常見性感染症相關之敘述，何者正確?","options":{"A":"淋病與披衣菌感染是年輕男性睪丸炎的常見原因","B":"在免疫能力正常患者身上出現的傳染性軟疣 (molluscum contagiosum)常在 6~12 個月內自行消 失，因此維持良好的免疫能力相當重要","C":"懷孕婦女如果感染披衣菌尿道炎，建議使用的第一線 抗生素是 azithromycin 1000mg 加上 Doxycycline 100mg 每日 2 次使用 7 天","D":"針對披衣菌感染所造成的尿道炎，建議抽血做血清學 檢驗來確診","E":"針對淋菌性尿道炎的患者，使用 McCoy cell culture 可在分泌物中發現包涵體(inclusion bodies)"},"answer":"B","reference":"(112)/10.感染/參考資料 (摘錄自)： 第 12 版 Campbell A p1255 B p1261 C p1253 D p1253 E p1252","sourcePage":395},{"id":"10-087","category":"感染","categoryOrder":10,"number":87,"question":"以下關於感染性肉芽腫腎炎(Infectious Granulomatous Nephritis)的敘述何者錯誤?","options":{"A":"黃色肉芽腫性腎盂腎炎（Xanthogranulomatous pyelonephritis）患者雖然大部分會貧血、將近一半 病人會肝功能異常，但腎衰竭或氮血症很少見","B":"黃色肉芽腫性腎盂腎炎與腎細胞癌(renal cell carcinoma)有關聯性，即使是局部性病灶，若不能 完全排除惡性的可能性，也要進行腎臟切除 (nephrectomy)，不適合單用術中冰凍切片進行鑑別 診斷","C":"軟化斑(Malacoplakia)可能的致病機轉為巨噬細胞 功能異常，病理學上則會呈現出嗜酸性 (Eosinophilic)的 Michaelis-Gutmann bodies.","D":"影像檢查上，多發性的軟化斑(Multifocal malacoplakia)常見會有腎臟的腫脹但不會有腎臟的 鈣化、結石或水腫","E":"黃色肉芽腫性腎盂腎炎病人的電腦斷層，一半以上 都會表現 classic triad : 單一側腎臟腫大、幾乎 無功能的腎臟、腎盂有大顆結石"},"answer":"C","reference":"(112)/10.感染/參考資料 (摘錄自)： Campbell 12th edition, ch55. p.1177-1181","sourcePage":395},{"id":"10-088","category":"感染","categoryOrder":10,"number":88,"question":"以下關於人類免疫不全病毒(HIV)陽性患者的敘述何者錯 誤?","options":{"A":"可能在使用雞尾酒療法約莫一個月時出現免疫重建 發炎症候群(immune reconstitution inflammatory syndrome)","B":"並沒有較高的機率罹患攝護腺癌，因此檢測攝護腺 指數(PSA)的適應症與正常人無異","C":"比起 HIV 陰性患者，會有較高的風險得到睪丸的精母 細胞瘤(seminoma)","D":"會有較高的機率得到膀胱癌，且使用膀胱內卡介苗 灌注時有較高的彌散性感染(disseminated infection)機率","E":"陰莖癌屬於「非後天免疫缺乏症候群相關之定義性腫 瘤」（non-AIDS defining cancer），HIV 陽性患者陰 莖癌的治療與診斷，應與正常人無異"},"answer":"D","reference":"(112)/10.感染/參考資料 (摘錄自)： Campbell 12th edition, ch58. p.1267-1268","sourcePage":395},{"id":"10-089","category":"感染","categoryOrder":10,"number":89,"question":"關於佛尼爾式壞疽(Fournier Gangrene)的敘述，何者正 確?","options":{"A":"常見致病菌為 E.coli 及 S. pyogenes。但 Group B streptococcal 造成的感染在健康、免疫力健全的個 體上也能見到","B":"特徵是從紅斑、腫脹和疼痛進展到水泡、惡臭壞死 病灶的快速過程，但超過一半的病人可能會有較不 明顯(insidious)的發病狀態，導致延誤治療","C":"在佛尼爾式壞疽發作後倖存的患者中，性功能障礙 很常見，甚至可以高達 65%","D":"除了多次傷口清創，高壓氧治療及傷口負壓療法 (vacuum wound therapy)都是目前可考慮具有實證療 效的治療","E":"細菌可能會沿著 Scarpa fascia 往會陰延伸、沿著 Dartos fascia 往陰囊及陰莖延伸"},"answer":"C","reference":"(112)/10.感染/參考資料 (摘錄自)： Campbell 12th edition, ch55.p1181 and ch59. p.1289-1290 EAU guideline on Urological Infections 2023 3.13","sourcePage":396},{"id":"10-090","category":"感染","categoryOrder":10,"number":90,"question":"根據 EAU Guidelines on Urological Infections 2024， 有關於攝護腺炎(prostatitis)，以下何者正確？","options":{"A":"攝護腺炎是常見的診斷，而其中被證實為細菌性攝 護腺炎(bacterial prostatitis)的比例不到十分之 一","B":"急性細菌性攝護腺炎(Acute bacterial prostatitis)時應執行攝護腺按摩(prostate massage)後再留取尿液培養","C":"使用 Meares and Stamey 2- or 4-glass test 診斷 慢性細菌性攝護腺炎(Chronic bacterial prostatitis)並無太大意義","D":"慢性細菌性攝護腺炎(Chronic bacterial prostatitis)的第一線治療為第三代頭孢子黴素類 抗生素","E":"Trichomonas vaginalis 感染所導致的慢性細菌性攝 護腺炎(Chronic bacterial prostatitis)，應給予 doxycycline 治療"},"answer":"A","reference":"(113)/ EAU Guidelines on Urological Infections 2024 (A) p. 39 (B) p. 40 (C) p. 40 (D) p. 42 p. 42","sourcePage":396},{"id":"10-091","category":"感染","categoryOrder":10,"number":91,"question":"根據 Campbell Walsh Wein Urology 12th ed.，有關於軟 化斑(malacoplakia)的敘述，下列何者正確？","options":{"A":"詳細的病理機轉仍未明確，但可能是源自 於細菌感染所導致的中性球(neutrophil)功能異常 所致，最常見的是大腸桿菌(E.coli)感染","B":"疾病診斷需要仰賴病理切片，其中的病理特徵 Michaelis-Gutmann bodies 為診斷之必要條件","C":"好發於 50 歲以上，泌尿道系統發生的男女比例為 4:1","D":"單純使用抗生素控制軟化斑通常效果不佳，儘早手 術切除仍是最佳建議","E":"軟化斑長期預後與疾病侵犯程度有關，若疾病為腎 實質雙側侵犯或是發生在移植腎臟，六個月內通常 會死亡"},"answer":"E","reference":"(113)/Campbell Walsh Wein Urology 12th ed. (A) p. 1179 (B) p. 1179-1180 (C) p. 1180 (D) p. 1181 p. 1181","sourcePage":397},{"id":"10-092","category":"感染","categoryOrder":10,"number":92,"question":"針對泌尿道感染的敘述何者錯誤？","options":{"A":"蔓越莓(cranberry)中有 polyphenol type A proanthocyanidin (PAC)，可以預防 E. Coli 的 P fimbriae 黏附在尿路上皮細胞上","B":"陰道雌激素可有效預防停經後女性復發性泌尿道感 染，但效果要至少使用 4 周後才會出現","C":"甘露糖(D-Mannose)，可以結合併阻斷 Fim H（位於 type 1 Pili 的黏附蛋白），因此可作為細菌黏附機 制的競爭性抑制劑，達到減少泌尿道感染的效果","D":"復發性泌尿道感染定義為 6 個月內發生兩次或 12 個 月內發生三次或以上的泌尿道感染","E":"Menopause 是 recurrent urinary tract infection 的 risk factor"},"answer":"B","reference":"(113) Campbell Walsh Urology (12th Edition), Ch 55, P.1159~1166 (B) 12 周","sourcePage":397},{"id":"10-093","category":"感染","categoryOrder":10,"number":93,"question":"針對慢性攝護腺炎/慢性骨盆腔疼痛症候群(Chronic Prostatitis/ Chronic Pelvic Pain Syndrome, CP/CPPS) 以及間質性膀胱炎/膀胱疼痛症候群(Interstitial Cystitis/Bladder Pain Syndrome, IC/BPS)的敘述，何 者正確？","options":{"A":"針對 CP/CPPS 的治療，建議使用 Antibiotics+ anti-inflammatory agent","B":"針對 IC/BPS 的治療，Intradetrusor Onabotulinum Toxin-A (BTX-A)雖然沒有 FDA- approved，但還是有 其治療效果，屬於 fourth-line therapy","C":"某位 CP/CPPS 病患屬於 NIH classification IIIB， 其 post–prostate massage urine (VB3)存在白血球 及發炎細胞","D":"在臨床經驗中，大約 5%的 IC/BPS 患者可能會發現 Hunner lesions","E":"針灸(acupuncture)對於 CP/CPPS 或是 IC/BPS 都是完 全不被建議的"},"answer":"B","reference":"(113) Campbell Walsh Urology (12th Edition), Ch 56, 57 (A) Antibiotics+ alpha blocker (C) 不存在白血球 (D) 20% (E) CP/CPPS 可以針灸","sourcePage":397},{"id":"10-094","category":"感染","categoryOrder":10,"number":94,"question":"有關泌尿道結核菌感染(GU Tuberculosis),下列何者錯 誤?","options":{"A":"所有 GU TB 患者都建議要檢查胸部Ｘ光","B":"若感染進展，可能會造成 autonephrectomy","C":"80%的 GU TB 感染輸尿管","D":"結核菌感染儲精囊會造成不孕","E":"要診斷 GU TB,小便培養最好留檢清晨第一泡尿"},"answer":"C","reference":"(113)/Ｃ80%GU TB 感染腎 臟 Campbell-Walsh Urology 12 版, 第 1307-1312 頁","sourcePage":398},{"id":"10-095","category":"感染","categoryOrder":10,"number":95,"question":"下列有關表皮疾病之描述，何者錯誤？","options":{"A":"波文樣丘疹病與 HPV 16 型有明顯關聯，發病高峰期 在 50 歲左右","B":"基底細胞癌（Basal Cell Carcinoma）是最常見的皮 膚腫瘤（neoplasm）","C":"經典型卡波西氏肉瘤（Classic Kaposi Sarcoma）很 少影響到生殖器官","D":"皮膚 T 細胞淋巴瘤（Cutaneous T-Cell Lymphoma） 之患病風險與 HIV 感染有關，其接受局部治療的完全 緩解率約為 60%","E":"Extramammary Paget Disease 好發在女性外陰，發生 在男性陰莖與睪丸的案例極其罕見"},"answer":"A","reference":"(113)/Ａ 高峰期為第三個 十年 Campbell-Walsh Urology 12 版, 第 1296-1302 頁","sourcePage":398},{"id":"10-096","category":"感染","categoryOrder":10,"number":96,"question":"下列關於泌尿道結核(genitourinary Tuberculosis)的敘 述何者錯誤?","options":{"A":"最常見的致病菌為 Mycobacterium tuberculosis， 第二常見則是 Mycobacterium bovis","B":"小於 20%病患有泌尿道結核菌感染的典型症狀，包括 發燒、體重減輕、夜間盜汗及倦怠等症狀，而在泌 尿道的症狀則是以解尿疼痛、膀胱儲存症狀及血尿 為主","C":"Papulonecrotic tuberculid (PNT) 是發生在龜頭上 的皮膚結核表現，也可能出現在其他皮膚區域，此 結核結節的表現為紅色丘疹，會在皮膚上散佈、潰 瘍，並形成痘疹狀(varioliform)的疤痕，可以藉由 培養及 PCR 陽性得到確診","D":"Nucleic acid amplification tests (NAATs)不適合 用來作為追蹤 anti-TB therapy 療效的工具","E":"隨著感染進程，患者會產生漸進式的腎功能缺損， 導致整個腎臟失能，以致 auto-nephrectomy， Auto-nephrectomy 又可以分為兩種，其中 fibrotic type 會伴隨 severe scaring 和 calcification，整 個腎臟將會明顯萎縮"},"answer":"C","reference":"(113)Campbell-Walsh Urology, 12th edition. Chapter 60 A: p.1307 B: p.1308 C: p.1309 Culture 及 PCR 皆會陰性 This is a cutaneous manifestation of TB on the glans penis and can occur in other skin areas as well. The tuberculids are red papules that erupt on the skin, ulcerate, and undergo varioliform scarring. Unlike primary TB of the penis, these ulcers can be painless and do not contain tubercle bacilli. The tuberculids are hypersensitivity reactions to MTBC antigens that were disseminated to the skin from other infectious foci, and as such they are culture negative and typically polymerase chain reaction (PCR) negative. D: p.1310 E: p.1308","sourcePage":398},{"id":"10-097","category":"感染","categoryOrder":10,"number":97,"question":"Uropathogenic E. coli (UPEC)造成尿路感染的機轉步驟 包含：(1) UPEC 黏附於泌尿上皮(urothelium)表面並與 膀胱上皮細胞的防禦機制相互作用；(2) 透過形成膀胱胞 內細菌群落 (Intracellular Bacterial Communities) 進 行入侵及複製；(3) UPEC 在尿道周圍和陰道組織以及尿 道中定殖(colonization)；(4) 生物膜形成(biofilm elaboration)；(5) 上行感染(ascending infection)至 膀胱內腔並存在於尿液之中；請問下列排序何者正確?","options":{"A":"(1)(5)(3)(2)(4)","B":"(1)(5)(4)(2)(3)","C":"(1)(5)(4)(3)(2)","D":"(3)(5)(1)(4)(2)","E":"(3)(5)(1)(2)(4)"},"answer":"D","reference":"(114)參考資料(摘錄自)： Campbell 12th edition, Chap. 55 P. 1134","sourcePage":399},{"id":"10-098","category":"感染","categoryOrder":10,"number":98,"question":"關於尖狀濕疣（Condyloma acuminata）的敘述，下列何 者錯誤？","options":{"A":"尖狀濕疣常由人類乳突病毒（HPV）第 6 型與第 11 型 引起","B":"高危型 HPV 如第 16 型與第 18 型雖不常引起濕疣，卻 與浸潤性癌症(invasive carcinoma)有關","C":"HPV 感染，大多是通過性接觸感染，保險套的防護可 以減少感染，但無法完全防止感染","D":"HPV 是一種秘密行動的病毒(Stealth virus)，感染 後會產生免疫反應，活化皮膚成長，再產生抗體造 成有些患者無臨床症狀，也有些會持續出現濕疣， 經治療好後就不會復發","E":"尖狀濕疣的治療可選擇低溫冷凍療法、電刀灼燒、 雷射切除、外用藥物等方式"},"answer":"D","reference":"(114)性傳染病臨床圖譜與 治療指引 第三版 第 18 章 p.173 p.174 p.175 p.179, table p.180, table","sourcePage":399},{"id":"10-099","category":"感染","categoryOrder":10,"number":99,"question":"關於慢性前列腺炎/慢性骨盆疼痛症候群（Chronic (11 Cam Prostatitis/Chronic Pelvic Pain Syndrome, CP/CPPS） 12t 的成因與假說，下列敘述何者最符合現今的研究解釋？ •","options":{"A":"所有 CP/CPPS 病患皆可在前列腺液中培養出具致病 性的細菌，因此診斷明確依賴細菌學檢查","B":"分子生物學檢測（例如聚合酶鏈反應 Polymerase Chain Reaction, PCR）已確認 Chlamydia spp. 是 CP/CPPS 的主要致病菌","C":"中央敏化（Central Sensitization）是一種神經系 統異常，可能使患者即使無刺激也產生疼痛反應， • 是 CP/CPPS 可能的病理機轉之一","D":"所有 CP/CPPS 的疼痛都來自前列腺，因此「非炎性 慢性前列腺炎」（NIH 類型 IIIB）已被從分類中移除","E":"UPOINT 分類法僅限於細菌性前列腺炎的治療指引， 並不適用於 CP/CPPS 的臨床處理 • • E. 頁： CP/ 工具 腺炎"},"answer":"C","reference":"4)Chapter 56, pbell-Walsh Urology. h ed. pp. 1202–1223 A. 錯誤，出處在第 1208 頁：CP/CPPS 患者 與無症狀者在尿液、前 列腺液、精液中的細菌 數量相近。 B. 錯誤，出處在第 1207 頁：PCR 檢測未能 證實單一細菌為 CP/CPPS 主因， Chlamydia spp. 雖有關 聯但並非主因。 C. 正確，出處在第 1209 頁：中央敏化 （Central Sensitization）為無刺 激也產生疼痛的一種神 經異常，可能為 CP/CPPS 成因之一。 D. 錯誤，出處在第 1202 頁：NIH IIIB 類 （非炎性慢性前列腺 炎）仍保留於現行分類 中。 錯誤，出處在第 1210 UPOINT 分類系統為 CPPS 症狀管理的臨床 ，並非僅限細菌性前列 。","sourcePage":400},{"id":"10-100","category":"感染","categoryOrder":10,"number":100,"question":"關於 Genital Ulcer Disease 的敘述，下列何者錯誤？","options":{"A":"Genital herpes 為疼痛性水皰，淺，通常多個","B":"Primary syphilis 通常為無痛、有彈性、非化膿性 雙側淋巴結腫大","C":"Lymphogranuloma 通常為小而疼痛的水皰或丘疹發展 為潰瘍","D":"Chancroid 沒有全身症狀","E":"Genital herpes 的全身症狀存在於原發性感染期間 題號 答案 考 題"},"answer":"C","reference":"(114)Campbell-Walsh Urology 12th ed. Chapter 58, TABLE 58.2, p.1255 C: 小而無痛 年度 類別 參考資料","sourcePage":401},{"id":"11-001","category":"手術及併發症","categoryOrder":11,"number":1,"question":"關於人工陰莖(Penile prosthesis)之併發症，何者正 確?","options":{"A":"HIV 規則服用抗病毒藥物且 CD4 數量正常之病患， 發生人工陰莖感染之機率仍較高","B":"陰莖感覺神經缺陷(sensory deficits)之病人較不 適用液壓型人工陰莖(Hydraulic implants)","C":"人工陰莖破出(Extrusion)及尿道侵蝕(Erosion) 若無感染，可手術修復，大部分病患不用移除人工 陰莖","D":"人工陰莖感染可先移除感染之植入物並放置引流 管，待 2~6 個月改善後再植入，期間可予以真空吸 引器(vacuum)治療以減少陰莖之縮短及維持其角 度","E":"異常陰莖持續勃起(acute ischemic priapism)之 病患接受人工陰莖植入時，若有 distal corporal shunts 需修補，植入物選擇 expanding AMS 700 LGX cylinders 較適合"},"answer":"D","reference":"(110)/11.手術及併發 症/參考資料(摘錄 自)：Campbell 12ed. Ch72 (A) p1596 (B) p1594 (C) p1594 (D) p1592-1593 (E) p1596","sourcePage":402},{"id":"11-002","category":"手術及併發症","categoryOrder":11,"number":2,"question":"迴腸造廔(ileal conduit)發生 uretero-enteric anastomotic stricture 的敘述，何者最不正確?","options":{"A":"Non-refluxing anastomosis 的狹窄發生率遠高於 refluxing anastomosis","B":"Wallance technique 的狹窄發生率略低於 Bricker technique","C":"內視鏡手術對狹窄的治療效果，左側比較差且易出 血","D":"是日後腎功能變差最常見的原因","E":"Leadbetter-Clarke technique 的狹窄發生率較 Pagano technique 高"},"answer":"D","reference":"(110)/11.手術及併發 症/參考資料(摘錄 自)：Campbell 12E,Ch89,p1976. Ch139, p3189-3192, Table 139.9 D: lack of ureteral motility, infection, stone 才是腎功能變差 常見的原因，狹窄相對 少","sourcePage":402},{"id":"11-003","category":"手術及併發症","categoryOrder":11,"number":3,"question":"關於腹腔鏡手術時突發的氣體栓塞症(gas embolism)， 以下何者為非?","options":{"A":"突發的缺氧(hypoxia), 高碳酸血症 (hypercarbia), 低血壓(hypotension) , 心律不 整(arrhythmia)為可能的臨床表現","B":"此併發症可能與導氣針導致的血管損傷(Veress needle related vascular injury)有關","C":"若發生時應即刻放氣(desufflation), 並給予 100% 吸入氧氣濃度(FiO2)","D":"處理方式宜將病患擺位調整為頭低腳高 (Trendelenburg position) 及右側臥位(right lateral decubitus position)，以讓氣泡進到右 心室(right atrium)，接著可放置中心靜脈導管 (central line)嘗試吸出氣泡","E":"可使用經食道超音波(Transesophageal echocardiography)協助偵測氣泡"},"answer":"D","reference":"(110)/11.手術及併發 症/參考資料(摘錄 自)：Campbell Walsh Wein Urology - 12th Edition page 271-272","sourcePage":402},{"id":"11-004","category":"手術及併發症","categoryOrder":11,"number":4,"question":"切口疝氣(incisional hernia)是兒童接受微創手術後 ( 症 可能產生的併發症之一，下列何者為非？ 自","options":{"A":"在接受泌尿手術的兒童中比例約占 3% C","B":"常見 Omental herniation","C":"trocar 應從 Palmer point 進入腹腔以減少疝氣機 率","D":"切口大小和術後疝氣的機率無關","E":"年紀較小的患者術後切口疝氣機率較高"},"answer":"C","reference":"110)/11.手術及併發 /參考資料(摘錄 )：Campbell 12th hapter 27","sourcePage":403},{"id":"11-005","category":"手術及併發症","categoryOrder":11,"number":5,"question":"有關輸精管結紮手術的併發症，下列敘述何者正確？ ( 症","options":{"A":"最常見的術後併發症為傷口感染，其次為局部血腫 自","B":"術後慢性疼痛 (Postvasectomy pain syndrome) C 常與術後血腫和傷口感染有關 t","C":"術後慢性疼痛往往預後不佳，若經過一個月的保守 S 性治療無效即該尋求進一步處理 p","D":"最重要的術後併發症預測因子為病人的輸精管可 觸性的難易程度","E":"與傳統手術刀切除術相比，無手術刀切除術 (no-scalpel technique)局部血腫的機率較低"},"answer":"E","reference":"110)/11.手術及併發 /參考資料(摘錄 )：Campbell 11ed, hapter 41, Surgery of he Scrotum and eminal Vesicles, 949, 952","sourcePage":403},{"id":"11-006","category":"手術及併發症","categoryOrder":11,"number":6,"question":"有關輸尿管損傷(ureteral injury)的敘述下列何者錯 症 誤？ 自","options":{"A":"醫源性損傷(iatrogenic injury)是造成輸尿管損 C 傷的最常見原因 I","B":"由於位置的緣故使得中端(mid-)輸尿管損傷的發 C 生率高於近端(proximal)和遠端(distal) p","C":"輸尿管損傷可分為 6 級，其中第 4 級是指撕裂達完 全橫斷(complete transection)並合併小於等於 2 公分的血行阻斷(devascularization)","D":"第 1 及第 2 級的輸尿管損傷處理方式中，置放輸尿 管導管(ureteral stent)可減低輸尿管狹窄的機率 因而優於腎造廔管(nephrostomy tube)置放","E":"輸尿管鏡導致的撕脫傷(avulsion injury)好發於 近端和中端"},"answer":"B","reference":"(110)/11.手術&併發 /參考資料(摘錄 )：Campbell 12ed, hapter 19, ntraoperative onsultation, 300-302","sourcePage":403},{"id":"11-007","category":"手術及併發症","categoryOrder":11,"number":7,"question":"有關 Augmentation cystoplasty 之敘述何者正確?","options":{"A":"術後的尿動力檢查可看到膀胱的 rhythmic contraction，以 stomach 最常發生，ileum 次之","B":"和 Colocystoplasty 相比，Ileocystoplasty 有較 低的 vesical pressure 和 motor activity","C":"術後發生 Hematuria-dysuria syndrome 是因為 colocystoplasty 後 mucus 較多，造成尿路感染與 結石","D":"以上皆正確","E":"以上皆錯誤"},"answer":"B","reference":"(110)/11.手術&併發症 /參考資料(摘錄自)： Campbell 12E, Ch 37, p696-698 1:ileum 最不會發生 3: gastrocystoplasty 後 acid irritation 造成","sourcePage":404},{"id":"11-008","category":"手術及併發症","categoryOrder":11,"number":8,"question":"關於人工網膜(mesh)用於婦女應力性尿失禁(stress urinary incontinence)之敘述，下列何者為非?","options":{"A":"和恥骨後尿道中段懸吊術(retropubic tension free vaginal tape, TVT)比較起來，腹股溝疼痛 (Groin pain)較常發生在經閉孔吊帶懸吊術 (transobturator sling approach，TOT)術後","B":"同時有尿道陰道瘻管(Simultaneous urethrovaginal fistula)為陰道網膜(mesh)手術 的禁忌症(contraindication)","C":"和經閉孔吊帶懸吊術(transobturator sling approach，TOT)比較起來，術中膀胱損傷(bladder injurie)較常發生在恥骨後吊帶懸吊術 (retropubic approach, TVT)","D":"中段尿道懸吊(midurethral sling)手術中若因剝 離(dissection)不慎傷及尿道(urethral injury)，在用可吸收線(absorbable suture)修補 尿道後仍建議於當次手術照常放置網膜(mesh)","E":"和經閉孔吊帶懸吊術(transobturator sling approach，TOT)比較起來，術後排尿困難(voiding dysfunction)較常發生在恥骨後吊帶懸吊術 (retropubic approach, TVT)"},"answer":"D","reference":"(110)/11.手術&併發症 /參考資料(摘錄自)： Campbell Walsh Wein Urology - 12th Edition page 2877-2884","sourcePage":404},{"id":"11-009","category":"手術及併發症","categoryOrder":11,"number":9,"question":"林先生為睪丸癌患者並預計接受後腹腔淋巴結廓清 術，下列對於該手術的描述何者錯誤？","options":{"A":"若想降低術後 chylous ascites 的機率，可建議病 人術前先嘗試低脂飲食 1 到 2 週","B":"在腹腔鏡手術發展的初期，其併發症機率可達 50% 以上","C":"腹腔鏡手術術後發生 retrograde ejaculation 的 機率不到兩成","D":"若原本使用腹腔鏡的方式，最常轉開腹手術的原因 是術中無法控制的出血，佔所有併發症比例<5%","E":"術後要小心 parasympathetic nerve stimulation 導致的 bradycardia"},"answer":"E","reference":"(110)/11.手術&併發症 /參考資料(摘錄自)： Campbell 12th Chapter 78","sourcePage":405},{"id":"11-010","category":"手術及併發症","categoryOrder":11,"number":10,"question":"泌尿外科腹腔鏡手術， 如果第一支套管針 (trocar) 插入時，不慎插入 iliac artery， 下列哪一個處置最 適合？","options":{"A":"立即將 trocar 抽出，改成緊急傳統剖腹手術","B":"立即將 trocar 抽出，從他處重新建立新的灌氣管 道，置入新的 trocar","C":"將 trocar 留置在原處不要拔出,緊急會診血管外 科,改成緊急傳統剖腹手術","D":"將 trocar 留置在原處不要拔出，從他處重新建立 新的灌氣管道，置入新的 trocar","E":"立即將 trocar 抽出，使用纖維蛋白膠(fibrin glue)緊急止血"},"answer":"C","reference":"(110)/11.手術&併發症 /參考資料(摘錄自)： Cambell 第 12 版 Section II Basics of Urologic Surgery. 10. Fundamentals of Laparoscopic and Robotic Urologic Surgery","sourcePage":405},{"id":"11-011","category":"手術及併發症","categoryOrder":11,"number":11,"question":"腹腔鏡手術時，在以 Varess 氣腹針建立氣腹 (pneumoperitoneum)時，若發生 gas embolism，以下處 置方法，何者為不恰當？","options":{"A":"立即停止灌氣","B":"立即給予純氧(100% FiO ) 2","C":"將病患姿勢改為頭低腳高","D":"將病患姿勢調為左高右低","E":"置入中央靜脈導管，幫助心房中的氣泡吸除"},"answer":"D","reference":"(110)/11.手術&併發症 /參考資料(摘錄自)：第 12 版 Campbell, Ch 17, p. 271","sourcePage":405},{"id":"11-012","category":"手術及併發症","categoryOrder":11,"number":12,"question":"關於尿道下裂(Hypospadias)手術後併發症，何者正確?","options":{"A":"反覆尿路感染是常見之併發症","B":"術後立即發現之尿道廔管, 若無合併發炎或尿道 口狹窄(meatal stenosis)通常會自行癒合","C":"小於 1 公分之尿道狹窄，採用尿道內視鏡切開 (endoscopic incision)，兩年後五成病患可有正 常尿流速","D":"術後發生之乾燥閉塞性龜頭炎(Balanitis Xerotica Obliterans)對保守治療反應大多不錯","E":"相較於覆蓋型島狀皮瓣(Onlay island flap, OIF)，尿道板管狀成型(Tubularized incised plate, TIP)術後餘尿(PVR)增加之比例較高"},"answer":"E","reference":"(110)/11.手術&併發症 /參考資料(摘錄自)： Campbell 12ed. Ch45 p941 (A) p935 (B) p938 (C) p939 (D) p941 (E)","sourcePage":405},{"id":"11-013","category":"手術及併發症","categoryOrder":11,"number":13,"question":"關於體外震波碎石，何者錯誤?","options":{"A":"目前認為術後血尿的主因是震波造成血管破裂及 周邊腎小管損傷","B":"“Ramping up” technique 是用低能量先進行 pretreatment，促進血管擴張，進而減少腎臟損傷","C":"“Ramping up” technique 術後一個月的結石廓清 率遠高於固定能量擊發的打法","D":"60 shocks/minute 的速度可達到較佳的 cavitation，碎石效果比 120 shocks/minute 好","E":"體外震波碎石機轉也包括 Shear stress"},"answer":"B","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell 12E,Ch94,p2097-2098, 2101 B:血管收縮","sourcePage":406},{"id":"11-014","category":"手術及併發症","categoryOrder":11,"number":14,"question":"陰莖癌患者接受 inguinal lymphadenectomy 的術後照 護，何者最正確?","options":{"A":"術後建議臥床休息一週，以免下床活動造成 lymph flow 增加影響傷口癒合","B":"Age 和 Sartorius flap transposition 皆是傷口感 染的 predictor","C":"傷口引流管建議每日少於 10ml 時移除，以避免 seroma 及傷口感染","D":"使用 suction system 可提早使淋巴管癒合","E":"以上皆正確"},"answer":"B","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell 12E,Ch81, p1801 A :盡早下床 C:<50ml 即盡快移除避 免 colonization/spread of bacteria along the drains 反而造成感染 D 延緩 lymphatics closing","sourcePage":406},{"id":"11-015","category":"手術及併發症","categoryOrder":11,"number":15,"question":"若接受 Partial nephrectomy 的患者術前腎功能正常， 除了盡量縮短 warm ischemia 時間之外，還有哪些手術 步驟有助於腎功能保留?","options":{"A":"以碎冰在腎臟表面進行 cooling","B":"Hilar control 時只夾腎動脈，腎靜脈不夾","C":"Hilar control 前先給 mannitol","D":"以上皆無幫助","E":"以上皆有幫助"},"answer":"B","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell 12E, Ch 102, p2302-2303 A cooling 未證實有幫 助 C: Eur Urol. 2018; 73(1): 53–59. 給 mannitol 沒幫助","sourcePage":406},{"id":"11-016","category":"手術及併發症","categoryOrder":11,"number":16,"question":"以下關於腎移植手術後之併發症，何者為非?","options":{"A":"造成術後輸尿管狹窄(ureteral stricture)最主要 的原因為缺血(ischemia)","B":"含鈣結石(calcium based stones)為腎臟移植接受 者最常見之腎結石","C":"輸尿管狹窄(ureteral stricture)為常見的早期輸 尿管阻塞(early ureteral obstruction)原因之一","D":"過度剝離(extensive dissection)腎移植接受者髂 動脈(iliac vessels)處的淋巴管為造成術後淋巴 囊腫(lymphocele)的主要原因之一","E":"移植腎如進行切片(allograft biopsy)後發生持續 性血尿(persistent hematuria),常見原因為動靜 脈瘻管(arteriovenous collecting system fistula)，其中 70%病患會自行緩解"},"answer":"C","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell Walsh Wein Urology - 12th Edition page 1936-1939","sourcePage":407},{"id":"11-017","category":"手術及併發症","categoryOrder":11,"number":17,"question":"如要進行陰莖重建手術(penile reconstruction), 一 般來說以下何種植皮(skin graft)為最佳選擇?","options":{"A":"Thin (0.009- to 0.012-inch), meshed, full-thickness skin","B":"Thick (0.012- to 0.015-inch), meshed, split-thickness skin","C":"Thin (0.009- to 0.012-inch), nonmeshed, full-thickness skin","D":"Thick (0.012- to 0.015-inch), nonmeshed, split-thickness skin","E":"Thick (0.012- to 0.015-inch), nonmeshed, full-thickness skin"},"answer":"D","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell Walsh Wein Urology - 12th Edition, 3054","sourcePage":407},{"id":"11-018","category":"手術及併發症","categoryOrder":11,"number":18,"question":"在執行輸尿管重種(ureteral reimplantation)及腰大 肌懸吊(psoas hitch)手術時，傷害到哪一條神經可能 會造成陰囊及內側大腿感覺缺失(loss of sensation to the scrotum and medial thigh)?","options":{"A":"閉孔神經(Obturator nerve)","B":"髂腹股溝神經(Ilioinguinal nerve)","C":"股外側皮神經(Lateral femoral cutaneous nerve)","D":"股神經(Femoral nerve)","E":"生殖股神經(Genitofemoral nerve)"},"answer":"E","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell Walsh Wein Urology - 12th Edition page 262-263","sourcePage":407},{"id":"11-019","category":"手術及併發症","categoryOrder":11,"number":19,"question":"關於輸精管結紮手術，以下何者為非？","options":{"A":"沒有一種輸精管結紮的方式是百分之百有效","B":"手術之後射精約 10-20 次，於術後第 8-16 週做精 液分析，若有精蟲則代表手術失敗，需要重新手術","C":"即使結紮後的精液分析沒有精蟲，但是再接通且造 成懷孕的機率約 0.05%","D":"結紮之後的精液分析，呈現無精蟲或稀少無活動力 的精蟲(<100,000 nonmotile sperm/ml)才可以不 避孕","E":"輸精管結紮手術後，可能造成 1-2%的慢性陰囊疼痛"},"answer":"B","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：1.Campbell 12e. Chap.83 p.1853 2. AUA guideline: Vasectomy (B)術後第 6 個月 repeat test 還有 motile sperm 才算 failure","sourcePage":407},{"id":"11-020","category":"手術及併發症","categoryOrder":11,"number":20,"question":"關於輸精管結紮後的慢性陰囊疼痛處理，以下何者為 非？","options":{"A":"重新接回(vasovasostomy or vasoepididymostomy)有 82%-93%疼痛改善率","B":"結紮後的慢性陰囊疼痛，可以做顯微精索去神經支 配(denervation)手術，術中要盡量保留 spermatic cord fascia 和 cremaster muscle","C":"慢性疼痛主要是因為神經形成 Wallerian degeneration 而造成，最常見的位置在 cremasteric muscle fiber, perivasal sheath, posterior lipomatous tissue","D":"進行副睪切除(epididymectomy)來解決疼痛時，盡 量保留結紮處遠端的輸精管，以免造成更多的神經 破壞而導致疼痛惡化","E":"副睪切除後，仍有 22%-90%的人因為 persistent pain 需要做睪丸切除"},"answer":"D","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell 12e. Chap.56 p.1221-1222 (D)合併遠端精管切除 效果會比較好","sourcePage":408},{"id":"11-021","category":"手術及併發症","categoryOrder":11,"number":21,"question":"有關腹腔鏡腎臟切除手術，術後相關併發症，下列敘述 何者為非?","options":{"A":"手術中未辨認出來的 bowel injury 會造成約 3%的 mortality rate","B":"大部份手術中未辨認出來的 bowel injury，是因為 能量器械太貼近腸子所造成的熱傷害(thermal injury)","C":"手術中發現腸道淺層的熱傷害，可以用 3-0 silk 縫合包覆住 injury 的區域","D":"腸道的 Thermal injury 相較於 non-thermal injury 通常會比較早期表現出來","E":"未辨認出來的 bowel injury，術後病人會表現腹 漲、噁心、低度發燒，但是血液中白血球可能是正 常或偏低"},"answer":"D","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell 12e. Chap.102 p.2307 (D)Thermal injury 通常 比較晚表現出來","sourcePage":408},{"id":"11-022","category":"手術及併發症","categoryOrder":11,"number":22,"question":"對於 penile curvature 手術，下列何者為非？","options":{"A":"不建議使用 polytetrafluoroethylene 的材質做為 graft 的材質，因為有感染的風險","B":"合併 Erectile dysfunction 的病人，選擇裝置人 工陰莖做為治療，建議使用 inflatable penile prosthesis, 比 malleable prosthesis 效果好","C":"裝了 prosthesis 後仍有大於 30 度的 curvature， 可以做 tunica incision 來矯正，而 tunica incision defect 若大於 2 公分建議使用 graft 修 補","D":"Graft 修補時如果同時有植入 penile prosthesis，建議使用自體的 dermal graft 來減 少組織反應","E":"做完 graft 矯正手術，術後的復健很重要，除了陰 莖按摩外，還要合併 penile traction 來避免陰莖 長度變短"},"answer":"D","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell 12e. Chap.73 p.1622,1624,1625 (D)dermal graft 易感染","sourcePage":409},{"id":"11-023","category":"手術及併發症","categoryOrder":11,"number":23,"question":"關於人工陰莖植入後的併發症，下列何者為非?","options":{"A":"裝完 prosthesis 後，病患最常因為勃起長度變短 而不滿意","B":"預防性抗生素，建議手術後 24hr 內停止","C":"Cylinder 侵蝕進尿道或是 reservoir 侵蝕進膀胱， 全部的 implant 都要移除以避免感染","D":"服用免疫抑制藥物的人，並沒有顯著增加 implant infection 的風險","E":"合併有心血管疾病、糖尿病，或是 circumcision incision，可能會造成遠端陰莖缺血而 dry gangrene"},"answer":"C","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell 12e. Chap.72 p.1583,1592,1594-159 5,1596,1695 Reservoir (C)reservoir erosion 進膀胱只換 reservoir 即可","sourcePage":409},{"id":"11-024","category":"手術及併發症","categoryOrder":11,"number":24,"question":"靜脈血栓(thromboembolism)是手術後可能發生的併發 症之一，請問根據 2021 EAU guidelines 下列關於血栓 風險因子的描述何者正確？","options":{"A":"患者二等親(例如祖父母)曾有靜脈血栓病史為中 等風險因子","B":"患者父母之一曾有靜脈血栓病史，靜脈血栓的機率 為正常人的兩倍","C":"身體質量指數(BMI)大於 30，靜脈血栓的機率為正 常人的兩倍","D":"患者年紀大於 75 歲以上，靜脈血栓的機率為正常 人的四倍","E":"以上描述皆正確"},"answer":"B","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：EAU guidelines “Thromboprophylaxis ”(2021)","sourcePage":409},{"id":"11-025","category":"手術及併發症","categoryOrder":11,"number":25,"question":"下列有關腹腔鏡手術的敘述，何者錯誤?","options":{"A":"根據 Parsons JK 等學者的研究，經腹腔的腹部手 術死亡率約 0.2%","B":"若發現導氣針(Veress needle)不小心扎入腸子， 則將針退出即可不須特別進一步處理","C":"若使用導氣針(Veress needle)，雖然針尖很細， 還是建議降壓到 8mmHg 檢視入針處是否有出血的情 況","D":"若懷疑病人術中有 gas embolism，須立刻暫停手術 並將腹腔內消氣，將病患採頭低腳高姿勢再以 100% 濃度氧氣進行 hyperventilation","E":"使用不帶刀的 trocar (nonbladed trocar)可降低 incisional hernia 的機率到約 0.19%"},"answer":"C","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell 12th Chapter 14","sourcePage":410},{"id":"11-026","category":"手術及併發症","categoryOrder":11,"number":26,"question":"陳先生因勃起障礙接受陰莖人工植入物手術，下列有關 術後照顧的描述何者正確？","options":{"A":"若植入物感染需全數移除，為避免這種情況出院後 應開立 7-14 天口服抗生素，可顯著降低感染機率","B":"術後最容易讓患者失望的原因是植入物無法達到 預期的硬度","C":"陰莖感覺異常的患者發生 cylinder erosion 的機 率較高，對於此類病患建議使用 Hydraulic implants","D":"若患者以前有放置過人工植入物，第二次放置人工 植入物發生 penile necrosis 的機率和第一次手術 一樣","E":"若龜頭有 ischemic necrosis，進行傷口照護即可， 不須移除 cylinder"},"answer":"C","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Campbell 12th Chapter 72","sourcePage":410},{"id":"11-027","category":"手術及併發症","categoryOrder":11,"number":27,"question":"下列有關泌尿外科腹腔鏡手術進行時，張力性氣腹 (pneumoperitoneum) 的敘述下列何者正確?","options":{"A":"二氧化碳(CO2)灌氣，是相當危險的因為他有可能 會燃燒(combustion)","B":"二氧化碳是最常用的氣體,因為它無法溶解在血液 中","C":"在慢性呼吸性疾病的病人，CO2 是最佳的灌氣氣 體，因為可以避免酸中毒","D":"氬(Argon)是一個理想的灌氣氣體，因為它價格便 宜，而且在血液中的溶解度很低","E":"一氧化二氮(Nitrous oxide)過去曾用來灌氣,但是 現在已不再使用,因為有腹腔內爆炸的風險"},"answer":"E","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Cambell 第 12 版 Section II Basics of Urologic Surgery. 10. Fundamentals of Laparoscopic and Robotic Urologic Surgery","sourcePage":410},{"id":"11-028","category":"手術及併發症","categoryOrder":11,"number":28,"question":"泌尿外科腹腔鏡手術灌氣的時候,如果導氣針(Veress needle)不小心插進 iliac artery 當中，接下來的處置 哪一個最恰當？","options":{"A":"立即將導氣針抽出，轉換成傳統開腹手術.","B":"立即將導氣針抽出,開闢另外一個新的灌氣途徑","C":"導氣針留著先不抽出,轉換成傳統開腹手術","D":"導氣針留著先不抽出，開闢另外一個新的灌氣途徑","E":"緊急通知血管外科"},"answer":"D","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Cambell 第 12 版 Section II Basics of Urologic Surgery. 10. Fundamentals of Laparoscopic and R obotic Urologic Surgery","sourcePage":411},{"id":"11-029","category":"手術及併發症","categoryOrder":11,"number":29,"question":"在進行經皮穿腎造口腎結石手術(PCNL)的時候，使用 Amplatz dilators 做腎造口擴張如果發生出血,下一步 該如何處置？","options":{"A":"將擴張器(dilator)拔出,靜觀其變","B":"進行血管攝影與栓塞(angiography and embolization)","C":"插入下一個更大號的擴張器","D":"放棄當下的造口，重新建立一個新的造口","E":"將擴張器拔出，使用內視鏡電燒止血 ( endoscopic fulgurate site of bleeding)"},"answer":"C","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：Cambell 第 12 版. Section II : Basics of Urologic Surgery, 8. Percutaneous Approaches to the Upper Urinary Tract Collecting System","sourcePage":411},{"id":"11-030","category":"手術及併發症","categoryOrder":11,"number":30,"question":"攝護腺切片(prostatic biopsy)是攝護腺癌的診斷基 礎，有關攝護腺切片的併發症及術前抗生素預防，下列 敘述何者錯誤?","options":{"A":"與經直腸切片(transrectal biopsy)相比，經會陰 切片(transperineal biopsy)有顯著較低的感染併 發症","B":"在非抗生素類的術前準備中，聚维酮碘 (povidone-iodine)直腸消毒能顯著降低感染併發 症比率","C":"住院手術、切片數目、切片針的粗細以及術前灌腸 (enema)均無法顯著降低感染併發症比率","D":"由於抗藥性細菌比率的上升以及潛在嚴重的慢性 副作用，fluoroquinolone 已不再被 Eropean Commission 列為標準的術前經驗性抗生素","E":"在抗生素降低感染的選擇，使用 aminoglycosides 及 cephalosporins 兩類藥物均能提供不亞於 fluoroquinolone 類的效果"},"answer":"C","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄 自)：J Urol. 2021 Mar; 205(3):653-663. doi: 0.1097/JU.0000000000 001399; Eur Urol. 2021 Jan; 79(1):11-15. doi: 10.1016/j.eururo.202 0.10.019","sourcePage":411},{"id":"11-031","category":"手術及併發症","categoryOrder":11,"number":31,"question":"有關人工陰莖 (Penile prostheses)置放手術的併發 症，下列何者錯誤：","options":{"A":"若放置初期即產生裝置失靈(device malfunction)，進行單一裝置故障處更換是可行的","B":"人工陰莖體突出(cylinder extrusion)只要沒有感 染且陰莖白膜完整，可經由 distal corporoplasty 做位置的調整，無需整組移除","C":"即便三件式(three-piece device)人工陰莖體侵蝕 (cylinder erosion)的位置在尿道末端，無感染跡 象的儲水囊(reservoir)及調水汞(scrotal pump) 也必須一併移除","D":"考量到傷口及尿液通常都是無菌的，若儲水囊侵蝕 進入膀胱(bladder erosion of reservoir)可在移 除儲水囊並縫合膀胱後，置換另一組新的儲水囊於 其它處","E":"免疫抑制(immunosupressed)的病人，如移植術後 或 HIVD 的患者，在接受人工陰莖置放手術後的感 染率較正常人高，因此術後抗生素使用時間得延長 至一週"},"answer":"E","reference":"(110)/ 11.手術及併發 症/參考資料(摘錄自)： Campbell 12ed, Chapter 72, p1591-1596, & Campbell 11ed, Chpater 30, p718-720","sourcePage":412},{"id":"11-032","category":"手術及併發症","categor
