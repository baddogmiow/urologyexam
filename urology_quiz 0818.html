 的缺點是沒有驗 證過的閾值"},"answer":"A","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12th Chap118, p2658, Table 118.2","sourcePage":219},{"id":"6-040","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":40,"question":"關於男性尿失禁(Men with urinary incontinence) 的評估與治療，下列敘述何者錯誤？","options":{"A":"攝護腺切除術後尿失禁(Post-prostatectomy incontinence)病人若初步治療無效，應考慮安排 尿路動力學檢查、尿道膀胱鏡檢查","B":"排尿後尿液滴落(Post-micturition dribble)的 治療方式為尿道擠壓(Urethral milking)","C":"逼尿肌過動(Detrusor overactivity)引起的急 尿失禁(urge incontinence)，若同時有合併低活 動性膀胱(Underactive bladder)，仍可使用抗膽 鹼藥物/毒蕈鹼阻斷劑(antimuscarinics)","D":"因括約肌閉縮不全(Sphincteric incompetence) 造成的尿失禁，在初步治療無效後，應優先考慮 使用男性尿道吊帶(male sling)或尿道填充物注 射(bulking agent injection)","E":"逼尿肌過動引起的急尿失禁，若藥物治療無效， 則可以使用膀胱肉毒桿菌素(Botulinum toxin A) 或是薦神經刺激術(Sacral nerve stimulation) 治療"},"answer":"D","reference":"(111) 非尿道填充物注射 bulking agent injection，應為人工 括約肌 artificial urinary sphincter 參考資料(摘錄自)：Campbell 12ed, Chapter 113 Evaluation and Management of Men With Urinary Incontinence, p.2545, Fig 113.4","sourcePage":219},{"id":"6-041","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":41,"question":"關於女性尿失禁的風險因子(Risk factors for urinary incontinence in women)，下列敘述何者錯 誤？","options":{"A":"居住在長期照護中心(Long-term care facilities)是增加尿失禁發生的獨立風險因子","B":"高加索(Caucasian)女性發生尿失禁的比例比非 裔美國人(African-American)及亞洲女性高","C":"口服雌激素(Oral estrogen)使用可能會降低中 老年女性應力性尿失禁(Stress urinary incontinence)的風險","D":"尿失禁的發生以及嚴重度皆與「肥胖」和「體重 增加」正相關；與「體重增加」相關的尿失禁是 可逆的，在體重減輕後，尿失禁可改善","E":"糖尿病與憂鬱症是兩個常見與尿失禁相關的內科 疾病。早年的憂鬱症會增加晚年發生尿失禁的風 險"},"answer":"C","reference":"(111) 使用後，風險會增加 參考資料(摘錄自)：Campbell 12ed, Chapter 115 Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology, p.2586","sourcePage":220},{"id":"6-042","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":42,"question":"關於神經性疾病造成下尿路器官功能障礙的表現，下 列敘述何者錯誤？","options":{"A":"巴金森氏症(Parkinson disease)可能會有逼尿 肌活性受損(impaired detrusor activity)、及 尿道橫紋肌括約肌(striated sphincter)遲緩 (bradykinesia)的表現","B":"多發性系統退化症(Multiple system atrophy) 可能會有逼尿肌活性受損(impaired detrusor activity)、及膀胱順應性(Compliance)下降的表 現","C":"多發性硬化症(Multiple sclerosis)可能會造成 逼尿肌活性過動(Overactive detrusor activity) 、協同的尿道平滑肌括約肌功能 (Synergic smooth sphincter) 、但不協同的尿 道橫紋肌括約肌功能(Dyssynergic striated sphincter)","D":"薦椎脊髓損傷(Sacral spinal cord injury)可能 會有逼尿肌不反射(detrusor areflexia)、及尿 道平滑肌括約肌(smooth sphincter)不放鬆 (non-relaxing)的情形","E":"椎間盤疾病 (Disk disease)可能會造成膀胱順 應性(Compliance)下降，及尿道平滑肌括約肌 (smooth sphincter)不放鬆(non-relaxing)"},"answer":"E","reference":"(111) 膀胱順應性正常 參考資料(摘錄自)：Campbell 12ed, Chapter 116 Neuromuscular Dysfunction of the Lower Urinary Tract, p.2601, Table 116.1","sourcePage":220},{"id":"6-043","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":43,"question":"關於膀胱過動症(Overactive bladder)，下列敘述何 者錯誤？","options":{"A":"感覺訊號的傳入路徑(Afferent pathway)會在中 樞神經系統的多處進行整合，主要是在中腦 (midbrain)及前腦(forebrain)","B":"膀胱過動症機轉中，Urothelium-based 及 myogenic hypotheses 是兩個主要膀胱中心理論 (bladder-centric theory)的假說","C":"尿路動力學檢查不該為常規初始評估方式","D":"在初步藥物治療效果不佳時，可以考慮調整藥物 劑量、調整藥物種類、甚至是合併藥物治療","E":"在男性病人藥物治療效果不佳時，仍可考慮神經 調控治療(Neuromodulation)；最終，亦可選擇尿 路引流(Urinary diversion)或是置放導尿管 (Indwelling catheterization)"},"answer":"A","reference":"(111) 中腦(midbrain)及腦幹 (brainstem) 參考資料(摘錄自)：Campbell 12ed, Chapter 117 Overactive bladder, p.2643, 2646, 2647, 2648, 2649","sourcePage":221},{"id":"6-044","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":44,"question":"關於逼尿肌活動力低下不足(Detrusor underactivity, DU)，下列敘述何者錯誤？","options":{"A":"目前較確認 DU 的病因因素包含神經性損傷/疾 病、及糖尿病","B":"在治療 DU 上，可考慮能改善逼尿肌功能的治療方 式，包括薦神經調控(Sacral neuromodulation)、抗乙醯膽鹼酵素劑 (Anticholinesterase)、及毒蕈鹼促效劑 (muscarinic agonist)","C":"在治療 DU 上，可考慮能改善尿引流(Drainage) 的治療方式，但不建議腹部用力解尿(Valsalva voiding)或是反射性排尿(Reflux voiding)","D":"在治療 DU 上，可考慮能降低膀胱出口阻力的治療 方式，包括 α-腎上腺素拮抗劑(α-blocker) 、 肌肉鬆弛劑、及括約肌肉毒桿菌素注射 (Intrasphincter botulinum toxin)","E":"膀胱出口手術(Bladder outlet surgery)可能對 DU 男性病人有效，但失敗風險仍高"},"answer":"B","reference":"(111) 不可使用抗乙醯膽鹼酵素劑 (Anticholinesterase)及毒 蕈鹼促效劑 (muscarinic agonist) 參考資料(摘錄自)：Campbell 12ed, Chapter 118 The Underactive detrusor, p.2657, p.2660 (Fig 118.7), p.2663","sourcePage":221},{"id":"6-045","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":45,"question":"下列神經性疾病與產生的排尿功能障礙，何者為真？","options":{"A":"Cerebral palsy: Dyssynergic smooth sphincter","B":"Diabetes mellitus: normal compliance","C":"Sacral spinal cord injury: Detrusor areflexia","D":"Multiple sclerosis: Increase compliance","E":"Spinal shock: Detrusor overactivity"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell’s Urology 12th edition, Ch116. p.2601, 2610","sourcePage":221},{"id":"6-046","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":46,"question":"關於夜尿(nocturia)與阻塞型睡眠呼吸中止症 (obstructive sleep apnea)之敘述何者為非？","options":{"A":"成因為呼吸道壓力增加因而導致缺氧 (hypoxia)，導致肺部血管收縮，使得右心房壓力 上升而增加 ANP(atrial natriuretic peptide) 產生","B":"ANP(atrial natriuretic peptide)會增加鈉及水 的再吸收，因而導致夜尿","C":"夜尿程度與阻塞型睡眠呼吸中止症嚴重度呈現正 相關","D":"通常夜尿發生於非快速動眼睡眠時期(Non-rapid eye movement)","E":"使用 CPAP(continuous positive airway pressure)可改善阻塞型睡眠呼吸中止症之夜尿 症狀"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell’s Urology 12th edition, Ch119. p.2668, 2669","sourcePage":222},{"id":"6-047","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":47,"question":"下列關於 Detrusor underactivity(DU)何者錯誤？","options":{"A":"Detrusor underactivity 必須是根據 urodynamic study 才能做診斷","B":"Detrusor underactivity 的定義為膀胱收縮強度 和/或時間減少，造成延遲性膀胱排空；和/或未 能在正常期間內達到完全的膀胱排空","C":"Detrusor underactivity 的發生率和年紀呈正相 關","D":"Detrusor underactivity 在年長者通常和其他 lower urinary tract dysfunctions 合併出現， 例如：detrusor overactivity或 bladder outlet obstruction","E":"根據歐洲泌尿科醫學會神經泌尿學治療指引，建 議可以使用 parasympathomimetics 的藥物例如 bethanechol 來治療 neurogenic detrusor underactivity"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell’s Urology 12th edition, Ch118. P.2650-2652 EAU guideline Neuro-urology p.17","sourcePage":222},{"id":"6-048","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":48,"question":"下列關於膀胱過動症(Overactive Bladder)何者錯 誤？","options":{"A":"膀胱過動症最主要的症狀為急尿(urgency)，通常 合併頻尿(frequency)、夜尿(nocturia)，或急迫 性尿失禁(urgency urinary incontinence)","B":"膀胱過動症患者做 urodynamic study 時不一定要 出現 detrusor overactivity","C":"藥物治療可使用 β3-adrenergic agonist 或 antimuscarinic 等，使用 antimuscarinics 藥物 會有大於有 3%病人出現尿滯留","D":"Tibial nerve stimulation 對於藥物使用無效的 病人只有 10-20%的改善效果","E":"使用 botulinum toxin injection 可改善 20-40% 頻尿及急尿症狀，改善 50-60%尿失禁的症狀"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell’s Urology 12th edition, Ch117 p2637, 2647","sourcePage":222},{"id":"6-049","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":49,"question":"下列何者危險因子和女性 pelvic organ prolapse (POP)較無關聯？","options":{"A":"抽菸","B":"雌激素缺乏","C":"糖尿病","D":"放射線治療","E":"基因遺傳"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell’s Urology 12th edition, Ch112 p.2525","sourcePage":223},{"id":"6-050","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":50,"question":"71 歲女性主訴這半年來有頻尿現象，最近幾週覺得尿 道口疼痛，內褲上常沾有血漬，因此至泌尿科門診求 診。內診發現尿道黏膜整圈外翻且十分紅腫，以下敘 述何者錯誤？","options":{"A":"診斷為 urethral caruncle","B":"可能跟雌激素(estrogen)缺乏有關","C":"可以給予雌激素乳膏或是溫水坐浴來改善症狀","D":"可採用電燒燒灼(cauterization)方式治療","E":"可採用手術切除方式治療"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12th Edition, p2986-2987","sourcePage":223},{"id":"6-051","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":51,"question":"30 歲女性，五歲時曾因為必尿道感染合併發燒因而住 院治療，當時腹部超音波檢查找不到右邊腎臟(absent right kidney)。患者主訴多年來排尿結束後仍會有少 量尿液持續滲漏，最近幾個月有反覆泌尿道感染，小 便流速較慢。經泌尿科醫師評估後安排了錄影尿路動 力學檢查(videourodynamic study)，左圖是排尿時的 X 光透視圖，右圖是排尿完成後的 X 光透視圖，以下 敘述何者正確？","options":{"A":"此患者的右腎最初應為完全雙套集尿系統","B":"可安排電腦斷層合併顯影劑使用確認是否有萎縮 右腎存在的可能性","C":"同樣的情況若發生在男性也常發生尿失禁","D":"此患者的情況通常跟 Gartner duct cyst 有關","E":"以上皆是"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12th Edition, p798","sourcePage":223},{"id":"6-052","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":52,"question":"關於間質性膀胱炎/膀胱疼痛症候群(IC/BPS)的治 療，以下敘述何者錯誤？","options":{"A":"Pentosan polysulfate (PPS)是唯一美國 FDA 核 准的口服治療藥物","B":"PPS 可能造成眼睛角膜病變，造成視力模糊","C":"對於有 Hunner lesions 存在的患者，應選擇手術 (fulguration and/or injection of triamcinolone)作為第一線治療","D":"應避免凱格爾運動","E":"低壓短時間(low pressure, short duration)的 膀胱水擴張(hydrodistention)可協助診斷 Hunner lesions 及改善疼痛症狀"},"answer":"B","reference":"(111) 參考資料(摘錄自)：The Journal of Urology 2022; 208:34-42","sourcePage":224},{"id":"6-053","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":53,"question":"70 歲王先生，無慢性病及手術病史，有固定運動習 慣。因為局限性攝護腺癌(localized prostate cancer)而接受放射線治療(RT)，RT 療程結束後一個 月因為排尿困難併尿液滯留接受了經尿道攝護腺切除 手術(TURP)，術後開始發生混和性尿失禁，以應力性 尿失禁為主，至今尿失禁已持續超過一年的時間。每 天需要使用 2-3 片棉墊，期間曾使用藥物合併凱格爾 運動治療，但效果很差。患者考慮進一步接受手術治 療，醫師為其安排尿路動力學檢查，結果顯示膀胱收 縮力較差(detrusor underactivity)，compliance 及 capacity 皆正常。以下關於手術的敘述何者有誤？","options":{"A":"應優先建議王先生接受人工括約肌(artificial urinary sphincter, AUS)植入手術","B":"吊帶手術對於輕至中度的尿失禁治療效果較好","C":"吊帶手術(male sling)主要的作用是壓迫膜狀尿 道(membranous urethra)","D":"AUS cuff 置放的位置為球狀尿道(bulbar urethra)","E":"一般建議 AUS 植入後 6 週再開始使用"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12th Edition, ch131, p2995, p2997-2999, p3006","sourcePage":224},{"id":"6-054","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":54,"question":"關於逼尿肌功能低下(detrusor underactivity, DU) 的敘述，以下何者有誤？","options":{"A":"糖尿病可能會影響到膀胱逼尿肌本身及支配膀胱 的神經而造成逼尿肌功能受損","B":"目前對於 DU 的量化定義並無共識，且聚焦在逼尿 肌的收縮強度","C":"障礙性排尿(dysfunctional voiding)會阻塞尿 流且會反射性的抑制逼尿肌的收縮","D":"薦骨神經刺激(sacral neuromodulation, SNM) 對於 DU 合併非阻塞性尿滯留患者的治療效果不 好","E":"肉毒桿菌毒素注射於尿道括約肌治療 DU 的有效 劑量仍未知且藥效較短"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12th Edition, ch118, p2656-2657, p2660, p2662","sourcePage":225},{"id":"6-055","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":55,"question":"上列為一案例之骨盆臟器脫垂量化分期法(POP-Q)，請 解讀並選出以下敘述何者為錯誤?","options":{"A":"此案例之陰道前壁支撐良好","B":"此案例為直腸脫垂/腸脫垂 (rectocele/enterocele)","C":"因為陰道總長度為 8 公分，所以陰道袖口 (vaginal cuff)降下兩公分","D":"病患已經過接受子宮摘除術所以 D 點不予計算","E":"Aa 及 Ap 均是基準點只能介於+3 及-3 之間"},"answer":"B","reference":"(111) 參考資料 (摘錄自)： 第 12 版 Campbell Urology Ch112; P2530","sourcePage":225},{"id":"6-056","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":56,"question":"實施尿路動力學檢查的如有危險因子，必須採取對應 措施以避免因下泌尿道問題造成上泌尿道傷害。但是 以下敘述哪個項目為非危險因子？","options":{"A":"膀胱適應力不良(Impaired compliance)","B":"逼尿肌尿道內括約肌共濟失調 (Detrusor-internal sphincter dyssynergia)","C":"膀胱充盈期逼尿肌高壓及過動(High pressure detrusor overactivity","D":"逼尿肌漏尿壓力(Detrusor leak point pressure)大於 25 cmH O 2","E":"高儲尿期壓力合併尿液排空不良(Poor emptying with high storage pressure)"},"answer":"C","reference":"(111) 參考資料 (摘錄自)： 第 12 版 Campbell Urology Ch114; P2551","sourcePage":226},{"id":"6-057","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":57,"question":"根據最新版 EAU guideline，有關婦女尿失禁以下評 估及治療方式何者錯誤？","options":{"A":"治療非複雜性的應力性尿失禁不需要常規性的安 排尿動力學檢查","B":"可使用棉墊測試來評估、量化尿失禁患者的嚴重 程度及對治療的反應","C":"保守療法無效並且未尋求治癒的混合型尿失禁， 應該優先提供患者千憂解(Duloxetine)","D":"治療混合型尿失禁(MUI)，首先治療患者最感到困 擾的症狀","E":"治療混合型尿失禁(MUI)，要提醒患者單一治療方 式很有可能不會治癒所有的尿失禁問題"},"answer":"C","reference":"(111) 參考資料 (摘錄自)： 2022 EAU Guidelines on Non- neurogenic Female LUTS 4.2.3.4.1; P40 4.2.3.5; P40 4.3.3.3.3; P62 2020 TUA Guidelines. 尿失禁 URINARY INCONTINENCE P116, P123","sourcePage":226},{"id":"6-058","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":58,"question":"有關女性低活動性膀胱(female underactive bladder - underactive detrusor)的治療內容，下列何者為誤?","options":{"A":"常規使用副交感神經興奮劑如 bethanechol 是不 建議的","B":"合併使用甲型阻斷劑(α-adrenoreceptor antagonist)及副交感神經興奮劑如 bethanechol，統計上是有比單一使用有更好的的 結果","C":"清潔自我導尿(clean intermittent self-catheterization)是標準治療方法 (standard treatment)","D":"肉毒桿菌毒素 (Botulinum toxin )注射於女性外 括約肌，可以有效放鬆尿道增加排尿效能， 2022EAU 指引證據等級是 1b，建議強度評比 (Strength rating)是『強』等級","E":"薦椎神經刺激(sacral nerve stimulation)是可 以可以建議於治療多種保守治療方式無效的患 者。建議強度評比(Strength rating)是『強』等 級"},"answer":"D","reference":"(111) 參考資料 (摘錄自)： 第 12 版 Campbell Urology Ch118; P2661-2663 2022 EAU Guidelines on Non- neurogenic Female LUTS 4.4.4.4.1 P69~70","sourcePage":226},{"id":"6-059","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":59,"question":"1). 單一膀胱陰道瘻管小於 4 公分 2). 多處瘻管 3). 有結疤(scarring) 4). 即將第一次修補手術 5). 僅有膀胱陰道瘻管 6). 電療導致的膀胱陰道瘻管 7). 有完整圓周狀的缺損（Circumferential defect） 8). 有大量組織缺損(extensive tissue loss) 以上是 WHO 分類來區分單純及複雜尿路瘻管的項目， 以下組合哪項是單純尿路瘻管","options":{"A":"1,3,4,5,7","B":"1,3,4,5","C":"1,4,5,7","D":"1,4,5","E":"4,5"},"answer":"D","reference":"(111) 參考資料 (摘錄自)： 2022 EAU Guidelines on Non- neurogenic Female LUTS 4.8.2 P96","sourcePage":227},{"id":"6-060","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":60,"question":"下列何者並非造成逼尿肌功能低下(detrusor underactivity)的原因？","options":{"A":"格林-巴利症候群 (Guillain-Barre syndrome)","B":"膀胱出口阻塞 (Bladder outlet obstruction)","C":"福勒氏综合症(Fowler syndrome)","D":"巨細胞病毒感染(Cytomegalovirus infection)","E":"抗巴金森氏症藥物(Anti-Parkinson medications)"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 11th edition p.1813; BOX.77-1 詳解： Herpes-zoster & herpes simplex 感染較常見","sourcePage":227},{"id":"6-061","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":61,"question":"下列關於攝護腺根除手術後產生的應力性尿失禁的敘 述，何者錯誤？","options":{"A":"攝護腺根除手術後產生的應力性尿失禁有機會 恢復，因此 6—12 月內不建議接受手術性的治療","B":"攝護腺根除手術後產生的應力性尿失禁 Golden standard 為人工尿道括約肌術(artificial urinary sphincter, AUS), 其可達尿控 (continence)的比例為 80%","C":"Bulking agent 可用於症狀輕微(mild)的病人身 上，但應告知其效果是暫時性的","D":"接受過骨盆腔電療的病人可以考慮使用 non-circumferential compression device 以改 善症狀","E":"Duloxetine 可用於此類病人，但應告知其為 off label use"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th edition p.2546 (D) 不建議使用","sourcePage":227},{"id":"6-062","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":62,"question":"關於膀胱陰道廔管，何者正確？","options":{"A":"在 Goh classification 中，評估膀胱陰道廔管預 後的三項標準為：廔管大小、廔管位置、膀胱容 量","B":"生產性廔管（Obstetric Fistulae）越早修補， 預後越好","C":"因醫療技術的進步，生產性廔管（Obstetric Fistulae）發生的比例逐漸下降","D":"手術修補時，疤痕組織應盡可能切除","E":"停經婦女若有 vaginal atrophy，在術前使用 estrogen 補充能有更好的預後"},"answer":"C","reference":"(111) 參考資料(摘錄自)：Campbell Walsh Wein Urology, 12th Edition, Ch. 129, P.2925, 2930~2931, 2933~2934 (A) the location of the fistula, the size of the fistula, and the amount of scarring (B) 要等 3~6 週後組織消腫再修補 (D)修掉疤痕組織會造成更大的 defect，且 如果造成出血，電燒止血會使得組織更難癒 合。 (E)術前使用沒有幫助","sourcePage":228},{"id":"6-063","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":63,"question":"有關人工尿道括約肌（artificial urinary sphincter）置入手術併發症，以下何者錯誤？","options":{"A":"術後如果超過尿滯留超過 48 小時，建議恥骨上膀 胱穿刺引流（suprapubic cystostomy），以減少 尿道侵蝕（erosion）的機率","B":"如果發生人工括約肌感染的情形，基本上建議全 部移除，但在少數情況下可以考慮 salvage therapy 像是部分裝置移除，抗生素沖洗等","C":"延遲啟動裝置可以減少尿道侵蝕（erosion）的情 況，特別是在重新置放的病人","D":"因為有機率會增加感染的可能性，同時置入人工 括約肌及充氣式人工陰莖（inflatable penile prosthesis）是不建議的","E":"人工括約肌術後導致尿道萎縮，治療方式包括縮 小袖套（cuff），調整袖套的位置，或者串連再放 置第二個袖套"},"answer":"D","reference":"(111) 參考資料(摘錄自)： 12th edition Campbell-Walsh Urology chapter 131 P.3005-3008","sourcePage":228},{"id":"6-064","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":64,"question":"下列有關尿滯留(Urinary retention)的敘述，下列何 者不正確?","options":{"A":"膀胱害羞症(Paruresis)是一種發生在年輕男性 的非神經性的尿滯留；病人平常生活中較容易緊 張，導致在情緒壓力下容易有不自主的下泌尿道 症狀。尿路動力學檢查可發現高膀胱內壓與尿道 括約肌異常收縮現象","B":"福勒氏(Fowler syndrome)一般是發生在沒有明 顯神經疾病的年輕女性尿滯留，診斷上需膀胱至 少有 1 公升的尿卻沒有急尿症狀","C":"在 Fowler syndrome 病人的尿路動力學檢查可發 現逼尿肌無收縮及尿道括約肌異常收縮造成的肌 電圖異常活動；但完全的尿滯留卻相對罕見","D":"在手術後膀胱滯留的病人，與麻醉相關的原因包 含膀胱過度擴張、減少膀胱的感覺、降低膀胱收 縮及減少排尿反射","E":"關節置換手術的病人，在術後 18—24 小時做膀胱 減壓與間接性留置導尿相比，可以降低尿滯留的 發生率"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th ed Chapter 124 p2816","sourcePage":228},{"id":"6-065","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":65,"question":"關於不同位置的神經病灶造成的下泌尿道症狀、膀胱 餘尿及尿路動力學表現何者正確?","options":{"A":"橋腦上神經學病灶以儲尿症狀為主，超音波下膀 胱餘尿通常會上升","B":"橋腦下薦椎上的脊髓病灶通常儲尿及排尿症狀都 有，但超音波下膀胱餘尿通常沒有顯著意義","C":"橋腦下薦椎上的脊髓病灶常會造成 bladder overactive, sphincter normo-active，尿路動 力學表現為 detrusor overactivity","D":"薦椎/薦椎下的脊隨病灶主要是排尿的症狀，尿路 動力學上表現可能會 detrusor hypocontractile or acontractile detrusor","E":"薦椎/薦椎下的脊隨病灶會造成 Bladder normo-active, Sphincter Underactive，在超音 波下會看到餘尿增加"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Smith&Tanagho’s general urology 19th edition Chapter 28 P474-476","sourcePage":229},{"id":"6-066","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":66,"question":"下列關於錄影帶尿路動力學檢查(VUDS)的敘述何者錯 誤?","options":{"A":"原發性膀胱頸阻塞(primary bladder neck obstruction,PBNO) 只能用錄影帶尿路動力學檢 查(VUDS)來診斷","B":"歐洲泌尿科學會指引將錄影帶尿路動力學檢查 (VUDS)視為在神經性下泌尿道功能性障礙患者 (NLUTD)執行侵犯性尿路動力學檢查的黃金標準","C":"年輕男性 LUTs 沒有做錄影帶尿路動力學檢查 (VUDS)，也能只靠壓力尿流檢查(PFS)診斷下泌尿 道阻塞","D":"即使膀胱逼尿肌壓力大於 60cm H2O，在錄影帶尿 路動力學檢查上看到排尿期膀胱頸沒有張開，可 以診斷原發性膀胱頸阻塞","E":"在男性患者的錄影帶尿路動力學檢查(VUDS)檢查 中，正常壓力低流速 (normal-pressure-low-flow)的圖形是屬於 type I 原發性膀胱頸阻塞"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th ed Chapter 114 P2569-2571","sourcePage":229},{"id":"6-067","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":67,"question":"關於骨盆腔器官脫垂的手術治療下列敘述何者正確?","options":{"A":"骶棘韌帶固定(Sacrospinous ligament fixation)會改變陰道的軸向，造成前壁脫垂容易 復發，但可靠前壁修補手術預防","B":"大部分的前壁脫垂都單獨存在，通常可以靠前陰 道修補手術(anterior colporrhaphy)來達到 80%-100%的成功率","C":"應該常規在每一次的前陰道修補手術後使用靛胭 脂(indigo carmine)及膀胱鏡檢查輸尿管口有無 藍色的尿液，確認輸尿管損傷","D":"骶骨子宮固定術(Sarcocolpopexy)的好處是可以 最大化陰道長度並且不影響陰道的解剖軸向，是 較適合高齡婦女的手術","E":"後壁脫垂修補手術可以減少陰道突出症狀並減少 陰道隔板的使用，同時腸道症狀(例如:便祕)也會 因為在手術成功後消失"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th ed Chapter 124 P2778-2829","sourcePage":230},{"id":"6-068","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":68,"question":"根據2022美國泌尿科醫學會指引(AUA guideline),下 列關於間質性膀胱炎/膀胱疼痛症候群(Interstitial Cystitis/Bladder Pain Syndrome) 的敘述何者錯誤?","options":{"A":"依據RICE研究，將間質性膀胱炎/膀胱疼痛症分成 高敏感性與高特異性兩組定義","B":"在懷疑有Hunner lesions的病人應該做膀胱鏡檢 查，例如年紀大於50歲的男性或女性","C":"除了有Hunner lesion的病人，大部分間質性膀胱 炎/膀胱疼痛症候群的初始治療應該都以非手術 性為主","D":"口服藥物治療包括Amitriptyline, Cimetidine, Hydroxyzine, or Pentosan polysulfate為第二 線的治療選擇","E":"膀胱灌注藥物治療包括DMSO, Heparin為證據強 度Grade C，而Lidocain是證據強度Grade B；有 研究指出Heparin合併Lidocain更可以降低膀胱 疼痛和急尿的症狀"},"answer":"D","reference":"(111) 參考資料(摘錄自)：2022 AUA Guidelines, diagnosis-and-treatment IC/BPS https://www.auanet.org/gu idelines/guidelines/diagn osis-and-treatment-inters titial-cystitis/bladder-p ain-syndrome-(2022)","sourcePage":230},{"id":"6-069","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":69,"question":"關於膀胱陰道瘻管的敘述，以下何者不適當?","options":{"A":"保守治療無效，通常需手術修補","B":"子宮切除術中，術中膀胱損傷是發生膀胱陰道廔 管的主要危險因素","C":"經腹部子宮切除術造成膀胱損傷的發生率至少比 經陰道子宮切除術高出三倍","D":"大多數尿道損傷不會導致瘻管","E":"Martius Flap 為使用陰唇皮瓣(labial flap)方 式，使用此皮瓣有上方來自外陰動脈(External pudendal artery)及側面來自閉孔動脈 (Obturator artery)的豐沛血流支援"},"answer":"A","reference":"(111) 參考資料(摘錄自)：Campbell urology 12th, p2924-2939","sourcePage":231},{"id":"6-070","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":70,"question":"關於女性尿道憩室，以下何者敘述正確?","options":{"A":"憩室的上皮可以是泌尿上皮，鱗狀上皮或柱狀上 皮","B":"因感染風險，尿道憩室併有尿失禁病患通常不建 議憩室手術一併處理尿失禁","C":"憩室最常見的惡性腫瘤類型是鱗狀細胞癌","D":"常見的相關症狀有陰道搔癢，排尿困難和性交疼 痛","E":"憩室開口常見在（開口）最常見於尿道的中部或 近端三分之一處，位於 4 點鐘和 8 點鐘位置"},"answer":"A","reference":"(111) 參考資料(摘錄自)：Campbell urology 12th p2975-2992","sourcePage":231},{"id":"6-071","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":71,"question":"下列有關婦女經陰道置放人工網膜(mesh)造成後遺症 的描述何者錯誤？","options":{"A":"人工網膜暴露（exposure）會導致持續性出血、 陰道分泌物、性交困難、伴侶疼痛、復發性尿路 感染或盆腔疼痛","B":"長期置放人工網膜導致罹患骨盆腔癌症的機率並 不會增高","C":"人工網膜暴露後，不需將整個網膜完全移除","D":"若是人工網膜造成膀胱出口阻塞，可施行尿道擴 張術改善其症狀","E":"評估人工網膜造成的膀胱損傷時，應完全將膀胱 漲滿，因為未漲滿的膀胱可能會掩蓋住小穿孔"},"answer":"D","reference":"(111) 參考資料(摘錄自)：Campbell urology Ch 126, p2877-2882","sourcePage":231},{"id":"6-072","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":72,"question":"括約肌共濟失調的治療選擇可以包括以下所有，除了?","options":{"A":"間歇性導尿","B":"將肉毒桿菌毒素注射到括約肌中","C":"骶神經調節","D":"括約肌切開術","E":"尿流改道"},"answer":"C","reference":"(111) 參考資料(摘錄自)：Campbell urology review, ch 116, No 23","sourcePage":232},{"id":"6-073","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":73,"question":"以下有關脊髓損傷造成下泌尿道功能障礙的敘述，何 者錯誤?","options":{"A":"一般來說，骶脊髓以上至交感神經輸出區以下的 完全脊髓損傷會導致逼尿肌過度活動及平滑括約 肌協同失調（dyssynergia）","B":"T7 或 T8 脊髓或以上的病變可能導致平滑括約肌 協同失調","C":"神經系統檢查不能取代尿動力學來評估脊髓損傷 患者的危險因素和治療方式","D":"對脊髓損傷患者應積極治療其 NDO，以防止長期 上尿路損傷","E":"若是病人狀況穩定，不需定期做尿路動力學檢查 評估病人排尿狀況"},"answer":"E","reference":"(111) 參考資料(摘錄自)：Campbell urology 12th p 2610-2614","sourcePage":232},{"id":"6-074","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":74,"question":"下列關於抗膽鹼藥物(antimuscarinic agents)的敘 述何者有誤?","options":{"A":"沒有任何臨床上常用的抗膽鹼藥物適合一線治療 全部的膀胱過動或逼尿肌過動患者","B":"四級銨鹽化合物 Propantheline 和 Trospium 有較 多的中樞神經的副作用","C":"膀胱內灌注 Atropin 治療神經性逼尿肌過動患者 是有效且不會造成系統性副作用","D":"Imidafenacin 對於 M1 receptor 的親和性較 M2 receptor 高","E":"Oxybutinin 同時具有抗膽鹼、肌肉鬆弛及局部麻 醉的效果，常用來治療膀胱過動症"},"answer":"B","reference":"(111) 參考資料(摘錄自)：Campbell 12th Chapter 120 P2621","sourcePage":232},{"id":"6-075","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":75,"question":"下列關於骨盆手術造成的下泌尿道功能障礙的敘述， 何者錯誤?","options":{"A":"一般來說，子宮根除手術較結腸直腸切除手術常 發生","B":"這種下泌尿道功能障礙可能有 15%-20%是永久的","C":"尿路動力學上常看到平滑括約肌收縮造成的阻塞 性症狀","D":"在術前沒有排尿功能障礙的病人，這些症狀通常 是暫時性的","E":"經陰道子宮切除手術通常比經腹部子宮手術有較 高的機率產生排尿症狀"},"answer":"C","reference":"(111) 參考資料(摘錄自)：Campbell 12th Chapter 116 P2621","sourcePage":233},{"id":"6-076","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":76,"question":"下列關於間質性膀胱炎/膀胱疼痛症候群 (Interstitial Cystitis/Bladder Pain Syndrome) 手術治療的敘述，何者正確?","options":{"A":"在膀胱水擴張手術中，延長膀胱擴張的時間比起 短時間的水擴張幾乎沒有好處，2015 年美國泌尿 科學會指引建議短時間(1-3 分鐘)低壓擴張治療","B":"盡量不要在膀胱水擴張手術時做膀胱切片，如果 需要應該擴張前執行","C":"一般來說，使用雷射燒灼處理 HL lesion 相對安 全，並不會造成腸道的損傷","D":"雖然說膀胱次全切除手術理論上可以移除疼痛組 織、保留尿道排尿功能並且減少尿袋使用，但他 還是有一半以上的失敗率","E":"神經阻斷術(denervation procedure)近期常用 來治療下背痛，但過去幾乎沒有在間質性膀胱炎/ 膀胱疼痛症候群患者的研究結果，這是未來可以發 展的目標"},"answer":"A","reference":"(111) 參考資料(摘錄自)：Campbell 12th Chapter 57 P1247-1249","sourcePage":233},{"id":"6-077","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":77,"question":"下列關於下泌尿道功能障礙分類系統的敘述，何者錯 誤?","options":{"A":"國際尿控協會(ICS)的分類系統中，分為儲尿期及 排尿期，並依照膀胱、尿道功能再去做細分類， 分類中亦包括正常的功能的膀胱","B":"尿路動力學分類(urodynamic classification) 只能用於有尿路動力學檢查的病人，不能看到膀 胱的順應性及感覺","C":"Hald-Bradley 分類主要是針對神經性膀胱的分 類，可分為 Loop1 -Loop 4；Loop 1 主要是腦部 的病灶並引發膀胱不自主收縮","D":"在 Bors-Comarr 分類中，在上運動神經元病灶的 病人若有大於 20%膀胱容積的餘尿表示不平衡 (unbalance)","E":"腦血管疾病、腦部或脊椎腫瘤及巴金森氏症等在 Lapides 分類中，屬於未抑制神經性膀胱 (uninhibited neurogenic bladder)"},"answer":"C","reference":"(111) 參考資料(摘錄自)：Campbell 12th Chapter 111 P2520-2524","sourcePage":233},{"id":"6-078","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":78,"question":"下列關於懸吊手術的敘述何者錯誤?","options":{"A":"研究指出單切口尿道中段懸吊術(SIMS)比起陰道 無張力懸吊術(TVT-O)有較少的腹股溝疼痛","B":"文獻證明單切口尿道中段懸吊術(SIMS)在長期追 蹤下，有較好的療效","C":"雖然恥骨後尿道中段懸吊術(retropubic MUS)可 能產生較高的嚴重後遺症，但整體而言比例還是 偏低","D":"經閉孔尿道中段懸吊術(transobturator MUS)在 治療應力性失禁的病人上效果跟恥骨後尿道中段 懸吊術相似","E":"在混合性尿失禁的病人使用尿道中段懸吊術效果 並沒有比應力性尿失禁的病人好"},"answer":"B","reference":"(111) 參考資料(摘錄自)：Campbell 12th Chapter 125 P2855-2859","sourcePage":234},{"id":"6-079","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":79,"question":"Suprasacral spinal cord injury 之描述及處理原 則，何者正確？","options":{"A":"典型尿路動力學表現為 detrusor overactivity, smooth sphincter dyssynergia, striated sphincter dyssynergia","B":"危險因子包括 high detrusor leak point pressure, low-pressure storage, VUR, stone formation, complicating infection","C":"需要間歇導尿(CIC)之病人，需要長期使用抗生素 以預防感染","D":"神經學檢查可發現損傷位置遠端之骨骼肌痙攣 (spasticity)、hyperreflexic DTRs、異常足底 反射","E":"很少出現膀胱功能性阻塞(poor emptying and high detrusor pressure)"},"answer":"D","reference":"(112) 參考資料(摘錄自)： Campbell 12ed, Chapter 116 詳解： (A) P.2612, smooth sphincter synergia with lesion below sympathetic outflow (B) P.2612, high-pressure storage (C) P.2612, avoid long-term antibiotics (D) P.2610 (E) P.2610, causes functional obstruction","sourcePage":234},{"id":"6-080","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":80,"question":"關於膀胱過動症 (Overactive Bladder, OAB)之描 述，下列敘述何者錯誤？","options":{"A":"OAB 目前的定義是尿急，通常伴有尿頻和夜尿， 伴隨或不伴隨急迫性尿失禁 (urge incontinence, UUI)，且在沒有 UTI 或其他明顯 病理的情況下，才可下此診斷","B":"尿路上皮 (urothelium-based)和肌源性 (myogenic)假說是 OAB 機轉背後兩個主要以膀胱 為中心的理論 (bladder-centric theories)","C":"尿路動力學檢查、膀胱鏡檢查和診斷性腎臟與膀 胱超音波檢查不應該作為非複雜性或無併發症患 者 (uncomplicated patient)的初始檢查方式","D":"第二線治療包括抗毒蕈鹼類藥物 （antimuscarinics, 口服或透皮）或 β3 促效 劑 (β3 agonists)等藥物治療","E":"第四線治療包括骨盆底、骶神經、脛骨功能性神 經電刺激 (sacral neuromodulation and posterior tibial nerve stimulation)、肉毒桿 菌毒素注射 (botulinum toxin injection)等"},"answer":"E","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th, Chapter 117, p.2637-2649.e4 E. 第三線治療包括骨盆底、 骶神經、脛骨功能性神經電刺 激 (sacral neuromodulation and posterior tibial nerve stimulation)、肉毒桿菌毒素 注射 (botulinum toxin injection)等。","sourcePage":235},{"id":"6-081","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":81,"question":"關於婦女應力性尿失禁 (stress incontinence in women)，下列敘述何者錯誤?","options":{"A":"應力性尿失禁的總體盛行率在成年女性中約佔 46%，且相關的危險因子有年齡增加、懷孕、陰道 生產、較高的身體質量指數(body mass index, BMI)","B":"應力性尿失禁的初步評估以咳嗽、大笑、打噴嚏 或腹壓運動是否伴隨尿液自尿道溢出；完整的骨 盆腔檢查 (pelvic examination)，配合手術前的 尿路動力學檢查與餘尿量測量 (postvoid residual volume )對於病情複雜的應力性尿失禁 患者，可提供更全面性的診斷與治療計畫","C":"加強骨盆底肌肉群的鍛煉可有效控制應力性尿失 禁之發生；此外，建議超重或肥胖女性減肥亦可 改善應力性尿失禁","D":"如果行為治療效果不彰，病患可考慮以合適的子 宮托 (pessary)作為下一步之治療","E":"手術是應力性尿失禁最有效的治療方式，其中尿 道注射填充劑(urethral bulking)是對於應力性 尿失禁最有效、治癒率最高且復發率最低的治療 方式"},"answer":"E","reference":"(112) 參考資料(摘錄自)： N Engl J Med 2021;384:2428-36. E. 尿道注射填充劑 (urethral bulking)為治療應 力性尿失禁效果較差且復發 率最高的治療方式。","sourcePage":235},{"id":"6-082","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":82,"question":"有關下尿路的神經控制 (Neural control of the lower urinary tract ) 何者描述不正確?","options":{"A":"交感神經節後神經 (Sympathetic post-ganglionic nerves) 釋放正腎上腺素 ( noradrenaline)，活化 β-腎上腺素能受體 (β-adrenergic receptors)，引起逼尿肌縮","B":"交感神經節後神經 (Sympathetic post-ganglionic nerves) 釋放正腎上腺素 ( noradrenaline)，活化膀胱及膀胱頸 α-腎上 腺素能受體 (α-adrenergic receptors)，引起 膀胱出口收縮","C":"副交感神經支配起源於脊髓節段 S2-S4，之後會 聚到骨盆神經的節前神經纖維","D":"副交感神經節後神經釋放乙酰膽鹼 ( acetylcholine) 和 nonadrenergic noncholinergic transmitters","E":"逼尿肌收縮可以通過釋放與 M2 和 M3 毒蕈鹼受 體 ( muscarinic receptors) 結合的乙酰膽鹼以 及通過 ATP 對膀胱肌中 P2X 嘌呤能受體 (purinergic receptors ) 的作用來啟動"},"answer":"A","reference":"(112) 參考資料(摘錄自)：第 19 版 Smith. Chapter 28. P474","sourcePage":236},{"id":"6-083","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":83,"question":"骶棘韌帶固定術(Sacrospinous ligament fixation) 治療陰道前壁器官脫垂如膀胱膨出等手術，最不可能 造成如下哪一鄰近器官或組織損傷?","options":{"A":"陰部神經或內陰部血管 pudendal nerve or internal pudendal vessels","B":"閉孔神經血管叢 Obturator neurovascular bundle","C":"下腹神經叢 Hypogastric plexus","D":"坐骨神經 Sciatic nerve","E":"直腸 Rectum"},"answer":"B","reference":"(112) 參考資料(摘錄自)：第 12 版 Campbell Urology Ch124; P2797","sourcePage":236},{"id":"6-084","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":84,"question":"治療婦女尿失禁於陰道置入人造網膜（mesh)之長期反 應，以下何者不正確?","options":{"A":"不會增加婦女盆腔癌症(pelvic cancer)的風險","B":"幾乎所有患者在陰道網膜置入後會出現巨細胞反 應(giant cell reaction)","C":"與自體免疫性疾病(autoimmune disease)的發展 有關","D":"超過一半患者存在中度陰道組織纖維化(vaginal tissue fibrosis)","E":"與有排尿障礙的患者相比，發生網膜外移 （extrusion） 或疼痛的患者，在組織病理學中 顯示的炎症反應(inflammation noted on histopathology) 比較少"},"answer":"C","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh Urology, 12th ed Ch126, p 2878","sourcePage":236},{"id":"6-085","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":85,"question":"下列有關排尿功能的敘述何者錯誤？","options":{"A":"在發炎(inflammation)或其他可能病理狀況下， 膀胱內會增加 C fibers 聚集並形成新的傳入路徑 (afferent pathway)","B":"谷氨酸(glutamate)在排尿的脊髓傳出路徑 (spinal efferent circuitry)中扮演重要角色","C":"毒蕈鹼受體(muscarinic receptors)誘導產生的 膀胱收縮是來自於副交感神經(parasympathetic nerve)調控鈉離子(Na+)濃度造成","D":"膀胱肌肉產生的收縮和骨骼肌(skeletal muscle)不同，收縮反應通常較慢且持久","E":"膀胱感覺(bladder sensation)和尿道壓力 (urethral pressure)會隨著年齡的增長而下 降，因此衰老可能會導致人類膀胱和尿道功能減 退"},"answer":"C","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： 1. Campbell 2. 第 12 版 3. Chapter 110 Page 2478, 2487, 2510 Muscarinic receptors induce detrusor contraction in response to ACh released from parasympathetic nerve terminals by calcium entry through Ca2+ channels.","sourcePage":237},{"id":"6-086","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":86,"question":"根據美國泌尿科醫學會(AUA) 應力性尿失禁 (SUI) 治療指引，當女性有應力性尿失禁症狀就診時的初步 評估，除了尿液分析 urinalysis ，還包括：","options":{"A":"餘尿量（postvoided residual volume）","B":"腹部 X 光(KUB)","C":"膀胱鏡(cystoscopy)","D":"膀胱壓檢查 (Cystometry, CMG)","E":"以上皆是"},"answer":"A","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh Urology, 12th ed Ch 125 p2832","sourcePage":237},{"id":"6-087","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":87,"question":"尿路動力學檢查是診斷排尿障礙的利器，下面列出的 狀況中何者不是必須介入治療(intervention)的危險 因子？","options":{"A":"不佳的膀胱順應性(impaired compliance)","B":"逼尿肌-外括約肌協同失調(detrusor–external sphincter dyssynergia)","C":"逼尿肌-內括約肌協同失調(detrusor–internal sphincter dyssynergia)","D":"排尿期間持續且高壓的逼尿肌活動增強 (high-pressure detrusor overactivity)","E":"過高的逼尿肌漏尿壓力(detrusor leak point pressure) >40 cm H O 2"},"answer":"D","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： 1. Campbell 2. 第 12 版 3. Chapter 114 Page 2551 High-pressure detrusor overactivity present throughout filling","sourcePage":237},{"id":"6-088","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":88,"question":"侵入性尿路動力學檢查仍可能有造成尿路感染的疑 慮，下列有關抗生素使用的敘述何者錯誤？","options":{"A":"假定泌尿生殖系統解剖結構正常(presumed normal genitourinary anatomy)的患者不需給予 抗生素使用","B":"糖尿病患者不需給予抗生素使用","C":"高齡患者(70 歲以上)建議給予抗生素使用","D":"停經後婦女建議給予抗生素使用","E":"身上有骨科植入物(Orthopedic implant)的患者 建議給予抗生素使用"},"answer":"D","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： 1. Campbell 2. 第 12 版 3. Chapter 114 Page 2552, 2553 Antibiotic prophylaxis is not recommended for urodynamic studies based on menopausal status.","sourcePage":238},{"id":"6-089","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":89,"question":"下列關於尿失禁的敘述何者錯誤？","options":{"A":"女性相較於男性容易發生尿失禁","B":"懷孕/分娩與子宮切除手術皆和女性尿失禁相關","C":"男性最容易產生的尿失禁是骨盆底手術(pelvic surgery)造成的應力性尿失禁(stress urinary incontinence)","D":"根除性前列腺切除(radical prostatectomy)術 後的應力性尿失禁(stress urinary incontinence)發生率在 8%到 60%之間","E":"超過 40%的女性應力性尿失禁(stress urinary incontinence)患者會出現陰道前壁脫垂 (anterior vaginal wall prolapse)"},"answer":"C","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： 1. Campbell 2. 第 12 版 3. Chapter 115 Page 2582, 2587, 2592 UUI is the most common form of UI in men, followed by MUI and then SUI.","sourcePage":238},{"id":"6-090","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":90,"question":"下列關於神經源性排尿障礙(neuro-urology)的相關 敘述何者錯誤？","options":{"A":"由於疾病的複雜性，應優先以錄影尿路動力學 (video-urodynamics)取代膀胱壓測定 (cystometry)及壓力尿流測試(pressure flow study)","B":"抗毒蕈鹼藥物(Antimuscarinic therapy)可用做 神經源性膀胱過動(neurogenic detrusor overactivity)的第一線藥物治療","C":"如果抗毒蕈鹼藥物治療無效，則可以考慮進行逼 尿肌肉毒桿菌毒素注射(botulinum toxin injection)以減少多發性硬化症或脊髓損傷患者 的神經源性逼尿肌過動","D":"男性患者嚴重的神經源性急迫性尿失禁 (neurogenic urgency urinary incontinence) 可建議使用人工括約肌(artificial urinary sphincter)治療","E":"在困難治療的神經源性逼尿肌過動症 (refractory neurogenic detrusor overactivity)患者可以考慮進行膀胱擴大手術 (bladder augmentation)以緩解症狀"},"answer":"D","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： EAU Guidelines. Edn. presented at the EAU Annual Congress Milan, March 2023. ISBN 978-94-92671-19-6 Insert an artificial urinary sphincter in male patients with neurogenic SUI.","sourcePage":238},{"id":"6-091","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":91,"question":"關於神經性膀胱之神經支配、相關檢測與治療，下列 敘述何者錯誤？","options":{"A":"正常排尿與輕度髓鞘化之 Aδ 傳入神經 (myelinated Aδ afferents) 所調控的脊髓延髓 反射 (spinobulbospinal reflex) 有關","B":"無髓鞘之 C 纖維 (unmyelinated C fibers)通常 對膀胱的緩慢性擴張相對不敏感","C":"脊髓損傷後，逼尿肌過度活動 (detrusor overactivity, DO) 的發生可能肇因於與辣椒素 敏感性之 Aδ 傳入神經 ( capsaicin sensitive Aδ afferents) 所調控的脊髓反射之形成有關","D":"膀胱冰水尿動力學試驗 (ice-water urodynamic test) 已被建議可作為評估 C 纖維所調控之排尿 反射 (C-fiber–mediated micturition reflex) 的研究方法，但在臨床上尚未被廣泛運用","E":"膀胱內灌注辣椒素 (capsaicin) 或仙人掌毒素 (resiniferatoxin, RTX) 可降低神經纖維和尿 路上皮中「瞬態感受器電位陽離子通道，子類 V， 成員 1」(Transient Receptor Potential Cation Channel Subfamily V Member 1, TRPV1) 免疫反 應性的強度，治療神經性逼尿肌過度活動 (neurogenic DO) 的患者並改善其症狀"},"answer":"C","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th, Chapter 110, p.2461-2513. C. 脊髓損傷後，逼尿肌過度 活動 (detrusor overactivity, DO) 的發生可 能肇因於與辣椒素敏感性之 C 纖維 (capsaicin sensitive C-fiber) 所調控的脊髓反射 之形成有關。","sourcePage":239},{"id":"6-092","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":92,"question":"關於骶上脊髓損傷 (suprasacral spinal cord injury) 所導致的排尿障礙，下列敘述何者錯誤？","options":{"A":"典型的尿動力學模式是逼尿肌過度活動 (detrusor overactivity, DO) 、平滑括約肌協 同 (smooth sphincter synergia) 和橫紋括約肌 協同失調 (striated sphincter dyssynergia)","B":"須進行仔細的初步評估和定期、常規的隨訪評 估，以識別潛在的危險因素和處理可能的併發 症，如高壓儲存 (high-pressure storage)、高 逼尿肌漏點壓力 (high detrusor leak point pressure) 、膀胱輸尿管逆流 (vesicoureteral reflux, VUR)、結石形成 (下尿路或上尿路）和 感染等","C":"在確定危險因素與提供治療方式上，無法以神經 系統檢查完全替代尿動力學檢查來評估骶上脊髓 損傷 (suprasacral spinal cord injury) 患者 的排尿障礙","D":"可使用長期抗生素以防止執行「清潔導尿」(clean intermittent catheterization, CIC）的患者發 生感染","E":"正在進行的腹側神經手術 ( ventral nerve surgery) 研究和幹細胞 ( stem cells) 的應 用，日後可提供骶上脊髓損傷嶄新的治療方式"},"answer":"D","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th, Chapter 116, p.2600-2636.e9 D.不可使用長期抗生素來防 止執行 CIC 的患者發生感染。","sourcePage":240},{"id":"6-093","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":93,"question":"有關 BPS(bladder pain syndrome)以及 IC(interstitial cystitis)的敘述，何者正確？","options":{"A":"組織學診斷包含明顯的水腫、血管擴張、神經細 胞增生，以及嗜中性球(neutrophil)浸潤","B":"NGF(nerve growth factor) 在發炎跟痛覺訊號之 間扮演重要的關聯角色，NGF 可由許多細胞表 現，包括泌尿上皮細胞、平滑肌細胞、以及肥大 細胞(mast cell)，並且可以活化肥大細胞使其去 顆粒化及增生(degranulate and proliferate)","C":"運用 NGF 隔離分子(NGF-sequestering molecules)可減少由 mitomycin 導致的膀胱發 炎","D":"慢性膀胱發炎與 C-fiber 功能改變之間尚無動物 實驗上的直接關聯證據","E":"慢性膀胱發炎可改變受體之功能，例如 interneuron 上之 TRPV1"},"answer":"B","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： C ampbell-Walsh Urology 12th Edition, Page 2507-2509 (A) In Europe, the diagnosis of BPS/IC typically requires a bladder biopsy showing overt inflammation, so it is no surprise that histologic analysis of bladders from European patients with BPS/IC revealed marked edema, vasodilation, proliferation of nerve fibers, and infiltration of mast cells (Johansson and Fall, 1997). (C) Application of NGF-sequestering molecules can reduce bladder overactivity elicited by cyclophosphamide-induced cystitis. (D) Direct evidence linking chronic bladder inflammation with functional changes in C-fiber afferents has been obtained in rat chronic cystitis models. (E) Chronic bladder inflammation can also induce changes in functional properties of chemosensitive receptors, such as TRPV1 in sensory neurons.","sourcePage":240},{"id":"6-094","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":94,"question":"有關老化(aging)對下泌尿道症狀(LUTS)關聯性的敘 述，何者錯誤？","options":{"A":"研究發現逼尿肌收縮力(detrusor contractility)、膀胱感覺(ladder sensation)，以及尿道壓(urethral pressure) 會隨年紀增加而下降","B":"膀胱容積(bladder capacity)減少則與 DO(detrusor overactive)有關，而非老化本身","C":"膀胱因老化造成的 impaired activity，部分原 因是膀胱傳入及傳出神經元活性降低所造成","D":"在動物實驗中，老化的膀胱逼尿肌對 cholinergic 刺激以及 electric 刺激反應漸少","E":"在動物實驗中，老化的膀胱逼尿肌對 α-adrenergic 刺激反應增加，對 β-adrenergic 刺激反應減少"},"answer":"D","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, Page 2509-2510 (D) In contrast to altered nerve activity, there appears to be no significant change in detrusor contractile responses to cholinergic or electric stimulation between young and old animals.","sourcePage":241},{"id":"6-095","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":95,"question":"有關糖尿病(Diabetes Mellitus)引起之下泌尿道症 狀，下列何者錯誤？","options":{"A":"有糖尿病的病人相較於沒有糖尿病的病人有高出 20%的風險發展出 urinary incontinence","B":"失禁主要以 urge incontinence 為主，而 stress incontinence 則與糖尿病沒有直接關聯","C":"平滑或橫紋括約肌共濟失調(smooth or striated sphincter dyssynergia)通常不是經典的糖尿病 膀胱病變","D":"糖尿病常引發的尿路動力學異常包括膀胱感覺異 常(impaired bladder sensation)、膀胱容積減 少(decreased cystometric bladder capacity)、膀胱收縮力降低(decreased bladder contractility)","E":"逼尿肌功能異常與血漿中 Advanced glycation end products (AGEs)增加有關"},"answer":"D","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)：： Campbell-Walsh Urology 12th Edition, Page 2619-2624 (D) The classic urodynamic findings include impaired bladder sensation, increased cystometric bladder capacity, decreased bladder contractility, impaired uroflow and, later, increased residual urine volume.","sourcePage":241},{"id":"6-096","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":96,"question":"下列何者不是 DSD(Detrusor Sphincter Dyssynergia)常見的治療方式？","options":{"A":"Clean Intermittent Catheterisation (CIC) 合 併控制逼尿肌過動之治療","B":"括約肌切開術(sphincterotomy)","C":"膀胱內注射 Onabotulinumtoxin Ａ","D":"持續導管留置(continuous indwelling catheterization)","E":"尿液分流(urinary diversion)"},"answer":"C","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, Page 2627-2634 The most common treatment approaches currently are (1) CIC (usually combined with therapy to control detrusor overactivity), (2) sphincterotomy, (3) injection of onabotulinumtoxin A into the sphincter, (4) continuous indwelling catheterization, and (5) urinary diversion.","sourcePage":242},{"id":"6-097","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":97,"question":"有關術後尿液滯留(Postoperative Urinary Retention)之敘述，何者錯誤？","options":{"A":"最常發生在下泌尿道及會陰部位手術、婦科手 術、大腸直腸手術","B":"由痛覺或術後不適感所引起的 nociceptive inhibitory reflex 會導致膀胱收縮力降低 (Decreased bladder contractility)、增加出口 阻力(Increased outlet resistance)並減低膀胱 感覺(Diminished awareness of bladder sensation)導致尿液滯留","C":"術後導尿管留置 18-24 小時可減少尿液滯留之發 生率","D":"根據研究，接受大腸直腸手術的病人預防性給予 phenoxybenzamine 可以減少約 30%術後尿液滯留 之風險","E":"根據研究，接受脊椎手術(spinal surgery)的病 人預防性給予 tamsulosin，與控制組比較並無顯 著減少術後尿液滯留"},"answer":"B","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, Page 2627-2634 The idea of a nociceptive inhibitory reflex initiated by pain or discomfort is an attractive one, because a sympathetic efferent limb could directly affect factors 4, 5, and 6. 1. Traumatic instrumentation 2. Bladder overdistention 3. Diminished awareness of bladder sensation 4. Decreased bladder contractility 5. Increased outlet resistance 6. Decreased micturition reflex activity 7. Nociceptive inhibitory reflex 8. Preexistent outlet pathology (e.g., BPH)","sourcePage":242},{"id":"6-098","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":98,"question":"下列有關膀胱頸阻塞 (bladder outlet obstruction) 對於膀胱影響的描述，何者有誤？","options":{"A":"可分成早期的 stage of compensate 與晚期的 stage of decompensate，其中膀胱平滑肌的肥厚 發生在 stage of compensate","B":"在 Stage of compensation 這個時期，膀胱仍舊 有能力將尿液排空","C":"膀胱若發生小樑 ( trabeculation) 、腔室化 ( cellule )、憩室 (diverticula)，則代表膀胱 已經進入晚期的 stage of decompensate","D":"膀胱阻塞之後，膀胱三角 ( trigone) 與輸尿管 間嵴 (interureteric ridge) 的肌肉肥厚，導致 膀胱內的輸尿管段 ( intravesical ureteral segments ) 被壓迫，造成輸尿管尿液流動困難","E":"在 stage of decompensate，逼尿肌的功能嚴重 退化，導致排尿後出現大量殘餘尿液可能高達 500 mL 或更多"},"answer":"C","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)：第 19 版 Smith. Chapter 12. P178-179","sourcePage":243},{"id":"6-099","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":99,"question":"以下哪項是馬尾綜合症 (cauda equina syndrome, CES) 的特徵？","options":{"A":"馬尾綜合症局限於下肢的運動和感覺異常症狀","B":"馬尾綜合症（CES）最常見的泌尿功能障礙是尿瀦 留，原因是逼尿肌收縮不足和膀胱感覺喪失。這 種情況在神經系統受損後立即發生","C":"尿急和尿頻不可能發生，因此若發生此情況即可 排除馬尾綜合症","D":"CES 的損傷發生在脊椎下方的腰馬尾 S1 以下的區 域，這個區域有多條馬尾神經根（脊髓下端神經 根）緊密聚集在一起","E":"CES 所導致的排尿症狀通常預後很差， 即使盡早 解除神經被壓迫， 排尿的障礙也很難回復"},"answer":"B","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)：： 第 19 版 Smith. Chapter 28. P477","sourcePage":243},{"id":"6-100","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":100,"question":"請選出以下有關清潔間歇導尿（Clean Intermittent Catheterization，CIC）的敘述中，哪一項不正確？","options":{"A":"CIC 是無法自行排尿且具備手部靈活性或有願意 照顧者的個體在膀胱管理中首選的方法","B":"與一些慢性疾病風險降低有關，例如腎積水和膀 胱結石","C":"在尿道解剖結構異常、膀胱容量 <200 mL、自主 神經反射異常、認知差的個體中效果不佳","D":"潛在併發症包括尿路感染和自主神經反射異常","E":"一般指南建議使用可重複使用的導尿管進行 CIC，以降低成本"},"answer":"E","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)：第 19 版 Smith. Chapter 28. P480","sourcePage":244},{"id":"6-101","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":101,"question":"有關婦女的禁尿 (continence)功能，下列敘述何者錯 誤？","options":{"A":"尿道閉合壓 ( Urethral closing pressure, UCP) 的定義是尿道內壓力和膀胱內壓力之間的淨值 (net difference between the intraurethral and intravesical pressures)","B":"正常的女性在膀胱脹滿時，如果直立、咳嗽、打 噴嚏，通常會看到尿道閉合壓力(urethral closing pressure, UCP )增加","C":"尿道上端閉合壓力( UCP)非常低； 往下則壓力逐 漸上升，在尿道的大約中間三分之一處達到壓力 最大值，而此處正是橫紋肌最密集的部位","D":"Simple Q-tip test 目的是要測量患者是否有尿 道的過度活動 ( Hypermobility)，其定義為與水 平面 >45° 的靜止角度或應變角度","E":"盆底肌肉訓練（Pelvic floor muscle training, PFMT）：有助於應力性尿失禁的改善，典型的實例 是凱格爾運動。它包括進行 8 至 12 次，持續 10 秒鐘的盆底肌肉收縮，每天進行數次，維持 4 至 6 個月"},"answer":"D","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)：第 19 版 Smith. Chapter 30. P502","sourcePage":244},{"id":"6-102","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":102,"question":"有關肉毒桿菌素(Botulium toxin, BoNT)用於治療下 泌尿道症狀(LUTS)的描述，下列何者錯誤？","options":{"A":"BoNT 總共有 7 種 subtypes，其中 subtype A(BoNTA)有最長的作用時間","B":"BoNTA 包括 onabotulinumtoxinA (onabotA)、 abobotulinumtoxinA (abobotA)、 incobotulinumtoxinA (incobotA)等不同廠牌的 藥品，最大差異在於包覆 BoNTA 的 proteins 不 同，導致每單位(U)的藥物效力也不同","C":"針對 LUTS 治療，不同廠牌的 BoNTA 之間每單位(U) 的藥物治療效力會有差異，目前已經有 clinical dose conversion studies 提供完整的換算公 式，大致上相同單位 onabotA 治療效力約為 abobotA 三倍","D":"目前已經有許多 RCT 證實 onabotA 針對 neurogenic detrusor overacrtivity(NDO)或是 idiopathic detrusor overactivity(IDO)都有臨 床效益","E":"根據一篇 2022 年 8 月發表在 European Urology 的期刊，結合了兩個 phase 3 RCT(CONTENT1、 CONTENT2)，收錄 neurogenic detrusor overactivity incontinence(NDOI)已經自我單 導且口服藥物治療效果不佳的病人，比較使用逼 尿肌注射 anabotA 600 或 800U 和 placebo 的治療 效果，發現在注射後第 2、6、12 週，anabotA 組 別發生 NDOI 的機會都比 placebo 組別顯著減少， 甚至有三分之一 anabotA 組別的病人在注射後 6 週內都沒有發生 NDOI"},"answer":"C","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12ed, Chapter 120, page 2707-2709 Eur Urol. 2022 Aug;82(2):223-232. 詳解： (C)不同廠牌的 BoNTA 每單位 治療效力目前並沒有完整的 clinical dose conversion studies 能夠提供完整的換算 公式。","sourcePage":244},{"id":"6-103","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":103,"question":"泌尿道廔管之描述及處理原則，何者錯誤？","options":{"A":"基本原則包括確保營養充足、移除感染、去除泌 尿道阻塞、排除惡性腫瘤","B":"膀胱陰道廔管(vesicovaginal fistula)為最常 見之後天泌尿道廔管","C":"若廔管有涉及外來物或是人工合成材料，應盡可 能移除","D":"經陰道之膀胱陰道廔管修補適應症包括非複雜性 廔管、低位廔管、放射治療後廔管","E":"經腹部之膀胱陰道廔管修補不會造成陰道長度縮 短"},"answer":"D","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12ed, Chapter 129 詳解： (A) P.2925 (B) P.2924 (C) P.2925 (D) P.2933, radiation fistula 應做 abdominal repair (E) P.2933","sourcePage":245},{"id":"6-104","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":104,"question":"關於 artificial urinary sphincter and sling (AUS) 術後併發症處置敘述何者為非？","options":{"A":"術後發生 urinary retention，在已確認 cuff 為 deactivation 狀態並已經置放 Foley catheter 48 小時後，病人嘗試自行解尿如果仍失敗，建議 置放 suprapubic cystostomy 以減少 urethra erosion 之機會","B":"在 AUS reimplantation 病人術後 delayed activation AUS 無法減少 urethra erosion risk","C":"術後發生 urethra erosion 之 risk factor 包括 之前做過 radiotherapy、coronary artery disease、diabetes、hypertension 以及尿管置 放","D":"術後若發生 urethral atrophy 治療方式包括降低 cuff size、調整 cuff 位置、以及 transcorporal placement","E":"術後發生 infection 常見病原菌為 Staphylococcus epidermidis 或 Staphylococcus aureus"},"answer":"B","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12ed, Chapter 131, page 2999-3009 詳解： (A) page 3005 (B) page 3006，delayed activation AUS 可以減少 erosion 機會 (C) page 3006-3007 (D) page 3007 (E) page 3005","sourcePage":246},{"id":"6-105","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":105,"question":"有關人體維持 urinary continence 機轉當中，膀胱在 儲尿時能為持 low pressure reservoir 避免尿液流出 的原因以下何者正確？","options":{"A":"神經調控會經由 hypogastric nerve 抑制副交感 神經，並經由 pelvic nerve 興奮交感神經來促進 detrusor muscle 放鬆","B":"膀胱的 posterior wall 位於 intraperitoneal position 而獲得更多擴張空間","C":"多層 mucosal layer 使膀胱能夠在儲尿期擴張、 排尿期收縮","D":"膀胱壁內的 extracellular matrix 當中，主要為 collagen type II 使膀胱能夠維持彈性","E":"Detrusor smooth muscle cells 之間有良好連接 以避免 unplanned spontaneous smooth muscle contraction"},"answer":"C","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12ed, Chapter 115, page 2593 (Key points) 詳解： (A) 副交感為 pelvic nerve，交感為 hypogastric nerve。 (B) dome 才是位於 intraperitoneal position。 (C) 正確 (D) 應該 collagen type I。 (E) detrusor smooth muscle cells 之間應為 poor coupling 才能避免 unplanned spontaneous smooth muscle contraction。","sourcePage":246},{"id":"6-106","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":106,"question":"關於膀胱陰道瘻管(Vesicovaginal fistula)下列何 者錯誤?","options":{"A":"因電療導致的膀胱陰道瘻管的治療處裡最複雜","B":"使用組織皮瓣(tissue flap)來輔助治療膀胱陰 道瘻管是最好的方法","C":"如果有骨盆腔癌症病史應該在治療膀胱陰道瘻管 前就要做組織切片","D":"如果確定有膀胱陰道瘻管，上泌尿道影像要查一 下以排除輸尿管有無損傷","E":"電療導致的膀胱陰道瘻管的確切手術或分流治療 建議等 6 到 12 個月"},"answer":"B","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： 第 12 版 Campbell Urology Ch129; P2942","sourcePage":247},{"id":"6-107","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":107,"question":"夜尿症(Nocturia)影響睡眠潛伏期和睡眠效率。睡眠 潛伏期定義為從完全清醒到完全入睡所需的時間，睡 眠效率定義為實際睡眠時間除以預期睡眠總時間（以 分鐘計）： 正常被認為大於多少？","options":{"A":"75%","B":"80%","C":"85%","D":"90%","E":"95%"},"answer":"C","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)：第 12 版 Campbell Urology Ch119; P2664-5","sourcePage":247},{"id":"6-108","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":108,"question":"上 列為一病患之骨盆臟器脫垂量化分期法(POP-Q)，請解 讀並選出以下敘述何者為錯誤?","options":{"A":"Aa 及 Ap 均是基準點只能介於+3 及-3 之間","B":"此案例為膀胱脫垂 (cystocele)","C":"陰道總長度為 6 公分，陰道袖口(vaginal cuff) 降下兩公分","D":"此病患已經過接受子宮摘除術","E":"外尿道口中線至處女膜後環中線距離為 4.5 公分"},"answer":"C","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)：第 12 版 Campbell Urology Ch112; P2530","sourcePage":247},{"id":"6-109","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":109,"question":"關於脛神經刺激（tibial nerve stimulation)治療膀 胱過動，下列何者為非?","options":{"A":"有經皮（Transcutaneou）與穿皮（percutaneou） 脛神經刺激兩種。穿皮脛神經刺激效果比較好","B":"穿皮脛神經刺激達到效果時，患者大腳指會伸展 （extention）","C":"建議療程每週一次，持續 12 周，接下來每個月一 次。","D":"穿皮脛神經刺激也適用於兒童膀胱過動症患者","E":"穿皮脛神經刺激進針的位置近乎中醫針灸的三陰 焦（SanYin Jiao）"},"answer":"B","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh Urology, 12th ed Ch122 p 2748","sourcePage":248},{"id":"6-110","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":110,"question":"下列有關陰道脫垂之前方部位缺陷(anterior compartment)敘述何者為非?","options":{"A":"容易造成膀胱尿道脫垂，甚至尿失禁","B":"缺陷分為中央（central)的、側面(lateral)或結 合型。中央（central）缺陷源於恥骨子宮頸筋膜 （pubocervical fascia） 從 ATFP(骨盆弓型筋 膜 arcus tendinous fascia pelvis) 上脫離。","C":"大多數 anterior compartment 缺陷都伴隨著側面 和/或頂部（apical）缺陷","D":"當患者同時有 anterior compartment and apical prolapse，需要同時針對每個缺陷進行修復","E":"修復手術加入生物學(biologic)和合成 (synthetic)植入物(graft)可改善解剖學上結 果，然而可能會發生植入物相關併發症"},"answer":"B","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh Urology, 12th ed Ch 124 p 2790","sourcePage":248},{"id":"6-111","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":111,"question":"根據英國 21 家醫院大規模臨床研究，比較單一切口迷 你吊帶（single-incision mini-slings ）與標準尿 道中段吊帶手術(standard midurethral sling)用於 治療婦女應力性尿失禁 36 個月的追蹤結果，下列何者 為非?","options":{"A":"術後發生腹股溝或大腿疼痛比例兩者相近","B":"成功率兩種手術相近","C":"術後發生網膜暴露(mesh exposure) 比例兩者相 近","D":"術後生活品質兩者相近","E":"術後發生性交疼痛（dyspareunia）的比例兩者相 近"},"answer":"E","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： 1. N Engl J Med 2. 2022 3. 386; 4. 1230-1243","sourcePage":248},{"id":"6-112","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":112,"question":"Midurethral slings (MUS)為婦女 stress urinary incontinence (SUI)保守治療失敗後的標準手術治療 選擇之一，現今市面上許多種各式各樣不同的 MUS 可 以選擇，有一英國團隊進行了一個 noninferiority randomized trial 來比較 single-incision mini-slings (SIMS)和 standard midurethral slings (SMUS)的 outcomes，並在 2022 年 3 月發表於 NEJM。 根據這篇期刊，有關 SIMS 和 SMUS 的描述，下列何者 錯誤？","options":{"A":"術後之 patient-reported success rate 不論在 第 15 或第 36 個月的，SIMS 的效果不會比 SMUS 差","B":"接受 SIMS 手術的病人，術後發生性交疼痛 (dyspareunia)之比例和接受 SMUS 手術的病人相 當","C":"兩者術後 quality of life 以及 sexual function outcomes 相似","D":"兩者之間 postoperative serious adverse events rate 沒有差異","E":"兩者在 36 個月追蹤期間之內需要再次進行 SUI 相關手術的比例相當"},"answer":"B","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Abdel-Fattah M, Cooper D, Davidson T, Kilonzo M, Hossain M, Boyers D, Bhal K, Wardle J, N'Dow J, MacLennan G, Norrie J. Single-Incision Mini-Slings for Stress Urinary Incontinence in Women. N Engl J Med. 2022 Mar 31;386(13):1230-1243 詳解： (B)接受 SIMS 的病人在術後第 15 和 36 個月都會有比較高比 例發生 dyspareunia。","sourcePage":249},{"id":"6-113","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":113,"question":"關於骨盆腔器官脫垂之描述，何者正確？","options":{"A":"在女性，骨盆腔器官脫垂(POP)和尿失禁之共同危 險因子包括老年、經陰道生產、肥胖、種族、子 宮切除、抽菸","B":"POPQ 系統中，一女性 tvl= 8cm，若完全無器官脫 垂則 Ba= -8cm, Bp= -8cm","C":"大部分 anterior compartment 脫垂為單獨存在， 單靠 anterior colporrhaphy 即可矯正","D":"Apical compartment 脫垂之矯正可經陰道、經腹 腔或微創手術進行，子宮也可選擇保留或摘除","E":"Posterior compartment 手術中使用人工網膜不 會造成術後性交疼痛"},"answer":"D","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12ed, Chapter 115, 124 詳解： (A) P.2586&2591, 後面兩項 不是。 (B) P.2588, 無脫垂則 Ba, Bp = -3cm。 (C) P.2779, 通常合併 lateral defect, 需 combine paravaginal repair or lateral anchoring (D) P.2790 (E) P.2829, 會造成性交疼痛 及 mesh 外露","sourcePage":249},{"id":"6-114","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":114,"question":"關於 Female Urethral Diverticulum 的以下敘述何者 正確？","options":{"A":"Urethral Diverticulum 的開口在膀胱鏡檢查下 通常靠近尿道近端且在 12 點鐘方向","B":"只有約 1 成 Urethral Diverticulum 的病人做 UDS 會發現 SUI (stress urine incontinence)","C":"做完 urethral diverticulectomy 有部分病人會 產生 denovo SUI (stress urine incontinence)， risk factor 包括 diverticulum 大小>30mm, diverticulum 靠近近端尿道","D":"有 Urethral Diverticulum 同時合併 SUI (stress urine incontinence)病人若同時進行 anti-incontinence 手術可使用 mesh 來做懸吊手 術","E":"在進行 urethral diverticulectomy 時手術原則 包括將 diverticulum 的 periurethral fascia 與 diverticulum 切除以避免復發"},"answer":"C","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12ed, Chapter 130, P.2982-2992 詳解： (A) P.2982, The UD ostium is most often located posterolaterally at the 4 and 8 o’clock positions at level of the mid-urethra (B) P.2982, up to 50% of women with UD demonstrate SUI on urodynamic evaluation (C) P.2988, Risk factors for denovo SUI may include the size of the diverticulum (>30 mm), more proximal location (D) P.2988, Synthetic materials (e.g., mid-urethral polypropylene mesh) should not be used in an anti-incontinence procedure synchronously with UD surgery because of the potentially increased risk of urethral erosion and infection (E) P.2989, Care is taken to preserve the periurethral fascia and avoid inadvertent entry into the UD.","sourcePage":250},{"id":"6-115","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":115,"question":"關於泌尿道神經生理學之敘述，何者錯誤？","options":{"A":"急性 cerebrovascular accident 病人在 cerebral shock 時期，會出現 detrusor areflexia，日後則常轉變成 detrusor overactivity 甚至 urge urinary incontinence","B":"兒童與成人的 cerebral palsy 患者若無其他神經 病灶，大多可以正常儲尿及排尿","C":"Multiple Sclerosis 患者大多 intact sensation, 但 併有 detrusor underactivity 及 sphincter dyssynergia","D":"Sacral spinal cord injury 患者最初會出現 high or normal compliance，日後漸轉為 decreased compliance","E":"Diabetic cystopathy 最常見的 urodynamic finding 為 detrusor overactivity"},"answer":"C","reference":"(112) /6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12ed, Chapter 116, P2602-2623 詳解： (C) DO not DU, 且 smooth sphincter is synergic.","sourcePage":251},{"id":"6-116","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":116,"question":"關於膀胱過動(OAB)的治療，何者正確?","options":{"A":"減少 10%的水分攝取，可以有意義地減少膀胱過 動的臨床症狀","B":"嚴重肥胖的病患可以考慮減重手術，因為每減少 5%的體重可降低約 15-20%尿失禁的風險","C":"優先使用延長釋放劑型(Extended release formulations)而非短效型(short acting formulations)的抗膽鹼藥物(Antimuscarinic agents)最主要的原因是病人有較低發生便秘的 機會","D":"在藥物治療效果差的膀胱過動病人 (medication-refractory OAB)，使用脛神經刺激 (Tibial nerve stimulation)約有六到八成的病 患會有明顯的臨床反應","E":"注射肉毒桿菌來治療膀胱過動可以減少約六成頻 尿及三成整天失禁的機會"},"answer":"D","reference":"(112)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell urology 12th p2646-2647 詳解： A 選項錯誤 (Page 2647 )，減 少 25%的水分攝取，可以有意 義地減少膀胱過動的臨床症 狀 B 選項錯誤 (Page 2647 )，每 減少 5%的體重可降低約 7-8% 尿失禁的風險 C 選項錯誤 (Page 2647 )，主 要的原因是病人有較低發生 口乾的機會 E 選項錯誤 (Page 2647 )，注 射肉毒桿菌來治療膀胱過動 可以減少約三成(29%)頻尿及 六成(59%)整天失禁的機會","sourcePage":251},{"id":"6-117","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":117,"question":"關於逼尿肌收縮力低下(Detrusor underactivity) 的敘述，何者錯誤?","options":{"A":"逼尿肌收縮力低下的發生率在 70 歲男性的發生 率約為五成","B":"糖尿病主要藉由肌源性及神經性的合併影響導致 逼尿肌功能受損","C":"Watts factor(WF)可以用來計算膀胱收縮強度， 並不太受膀胱出口阻塞(BOO)的影響","D":"Prostanoids 類的藥物中，PGF2α, PGE1 及 PGE2 皆可以提升逼尿肌的收縮，並且 PGE1α 及 PGE2 可以促進尿道放鬆","E":"膀胱內電治療(intravesical electrotherapy, IVE)主要是刺激膀胱內的髓鞘 Aβ 神經元，進一 步產生中樞反射而誘導逼尿肌收縮"},"answer":"E","reference":"(112)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell urology 12th p2650-2663 詳解： E 選項錯誤 (Page 2661)，膀 胱內電治療(intravesical electrotherapy, IVE)主要是 刺激膀胱內的髓鞘 Aδ 神經 元，","sourcePage":251},{"id":"6-118","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":118,"question":"請問根據 Stamey Incontinence Grading System，病 患從床上坐起時漏尿，屬於 Grade 幾?","options":{"A":"Grade 0","B":"Grade 1","C":"Grade 2","D":"Grade 3","E":"Grade 4"},"answer":"C","reference":"(112)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell urology 12th p2893 p.2893 Table 127.2","sourcePage":252},{"id":"6-119","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":119,"question":"根據 Waaldijk classification，ureterovaginal fistulae 屬於 Type 幾的 fistulae?","options":{"A":"Type I","B":"Type IIa","C":"Type IIb","D":"Type III","E":"Type IV"},"answer":"D","reference":"(112)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell urology 12th p2930","sourcePage":252},{"id":"6-120","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":120,"question":"現有證據及文獻回顧中，以下哪一種治療攝護腺肥大 （Benign Prostatic Hyperplasia, BPH）的方法在改 善國際前列腺症狀評分（IPSS）和膀胱出口阻塞指數 （BOOI）方面表現最佳？","options":{"A":"經尿道前列腺切除術 (Transurethral Resection of the Prostate, TURP)","B":"綠光雷射汽化術 (Photoselective Vaporization of the Prostate, PVP)","C":"攝護腺雷射剜除術 (Holmium Laser Enucleation of the Prostate, HoLEP)","D":"微創手術治療 (Minimally Invasive Surgical Therapies, MIST)","E":"藥物治療 (Medication Therapy)"},"answer":"C","reference":"(113) Massimiliano Creta, Giorgio I. Russo, Naeem Bhojani et al., Bladder Outlet Obstruction Relief and Symptom Improvement Following Medical and Surgical Therapies for Lower Urinary Tract Symptoms Suggestive of Benign Prostatic Hyperplasia: A Systematic Review, Eur Urol (2024), https://doi.org/10.1016/j.eururo. 2024.04.031","sourcePage":252},{"id":"6-121","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":121,"question":"下列關於泌尿道廔管的敘述，何者有誤?","options":{"A":"服用抗膽鹼藥物(anticholinergic drug)合併導 尿管放置 2 至 6 週為 Vesicovaginal fistula 的 保守性治療","B":"最常造成 vesicoenteric fistula 的原因為憩室 炎，患者會有的症狀包含尿中有空氣 (pneumaturia)、尿中帶有糞便(fecaluria)及恥 骨上疼痛，亦稱為 Gouverneur's syndrome","C":"執行 Vesicovaginal fistula 手術時，經陰道修 補比經腹部修補有較低的敗血症風險，因此建議 經陰道修補，以減少併發症","D":"延遲數個月才執行 Vesicovaginal fistula 修補 手術的優點是可以清楚辨認缺血組織的邊界","E":"經陰道修補 Vesicovaginal fistula，可以使用 Martius fat pad 及 peritoneal flap 來修補"},"answer":"B","reference":"(113) (B)Gouverneur's syndrome: suprapubic pain, urinary frequency, pain on urination, and tenesmus. 1. Campbell, 2. 第 12 版, 2021 3. Chapter 129. 4. (A)(C)(D)(E)p2931-293 3, (B)p2953","sourcePage":253},{"id":"6-122","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":122,"question":"下列關於電刺激(electrical stimulation)治療下泌 尿道症狀(lower urinary tract dysfunction)的敘述 何者錯誤？","options":{"A":"理論上，幾乎所有參與下泌尿道神經支配的神經 都是電刺激治療可以作用的對象","B":"薦前神經根刺激(sacral anterior root stimulator, SARS)是一項非常有效的治療，可以 有效改善生活品質。","C":"在周邊神經的調節中(peripheral types of neuromodulation)，經皮脛神經電刺激 (percutaneous tibial nerve stimulation, PTNS)有好的開發及測試，目前已獲 FDA 核准","D":"薦椎神經刺激(sacral nerve stimulation, SNM) 是可以使用在不明原因之膀胱功能障礙 (idiopathic bladder dysfunction)的選項","E":"薦椎神經刺激(sacral nerve stimulation, SNM) 目前已獲 FDA 核准可以廣泛使用在膀胱或骨盆腔 疼痛(bladder or pelvic pain syndrome)"},"answer":"E","reference":"(113) Campbell Urology, 12th ed Chapter 122 Page 2739-2755 Ans: SNM does have FDA approval for idiopathic OAB and non-obstructive underactive bladder but not for bladder or pelvic pain syndrome and neurogenic bladder.","sourcePage":253},{"id":"6-123","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":123,"question":"下列關於女性尿道憩室(urethral diverticula, UD) 的敘述何者錯誤?","options":{"A":"尿道憩室臨床表現的“three Ds”為 dysuria、 dyspareunia、dribbling","B":"大多數 UD 位於尿道中部和近端腹側，相當於陰道 口內 1 至 3 公分的陰道前壁區域","C":"高達 50%的 UD 女性在尿動力學評估中表現出應力 性尿失禁","D":"大約 10%至 20%的 UD 患者可能完全無症狀，是透 過影像學或身體檢查意外發現","E":"經陰道尿道憩室切除術(transvaginal urethral diverticulectomy)常見的的併發症有復發性泌 尿道感染、尿失禁和尿道陰道瘻管 (F)"},"answer":"E","reference":"(113)/ 參考資料(摘錄自)： Campbell-Walsh-Wein Urology , 12th edition,ch130 p.2975-2992 (E)罕見尿道陰道廔管","sourcePage":254},{"id":"6-124","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":124,"question":"以下關於排尿障礙的描述何者有誤？","options":{"A":"男性患者如果 bladder outlet obstruction index (BOOI) ≥ 40，則被認為是有膀胱出口阻 塞；如果 BOOI ≤ 20，則被認為是無阻塞的","B":"可透過 bladder contractility index (BCI)或 者 Watts factor (WF)來評估膀胱的收縮功能","C":"BCI = PdetQmax + 5 × Qmax","D":"通常用 PdetQmax − 2.2 × Qmax 來計算女性的 BOOI","E":"女性的膀胱出口阻塞無法用 The International Continence Society (ICS) nomogram 或男性 BOOI 來定義，因為這些方法會嚴重高估女性的膀胱出 口阻塞"},"answer":"E","reference":"(113)/ Campbell 12ed, chapter 114, p.2566, 2567","sourcePage":254},{"id":"6-125","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":125,"question":"關於前腦(Forebrain)控制排尿的 Working model，下 列何者錯誤？","options":{"A":"腦幹開關(Brainstem switch)由中腦導水管周圍 灰質(Periaqueductal gray matter, PAG)以及橋 腦排尿中心(Pontine micturition center, PMC) 組成","B":"PMC 是膀胱控制中最後的傳出神經核(Final efferent brain nucleus)","C":"Glutamate 是 PMC 中主要的神經傳遞物質，可使 膀胱放鬆","D":"PAG 可接收來自前腦的投射纖維 (Projections)，包含內側前額葉皮質(Medial prefrontal cortex, mPFC)","E":"若 mPFC 至 PAG 路徑中的白質損傷，將導致尿失禁"},"answer":"C","reference":"(113) (C) Glutamate 是促進膀胱收 縮 1. Campbell 2. 第 12 版、2021 3. Chapter 110 4. P2495, 2497-2498","sourcePage":254},{"id":"6-126","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":126,"question":"下列敘述何者錯誤？","options":{"A":"關於婦女的 stress urinary incontinence， Hammock hypothesis 是指腹壓增加時，尿道的 posterior musculofascial fascial 和 ligament 能支持尿道，並有助於維持尿液控制","B":"關於婦女的 stress urinary incontinence， integral theory 是指最大尿液控制區域位於中 段尿道，即 pubourethral ligament","C":"Levator ani 肌肉群包含有 pubourethral ligament、pubococcygeus、puborectalis 和 iliococcygeus 等肌肉","D":"相較於自然產的婦女，接受剖腹產的婦女較不會 有 stress urinary incontinence 的情形","E":"約 13%的女性 urinary incontinence 患者在切除 子宮後症狀改善"},"answer":"C","reference":"(113)解題說明 1. 12th Campbell 2. Part XIII 3. P.2597 Levator ani 不包含 pubourethral ligamenet。","sourcePage":255},{"id":"6-127","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":127,"question":"下列有關膀胱憩室(bladder diverticulum)的敘述何 者錯誤？","options":{"A":"膀胱憩室由於不含固有功能性肌肉層(defined functional muscularis propria layer)，因此 較大的憩室會造成排尿不良(empty poor with micturition)","B":"在成人中，膀胱憩室通常和膀胱出口阻塞 (bladder outlet obstruction)有關，和神經性 膀胱尿道障礙(neurogenic vesicourethral dysfunction)無關","C":"膀胱憩室被發現的位置常常在輸尿管旁 (paraureteric location)","D":"膀胱憩室的患者應仔細評估並考慮同時處理膀胱 出口阻塞(bladder outlet obstruction)","E":"膀胱憩室內若有惡性腫瘤，由於缺乏固有肌肉層 (defined muscularis propria)，應特別注意早 期膀胱外擴散(extravesical disease extension)的可能性"},"answer":"B","reference":"(113)Campbell Urology, 12th ed Chapter 130 Page 2964-2972 Ans: In the adult, bladder diverticula are often associated with bladder outlet obstruction or neurogenic vesicourethral dysfunction.","sourcePage":255},{"id":"6-128","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":128,"question":"關於脊髓損傷（SCI）後脊髓休克（Spinal Shock）期 間的排尿功能障礙，下列哪一項是錯誤的？","options":{"A":"脊髓休克期間，膀胱通常呈現無收縮 （Acontractile）和無反射（Areflexic）的狀態， 且在影像學上顯示膀胱輪廓平滑，無小梁形成 （Trabeculation）","B":"在脊髓休克期間，膀胱頸通常是閉合且具有功能 性的，除非患者在此之前接受過相關手術或經歷 了潛在的胸腰椎損傷，導致交感神經受損","C":"脊髓休克期間，逼尿肌（Detrusor）無法進行正 常收縮，患者需要通過導尿來管理尿液排出","D":"在脊髓休克期間，外括約肌（External sphincter）區域的最大尿道閉合壓力（Maximum urethral closure pressure）降低，且正常的防 禦反射（Guarding reflex）缺失，無法自我控制 排尿","E":"脊髓休克期間，因為膀胱逼尿肌無力且括約肌張 力(sphincter tone)缺失，尿失禁是常見的，最 常見的為溢流性尿失禁（Overflow incontinence）"},"answer":"E","reference":"(113)參考資料(摘錄自)： 第 12 版 Campbell, chapter 116，第 2610 頁。","sourcePage":256},{"id":"6-129","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":129,"question":"關於神經源性無反射膀胱（Neurogenic Areflexic Bladder ）患者使用間歇性導尿 （Intermittent Catheterization）以下何者為非?","options":{"A":"膀胱容量充足的患者，每 3-6 小時定期間歇性導 尿對併發症的預防有幫助","B":"如果患者有輸尿管逆流，則該方法為絕對禁忌， 不可以使用","C":"可減少尿失禁","D":"可防止上泌尿道損傷","E":"泌尿道感染很少見，但如果發生，可以給予抗生 素"},"answer":"B","reference":"(113)參考資料(摘錄自)： Smith 18th ch 28 p 453","sourcePage":256},{"id":"6-130","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":130,"question":"下列關於膀胱過動症(overactive bladder, OAB)的敘 述何者錯誤？","options":{"A":"OAB 目前的定義是急尿感(urinary urgency)，通 常伴隨頻尿(frequency)跟夜尿(nocturia)，不一 定會有急迫性尿失禁(urgency urinary incontinence, UUI)","B":"診斷時必須排除泌尿道感染或其他明顯的病理狀 態(other obvious pathology)","C":"OAB 是一個單純的症狀診斷，臨床上常常與逼尿 肌過度活動(detrusor overactivity)交互使用","D":"對於沒有嚴重併發症的患者，不建議一開始就使 用尿路動力學檢查(urodynamics)、膀胱鏡檢查 (cystoscopy)及診斷性腎臟和膀胱超音波 (diagnostic renal and bladder ultrasound)","E":"膀胱出口阻塞(bladder outlet obstruction, BOO)的嚴重程度可能和 OAB 相關，但治療阻塞並 不能保證 OAB 症狀得到緩解"},"answer":"C","reference":"(113)Campbell Urology, 12th ed Chapter 117 Page 2637-2646 Ans: OAB is a symptomatic diagnosis and is distinct from DO, which is an urodynamic observation.","sourcePage":256},{"id":"6-131","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":131,"question":"為了應對腹內壓突然增加，例如咳嗽、大笑或打噴嚏 時，會出現以下反應，下列何者為非?","options":{"A":"體神經儲存反射 somatic storage reflex","B":"骨盆-陰部反射 pelvic-to-pudendal reflex","C":"防護反射 guarding reflex","D":"失禁反射 continence reflex。","E":"快速副交感神經反射 rapid parasympathetic reflex"},"answer":"E","reference":"(113)參考資料(摘錄自)： Smith 18th ch 27 p 431","sourcePage":257},{"id":"6-132","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":132,"question":"下列有關 female urethral diverticula(憩室)的敘 述, 何者的錯誤?","options":{"A":"憩室內上皮可以是泌尿上皮，鱗狀上皮或柱狀上 皮","B":"10%至 20%的尿道憩室患者可能完全沒有症狀，通 常在影像檢查或身體檢查時偶然發現","C":"大多數尿道憩室(urethra diverticula)位於尿 道的中段(middle)和近端(proximal)的背側 (dorsal side)","D":"在進行尿道憩室手術的同時，不應使用 Synthetic materials 作為防止尿失禁的手術材 料，因為這可能增加尿道侵蝕(urethra erosion) 和感染的風險","E":"尿道憩室（UD）內結石並不算少見，約有 4%至 10% 的患者可被診斷出結石"},"answer":"C","reference":"(114)/Campbell-Walsh Urology 12th Edition Chapter 130 P. 2977, 2981, 2988 (C) 位於腹側(ventral side)","sourcePage":257},{"id":"6-133","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":133,"question":"關於膀胱容量小與順應性差之神經性膀胱，下列何種 治療最能有效改善儲尿壓力並保護腎功能？","options":{"A":"Anticholinergics","B":"Intermittent catheterization","C":"Botulinum toxin A injection","D":"Augmentation cystoplasty","E":"β3 agonist"},"answer":"D","reference":"(114)Campbell 12th ed., Ch. 127, pp. 2889–2890","sourcePage":257},{"id":"6-134","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":134,"question":"下列關於男性尿失禁相關原因、檢查與治療何者正 確？","options":{"A":"目前建議尿道填充物注射(bulking agent)比起 人工尿道括約肌（AUS）與吊帶手術，仍為手術治 療首選","B":"具逼尿肌過度活動(detrusor overactivity)並 非尿失禁手術的禁忌症，有需要時仍可考慮後續 的人工括約肌手術","C":"標準的球部人工尿道括約肌（AUS）植入手術，會 將壓迫套環（cuff）套在陰莖海綿體融合處遠端 的尿道海綿體（corpus spongiosum）周圍","D":"球部尿道壓迫套環使用壓力調節球囊 （pressure-regulating balloon）壓力範圍建議 為 40 cmH₂O。其放置方式可經由腹部、陰囊或會 陰途徑進行","E":"植入物感染不需要移除人工括約肌，因為抗生素 治療反應良好"},"answer":"B","reference":"(114)出處: 1. Campbell 2. 第 12 版, 2021 3. (A) Chapter 131, P2998, (B)Chapter 131, p 2997 (C)Chapter 131, p 3005 (D) 壓力範圍建議為 61~70 cmH₂O (E) Chapter 131, p 3006","sourcePage":258},{"id":"6-135","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":135,"question":"下列關於女性尿失禁的風險因子，何者錯誤？","options":{"A":"年齡愈大，尿失禁風險愈高，且從應力性尿失禁 （SUI）逐漸轉變為混合型（MUI）或急迫性尿失 禁（UUI）","B":"單一次陰道分娩就會增加尿失禁（特別是 SUI） 風險","C":"吸菸與尿急、頻尿及尿失禁明確相關，雖然重度 吸菸者風險可能較高，但戒菸後可以改善尿失禁","D":"應力性尿失禁、混合性尿失禁與 BMI 有強烈相 關，透過手術或規律的減重計畫，有望顯著改善 尿失禁","E":"糖尿病與憂鬱症是與尿失禁最常見的兩項醫學共 病 題號 答案 考 題"},"answer":"C","reference":"(114) 1. Campbell 2. 第 12 版、2021 3. Chapter 115 4. P2583, 2586 (C) Urinary urgency and frequency are associated with active smoking, although a link with UI is less clear. Data on the impact of smoking cessation are scant. 年度 類別 參考資料","sourcePage":258},{"id":"7-001","category":"男性學(含生殖)","categoryOrder":7,"number":1,"question":"有關逆行性射精(Retrograde ejaculation)的敘述，下列 何種錯誤？","options":{"A":"影響到膀胱頸(bladder neck)的手術為逆行性射精 常見的病因","B":"糖尿病(Diabetes mellitus)與所造成的自主神經病 變(autonomic neuropathy)為逆行性射精之風險因 子","C":"射精後尿液檢體(Post-ejaculatory urine specimen)中，在高倍率視野(High power field)下 檢驗到大於 5-10 個精蟲為逆行性射精之診斷方法","D":"治療藥物主要以口服 α-adrenergic 藥物為主，例如 pseudoephedrine, ephedrine, midocrine 等","E":"膀胱頸重建(Bladder neck reconstruction)的手術 效果較藥物治療好"},"answer":"E","reference":"（110）/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, 2020, Volume II, Chapter 71, p.1579-1580","sourcePage":259},{"id":"7-002","category":"男性學(含生殖)","categoryOrder":7,"number":2,"question":"在精液量正常的逆行性射精病患中，射精後尿液中的精子 數至少達下列何標準，可以做為逆行性射精診斷的依據﹖","options":{"A":"1-2 精子 / high power field (HPF)","B":"3-4 精子/ HPF","C":"5-10 精子/ HPF","D":"11-15 精子/ HPF","E":"16-20 精子/ HPF"},"answer":"C","reference":"（110）/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1564-1581","sourcePage":259},{"id":"7-003","category":"男性學(含生殖)","categoryOrder":7,"number":3,"question":"關於醫源性的長時間勃起(超過 4 小時)，下列那一項敘述 最不恰當﹖","options":{"A":"陰莖海綿體內注射 PGE1 造成的長時間勃起(超過 4 小時)，比口服第五型磷酸二酯酶抑制劑造成的多","B":"陰莖海綿體內注射 PGE1 造成的長時間勃起(超過 4 小時)，大多數為非缺血性","C":"注意力不足過動症(Attention Deficit Hyperactivity Disorder, ADHD)的治療藥物： methylphenidate 和 atomoxetine 都有可能造成長時 間勃起(超過 4 小時)","D":"Methylphenidate 造成長時間勃起(超過 4 小時)的病 患年齡中位數為 12 歲半","E":"新生兒輸血有可能造成長時間勃起(超過 4 小時)"},"answer":"B","reference":"（110）/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1539-1563","sourcePage":259},{"id":"7-004","category":"男性學(含生殖)","categoryOrder":7,"number":4,"question":"下列何種情形最可能增加血中性荷爾蒙結合球蛋白 (SHBG)﹖","options":{"A":"肥胖","B":"腎病症候群","C":"接受類固醇治療","D":"糖尿病","E":"甲狀腺機能亢進"},"answer":"E","reference":"（110）/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1428-1452","sourcePage":259},{"id":"7-005","category":"男性學(含生殖)","categoryOrder":7,"number":5,"question":"下列和陰莖勃起功能的解剖構造，下列何者錯誤？","options":{"A":"白膜(Tunica albuginea)在陰莖海綿體為雙層構 造，在尿道海綿體為單層構造","B":"有部分男性主要供應陰莖海綿體的動脈來自 accessory pudendal artery，故在執行根除性攝護 腺切除術時，若能保留該血管，術後能較快恢復陰莖 勃起的功能","C":"陰莖白膜厚度最小的地方位於 ventral groove","D":"總陰莖動脈(common penile artery)的分支包括 perineal、bulbourethral、carvenous artery","E":"海綿體的靜脈引流(venous drainage)，起始自 subtunical venules，形成白膜下靜脈叢 (subtunical venous plexus)"},"answer":"D","reference":"（110）/7.男性學(含生 殖)/參考資料(摘錄自)： 第 11 版 Campbell Ch. 26","sourcePage":260},{"id":"7-006","category":"男性學(含生殖)","categoryOrder":7,"number":6,"question":"48 歲的王先生是一個高血壓患者，他到門診想詢問以下 的高血壓用藥中何者可能會造成男性的勃起功能障礙(1) Doxazosin(2) Furosemide (3) Propranolol (4) Captopril (5)Clonidine(6) Valsartan？","options":{"A":"(2)+(4)+(6)","B":"(2)+(3)+(4)+(6)","C":"(1)+(3)","D":"(2)+(4)+(5)+(6)","E":"(2)+(3)+(5)"},"answer":"E","reference":"（110）/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell 第 12 版 p.1507","sourcePage":260},{"id":"7-007","category":"男性學(含生殖)","categoryOrder":7,"number":7,"question":"臨床上男性不孕症造成的原因有很多，根據統計，最多的 診 斷 是 idiopathic male infertility ， 其 次 是 varicocele 及 obsturction，請問以下哪種情況出現的機 率最少?","options":{"A":"immunologic","B":"Cryptorchidism","C":"Drug or radiation","D":"Infection","E":"Cancer"},"answer":"D","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell 12th edition, ch66, p1429, table 66.1","sourcePage":260},{"id":"7-008","category":"男性學(含生殖)","categoryOrder":7,"number":8,"question":"有關陰莖海綿體平滑肌的敘述，下列何者錯誤？","options":{"A":"和勃起功能相關的離子通道為鈣及鉀離子通道","B":"海綿體內平滑肌鬆弛為陰莖膨脹的關鍵","C":"調節勃起的主要神經傳導物質為一氧化氮","D":"除一氧化氮外，前列腺素 E1 亦能藉由活化 guanylyl cyclase 讓 cGMP 濃度上升，造成陰莖勃起","E":"勃起後”消退(detumescence)” 的機制和 Phosphodiesterase type 5 有關"},"answer":"D","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： 第 11 版 Campbell Ch. 26","sourcePage":260},{"id":"7-009","category":"男性學(含生殖)","categoryOrder":7,"number":9,"question":"一位患有鐮狀細胞疾病(sickle cell disease)的青少年 出現勃起時間超過六小時。陰莖海綿體血液氣體分析如 下：PO2 30mmHg, PCO2 60mmHg, PH7.25。下列敘述何者 錯誤？","options":{"A":"為缺血性勃起持久症(ischemic priapism)","B":"第一步治療為 intra-cavernous aspiration","C":"若考慮海綿體內腎上腺素藥物注射，首選為 Phenylephrine，主因為其 β1-selective activity","D":"若執行彩色都卜勒超音波，看到特徵為 cavernous artery inflow 減少或消失","E":"若超過 72 小時沒回復可能會永久失去勃起功能"},"answer":"C","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)：第 11 版 Campbell Ch. 28","sourcePage":261},{"id":"7-010","category":"男性學(含生殖)","categoryOrder":7,"number":10,"question":"下列疾病何者非睪固酮補充治療的禁忌症？","options":{"A":"Breast cancer","B":"Gynecomastia","C":"Angina pectoris","D":"Heart failure","E":"Polycythemia"},"answer":"C","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)：第 11 版 Campbell Ch. 23","sourcePage":261},{"id":"7-011","category":"男性學(含生殖)","categoryOrder":7,"number":11,"question":"下列有關射精的敘述，何者錯誤？","options":{"A":"射精的過程包括遺精(emission)，射出(ejection) 及高潮(orgasm)","B":"遺精(emission)受位於 T10-L2 的交感神經及副交感 神經協同控制","C":"射出(ejection)由位於 S2-S4 的 somatic nerve 調控","D":"射出(ejection)為非自主控制的副交感神經脊髓反 射控制","E":"膀胱頸關閉(closure of bladder neck)及球海綿體 肌(bulbocavernosus)與坐骨海綿體肌 (ischiocavernosus)節奏性的收縮及關閉內括約肌 以防止逆行性射精"},"answer":"D","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.71, P1564","sourcePage":261},{"id":"7-012","category":"男性學(含生殖)","categoryOrder":7,"number":12,"question":"陰莖異常勃起(priapism)之病人在接受兩次海綿體內抽 吸/沖洗(intracavernous aspiration/irrigation)及 phenylephrine 注射後，陰莖仍舊腫脹，海綿體血氧分析 顯示 P 40mmHg; P 50mmHg; pH 7.35，請問下一步治療 O2 CO2 為？","options":{"A":"觀察","B":"口服交感神經刺激劑(Sympathomimetic)","C":"重複海綿體內抽吸/沖洗","D":"遠端血液分流手術(distal surgical shunt)","E":"近端血液分流手術(proximal surgical shunt)"},"answer":"A","reference":"(110)/7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.70, P1549","sourcePage":262},{"id":"7-013","category":"男性學(含生殖)","categoryOrder":7,"number":13,"question":"下列敘述，何者正確？","options":{"A":"陰囊溫度與中心體溫相差至少 5℃","B":"以口水當潤滑劑並不影響精子功能","C":"想要嘗試懷孕的夫妻，在排卵期只需每天嘗試性交一 次即可","D":"性荷爾蒙結合球蛋白(sex hormone-binding globulin, SHBG)隨年齡逐漸減少","E":"使用鴉片類藥物(Opioid)並不影響男性生育能力"},"answer":"C","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.66, P1433","sourcePage":262},{"id":"7-014","category":"男性學(含生殖)","categoryOrder":7,"number":14,"question":"下列有關佩洛尼氏病(Peyronie’s Disease)之敘述，哪 一情況最適合硬塊切開再植皮手術(plaque incision and grafting, PIG)？","options":{"A":"60 度嚴重腹側彎曲(ventral curvature)","B":"30 度彎曲使用 PDE5 inhibitors 後陰莖硬度仍然不 理想","C":"70 度彎曲合併鉸鏈狀(hinge)變形","D":"發病五個月後達 90 度彎曲","E":"30 度背側彎曲(dorsal curvature)且病人希望手術 增長陰莖"},"answer":"C","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.73, P1621","sourcePage":262},{"id":"7-015","category":"男性學(含生殖)","categoryOrder":7,"number":15,"question":"門診時的性衛教可以幫助病人，下列哪一位病患最能從藥 物或精神治療中得到幫助?","options":{"A":"24 歲女性無法從陰道性交高潮，但陰蒂刺激可以","B":"56 歲女性主訴陰道乾澀，使用潤滑劑後大幅改善狀 況","C":"35 歲女性性慾降低並感到困擾","D":"以上皆是","E":"以上皆非"},"answer":"C","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell-Walsh-Wein Urology: 12 Edition, ch.74, P1643","sourcePage":262},{"id":"7-016","category":"男性學(含生殖)","categoryOrder":7,"number":16,"question":"以下關於 Varicocele 及 Varicocelectomy 的敘述何者正 確?","options":{"A":"Varicocele 佔男性不孕症的原因約 4-6 成","B":"Varicocele 造成男性不孕的可能機轉中包含 DNA fragmentation, hypoxia 和 toxin 的累積","C":"在 Varicoclectomy 的手術選擇中 failure rate 最低 的是 microscopic inguinal 或 laparoscopic approach","D":"在 Varicoclectomy 的手術選擇中 subinguinal approach 適合用於青春期前的孩童","E":"在 Varococeletomy 最常見的併發症是出血"},"answer":"B","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell 第 12 版 p.1429,1450,1476,1482","sourcePage":263},{"id":"7-017","category":"男性學(含生殖)","categoryOrder":7,"number":17,"question":"下列關於 PDE5 inhibitor 的敘述何者正確?","options":{"A":"Tadalafil 的 bioavailability 優於其他 PDE5 inhibitor","B":"Sildenafil 的吸收不受 Fatty food 的影響","C":"所有 PDE5 inhibitor 都可能有頭痛、視力模糊、消 化不良和面潮紅的副作用","D":"Vardenafil 比起其他 PDE5 inhibitor 最需小心和抗 心律不整藥併用","E":"並非所有 PDE5 inhibitor 都不宜和 Nitrates 併用"},"answer":"D","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell 第 12 版 p.1532","sourcePage":263},{"id":"7-018","category":"男性學(含生殖)","categoryOrder":7,"number":18,"question":"下列關於神經性疾病與性功能障礙的敘述何者不正確?","options":{"A":"在脊髓損傷的病人，我們可以考慮以 Vibratory stimulation 或是 Electroejaculation 的方式取 精，唯 Vibratory stimulation 有較高的風險造成 autonomic dysreflexia 的情形產生","B":"從脊髓損傷的病人所收集的精液品質常常較差，會有 精蟲數下降及活動力下降的情形","C":"在完全 upper motor neuron 損傷的病人大部分具有 reflexogenic erection 和 psychogenic erection 的能力，但較無法有 ejaculation 的能力","D":"在不完全 lower motor neuron 損傷的病人往往無法 具有 reflexogenic erection 的能力，但仍然能保有 ejaculation 的能力","E":"在不完全 upper motor neuron 損傷的病人大部分具 備 reflexogenic erection 的能力，也有機會保有 psychogenic erection 和 ejaculation 的能力"},"answer":"C","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell 第 12 版 p.1576","sourcePage":263},{"id":"7-019","category":"男性學(含生殖)","categoryOrder":7,"number":19,"question":"關於男性生殖系統之發展、生理及解剖之敘述以下何者為 非?","options":{"A":"在男性一生當中有三個分泌 Testosterone 的高峰， 分別是胎兒 12-18 週、出生後 2 個月及 20 歲左右的 時期","B":"Advanced paternal age 可能造成精蟲染色體的突變 進而造成胎兒的先天性疾病，譬如 Lesch-Nyhan syndrome、Hemophilia A 或 Turner syndrome","C":"位於 Y 染色體短臂的 SRY 是決定男性性別很重要的基 因，但即便在 SRY 存在的情況下，DAX1 和 WNT4 基因 的作用仍能將胎兒發展出女性性腺","D":"陰莖的 Tunica albuginea 是成對且雙層的結構(內環 外縱)，主要由 collagen Type I 組成，也含有 collagen Type III 和 elastic fiber","E":"Inhibin 由 Sertoli cell 產生，對於 FSH 的負回饋 有其重要的角色"},"answer":"B","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell 第 12 版 p.1396, 1402, 1392, 1486, 1398","sourcePage":263},{"id":"7-020","category":"男性學(含生殖)","categoryOrder":7,"number":20,"question":"有關缺血性陰莖異常勃起(Ischemic priapism)的治療， 下列何者正確？","options":{"A":"第一線可以考慮先以口服 α-adrenergic 藥物治 療，若失敗再考慮海棉體抽吸減壓(Corporal aspiration and decompression)","B":"海綿體抽吸減壓同時具有診斷與治療的效果，缺血性 陰莖異常勃起常見的血氧分析為 pO2 < 30mmHg, pC02 > 60mmHg, pH < 7.25","C":"若抽吸減壓失敗，則應考慮海綿體藥物注射 (Intracavernous injection)，首選用藥為去氧腎上 腺素(Phenylephrine)等 β-adrenergic 藥物","D":"若藥物治療仍失敗，則應考慮分流(shunt)手術，而 又應先考慮近端分流(proximal shunt)，失敗後再做 遠端分流(distal shunt)","E":"若選擇以人工陰莖植入術(penile implant)治療缺 血性陰莖異常勃起，延遲(delayed)手術比即刻 (immediate)手術來得容易保留陰莖的長度"},"answer":"B","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, 2020, Volume II, Chapter 70, p.1550-1563","sourcePage":264},{"id":"7-021","category":"男性學(含生殖)","categoryOrder":7,"number":21,"question":"有關勃起功能障礙(Erectile dysfunction)的危險因子 (Risk factors)中，下列何者的危險對比值(Odds ratio) 最高？","options":{"A":"糖尿病 (Diabetes mellitus)","B":"高血壓 (Hypertension)","C":"抽菸 (Cigarette smoking)","D":"使用抗憂鬱藥物 (Antidepressant use)","E":"使用抗血壓藥 (Antihypertensive use)"},"answer":"D","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, 2020, Volume II, Chapter 69, p.1515, Table 69.2","sourcePage":264},{"id":"7-022","category":"男性學(含生殖)","categoryOrder":7,"number":22,"question":"下列何者泌尿道疾病與代謝性症候群(Metabolic syndrome)最無相關？","options":{"A":"尿路結石(Urolithiasis)","B":"過動性膀胱(Overactive bladder)","C":"膀胱癌(Bladder cancer)","D":"陰莖癌(Penile cancer)","E":"勃起功能障礙(Erectile dysfunction)"},"answer":"D","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, 2020, Volume II, Chapter 65, p.1420-1422","sourcePage":265},{"id":"7-023","category":"男性學(含生殖)","categoryOrder":7,"number":23,"question":"理學檢查在男性不孕症的診斷中扮演重要的角色，有關男 性不孕症病人的理學檢查，下列何者錯誤？","options":{"A":"庫柯林菲特氏症(Klinefelter syndrome)的理學檢 查特徵包含身高較高、臂展較長、男性女乳症、睪丸 體積較小等","B":"肥胖(Obesity)可以透過賀爾蒙相關與非賀爾蒙相關 的機轉來傷害造精功能，為理學檢查之重點","C":"睪丸長徑小於 3.6cm 或體積小於 30cc 時，應懷疑造 精功能障礙(Spermatogenic impairment)","D":"若陰囊觸診發現單側輸精管缺失，應懷疑為沃爾天管 ((Wolffin duct)發展異常，下一步考慮安排腎臟超 音波","E":"若陰囊觸診發現雙側輸精管缺失，應懷疑為囊腫性纖 維化(Cystic fibrosis)基因突變，下一步考慮安排 基因檢測"},"answer":"C","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, 2020, Volume II, Chapter 66, p.1434-1436","sourcePage":265},{"id":"7-024","category":"男性學(含生殖)","categoryOrder":7,"number":24,"question":"下列關於在體表操作超音波檢查陰莖及周邊結構的敘述 中，那一項最不恰當﹖","options":{"A":"建議使用較高頻率的探頭，以達到最佳解析度","B":"在評估陰莖尿道狹窄時，可於尿道口灌入無菌凝膠， 以幫助評估與診斷","C":"超音波檢查測量陰莖根部 bulbocavernoal muscle 的截面積，與睪固酮有直接的關聯","D":"要評估最近端的陰莖海綿體動脈影像時，探頭最好置 於陰莖根部背部，以取得最佳影像","E":"都卜勒超音波檢查，有助於評估陰莖血管的機能障礙"},"answer":"D","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 68-90","sourcePage":265},{"id":"7-025","category":"男性學(含生殖)","categoryOrder":7,"number":25,"question":"下列何者最無法用來治療遲發性射精﹖","options":{"A":"Avanafil","B":"Bupropion","C":"Cabergoline","D":"Pseudoephedrine","E":"Reboxetine"},"answer":"A","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12th ed., 2021, page 1564-1581","sourcePage":265},{"id":"7-026","category":"男性學(含生殖)","categoryOrder":7,"number":26,"question":"下列疾病或藥物，何者對男性性功能障礙較不會有負面影 響?","options":{"A":"糖尿病","B":"心血管疾病","C":"噻嗪類利尿劑(thiazide diuretics)","D":"血管張力素轉化酶抑制劑(Angiotensin Converting Enzyme Inhibitors，ACEI)","E":"β 受體阻斷劑(beta-blockers)"},"answer":"D","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition p.1502-1507","sourcePage":266},{"id":"7-027","category":"男性學(含生殖)","categoryOrder":7,"number":27,"question":"下列有關陰莖異常勃起(priapism)敘述何者為真？","options":{"A":"缺血性陰莖異常勃起(ischemic priapism)常見的原 因包含鐮刀狀紅血球疾病（sickle cell disease）、 跨坐式傷害（straddle injury）、陰莖海綿體局部注 射治療、惡性腫瘤轉移和抗精神病藥物使用","B":"陰莖海綿體血液氣體分析如下：pO2=40mmHg, pCO2=50mmHg, pH=7.35 可診斷為缺血性陰莖異常勃 起","C":"使用 Alprostadil 海綿體內注射，導致陰莖勃起時 間超過 6 小時的機率約為 1％","D":"非缺血性陰莖異常勃起(non-ischemic priapism)比 缺血性陰莖異常勃起更常見","E":"為減少併發症的發生，在執行陰莖海綿體抽吸時建議 使用小號針頭在陰莖 3 或 9 點鐘方向放血，避免傷害 到神經"},"answer":"C","reference":"(110)/7.男性學(含生 殖)/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition, p.1539-1552","sourcePage":266},{"id":"7-028","category":"男性學(含生殖)","categoryOrder":7,"number":28,"question":"下列有關早洩(premature ejaculation)的敘述何者正 確？","options":{"A":"與 5-HT1a 受體敏感性減退(hyposensitivity of 5-HT1a receptors)和 5-HT2c 受體敏感性增加 (hypersensitivity) 有關","B":"原發性早洩(lifelong PE)比續發性早洩(acquired PE)更為常見","C":"International Society for Sexual Medicine(ISSM) 對於後天性早洩(Acquired premature ejaculation) 的定義，描述其 Intravaginal ejaculatory latency time(IELT)為<3 分鐘","D":"早洩可能與攝護腺炎(prostatitis)或甲狀腺功能低 下(hypothyroidism)有關","E":"Dapoxetine 為長效選擇性血清素再回收抑制劑 (Selective serotonin receptor inhibitors)，其 半衰期為 6 小時"},"answer":"C","reference":"(110)/7.男性學(含生殖)/ 參考資料(摘錄自)： Campbell-Walsh Urology 12th edition, p.1564-1571","sourcePage":266},{"id":"7-029","category":"男性學(含生殖)","categoryOrder":7,"number":29,"question":"針對阻塞性無精症(obstructive azoospermia)中的先天 性輸精管缺陷(congenital absence of the vas 殖 deferens)，下列何者為非？ C","options":{"A":"先天性雙側輸精管缺陷(congenital bilateral 1 absence of vas deferens)可能合併纖維囊腫基因 p CFTR 的 ΔF508 突變","B":"先天性單側輸精管缺陷(congenital unilateral absence of vas deferens)可能合併同側腎臟缺失","C":"可考慮陰囊探查並嘗試副睪輸精管吻合手術 (vaso-epididymostomy)","D":"可考慮用顯微副睪精子抽吸術(microsurgical epididymal sperm aspiration)取精","E":"取精後可考慮用細胞質內單一精蟲顯微注射 (intracytoplasmic Sperm lnjection)進行受孕"},"answer":"C","reference":"(110)/7.男性學(含生 )/參考資料(摘錄自)： ampbell-Walsh Urology 2th edition, p.903 . 1445.e3","sourcePage":267},{"id":"7-030","category":"男性學(含生殖)","categoryOrder":7,"number":30,"question":"血液中睪固酮的生物可利用性會受到性荷爾蒙結合球蛋 殖 白(sex hormone–binding globulin, SHBG)影響。下列 C 哪項疾病不會導致性荷爾蒙結合球蛋白濃度上升? 1","options":{"A":"年紀老化 m","B":"肥胖 l","C":"肝硬化與肝炎 m","D":"甲狀腺功能亢進","E":"人類免疫缺乏病毒疾病"},"answer":"B","reference":"(110)/7.男性學(含生 )/參考資料(摘錄自)： ampbell-Walsh Urology 2th Edition, chapter 66 ale infertility: aboratory evaluation of ale infertility.","sourcePage":267},{"id":"7-031","category":"男性學(含生殖)","categoryOrder":7,"number":31,"question":"下列三種肌肉注射型睪固酮製劑的半衰期比較 殖 (1:testosterone undecanoate, 2:testosterone C propionate, 3:testosterone enanthate or 1 cypionate)，何者正確? e","options":{"A":"1>3>2 m","B":"3>1>2 d","C":"1>2>3 t","D":"2>3>1","E":"3>2>1"},"answer":"A","reference":"(110)/7.男性學(含生 )/參考資料(摘錄自)： ampbell-Walsh Urology 2th Edition, chapter 69 valuation and anagement of erectile ysfunction: estosterone therapy","sourcePage":267},{"id":"7-032","category":"男性學(含生殖)","categoryOrder":7,"number":32,"question":"下列有關延遲性射精(delayed ejaculation)的危險因 殖 子,何者錯誤? E","options":{"A":"性腺功能低下 S","B":"甲狀腺功能低下 H","C":"抗精神病(antipsychotics)和抗憂鬱症 e (antidepressants)藥物使用","D":"糖尿病自主神經病變","E":"抽菸"},"answer":"E","reference":"(110)/7.男性學(含生 )/參考資料(摘錄自)： AU 2021 guideline: exual and Reproductive ealth: delayed jaculation","sourcePage":267},{"id":"7-033","category":"男性學(含生殖)","categoryOrder":7,"number":33,"question":"下列關於輸精管吻合術(Vasovasostomy)的描述，何者正 殖 確? C","options":{"A":"醫源性輸精管損傷引發的阻塞性無精子症，約占無精 12 子症(azoospermia)成因的 30% s","B":"對疝氣修補手術或睪丸固定術所引發的輸精管阻塞 m 患者，宜從陰囊切位(scrotal approach)進行輸精管 v 吻合術","C":"術中發現精子肉芽腫(sperm granuloma)易引發傷口 感染，不利於術後恢復生育力","D":"輸精管吻合的密合度 (water tightness)完全取決 於黏膜縫合(mucosal suture)","E":"輸精管手術應避免睪丸血管供應的破壞，尤其是來自 會陰動脈(pudendal artery)的分支"},"answer":"D","reference":"(110)/7.男性學(含生 )/參考資料(摘錄自)： ampbell-Walsh Urology th Edition, chapter 67 urgical management of ale infertility: asovasostomy","sourcePage":268},{"id":"7-034","category":"男性學(含生殖)","categoryOrder":7,"number":34,"question":"有關佩洛尼氏病(Peyronie’s disease)的敘述，下列何 者正確？ 殖","options":{"A":"多好發於 40 歲以下年輕男性，成因與勃起功能障礙 C 無關 12","B":"白膜纖維化好發於雙側(3 點鐘與 9 點鐘)，易造成陰 d 莖側彎 o","C":"在未治療情況下，約 30-50%患者在發病前 12 至 18 個月可改善","D":"Pentoxifylline 為 FDA 核准治療的藥物，可選擇性 分解 collagen type Ⅰ 與 type Ⅲ","E":"體外震波治療 (extracorporeal shock wave therapy) 可改善疼痛與勃起功能，但對陰莖彎曲的 改善不佳"},"answer":"E","reference":"(110)/7.男性學(含生 )/參考資料(摘錄自)： ampbell-Walsh Urology th Edition, chapter 73 iagnosis and management f Peyronie's disease","sourcePage":268},{"id":"7-035","category":"男性學(含生殖)","categoryOrder":7,"number":35,"question":"請問下列關於男性生殖器官的描述，何者錯誤?","options":{"A":"Micropenis 的定義為陰莖在伸展的情況下，沒有尿 殖 道下裂的情形，長度小於 2.5cm S","B":"造成 Micropenis 的原因，primary hypogonadism 的 p 疾病包含: Klinefelter syndrome、Noonan syndrome、Trisomy 21、Robinow syndrome","C":"若及時接受 testosterone 治療，Micropenis 的病人 在成年時有大於 90%的機率恢復正常長度","D":"Prader orchidometer 可以幫助測量睪丸大小，有 1-25ml，Prepubertal sizes 是 1–3 ml, pubertal sizes 是 4-10 ml，而 adult sizes 是 11–25 ml","E":"高頻率(5–7-mHz) 經直腸超音波測量， seminal vesicles 寬度大於 1.5 cm 或 ejaculatory ducts 管 徑大於 2.3 mm , 表示有擴張，可能有阻塞的現象"},"answer":"D","reference":"(110)/7.男性學(含生 )/參考資料(摘錄自)： mith 19th edition, ch43, 695, ch44, p710,714","sourcePage":268},{"id":"7-036","category":"男性學(含生殖)","categoryOrder":7,"number":36,"question":"過去非阻塞性無精症，若沒有正常的精子，只能靠領養小 (11 孩。近年來醫學的發達，Round spermatid injection 參考 (ROSI)的技術讓這些病人有了成功生育的
