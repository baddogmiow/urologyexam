r":"B","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh-Wein Urology, Twelfth Edition, chapter 154, 3537-3547 詳解：只有 25%會進展","sourcePage":32},{"id":"2-003","category":"前列腺疾病含癌症","categoryOrder":2,"number":3,"question":"關於局部侵襲性（locally advanced）攝護腺癌的治療 與診斷，下列何者為非?","options":{"A":"Ga-PSMA(prostate-specific membrane antigen)-11 PET/MRI 可以區分是否有淋巴轉移， 以利腫瘤的分級與復發判定","B":"局部侵襲性攝護腺癌在 RP(radical prostatectomy)前，使用賀爾蒙治療（neoadjuvant ADT）對於癌症疾病存活率（diseas-specific survival）有好處，但是對於總體存活率（overall survival）則否","C":"局部侵襲性攝護腺癌在 RP(radical prostatectomy)後，對於邊緣未切除乾淨 （positive surgical margin）的病人，給予輔助 性放射線治療對於總體存活率（overall survival） 有好處，而預後之所以改善與給予的劑量相關，高 劑量（>64 Gy）比低劑量好","D":"若未接受手術，選擇接受 RT（radiation therapy） 的病人，治療前或者同步給予賀爾蒙治療 （neoadjuvant/ concurrent ADT）是合適的","E":"UCSF-CAPRA score 可以預測，治療後五年復發的風 險，根據 CaPSURE（Cancer of the Prostate Strategic Urologic Research Endeavor）的研究， 在高風險族群（6-10 分）接受手術治療的比例有上 升"},"answer":"B","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh Urology 12th，ch159, p3642,3648,3651,4652,3644","sourcePage":32},{"id":"2-004","category":"前列腺疾病含癌症","categoryOrder":2,"number":4,"question":"關於攝護腺癌亞型(subtype)的敘述何者為非？","options":{"A":"約有 50%的小細胞癌(small cell carcinoma)之中 同時混雜有腺癌(adenocarcinoma)","B":"小細胞癌無論是單純(pure)還是混雜型(mixed)， 預後都相當，平均存活時間小於一年","C":"管腺癌(duct adenocarcinomas)因其篩狀 (cribriform)外觀，格里森分類至少為 4 以上","D":"鱗狀細胞癌(primary squamous carcinoma )會產 生溶骨性轉移(osteolytic metastases )","E":"以上皆正確"},"answer":"E","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh-Wein Urology, Twelfth Edition, chapter 151, 3506-3513","sourcePage":33},{"id":"2-005","category":"前列腺疾病含癌症","categoryOrder":2,"number":5,"question":"下列有關攝護腺癌之敘述何者為非？","options":{"A":"超過 95%的攝護腺癌為腺癌，剩下的 5%可能來自於 基質(stromal)、上皮(epithelial)、異位 (ectopic)的細胞","B":"8p、10q、11q、13q、16q、17p 和 18q 的染色體 重排或染色體拷貝數異常在攝護腺癌的組織中被 發現過","C":"ERG 和 EtV1 這兩種轉錄因子，在攝護腺癌組織中經 常過度表達(overexpressed)","D":"TMPRSS2:ERG 融合在大約 20%的攝護腺腫瘤中被發 現，並且可能代表了致癌作用的早期分子事件","E":"攝護腺上皮內增生(Prostatic intraepithelial neoplasia, PIN)和非典型小腺泡增生(atypical small acinar proliferation, ASAP)被認為是可 能的攝護腺癌前病變，後者的攝護腺癌風險更高"},"answer":"D","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：Smith 19th, Chap21, p352-354","sourcePage":33},{"id":"2-006","category":"前列腺疾病含癌症","categoryOrder":2,"number":6,"question":"下列有關轉移性荷爾蒙敏感性攝護腺癌(metastatic hormone sensitive prostate cancer)藥物治療之敘 述，何者正確?","options":{"A":"LATITUDE trial 分組中，高風險族群必須符合三處 以上骨骼轉移、臟器轉移或 ISUP grade 4-5 中全 部三項危險因子","B":"TITAN trial 結果指出 apalutamide plus ADT， 比起對照組，最常導致停藥的併發症為抽蓄 (seizure)","C":"Apalutamide 最常出現併發症為紅疹 (rash) ，其 起因是其代謝產物 2-cyanopyridine，和血漿蛋白 質發生免疫作用引起之反應","D":"ENZAMET trial 證實 enzalutamide plus ADT 合併 使用 docetaxel，能夠顯著延長病患存活時間","E":"在 TITAN trial 中，apalutamide plus ADT 在 low metastatic volume 的病人上無法顯著延長 overall survival 和 radiographic progression-free survival"},"answer":"C","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：1.EAU guideline for prostate cancer, 2019, p77-82. 2.N Engl J Med. N Engl J Med. 2019 Jun 2. doi: 10.1056/NEJMoa1903835. 3. N Engl J Med. 2019 May 31. doi: 10.1056/NEJMoa1903307.","sourcePage":34},{"id":"2-007","category":"前列腺疾病含癌症","categoryOrder":2,"number":7,"question":"下列有關攝護腺發炎的敘述何者正確？","options":{"A":"包莖不會增加細菌在攝護腺 colonization 的機率","B":"慢性發炎以 monocyte infiltration in the stroma 為最常見的型態","C":"由於 Corynebacterium 的培養十分困難，在尿液培 養中若有看到類似的菌體，應加驗病人血液中的抗 體來幫助診斷","D":"Ureaplasma urealyticum 是無症狀男性尿道常見的 菌種，在攝護腺發炎患者中可能會發現其濃度過高","E":"急性發炎時細菌培養常見 Escherichia coli 和 Pseudomonas aeruginosa，兩者總和占比例約 60%"},"answer":"D","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：Campbell 11th Ch13 ( p.305-307)","sourcePage":34},{"id":"2-008","category":"前列腺疾病含癌症","categoryOrder":2,"number":8,"question":"下列有關良性攝護腺增生引發的血尿，何者正確？","options":{"A":"在老年男性患者中很常見，機率僅次於泌尿道癌症 引發的血尿","B":"可能原因為攝護腺的 microvessel density 增加， 但目前認為和 vascular endothelial growth factor (VEGF)並無關聯","C":"使用 finasteride 可以減少攝護腺血流但無法減少 microvessel density","D":"使用 finasteride 約有九成患者症狀可緩解","E":"以上皆正確"},"answer":"D","reference":"(110)/2.前列腺疾病含癌症/參 考 資料(摘錄自)：Campbell 11th Ch9 p.191-192","sourcePage":34},{"id":"2-009","category":"前列腺疾病含癌症","categoryOrder":2,"number":9,"question":"關於前列腺的發育，下列何者有誤 ?","options":{"A":"胚胎時期前列腺的發育是因為睪固酮 (testosterone)的刺激，並且與生理性別(genetic sex)有關","B":"儲精囊、副睪、輸精管等是由沃氏管(wolffian duct)發育而來，並且也由睪固酮(testosterone) 的刺激調控","C":"前列腺的纖維母細胞(fibroblast)富含波形蛋白 (vimentin)並且和纖維黏連蛋白(fibronectin)有 關","D":"周邊區(peripheral zone)佔前列腺的比例最大， 是癌症(carcinoma)的好發部位","E":"芬香環轉化酶(aromatase)能使得睪固酮 (testosterone)轉換成雌激素(estrogen)，這個過 程是不可逆的"},"answer":"A","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh 12th edition, Chapter 143, p3274~3277 (A) 與 genetic sex 無關","sourcePage":35},{"id":"2-010","category":"前列腺疾病含癌症","categoryOrder":2,"number":10,"question":"以下關於攝護腺肥大手術描述，何者有誤 ?","options":{"A":"攝護腺肥大手術適應症包括膀胱結石或憩室 (bladder stone/diverticulum)、反覆泌尿道感染 (recurrent UTI)以及嚴重肉眼可見之血尿(robust gross hematuria)","B":"TURP 術中造成的外滲(extravasation) 常是 腹膜 內(intraperitoneal)，可能的位置包括攝護腺膀 胱交界(prostatovesical junction)、攝護腺包膜 (the prostatic capsule)與膀胱本身","C":"攝護腺的 venous system 壓力約為 10mmHg，水壓 超過這個壓力會導致過多的術中水分吸收","D":"經尿路切除症候群(TUR syndrome)的發生率約為 2%，風險因子包含較大的攝護腺(大於 45 g) 和較 長的手術時間(大於 90 分鐘)","E":"TURP 的術中(intraoperative)整體併發症的發生 率約為 3%，最常見因出血所需輸血"},"answer":"B","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh 12th edition, Chapter 146, p3407~3415 (B)多為腹膜內 (extraperitoneal)","sourcePage":35},{"id":"2-011","category":"前列腺疾病含癌症","categoryOrder":2,"number":11,"question":"下列敘述關於攝護腺特異抗原(PSA)，何者有誤 ?","options":{"A":"縱使沒有罹患前列腺癌，黑人的攝護腺特異抗原 (PSA) 也比白人要來的高","B":"5α-還原酶抑制劑(5α reductase inhibitors)大 約會讓 PSA 12 個月下降 50%","C":"攝護腺癌細胞(prostate cancer cell)相較於攝護 腺上皮(benign prostate epithelium) PSA 增加， 是因為 malignant cell escape proteolytic processing","D":"PSA 上升速度(PSA velocity)可以被當作決定是否 切片的決定因子","E":"PSA-ACT 為 PSA 在血液中最常出現的形式"},"answer":"D","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh 12th edition, Chapter 149, p3481 (D)PSAV should not use as trigger of biopsy","sourcePage":35},{"id":"2-012","category":"前列腺疾病含癌症","categoryOrder":2,"number":12,"question":"下列針對攝護腺癌的賀爾蒙治療敘述何者錯誤 ?","options":{"A":"雄性素剝奪療法(androgen deprivation therapy) 包含雙側睪丸切除、抑制黃體激素產生、阻斷雄性 素合成等","B":"Ketoconazole 透過抑制 17,20-desmolase 減 少雄 性激素(androgen)生成，並可抑制睪固酮血清濃度 (testosterone level)至 12 個月之久","C":"Nilutamide 副作用包含陰暗光線適應遲緩 (delayed adaptation to darkness)","D":"術前輔助性荷爾蒙治療(Neoadjuvant hormone therapy)對攝護腺癌手術(radical prostatectomy)而言會增加手術的困難度","E":"Bicalutamide 為一雄激素受體阻斷劑(androgen receptor antagonists)，作用在攝護腺，使用上 有男性女乳症(gynecomastia)的副作用"},"answer":"B","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh 12th edition, Chapter 161, p3677 (B)testosterone level begin to rise within 5 months","sourcePage":36},{"id":"2-013","category":"前列腺疾病含癌症","categoryOrder":2,"number":13,"question":"國家衛生研究院於 2020 年發表在 Nature 旗下 Cell & Death 期刊，關於攝護腺癌轉移相關基因 ROR2 之發現何 者錯誤？","options":{"A":"裸鼠體內，過量表達 ROR2 的攝護腺癌細胞較無過 量表達 ROR2 的攝護腺癌細胞擴散得慢","B":"ROR2 受體其作用主要透過調控 PIAS3-PI3K-AKT2 的 訊息傳遞路徑而抑制攝護腺癌的轉移","C":"過量表達 ROR2 受體會抑制小分子核醣核酸 miR-199a-5p，因而促進 SUMO-蛋白連接酶 PIAS3 蛋 白的表達","D":"PIAS3 的增加會促進 AKT2 蛋白以及 AKT 蛋白的磷酸 化，進而抑制攝護腺癌細胞的轉移與侵襲能力","E":"ROR2 的基因和蛋白質的表達量，在轉移的攝護腺癌 腫瘤中遠比原發腫瘤或周邊正常組織中低許多"},"answer":"D","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：Tseng, JC., Huang, SH., Lin, CY. et al. ROR2 suppresses metastasis of prostate cancer via regulation of miR-199a-5p–PIAS3–AKT2 signaling axis. Cell Death Dis 11, 376 (2020) 詳解：減少磷酸化","sourcePage":36},{"id":"2-014","category":"前列腺疾病含癌症","categoryOrder":2,"number":14,"question":"以下關於攝護腺特定細胞膜特定抗原(prostate- specific membrane antigen, PSMA)相關之敘述何者錯 誤？","options":{"A":"PSMA 為一整合型膜蛋白，其功用為二氫葉酸還原酶 (dihydrofolate reductase)","B":"鎦 Lutetium-177 [177Lu]-PSMA-617 所放出之粒子 為 beta 粒子，其穿透力約為 1mm","C":"PSMA 在癌細胞上的表現量為一般攝護腺細胞之 100 至 1000 倍，且在轉移性及賀爾蒙抗性之癌細胞中 表現量更高","D":"225Ac(actinium)-PSMA-617 產生 alpha 粒子，其距 離更短且能量更強","E":"目前放射性同位素-PSMA 對於腎臟之短期傷害不顯 著，然而長期傷害未明仍需更多統計研究"},"answer":"A","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh-Wein Urology, Twelfth Edition, chapter 149, 3478-3489 Hofman MS et al.[177Lu]-PSMA-617 radionuclide treatment in patients with metastatic castration-resistant prostate cancer (LuPSMA trial): a single-centre, single-arm, phase 2 study. Lancet Oncol. 2018 Jun;19(6):825-833. Heck MM et al. Treatment Outcome, Toxicity, and Predictive Factors for Radioligand Therapy with 177Lu-PSMA-I&T in Metastatic Castration-resistant Prostate Cancer. Eur Urol. 2019 Jun;75(6):920-926 詳解:為葉酸水解酶(folate hydrolase)","sourcePage":36},{"id":"2-015","category":"前列腺疾病含癌症","categoryOrder":2,"number":15,"question":"以下關於攝護腺切片病理學的敘述何者錯誤？","options":{"A":"切片病理報告不應給予 low-grade Prostatic intraepithelial neoplasia (LGPIN)結論，因其 難以與良性組織區分，且其癌症風險並不高於切片 陰性病患","B":"High-grade PIN 約佔 4~5%之攝護腺切片結果","C":"切片結果若超過一針為 HGPIN，其癌症風險與非典 型疑似癌(atypical suspicious for carcinoma) 相當","D":"若切片結果只有單針 HGPIN，則一年內不需再做重 複切片","E":"約有 55%之 HGPIN 組織存在 TMPRSS2:ERG fusion gene，其為一常見變化，表現於約半數的攝護腺癌 之中"},"answer":"E","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh-Wein Urology, Twelfth Edition, chapter 151, 3506-3513 詳解:只有 20%組織存在","sourcePage":37},{"id":"2-016","category":"前列腺疾病含癌症","categoryOrder":2,"number":16,"question":"下列有關 ADT(androgen deprivation therapy)治療攝 護腺癌敘述何者錯誤?","options":{"A":"根據最新 NCCN guideline, high risk group locally advanced prostate cancer 在接受 radiotherapy 時需 combined 1-3 年 ADT 使用","B":"根據最新 NCCN guideline, unfavorable intermediate risk group prostate cancer 接受 radiotherapy 時需 combined 4-6 個月 ADT 使用","C":"目前在接受 radical prostatectomy for localized prostate cancer 前的 neoadjuvant ADT 已是標準 建議治療","D":"ADT 長期使用會增加骨折風險","E":"ADT 長期使用會增加代謝症候群及心血管疾病風險"},"answer":"C","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh Urology 12th edition Chapter 161, p.3680-3683 NCCN guideline Version2.2021","sourcePage":37},{"id":"2-017","category":"前列腺疾病含癌症","categoryOrder":2,"number":17,"question":"下列有關攝護腺切片敘述何者錯誤?","options":{"A":"因fluroquinolone有肌腱發炎、肌腱斷裂及中樞神 經系統之相關風險，目前建議切片前後使用不宜超 過24小時","B":"糖尿病、攝護腺肥大、先前曾接受切片之病人皆為 切片後容易感染之高風險族群","C":"經直腸切片(transrectal biopsy) 若病人為感染 低危險群(無糖尿病、無免疫抑制情況、未使用抗凝 血劑) 術前可以不用使用預防性抗生素","D":"相較於經直腸切片, 經會陰切片(transperineal) 可降低術後感染機會及提高apex tumor 偵測機率","E":"切片前清潔性灌腸(cleansing enema)除了可能可 降低感染之外，主要目的為減少糞便造成的陰影 (acoustic shadow)"},"answer":"C","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh Urology 12th edition Chapter 150. p.3496,3499","sourcePage":38},{"id":"2-018","category":"前列腺疾病含癌症","categoryOrder":2,"number":18,"question":"下列有關攝護腺癌生物標記(biomarker)敘述何者錯 誤?","options":{"A":"free PSA to total PSA ratio (%fPSA) 主要應用 於serum total PSA 4-10 ng/ml 時可協助切片適 應症的判斷","B":"%fPSA 數值越小，診斷為 prostate cancer 的比例 越高","C":"目前 68Ga-PSMA PET 可應用於攝護腺治療後 biochemical recurrence 的影像判斷及治療","D":"偵測TMPRSS2:ERG gene fusion加上serum中的PCA3 score可增加攝護腺癌的診斷正確率","E":"PSA的半衰期大約2-3天"},"answer":"D","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh Urology 12th edition Chapter 149. p3481-3482, p3489","sourcePage":38},{"id":"2-019","category":"前列腺疾病含癌症","categoryOrder":2,"number":19,"question":"以下關於 BPH(benign prostate hyperplasia)的敘述， 何者正確？","options":{"A":"androgen 與 estrogens 皆與 BPH 的病因（etiology） 相關，其中 estrogen receptor（ER）又可分為由基 質細胞(stroma cell)分泌的 ER-α，以及由上皮細 胞 (epithelial cell)分泌的 ER-β","B":"生長因子（growth factor）包含 EGF, IGFs, KGF, TGF-β 與 BPH 的病因相關，其中唯有 KGF 會抑制上 皮細胞的增生","C":"在顯微鏡下，可以看到前列腺基質和上皮細胞的細 胞皆增大","D":"finasteride 可以同時抑制 type 1 & type 2 steroid 5α-reductase enzymes，達到讓前列腺縮小的效果","E":"以上皆非"},"answer":"A","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh Urology 11th edition Chapter 103, p.2425, 2427-2430","sourcePage":38},{"id":"2-020","category":"前列腺疾病含癌症","categoryOrder":2,"number":20,"question":"有關 metastatic castration resistant prostate cancer (mCRPC)之治療下列何者錯誤?","options":{"A":"Mitoxantrone 無論 combined prednisolone or hydrocortisone 都只能改善 life quality 及疼痛, 沒有證據能延長病患存活率(overall survival)","B":"在 docetaxel TAX 327 study 中, weekly docetaxel(30mg/m2)相較於 every-3-week docetaxel ( 75mg/m2) 有較低的 neutropenic fever 機會","C":"在 docetaxel TAX 327 study 中, every-3-week docetaxel ( 75mg/m2)將較於 weekly docetaxel(30mg/m2)有較佳之存活率(overall survival)","D":"Cabazitaxel 為 mCRPC 第一線 docetaxel 失敗後之 第二線治療選擇(second line treatment choice)","E":"目前美國 FDA 核准之 mCPRC 藥物有 Docetaxel、 Abiraterone、Apalutamide 及 Enzalutamide 等"},"answer":"E","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh Urology 12th edition Chapter 162. p.3690-3696 SPARTAN trial","sourcePage":39},{"id":"2-021","category":"前列腺疾病含癌症","categoryOrder":2,"number":21,"question":"下列關於前列腺癌(prostate cancer)的敘述何者正 確？","options":{"A":"攝護腺原發性鱗狀上皮癌(pure primary squamous carcinoma of the prostate)相當少見，預後也很 差，其對賀爾蒙治療(ADT)反應不佳，臨床上反而 較常以腺癌鱗狀分化(squamous differentiation of adenocarcinoma)見於化療後的選擇效應","B":"最新版前列腺癌 AJCC staging 僅適用於腺癌 (adenocarcinoma)分期，鱗狀上皮癌(squamous carcinoma)、泌尿上皮癌(urothelial carcinoma) 及肉瘤(sarcoma)皆不適用","C":"如若發生遠端骨轉移(bone metastasis)，腺癌和 鱗狀上皮癌多為成骨性(osteoblastic)轉移，而泌 尿上皮癌多為蝕骨性(osteolytic)轉移","D":"前列腺小細胞癌(small cell carcinoma)大約有一 半的比例會和腺癌一起出現(mixed small cell and adenocarcinoma)，其預後相當不好，病人平均存 活時間小於一年；純小細胞癌(pure small cell) 與和腺癌一起出現(mixed glandular and small cell carcinoma)的案例相比預後沒有差異","E":"惡性度不定之前列腺基質瘤(stromal tumors of uncertain malignant potential, STUMP)臨床表 現大部分相當具侵略性，有少數案例會進展為基質 肉瘤(stromal sarcoma)，建議徹底手術切除並密 切追蹤"},"answer":"D","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：Campbell 12ed. Ch151, Pg 3512 A. NCCN prostate cancer, 2021, ST-2 B. Campbell 12ed. Ch151, Pg 3512 C. Campbell 12ed. Ch151, Pg 3512 Campbell Ch151, Pg 3512","sourcePage":39},{"id":"2-022","category":"前列腺疾病含癌症","categoryOrder":2,"number":22,"question":"關於前列腺癌的基因相關議題，下列敘述何者正確？","options":{"A":"已有世代追蹤研究(cohort study)指出，不論臨床 分期，大約有 5%的前列腺癌有遺傳基因突變 (germline mutations)","B":"遺傳基因突變中，BRCA1 佔最多，其次為 ATM，再 其次為 BRCA2","C":"根據 PROfound trial，針對轉移性去勢療法無效前 列腺癌(mCRPC)，在接受新型荷爾蒙治療(novel hormone therapy, NHT)的情況下仍然惡化的病 人，Olaparib 在 BRCA1, BRCA2, ATM 至少有一種 mutation 的組別，比起控制組，中位整體存活率 (median overall survival)增加了 3.4 個月","D":"目前在 PARP (Poly ADP Ribose Polymerase) inhibitor 當中，olaparib 已經獲得美國 FDA 許可 使用在 mCRPC 有基因突變的病患，rucaparib 和 talazoparib 則仍在審查中","E":"根據 NCCN 2021 版本，very low risk 的病患不建 議做腫瘤分子/生物標記分析 (molecular/biomarker analysis of tumor)；very high risk 的病患如果預期餘命(life expectancy) 大於等於十年，則建議做腫瘤分子/生物標記分析"},"answer":"C","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： A. EAU guidelines on prostate cancer, 2021, Pg 17 B. EAU guidelines on prostate cancer, 2021, Pg 17 C. N Engl J Med 2020; 382:2091-2102 D. EAU guidelines on prostate cancer, 2021, E. NCCN prostate cancer, 2021","sourcePage":40},{"id":"2-023","category":"前列腺疾病含癌症","categoryOrder":2,"number":23,"question":"關於根除性攝護腺切除(radical prostatectomy)手術 中的骨盆腔淋巴結處理，以下何者為非？","options":{"A":"EUA 建議術前評估淋巴轉移機率大於 5%的患者應該 於術中接受廣泛性骨盆腔淋巴結廓清術(extended pelvic lymph node dissection)","B":"AUA/ASTRO/SUO 建議 unfavorable intermediate 或 者 high risk 的病人於術中接受廣泛性骨盆腔淋巴 結廓清術","C":"淋巴囊腫(lymphocele)是骨盆腔淋巴結廓清術後 最主要的併發症，約有 60%的患者會發生","D":"經腹腔機器手臂根除性攝護腺切除手術可以避免 術後淋巴囊腫(lymphocele)的產生","E":"如果在手術中造成閉孔神經(Obturator nerve)的 傷害會導致大腿無法內收(Adduction)"},"answer":"D","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：Campbell 12th edition Chap156, p3584, p3586","sourcePage":40},{"id":"2-024","category":"前列腺疾病含癌症","categoryOrder":2,"number":24,"question":"根據 NCCN(National Comprehensive Cancer Network) guideline，治療低腫瘤量去勢敏感性轉移性攝護腺癌 (low-volume metastatic castration naïve prostate cancer)建議的放射治療劑量下列何者最適合？","options":{"A":"6 Gy x 6 fx","B":"1.8-2 Gy x 37-45 fx","C":"2.5 Gy x 28 fx","D":"3 Gy x 20 fx","E":"5.5 Gy x 15 fx"},"answer":"A","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：NCCN guidelines Version 2.2021 p39","sourcePage":41},{"id":"2-025","category":"前列腺疾病含癌症","categoryOrder":2,"number":25,"question":"較高的身體質量指數(high Body Mass Index, BMI)與 下列何者正相關：","options":{"A":"可保護人體以對抗氧化壓力(oxidative stress)","B":"體內有較高的循環男性賀爾蒙(circulating androgens)","C":"此類病人之血清 PSA 較低","D":"若罹患攝護腺癌時，其癌症特異性存活率較好 (better cancer-specific survival)","E":"此類病人的攝護腺癌診斷率與其他低身體質量指 數(low BMI)的人差不多"},"answer":"C","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：Campell 12th, Chapter 148","sourcePage":41},{"id":"2-026","category":"前列腺疾病含癌症","categoryOrder":2,"number":26,"question":"對於早期或低風險攝護腺癌病人，若病人只想接受保守 性治療，積極監控 (active surveillance）為目前國 際上常使用的方法之一。如果病人在診斷時的格里森分 數為7 (baseline Gleason=7) ，那麼以積極監控並追 蹤15年之後，病人發生轉移的機率為何?","options":{"A":"≤ 5%","B":"≥ 10%","C":"≥ 20%","D":"≥ 30%","E":"≥ 40%"},"answer":"C","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：(American Urological Association [AUA], 2017; Chen et al., 2016).Campell 12th, Chapter 154.","sourcePage":41},{"id":"2-027","category":"前列腺疾病含癌症","categoryOrder":2,"number":27,"question":"攝護腺切片最常見的併發症為術後感染，為減少此風險 氟喹諾酮類（Fluoroquinolone）為常用預防性抗生素 之一，然而最近幾年有發現其使用後常併發肌腱炎及肌 腱破裂、周邊神經病變及重症肌無力的惡化，因此 FDA 建議減少使用時間，其建議少於多少時間以降低上述風 險?","options":{"A":"12 小時","B":"24 小時","C":"36 小時","D":"48 小時","E":"72 小時"},"answer":"B","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：Campell 12th, Chapter 152.page 15907","sourcePage":41},{"id":"2-028","category":"前列腺疾病含癌症","categoryOrder":2,"number":28,"question":"下列有關攝護腺特異性抗原(Prostate-Specific Antigen, PSA)的敘述何者為非？","options":{"A":"攝護腺癌細胞產生的 PSA 更頻繁地逃避蛋白水解過 程(escape proteolytic processing)，導致 PSA 與 α1-Antichymotrypsin (ACT)複合的 PSA 比例更 高、free PSA 的比例更低","B":"PSA 據有高度器官特異性，因為它主要由攝護腺的 luminal epithelial cell 產生","C":"在血清中，PSA 以結合和未結合形式循環。 已知 與血液中 PSA 結合的三種蛋白質是 α1-Antichymotrypsin (ACT)、α2-Macroglobulin (A2M)、α1-protease inhibitor (API)","D":"PSA 的 E 表位(E epitope)和 α1-Antichymotrypsin (ACT)結合後即被其佔據了，但 PSA-ACT 複合體還 是可以被 PSA 檢測偵測到","E":"proPSA 透過 hK2 切割末端的氨基酸序列後，產生具 有活性的 PSA"},"answer":"E","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：Campbell 12th, Chap149, p3480-3481","sourcePage":42},{"id":"2-029","category":"前列腺疾病含癌症","categoryOrder":2,"number":29,"question":"下列敘述何者為非？","options":{"A":"前列腺特異性膜抗原(prostate-specific membrane antigen, PSMA)作為一個攝護腺癌潛在 的生物標誌物(biomarker)，其除了在攝護腺上皮 細胞膜上被發現外，也在中樞神經系統及腸道中被 發現","B":"PSA 有器官特異性(organ-specific)，而非疾病特 異性(disease-specific)，其半衰期(half-life) 約為 5-7 天","C":"攝護腺抗原 3(PCA3)是一種基於尿液的標記物 (urine-based marker)，可結合 TMPRSS2: ERG 基 因融合檢測，提高攝護腺癌診斷準確率","D":"在攝護腺癌的循環腫瘤細胞(Circulating tumor cells, CTCs)中發現雄激素受體剪接變體 7(androgen receptor splice variant 7, AR-V7)， 則其對於 taxane 治療的反應優於 abiraterone 或 enzalutamide","E":"使用 5α-還原酶抑製劑(5α-reductase inhibitors, 5ARI)十二個月後，PSA 大約會下降 50%"},"answer":"B","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：Campbell 12th, Chap149, p3481-3489","sourcePage":42},{"id":"2-030","category":"前列腺疾病含癌症","categoryOrder":2,"number":30,"question":"62 歲攝護腺癌患者，無慢性病史，沒有攝護腺癌家族史 且沒有臨床症狀，核磁共振顯示分期為 T2bN0，其餘影 像檢查皆無發現遠端轉移，經直腸超音波導引攝護腺切 片的病理報告顯示 Gleason score 3+5，十二條標本中 有三條觀察到攝護腺癌細胞，切片前 PSA 為 22ng/mL。 依據 NCCN guideline V2.2021 下列敘述何者為非？","options":{"A":"此患者依據 NCCN guideline 的 risk stratification 屬於 High risk group","B":"建議此患者檢測 germline testing，監測基因範圍 包含下列基因 BRCA1、BRCA2、 ATM、PALB2、CHEK2、 MLH1、MSH2、MSH6、PMS2","C":"可使用放射線治療(EBRT)加上賀爾蒙治療(ADT)， 再合併紫杉醇(docetaxel)化療使用來為此患者治 療","D":"可使用根除性攝護腺切除術合併骨盆淋巴結清除 手術來為此患者治療","E":"若手術後，依然可以偵測到 PSA 指數，且病理報告 中沒有淋巴結侵犯，可給予放射線治療(EBRT)合併 賀爾蒙治療(ADT)"},"answer":"A","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：NCCN guideline of prostate cancer V2.2021","sourcePage":43},{"id":"2-031","category":"前列腺疾病含癌症","categoryOrder":2,"number":31,"question":"核磁共振(MRI)在臨床上可以協助診斷攝護腺癌，下列 關於 PIRADS v2 的敘述何者為非？","options":{"A":"高度懷疑攝護腺外蔓延(extraprostatic extension, EPE)的病灶為 PI-RADS 5 的病灶","B":"在攝護腺周邊區(peripheral zone)的病灶，若 T2 加權影像(T2WI)上 4 分、擴散加權影像(DWI)上 3 分、動態對比度增強(DCE)為陰性，為 PI-RADS 4 的病灶","C":"在攝護腺移形區(transition zone)的病灶，若 T2 加權影像(T2WI)上 3 分、擴散加權影像(DWI)上 4 分、動態對比度增強(DCE)為陽性，為 PI-RADS 3 的病灶","D":"在攝護腺周邊區(peripheral zone)的病灶，若 T2 加權影像(T2WI)上 4 分、擴散加權影像(DWI)上 2 分、動態對比度增強(DCE)為陽性，為 PI-RADS 2 的病灶","E":"在大型臨床試驗中(PRECISION trial)，與標準 TRUS biopsy 相比，MRI-targeted biopsy 具有更高的臨 床意義(clinically significant)疾病偵測率和更 低的臨床無意義(clinically insignificant)疾病 偵測率"},"answer":"B","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：Campbell 12th, Chap150, p3502-3503","sourcePage":43},{"id":"2-032","category":"前列腺疾病含癌症","categoryOrder":2,"number":32,"question":"下列關於攝護腺癌的流病與病因，何者為非？","options":{"A":"2017 年美國預防服務工作小組 U.S. Preventive Services Task Force (USPSTF)建議，在 55-69 歲 的男性可以考慮做攝護腺癌篩檢，但對於 70 歲以 上族群依然不支持","B":"基因 HOXB13、BRCA是攝護腺癌的危險因子","C":"家族史影響之相對風險（relative risk）與罹患 的家族成員數量、血緣親密程度（親等）、以及家 族成員診斷時年齡相關","D":"性傳染病理論上與攝護腺癌相關，但沒有任何感染 菌確定會造成攝護腺癌","E":"肥胖（obesity）是攝護腺癌的風險因子，但是不 會增加高惡性攝護腺癌（high grade）發生率及造 成攝護腺癌相關死亡率上升"},"answer":"E","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh Urology 12th，ch148, p3460, 3477, 3464,3465.","sourcePage":44},{"id":"2-033","category":"前列腺疾病含癌症","categoryOrder":2,"number":33,"question":"有一定比例的 PSA，是在血清內一般的試劑測不到的， 請問是下列哪種形式的 PSA?","options":{"A":"Benign PSA","B":"PSA- α1protease inhibitor","C":"-2pro PSA","D":"PSA- α2 macroglobulin","E":"PSA- α1antichymotrypsin"},"answer":"D","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh Urology 12th，ch1 149 p3481","sourcePage":44},{"id":"2-034","category":"前列腺疾病含癌症","categoryOrder":2,"number":34,"question":"關於 EAU 在 COVID 流行時期對於攝護腺癌治療建議，下 列何者為非？","options":{"A":"對於 low risk 的族群，積極治療(active treatment)可以延後 6 個月","B":"對於肛門指診有懷疑或者 PSA 大於 10 ng/mL 的患 者可以考慮先做核磁共振","C":"對於 intermediate risk 族群並且考慮要 RP(radial prostatectomy)的病人, 不可以延後超 過 3 個月，可以先給 ADT","D":"在 high risk 的病人，在未接受 RP 前，若病人很 焦慮，可以先建議放射線療法加上 ADT（androgen deprivation therapy）","E":"在局部侵襲性的攝護腺癌患者，建議在 6 週內接受 治療"},"answer":"C","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：EAU 2021 Recommendations from the Prostate Cancer Guidelines Panel applicable during the COVID-19 pandemic","sourcePage":44},{"id":"2-035","category":"前列腺疾病含癌症","categoryOrder":2,"number":35,"question":"關於攝護腺癌的賀爾蒙治療，下列何者正確？","options":{"A":"Nilutamide, 是藉由腎代謝，是第二代非類固醇類 抗雄性激素，副作用常見為夜盲症","B":"Bicalutamide 是非類固醇類抗雄性激素，但比起觀 察(watchful waiting)，對於低風險的患者，在存 活率上沒有好處，且會有男性女乳症的副作用。所 以現今很少會單方給予(monotherapy)","C":"第一代非類固醇類抗雄性激素，在 CAB(combined androgen blockade)治療，合併促黃體激素釋放激 素阻斷劑（LHRH antagonist）使用，可阻斷此藥 造成的雄性激素突增(testosterone surge)","D":"抗雄性激素戒斷症候群，在大部分的抗雄性激素藥 物中都會出現。其表現為：停藥 4～6 週後，PSA 會 持續上升","E":"Abiraterone 的作用機轉中，其阻斷的酵素只有 17α-hydroxylase"},"answer":"B","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh Urology 12th，ch161, p3675-3677","sourcePage":45},{"id":"2-036","category":"前列腺疾病含癌症","categoryOrder":2,"number":36,"question":"關於轉移性去勢抗性攝護腺癌(mCRPC)，下列何者正 確？","options":{"A":"Cabazitaxel 為 FDA 核准的 mCRPC 第二線化療藥 物，常見的副作用有嗜中性球低下、腹瀉、與周邊 神經病變，故如果病人之前使用 Docetaxel 有神經 病變的副作用，不建議再使用 Cabazitaxel","B":"如果病人 PSA 不高卻大量轉移，需考慮是否為小細 胞(small cell)攝護腺癌，可在轉移處做切片，確 定是小細胞攝護腺癌後，使用化療如 cabazitaxel/etoposide","C":"Radium-223 會釋放 alpha 粒子射線，可用於 mCRPC 併有症狀的骨轉移且沒有內臟轉移的病人，可增加 整體存活率(OS)與延後第一次骨骼相關事件(SRE) 的時間，但不建議與 abiraterone 一起使用","D":"如果 Docetaxel 與第二代荷爾蒙治療失效，可使用 Olaparib 於 MSI-H 或 dMMR 的病人","E":"AR-V7 mRNA 可從循環腫瘤細胞(CTC)檢測，可用來 評估紫杉醇化療(Taxane chemotherapy)或是第二 代荷爾蒙治療(AR-directed therapy)對於 mCRPC 病人的療效。如果 AR-V7(+)，使用第二代荷爾蒙治 療的效果較化療好"},"answer":"C","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh-Wein Urology 12th, Ch162 NCCN guideline v 2.2021","sourcePage":45},{"id":"2-037","category":"前列腺疾病含癌症","categoryOrder":2,"number":37,"question":"關於非轉移性去勢抗性攝護腺癌(nmCRPC)，下列何者正 確？","options":{"A":"有三種第二代荷爾蒙藥物可以使用於 nmCRPC 的病 人，包含 enzalutamide、 apalutamide 及 darolutamide，可延後腫瘤轉移的時間，但對於整 體存活率(OS)沒有益處","B":"PSA doubling time(PSADT) 是影響 nmCRPC 預後 的因子，PSADT 小於等於 6 個月建議使用第二代荷 爾蒙治療，PSADT 大於 6 個月可以再觀察 (Observation)","C":"Apalutamide 是一種雄激素受體拮抗劑(AR antagonist)，也會抑制 AR 進入細胞核與 DNA 結 合，跟 enzalutamide 比起來，較不會經過腦血管 障壁，也較不會引起癲癇","D":"Enzalutamide 是最早被 FDA 核可用來治療 nmCRPC 的第二代荷爾蒙藥物","E":"TITAN trial 研究結果顯示，於 nmCRPC 的病人使 用 apalutamide 與 placebo 比，可延長無轉移存活 期(MFS)24.3 個月"},"answer":"C","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh-Wein Urology 12th, Ch162 NCCN guideline v 2.2021","sourcePage":45},{"id":"2-038","category":"前列腺疾病含癌症","categoryOrder":2,"number":38,"question":"根據 2021(version 2) NCCN guideline，下列有關鐳 -223(Radium-223)治療荷爾蒙抗性攝護腺癌，何者有 誤?","options":{"A":"根據 ALSYMPCA trial，比起對照組，鐳 -223(Radium-223)能夠延長 3.6 個月的存活時間， 且可以進一步延後骨骼相關事件 （Skeletal-related events）發生","B":"鐳-223(Radium-223)可以使用在單純脊椎骨骼轉 移合併骨盆腔 3.2 公分淋巴病灶且無任何內臟轉移 的病患","C":"在初次施打鐳-223(Radium-223)時，須注意病人血 球報告是否符合 absolute neutrophil count (ANC) ≧1.5x109/L，platelet count ≧ 100x109 /L 以及 hemoglobin ≧10 g/dL","D":"鐳-223(Radium-223)可能併發症包括噁心、嘔吐和 腹瀉，主要是因為其代謝物主要由糞便中排出","E":"根據 ERA 223 結果，合併使用鐳-223(Radium-223) 和 abiraterone 治療荷爾蒙抗性攝護腺癌病患，比 單獨使用 abiraterone 的病患，有較高的骨折發生 率和死亡率"},"answer":"B","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：NCCN guideline for prostate cancer, version 2, 2021","sourcePage":46},{"id":"2-039","category":"前列腺疾病含癌症","categoryOrder":2,"number":39,"question":"根據 2021 年 Daniel E Spratt 研究團隊對於侷限性攝 護腺癌症治療方式進行 Meta-analysis 的結果，下列敘 述何者正確？","options":{"A":"放射線治療合併 adjuvant ADT 相較於 neoadjuvant ADT 病人會有較好的 progression free survival","B":"放射線治療合併 adjuvant ADT 與 neoadjuvant ADT 兩組患者 biochemical failure 的比例無顯著差異","C":"使用 adjuvant ADT 患者死亡率較低且有達到顯著 差異","D":"患者產生 genitourinary toxicity 的機率在使用 neoadjuvant ADT 的族群中較高 c","E":"以上皆正確 j S O"},"answer":"A","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：Spratt, Daniel E., et al. \"Prostate radiotherapy with adjuvant androgen deprivation therapy (ADT) improves metastasis-free survival compared to neoadjuvant ADT: An individual patient meta-analysis.\" Journal of linical oncology: official ournal of the American ociety of Clinical ncology 39.2 (2021): 136-144.","sourcePage":46},{"id":"2-040","category":"前列腺疾病含癌症","categoryOrder":2,"number":40,"question":"核磁共振造影(MRI)在攝護腺癌症診斷以及判斷預後方 面扮演越來越重要的角色，以下何種 MRI 參數最能夠代 表攝護腺癌預後?","options":{"A":"顯影劑早期顯影(Early contrast wash-in)","B":"擴散係數圖(apparent diffusion coefficient)","C":"擴散加權影像(diffusion weighted image)","D":"T2 加權成像衰退( T2-weighted signal attenuation)","E":"核磁共振頻譜( Magnetic resonance spectroscopy)"},"answer":"B","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：Campbell 12th Chapter 153 (p 3527)","sourcePage":47},{"id":"2-041","category":"前列腺疾病含癌症","categoryOrder":2,"number":41,"question":"下列何種非類固醇抗男性荷爾蒙藥物跟間質性肺炎 (Interstitial pneumonitis)和延遲適視覺適應黑暗環 境(delayed adaptation to darkness)有關?","options":{"A":"Nilutamide","B":"Bicalutamide","C":"Darolutamide","D":"Apalutamide","E":"Flutamide"},"answer":"A","reference":"(110)/2.前列腺疾病含癌症/參 考資料(摘錄自)：Campbell 12th Chapter 161 (p3674-3675)","sourcePage":47},{"id":"2-042","category":"前列腺疾病含癌症","categoryOrder":2,"number":42,"question":"罹患 Lynch 症候群(Lynch syndrome)男性已被證實較易 產生前列腺癌，下列哪一種基因突變不會導致 Lynch 症 候群？","options":{"A":"ATM","B":"MLH1","C":"MSH2","D":"MSH6","E":"PMS2"},"answer":"A","reference":"(111) Campbell-Walsh-Wein Urology, 12th edition, 2021, Chapter 149, P3488","sourcePage":47},{"id":"2-043","category":"前列腺疾病含癌症","categoryOrder":2,"number":43,"question":"轉移性去勢抗性前列腺癌(metastatic castration resistant prostate cancer, mCRPC)病患，若已接受 過 Docetaxel 化療及新式賀爾蒙療法(novel hormone therapy)療效不佳，下列何者「不是」進一步的治療選 項？","options":{"A":"Cabazitaxel","B":"Olaparib","C":"Pembrolizumab","D":"Ipilimumab","E":"Rucaparib"},"answer":"D","reference":"(111) NCCN guideline for prostate cancer, Version 4.2022, 2022, PROS-15","sourcePage":47},{"id":"2-044","category":"前列腺疾病含癌症","categoryOrder":2,"number":44,"question":"4K score 可用來提高侵襲性前列腺癌的偵測率，下列何 者非用來計算 4K score 的成分？","options":{"A":"total PSA","B":"free PSA","C":"intact PSA","D":"− 2proPSA","E":"human kallikrein 2 (hk2)"},"answer":"D","reference":"(111) Smith &Tanagho’s General Urology, 19th edition, 2020, Chapter 21, P356","sourcePage":48},{"id":"2-045","category":"前列腺疾病含癌症","categoryOrder":2,"number":45,"question":"使用下列哪一種正子攝影的試劑(tracer)，相較於傳統 氟化去氧葡萄糖（FDG）試劑，無法提高前列腺癌轉移 病灶的偵測率？","options":{"A":"18F sodium fluoride","B":"13C-choline","C":"18F-fluciclovine","D":"18F piflufolastat prostate-specific membrane antigen (PSMA)","E":"68Ga-PSMA"},"answer":"B","reference":"(111) Smith &Tanagho’s General Urology, 19th edition, 2020, Chapter 21, P360; NCCN guideline for prostate cancer, Version 4.2022, 2022, PROS-13","sourcePage":48},{"id":"2-046","category":"前列腺疾病含癌症","categoryOrder":2,"number":46,"question":"下列針對 IgG 4 相關前列腺炎(Immunoglobulin G 4 related prostatitis)的描述何者錯誤？","options":{"A":"血清中 IgG4 濃度會上升","B":"前列腺病理組織呈現淋巴球浸潤(lymphocyte infiltration)","C":"常伴隨後腹腔纖維化 (retroperitoneal fibrosis)","D":"常伴隨唾液腺及淚腺侵犯","E":"使用類固醇治療效果不佳"},"answer":"E","reference":"(111) Campbell-Walsh-Wein Urology, 12th edition, 2021, Chapter 56, P1203","sourcePage":48},{"id":"2-047","category":"前列腺疾病含癌症","categoryOrder":2,"number":47,"question":"關於前列腺分泌液(prostatic secretion)和前列腺分 泌蛋白的敘述，下列何者錯誤?","options":{"A":"正常男性射精量約為 2~6ml，主要包含兩大部分: 精子(spermatozoa)和精漿(seminal plasma)，而 在精漿中佔比最大的一部分是來自於儲精囊 (seminal vesicle),其次是來自前列腺,接著是來 自 Cowper 氏腺和 Littre 氏腺","B":"精胺(spermine)在正常男性精液中的濃度約為 50-350mg/dL，其來源主要來自前列腺所分泌，是 精液味道的主要來源","C":"前列腺素(prostaglandin)最主要是經由儲精囊所 分泌，存在於前列腺主要有 A,D,E,F 四種類型，其 中 E group 大多存在於男性生殖系統中，而 F group 則存在於女性","D":"前列腺特異性抗原(prostate-specific antigen, PSA)在血液中以結合和為結合得形式循環，目前已 知的三種結合蛋白為 ACT, A2M 和 API","E":"前列腺特異性膜抗原（Prostate Specific Membrane Antigen, PSMA）在前列腺癌中被高度表 現，此外，在腎臟、腸道和神經系統中也可以看到 其蹤跡"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 11th edition, Ch102,Ch108","sourcePage":48},{"id":"2-048","category":"前列腺疾病含癌症","categoryOrder":2,"number":48,"question":"雌性素在前列腺肥大中有著一定的影響，下列何者不是 雌性素接受器乙型(Estrogen receptor-alpha)在前列 腺中的作用與特性？","options":{"A":"上皮鱗狀化生（epithelial squamous metaplasia）","B":"抗發炎(Anti-inflammatory)","C":"前驅分化(Prodifferentiation)","D":"在前列腺癌中表現失調(dysregulated in prostate cancer)","E":"在侷限型前列腺癌(organ-confined prostate cancer)中表現下降(under expression)"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th edition, Ch144","sourcePage":49},{"id":"2-049","category":"前列腺疾病含癌症","categoryOrder":2,"number":49,"question":"根據歐洲泌尿科醫學會(EAU)的前列腺癌治療指引，下 列臨床情境考慮到產生臨床上有意義的前列腺癌 (clinical significant prostate cancer)的機會，應 強烈考慮做前列腺切片手術(highly consider biopsy)?","options":{"A":"PSA density 0.1-0.15, PI-RADS 3","B":"PSA density 0.15-0.2, PI-RADS 3","C":"PSA density <0.1, PI-RADS 5","D":"PSA density 0.1-0.15, PI-RADS 4","E":"PSA density 0.15-0.2, PI-RADS 4"},"answer":"B","reference":"(111) 參考資料(摘錄自)： EAU guidelines on prostate cancer (March 2022 update) 5.2.4.2.6.3 Risk-stratification","sourcePage":49},{"id":"2-050","category":"前列腺疾病含癌症","categoryOrder":2,"number":50,"question":"下列何者不是前列腺癌細胞進展為去勢抗性 (castration resistance)可能的分子機制(molecular mechanism)?","options":{"A":"高度敏感(Hypersensitivity)模式","B":"雜交(Promiscuity)模式","C":"跳躍子(Transponse)模式","D":"旁路(Bypass)模式","E":"Lurker cell 模式"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 11th edition, Ch120","sourcePage":49},{"id":"2-051","category":"前列腺疾病含癌症","categoryOrder":2,"number":51,"question":"下列生長因子(growth factor)在前列腺肥大(Benign prostate hypertrophy)中，不具有細胞增生(cell proliferation)的作用?","options":{"A":"VEGF","B":"IGF","C":"TGF-ß","D":"EGF","E":"FGF-1"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 12th edition, Ch144","sourcePage":50},{"id":"2-052","category":"前列腺疾病含癌症","categoryOrder":2,"number":52,"question":"下列關於攝護腺癌以及相關的生物標記(biomarker)的 敘述何者正確?","options":{"A":"PSA 的半衰期是 7 天","B":"利用血液中 prostate cancer antigen 3 (PCA3) 與 PSA 的比值，可以用來預估 prostate cancer risk。","C":"在 SELECT trial 裡面，服用維他命 E 會增加 17% 攝護腺癌的風險","D":"PSA 是 kallikrein gene family 的一員，目前已知 PSA 為 human kallikrein peptidase 2 (hK2)","E":"5α-reductase inhibitors(5ARI) 在使用 12 個月 後，會減低血中的 PSA 大約 30%"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh 12th edition, Chapter 148, P3476, P3480-3481, P3485, P3489","sourcePage":50},{"id":"2-053","category":"前列腺疾病含癌症","categoryOrder":2,"number":53,"question":"在低風險(low-risk) 攝護腺癌的病人執行積極監控 (active surveillance)，下列何者正確?","options":{"A":"在長時間的追蹤，疾病局部惡化(local progression)導致尿路阻塞，尿液滯留以及腎水腫 是常見的","B":"延緩治療(delayed treatment)會使治療效果下降","C":"十年後，大約有 40%的病人會有需要積極治療 (definitive treatments)的徵兆","D":"十五年內，低度惡性(Low-grade)攝護腺癌的轉移 可能性大約 0.5%到 5%","E":"PSA 大於 10ng/mL 是轉移的預測因子"},"answer":"C","reference":"(111) Campbell-Walsh 12th edition, review 3 ed. Chapter 154. Active Surveillance of Prostate Cancer. 第二題","sourcePage":50},{"id":"2-054","category":"前列腺疾病含癌症","categoryOrder":2,"number":54,"question":"在攝護腺癌病人接受放射治療後復發 (radiorecurrence)，下列哪個因子不是接受拯救性攝 護腺切除(salvage prostatectomy)的理想條件?","options":{"A":"PSA< 10 ng/ml","B":"至少有 10 年餘命(life expectancy)","C":"經直腸切片證實復發","D":"檢查發現無遠端轉移","E":"陰性的骨盆淋巴結採樣"},"answer":"E","reference":"(111) Campbell-Walsh 12th edition, Chapter 160. P.3667","sourcePage":50},{"id":"2-055","category":"前列腺疾病含癌症","categoryOrder":2,"number":55,"question":"哪種染色體組型(karyotype)是最常見與先天性 5-alpha reductase deficiency 相關?","options":{"A":"45 XO","B":"46 XX","C":"46 XY","D":"47 XXY","E":"47,XY, ＋21"},"answer":"C","reference":"(111) AUA update series (2022) Lesson 12- 5-Alpha Reductase Inhibitor Therapy for Benign Prostatic Hyperplasia","sourcePage":51},{"id":"2-056","category":"前列腺疾病含癌症","categoryOrder":2,"number":56,"question":"下列關於去勢耐受性前列腺癌(CRPC)的敘述何者正確?","options":{"A":"Abiraterone 是一個 CYP17 inhibitor 會耗盡腎上 腺以及腫瘤內的 androgens。已經被核准使用在 nonmetastatic CRPC","B":"Pembrolizumab 是一個 PD-L1 inhibitor 已經核 准在 metastatic CRPC (mCRPC) 的病人 有 MSI-high 或是 MMR-deficient 表現型(phenotype) 上","C":"Radium-223 為 beta-emitting 的放射線藥物，目前 美國 FDA 核准其使用在 CRPC 併有有症狀骨轉移且 沒有內臟或大型淋巴結轉移的病人上","D":"在併用 antiandrogen 和 LHRH agonist 的病人身上, 停用 antiandrogen 會短暫造成 PSA 下降","E":"Docetaxel 的副作用常見者為 myelosuppression, fatigue, peripheral edema, nephrotoxicity"},"answer":"D","reference":"(111) Campbell-Walsh 12th edition Chapter 162. P3696, P3688, P3694, P3705","sourcePage":51},{"id":"2-057","category":"前列腺疾病含癌症","categoryOrder":2,"number":57,"question":"關於第二代雄激素受體阻斷劑(second-generation androgen receptor antagonists)，如 enzalutamide 及 apalutamide，下列敘述何者有誤?","options":{"A":"跟睪固酮一起競爭雄激素受體，屬於競爭型抑制","B":"除了阻止睪固酮與雄激素結合，也會阻止雄激素受 體從細胞質移入細胞核作用","C":"同樣也會阻止雄激素受體與 DNA 結合，阻止相對應 的基因啟動","D":"單獨服用 enzalutamide 可以降低血液中的睪固酮 濃度","E":"乳房脹痛是可能出現的副作用"},"answer":"D","reference":"(111) Campbell 12th 3673-3676","sourcePage":51},{"id":"2-058","category":"前列腺疾病含癌症","categoryOrder":2,"number":58,"question":"關於攝護腺癌合併骨轉移的治療建議，下列敘述何者為 真?","options":{"A":"Radium-223 已經被美國 FDA 核可使用在攝護腺癌合 併骨及淋巴轉移病患","B":"Denosumab 使用在荷爾蒙敏感型攝護腺癌 (hormone-sensitive prostate cancer, HSPC)合 併骨轉移的病人，已有隨機對照試驗證實可以延後 病患發生骨骼相關的併發症(skeletal-related events, SRE)","C":"如果攝護腺癌轉移至脊椎，壓迫到脊隨，建議靜脈 注射高劑量類固醇，緩解壓迫與水腫","D":"對於末期腎病變接受透析的病患，建議使用 Zoledronic acid，避免使用 denosumab","E":"使用 LHRH agonist 治療時，因為可以減少骨轉移 惡化導致病理性骨折，病患不需同時補充鈣質與維 生素 D"},"answer":"C","reference":"(111) Campbell 12th 3671-3706 NCCN Guideline, Prostate cancer 4.2022, MS-68","sourcePage":52},{"id":"2-059","category":"前列腺疾病含癌症","categoryOrder":2,"number":59,"question":"關於 localized prostate cancer 的風險分群(risk stratification group)，下列何者不在參考範圍內?","options":{"A":"Pathological T stage","B":"PSA","C":"Gleason Score","D":"Positive percentage of biopsy core","E":"PSA density"},"answer":"A","reference":"(111) Campbell 12th 3525-3526 NCCN Guideline, Prostate cancer 4.2022, MS-68","sourcePage":52},{"id":"2-060","category":"前列腺疾病含癌症","categoryOrder":2,"number":60,"question":"關於攝護腺癌接受根除性攝護腺切除手術，下列敘述何 者有誤?","options":{"A":"手術最好安排在切片手術 6~8 周後，或 TURP 12 周 後","B":"對於手術的三大目標，最重要的是癌症控制，其次 是保存性功能，再其次是避免尿失禁","C":"使用機械手臂輔助腹腔鏡攝護腺切除手術 (robot-assisted laparoscopic radical prostatectomy)比傳統開腹攝護腺切除手術(open radical prostatectomy)更有機會保留勃起功能","D":"關於腹腔鏡骨盆腔淋巴摘除手術(pelvic lymph node dissection)，經腹膜內的手術 (transperitoneal)方式並不能避免術後發生淋巴 囊腫(lymphocele)","E":"一般來講，使用機械手臂輔助腹腔鏡攝護腺切除手 術(robot-assisted laparoscopic radical prostatectomy)和傳統開腹攝護腺切除手術(open radical prostatectomy)兩者相比，術後病理顯示 positive surgical margin 的比例沒有顯著差異"},"answer":"B","reference":"(111) Campbell 12th 3564, 3570, 3583","sourcePage":52},{"id":"2-061","category":"前列腺疾病含癌症","categoryOrder":2,"number":61,"question":"關於攝護腺生理與相關疾病之相關敘述，何者為是？","options":{"A":"血中的 bioavailable testosterone 和血清 PSA 無 關，但和前列腺體積有正向相關性，且可以發現在 前列腺肥大之組織內 DHT 濃度比正常前列腺組織更 高","B":"前列腺發炎和往後前列腺癌之發生有相關性，而研 究發現一些特定病原菌會導致前列腺癌，如 Chlamydia trachomatis 和 human papillomavirus 之感染","C":"Finasteride 主要抑制 type 1 5α-reductase，在 high-grade cancer 中，使用該藥之族群的切片結 果有較差之腫瘤特徵，比如 more positive cores、 longer linear tumor length 和 more bilaterality","D":"目前有相當證據顯示前列腺肥大有家族性遺傳 性，且遺傳模式為 autosomal dominant inheritance pattern","E":"若切片只有 intraductal carcinoma (IDC) 而沒有 infiltrating carcinoma，則臨床上不應該直接進 入 definitive treatment（如前列腺根除手術）"},"answer":"D","reference":"(111) (A) Campbell Chapter 144, p 3306; 睪固酮、PSA、攝護腺體 積無相關聯；DHT 濃度在肥大組 織中濃度和正常組織相同 (B) Campbell Chapter 148, p 3461，沒有特定病源菌被確定和 前列腺癌相關 (C) Campbell Chap 144, p 3307, Chap 148, p3474；F 抑制 type 2，且有 favorable 切片結果 (D) Campbell Chapter 144, p 3311 (E) Campbell Chapter 151, p 3506，直接進入治療為合理","sourcePage":53},{"id":"2-062","category":"前列腺疾病含癌症","categoryOrder":2,"number":62,"question":"關於轉移性賀爾蒙敏感性攝護腺癌(metastatic hormone-sensitive prostate cancer, mHSPC)之敘述 和相關治療之研究，何者為是？","options":{"A":"Docetaxel+ADT 在 GETUG-AFU 15 和 CHARRTED 研究 皆證實比 ADT 組別有 overall survival benefit， 但在 low-volume disease 族群則無法看出 OS 差異","B":"在 LATITUDE 研究中的 high risk features 包含： Gleason score ≥8、 ≥4 個骨轉移（且至少一處為 非中軸骨轉移）、內臟轉移。若有兩者以上則歸屬 於 high risk mHSPC","C":"ENZAMET 和 ARCHES 研究皆證實了 enzalutamide 比 對照組有 overall survival 和 progression free survival 的 benefits，兩研究之對照組有些微差 異，ENZAMET 對照組為 ADT+antiandrogen；ARCHES 則是 ADT","D":"ARASENS 研究比較了 darolutamide+ADT 和 ADT 兩 組，使用 darolutamide 組別比對照組的死亡風險 下降了 32.5%，有顯著的 overall survival benefits","E":"Apalutamide 在 SPARTAN 試驗中亦證明其在 mHSPC 患者有 OS benefits，副作用上 rash 發生率比對照 組多，但整體 grade 3-4 之副作用發生率和對照組 相似"},"answer":"C","reference":"(111) (A) Campbell Chapter 161, p 3683, p3683, GETUG-AFU 15 沒 有證實 DOC 有 OS benefit (B) Campbell Chapter 161, p 3683，≥3 個骨轉移 (C) N Engl J Med . 2019 Jul 11;381 (2):121-131 & J Clin Oncol. 2019 Nov 10;37 (32): 2974-2986. (D) N Engl J Med . 2022 Mar 24;386(12):1132-1142.; 兩組 皆還接受 DOC 治療 (E ) J Clin Oncol . 2021 Jul 10;39(20):2294-2303 為 TITAN 試驗","sourcePage":53},{"id":"2-063","category":"前列腺疾病含癌症","categoryOrder":2,"number":63,"question":"關於前列腺癌的生物指標之敘述，何項為是？","options":{"A":"PSA 又稱 human kallikrein 3(hK3)，在血中約莫 7 成是以與其他蛋白質之結合型態，最多為與 α1-antichymotrypsin (ACT)結合，但此型態無法 被 PSA assay 偵測到","B":"PSA expression 受到 androgen 調控，惡性前列腺 癌細胞比正常的前列腺細胞能有顯著更多的 PSA 表 現量","C":"使用 5α-reductase inhibitors (5ARI)藥物會導 致血中 PSA 減少，但 free PSA 不變，導致 free/total PSA (%fPSA)會上升","D":"Prostate cancer antigen 3 (PCA3) 為 lone noncoding RNA，須先做前列腺按摩，再採集前段 尿液去做檢測，另外 PCA 3 數值與前列腺大小無關","E":"BRCA 1 和 BRCA 2 為 DNA repair genes，皆和前列 腺癌相關。兩者相比，BRCA 1 在前列腺癌症患者帶 原比例較高，且導致前列腺癌的風險亦比 BRCA 2 高"},"answer":"D","reference":"(111) (A) Campbell Chapter 149, p3480; PSA-ACT 可被偵測到 (B) Campbell Chapter 149, p3480；表現量相當 (C) Campbell Chapter 149, p3480；服用 5ARI，Fpsa%不變 (D) Campbell Chapter 149, p3485 (E) Campbell Chapter 148, p3460; BRCA 2 帶原率高且致病 風險更高","sourcePage":54},{"id":"2-064","category":"前列腺疾病含癌症","categoryOrder":2,"number":64,"question":"根據今年四月刊登在 The Lancet 的 PEACE-1 Trial，下 列何者正確 ?","options":{"A":"此研究為探討三聯療法(Triplet Therapy)用於轉 移性去勢抗性攝護腺癌(metastatic castration-resistance prostate cancer, mCRPC) 的結果","B":"用三聯療法對比賀爾蒙治療(Androgen deprivation therapy, ADT)加 Docetaxel，整體生 存率(overall survival)在轉移性 high burden, low burden 都有顯著差異","C":"用賀爾蒙治療和 Docetaxel，不論有無合併 Abiraterone，都有 4 成左右 3 級以上(Grade 3 or worse)不良事件(adverse events)產生","D":"用賀爾蒙治療和 Docetaxel，不論有無合併 Abiraterone，高血壓發生率都差不多","E":"用賀爾蒙治療, Docetaxel 合併 Abiraterone，不 會增加嗜中性白血球低下(neutropenia)發生率"},"answer":"E","reference":"(111) “Abiraterone plus prednisone added to androgen deprivation therapy and docetaxel in de novo metastatic castration-sensitive prostate cancer (PEACE-1): a multicentre, open-label, randomised, phase 3 study with a 2 × 2 factorial design” The Lancet (2022), volume 399, issue 10336, p1695-1707 (A) mCSPC (B) 只有 high burden 有 (C) With abiraterone: 63%, without abiraterone 52% (D) 高血壓發生率差距最大","sourcePage":54},{"id":"2-065","category":"前列腺疾病含癌症","categoryOrder":2,"number":65,"question":"關於神經內分泌攝護腺癌(neuroendocrine prostate cancer)的敘述，何者不正確?","options":{"A":"常以快速惡化的內臟轉移做表現，骨轉移以 osteolytic 為主","B":"腫瘤常表現有 parathyroid hormone-related protein (PTHrP)或者 somatostatin 的 receptor","C":"這類的病人攝護腺特異抗原(prostate specific antigen, PSA)通常不會升高","D":"可以考慮用 cisplatin 加 etoposide 或者 taxane 加 carboplatin 治療","E":"雖然預後相對不好，但化學治療和放射線療法合併 治療，存活通常超過 12 個月"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology (12th Edition), Chapter 162, P.3705 (E)存活通常不超過 12 個月","sourcePage":55},{"id":"2-066","category":"前列腺疾病含癌症","categoryOrder":2,"number":66,"question":"以下關於去勢抗性攝護腺癌(castration-resistant prostate cancer, CRPC)的敘述，何者錯誤?","options":{"A":"根據 SPARTAN trial，非轉移性去勢抗性攝護腺癌 (non-metastatic castration-resistant prostate cancer, nmCRPC)的病人，使用 apalutamide 加上雄性素剝奪療法(androgen deprivation therapy, ADT) 比起單用 ADT 治療， metastatic free survival 多出 24.3 個月","B":"根據 PROfound trial，針對轉移性去勢抗性攝護 腺癌(metastatic castration-resistant prostate cancer, mCRPC)，在接受新型荷爾蒙治 療(novel hormone therapy, NHT)的情況下仍然惡 化的病人，Olaparib 在 BRCA1, BRCA2,ATM 至少有 一種 mutation 的組別，比起控制組，overall survival 增加了 4.3 個月","C":"根據 VISION trial，對於 PSMA positive 的 mCRPC 病人，177Lu-PSMA-617 對於 radiographic progression-free survival (rPFS)有好處，且相 較於對照組 overall survival 增加 6 個月","D":"根據 AFFIRM trial, 使用 docetaxel 治療無效的 mCRPC 病人，使用 enzalutamide 加上 ADT 治療和對 照組相比，overall survival 多出約 5 個月","E":"根據 KEYNOTE-199 的結果，對於 PD-L1 positive 的 mCRPC 病人，如果使用 docetaxel、novel hormone therapy 等等治療都無效後，可以考慮使用 pembrolizumab 治療"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Apalutamide Treatment and Metastasis-free Survival in Prostate Cancer. N Engl J Med. 2018 Apr 12;378(15):1408-1418. Olaparib for Metastatic Castration-Resistant Prostate Cancer. N Engl J Med. 2020 May 28;382(22):2091-2102. Lutetium-177-PSMA-617 for Metastatic Castration-Resistant Prostate Cancer. N Engl J Med. 2021 Sep 16;385(12):1091-1103. Increased survival with enzalutamide in prostate cancer after chemotherapy. N Engl J Med. 2012 Sep 27;367(13):1187-97. Pembrolizumab for Treatment-Refractory Metastatic Castration-Resistant Prostate Cancer: Multicohort, Open-Label Phase II KEYNOTE-199 Study. J Clin Oncol. 2020 Feb 10;38(5):395-405 (C) overall survival 增加 4 個 月","sourcePage":55},{"id":"2-067","category":"前列腺疾病含癌症","categoryOrder":2,"number":67,"question":"關於攝護腺癌的敘述，以下何者有誤?","options":{"A":"如果父親有攝護腺癌的病史，得到攝護腺癌的機率 大約是一般人的兩倍","B":"HOXB13 基因的突變和早發性的家族性攝護腺癌有 關","C":"BRCA1 mutation 相較於 BRCA2 mutation 對於攝護 腺癌的影響較為惡性","D":"抽菸的人相較於未抽菸的攝護腺癌患者有較高機 率轉移或者復發，且有比較高的死亡率","E":"SPOP mutation 是最常見的點突變之一，在 6~15% 的原發性攝護腺癌都可以發現，常合併表現 CHD1 gene 的缺失"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology (11th Edition), Chapter 107, P.2546, 2547, 2551, 2557 (C) BRCA2 mutation 更傾向表現 higher grade, locally advanced, metastatic disease, worse cancer-specific and metastasis-free survival after prostatectomy","sourcePage":56},{"id":"2-068","category":"前列腺疾病含癌症","categoryOrder":2,"number":68,"question":"根據 prostate cancer NCCN Guidelines Version 4.2022，以下敘述何者有誤?","options":{"A":"攝護腺癌接受放射線療法後復發，如果病人平均餘 命大於 10 年可以考慮選擇 high-intensity focused ultrasound (HIFU)治療","B":"根據最新版的 NCCN guidelines, high risk 的病 人如果平均餘命大於 5 年可以考慮體外放射治療 (external beam radiation therapy, EBRT) 加上 雄性素剝奪療法(androgen deprivation therapy, ADT) 2 年合併使用 abiraterone 治療","C":"針對 very high risk 的病人可以考慮體外放射治 療 (EBRT) 加上雄性素剝奪療法(ADT) 2 年加上 6 個 cycle 的 Docetaxel 化學治療","D":"接受過 Docetaxel 和 abiraterone 治療的轉移性去 勢療法無效攝護腺癌(metastatic castration-resistant prostate cancer, mCRPC) 病人，如果 PSMA-positive 可以接受 177Lu-PSMA-617 治療，證據等級 1","E":"曾經接受過 abiraterone 治療的轉移性去勢療法無 效前列腺癌(mCRPC)患者，如果有 BRCA mutation 可以考慮接受 rucaparib 治療"},"answer":"B","reference":"(111) 參考資料(摘錄自)：prostate cancer NCCN Guidelines Version 4.2022 — May 10, 2022 (B) very high risk","sourcePage":56},{"id":"2-069","category":"前列腺疾病含癌症","categoryOrder":2,"number":69,"question":"下列關於前列腺癌標記物的描述中，哪一項是錯誤的?","options":{"A":"45 至 55 歲男性的 PSA 中位數約為 0.7 ng/mL，對 於 PSA 低於 1.0 ng/mL 的男性來說，未來 25 年內 進展為前列腺癌的風險極低","B":"PCA3 是一種非編碼的前列腺專一性 mRNA，主要在 前列腺癌細胞中過度表現","C":"SelectMDx 測試是通過測量 HOXC6 和 DLX1 mRNA 的 水平來預測前列腺癌風險","D":"PSA 蛋白異構體的檢測包括總量 PSA，游離型 PSA， 單純 PSA，以及 hK2 的組合測試","E":"PSA 增速（PSAV）是指 PSA 水平在固定時間內的變 化，並且可以確定一個人是否有前列腺癌"},"answer":"E","reference":"(112)參考資料(摘錄自)： Development, Molecular Biology, and Physiology of the Prostate Campbell-Walsh-Wein Urology, 143, 3274-3304.e9","sourcePage":57},{"id":"2-070","category":"前列腺疾病含癌症","categoryOrder":2,"number":70,"question":"下列哪一種前列腺癌的生物標記 (biomarker)為美國 FDA 核准使用尿液檢測？","options":{"A":"prostate cancer antigen 3 (PCA3)","B":"4k score","C":"prostate specific membrane antigen (PSMA)","D":"androgen receptor splice variant 7 (AR-V7)","E":"− 2proPSA"},"answer":"A","reference":"(112)參考資料(摘錄自)： 解題說明請註明 1. Campbell-Walsh-Wein Urology 2. 12th edition, 2021 3. Chapter 149 p3485","sourcePage":57},{"id":"2-071","category":"前列腺疾病含癌症","categoryOrder":2,"number":71,"question":"有關腹腔鏡/機器人手臂輔助根治性攝護腺切除術 (laparoscopic/robotic assisted radical prostatectomy, LRP/RARP)的敘述，下列何者錯誤?","options":{"A":"Denonvilliers fascia 坐落在攝護腺與直腸之 間，是 peritoneal cul-de-sac 向下延伸所形成， 為剝除攝護腺後方的重要解剖構造","B":"為了保持病人術後的 Erectile function, 術中要 盡量保留病人攝護腺下外側 Neurovascular Bundle","C":"在做 Deep vein complex (DVC) suture 時，若太 靠近攝護腺前方可能造成 iatrogenic positive margin，此時可考慮提高 CO2 充氣壓力至 20mmHg 並重新做 DVC suture","D":"依據 European urology 2021 年 RARP 的研究，Hood technique 與其他 Anterior approach 比較，有較 佳的 Early return of continence rate 且一年之 後也有明顯較佳的 continence rate","E":"Hood technique 保留了 Arcus tendinous, Puboprostatic ligament, Anterior vessels, Fibers of the detrusor muscle，但不適合用在 Anterior tumor location 之病人"},"answer":"D","reference":"(112)參考資料(摘錄自)： Campbell 12 edition, chapter 156, p3574-3576 European Urology Volume 80, Issue 2, August 2021, Pages 213-221","sourcePage":57},{"id":"2-072","category":"前列腺疾病含癌症","categoryOrder":2,"number":72,"question":"下列有關攝護腺癌荷爾蒙藥物的藥物機制配對何者正 確?","options":{"A":"GnRH agonist: Leuprolide, Abarelix, Goserelin","B":"GnRH antagonists: Degarelix, Oreteronel (TAK-700)","C":"Adrenal-targeting drugs: Ketoconazole, Abiraterone","D":"First-generation AR antagonists: Galeterone, Bicalutamide","E":"Second-generation AR antagonists: Enzalutamide, Abiraterone"},"answer":"C","reference":"(112)參考資料(摘錄自)： Campbell 12 edition, chapter 1 61, p3673, table 161.1","sourcePage":58},{"id":"2-073","category":"前列腺疾病含癌症","categoryOrder":2,"number":73,"question":"關於攝護腺內分泌的敘述何者正確?","options":{"A":"在體內 Testosterone 變成 dihydrotestosterone (DHT) 是可逆反應","B":"給予 testosterone 賀爾蒙治療會降低血清中 sex hormone–binding globulin (SHBG) levels","C":"Estrogen 會與 testosterone 競爭結合 SHBG，但因 為 Estrogen 結合力僅 testosterone 的 1/3，所以 給予 Estrogen 不會造成 free testosterone 下降","D":"Finasteride 是 type 1 inhibitor of 5-α reductase","E":"5α 還原酶 (5α-reductase isoforms)能使 testosterone 轉換成 DHT，在前列腺中最主要的 第 1 亞型 (type 1)"},"answer":"B","reference":"(112)參考資料(摘錄自)： C ampbell 12 edition, chapter 143, p.3280-3287","sourcePage":58},{"id":"2-074","category":"前列腺疾病含癌症","categoryOrder":2,"number":74,"question":"下列關於攝護腺超音波及經直腸攝護腺切片的敘述何 者錯誤?","options":{"A":"通常超音波下 cystic lesion 靠近中央的為 Müllerian duct cysts，靠近雙側的則為 Wolffian cysts","B":"在超音波下多數的攝護腺癌為 hypoechoic lesions，但有約莫 39%的癌症為 isoechoic，甚至 有 1%為 hyperechoic lesion","C":"凝血異常、嚴重的免疫低下、急性攝護腺炎皆為經 直腸攝護腺切片的禁忌症","D":"切片前常規做清腸可提供更好的超音波視野，但沒 有明確的證據顯示可降低感染的風險","E":"切片前預防性的抗生素可考慮針劑的 fluoroquinolones, first-, second-, third-generation cephalosporins 或 aminoglycoside"},"answer":"E","reference":"(112)參考資料(摘錄自)： Campbell Walsh Urology, 12th edition, 2020, Volume III, Chapter 150, p.3494-3500","sourcePage":58},{"id":"2-075","category":"前列腺疾病含癌症","categoryOrder":2,"number":75,"question":"下列關於攝護腺癌的敘述何者錯誤？","options":{"A":"一般而言腫瘤大小和其期別呈正相關，小於 0.5 cm3 的腫瘤很少會有 EPE (Extraprostatic extension) 且小於 4 cm3 的腫瘤很少會侵犯儲精囊 (seminal vesicle invasion)或淋巴結轉移(lymph node metastases)","B":"有較高的 tertiary Gleason score 的腫瘤 有較高的遠端轉移機率","C":"淋巴結轉移的機率在 Gleason score 為 3+3=6, 3+4=7, 4+3 =7 的腫瘤分別為 0%, 0.6%, 4.3%，因此一般認為 Gleason score 小於 8 分的腫 瘤不容易有淋巴結的轉移","D":"因攝護腺在 apex、base、anteriorly 缺少 capsule，extraprostatic extension 相較於 capsular invasion 是更好的描述","E":"Prostatic duct adenocarcinomas 可視為 Gleason score = 8 的腫瘤因兩者有類似的 morphologic features 及 prognosis"},"answer":"B","reference":"(112)/2.前列腺疾病含癌症/ 參考資料(摘錄自)：Campbell Walsh Urology, 12th edition, 2020, Volume III, Chapter 151","sourcePage":59},{"id":"2-076","category":"前列腺疾病含癌症","categoryOrder":2,"number":76,"question":"下列針對攝護腺癌雄性素抑制劑的敘述何者錯誤？","options":{"A":"Aminoglutethimide 是一種雄性素的類似物，會對 下視丘跟腦下垂體產生負迴饋作用（negative feedback），導致促性腺激素釋放降低，進而降低 睪丸雄性激素的生成","B":"Ketoconazole 可以用在治療攝護腺癌，其作用機轉 是阻斷 17,20-desmolase，進而限制 steroid 間的 轉換","C":"Ketoconazole 在降低睪固酮的效果上非常好，但在 達到去勢值後，就算持續使用也很容易有回升的現 象發生","D":"Ketoconazole 的治療應常規搭配 hydrocortisone 一起使用 Abiraterone 是藉由抑制 cytochrome P17 （CYP17）酵 素，來達到降低雄性素之生成，使用上要小心 ACTH 上 升的代償作用","E":"Abiraterone是藉由抑制cytochrome P17（CYP17）酵素，來達到降低雄性素之生成，使用上要小心ACTH上升的代償作用"},"answer":"A","reference":"(112)/2.前列腺疾病含癌症/參 考資料(摘錄自)： Campbell 12th, Chap 161, P. 3677 (A) Aminoglutethimide inhibits conversion of cholesterol to pregnenolone, an early step in steroidogenesis. Aminoglutethimide blocks production of aldosterone and cortisol. (B) ketoconazole is a nonselective P450-dependent pathway inhibitor. Its use in prostate cancer is blocking 17,20-desmolase, limiting the conversion of C21 to C19 steroids (e.g., DHEA-S and androstenedione) (C) Although ketoconazole is effective in rapidly bringing testosterone levels into the castrate range, with continuous treatment in the otherwise hormonally intact individual (no other surgical or chemical ADT), testosterone levels begin to rise and can reach low-normal ranges within 5 months of therapy (D) Because of non-androgenic adrenal suppression, ketoconazole must be given with hydrocortisone (E) P. 3677, abiraterone suppress cortisol and androgen production but has the potential for a compensatory rise in ACTH","sourcePage":59},{"id":"2-077","category":"前列腺疾病含癌症","categoryOrder":2,"number":77,"question":"根據 PROfound 試驗，轉移性去勢抗性前列腺癌 (metastatic castration-resistant prostate cancer) 給予 Olaparib，有下列哪一種基因突變之病患療效最 佳？","options":{"A":"BRCA1","B":"BRCA2","C":"ATM","D":"BARD1","E":"CDK12"},"answer":"B","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)： 解題說明請註明 1. NEJM 2. 2020 3. 382 2091-2102","sourcePage":60},{"id":"2-078","category":"前列腺疾病含癌症","categoryOrder":2,"number":78,"question":"下列關於 anti-CTLA4、PD-1/PD-L1 Blockade 於攝護腺 癌應用，何者最不適當？","options":{"A":"雖然攝護腺癌細胞表現 PD-L1，但浸潤在攝 護腺的 CD8 T cell 不表現 PD-1","B":"參與 PD-1/PD-L1 blockade 研究的病人，大 多都已先接受過其他治療","C":"使用過 enzalutamide 後，攝護腺癌細胞 PD-L1 表現會增加","D":"CheckMate 650 是針對轉移且荷爾蒙拮抗攝護腺癌 (metastatic castration-resistant prostate cancer; mCRPC)，anti-PD-1 及 anti-CTLA4 分別為 nivolumab 1 mg/kg 及 ipilimumab 3 mg/kg","E":"CheckMate 650 中，anti-CTLA4/ anti-PD-1 治療下，pre-chemotherapy cohort 在觀察 期間的 objective response rate 為 25%， post-chemotherapy 則為 10%"},"answer":"A","reference":"(112)/2. 前列腺疾病含癌症/ 參考資料(摘錄自)： 第 12 版 Campbell, chapter 61,p1343; Sharma P, Pachynski RK, Narayan V, Fléchon A, Gravis G, Galsky MD, Mahammedi H, Patnaik A, Subudhi SK, Ciprotti M, Simsek B, Saci A, Hu Y, Han GC, Fizazi K. Nivolumab Plus Ipilimumab for Metastatic Castration-Resistant Prostate Cancer: Preliminary Analysis of Patients in the CheckMate 650 Trial. Cancer Cell. 2020 Oct 12;38(4):489-499.e3. doi: 10.1016/j.ccell.2020.08.007 . Epub 2020 Sep 10. PMID: 32916128. (B)(C)(D)(E)對。 (A)錯，護腺癌細胞一般不表現 PD-L1，但浸潤在攝護腺的 CD8 T cell 會表現 PD-1。","sourcePage":60},{"id":"2-079","category":"前列腺疾病含癌症","categoryOrder":2,"number":79,"question":"關於晚期前列腺癌的治療以下哪一種說法是正確的？","options":{"A":"LHRH 拮抗劑會先導致血清中的睪固酮濃度升高，然 後下降","B":"在美國，使用 LHRH 促動劑作為起始的雄激素阻斷 療法是罕見的","C":"對於具荷爾蒙抗性前列腺癌的不同療法策略的最 佳順序，有明確的臨床數據為依據","D":"在經過根治性前列腺切除術並發現有淋巴結侵犯 的患者中，早期荷爾蒙治療已被證明能明確的提高 生存率","E":"化療藥物如多西紫杉醇會使 PSA 的血漿濃度下降 約 50％"},"answer":"D","reference":"(112) /2. 前列腺疾病含癌症/ 參考資料(摘錄自)：Smith & Tanagho's General Urology, 19e Chapter 21: Cancer of the Prostate Gland","sourcePage":61},{"id":"2-080","category":"前列腺疾病含癌症","categoryOrder":2,"number":80,"question":"根據 PCPT 研究，哪一項關於 PSA 檢測和前列腺癌風險 的敘述是正確的？","options":{"A":"PSA 值在 4 ng/mL 以下的人士，無論年齡，前列 腺癌的風險皆為零","B":"45 至 55 歲男性的 PSA 中位數約為 0.7 ng/mL，對 於 PSA 低於 1.0 ng/mL 的男性來說，未來 25 年內 進展為前列腺癌的風險極低","C":"PSA 值的增加不會使前列腺癌的風險增加","D":"PSA 值一直是一個絕對的閾值，對於評估前列腺癌 風險沒有任何變化","E":"PSA 水平低於特定閾值的，前列腺癌風險為零"},"answer":"B","reference":"(112) /2. 前列腺疾病含癌症/ 參考資料(摘錄自)： Smith & Tanagho's General Urology, 19e Chapter 21: Cancer of the Prostate Gland","sourcePage":61},{"id":"2-081","category":"前列腺疾病含癌症","categoryOrder":2,"number":81,"question":"下列關於前列腺發育的描述，何者正確？","options":{"A":"5α-還原酶在尿道旁神經基質(UGM)中將睪固酮轉 換為雌激素","B":"前列腺的發育完全依賴於陰莖的生長","C":"胎兒時期男性血液中高水平的睪固酮會觸發前列 腺的發育","D":"前列腺的發育只能在基因性別為男性的情況下發 生","E":"前列腺芽嚢在尿道旁神經上皮（UGE）的特定位置 形成，這些機制尚未被完全理解"},"answer":"C","reference":"(112) /2. 前列腺疾病含癌症/ 參考資料(摘錄自)： Development, Molecular Biology, and Physiology of the Prostate Campbell-Walsh-Wein Urology, 143, 3274-3304.e9","sourcePage":62},{"id":"2-082","category":"前列腺疾病含癌症","categoryOrder":2,"number":82,"question":"下列有關前列腺切片相關的敘述何者正確？","options":{"A":"經會陰部切片相較經直腸切片，術後產生感染機率 較低","B":"經會陰部切片相較經直腸切片，較難偵測 apical lobe cancer","C":"mpMRI 主要使用 T1 weighted image, dynamic contrast enhancement 及 diffusion weighted imaging 判讀可疑病灶","D":"mpMRI 檢查時使用 1Tesla 磁場強度之 MRI 設備","E":"Saturation prostate biopsy 定義為切片超過 12 針"},"answer":"A","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)： 解題說明請註明 1. Campbell-Walsh-Wein Urology, 12th edition, 2021; Chapter 150; p3495-3504 EAU Guideline on Urological Infections, updated 2023","sourcePage":62},{"id":"2-083","category":"前列腺疾病含癌症","categoryOrder":2,"number":83,"question":"針對前列腺癌病患之使用藥物，下列何者須併用口服類 固醇?","options":{"A":"Apalutamide","B":"Enzalutamide","C":"Darolutamide","D":"Abiraterone Olaparib","E":"Olarparib"},"answer":"D","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)： 解題說明請註明 1. Campbell-Walsh-Wein Urology 2. 12th edition, 2021 3. Chapter 161 p3671-3678","sourcePage":62},{"id":"2-084","category":"前列腺疾病含癌症","categoryOrder":2,"number":84,"question":"下列有關前列腺小細胞癌(small cell carcinoma)之敘 述何者錯誤？","options":{"A":"平均存活小於一年","B":"治療首選為化學治療","C":"小細胞癌的格里森氏分級為 5","D":"常發生臟器轉移 (visceral metastasis)","E":"治療選項可比照肺小細胞癌"},"answer":"C","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)： 解題說明請註明 1.Campbell-Walsh-Wein Urology, 12th edition, 2021; Chapter 151; p3512 2.NCCN Guideline for prostate cancer, Version 1.2023","sourcePage":62},{"id":"2-085","category":"前列腺疾病含癌症","categoryOrder":2,"number":85,"question":"一位 68 歲男性罹患攝護腺癌併轉移至腰椎 L2-L5，主訴 骨頭極為疼痛，脊椎核磁共振檢查發現上述病灶，有輕 微骨髓壓迫之情形，此時最好之緊急治療為?","options":{"A":"LH-RH agonist","B":"Anti-androgen monotherapy","C":"LH-RH antagonist","D":"Oral estrogen","E":"Combination LH-RH agonist and anti-androgen"},"answer":"C","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)：Campbell Urology Ed12, chapter 161, page 3678-3679 BJUI 2008:102 1531-1538","sourcePage":62},{"id":"2-086","category":"前列腺疾病含癌症","categoryOrder":2,"number":86,"question":"眾所皆知攝護腺特異抗原 Prostate-Specific Antigen (PSA)是臨床上非常重要用來診斷攝護腺癌之血清標 記，下列有關其敘述，何者為非?","options":{"A":"PSA 又名 hk3 (protein)","B":"PSA 又名 KLK3 (gene)","C":"molecular weight (KD) 33-36","D":"具有 serine protease 之功能，所以可讓精液凝固","E":"具有 arginine esterase 功能，所以可分解胺基酸"},"answer":"D","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)：Campbell Walsh Urology, ed12, 2021 P3298","sourcePage":63},{"id":"2-087","category":"前列腺疾病含癌症","categoryOrder":2,"number":87,"question":"前列腺素(prostaglandins)之敘述，下列何者為非?","options":{"A":"人類前列腺素係由攝護腺分泌後，儲存在儲精囊","B":"前列腺素有超過 90 種不同亞型","C":"它主要被分為四種亞型，A、B、E、F","D":"它具有眾多的藥理及生理功能","E":"PGE 被廣泛用在勃起功能異常的診斷及治療"},"answer":"A","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh Urology ed12 3296","sourcePage":63},{"id":"2-088","category":"前列腺疾病含癌症","categoryOrder":2,"number":88,"question":"一位 72 歲男性罹患臨床分期，T2bNoMo， Gleason 8 (4+4) 攝護腺癌，其血清 PSA 為 7.8 ng/ml。接受 78 Gy external beam 放射線治療，追蹤後 PSA 谷底(nadir) 為 0.8 ng/ml。治療 6 個月後無任何症狀，但 PSA 升高 至 6.5 ng/ml，一週後 PSA 則為 7.0 ng/ml，其最可能 解釋的臨床狀況為","options":{"A":"攝護腺梗塞","B":"放射線導致之攝護腺發炎","C":"PSA 反彈 (bounce)效應","D":"追蹤時間不夠之結果","E":"攝護腺癌持續擴大"},"answer":"E","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh Urology ed11 2015, vol 3, chap 119 P2778","sourcePage":63},{"id":"2-089","category":"前列腺疾病含癌症","categoryOrder":2,"number":89,"question":"一位 70 歲男性攝護腺癌 T2bNoMo，一週前接受徹底攝護 腺切除術，拔完尿管後發生嚴重排尿疼痛，尿液培養出 enterococcus faecalis (但他對 penicillin 過敏)， 此時最好的藥物為?","options":{"A":"ciprofloxacin","B":"gentamicin","C":"clindamycin","D":"nitrofurantoin","E":"cephalexin"},"answer":"D","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)： Campbell-Walsh Urology ed11 2015, chapter 12, p256","sourcePage":63},{"id":"2-090","category":"前列腺疾病含癌症","categoryOrder":2,"number":90,"question":"在最新的 TALAPRO2 trial 之中 Talazoparib plus enzalutamide in men 在第一線使用對於哪種攝護腺癌 的存活率有明顯的提升","options":{"A":"mCRPC","B":"nmCRPC","C":"mHSPC","D":"HSPC","E":"以上皆是"},"answer":"A","reference":"(112)/ 2.前列腺疾病含癌症/參 考資料(摘錄自)： Agarwal N, Azad AA, Carles J, et al. Talazoparib plus enzalutamide in men with first-line metastatic castration-resistant prostate cancer (TALAPRO-2): a randomised, placebo-controlled, phase 3 trial [published online ahead of print, 2023 Jun 2]. Lancet. 2023;S0140-6736(23)01055-3.","sourcePage":64},{"id":"2-091","category":"前列腺疾病含癌症","categoryOrder":2,"number":91,"question":"High BMI 與下列哪一項相關？","options":{"A":"對氧化壓力的保護","B":"較高的 circulating androgens","C":"low 血清 PSA level","D":"在全切前列腺切除術後有較好的癌症特異 性生存率","E":"較低的 free IGF-1 level"},"answer":"C","reference":"(112) / 2.前列腺疾病含癌症/ 參考資料(摘錄自)： 解題說明請註明 第 12 版 Campbell,chapter 148, p3466","sourcePage":64},{"id":"2-092","category":"前列腺疾病含癌症","categoryOrder":2,"number":92,"question":"Prostate tumors defined by mutations in the SPOP gene and overexpression of SPINK1:","options":{"A":"可能也包含 ETS family gene fusions","B":"常常存在 hypermethylated","C":"在非洲裔美國男性中更常見","D":"與 lower Gleason scores","E":"占所有前列腺癌的 25%"},"answer":"C","reference":"(112) / 2.前列腺疾病含癌症/ 參考資料(摘錄自)： 解題說明請註明 第 12 版 Campbell,chapter 148, p3469","sourcePage":64},{"id":"2-093","category":"前列腺疾病含癌症","categoryOrder":2,"number":93,"question":"在兩個大型隨機對照試驗，(Prostate Cancer Prevention Trial [PCPT] and Reduction by Dutasteride of Prostate Cancer Events [REDUCE]), 5ARIs in healthy men 會導致","options":{"A":"嚴重的副作用，導致較高的退出率","B":"對於與良性前列腺增生（BPH）的症狀沒有 改善","C":"high-grade cancers，導致前列腺癌相關死 亡率和總死亡率較高","D":"比服用安慰劑的人有更高的 higher rates of biopsy","E":"得到前列腺癌的風險降低 25%"},"answer":"E","reference":"(112)/2.前列腺疾病含癌症/參 考資料(摘錄自)： 解題說明請註明 第 12 版 Campbell,chapter 148, p3473","sourcePage":64},{"id":"2-094","category":"前列腺疾病含癌症","categoryOrder":2,"number":94,"question":"下列關於 Sipuleucel-T 攝護腺癌疫苗(vaccine for prostate cancer)，何者最不適當?","options":{"A":"治療機轉是藉由體外刺激培養出來的樹突 細胞(Dendritic cells; DC)來彌補體內機 能失調的樹突細胞","B":"Sipuleucel-T 是第一個被美國 FDA 准許使 用在實質固態瘤(solid tumor)的癌症疫苗 (cancer vaccine)，在攝護腺癌，主要用於 轉移且荷爾蒙拮抗(metastatic castration-resistant prostate cancer; mCRPC)","C":"Sipuleucel-T 製作時，周邊血液單核細胞 (Peripheral blood mononuclear cells)須 與 PAP2024 蛋白一起培養，藉此使分泌前列 腺酸性磷酸酶(Target antigen prostatic acid phosphatase)的癌細胞與顆粒球巨噬 細胞聚落刺激因(Granulocyte-macrophage colony-stimulating factor; GM-CSF)產生 連結","D":"Sipuleucel-T 製作時，顆粒球巨噬細胞聚落 刺激因子(Granulocyte-macrophage colony-stimulating factor; GM-CSF)的作 用是輔助激發樹突細胞 (Dendritic cells; DC)","E":"根據 NCCN guideline prostate cancer 2023 V1，mCRPC 病人已接受過 docetaxel 治療無 效且有臟器轉移，若其預期存活大於 6 個 月，可建議 Sipuleucel-T 治療"},"answer":"E","reference":"(112)/2. 前列腺疾病含癌症/ 參考資料(摘錄自)： 第 12 版 Campbell, chapter 61 第一段；NCCN guideline for prostate cancer 2023 V1, PROS 15A (A)(B)(C)(D)對。 (E)錯；visceral metastasis 的 病人並不建議。","sourcePage":65},{"id":"2-095","category":"前列腺疾病含癌症","categoryOrder":2,"number":95,"question":"下列關於雄性激素剝奪治療(Androgen deprivation therapy; ADT)於攝護腺癌應用，何者最不適當?","options":{"A":"在攝護腺根除術前打 ADT，會發現攝護腺內 CD8 T cell infiltration 增加","B":"ADT 對攝護腺免疫微環境是促進發炎 （pro-inflammation）","C":"在小鼠上發現，ADT 可透過恢復 thymus 的大 小及細胞密度來增加免疫系統中的 T cell","D":"在 ADT 前使用 Sipuleucel-T，可使 CD8 T cell 對抗原反應增加","E":"在 ADT 前使用 Sipuleucel-T 的病人中觀察 到，不少人恢復睪固酮同時又維持低 PSA 值"},"answer":"A","reference":"(112)/2. 前列腺疾病含癌症/ 參考資料(摘錄自)： 第 12 版 Campbell, chapter 61, p1344 (B)(C)(D)(E)對。 (A)錯，是 CD4 T cell","sourcePage":65},{"id":"2-096","category":"前列腺疾病含癌症","categoryOrder":2,"number":96,"question":"根據 AUA/SUO Guideline (2023)，下列何者非 grade A?","options":{"A":"在 de novo 的 metastatic hormone-sensitive prostate cancer (mHSPC), 治療可以 ADT 加上 darolutamide","B":"在 metastatic hormone-sensitive prostate cancer (mHSPC), 可使用 ADT 加 上 androgen pathway directed therapy (abiraterone acetate plus prednisone, apalutamide, enzalutamide)","C":"在 metastatic hormone-sensitive prostate cancer (mHSPC), 可使用 ADT 加 上 chemotherapy (docetaxel)","D":"對新診斷的 metastatic castration-resistant prostate cancer (mCRPC) 且未曾接受過 androgen receptor pathway inhibitors 治療, 可繼續 ADT 外再 加上 abiraterone acetate plus prednisone","E":"對新診斷的 metastatic castration-resistant prostate cancer (mCRPC) 且未曾接受過 androgen receptor pathway inhibitors 治療, 可繼續 ADT 外 再加上 enzalutamide"},"answer":"A","reference":"(112)/2. 前列腺疾病含癌症/ 參考資料(摘錄自)： Lowrance W, Dreicer R, Jarrard DF, et al. Updates to Advanced Prostate Cancer: AUA/SUO Guideline (2023). J Urol. 2023;209(6):1082-1090. doi:10.1097/JU.000000000000 3452 (B)(C)(D)(E)對。 (A)錯，darolutamide只有 grade B。","sourcePage":66},{"id":"2-097","category":"前列腺疾病含癌症","categoryOrder":2,"number":97,"question":"Estrogen 在生成 BPH（良性攝護腺增生）的病生理上佔 有重要的角色，針對 Estrogen receptor（ER）與攝護 腺作用的敘述，下列何者錯誤？","options":{"A":"ER-α 表現於攝護腺間質細胞上（Stromal cells），而 ER-β 表現於攝護腺表皮細胞 （epithelial cells）","B":"ER-α 與 ER-β 的表現皆為促進組織增生， 但作用的位置不一樣","C":"ER-α 的表現會造成表皮細胞的分化不良 （Dysplasia）","D":"ER-β 的表現有抗發炎與抗氧化的效果","E":"若發生攝護腺癌，ER-α 與 ER-β 都會發生失調 （Dysregulated）之情形"},"answer":"B","reference":"(112) / 2. 前列腺疾病含癌症/ 參考資料(摘錄自)： Campbell 12th, Chap 144, P 3308 (B) ER-β 會抑制增生 （Antiproliferative）","sourcePage":66},{"id":"2-098","category":"前列腺疾病含癌症","categoryOrder":2,"number":98,"question":"關於 5α-reductase 的敘述何者錯誤？","options":{"A":"在攝護腺的生理學中，5α-reductase 的基因表現 不僅受攝護腺調控，也會受肝臟調控","B":"5α-Reductase 在人類可分為 type 1 與 type 2 兩 種。Type 1 位於第二對染色體上，type 2 位於第 五對染色體上","C":"Type 1 的 5α-Reductase 與 type 2 的 5α-Reductase 的半衰期差不多，都是 20-30 小時 左右","D":"Type 1 的 5α-Reductase 會出現在皮膚或是頭皮 上，其作用會影響毛髮生成 常用的 5α-Reductase inhibitor “finasteride” 是抑制 Type 2 的 5α-Reductase，而 dutasteride 是 type 1、type 2 都抑制","E":"常用的5α-Reductase inhibitor \"finasteride\"是抑制Type 2的5α-Reductase，而dutasteride是type 1、type 2都抑制"},"answer":"B","reference":"(112) / 2. 前列腺疾病含癌症/ 參考資料(摘錄自)： Campbell 12th Chap 144, P. 3287 (A) In prostate physiology, expression of the 5α-reductase gene is regulated by androgens in the prostate and liver. (B) Type 1 位於第五對染色體 上，Type 2 位於第二對染色體 (C) P. 3287 TABLE 143.3 (D) The type 1 enzyme is in the skin and in the adult scalp and is believed to be involved in hair formation (E) The 5α-reductase inhibitors finasteride (type 2 inhibitor) and dutasteride (type 1 and 2 inhibitor) are clinically useful drugs in the treatment of BPH and male pattern baldness when they are given to appropriate patients.","sourcePage":67},{"id":"2-099","category":"前列腺疾病含癌症","categoryOrder":2,"number":99,"question":"下列有關 metastatic castration-resistant prostate cancer (mCRPC)之敘述何者錯誤?","options":{"A":"不適合接受 Docetaxol 治療的病人可選擇 Radium-223 治療，不只治療骨頭疼痛也延長 overall survival","B":"化學治療中，只有接受間隔每三周一次的 Docetaxel 治療之病人，才有 survival 的效 果","C":"目前沒有任何化學治療在使用過 cabazitaxel,的病人身上可改善 survival 或是改善 Quality of life","D":"若病人接受過 androgen receptor-directed therapy 以及 taxane-based chemotherapy 並合併有 BRCA1 or BRCA2 mutation 可考慮使用 Rucaparib","E":"Phase III clinical trial 中 Sipuleucel-T 在 treatment-arm 組別可以提升平均 survival 4.1 個月，且可使用在 neuroendocrine prostate cancer"},"answer":"E","reference":"(112)/ 2.前列腺疾病含癌症/參 考資料(摘錄自)： NCCN guideline, Prostate cancer, Version 1.2023, PROS-J","sourcePage":67},{"id":"2-100","category":"前列腺疾病含癌症","categoryOrder":2,"number":100,"question":"下列關於 intermediate risk 的攝護腺癌治療與追蹤， 何者正確?","options":{"A":"根據 NCCN guidelines，Unfavorable intermediate risk group，若預期 餘命 5-10 年，可考慮 EBRT+brachytherapy+ADT 2-3 年","B":"Favorable intermediate risk group 可 routine 使用 ADT 或 antiandrogen therapy。","C":"Favorable intermediate risk group 可選擇 Active surveillance，可考慮 6 個月做一次 mpMRI 監測癌症狀況","D":"Favorable intermediate risk group 病人接受攝 護腺切除(RP)後，PSA recurrence，影像學無發現 遠端轉移或骨盆腔復發，此時加上 EBRT 治療會比 單純監測還要好","E":"(Unfavorable intermediate risk group 68 歲男性可以考慮 RP+ PLND 或 EBRT + brachytherapy + ADT 或積極監測"},"answer":"D","reference":"(112)/ 2.前列腺疾病含癌症/參 考資料(摘錄自)： NCCN guideline, Prostate cancer, Version 1.2023, PROS-5, PROS-6","sourcePage":68},{"id":"2-101","category":"前列腺疾病含癌症","categoryOrder":2,"number":101,"question":"下列哪一個基因的基因多型性與攝護腺癌無關？","options":{"A":"CYP1B1","B":"CVP19","C":"UGT1A1","D":"CVP19A1","E":"UGT19A1"},"answer":"E","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)： 1. Campbell 2. 第 12 版、2021 3. Chapter 148 3463 頁","sourcePage":68},{"id":"2-102","category":"前列腺疾病含癌症","categoryOrder":2,"number":102,"question":"下列關於使用於攝護腺癌的近接治療(brachytherapy) 所使用的放射性射源的種類及特性，何者錯誤？","options":{"A":"碘-125 半衰期為 59.6 天","B":"碘-125 發出的 X 射線能量為 27000 電子伏特 (eV)","C":"鈀-103 發出的 X 射線能量為 21000 電子伏特","D":"銫-131 半衰期為 9.7 天","E":"銥-192 發出的 X 射線能量為 40000 電子伏特"},"answer":"E","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)： 1. Campbell 2. 第 12 版、2021 3. Chapter 157 4. 3596 頁、3598 頁","sourcePage":68},{"id":"2-103","category":"前列腺疾病含癌症","categoryOrder":2,"number":103,"question":"根據文獻，下列生物標記何者與慢性攝護腺炎症狀嚴重 度無關？","options":{"A":"nerve growth factor","B":"brain derived neurotrophic factor","C":"vascular endothelial growth factor receptor 1","D":"neutrophil gelatinase-associated lipocalin","E":"matrix metallopeptidase 9"},"answer":"B","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)： 1. Campbell 2. 第 12 版、2021 3. Chapter 56 4. 1209 頁","sourcePage":68},{"id":"2-104","category":"前列腺疾病含癌症","categoryOrder":2,"number":104,"question":"請問一個 pre-pro-PSA、一個 intact proPSA、一個 proPSA 及一個 active PSA，何者的胺基酸數目最少？","options":{"A":"pre-pro-PSA","B":"intact proPSA","C":"proPSA","D":"active PSA","E":"胺基酸數目都一樣"},"answer":"D","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)： 1. Campbell 2. 第 12 版、2021 3. Chapter 149 4. 3483 頁","sourcePage":69},{"id":"2-105","category":"前列腺疾病含癌症","categoryOrder":2,"number":105,"question":"下列關於去勢抗性攝護腺癌(castration-resistant prostate cancer, CRPC)其治療的臨床試驗結果，下列 何者錯誤？","options":{"A":"第三期臨床試驗 IMPACT 試驗，收錄的病人 為無症狀或輕微症狀的轉移性 CRPC 但不包含有臟 器轉移、曾使用過化學治療的病人","B":"攝護腺癌疫苗 ProstVac-VF 於第三期臨床試 驗 PROSPECT 試驗將受試者分成單獨使用 ProstVac-VF、ProstVac-V 合併使用顆粒球-巨噬細 胞聚落刺激因子(GM-CSF)、安慰劑一共三組","C":"第三期臨床試驗 COU-AA-301 試驗，收錄的 病人為未經過 ketoconazole 治療的轉移性 CRPC","D":"Orteronel 在 ELM-PC5 第三期臨床試驗中顯 示相較安慰劑組，接受 Orteronel 的病人有較好的 progression free survival","E":"不同於 docetaxel，第三期臨床試驗 TROPIC 試驗所使用的 Cabazitaxel，其對 P-glycoprotein 的親和力較差"},"answer":"A","reference":"(112)/2. 前列腺疾病含癌症/參 考資料(摘錄自)： 1. Campbell 2. 第 12 版、2021 3. Chapter 162 4. 3697、3698、3694、3695、 3692 頁","sourcePage":69},{"id":"2-106","category":"前列腺疾病含癌症","categoryOrder":2,"number":106,"question":"下列關於攝護腺特異性抗原 PSA (Prostate-Specific Antigen) 的敘述何者錯誤?","options":{"A":"又被稱做 hk3(human kallikrein 3)， kallikrein gene family 15 個成員之一","B":"其表現基因位在 chromosome 19 上 long arm 的 q13.2-q13.4.","C":"由 prostatic luminal epithelial cells 製造，藉由作用在 semenogelin 及 fibronectin 來 讓精液液化","D":"在沒有攝護腺癌的狀況下，PSA level 和年 齡、種族、攝護腺大小有關","E":"相較於正常的攝護腺細胞，每個攝護腺癌的 細胞會製造較多的 PSA"},"answer":"E","reference":"(112)/2. 前列腺疾病含癌症/ 參考資料(摘錄自)：Campbell Walsh Urology, 12th edition, 2020, Volume III, Chapter 149, p. 3480-3481 and Chapter 152, p. 3515-3518","sourcePage":69},{"id":"2-107","category":"前列腺疾病含癌症","categoryOrder":2,"number":107,"question":"下列關於攝護腺癌相關手術的敘述何者錯誤?","options":{"A":"若進行 RALRP (robotic-assisted laparoscopic radical prostatectomy)， 術前不須停用 low-dose aspirin","B":"相較於 open prostatectomy, 接受 RALRP (robotic-assisted laparoscopic radical prostatectomy) 的患者其有較少的出血量及較短 的住院天數，同時有同等的 oncology 和 continence outcomes","C":"患者的 Gleason scores, tumor staging 和 surgical margin 是否為 positive 有關，但患 者的體重、BMI、攝護腺大小、是否接受過腹部手 術則和 positive surgical margins 無關","D":"攝護腺癌的患者若須做骨盆腔淋巴廓清 (Pelvic lymph node dissection)，應選擇做 standard PLND 則包括 obturator, external, 及 internal iliac nodes，其含有 63%攝護腺的淋巴 回流","E":"做盆腔淋巴廓清 Pelvic lymph node dissection 時，若不慎傷及 obturator nerve，則患者大腿內側(medial thigh)感 覺會喪失，並影響腳作出內收(adduction)的動作"},"answer":"C","reference":"(112)/2. 前列腺疾病含癌症/ 參考資料(摘錄自)：Campbell Walsh Urology, 12th edition, 2020, Volume III, Chapter 156","sourcePage":70},{"id":"2-108","category":"前列腺疾病含癌症","categoryOrder":2,"number":108,"question":"下列關於雄性素剝奪療法(Androgen deprivation therapy, ADT) 的敘述何者錯誤?","options":{"A":"因循環中 95%的 testosterone 是由睪丸製造，雙側 的睪丸切除(Orchiectomy)可讓男性在 6 小時內達 到 castration level","B":"Cyproterone acetate 屬於 steroidal antiandrogen 且能快速有效降低 testosterone， 但因嚴重的副作用包括心血管疾病、男性女乳及腎 毒性目前臨床上已較少使用","C":"Bicalutamide 屬於 first-generation nonsteroidal antiandrogen，單獨使用可能使 testosterone level 上升，臨床上常和 LHRH agonists 合併使用作為 Combination Hormonal Therapy","D":"Apalutamide 屬於 second-generation nonsteroidal antiandrogen，SPARTAN trial 中顯 示在 nmCRPC (nonmetastatic castrate-resistant prostate cancer)的病人上，ADT 合併使用 Apalutamide 相比於單獨使用 ADT 可有效提高 metastasis-free survival","E":"Abiraterone 可藉由抑制 CYP17 (cytochrome P17) 來抑制 androgen 的合成，LATITUDE trial 中顯示 在 mCSPC(metastatic castrate-sensitive prostate cancer)的病人上，ADT 合併使用 Abiraterone 和 Prednisolone 相比於單獨使用 ADT 可提高 radiographic progression-free 及 overall survival"},"answer":"B","reference":"(112)/2. 前列腺疾病含癌症/ 參考資料(摘錄自)：Campbell Walsh Urology, 12th edition, 2020, Volume III, Chapter 161","sourcePage":70},{"id":"2-109","category":"前列腺疾病含癌症","categoryOrder":2,"number":109,"question":"有關最大尿流速的敘述下列何者為非？","options":{"A":"最大尿流速小於 10 mL/s，表示病人具有較為嚴重 的膀胱出口阻塞","B":"年齡越大，病人的最大尿流速也會逐漸變小","C":"最大尿流速的高低，與排尿量多少無關","D":"對於膀胱出口阻塞的診斷，除了最大尿流速之外， 也要注意尿流圖形及殘尿量","E":"我們不能根據最大尿流速的高低，來判定病人是否 具有膀胱出口阻塞或逼尿肌收縮力不足"},"answer":"C","reference":"(113) 參考資料(摘錄自)： Campbell Urology 12th ed, pp 3320.","sourcePage":71},{"id":"2-110","category":"前列腺疾病含癌症","categoryOrder":2,"number":110,"question":"哪一種化療藥物在治療轉移性去勢抵抗性前列腺癌 (metastatic castration-resistant prostate cancer，mCRPC)時，因其引發第三、四級嗜中性白血球 低下症(neutropenia)的比例高達 82%，所以需要特別注 意監測患者的血液指標？","options":{"A":"Cabazitaxel","B":"Docetaxel","C":"Estramustine","D":"Mitoxantrone","E":"Vinorelbine"},"answer":"A","reference":"(113)/Campbell 12th, Chap 162, Page 3690-3693 (A) TROPIC 第三期臨床試驗針對 docetaxel 失敗的病人，比較 cabazitaxel 或 mitoxantrone 的 療效，結果顯示 cabazitaxel 的 存活中位期及無疾病存活期都 顯著高於 mitoxantrone 組。 Cabazitaxel 常見副作用包括嗜 中性白血球低下 (第三、四級 82%)、週邊神經病變 (14%)、腹 瀉 (6%)。美國 FDA 於 2010 年 1 月 17 日核准 cabazitaxel 用來 治療使用 docetaxel 失敗的 mCRPC 病人。臺灣亦於 2012 年 2 月核准使用。","sourcePage":71},{"id":"2-111","category":"前列腺疾病含癌症","categoryOrder":2,"number":111,"question":"關於前列腺癌的賀爾蒙治療，何者為正確?","options":{"A":"接受雙側睪丸切除後，約術後 3 小時後，體內睪固 酮即在 Castrate level 範圍內","B":"First generation androgen receptor antagonists(如 Flutamide, bicalutamide)或單獨 使用會使體內睪固酮濃度降低，故常常在 LHRH agonist 使用的初期時會合併一同使用，避免 testosterone surge","C":"Antiandrogen withdrawal syndrome (AAWS)主要 在 Non-steroidal antiandrogens 中會觀察到， cyproterone acetate 也可能會出現此現象","D":"Abiraterone 抑制 17α-hydroxylase 和 C , -lyase，最終使體內 cortisol 和 Testosterone 17 20 下降，而 aldosterone 濃度上升，而導致低血鉀、 高血壓和水分滯留的副作用 根據 2024 第四版 NCCN guideline，在無骨轉移使用 ADT 之患者，針對預防骨質疏鬆，除了需要補充鈣質和維他 命 D，亦可以考慮使用 denosumab 60mg every 4 weeks 或 zoledronic acid every 3-4 weeks 避免骨質流失","E":"根據2024第四版NCCN guideline，在無骨轉移使用ADT之患者，針對預防骨質疏鬆，除了需要補充鈣質和維他命D，亦可以考慮使用denosumab 60mg every 4 weeks或zoledronic acid every 3-4 weeks避免骨質流失"},"answer":"C","reference":"(113) Campbell 第 12 版 Chapter161 p3674-p3680 NCCN guideline version4.2024 Prostate cancer","sourcePage":72},{"id":"2-112","category":"前列腺疾病含癌症","categoryOrder":2,"number":112,"question":"下列關於 PROpel trial 之敘述，何者正確？","options":{"A":"PROpel trial 為一國際性、雙盲的三期臨床試驗， 在不論 HRR 突變與否的轉移性去勢抵抗性前列腺癌 （mCRPC）患者中，比較 Abiraterone + Olaparib 與 Abiraterone + ADT 的效果","B":"PROpel trial 收案及排除條件中，若曾於轉移性去 勢敏感性前列腺癌時期(mCSPC)接受過 Docetaxel 之治療者，應予以排除","C":"主要療效指標(Primary Endpoint)為影像上無進展 生存期（imaging-based PFS），在 Abiraterone + Olaparib 治療組中顯著長於對照組（34.8 個月 vs. 16.6 個月）","D":"整體存活率比較起來，Abiraterone + Olaparib 治 療組整體存活率顯著長於對照組","E":"最常見的 3-4 級不良事件是貧血，在 Abiraterone + Olaparib 治療組 398 名患者中有 64 名（16%）出現 了該不良事件"},"answer":"E","reference":"(113) Saad, Fred, et al. \"Olaparib plus abiraterone versus placebo plus abiraterone in metastatic castration-resistant prostate cancer (PROpel): final prespecified overall survival results of a randomised, double-blind, phase 3 trial.\" The Lancet Oncology 24.10 (2023): 1094-1108.","sourcePage":72},{"id":"2-113","category":"前列腺疾病含癌症","categoryOrder":2,"number":113,"question":"以下何者不屬於前列腺癌症中 ETS(E-26 transformation specific) gene family ?","options":{"A":"ERG","B":"ETV 1","C":"ETV 4","D":"FLI 1","E":"FLI 3"},"answer":"E","reference":"(113)/ 參考資料(摘錄自)： Campbell-Walsh Urology, 12th, chapter 148, P3469, Fig. 148.8","sourcePage":72},{"id":"2-114","category":"前列腺疾病含癌症","categoryOrder":2,"number":114,"question":"下列關於攝護腺手術的敘述何者正確?","options":{"A":"攝護腺內的靜脈壓約為 20 mmHg, 因此進行手術時 要盡量避免沖洗液壓力太高避免 TUR syndrome","B":"確診攝護腺癌的患者就不適合接受 Simple prostatectomy","C":"進行 monopolar-TURP 時理想的沖洗液高度為高於 病人 50 公分","D":"相較於 Retropubic prostatectomy, Suprapubic prostatectomy 更適合 median lobe 較大的病人","E":"機械手臂輔助腹腔鏡單純攝護腺切除(simple prostatectomy)與傳統開腹單純攝護腺切除的輸 血機會差不多"},"answer":"D","reference":"(113)Campbell Urology, 12 edition, 2020, p3417, 3450, 3456 A. 10 B. Men participating in an active surveillance program for a very low-risk prostate cancer may consider a simple prostatectomy for symptomatic obstruction if they clearly understand the potential risks and benefits of the surgery C. 60 E. 較低","sourcePage":73},{"id":"2-115","category":"前列腺疾病含癌症","categoryOrder":2,"number":115,"question":"常用的攝護腺癌腫瘤指標下列何者採檢方式與其他方 式差異最大?","options":{"A":"Prostate health index (PHI)","B":"Prostate cancer antigen 3 (PCA-3)","C":"SelectMDx","D":"ExoDx Prostate IntelliScore","E":"以上採檢方式相同"},"answer":"A","reference":"(113)/Smith & Tanagho’s general urology 19th ed. p.356-357 A (驗血液，B.C.D 則是檢驗尿液)","sourcePage":73},{"id":"2-116","category":"前列腺疾病含癌症","categoryOrder":2,"number":116,"question":"下列關於攝護腺癌及其治療的敘述何者正確?","options":{"A":"根據 ALSYMPCA trial, mCRPC 病人接受 Radium-223 治療能延長 time-to-first symptomatic-skeletal event 但是對 overall survival 沒有幫助","B":"Bone scan index 與 overall survival 有關但與 castration-sensitive 進展至 castration-resistant 的時間無關","C":"根據 MAGNITUDE trial, 所有 mCRPC 病人接受 Abiraterone 加上 Niraparib 治療比單獨使用 Abiraterone 平均能延長 radiographic progression free survival 6.7 個月","D":"SOX2 和 AKT 都與 AR (Androgen receptor) bypass signaling 有關","E":"根據 SPPORT trial, 在根除性攝護腺手術後有 detectable PSA 的病人接受 6-12 個月的 ADT 加上 salvage RT 相較單純接受 salvage RT 的能增加 progression free survival"},"answer":"D","reference":"(113)Campbell Urology, 12 edition, 2020, p3672, 3679, 3704, JCO 41, 3339-3351(2023). Lancet, VOLUME 399, ISSUE 10338, P1886-1901, MAY 14, 2022 A. OS 增加 3.6 個月 B. directly and independently associated with time from castration-sensitive prostate cancer to castration resistance C. 在 BRCA 1/2 組別的病人才有 E. 4-6","sourcePage":73},{"id":"2-117","category":"前列腺疾病含癌症","categoryOrder":2,"number":117,"question":"轉移性去勢敏感攝護腺癌(mHSPC)治療的關鍵 trial 發 表時間序何者正確(先>後)? (1) ARASENS: ADT + Docetaxel + Darolutamide (2) ENZAMET: ADT + Enzalutamide (3) SPARTAN: ADT + Apalutamide (4) ARANOTE: ADT + Darolutamide","options":{"A":"2>1>4","B":"2>3>1","C":"2>3>4>1","D":"3>2>1","E":"2>3>1>4"},"answer":"A","reference":"(114) 1)ARASENS: N Engl J Med 2022;386:1132-1142, 2)ENZAMET: N Engl J Med 2019;381:121-131, 3) SPARTAN: for m0 CRPC N Engl J Med 2018;378:1408-1418, 4) ARANOTE: J Clin Oncol . 2024 Dec 20;42(36):4271-4281","sourcePage":74},{"id":"2-118","category":"前列腺疾病含癌症","categoryOrder":2,"number":118,"question":"下列有關前列腺之解剖構造以及 cell biology，何者有 誤？","options":{"A":"Seminal vesicles 是由 wolffian ducts 經 testosterone 刺激發育而來","B":"前列腺之 Central zone 包圍著 ejaculatory ducts，佔腺體量之 25%左右","C":"前列腺之 Epithelial cells 包涵 neuroendocrine, secretory 及 endothelial cells，其中 endothelial cells 具有釋放 NO 的功能","D":"前列腺除了 endothelial cells 以外，nerve cells 以及 macrophages 皆具有釋放 NO 的功能","E":"前列腺之 Connective tissue 主要由 Type I and type III fibrillar collagen 及 elastin 所構成"},"answer":"C","reference":"(114)Endothelial cells 屬於 prostatic stromal cells Campbell 12th P.3275, 3277","sourcePage":74},{"id":"2-119","category":"前列腺疾病含癌症","categoryOrder":2,"number":119,"question":"關於攝護腺癌的危險因子，下列敘述何者錯誤？","options":{"A":"酒精攝取量與攝護腺癌風險呈劑量相關，其中飲酒 者與滴酒不沾者相較之下的風險最高","B":"致命性的攝護腺癌傾向依賴細胞外攝取膽固醇，而 研究顯示血清膽固醇較低和使用 statin 與降低侵 襲性或晚期攝護腺癌相關","C":"多項研究指出肥胖與高分級疾病或攝護腺癌死亡 風險增加有關，可能的解釋包括肥胖者血清中雌二 醇（estradiol）、胰島素增加，而游離睪固酮與脂 聯素（adiponectin）下降","D":"有研究指出多射精能降低攝護腺癌風險，但年輕時 性行為較頻繁與風險上升有關","E":"香菸可能是攝護腺癌風險因子，研究指出吸菸與癌 症診斷時的分級較高與病期較晚有關"},"answer":"B","reference":"(114)Campbell Urology, 12 edition, 2020, Ch148, P3464, 3465, B: 致命性的攝護腺癌被證實傾 向依賴 de novo 膽固醇合成， 而非經細胞外攝取","sourcePage":74},{"id":"2-120","category":"前列腺疾病含癌症","categoryOrder":2,"number":120,"question":"關於轉移性攝護腺癌的藥物治療，下列敘述何者正確？","options":{"A":"在 STAMPEDE trial 中，只有 high volume 組使用 docetaxel 對於總體生存期(overall survival) 有 好處，比起對照組從 47.2 個月延長至 57.6 個月","B":"在 ARASENS trial 中，三聯治療(triplet theraphy) 中合併使用 Darolutamide 能降低三成死亡率，但 副作用較對照組高","C":"根據 PROpel trial，在 HRR 基因無突變時，使用 Olaparib 合併使用 abiraterone 對於無惡化存活 期(progression-free survival)有好處","D":"根據 TRITON3 trial，在有 BRCA 或 ATM 突變時，使 用 Rucaparib 對於無惡化存活期 (progression-free survival)有好處","E":"根據 MAGNITUDE trial 結果顯示，在有 HRR 突變的 患者中，使用 Niraparib + abiraterone 對於總體 生存期(overall survival)有好處"},"answer":"C","reference":"(114)AUA Update Series (2024) Lesson 28: Treatment Intensification in Advanced Prostate Cancer. P267, 268, 269, A: 這是 CHAARTED 結果。 STAMPEDE 無論 volume 都有好處 B: Adverse events were similar in both arms C: 正確 D: 在 ATM 組沒有好處 E: 延長 PFS，對於 OS 沒好處","sourcePage":75},{"id":"2-121","category":"前列腺疾病含癌症","categoryOrder":2,"number":121,"question":"關於攝護腺癌危險因子及遺傳的敘述何者正確?","options":{"A":"攝護腺癌主要跟 androgen receptor (AR)有很大的 關係。AR 基因為性聯遺傳基因(sex-linked)","B":"攝護腺癌盛行率黑人>亞洲人>白人","C":"輸精管結紮手術也會增加攝護腺癌風險","D":"抽菸是攝護腺癌的風險因子之一","E":"肥胖也是攝護腺癌的風險因子之一 題號 答案 考 題"},"answer":"A","reference":"(114)Campbell-Walsh Urology 12 e,Chapter 148 A. 正確 AR 基因位於 X 染色體 （Xq11–12） B. 黑人>白人>亞洲人 C. 錯誤 錯誤 年度 類別 參考資料","sourcePage":75},{"id":"3-001","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":1,"question":"根據 2021 年版 EAU guideline 對於 metastatic 膀胱 尿路上皮癌治療的建議，以下何者為錯?","options":{"A":"ECOG performance status(PS): 1-0 以及 GFR>50-60mL/min 屬於適合接受 cisplatin-based chemotherapy 的族群，可以 使用 ddMVAC 或 cisplatin/gemcitabine 治療","B":"ECOG PS>2 或 GFR<30mL/min 為不適合 platinum-based chemotherapy 的族群，可以使 用 immunotherapy 治療","C":"對於接受第一線 platinum-based chemotherapy 後沒有 progress 的病人， Avelumab 可以做為 後續的 maintenance treatment","D":"只有 Pembrolizumab 和 Atezolizumab 被證實可 以用做第一線化療無效的第二線免疫治療","E":"Erdafitinib 為 pan-FGFR TKI 可以做為前兩線 治療失敗的後線治療"},"answer":"D","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： 2021 EAU guideline to MIBC, 7.7 and Figure 7.2, p.48-55","sourcePage":76},{"id":"3-002","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":2,"question":"有關腎臟腫瘤及局部腎臟癌( localized renal cancer)，何者錯誤?","options":{"A":"還未有證據顯示腎臟切片會造成 RCC 的 tumor seeding","B":"若治療選擇為 thermal ablation (電熱燒灼 術)，應先取得腎臟切片結果","C":"Tumor enucleation (TE) 為家族型腎細胞癌 (familial RCC) 的治療選項之一","D":"臨床上 RCC 較差的預後因子包含貧血(anemia), 高血鈣(hypercalcemia), 以及血小板減少症 (thrombocytopenia)","E":"一個小於兩公分臨床上懷疑為惡性的腎臟腫 瘤，active surveilance 是初步治療選項之一"},"answer":"D","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition Chapter 97 Page 2161 Page 2163 Page 2164 Page 2170 Page 2173","sourcePage":76},{"id":"3-003","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":3,"question":"根據最新版 EAU guideline，對於 upper tract urothelial cancer(UTUC)的治療，下列何者為錯?","options":{"A":"Kidney-sparing surgery 和 Radical nephroureterectomy(RNU)在 low-risk UTUC 的 病人有差不多的 oncological outcome","B":"近端輸尿管的 segmental resection 比起遠端輸 尿管有更高的失敗率","C":"T3/T4 的腫瘤應該接受 RNU, 但不建議使用 minimal invasive 的方式進行","D":"Muscle invasive disease 建議手術中同時進行 template-based lymph node dissection","E":"RNU 後 single dose 膀胱內灌注 mitomycin-C 可 以減少膀胱腫瘤的復發，應在術後 24hrs 內完成"},"answer":"E","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： 2021 EAU guideline on UTUC, 7.1, p.14-17","sourcePage":76},{"id":"3-004","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":4,"question":"關於患者接受膀胱內 BCG (Bacille Calmette-Guérin)灌注的敘述，下列何者錯誤？","options":{"A":"經由細胞激素 IL-12 所誘發產生的第一型輔助 T 細胞(Th1)被視為是成功對抗腫瘤機轉的一環","B":"若血清中測得大量細胞激素 IL-4，可視為有較 差的抗腫瘤結果","C":"為期六週的誘導治療(induction therapy)能同 時降低腫瘤的復發率和腫瘤進展(progression)","D":"接受維持治療(maintenance therapy)的患者比 單純接受誘導治療的患者有更低的腫瘤復發率","E":"若此次灌注後產生高燒不退合併低血壓，建議下 次灌注時將劑量減半或降為原先的三分之一"},"answer":"E","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell 12ed, Chpater 61, Basic Principles of Immunology and Immunotherapy in Urologic Oncology, p1334; Chapter 136, Management Strategies for Non–Muscle-Invasive Bladder Cancer (Ta, T1, and CIS), p3099-3102; NCCN Guidelines Version 3.2021 Bladder Cancer","sourcePage":77},{"id":"3-005","category":"腎臟輸尿管膀胱腫瘤","categoryOrder":3,"number":5,"question":"下列何者”非”進行根除性膀胱切除手術時， standard template pelvic lymphadenectomy 的邊 界？","options":{"A":"外側至 genitofemoral nerves","B":"內側至 internal iliac artery","C":"下側至 Cooper ligament","D":"內側至 obturator nerve","E":"上側至輸尿管跨越 common iliac artery 處"},"answer":"D","reference":"(110)/3.腎臟/輸尿管/膀胱 腫瘤/參考資料(摘錄自)： Campbell-Walsh Urology, 12th edition. P.
