enital sinus (泌 尿生殖竇) 發育而來？","options":{"A":"Vagina","B":"Glans penis","C":"Prostate","D":"Urethra","E":"Bartholin glands"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell 12th, chapter 20, page 320","sourcePage":315},{"id":"8-041","category":"小兒泌尿","categoryOrder":8,"number":41,"question":"下列有關小兒腎臟移植術後併發症之敘述，何者有誤？","options":{"A":"術後發生腎結石的比率不高，約佔 5%左右","B":"輸尿管阻塞常見於遠端輸尿管重植處 (reimplantation site)狹窄","C":"約有 8%左右病人因輸尿管狹窄造成水腎，而須進一步 接受介入性治療","D":"常見的術後併發症包含尿液逆流，輸尿管狹窄，結石 以及尿漏，其中以尿漏發生機率最高","E":"進行小兒移植手術時，不一定需要常規置放輸尿管導 管"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell 12th, chapter 51, page 1060-1064","sourcePage":315},{"id":"8-042","category":"小兒泌尿","categoryOrder":8,"number":42,"question":"下列有關小兒泌尿腫瘤之描述，何者有誤？","options":{"A":"Neuroblastoma 是小兒最常見的顱外實體腫瘤 (Extracranial solid tumor)，根據 International Neuroblastoma Staging System 可區分為第 1 至第 4S 期","B":"罹患 Yolk Sac Tumor (YST) 之病患，有 90%伴隨 AFP (alpha fetoprotein)之上升，且顯微鏡下可觀察到 Schiller-Duval bodies 此病理特徵","C":"根據 Staging System of the Childrens Oncology Group for Wilms Tumor，腫瘤經血行路徑轉移至肺臟， 肝臟，骨頭，大腦等器官歸類為第四期。","D":"小兒膀胱或攝護腺腫瘤常伴隨有阻塞，血尿，尿滯留 等症狀","E":"約有 20%的 Wilms Tumors 伴隨有 WT1 基因的突變，此 突變僅有體細胞突變，不會遺傳給下一代"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell 12th, chapter 53-54, page 1091, 1096-1097, 1103, 1113, 1123","sourcePage":315},{"id":"8-043","category":"小兒泌尿","categoryOrder":8,"number":43,"question":"關於小兒 Prune-Belly Syndrome 之描述，下列何者錯誤？","options":{"A":"罹患 Prune-Belly Syndrome 的病患，約有 75%伴隨有 膀胱輸尿管逆流","B":"Prune-Belly Syndrome 的病患其輸尿管近端肌肉組織 之功能通常比輸尿管遠端之肌肉組織來的正常","C":"因腹壁缺陷，罹患 Prune-Belly Syndrome 的病童，最 常見的非泌尿道異常(Non-urinary tract abnormalities)為胃腸道(gastrointestinal comorbid)共病。","D":"若無陰莖結構上異常，罹患 Prune-Belly Syndrome 之 幼兒建議接受包皮環切術以降低泌尿道感染之風險","E":"若有膀胱出口阻塞之現象，應儘早接受治療，經皮恥 骨上造廔為治療首選"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell 12th, chapter 32, page 582-583, 585, 590-591","sourcePage":315},{"id":"8-044","category":"小兒泌尿","categoryOrder":8,"number":44,"question":"國小一年級的小智的爸爸是一位聯結車司機，今天陪爸爸開車時不慎從車上跌下，右側腰部撞到路邊欄杆而造成鈍傷，因持續腰痛被家人送至急診就診，電腦斷層顯示右側腎臟兩條撕裂傷從腎實質(parenchyma)延伸至集尿系統，伴隨urinary extravasation，根據以上敘述，下列選項何者錯誤？","options":{"A":"根據急診電腦斷層的結果，AAST 的分類應為 grade 4","B":"約有 25% 腎臟 grade 3 到 grade 5 外傷接受保守治療 的病患因持續或延遲出血而後續需接受介入性治療","C":"Grade 4 以上腎臟損傷的病人，腎臟結痂的風險為 100%","D":"Grade 4 的腎臟損傷，若伴隨有 Large perirenal hematoma >3.5cm，則符合 High-risk criteria for intervention","E":"伴隨輸尿管損傷的機率較小，輸尿管損傷較常發生在 穿刺傷"},"answer":"D","reference":"(111) 參考資料(摘錄自)：Campbell 12th, chapter 52, page 1067-1069, 1073, 1078-1080","sourcePage":316},{"id":"8-045","category":"小兒泌尿","categoryOrder":8,"number":45,"question":"關於小兒下泌尿道神經肌肉失常（Neuromuscular dysfunction of lower urinary tract）的治療，下列何者正確?","options":{"A":"小孩若服用抗膽鹼藥物(antimuscarinic drugs)可能影響記憶力與專注程度, 尤其是常使用的Oxybutynin","B":"接受擴大性膀胱整形術(Augmentation cystoplasty)的病患，容易形成石頭的危險因子包括腸子黏液過多、使用空腸段(jejunal segment)和行動不便且感覺喪失","C":"薦神經調節(Sacral neuromodulation)在小兒神經性膀胱(Neurogenic bladder)的治療角色已確定且廣泛使用","D":"接受擴大性膀胱整形術(Augmentation cystoplasty)的病患若發生膀胱破裂，若生命徵象不穩定可以考慮先引流就好","E":"下泌尿道神經肌肉失常（Neuromuscular dysfunction of lower urinary tract）治療的主要目標(Primary goal)是保護腎功能"},"answer":"E","reference":"(111) 參考資料(摘錄自)：Campbell 12ed. Ch34. (A) p634, 不會影響記憶力與專注程度 (B) p635, 使用ileal segment才是危險因子 (C) p637, 在小兒非神經性膀胱(Non-neurogenic bladder)才廣泛使用 (D) p636, 生徵象穩定才可以保守治療，例如引流 (E) p633","sourcePage":316},{"id":"8-046","category":"小兒泌尿","categoryOrder":8,"number":46,"question":"關於小兒膀胱腫瘤的敘述，下列何者正確?","options":{"A":"小兒膀胱泌尿上皮癌(Urothelial carcinoma)常與環 境中的二手菸有關","B":"排尿膀胱尿道攝影(Voiding cystourethrography)在 診斷膀胱腫瘤的敏感性(Sensitivity)比超音波差","C":"小兒膀胱的腎源性腺瘤(Nephrogenic adenoma)是一種 良性腫瘤，因為惡性轉變(Malignant transformation) 的機會很低，無需長期追蹤","D":"膀胱外翻(Bladder exstrophy)可能增加腺癌 (adenocarcinoma), 泌尿上皮癌(urothelial carcinoma)和鱗狀上皮癌(squamous cell carcinoma) 的機會","E":"長在膀胱、前列腺和睪丸旁(Para-testicular)的橫紋 肌肉瘤(Rhabdomyosarcoma)都是屬於治療不佳的位置 (Unfavorable sites)"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell 12ed. Ch54 (A) p1117, 小兒泌尿上皮 癌的原因未明。 (B) p1118 (C) p1119, 仍需要長期追 蹤因為容易復發 (D) p1118, 沒有尿上皮癌 (urothelial carcinoma) (E) p1113, 睪丸旁 (Para-testicular)的橫 紋肌肉瘤 (Rhabdomyosarcoma)是屬 於有利的位置(Favorable sites)","sourcePage":317},{"id":"8-047","category":"小兒泌尿","categoryOrder":8,"number":47,"question":"下列關於尿道下裂(Hypospadias)的敘述何者正確?","options":{"A":"手術前如果龜頭太小，可以考慮術前使用人絨毛膜促 性腺激素(HCG)或睪固酮(Testosterone)增大龜頭以 減少手術併發症","B":"雙胞胎兄弟或父親有尿道下裂都可能使尿道下裂的機 會比常人高，而後者的機會又比前者低","C":"GMS score(Glans meatus and penile shaft score) 主要用於門診時的身體檢查，分數越高術後產生－併 發症的機會越高","D":"尿道開口在近端(Proximal type)的手術複雜程度比在 遠端(Distal type)高","E":"在孕期第 6 週時，尿道板(Urethral plate)已經形成"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell 12ed. Ch45 (A) p910 (B) p909, 雙胞胎兄弟較 高 (C) p908, 用於開刀房內 開刀時的評估 (D) p907, 不一定, 還要 合併 penile curvature 的 程度等因素來看 (E) p906, 孕期 8-16 週才 形成","sourcePage":317},{"id":"8-048","category":"小兒泌尿","categoryOrder":8,"number":48,"question":"一位 13 歲男孩出生有後尿道瓣膜（posterior uretheral valve）病史，隨著時間過去慢慢進入末期腎臟疾病並且準 備腎臟移植。請問，以下哪個是 PUV 病人最可能遇到的移 植後併發症？","options":{"A":"急性移植排斥（Acute rejection）","B":"膀胱輸尿管逆流（Vesicoureteral reflux）","C":"慢性移植排斥（Chronic rejection）","D":"移植輸尿管膀胱吻合處狹窄（ureteral obstruction at side of ureteroneocystostomy）","E":"移植腎喪失功能（graft loss）"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell 12ed. Ch33 p107 分析發現，比起沒有 PUV history 的病人，有 PUV 的病人因肥厚的膀胱病變 導致更常發生移植後輸尿 管膀胱吻合處狹窄。但是 這並沒有增加 graft loss 或病人死亡的風險","sourcePage":317},{"id":"8-049","category":"小兒泌尿","categoryOrder":8,"number":49,"question":"關於 Testicular Workup for Ischemia and Suspected Torsion （TWIST）臨床應用於睪丸扭轉（Testicular Torsion），以下何者不正確？","options":{"A":"睪丸超音波是對於睪丸扭轉重要的檢查，有良好的敏 感性與特異性；在超音波中觀察到“whirlpool sign” 更將敏感性提升到 0.92，特異性提升到 0.99","B":"Barbosa 等人於 2013 年提出 TWIST score 用於臨床評 估懷疑睪丸扭轉的病人，評定項目包含睪丸腫脹 （testis swelling）、睪丸變硬（hard testis）、提 睪肌反射消失（absent cremasteric reflex）、 Prehn’s sign negative、高位睪丸（high riding testis）","C":"Sheth et al 提出有別於 Barbosa et al 的 TWIST score 風險分類方式，將病人分成低、中、高風險三組，但 統合分析發現 Barbosa 等人的分類方式有更高的可靠 性（reliability）","D":"使用 TWIST 於臨床鑑別睪丸扭轉最大的好處在於快 速，尤其在超音波不普及的地方更有其優勢","E":"依據低、中、高風險的分類方式：低風險病人能夠排 除睪丸扭轉，高風險病人應積極手術；而中度風險的 病人更能受惠於睪丸超音波檢查"},"answer":"B","reference":"(111) Epub 2022 Mar 3. Diagnosing with a TWIST: Systematic Review and Meta-Analysis of a Testicular Torsion Risk Score B, TWIST 項目包含 testis swelling（2），hard testis （2），absent cremasteric reflex（1），high riding testis（1） and nausea/vomiting（1） 滿分七分","sourcePage":318},{"id":"8-050","category":"小兒泌尿","categoryOrder":8,"number":50,"question":"關於小兒的尿流速圖型，主要可以分為哪五類?","options":{"A":"間斷型(interrupted)、鐘型(bell)、高原型 (plateau)、正常型(normal)、超級尿型(supervoid)","B":"鐘型(bell)、塔型(tower)、斷音型(staccato)、緊縮 型(constrictive)、高原型(plateau)","C":"高原型(plateau)、斷音型(staccato)、塔型(tower)、 壓縮型(compressive)、鐘型(bell-shaped)","D":"塔型(tower)、間斷型(interrupted)、阻塞型 (obstructive)、高原型(plateau)、正常型(normal)","E":"斷音型(staccato)、間斷型(interrupted)、鐘型 (bell)、高原型(plateau)、塔型(tower)"},"answer":"E","reference":"(112) 參考資料(摘錄自)： Campbell’s Urology 12th edition, 2020，第 28 章, p2184.","sourcePage":318},{"id":"8-051","category":"小兒泌尿","categoryOrder":8,"number":51,"question":"關於膀胱輸尿管逆流(VUR)，下列敘述何者正確?","options":{"A":"中度輸尿管扭曲和骨盆和腎盂腎盞擴張屬於 Grade 3","B":"後尿道瓣膜導致的 VUR 屬於初級 VUR(primary VUR)","C":"患者年紀越大，腎盂腎炎後產生疤痕(renal scar)風 險越高","D":"VUR 是與完全雙套輸尿管(Complete Ureteral Duplication)相關最常見的異常","E":"患有泌尿道感染的小孩年齡越大，發現 VUR 的可能性 就越大"},"answer":"D","reference":"(112)參考資料(摘錄自)： Campbell Urology 12th Ch.29 page2231-2233, 2247-2250, 2255, 2264-2265, 2298 (A)Grade 4 (B)屬於 Secondary VUR (C)相反 (E)相反","sourcePage":318},{"id":"8-052","category":"小兒泌尿","categoryOrder":8,"number":52,"question":"下列有關小兒後尿道瓣膜(posterior urethral valves, PUV)之敘述，下列選項何者有誤？","options":{"A":"第一型 PUV 發生率最高，葉片狀瓣膜由 verumontanum 朝前側延伸，在橫紋外括約肌近端處中線融合","B":"胎兒超音波下會看到增厚，擴張的膀胱以及伴隨後段 尿道擴張，稱為 Keyhole sign","C":"妊娠 20 週後抽取的胎兒尿液檢體若尿鈉< 100mEq/L， 尿氯< 90mEq/L，Osmolarity< 200mEq/L 和 beta-2 microglobulin> 6mg/L，則之後介入性治療下泌尿道 阻塞的預後較好","D":"Pulmonary hypoplasia 是最常造成 PUV 新生兒死亡的 主因","E":"尿道阻塞而導致代償性高排尿壓及後續腎損傷，造成 腎源性尿崩，使得餘尿量上升，逼尿肌功能進一步惡 化，稱之為 Valve bladder syndrome"},"answer":"C","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell 12th chapter 33 (Ａ) page 602 粗體字 (Ｂ) page 607 粗體字 (Ｃ) page 609 粗體字 (Ｄ) page 611 表格 (Ｅ) page 617 粗體字 詳解： C 選項錯誤，應是 beta-2 microglobulin <6mg/L","sourcePage":319},{"id":"8-053","category":"小兒泌尿","categoryOrder":8,"number":53,"question":"有脊柱裂(spinal dysraphism)的小孩，可以從理學檢查看 出可能有下列表現: 1.對稱分裂臀部(symmetric bifid gluteal ) 2.真皮竇隧道(dermal sinus tract) 3.血管瘤(hemangioma) 4.先天性遺傳多毛(hypertrichosis) 5.單純皮下淺凹(simple cutaneous dimple)。 請問從最低到最高得到脊柱裂可能性的排列為何?","options":{"A":"51423","B":"54213","C":"15234","D":"54123","E":"52413"},"answer":"A","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： 1. Campbell’s Urology 12th edition, 2020， 第 28 章, p2174-2177.","sourcePage":319},{"id":"8-054","category":"小兒泌尿","categoryOrder":8,"number":54,"question":"關於小孩的膀胱輸尿管逆流(vesicoureteral reflux)，下 列敘述何者錯誤？","options":{"A":"目前使用的排尿膀胱尿道攝影(voiding cystourethrography)逆流分級(grading reflux)。是 採用國家分級系統(The National Classification System)","B":"後尿道瓣膜(posterior urethral valves)是造成解剖 上膀胱阻塞(anatomic bladder obstruction)最常見 的原因","C":"原發性的膀胱輸尿管逆流是由於在輸尿管膀胱交界處 缺乏膀胱內輸尿管(intravesical ureter)的縱向肌肉 (longitudinal muscle)","D":"膀胱感染發炎時會產生逆流，是由於膀胱內壓力上升 和膀胱順應性(compliance)下降","E":"尿流速檢查(uroflowmetry)對於小孩膀胱輸尿管逆流 是個有價值的檢查工具"},"answer":"A","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell’s Urology 12th edition, 2020，第 29 章 p2255-2270.","sourcePage":319},{"id":"8-055","category":"小兒泌尿","categoryOrder":8,"number":55,"question":"下列關於小孩下泌尿道神經肌肉功能失調(Neuromuscular dysfunction of lower urinary tract)的敘述何者錯誤？","options":{"A":"有脊柱裂(spina bifida)的小孩，測量腎功能的黃金 標準是核子腎臟攝影(nuclear renography)","B":"有脊髓脊膜膨出(myelomeningocele)的人，神經管缺 損(neural tube defect)在胸椎(thoracic level)的 病人，性功能和滿意度，比神經管缺損在薦椎(sacral level)的病人差","C":"薦椎發育不全(sacral agenesis)的小孩，大部分都會 有尿失禁、膀胱輸尿管逆流和會陰部無感覺(absent perineal sensation)等問題產生","D":"小孩橫斷性脊髓炎(transverse myelitis)的急性期 時，尿滯留(urine retention)比尿失禁更容易發生","E":"新生兒經過恥骨上敲擊或壓迫腹部解尿(Crede manuever)，餘尿小於 3ml 時，不用導尿"},"answer":"C","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell’s Urology 12th edition, 2020，第 34 章, p2760-2780","sourcePage":320},{"id":"8-056","category":"小兒泌尿","categoryOrder":8,"number":56,"question":"下列有關小兒腎臟結石的敘述，何者錯誤？","options":{"A":"孩童腎結石的復發率偏高，將近五成診斷腎結石的孩 童在治療後三到五年都會復發","B":"與成人相似，孩童接近 80%的腎結石皆為草酸鈣結石， 反而磷酸鈣結石發生率較成人高","C":"孩童 Cystinuria 是 SLC3A1 和 SLC7A9 突變造成的體隱 性疾病，近一步導致遠曲小管的氨基酸運送異常","D":"針對孩童小於等於 1.5 公分的上泌尿道結石，體外震 波的治療成效只有約 68%到 84%左右","E":"Allopuriol 不建議常規給予診斷尿酸結石的孩童使 用，治療孩童尿酸結石應以維持高尿流速及鹼化尿液 為主"},"answer":"C","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell 12th chapter 43 (Ａ) page 853 粗體字 (Ｂ) page 854 表格 (Ｃ) page 859 粗體字 (Ｄ) page 864 粗體字 (Ｅ) page 870 粗體字 詳解： Ｃ選項錯誤，應該是近曲 小管","sourcePage":320},{"id":"8-057","category":"小兒泌尿","categoryOrder":8,"number":57,"question":"下列有關小兒膀胱輸尿管逆流(VUR)之敘述，何者錯誤？","options":{"A":"膀胱輸尿管逆流之孩童若同時有 Bowel and bladder dysfunction，只會降低內視鏡手術治療 VUR 的成功 率，並不會影響 open 手術矯正的成功率","B":"VUR 常見於雙套輸尿管的孩童，逆流最常發生在腎臟的 upper pole","C":"腎臟解剖構造異常也會導致 reflux，常見於 multicystic dysplastic kidney 和 renal agenesis 的病童","D":"因 VUR 而持續使用預防性抗生素的病童若發生突破性 感染或者腎盂腎炎，最好停止使用抗生素並且接受手 術治療 VUR","E":"持續使用預防性抗生素能減少泌尿道感染的發生，但 不會減少腎臟結痂或者發展成慢性腎疾病的機率"},"answer":"B","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell 12th chapter 29 (Ａ) page 496 粗體字 (Ｂ) page 508 粗體字 (Ｃ) page 510 粗體字 (Ｄ) page 514 粗體字 (Ｅ) page 516 表格 詳解： B 選項錯誤，應是 lower pole","sourcePage":320},{"id":"8-058","category":"小兒泌尿","categoryOrder":8,"number":58,"question":"下列有關小兒尿道下裂之敘述，下列選項何者有誤？","options":{"A":"男童尿道下裂多數以開口位於遠端尿道為主，並伴隨 不同程度的陰莖腹側彎曲","B":"約 7%尿道下裂男童同時伴隨隱睪，若尿道開口位置越 靠近近端尿道，則伴隨隱睪機率會上升，且建議要進 一步檢查是否有 disorder of sexual differentiation","C":"尚未進入青春期之男童接受尿道下裂矯正手術前，可 給予雄性素刺激來增大龜頭及陰莖，降低手術併發症 的機率","D":"尿道彎曲小於 30 度的孩童，陰莖背側白膜折疊術不會 縮短術後陰莖長度","E":"尿道表皮瘻管為尿道下裂手術常見術後併發症，Byars flap two-stage repair 為目前常用之兩階段手術，可 降低瘻管形成之機率"},"answer":"E","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell 12th chapter 45 (Ａ) page 907 粗體字 (Ｂ) page 908 粗體字 (Ｃ) page 910 粗體字 (Ｄ) page 916 表格 (Ｅ) page 941 粗體字 詳解： E 選項錯誤，Byars 手術的 complication rate 很 高，約 30~70%","sourcePage":321},{"id":"8-059","category":"小兒泌尿","categoryOrder":8,"number":59,"question":"下列有關小兒膀胱外翻-尿道上裂複合體(bladder exstrophy-epispadias complex)之敘述，何者錯誤？","options":{"A":"根據研究指出，已證實第九對染色體 CASPR3 基因異常 和小兒 bladder exstrophy-epispadias complex 有關","B":"膀胱外翻的病童，骨盆常伴隨有 external rotation of the posterior pelvis/iliac wings，恥骨分離和縮 短 anterior pubic segment 的情形","C":"膀胱外翻病童常發生間接型腹股溝疝氣，主要是因為 腹壁結構異常：persistent 鞘狀突(processus vaginalis)，過大的腹股溝內外環以及腹股溝管斜角 不足(lack of obliquity)所導致","D":"膀胱外翻的重建建議分階段手術，尿道上裂於新生兒 六個月至一歲時修補，而膀胱頸修補為避免延遲手術 而造成未來膀胱容量不足，建議手術時間最晚不要超 過五歲足歲","E":"除非骨盆延展性差或者恥骨分離超過四公分以上，否 則不建議常規進行骨盆截骨術(osteotomy)來矯正膀 胱外翻"},"answer":"D","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： C ampbell 12th chapter 31 (Ａ) page 528 粗體字 (Ｂ) page 531 粗體字 (Ｃ) page 533 粗體字 (Ｄ) page 539 粗體字 (Ｅ) page 540 粗體字 詳解： D 選項錯誤，膀胱頸修補手 術建議五到七歲間進行。","sourcePage":321},{"id":"8-060","category":"小兒泌尿","categoryOrder":8,"number":60,"question":"關於尿床(nocturnal enuresis)的敘述, 以下何者有誤?","options":{"A":"按照定義, NE 的診斷是針對排尿訓練後的兒童, 因此 並無明確的年齡規範","B":"尿床可分為單一症狀(MSE)與非單一症狀(NMSE), 而 MSE 之中又以 primary form 佔多數","C":"在 bowel-bladder dysfunction 的小孩中, 有較高的 機會發現 comorbid behavioral disorders","D":"國際兒童尿失禁協會(ICCS)對於夜間多尿的的定義為 夜間尿總量超過預估膀胱總容量的 130%","E":"根據統計, 5 歲兒童尿床盛行率約 15%, 此族群每年約 有 15%自行改善, 至青春期僅 1-2%有尿床問題"},"answer":"A","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： 1. Campbell-Walsh Urology 12th ed. 2. 12th ed., 2020 3. Chapter 35 4. (A) P. 660 (B) P. 660 (C) P. 661 (D) P. 664 (E) P. 661","sourcePage":322},{"id":"8-061","category":"小兒泌尿","categoryOrder":8,"number":61,"question":"尿道下裂與下列哪些疾病相關性最高? 甲、隱睪症 乙、陰囊水腫 丙、腹股溝疝氣 丁、性別分化異常 戊、陰莖彎曲","options":{"A":"甲丁戊","B":"乙丙","C":"甲乙丙丁戊","D":"甲戊","E":"甲乙丙戊"},"answer":"C","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： 2. Campbell-Walsh Urology 12th ed. 3. 12th ed., 2020 4. Chapter 45 P.905, P.908","sourcePage":322},{"id":"8-062","category":"小兒泌尿","categoryOrder":8,"number":62,"question":"下列各泌尿生殖系統之器官與其胚胎來源(器官-胚胎來 源)的配對何者錯誤?","options":{"A":"Prostate – urogenital sinus","B":"Kidney – intermediate mesoderm","C":"Bladder trigone – urogenital sinus","D":"Penis – genital tubercle","E":"Seminal vesicle – Mesonephric tubules"},"answer":"E","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： 1. Campbell-Walsh Urology 12th ed. 2. 12th ed., 2020 3. Chapter 20 4. P.320","sourcePage":322},{"id":"8-063","category":"小兒泌尿","categoryOrder":8,"number":63,"question":"膀胱輸尿管逆流(vesicoureteral reflux, VUR)有機會 spontaneous resolution, 下列何者不是預後較佳的指標?","options":{"A":"Grade I-III VUR","B":"同時有 Bowel-bladder dysfunction 的 VUR","C":"產前檢查即看見 hydronephrosis","D":"非裔黑人嬰兒的 VUR","E":"1 歲以下 VUR"},"answer":"B","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell-Walsh Urology 12th ed. 12th ed., 2020 Chapter 29 (A) P.511 (B) P.515 (C) P.490 (D) P.490 (E) P.512","sourcePage":322},{"id":"8-064","category":"小兒泌尿","categoryOrder":8,"number":64,"question":"肉毒桿菌素(OnabotulinumtoxinA)可做為 neurogenic bladder 的治療, 關於 Franco 等發表在 2023 年 Journal of Urology 的研究報告, 以下何者錯誤?","options":{"A":"兒童常見 neurogenic detrusor overactivity(NDO) 的原因包括 meningomyelocele、transverse myelitis、spinal cord injury","B":"NDO 治療的最主要目標是透過將膀胱壓保持在安全範 圍內, 以避免膀胱以及上尿路的永久性損傷","C":"經由本試驗導出在 50U,100U,以及 200U 三個組別間, 肉毒桿菌素劑量越高, NDO 症狀可以改善的越明顯","D":"接受肉毒桿菌素注射的病童最高劑量可達到 200U 且多 數都可持續治療至 54 週以上","E":"此實驗證明只要在安全劑量內, 肉毒桿菌素的注射劑 量與注射次數和泌尿道感染的頻率與嚴重程度並無關 聯"},"answer":"C","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： 1. The Journal of Urology 2. April,2023 3. Vol.209 4. P.774-784","sourcePage":323},{"id":"8-065","category":"小兒泌尿","categoryOrder":8,"number":65,"question":"下列疾病有隱睾症風險較高，除了哪一項？","options":{"A":"臍膨出(omphalocele)","B":"皺梅腹綜合徵(prune belly syndrome)","C":"囊腫性纖維化(cystic fibrosis)","D":"肛門閉鎖(imperforate anus)","E":"先天性橫膈疝氣(congenital diaphragmatic hernia, CDH)"},"answer":"C","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell Urology 12th ch.46 page 4228-4230 Campbell Urology 12th Review ch.46 第 6 題","sourcePage":323},{"id":"8-066","category":"小兒泌尿","categoryOrder":8,"number":66,"question":"關於後尿道瓣膜(PUV)，下列敘述何者正確","options":{"A":"最常見的是第二型","B":"只影響到泌尿系統如腎臟、輸尿管、膀胱等","C":"最常見影像特徵是 VCUG 上可見到 Keyhole sign","D":"早期新生兒受後尿道瓣膜影響死亡的最常見原因是腎 衰竭","E":"產前影像可見到膀胱增厚、羊水過少、後尿道擴張"},"answer":"E","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)：","sourcePage":323},{"id":"8-067","category":"小兒泌尿","categoryOrder":8,"number":67,"question":"關於異位輸尿管(Ectopic ureter)下列何者正確?","options":{"A":"在女性中，異位輸尿管可能進入從膀胱頸到會陰的任 何地方，包括子宮、卵巢、輸卵管、尿道","B":"在男性中，異位輸尿管可能進入 Wolffian 結構如輸精 管、儲精囊或射精管，臨床表現以失禁為主","C":"在雙套集尿系統(duplex system)中，異位輸尿管一定 是下極(lower pole)輸尿管","D":"異位輸尿管可能出現在膀胱任何位置，包括側壁 (lateral wall)、膀胱三角(trigone)、膀胱頸(neck) 等","E":"在男性中，異位輸尿管最常出現的位置在後尿道"},"answer":"E","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell Urology 12th ch.41 page 3593-3596 Campbell Urology 12th review ch.41 第 1, 4 題 (A) 卵巢沒有 (B) 臨床表現沒有失 禁 (C) 上極(Upper pole) 不會出現在膀胱三角 (trigone)","sourcePage":323},{"id":"8-068","category":"小兒泌尿","categoryOrder":8,"number":68,"question":"Prune-belly syndrome 患者常見的非泌尿異常包括以下所 有情況，除了哪一項?","options":{"A":"腸阻塞(Intestinal obstruction)","B":"肺發育不全(Pulmonary hypoplasia)","C":"法洛氏四重症(tetralogy of Fallot)","D":"膝蓋凹陷(Dimpling of the knee)","E":"漏斗胸(pectus excavatum)"},"answer":"A","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell Urology 12th ch.32 page2611-2619 Campbell Urology 12th review ch.32 第 4 題","sourcePage":324},{"id":"8-069","category":"小兒泌尿","categoryOrder":8,"number":69,"question":"下列關於胎兒影像檢查敘述何者正確?","options":{"A":"AFI(The amniotic fluid index)為 four largest pockets of amniotic fluid 累加之總和","B":"UTD(urinary tract dilation)為第三常見之胎兒先天 異常","C":"在胎兒產檢，AFI(The amniotic fluid index): 20 為 正常值","D":"在第三孕期胎兒產檢，anterior-posterior renal pelvic diameter (APRPD): 16mm 為 moderate degree","E":"fetal cystoscopy 可以直接觀察到胎兒尿道前壁，除 可直接診斷外亦可以治療"},"answer":"A","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell 12e, chapter 22, page358-363 B:P.358 第二常見 C:P.358 8-18 為正常值 D:P.360 第三孕期 9-15mm 為 moderate degree E:P.363 可以直接觀察到 胎兒尿道後壁","sourcePage":324},{"id":"8-070","category":"小兒泌尿","categoryOrder":8,"number":70,"question":"下列關於小兒 UPJO(Ureteral Pelvic Junction Obstruction)敘述何者正確?","options":{"A":"pyeloplasty 為ㄧ種安全且併發症較少之手術方法， 成功率達 90-100%","B":"有一半之病患需進行手術治療","C":"約 30%之病患合併其他泌尿道異常","D":"Vascular hitch 適用於輕度腎水腫、有腎盞擴張 (calyceal dilation)之病人","E":"行微創手術時，最常見需要術中轉換成傳統開腹手術 的原因為 UPJ 沾黏難以分開"},"answer":"A","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell 12e, chapter 42, P.835 詳解: B:P.826 50%->33% C:P.826 30%->50% D:P.834 適用於中度腎水 腫、無腎盞擴張 E:P.835 最常見需要術中 轉換成傳統開腹手術的原 因為出血","sourcePage":324},{"id":"8-071","category":"小兒泌尿","categoryOrder":8,"number":71,"question":"下列關於隱睪(cryptorchidism)敘述何者正確?","options":{"A":"後天性隱睪(Acquired cryptorchidism)平均診斷年齡 為 4-8 歲","B":"後天性隱睪(Acquired cryptorchidism)若合併有尿道 下裂，較常見為遠端尿道下裂","C":"胚胎發育時期，體內賀爾蒙 Testosterone 和 INSL3 在 14-17 周達高峰","D":"近 6 成的 undescended testis 患者在體檢時可以摸到 睪丸","E":"有隱睪(cryptorchidism)之男童患生殖細胞瘤 (testicular germ cell tumor)的風險較其他男童高 出 6-8 倍"},"answer":"C","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell 12e, chapter 46 詳解: A:P.954 8-11 歲 B:P.954 較常見為近端尿 道下裂 D:P.958 75% to 80% E:P.970 2-5 倍","sourcePage":325},{"id":"8-072","category":"小兒泌尿","categoryOrder":8,"number":72,"question":"下列關於遺傳性腎臟囊性疾病(Inheritable cystic kidney disease)敘述何者正確?","options":{"A":"Medullary sponge kidney 為遺傳性腎臟囊性疾病","B":"von Hippel-Lindau disease 為體染色體顯性 (autosomal dominant, AD)且缺損位置為 chromosome 4","C":"ARPKD(Autosomal recessive polycystic kidney disease) 基因缺損位置為 chromosome 4","D":"在結節性硬化症(Tuberous Sclerosis)的病患中， RCC(renal cell carcinoma)的盛行率為 3%","E":"在 Juvenile nephronophthisis 病患中，常見合併骨 骼異常"},"answer":"D","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell 12e, chapter 39, P747 table 39-1 詳解: A:NONHERITABLE B:chromosome 3 C:chromosome 6 E:rare","sourcePage":325},{"id":"8-073","category":"小兒泌尿","categoryOrder":8,"number":73,"question":"下列關於小兒泌尿道感染敘述何者正確?","options":{"A":"約 4 成的兒童至少發生過一次反覆性泌尿道感染 (recurrent UTI)","B":"病童若有雙側腎結疤(bilateral renal scar)或是有 腎功能受損，需長期追蹤高血壓、腎功能、蛋白尿等， 需每月追蹤至診斷後 6 個月才能停止追蹤","C":"在小兒黃瘤肉芽腫性腎盂腎炎(Xanthogranulomatous Pyelonephritis,XGP)患者中，最常見之感染菌為腸球 菌屬(Enterococcus)","D":"Sulfonamides 會造成新生兒高膽紅素血症及核黃疸， 所以出生後 4 周後才可以使用","E":"小兒 febrile UTI，建議至少使用 7-14 天抗生素治療"},"answer":"E","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell 12e, chapter 25 詳解: A:P.445 keypoint 10-30% B:P.445 warrant long-term follow-up for assessment of hypertension, renal function, and proteinuria 而非 6 個月 即可 C:P.444 most commonly, Proteus or E. coli D:P.442 table 25.3 Contraindicated <6 wk","sourcePage":325},{"id":"8-074","category":"小兒泌尿","categoryOrder":8,"number":74,"question":"豪豪一出生就被診斷皺梅腹症候群(Prune-Belly Syndrome), 關 於下列敘述何者錯誤?","options":{"A":"特徵為腹部肌肉缺乏，雙側隱睪, 以及尿路異常","B":"大約一半的病人會出現 Kidney dysplasia","C":"豪豪的陰莖結構若無異常，建議做包皮環切術, 以降低 泌尿道感染發生率","D":"若豪豪腎功能下降，必須做腎臟皮質掃描(Tc99m-DMSA) 加 以評估","E":"順利接受睪丸固定術後，豪豪未來第二性徵發展與正常人 無異, 但很可能不孕"},"answer":"D","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell 12th ch.32, p581-601 (D)p591, 應做 VCUG","sourcePage":326},{"id":"8-075","category":"小兒泌尿","categoryOrder":8,"number":75,"question":"一位十二個月大的早產兒平平由父母帶至您的診間，主訴在外院 診斷出隱睪症(cryptorchidism)來徵詢第二意見。請間下列敘述 何者為真？","options":{"A":"若平平的睪丸經診斷後為 Ectopic testis 則其最有可能的 所在位置是 Superficial inguinal pouch","B":"睪丸由腹腔下降到陰囊的過程中 Gubernaculum 會在胚胎 8-10 周大時膨脹讓睪丸有足夠空間可以下降","C":"隱睪症較常發生在早產兒發生率約 60%，且較常發生在左邊 約佔 70%左右","D":"平平最適合的手術時機為 18 個月以後，但是即使順利手術 終身仍有睪丸癌的風險","E":"9 歲以前接受睪丸固定術則睪丸癌的風險約為正常人的 5 倍，若 15 歲以後接受手術則上升至 10 倍"},"answer":"A","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell 12th ch.46 (A) p958 (B) p951, 14-20 周 (C) p953, 早產兒 1-45%; p958 右邊較常發生 (D) p 965,出生後 6 個月 spontaneous descent failure 即可手術, 最好 在 12 個月以內 p970, 1.1-2.35 倍, 6.2 倍","sourcePage":326},{"id":"8-076","category":"小兒泌尿","categoryOrder":8,"number":76,"question":"八個月大的涵涵某天被奶奶發現摸不到右側睪丸，懷疑是隱睪 症，下列關於隱睪症(Cryptochidism)的敘述，下列何者錯誤?","options":{"A":"隱睪症發生在 1-9%的足月新生兒，1-45%的早產新生兒","B":"診斷以觸診為主，若觸診不到睪丸(non-palpable testis)，影像學如超音波及核磁共振可以輔助診斷睪丸位 置","C":"賀爾蒙治療如 Luteinizing hormone–releasing hormone (LHRH)或 hCG，效果不顯著，因此臨床上不建議使用","D":"青春期後的男童建議做睪丸切除術","E":"以上皆錯誤"},"answer":"B","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell 12th ch.46, p949-972 (B) p960, imaging is not indicated","sourcePage":326},{"id":"8-077","category":"小兒泌尿","categoryOrder":8,"number":77,"question":"下列關於泌尿生殖構造，何者不是從 mesonephric duct 發 育而來?","options":{"A":"Efferent ductules of testis","B":"Appendix of epididymis","C":"Ductus deferens","D":"Gartner duct","E":"Ureter"},"answer":"A","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell-Walsh Urology 12th Edition, p320 table.20.3/ (A) Efferent ductules of testis 是從 Mesonephric tubules 發 育而來","sourcePage":326},{"id":"8-078","category":"小兒泌尿","categoryOrder":8,"number":78,"question":"下列關於小兒可以開始考慮接受透析的敘述何者錯誤","options":{"A":"CKD stage V (GFR <15 mL/min/1.73 m2)","B":"CKD 伴隨控制不良的高血壓(uncontrolled hypertension)","C":"CKD 伴隨控制不良的糖尿病(uncontrolled diabetes mellitus)","D":"CKD 伴隨生長遲緩(poor growth)","E":"CKD 伴隨代謝異常(metabolic derangement)"},"answer":"C","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell-Walsh Urology 12th Edition, p.355-356/ (C) 沒有提到 糖尿病","sourcePage":327},{"id":"8-079","category":"小兒泌尿","categoryOrder":8,"number":79,"question":"下列關於產前腎水腫(Antenatal Hydronephrosis)的成因 何者發生率(Incidence)最低?","options":{"A":"短暫性泌尿道擴張 Transient urinary tract dilation","B":"膀胱輸尿管逆流(Vesicoureteral reflux)","C":"後尿道瓣膜(posterior urethral valve)","D":"腎多囊性發育不良（multicystic dysplastic kidney, MDCK）","E":"雙套集尿系統(Duplex system)，輸尿管囊腫 (ureterocele)，輸尿管異位（Ectopic ureter）"},"answer":"C","reference":"(112) /8.小兒泌尿/參考 資料(摘錄自)： Campbell-Walsh Urology 12th Edition, p.372/ (A)50-70%; (B)10-40%; (C)0.1-0.5%; (D) 2-5%; (E)5-7%","sourcePage":327},{"id":"8-080","category":"小兒泌尿","categoryOrder":8,"number":80,"question":"有關巨輸尿管(megaureter)的敘述何者最不正確？","options":{"A":"初級阻塞型巨輸尿管(primary obstructed megaureter)多塞在遠端輸尿管或膀胱輸尿管交口","B":"30 週後發現胎兒的輸尿管直徑超過 7mm，產後須儘早 追蹤腎臟超音波","C":"若輸尿管開口非常大，輸尿管重種手法應選擇 Politano-Leadbetter，而非 Lich-Gregoir","D":"手術重建時輸尿管開口直徑和肌肉包埋的長度比例為 1:5 以達抗逆流的效果","E":"手術適應症包含反覆泌尿道感染或患側腎功能核醫檢 查低於 40%"},"answer":"C","reference":"(113)/Campbell - Walsh Urology 12th edition Ch 22 and Ch 42 C: extravesical 優於 intravescial, 避免膀胱 過度 dissection 和 trigone 損傷","sourcePage":327},{"id":"8-081","category":"小兒泌尿","categoryOrder":8,"number":81,"question":"有關男性尿道的胚胎發育和尿道下裂(hypospadias)，以下 敘述何者有誤？","options":{"A":"龜頭尿道(glanular urethra)起源於外胚層，而其它 的陰莖尿道則是起源於內胚層","B":"包皮的發育和尿道的發育密切相關，因此尿道下裂患 者之包皮典型會呈現腹側缺損而背側過度發育 (hooded foreskin)","C":"陰莖幹(penile shaft)和龜頭(glans penis)的尿道形 成機轉不同，因此尿道下裂患者的異位尿道開口最常 見是在陰莖幹和龜頭交接處","D":"5α-reductase type 2 在正常尿道發育過程扮演重要 且不可或缺的角色","E":"尿道下裂常合併陰莖彎曲，若考慮白膜摺疊手術 (tunica albuginea plication)，陰莖 12 點鐘方向沒 有神經分佈，適合做為 plication 的位置"},"answer":"A","reference":"(113) 參考資料(摘錄自)： Campbell-Walsh Urology, 12th Edition, pp305-310","sourcePage":327},{"id":"8-082","category":"小兒泌尿","categoryOrder":8,"number":82,"question":"以下哪一項不是 Prune-Belly Syndrome 第一類(category I)的特徵?","options":{"A":"Renal dysplasia","B":"Oligohydramnios","C":"No pulmonary hypoplasia","D":"Potter features","E":"Urethral atresia"},"answer":"C","reference":"(113)/ 參考資料(摘錄 自)： Campbell-Walsh Urology, 12th, chapter 32, P589, Table 32.2 C 是 pulmonary hypoplasia","sourcePage":328},{"id":"8-083","category":"小兒泌尿","categoryOrder":8,"number":83,"question":"下列哪一個症狀發展成 Wilms Tumor 的風險最高?","options":{"A":"Denys-Drash","B":"Beckwith-Wiedemann","C":"Hemihypertrophy","D":"Simpson-Golabi-Behmel","E":"Li-Fraumeni"},"answer":"A","reference":"(113)/ 參考資料(摘錄 自)： Campbell-Walsh Urology, 12th, chapter 53, P1099, Table 53.4 A:high risk: 50% B:moderate risk: 5%–10% C:moderate risk: 5% D:moderate risk: 10% (in males) E:low risk: low","sourcePage":328},{"id":"8-084","category":"小兒泌尿","categoryOrder":8,"number":84,"question":"關於兒童常見影像檢查，以下敘述何者有誤？","options":{"A":"腎臟超音波評估水腎(hydronephrosis)的嚴重程度最 主要是根據 The Society for Fetal Urology classification system，包括腎盞擴張程度、腎實質 有否變薄等評估參數","B":"兒童腎臟腫瘤根據超音波特徵、年齡、症狀就可診斷， 不一定需要安排進一步電腦斷層檢查，減少輻射線的 暴露","C":"腎臟皮質攝影(Tc-99m-DMSA renal cortical scintigraphy)是利用核醫藥物 Tc-99m-DMSA 結合於 近端腎小管之上皮細胞，因此可做為腎實質之結構檢 查，以診斷急性腎盂腎炎","D":"腎臟利尿掃描(diuretic renal scintigraphy) 可使 用 Tc-99m-DTPA 或是 Tc-99m-MAG3 作為放射性同位 素，兒童較常使用 MAG3，主要是經由腎小管分泌而排 泄出去","E":"在發燒性泌尿道感染(febrile urinary tract infection)早期安排排尿膀胱尿道攝影(voiding cystourethrography, VCUG)，有可能高估膀胱輸尿管 逆流(vesicoureteral reflux, VUR)的嚴重程度"},"answer":"B","reference":"(113) 參考資料(摘錄自)： Campbell-Walsh Urology, 12th Edition, pp404-406, pp415, pp418-419","sourcePage":328},{"id":"8-085","category":"小兒泌尿","categoryOrder":8,"number":85,"question":"下列腎絲球疾病(Glomerular Disease)何者不是好發在 1-10 歲？","options":{"A":"Acute poststreptococcal glomerulonephritis (GN)","B":"Minimal change nephrotic syndrome (MCNS)","C":"Focal segmental glomerulosclerosis (FSGS)","D":"Henoch-Schönlein purpura (HSP)","E":"Diffuse mesangial sclerosis"},"answer":"E","reference":"(113) Campbell 12th p344 Box 21.3 E: 好發於小於 1 歲","sourcePage":329},{"id":"8-086","category":"小兒泌尿","categoryOrder":8,"number":86,"question":"幼兒睪丸扭轉(testicular torsion),以下何者為非?","options":{"A":"若發生產前(prenatal) 睪丸扭轉，患側陰囊顏色較 暗紅，尺寸與對側相比增大，且患側睪丸觸診硬實而 無壓痛","B":"新生兒產前睪丸扭轉可拯救(salvage) 的機率低,但 產後 30 天內發生的睪丸扭轉拯救的機率可達四成","C":"嬰幼兒睪丸發生扭轉時，患側陰囊的理學檢查會無法 看到提睪肌反射(cremasteric reflex)，而將患側陰 囊提高可以觀察到患者疼痛反應減輕","D":"若確認新生兒產前睪丸扭轉，對側睪丸是否需要進行 陰囊探查以及睪丸固定術(orchidopexy)仍沒有定論","E":"新生兒產後 30 天內睪丸扭轉是屬於鞘膜外 (extravaginal)扭轉"},"answer":"C","reference":"(113)Campbell Walsh Wein Urology, 12th Edition, Chapter 22, P387, EAU Paediatric Urology; 3.6. Acute scrotum; 3.6.2. Diagnostic evaluation","sourcePage":329},{"id":"8-087","category":"小兒泌尿","categoryOrder":8,"number":87,"question":"請問下列何者不是女性異位輸尿管(Ectopic Ureter)可能 的位置？","options":{"A":"輸卵管(Fallopian tube)","B":"子宮(Uterus)","C":"卵巢(Ovary)","D":"陰道前庭(Vaginal vestibule)","E":"直腸(Rectum)"},"answer":"C","reference":"(113) 1. Campbell-Walsh Urology 12th ed. 2. 12th ed., 2020 3. Chapter 41 P.798","sourcePage":329},{"id":"8-088","category":"小兒泌尿","categoryOrder":8,"number":88,"question":"下列有關尿道下裂(Hypospadias)的敘述何者正確?","options":{"A":"診斷是根據理學檢查，需符合以下三項特徵:尿道口異 位且位於陰莖腹側（ectopic, ventrally located urethral meatus）、陰莖腹側彎曲（ventral penile curvature）、包皮腹側呈帽狀不完整覆蓋 （incomplete, ventrally hooded foreskin）","B":"嚴重程度是依據尿道口的位置來分類，其中近端型尿 道下裂（proximal hypospadias）約佔 10%至 25%，近 (B) 端型尿道下裂位置包括近端陰莖(proximal penile)、 陰莖陰囊交界處（penoscrotal）、陰囊（scrotal）、 會陰部（perineal）","C":"遠端型尿道下裂比近端型尿道下裂有顯著較高的性別 (C) 發育異常(Disorders of Sexual Development)","D":"人工生殖技術（assisted reproduction）出生的嬰兒 (D) 以及同卵雙胞胎（monozygotic twins）會增加尿道下 裂（hypospadias）的風險","E":"在進行 distal tubularized incised plate (TIP)時 避免將尿道成形術(urethroplasty)的縫合延伸得過 於近端，會增加尿道口狹窄（meatal stenosis）的風 險"},"answer":"D","reference":"(114) Campbell’s Urology, 12th edition, Chapter 45 (A) p905 右下 diagnosis of hypospadias, 是 incomplete, dorsally hooded foreskin p907 Fig.45.4 proximal hypospadias 只包括 penoscrotal, scrotal, perineal p908 近端比遠端更顯 著有 DSD (64% vs. 7%) 正確 p909 keypoint There is an increased risk of hypospadias in births resulting from assisted reproduction and monozygotic twins p921 and Fig.45.18 是延伸過於遠端","sourcePage":329},{"id":"8-089","category":"小兒泌尿","categoryOrder":8,"number":89,"question":"關於隱睪症的相關敘述何者錯誤？ (11","options":{"A":"就算一歲前執行 orchiopexy，兩側睪丸仍有較高的睪 Chp 丸癌風險，在 descended testis 多為 non-seminoma，Tab 在 undescended testis 多為 seminoma Tra","B":"有隱睪症且經過手術治療的男性日後執行取精的成功 loc 率約有 74% 最常","C":"多於兩顆睪丸的先天變異稱為 polyorchidism，通常單 Pal 側發生在左側 位置","D":"懷疑腹部內異位睪丸（ectopic abdominal testis） ing 的患者，在腹腔鏡探查後仍找不到就可安排 MRI 影像 輔助診斷","E":"可觸摸到的隱睪最常摸到的位置是為 transinguinal peeping location，比例約 25-50%"},"answer":"E","reference":"4)Campbell 12th ed. 46 p949-952. & Chp67 le 67.5. ns-inguinal peeping ation 是 nonpalpable 見位置佔據 25-50%， pable testis 最常見 是 SIP: superficial uinal pouch","sourcePage":330},{"id":"8-090","category":"小兒泌尿","categoryOrder":8,"number":90,"question":"媽媽最近發現 11 個月大的小波左側的陰囊比右側大很多，參考 早上起床的時候會稍微小一些，到門診求診時醫生用手電 EAU 筒照在腫大的陰囊上看起來呈現透光現象，以下關於評估 Pae 及處置的敘述何者正確？ Sum","options":{"A":"導因於 tunica vaginalis 通道未關閉 Upd","B":"自行緩解機率很低，建議手術治療 2024","C":"四歲以內建議同時探查對側 vaginalis 通道是否關 閉，若未關閉，建議同時修補，減少未來疝氣發生的 機會","D":"若選擇腹腔鏡手術，腹內壓力不能太高，建議維持在 6–8 mm Hg","E":"不到一歲的幼兒腎臟發育未成熟，術後止痛藥盡量避 免 NSAIDs"},"answer":"D","reference":"資料(摘錄自)： /ESPU Guidelines on diatric Urology: mary of the 2024 ates. Eur Urol ;86:447-456","sourcePage":330},{"id":"8-091","category":"小兒泌尿","categoryOrder":8,"number":91,"question":"關於的隱睪症(cryptorchidism)之敘述，下列敘述何者錯 誤?","options":{"A":"大約 80%的隱睪是 palpable，其中 60%至 70%是 unilateral。","B":"患有隱睪症的男孩，其睪丸癌(testicular germ cell tumor)的風險高出 2 到 5 倍","C":"對於在 6 個月大後仍未下降的睪丸，建議進行睪丸固 定術","D":"建議使用 hormone therapy, 可增加睪丸下降的機會","E":"足月男性嬰兒中,隱睪症發生率約 1%至 4% 題號 答案 考 題"},"answer":"D","reference":"(114)/Campbell-Walsh Urology 12th Edition Chapter 46 P. 972 (D)不建議使用 hormone therapy 年度 類別 參考資料","sourcePage":331},{"id":"9-001","category":"移植","categoryOrder":9,"number":1,"question":"腎臟移植三個月以後，在追蹤過程發現移植腎臟輸尿 管有阻塞(ureteral obstruction)問題。請問下列可 能造成的因素何者平均機率最小？","options":{"A":"輸尿管結石","B":"淋巴機液壓迫","C":"輸尿管狹窄","D":"免疫抑制劑藥物造成纖維化","E":"手術技術縫合失誤"},"answer":"E","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology, 12th edition. Chapter 88, p1937","sourcePage":332},{"id":"9-002","category":"移植","categoryOrder":9,"number":2,"question":"根據歐洲泌尿科醫學會 (EAU)的腎臟移植治療指 引，關於屍腎獲取時若有腎功能異常疑慮進行評估而 施行供腎組織切片(procurement biopsy)，下列敘述 何者正確？","options":{"A":"若於切片檢視發現有超過 40%的組織呈現全體 腎絲球硬化(globally sclerotic glomeruli) 則該移植腎預後不佳","B":"有腎臟病理學訓練之一般病理科醫師尚不夠訓 練資格來判讀此切片結果","C":"腎臟移植治療指引建議僅根據組織學發現評估 接受該移植器官的決定","D":"足夠的組織判讀需要有 15 個腎絲球或超過一條 腎動脈","E":"切片中同時出現腎絲球硬化 (glomerulosclerosis)或腎小管間質損傷 (tubulointerstitial injury)對於評估移植腎 長期預後的因子價值有限"},"answer":"E","reference":"(110)/9.移植/參考資料(摘 錄自)：EAU Guidelines 2020(Renal Transplantation) P 8-10","sourcePage":332},{"id":"9-003","category":"移植","categoryOrder":9,"number":3,"question":"下列關於腎臟移植 recipient 的手術，何者正確?","options":{"A":"不建議在 recipient 手術前使用廣效抗生素沖 洗膀胱","B":"可以選擇 midline 或者 Gibson incision。若選 擇 Gibson incision 進入後腹腔為了足夠的手術 視野，可以犧牲 inferior epigastric artery","C":"手術時需注意在 psoas muscle 上的 ilioinguinal nerve, 避免誤傷","D":"最常選擇的吻合腎動脈與腎靜脈的血管是 internal iliac artery and internal iliac vein","E":"腎動脈跟 recipient 的 iliac artery 吻合時建 議使用 5-0 or 6-0 單股可吸收的線"},"answer":"B","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology 11th Ch.47, page 1079-1082 A.建議 B. correct C. genitofemoral nerve D. external iliac a and V E. monofilament, nonabsorbable","sourcePage":332},{"id":"9-004","category":"移植","categoryOrder":9,"number":4,"question":"腎移植患者，下列何種腎臟疾病有高復發率，導致移 植腎臟衰竭(graft failure)？","options":{"A":"慢性腎絲球腎炎(Chronic glomerulonephritis)","B":"局部性腎絲球硬化症(Focal segmental glomerulosclerosis)","C":"A 型免疫球蛋白腎病變(IgA nephropathy)","D":"家族性出血性腎炎(Alport syndrome)","E":"自體顯性多囊性腎臟病(Autosomal dominant polycystic kidney disease)"},"answer":"B","reference":"(110)/9.移植/參考資料(摘 錄自)：第 11 版 Campbell 47 Renal transplantation p1070","sourcePage":333},{"id":"9-005","category":"移植","categoryOrder":9,"number":5,"question":"下列關於腎臟移植手術的併發症何者錯誤？","options":{"A":"移植術後馬上發生的血尿經常是與膀胱輸尿管 吻合相關大部分都會自行緩解","B":"然而若是因為移植腎切片造成的持續血尿常肇 因於 arteriovenous collecting system fistula。大約有 70%會自行緩解","C":"腎臟移植術後發生尿液滲漏的比率大約是 1.2% to 8.9%。主要發生的原因是取器官時造成 distal ureter 的血液供應受損","D":"臨床上有意義的膀胱輸尿管逆流 (Vesicoureteral reflux)發生率大約 3.5%, 且 與手術中使用的 ureterovesical anastomosis 技巧無關","E":"輸尿管狹窄(ureter stricture)是造成術後 3 個 月輸尿管阻塞的主要原因。造成 ureter stricture 的主要原因是組織缺血(ischemia)"},"answer":"D","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology 12th Ch.88, page 1936-1939 D. less than 1%","sourcePage":333},{"id":"9-006","category":"移植","categoryOrder":9,"number":6,"question":"下列關於腎臟移植後糖尿病何者錯誤？","options":{"A":"腎臟移植後新發生的糖尿病大約佔腎移植患者 的 10-20%","B":"其發生與胰島素分泌受損以及周邊組織的胰島 素抗性(insulin resistance)都有關係","C":"糖尿病患者受到黴菌感染的機會較高，可能會產 生 Candida urinary infection 或者 esophagitis, 可以在移植術後口服 fluconazole 或 clotrimazole 預防","D":"免疫抑制劑的使用包含類固醇, cyclosporine, Tacrolimus 也會促使糖尿病發生，又以 cyclosporine 的影響大於 tacrolimus","E":"家族遺傳史，年長，血脂肪異常，久坐不動的生 活型態，病毒感染都是產生糖尿病的危險因子"},"answer":"D","reference":"(110)/9.移植/參考資料(摘 錄自)：Smith and Tanagho’s general urology 18th page 560-566 D. Tacrolimus > cyclosporin","sourcePage":333},{"id":"9-007","category":"移植","categoryOrder":9,"number":7,"question":"下列關於移植腎摘除(allograft nephrectomy)的敘 述，何者為真？","options":{"A":"對於所有衰竭的移植腎(failed kidney transpolant)，均須進行移植腎摘除","B":"移植腎摘除手術是一相對簡單的手術，沒有任何 經驗也可以施行","C":"如果移植腎在一年內衰竭，進行移植腎摘除手 術，可以減少循環抗人類白血球抗原抗體 ( level of circulating antihuman leukocyte antigen antibodies)","D":"來自移植腎的移植後血尿是移植腎摘除手術的 絕對適應症","E":"對於一位要再次第二次腎移植的受贈等候者，必 須先進行移植腎摘除手術"},"answer":"C","reference":"(110)/9.移植/參考資料(摘 錄自)：第 11 版 Campbell 47 Renal transplantation p1086-1087","sourcePage":334},{"id":"9-008","category":"移植","categoryOrder":9,"number":8,"question":"進行腎臟移植手術時，我們會使用Kidney Donor Profile Index(KDPI)10項參數來評估捐贈者的身體 狀態，請問下列何者為非？","options":{"A":"身高","B":"B 型肝炎帶原","C":"體重","D":"年齡","E":"種族"},"answer":"B","reference":"(110)/9.移植/參考資料(摘 錄自)：Smith & Tanagho’s General Urology, 19th edition. Chapter 36, p563","sourcePage":334},{"id":"9-009","category":"移植","categoryOrder":9,"number":9,"question":"下列情況，預接受腎臟移植手術的受贈者不需要在手 術前先進行腎臟切除手術(pretransplant nephrectomy)？","options":{"A":"反覆性腎盂腎炎","B":"嚴重蛋白尿","C":"高血壓","D":"多囊腎合併反覆出血、感染","E":"抗腎絲球基底膜抗體存在"},"answer":"C","reference":"(110)/9.移植/參考資料(摘 錄自)：Smith & Tanagho’s General Urology, 19th edition. Chapter 36, p565","sourcePage":334},{"id":"9-010","category":"移植","categoryOrder":9,"number":10,"question":"下列藥物中，何者不會增加 Cyclosporine 及 Tacrolimus 的血液中藥物濃度？","options":{"A":"Rifampin","B":"Erythromycin","C":"Ketoconazole","D":"Methylprednisolone","E":"Cimetidine"},"answer":"A","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology, 11th edition. Chapter 47, p1085","sourcePage":334},{"id":"9-011","category":"移植","categoryOrder":9,"number":11,"question":"受贈者在完成腎臟移植後，到門診詢問有關懷孕 (pregnancy)等事宜，下列描述何者不對？","options":{"A":"建議腎臟移植術後至少一年再考慮懷孕","B":"50%的孕婦會發生早產","C":"30%的孕婦會發生子癲前症","D":"20%的孕婦有排斥機率","E":"男性腎臟移植術後會增加精子再生能力 (spermatogenesis)"},"answer":"D","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology, 11th edition. Chapter 47, p1087","sourcePage":335},{"id":"9-012","category":"移植","categoryOrder":9,"number":12,"question":"關於腎臟移植受贈者術後與癌症發生的敘述，下列何 者有誤？","options":{"A":"免疫抑制劑中，mycophenolate mofetil 反而可 以降低癌症發生","B":"腎移植病患癌症治療以手術切除腫瘤為主，除非 癌症已經多處轉移無法控制，才考慮停止免疫抑 制劑","C":"腎移植後病患有較高的癌症發生率與免疫抑制 劑所導致的免疫不全有關","D":"在台灣，腎移植後最常發生的癌症是肝癌與膀胱 癌","E":"捐贈者若有癌症，並不會藉由捐贈的腎臟將癌細 胞轉移至受贈者"},"answer":"E","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell Walsh Urology 11th edition, p1069-1088","sourcePage":335},{"id":"9-013","category":"移植","categoryOrder":9,"number":13,"question":"關於腎臟移植，下列敘述何者錯誤？","options":{"A":"腎移植最適宜的器官保存液是 University of Wisconsin (UW) solution","B":"有症狀的多囊性腎病(polycystic kidney disease)可考慮在移植前先作原腎切除(native kidney nephrectomy)","C":"不可使用 phospho-soda enema (Fleet)在腎移 植術後的便秘","D":"預防 cytomegalovirus(CMV)感染的藥物使用 ganciclovir","E":"活體捐贈在摘取腎臟時，一般使用單一 Hem-o -Lok 血管夾截斷腎動脈避免截斷太長的腎動脈"},"answer":"E","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell Walsh Urology 11th edition, p1082-1087","sourcePage":335},{"id":"9-014","category":"移植","categoryOrder":9,"number":14,"question":"腎移植受贈者在移植手術前，何種情況不需將原本腎 臟切除？","options":{"A":"因腎結石或尿液逆流導致反覆腎盂腎炎","B":"嚴重蛋白尿","C":"多囊腎病變","D":"無法控制的腎性高血壓","E":"懷疑腎腫瘤無法控制的腎性高血壓"},"answer":"C","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell Walsh Urology 11th edition, p1069-1088","sourcePage":335},{"id":"9-015","category":"移植","categoryOrder":9,"number":15,"question":"小兒移植腎，最常見失敗的原因是？","options":{"A":"原發性吻合失敗(primary anastomotic failure)","B":"復發性尿路阻塞(recurrent obstructive uropathy)","C":"抗體介導的排斥反應(antibody mediated rejection)","D":"慢性同種異體腎病(chronic allograft nephropathy)","E":"急性細胞排斥反應(acute cellular rejection)"},"answer":"D","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell-Walsh-Wein Urology 12th Edition Review (2020, Elsevier) Chapter21. P.268","sourcePage":336},{"id":"9-016","category":"移植","categoryOrder":9,"number":16,"question":"關於腎移植病人術後產生膀胱輸尿管逆流 (Vesicoureteral reflux,VUR)的敘述，何者正確?","options":{"A":"術後膀胱排尿造影(voiding cystography)，有 10~30% 病人會發現 VUR","B":"而其中有一半的病人，約 5~15%會有顯著與 VUR 相關之症狀","C":"使用 intra (Leadbetter-Politano) ureteroureterostomy 的接合方式較容易造成 VUR","D":"術後有使用 ureteral stent 與 VUR 無關","E":"使用內視鏡在 submucosal 注射 Teflon 或 Macroplastique，即使是 high-grade 病人，也 有 30%成功率"},"answer":"E","reference":"(110)/9.移植/參考資料(摘 錄自)：EAU Guidelines 2020(Renal Transplantation) P 16-17 Campbell Urology 12th Chapter88.","sourcePage":336},{"id":"9-017","category":"移植","categoryOrder":9,"number":17,"question":"下列敘述關於移植腎的摘除(allograft nephrectomy)，何者正確?","options":{"A":"因慢性排斥造成之無功能移植腎，大部分皆需要 摘除","B":"出現壓痛、血尿或類流感症狀等問題時，尚不考 慮將無功能移植腎移除","C":"一年內就失敗的移植腎，大部分都不需要摘除","D":"在移植後的 6 週內，移除所有的移植組織通常是 一個直觀的過程(straightforward procedure)","E":"摘除慢性排斥之無功能移植腎時，建議完整取 下，不可留下殘存組織，以減少出血"},"answer":"D","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell Urology 11th P.1086-1087","sourcePage":336},{"id":"9-018","category":"移植","categoryOrder":9,"number":18,"question":"下列關於移植後之惡性腫瘤(post-transplant malignancy)敘述，何者正確?","options":{"A":"長期使用免疫抑制劑會增加全部惡性腫瘤之風 險","B":"皮膚癌與乳癌是最常見的","C":"罹患攝護腺癌風險明顯增加","D":"若移植腎長出腎細胞癌，可考慮做 partial nephrectomy","E":"若移植後發現膀胱有 superficial transitional cell carcinoma ，第一線的 adjuvent therapy 為 BCG"},"answer":"D","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell Urology 11th P.1087","sourcePage":336},{"id":"9-019","category":"移植","categoryOrder":9,"number":19,"question":"根據 ERACODA (European Renal Association COVID-19 Database)下列關於洗腎病患以及腎移植 病患感染 COVID-19 的敘述何者為非?","options":{"A":"感染 COVID-19 的腎移植患者住院治療的比例比 感染 COVID-19 的洗腎患者高","B":"住院的病人中，入住加護病房的病人比例以洗腎 患者高於腎移植患者","C":"腎移植患者感染 COVID-19 後，28 日內死亡率為 21.3%，略低於洗腎患者的 25.0%, 但是差距沒 有達到統計上的顯著差異","D":"對於腎移植患者感染 COVID-19 後 28 日內死亡的 危險因子包括: 年紀大, 高呼吸頻率 (respiratory rate), 以及高的 CRP 值，其中以 年紀為最重要的危險因子","E":"肥胖也是對於感染 COVID-19 後 28 日內死亡的危 險因子，其對洗腎患者的影響大於腎移植患者"},"answer":"B","reference":"(110)/9.移植/參考資料(摘 錄自)：Nephrol Dial Transplant . 2020 Nov 1;35(11):1973-1983. A.KT 89%, 洗腎 70% B.KT 21%, 洗腎 12% E.對於 KT 病人，有沒有肥胖 死亡率沒差。","sourcePage":337},{"id":"9-020","category":"移植","categoryOrder":9,"number":20,"question":"下列關於促進腎臟移植供需平衡的敘述何者錯誤？","options":{"A":"在腎移植等待名單的患者從 2000 以來逐漸上 升，截至 2018 年 4 月在美國約有 10 萬人在等待 名單上","B":"使用來自更年長的屍腎移植(deceased-donor kidney)是一個可行的辦法。在美國大於 65 歲的 deceased-donor 從 1990 年的 1.9%上升到 2017 年的 4.9%","C":"然而來自較年長的 deceased donor kidney 比 較容易引起免疫反應，尤其如果受贈者為年輕人 acute rejection 的機會比受贈者為年長者來得 大","D":"donation after cardiac death [DCD] 也可以 作為擴大 donor poll 的一個做法。但是比起年 長的 brain-dead donors, 年長的 DCD 有比較差 的移植後兩年腎功能, eGFR 分別為 47ml/min/1.73 m2 以及 33ml/min/1.73 m2","E":"由於現今核酸檢測的技術提升，靜脈毒癮患者雖 可能帶有 HCV, HIV 的風險，若是術前的核酸檢 測為陰性，經由捐贈腎臟傳染 HCV 與 HIV 的風險 都小於萬分之一"},"answer":"E","reference":"(110)/9.移植/參考資料(摘 錄自)：Improving the Supply and Quality of Deceased-Donor Organs for Transplantation. N Engl J Med. 2018 Aug 16;379(7):692. E. the risk of viral transmission from a donor with high-risk behavior and negative results of nucleic acid testing is less than 1 case per 1000 donors for HCV and 1 per 10,000 for HIV.","sourcePage":337},{"id":"9-021","category":"移植","categoryOrder":9,"number":21,"question":"病人接受腎臟移植後，下列關於泌尿相關癌症之敘 述，何者為非?","options":{"A":"發生腎細胞癌的比率高於一般人，佔移植後腫瘤 總數的 4.6%","B":"有 10%的腎細胞癌會發生在移植的腎臟","C":"尿路上皮癌發生機率為一般人的三倍","D":"高風險之非侵襲性膀胱腫瘤(high-risk non-muscle invasive bladder cancer)可以使 用 BCG 治療","E":"大部分發生在原生腎臟的腎細胞癌為高惡性度 腫瘤"},"answer":"E","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology, 12th edition p.1940~1941","sourcePage":338},{"id":"9-022","category":"移植","categoryOrder":9,"number":22,"question":"關於小兒腎臟移植，下列何者為非?","options":{"A":"小兒活體腎臟移植後發生延遲腎功能恢復之病 人需要透析者(DGF)約為 5%~15%","B":"小兒腎臟移植術後第一年發生急性細胞排斥 (acute cellular rejection)之比率為 25-50%","C":"若膀胱容積小於該年紀預期容量的 75%，需要考 慮移植前進行膀胱擴大術(Augmentation)","D":"膀胱壓力大於 30 cm H 0，需要考慮移植前進行 2 膀胱擴大術(Augmentation)","E":"嚴重腎病症候群伴隨蛋白質流失的營養不良 (Profound nephrotic syndrome with malnutrition resulting from protein loss) 為原腎切除手術(Native nephrectomy)的手術 適應症"},"answer":"B","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology, 12th edition p.357, p.1059","sourcePage":338},{"id":"9-023","category":"移植","categoryOrder":9,"number":23,"question":"關於腎臟移植之抗排斥藥物的副作用，下列何者有 誤?","options":{"A":"Tacrolimus 會影響到中樞神經系統","B":"Sirolimus 會影響傷口癒合的藥物","C":"Mycophenolate 會影響造血功能","D":"Sirolimus 有較高的腎毒性","E":"Sirolimus 易造成血脂異常(dyslipidemia)"},"answer":"D","reference":"(110)/9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology, 11th edition p.1085, TABLE 47-4","sourcePage":338},{"id":"9-024","category":"移植","categoryOrder":9,"number":24,"question":"腎臟移植後排斥之治療，下列何者有誤?","options":{"A":"發生 Banff I 或 II 的急性排斥，使用經靜脈高 劑量類固醇脈衝療法(high-dose intravenous steroid pulse therapy)","B":"細胞性排斥(Cellular rejection) 可使用 Rituximab 治療","C":"如果出現抗體調節性排斥(Antibody mediated rejection)，可使用血漿分離術 (plasmapheresis)","D":"抗體調節性排斥(Antibody mediated rejection)可使用經靜脈高劑量類固醇脈衝療 法(high-dose intravenous steroid pulse therapy)","E":"對於類固醇治療無效急性排斥，可以 Thymoglobulin 治療"},"answer":"B","reference":"(110)/9.移植/參考資料(摘 錄自)：Smith General Urology, 18th edition, p.560,563~564","sourcePage":338},{"id":"9-025","category":"移植","categoryOrder":9,"number":25,"question":"最新美國移植醫學會對於器官移植病患使用武漢肺 炎(COVID-19)疫苗的建議(5/17/2021)，以下何者錯 誤？","options":{"A":"器官移植病患建議可施打疫苗","B":"感染武漢肺炎後痊癒病患，建議仍應施打疫苗","C":"剛接受移植手術病患，可在手術後一個月開始施 打疫苗","D":"為評估疫苗有效性，建議測量血中中和抗體濃度","E":"施打疫苗時，不需要調整免疫抑制劑"},"answer":"D","reference":"(110)/9.移植/參考資料(摘 錄自)：COVID-19 FAQ sheet, American society of transplantation","sourcePage":339},{"id":"9-026","category":"移植","categoryOrder":9,"number":26,"question":"活體腎捐贈者，在捐贈腎臟後，腎功能預期可以恢復 到多少的腎功能？","options":{"A":"50%","B":"60%","C":"75%","D":"90%","E":"95%"},"answer":"C","reference":"(110)/9.移植/參考資料(摘 錄自)：第 11 版 Campbell 47 Renal transplantation. P1078","sourcePage":339},{"id":"9-027","category":"移植","categoryOrder":9,"number":27,"question":"當下列何種試驗呈陽性反應時，進行腎移植手術後， 有高風險發生超急排斥反應(hyperacute rejection)？","options":{"A":"B 淋巴球流式細胞儀交叉配對 (B cell flow crossmatch)","B":"T 淋巴球流式細胞儀交叉配對(T cell flow crossmatch)","C":"B 淋巴球交叉試驗(B cell complement-dependent cytotoxicity crossmatch)","D":"T 淋巴球交叉試驗(T cell complement-dependent cytotoxicity crossmatch)","E":"DR 淋巴球流式細胞儀交叉配對(DR cell crossmatch)"},"answer":"D","reference":"(110)/9.移植/參考資料(摘 錄自)：第 11 版 Campbell 47 Renal transplantation p1083-1084","sourcePage":339},{"id":"9-028","category":"移植","categoryOrder":9,"number":28,"question":"對於移植前有癌症病史的器官移植受贈等待者，由於 移植後免疫抑制劑的使用會增加癌症復發的風險，需 有一段等待時間，下列有關於等待時間的建議何者是 錯誤？","options":{"A":"對於低風險或零風險復發的癌症，建議至少 2 年的等待時間(two-year waiting time)","B":"對於先前有治療的低風險攝護腺癌( PSA < 10 ng/ml or T1c-T2a, Gleason Sum 6) ，可以不 需有等待時間(no wait time)","C":"對於先前接受切除 T1a 腎細胞癌，可以不需有等 待時間(no wait time)","D":"對於肌肉侵犯性膀胱癌(MIBC)患者接受膀胱切 除(postcystectomy)後，需等待至少 2 年","E":"對於肌肉侵犯性膀胱癌(MIBC)患者接受膀胱保 留治療(bladder sparing approach with chemoradiation)後，需等待至少 2 年"},"answer":"E","reference":"(110)/9.移植/參考資料(摘 錄自)：American Journal transplantation 2021 Vol(21): p461-469","sourcePage":340},{"id":"9-029","category":"移植","categoryOrder":9,"number":29,"question":"針對腎臟移植等候者(candidates)，發表的 Expected posttransplant survival (EPTS) score，來預測移 植腎的預後，請問下列哪一項不是 EPTS 的評估項目?","options":{"A":"年紀(age)","B":"洗腎時間(time on dialysis)","C":"是否有糖尿病(presence of diabetes)","D":"是否曾經有移植過(prior transplantation of any organ)","E":"心跳停止後捐贈(donation after cardiac death status)"},"answer":"E","reference":"(111) 參考資料(摘錄自)：Smith & Tanagho’s General Urology, 19th edition. Chapter 36, p.563","sourcePage":340},{"id":"9-030","category":"移植","categoryOrder":9,"number":30,"question":"免疫抑制劑藥物的作用機轉，下列描述何者不正確?","options":{"A":"Mycophenolate mofetil 抑制嘌呤合成 (inhibits purine synthesis)","B":"Glucocorticoids 降低細胞激素基因轉錄 (reduce transcription of cytokine genes)","C":"Everolimus 抑制嘌呤合成 (inhibits purine synthesis)","D":"Tacrolimus 抑制鈣調磷酸酶及白血球介素 2 製 造 (inhibits calcineurin and IL-2 production)","E":"Basiliximab 阻斷白血球介素 2 受體 (block IL-2 receptor)"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 11th edition. Chapter 47,p.1085","sourcePage":340},{"id":"9-031","category":"移植","categoryOrder":9,"number":31,"question":"使用免疫抑制劑藥物 Cyclosporine 或 Tacrolimus 時，若同時有服用下列所述藥物，會降低 Cyclosporine 或 Tacrolimus 的血液中藥物濃度。下 列哪種藥物除外?","options":{"A":"Rifampin","B":"Erythromycin","C":"Isoniazid","D":"Phenytoin","E":"Carbamazepine"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 11th edition. Chapter 47, p.1085","sourcePage":341},{"id":"9-032","category":"移植","categoryOrder":9,"number":32,"question":"在腎臟移植前，針對免疫高風險(high immunologic risk)的病患會施予手術前抗體誘導治療(antibody induction therapy)。請問下面哪一項不是評估免疫 風險的項目 ? (immunologic risk factors)","options":{"A":"血中存有高表達 anti-HLA 抗體","B":"血型不相容(ABO-incompatibility)","C":"曾經接受移植且合併早期排斥","D":"年紀大的受贈者(older recipients)","E":"非典型性尿毒溶血症後群(atypical hemolytic uremic syndrome)"},"answer":"D","reference":"(111) 參考資料(摘錄自)：Smith & Tanagho’s General Urology, 19th edition. Chapter 36, p.566","sourcePage":341},{"id":"9-033","category":"移植","categoryOrder":9,"number":33,"question":"腎臟移植後，免疫藥物的使用會增加惡性腫瘤的發 生。下列描述何者錯誤?","options":{"A":"皮膚癌發生率最高","B":"攝護腺癌的發生率下降","C":"發生淋巴癌時，要降低免疫藥物劑量","D":"膀胱癌時，可以使用 mitomycin-C 來做膀胱內藥 物灌注","E":"乳癌的發生率上升"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 11th edition. Chapter 47, p.1087","sourcePage":341},{"id":"9-034","category":"移植","categoryOrder":9,"number":34,"question":"CMV 感染是腎臟移植病人術後常見的感染，並且捐贈 者及受贈者的 anti-CMV IgG 會影響到受贈者感染的 風險，請針對感染風險高低來排序？","options":{"A":"D+R+ > D+R− > D− R+ > D− R−","B":"D+R− > D+R+ > D− R+ > D− R−","C":"D+R− > D− R+ > D+R+ > D− R−","D":"D− R− > D− R+ > D+R− > D+R+","E":"D− R+ > D+R− > D+R+ > D− R−"},"answer":"B","reference":"(111)/參考資料(摘錄自): Campbell-Walsh Urology, 11th edition, Chapter 47. p. 1086","sourcePage":341},{"id":"9-035","category":"移植","categoryOrder":9,"number":35,"question":"下列關於免疫抑制的藥物作用機制何者錯誤？","options":{"A":"Mycophenolate mofetil 抑制嘌呤合成，進而抑 制淋巴球增生","B":"Basiliximab 阻斷 IL-2 受體，進而抑制細胞間 的訊號傳遞","C":"Antithymocyte globulin 消耗 T 淋巴球，進而 抑制外來抗原的辨識","D":"Alemtuzumab 是補體抑制劑，可降低抗體介導排 斥反應","E":"Belatacept 可阻斷共刺激 (costimulation blockade)，減少淋巴球的活化"},"answer":"D","reference":"(111)/參考資料(摘錄自): Campbell-Walsh Urology, 11th edition, Chapter 47. p. 1085","sourcePage":341},{"id":"9-036","category":"移植","categoryOrder":9,"number":36,"question":"下列關於腎臟移植術後排斥的敘述，何者錯誤？","options":{"A":"超急性排斥 (Hyperacute rejection) 通常發生 在移植後 48 小時內，主要是由於受贈者的 cytotoxic antibodies 以及補體反應造成的","B":"由於移植前交叉比對(crossmatch test)的盛 行，超急性排斥的發生已經大幅減少","C":"目前免疫抑制劑的搭配使用，可使移植後第一年 急性細胞性排斥率(biopsy-proved acute cellular rejection)下降至 5%.","D":"急性排斥(Acute rejection) 通常發生於移植 5-7 天後，主要是因為術後免疫抑制不足而產生","E":"慢性排斥通常會造成腎臟功能逐漸下降，在顯微 鏡下可見 interstitial fibrosis，arteriolar sclerosis，及 tubular atrophy"},"answer":"C","reference":"(111)/參考資料(摘錄自): Campbell-Walsh Urology, 11th edition, Chapter 47. p. 1083-1084","sourcePage":342},{"id":"9-037","category":"移植","categoryOrder":9,"number":37,"question":"治療腎臟移植術後引發的 lymphocele，使用腹腔鏡 去皮術(laparoscopic decortication surgery with peritoneal window)的成功率為?","options":{"A":"30%","B":"41%","C":"69%","D":"84%","E":"92%"},"answer":"E","reference":"(111)/參考資料(摘錄自): Campbell-Walsh Urology, 12th edition, Chapter 88. p. 1939","sourcePage":342},{"id":"9-038","category":"移植","categoryOrder":9,"number":38,"question":"關於腹腔鏡手術建立腹部通道(abdominal access) 時，所引起的併發症，何者錯誤？","options":{"A":"氣體栓塞的跡象可能引起血流動力學的變化包 括：突發性缺氧、高碳酸血症、低血壓、心律失 常或充氣過程發紺","B":"對於氣體栓塞的治療是立即排氣，給予 100% 的 FiO2，並將患者置於特倫德倫伯臥位 (Trendelenburg position)和右側臥位以捕獲 右心房中的氣泡，然後插入中心靜脈導管以試圖 吸出氣泡","C":"氣腹針的進入角度被認為是有影響的。 一般來 說，對於 BMI 正常的患者，氣腹針必須以 45 度 的角度插入，而對於肥胖患者，必須以 90 度的 角度插入肚臍水平","D":"一般來說，靠近臍部附近的主動脈及腔靜脈分叉 處容易有血管損傷的情形，而最有可能被 Veress needle 或套管直接損傷的血管是左髂總 靜脈","E":"傳統上，Hasson technique 被認為是對於經驗 不足的外科醫生或對於曾接受過腹部手術且懷 疑有廣泛性粘連時的患者來說，最安全的方法"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume I, Chapter 17","sourcePage":342},{"id":"9-039","category":"移植","categoryOrder":9,"number":39,"question":"關於 The Clavien-Dindo Scale 的敘述，何者為錯？","options":{"A":"Grade I 是指任何偏離正常的術後回復過程，但 不需要藥物或手術性、放射科的介入治療 (radiologic interventions)，可允許使用症狀 治療藥物包含，止吐藥、解熱藥、鎮痛劑、利尿 劑、電解質補充和物理治療；亦包含床邊因傷口 感染的開放性傷口照護","B":"Grade II 則是需要使用其他藥物(Grade I 所允 許的藥物以外)來進行治療的併發症，且輸血和 全胃腸外營養也包括在內","C":"Grade III 則是需手術、內視鏡或放射科的介入 治療，其中 IIIa 是指不需要全身麻醉的狀況下 執行，而 IIIb 是指需要全身麻醉下執行","D":"Grade IV 是指 Life-threatening 的併發症並 且需要在加護單位進行治療，其中 IVa 是指單一 器官發生功能障礙 (包含洗腎)，而 IVb 是指多 重器官發生功能障礙","E":"The Clavien-Dindo system 是根據併發症的處 理及嚴重程度來分類，且其對於早期、晚期或是 術中的併發症並沒有區分，然而它可能不適用於 小兒泌尿外科"},"answer":"E","reference":"( 111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume I, Chapter 17","sourcePage":343},{"id":"9-040","category":"移植","categoryOrder":9,"number":40,"question":"關於上泌尿道手術後尿液滲漏的相關敘述，何者為 錯？","options":{"A":"尿液滲漏的發生率，於傳統開放性的腎臟部分切 除術為 1.0% 至 17.4%，於腹腔鏡部分腎臟切除 術為 1.6% 至 16.5%，而於機器手臂輔助部分腎 切除術的比率則低至 0.78%","B":"對於尿液滲漏於部分腎臟切除術的最相關因子 包含腫瘤大小、內生性 (endophytic)、冷缺血 時間、手術時間及靠近肺門 (hilar) 的腫瘤","C":"使用具有尿路造影階段(urogram phase)及顯影 劑的電腦斷層掃描，且合併可見腎盂和輸尿管的 延遲圖像(delayed imagine)，仍然是診斷的主 要手段，因為它可以準確估計尿路瘤(urinoma) 的範圍或洩漏的位置","D":"手術 48 小時候測量引流管中的肌酸酐 （creatinine）有助於診斷尿液滲漏，但不能確 定其位置或嚴重程度","E":"當懷疑並證實有漏尿時，尿管需要持續使用或重 新插入；如果滲漏持續存在時，使用輸尿管支架 置入合併逆行腎盂造影檢查將有助於重新評估 滲漏的嚴重程度並且能夠實現最佳的引流效果"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume I, Chapter 17","sourcePage":343},{"id":"9-041","category":"移植","categoryOrder":9,"number":41,"question":"關於手術造成之輸尿管損傷的敘述，下列何者為非？","options":{"A":"當最初的內視鏡嘗試失敗或廣泛的輸尿管狹窄 長度> 2 cm 時，理論上就需要進行手術修復","B":"對於一輸尿管再植手術，一般而言，會以 psoas hitch 針對輸尿管下段缺損，而 Boari flap 則 是針對輸尿管中段損傷","C":"根據文獻，腹腔鏡子宮切除術於輸尿管損傷的發 生率為 0.3%，且均靠近子宮動脈(uterine artery)和子宮骶韌帶(uterosacral ligament)","D":"手術造成之輸尿管損傷，部分或完全橫斷是在術 中最可識別的損傷，並且能夠在術中就進行處 理；而結紮(ligation)和熱損傷(thermal injury)可能會有延遲的症狀表現","E":"早期辨識出輸尿管損傷，對於後遺症發病率 (morbidity)有很大影響，根據文獻，早期和延 遲識別輸尿管損傷需要腎造口術(nephrostomy) 的比例分別為 2.3% 和 23.4%"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume I, Chapter 17","sourcePage":344},{"id":"9-042","category":"移植","categoryOrder":9,"number":42,"question":"關於泌尿道手術後相關併發症之敘述，何者為非？","options":{"A":"在機器人或腹腔鏡泌尿外科損傷中，膀胱損傷其 實很少見。然而，在婦科手術或結腸直腸手術中 更為常見","B":"腹腔鏡手術後發生的延遲性或未被識別的腸損 傷具有非典型表現，一般來說，患者可能不會有 腹膜炎、急性腹症或白細胞增多的表現；而典型 症狀，通常在術後 24 至 48 小時內才會出現","C":"腎切除手術術後可能會發生延遲性的胰腺損 傷，可以藉由引流液的增加及引流液中解脂酶 (Lypase)的增加來加以診斷","D":"直腸損傷是根治性前列腺切除術中最常見的腸 道併發症，而傳統開腹和機器人輔助之前列腺切 除術的直腸損傷發生率相同","E":"針對靜脈栓塞(venous thromboembolism)的風 險評估，使用最廣泛的風險分層方法是 Caprini score，患者被分類為非常低風險(0 分)、低風 險(1-2 分）、中度風險（3-4 分）和高風險（≥5 分）"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology, 12E, Volume I, Chapter 17","sourcePage":344},{"id":"9-043","category":"移植","categoryOrder":9,"number":43,"question":"關於腎臟移植術前的評估何者為真?","options":{"A":"大於 50 歲的男性應該檢測攝護腺特異抗原 (prostate specific antigen, PSA)","B":"因為抗腫瘤病毒藥物的演進，目前沒有伺機性感 染的人類免疫缺乏病毒（human immunodeficiency virus, HIV）患者就可以接 受移植","C":"大於 40 歲的糖尿病患者應轉介眼科檢查是否有 視網膜病變","D":"病態性肥胖定義為 BMI 大於 40，這樣的病人建 議術前減重","E":"ADPKD 合併中風病史的患者，術前應檢查是否有 顱內動脈瘤(berry aneurysm of the cerebral artery)的存在"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology (11th Edition), Chapter 47, P.1070-1071 (A)40 歲 (B)必須也符合 low viral load 和 adequate T lymphocyte counts (C)50 歲 (D)BMI 大於 35","sourcePage":345},{"id":"9-044","category":"移植","categoryOrder":9,"number":44,"question":"關於腎臟移植捐贈者的敘述何者有誤?","options":{"A":"年齡大於 70 歲的捐贈者，屬於 marginal donor","B":"死於中風，有高血壓病史的 58 歲男性，屬於 extended criteria donor","C":"Donation after circulatory death (DCD) 雖 然術後發生 delayed graft function 的機率比 較高，但長期 graft survival 和 standard criteria donor 相比沒有顯著差異","D":"小兒腎臟的受贈者一般建議體重不要超過 80 公 斤","E":"來自 marginal donor 的 dual adult donor kidney 不建議都種在同一個 iliac fossa"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology (11th Edition), Chapter 47, P.1075,1083 (E) dual adult donor kidneys from marginal donor 可都種在一側 iliac fossa 或 者分別種在兩側 iliac fossa","sourcePage":345},{"id":"9-045","category":"移植","categoryOrder":9,"number":45,"question":"以下何種抗排斥藥物最不建議用於懷孕婦女?","options":{"A":"Tacrolimus","B":"Antithymocyte globulin","C":"Rituximab","D":"Bortezomib","E":"Basiliximab"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology (11th Edition), Chapter 47, P.1087 (D)pregnancy category D","sourcePage":345},{"id":"9-046","category":"移植","categoryOrder":9,"number":46,"question":"以下關於 the kidney donor profile index (KDPI) 數值的描述何種有誤?","options":{"A":"可以用來當作預測受贈者發生 delayed graft function 的工具","B":"計算 KDPI 需要知道病人的年齡，是否有 B 肝或 高血壓","C":"extended criteria donor 的 KDPI 值約 85%","D":"KDPI 值不適用於 living donor，但可以用於 pediatric donor","E":"KDPI 數值為 0 到 100%"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology (11th Edition), Chapter 47, P.1075,1076 (B)C 肝","sourcePage":346},{"id":"9-047","category":"移植","categoryOrder":9,"number":47,"question":"關於移植腎排斥的敘述何者不正確?","options":{"A":"超急性排斥(hyperacute rejection)在灌流恢 復後很快出現，源自受贈者的 cytotoxic antibody 和補體攻擊捐贈者的血管內皮抗原 (vascular endothelial antigen)","B":"超急性排斥(hyperacute rejection) 因為 donor specific antibody (DSA)檢測技術的進 步已很少見","C":"如果沒有使用免疫抑制劑，可在 5 天內出現急性 排斥反應(acute cellular rejection)，目前因 為抗排斥藥物的使用第一年出現 acute cellular rejection 的比例已降到 10-15%","D":"急性排斥除了尿量減少、肌肝酸上升，也常出現 發燒，移植處腫脹和疲憊等症狀","E":"急性排斥只能靠切片診斷"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology (11th Edition), Chapter 47, P.1083-1084 (D) 發燒，移植處腫脹和疲憊 等症狀不常見","sourcePage":346},{"id":"9-048","category":"移植","categoryOrder":9,"number":48,"question":"有關腎臟移植術後併發症的敘述，何者正確?","options":{"A":"大部分移植術後的血尿需要再做侵入性的檢查 確定出血來源","B":"術後發生輸尿管狹窄的原因主要是缺血","C":"腎移植術後的患者相對於一般人口(general population)得到泌尿道上皮癌的風險無顯著差 異","D":"根據研究顯示，術後 15 天內將腎移植術中置放 之輸尿管導管移除雖然可以降低泌尿道感染的 風險，但會增加尿液滲漏與輸尿管狹窄的風險","E":"腎移植術後若產生淋巴囊腫(Lymphocele)，接受 硬化療法(Sclerotherapy)的成功率約 10%"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology Review 12th edition review, pg.339 chapter review (A)大部分為 self-limiting (B)正確 (C)相對一般人口有 3 倍風險 (D)不會增加尿液滲漏與輸尿 管狹窄的風險 (E)成功率為 69%","sourcePage":346},{"id":"9-049","category":"移植","categoryOrder":9,"number":49,"question":"活體捐贈者腎臟切除手術(Living-donor nephrectomy)方法多元，且都有不錯的安全性 (Safety)和療效(Efficacy)，現階段文獻回顧中有較 高的併發症比率的手術方法為?","options":{"A":"傳統開腹術式(Open surgery)","B":"手輔助式後腹腔鏡術式(Hand-assisted laparoscopy, retroperitneal approach)","C":"經腹腔之一般腹腔鏡術式(Pure laparoscopy, transperitoneal approach)","D":"單孔腹腔鏡術式(Laparo-Endoscopic Single Site Surgery (LESS))","E":"機械手臂輔助腹腔鏡術式(Robotic-assisted laparoscopy)"},"answer":"E","reference":"(111) 參考資料(摘錄自)： EAU guideline on kidney transplant, 2022, Pg.5 Laparoscopic living-donor nephrectomy can also be performed with robotic assistance, with equivalent results according to a systematic review . However, the numbers are still low and recent studies, including a meta-analysis, have reported higher complication rates for this approach .","sourcePage":347},{"id":"9-050","category":"移植","categoryOrder":9,"number":50,"question":"下列有關腎移植術後所使用之抗排斥藥物的機轉，何 者錯誤?","options":{"A":"類固醇(Glucocorticoid)的作用機轉為減少細 胞激素基因的轉錄","B":"Mycophenolate mofetil(MMF)的作用機轉為抑 制嘌呤(purine)類產物之合成","C":"Tacrolimus 的作用機轉為抑制 Calcineurin 與 IL-6 的生成","D":"Rabbit antithymocyte globulin 的作用機轉為 透過外源性抗體減少可能引起排斥之 T 細胞","E":"Basiliximab 的作用機轉為封鎖 IL-2 的受體"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 11th edition, page 1085, Table 47-3 Mechanism of Action of Immunosuppressants 答案(A)(B)(D)(E)均為表格 內文 答案(C)錯在抑制 Calcineurin 與\"IL-2\"的生成","sourcePage":347},{"id":"9-051","category":"移植","categoryOrder":9,"number":51,"question":"關於腎臟移植前的腎臟切除，以下何者不符合適應 症？","options":{"A":"曾做過軟式輸尿管鏡處理腎結石後仍有殘存結 石，並且造成持續性的泌尿道感染。","B":"無症狀的多囊腎","C":"反覆性的腎盂腎炎","D":"等級四(grade4)的膀胱輸尿管逆流合併有泌尿 道感染","E":"高度分化的(high-grade)腎臟實質腫瘤"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell 11th edition, p1073, Box47-1 recommendations for pre-transplant nephrectomy (A) Symptomatic renal stones not cleared by minimally invasive techniques or lithotripsy (B) Polycystic kidneys that are symptomatic, extend below the iliac crest, have been infected, or have solid tumors (C) Recurrent pyelonephritis (D) Grade 4 or 5 vesicoureteral reflux with urinary tract infections (A) (E) High-grade solid renal tumors with or without acquired renal cystic disease","sourcePage":347},{"id":"9-052","category":"移植","categoryOrder":9,"number":52,"question":"一位女性希望可捐腎給他末期腎病變的丈夫。她本人 是 ABO 血型的 A 型，丈夫是 O 型。下列那一個選項不 是解決此血型問題的方法?","options":{"A":"血漿置換術(Plasmapheresis)","B":"抗體免疫吸附術(Immunosorption)","C":"注射免疫球蛋白(Immunoglobulin administration)","D":"Anti CD-37 antibody administration(注射抗 CD-37 抗體)","E":"活體腎臟交換捐贈(Paired kidney exchange)"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell-Walsh Urology 11th edition Review, pg.192 Plasmapheresis and immunoadsorption are used to remove antibodies. Immunoglobulin administration and anti CD-20 antibody (not CD-37 antibody) are used to prevent antibody reformation. Paired kidney exchange is an inexpensive way to deal with the problem.","sourcePage":348},{"id":"9-053","category":"移植","categoryOrder":9,"number":53,"question":"下列關於結石在於腎臟移植病人的敘述何者錯誤?","options":{"A":"腎臟移植病人的結石的發生率約 1%","B":"Secondary hyperparathyroidism 是腎臟移植病 人結石的常見原因之一","C":"腎臟移植病人常用的藥物 Calcineurin inhibitors 會促進慢性高尿酸血症(Chronic hyperuricemia)是可能導致結石的唯一原因","D":"若腎臟移植病人的結石<4mm，建議可以用超音波 及抽 creatitine level 去追蹤","E":"若腎臟移植病人的結石有產生症狀可使用體外 震波、軟式輸尿管鏡碎石手術或經皮腎造廔取石 手術去處理結石"},"answer":"C","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, p.1939/ (C) cyclosporine induces chronic hyperuricemia, and calcineurin inhibitors cause hyperoxaluria and hypocitraturia","sourcePage":348},{"id":"9-054","category":"移植","categoryOrder":9,"number":54,"question":"針對腎移植術後發生的癌症，下列何者正確?","options":{"A":"腎移植病人術後發生 RCC 的比例比一般人高，針 對發生的位置，在原腎與移植腎的比例大約是 7:3","B":"腎移植病人術後若有原腎的腫瘤，大部分以 high grade tumor 表現","C":"腎移植病人術後若有 RCC, 若其預期餘命不長且 腫瘤大小<4cm，則不管 RCC 是發生在原腎 (Native)還是移植腎(Graft)上，治療方式都是 一樣的","D":"腎移植病人術後發生泌尿上皮癌的風險是一般 人的 5 倍，疾病侵略度也較高（Aggressive）","E":"腎移植後診斷膀胱癌的平均時間約在五年以 上，這類的病人通常有也有較高的復發率 （Recurrence rate）"},"answer":"C","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, A)P1940. The incidence of renal cell carcinoma (RCC) is higher in transplant recipients than in the general population. RCC represents 4.6% of posttransplant cancers compared with 3% of tumors in the general population. However, only 10% occurred in kidney grafts (9:1) B)P. 1941 key point: Most of the kidney tumors develop in the native kidneys and are low-grade tumors. C)1940 Fig. 88.4. D）Kidney transplant recipients have a three-fold risk of urothelial carcinoma (UC) compared with the general population (３倍) E) The mean time between transplantation and bladder cancer diagnosis ranges between 2.8 and 4 years Bladder cancer in kidney transplant patients is aggressive and tends to be associated with higher recurrence rates, progression, and metastasis. (2.8-4 年)","sourcePage":348},{"id":"9-055","category":"移植","categoryOrder":9,"number":55,"question":"關於腎臟移植併發症敘述，何者正確？","options":{"A":"大部分淋巴膿瘍的病人會出現疼痛的症狀","B":"移植術後輸尿管狹窄，最常見的原因為慢性感染","C":"術後出現 high grade 膀胱輸尿管逆流，最佳處 置方式可以在黏膜下注射塑膠微粒","D":"接受腎臟切片後出現嚴重血尿，懷疑 AV fistula，可以先安排超音波檢查","E":"移植術後若出現 distal 處的尿液滲漏，應盡早 接受手術重建"},"answer":"D","reference":"(112) /9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology, 12th edition. Chapter 88 (A) p.1939 The majority of patients with lymphocele are asymptomatic. (B) p.1937 The primary cause of ureteral stricture development is ischemia. (C) p.1938 The success rate of submucosal injection depends on the grade of reflux; it reaches 90% in grades I and II disease, whereas it is only 30% in high-grade disease. (E) p.1937 Early exploration and reconstructive surgery should be offered to patients with a proximal large leak, or persistent leak despite maximal drainage.","sourcePage":349},{"id":"9-056","category":"移植","categoryOrder":9,"number":56,"question":"下列何者為移植術後 3 個月以上常見輸尿管阻塞原 因?","options":{"A":"淋巴囊腫(Lymphocele)","B":"接合處水腫(Anastomosis edema)","C":"血腫壓迫(hematoma compression)","D":"輸尿管過長(Redundant ureter)","E":"術中沒置放雙丁管"},"answer":"A","reference":"(112) /9.移植/參考資料(摘 錄自)：Campbell 12e. Ch.88 table 88.1","sourcePage":350},{"id":"9-057","category":"移植","categoryOrder":9,"number":57,"question":"關於小兒腎臟移植下列敘述何者錯誤？","options":{"A":"Congenital anomalies of the kidney and urinary tract (CAKUT) 是常見小兒末期腎 臟病的原因之一","B":"在美國許多移植中心至少會等到小兒體重 >10 kg 且身高>65cm 才會進行腎臟移植","C":"若小兒的體重<20 kg，會考慮將移植腎種於 腹腔內並將血管和外髂動靜脈吻合","D":"關於小兒腎臟移植後發生 primary graft dysfunction 的比例<3%","E":"Trimethoprim-sulfamethoxazole 常常被用 來預防 Pneumocystis carinii pneumonia"},"answer":"C","reference":"(112) /9.移植/參考資料(摘 錄自)： Campbell-Walsh Urology 12th Edition, p356-357/ (C) Aorta and IVC","sourcePage":350},{"id":"9-058","category":"移植","categoryOrder":9,"number":58,"question":"下列關於腎移植對懷孕及生育的影響何者正確？","options":{"A":"男性腎移植病人，接受移植術後所生育的子女較 容易有先天性疾病","B":"接受腎移植的男性病人若有生育計畫，一般建議 移植後至少延遲 2 年再受孕","C":"末期腎病變的育齡婦女如果在停經前接受成功 的腎移植，通常可以恢復的生育能力","D":"女性腎移植病人懷孕早產比例跟一般懷孕婦女 並無區別","E":"一般建議育齡婦女在腎移植術後至少維持 5 年 的健康狀態，包括無或輕微蛋白尿、無高血壓、 無排斥、無泌尿道阻塞、接近正常腎功能、以及 可以維持低劑量抗排斥藥物再懷孕"},"answer":"C","reference":"(112) /9.移植/參考資料(摘 錄自)： Campbell 11ed, Chapter 44, page 1087 詳解 (A) 子女先天性疾病不會增 加。 (B) 至少 1 年 (C) 正確 (D) 較高，50% 腎移植孕婦可 能早產 (D) 維持健康狀態至少 2 年。","sourcePage":350},{"id":"9-059","category":"移植","categoryOrder":9,"number":59,"question":"下列關於腎移植病人手術後感染的敘述何者錯誤？","options":{"A":"術後第一個月內最常見的感染源和一般接受重 大泌尿道手術術後感染源相同。最常見的感染部 位為泌尿道感染","B":"術後第一到六個月當中最常見伺機性感染 (opportunistic infections)。而常見的伺機性 細菌感染包括 Listeria monocytogenes、 Nocardia、Toxoplasmosis。","C":"如果 donor 的 Cytomegalovirus (CMV) serologic findings 為陽性，recipient 為陰 性，則 recipient 有 CMV 感染的機會接近 90%， 且後續發生 pneumonitis 的機會將近 30%","D":"術後第六個月以後的感染受到病人本身的 graft function、risk for rejection 以及 previous infections 影響","E":"反覆泌尿道感染通常可以透過降低免疫抑制劑 劑量來恢復。只有某些特定病毒感染，包括 adenovirus-related hemorrhagic cystitis 或 是 polyomavirus 感染才無法透過降低免疫抑制 劑劑量來緩解症狀"},"answer":"E","reference":"(112) /9.移植/參考資料(摘 錄自)： Campbell 11ed, Chapter 47 詳解 (A) p.1086 (B) p.1086 (C) p.1086 (D) p.1086 (E) p.1086，大部分 UTI 無法 透過降低免疫抑制劑劑量來 恢復，而 BK polyoma viral infection 因為會造成 nephropathy，所以會建議降 低免疫抑制劑劑量來控制症 狀。","sourcePage":351},{"id":"9-060","category":"移植","categoryOrder":9,"number":60,"question":"腎移植(renal transplant)相關之併發症，何者錯 誤？","options":{"A":"尿液滲漏為移植術後之常見併發症，發生率約 1.2%~8.9%，其主因為遠端輸尿管缺乏血流供應 造成壞死","B":"腎臟切片後持續或嚴重血尿，應安排 Duplex ultrasound 以排除 arteriovenous collecting system fistula。Arteriovenous collecting system fistula 通常 70%的病人會自行緩解不需 要其他治療","C":"術後出現膀胱輸尿管逆流(VUR)的發生率 50%~86%，而有症狀之有臨床意義 VUR 約 10%","D":"其他可能造成尿液滲漏之原因包括：輸尿管過 長、過早移除膀胱或輸尿管之引流、急性尿瀦 留、輸尿管扭結等","E":"腎移植病人發生膀胱癌之風險相較常人顯著提 高，約為一般人的 3 倍"},"answer":"C","reference":"(112) /9.移植/參考資料(摘 錄自)： Campbell 12ed, Chapter 88, page 1936-1941 詳解： (A) p.1937 (B) p.1936 (C) p.1938, 有意義之 VUR 僅 1% (D) p.1937 (E) p.1941","sourcePage":351},{"id":"9-061","category":"移植","categoryOrder":9,"number":61,"question":"關於腎移植後常用之免疫抑制劑敘述，何者正確？","options":{"A":"Sirolimus 及 Everolimus 之機轉為抑制細胞週 期進行，兩者都需要注意腎毒性","B":"Tacrolimus 及 Cyclosporine 之機轉為抑制 calcineurin 及 IL-2 製造，兩者皆會造成血脂 異常","C":"Sirolimus 以及 prednisone 兩者皆會造成傷口 癒合不佳及造成腎毒性","D":"Azathioprine 及 Mycophenolate mofetil 之機 轉為抑制嘌呤合成，兩者皆有中樞神經毒性","E":"Daclizumab 以及 Basiliximab 兩者皆為 anti-CD25 antibody，能夠阻擋 IL-2 受體，影 響細胞內之訊息傳遞"},"answer":"E","reference":"(112) /9.移植/參考資料(摘 錄自)： Campbell 11ed, Chapter 47, page 1085 (A) Sirolimus 無腎毒性 (B) 僅 Cyclosporin 會 (C) 兩者皆無腎毒性 (D) 兩者皆無中樞神經毒性 (E) 正確","sourcePage":352},{"id":"9-062","category":"移植","categoryOrder":9,"number":62,"question":"關於腎臟移植後，發現腎細胞癌，下列處置何者正確","options":{"A":"移植腎中有新發腎細胞癌(De novo RCC)，病人 預期餘命短(short life expectancy)且腫瘤 <4cm，建議進行移植腎臟全切除手術","B":"移植腎中有新發腎細胞癌(De novo RCC)，病人 預期餘命短(short life expectancy)且腫瘤 <4cm，建議進行部分移植腎臟切除手術(partial nephrectomy)","C":"移植腎中有新發腎細胞癌(De novo RCC)，病人 預期餘命短(short life expectancy)且腫瘤> 4cm，建議使用標靶及免疫治療","D":"腎臟移植病人的原本腎臟中若有腎細胞癌(RCC in native kidney)，病人預期餘命短(short life expectancy)且腫瘤<4cm，建議可以採取冷 凍治療(Cryotherapy)","E":"腎臟移植病人的原本腎臟中若有腎細胞癌(RCC in native kidney)，病人預期餘命短(short life expectancy)且腫瘤<4cm，建議進行原本腎 臟全切除"},"answer":"D","reference":"(112) /9.移植/參考資料(摘 錄自)： Campbell-Walsh Urology 12th Edition, p1940 Fig.88.4/ (A, B, E)Active surveillance, cryotherapy, radiofrequency; (C) partial nephrectomy, multiple partial nephrectomies, combination of partial with cryotherapy/radiofrequenc y, radical nephrectomy;","sourcePage":352},{"id":"9-063","category":"移植","categoryOrder":9,"number":63,"question":"下列關於腎臟移植的術後併發症，何者錯誤？","options":{"A":"腎移植病人術後會在移植腎放置輸尿管導管 （ureter stent)，若有阻塞性現象發生，常以 疼痛、腰酸、背痛之症狀表現．","B":"在手術後 15 天內做早期的輸尿管導管移除 (early stent removal)，可以降低發生泌尿道 感染的機率，也比較不會放生漏尿與狹窄的情形 （urine leak and stenosis）","C":"針對輸尿管導管結垢（stent encrustation）的 每個病人，都應該做電腦斷層來幫助外科性介入 的導引評估","D":"若發生輸尿管導管結垢（stent encrustation ） 造成的移植腎的腎水腫，除了腎臟造口外，軟式 輸尿管鏡與體外震波碎石也是有效且可行的治 療方式","E":"腎移植後術後發生的血尿，有可能是輸尿管膀胱 吻合處造成（ureterovesical anastomosis）， 跟其他接合方式比起來，以 Leadbetter anastomosis 的方式最常發生"},"answer":"A","reference":"(112) /9.移植/參考資料(摘 錄自)： Campbell-Walsh Urology 12th Edition Chap 88, p1936 A): P 1936. Because of renal allograft denervation, kidney transplant recipients rarely manifest the classical symptoms of ureteral obstruction. Ｂ）In a recent meta-analysis, early stent removal, defined by removal of the stent before the third postoperative week (before day 15), has been shown to reduce the incidence of UTI without discernible effect on the incidence of urine leak and stenosis Ｃ）Computed tomography (CT) scan should be obtained in all patients with stent encrustation to assess encrustation burden and distribution, which will help guide the surgical approach Ｄ）Different combinations of percutaneous nephrolithotomy, retrograde intrarenal renal surgery, and extracorporeal wave shock lithotripsy have been described to treat the encrusted transplant stent Ｅ）Hematuria is observed more commonly after Leadbetter anastomosis compared with other types of anastomosis","sourcePage":352},{"id":"9-064","category":"移植","categoryOrder":9,"number":64,"question":"腎移植術後約有一成的病人容易發生 urinary leakage, 下列何者不是常見的原因之一？","options":{"A":"輸尿管長度不夠(excessively shortness)","B":"尿管阻塞","C":"腎實質壞死（Renal parenchyma necrosis)","D":"放置雙Ｊ管時造成的實質破裂（Parenchymal perforation）","E":"輸尿管末端血流供應不佳"},"answer":"A","reference":"(112) /9.移植/參考資料(摘 錄自)： Campbell-Walsh Urology 12th Edition, A) excessively long ureter (B-D) Box88.1, Ｅ）Compromising the blood supply to the distal ureter during organ procurement is the main risk factor for ureteral necrosis and urine leak","sourcePage":353},{"id":"9-065","category":"移植","categoryOrder":9,"number":65,"question":"下列關於腎移植術後發生 lymphocele（淋巴囊腫） 的敘述何者錯誤 ?","options":{"A":"腎移植術後發生的 lymphocele 大多是無症狀 的，通常也不需要處理","B":"造成 lymphocele 常見的原因是在清 iliac vessel 時，淋巴結清除得不夠乾淨，進而造成 lymphocele 生成","C":"lymphocele 常發生在手術後的前六個月，而術 後 1-2 個月是高峰期（Peak）的時候","D":"lymphocele 的診斷可以只用超音波診斷就好","E":"藥物的使用也會促使 lymphocele 生成，例如 mTOR inhibitors."},"answer":"B","reference":"(112) /9.移植/參考資料(摘 錄自)： Campbell-Walsh Urology 12th Edition, P1939 Ａ）The majority of patients with lymphocele are asymptomatic. no treatment is required because they tend to resolve spontaneously. Ｂ）Lymphoceles occur mainly because of extensive dissection of the lymphatics around the iliac vessels of the recipient 清 得太多 Ｃ）A lymphocele most frequently develops within the first 6 months after transplantation with a peak incidence at 6 week D) Confirmation of the presence of a fluid collection around the graft can be determined on US examination or CT scan E) mTOR inhibitors found to be associated with lymphocele formation","sourcePage":353},{"id":"9-066","category":"移植","categoryOrder":9,"number":66,"question":"下列何者不是腎臟移植前，先進行腎臟切除 (pretransplant nephrectomies)的適應症?","options":{"A":"多囊腎合併反覆腎盂腎炎","B":"藥物無法控制的高血壓","C":"持續 anti-neutrophil cytoplasmic antibodies 呈陽性","D":"無法藉由微創手術移除的腎結石","E":"嚴重蛋白尿"},"answer":"C","reference":"(112) /9.移植/參考資料(摘 錄自)： Smith & Tanagho’s General Urology, 19th edition. Chapter 36 Table 36-5","sourcePage":354},{"id":"9-067","category":"移植","categoryOrder":9,"number":67,"question":"65 歲男性，有抽菸習慣，患有 COPD 及胃潰瘍，曾經 有暫時性腦缺血的病史，根據 Charlson Comorbidity scores，病人若接受腎臟移植，十年存活率約多少?","options":{"A":"2%","B":"10%","C":"21%","D":"45%","E":"96%"},"answer":"C","reference":"(112) /9.移植/參考資料(摘 錄自)：Smith & Tanagho’s General Urology, 19th edition. Chapter 36 Table 36-6 Charlson Comorbidity scores: 65 歲: 2 COPD :1 TIA: 1 peptic ulcer disease: 1 Total: 5 => 21%","sourcePage":354},{"id":"9-068","category":"移植","categoryOrder":9,"number":68,"question":"關於活體腎臟移植手術（Living Kidney Donor Operation）的敘述，何者正確？","options":{"A":"內視鏡活體腎臟切除術（laparoscopic donor nephrectomy ) 的 complication rate 約 15%","B":"內視鏡活體腎臟切除，術中更改為傳統開腹手 術，可以不視為手術併發症","C":"通常選擇左側腎臟切除，因為右側有肝臟干擾， 增加手術困難度及風險","D":"若 Donor 左側腎功能較右側佳，為增加移植成功 率，不會考慮切除 Donor 右側腎臟","E":"Donor 輸尿管需分到靠近 UVJ 再進行截斷"},"answer":"B","reference":"(112) /9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology, 11th e dition. Chapter 47 p. 1515 （Ａ） LDN has a low complication rate (6% minor, <2% major) （Ｃ）because of the longer left renal vein （Ｄ）right-sided LDN is performed as well when indicated to preserve the “better”kidney for the donor （Ｅ）The ureter is mobilized to the point at which it crosses the iliac vessels.","sourcePage":354},{"id":"9-069","category":"移植","categoryOrder":9,"number":69,"question":"下列有關移植病人術後血尿的敘述，何者正確？","options":{"A":"移植腎切片造成的動靜脈集尿系統廔管可能導 致持續性血尿，可由電腦斷層檢查確定診斷","B":"若出現動靜脈集尿系統廔管，約 70%的病人需接 受血管栓塞","C":"術後立即性的血尿的原因通常是出現在輸尿管 及膀胱接合處","D":"大部分血尿的病人會持續數週後症狀才改善","E":"若移植術後病人有無症狀顯微血尿，ＣＭＶ感染 需納入鑑別診斷"},"answer":"C","reference":"(112) /9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology, 12th edition. Chapter 88, p.1936 （Ａ）confirmed by magnetic resonance angiography （Ｂ）70% of the cases, fistulas tend to resolve spontaneously （Ｄ）In the majority of the cases, hematuria resolves over several days ( E ) BK virus","sourcePage":355},{"id":"9-070","category":"移植","categoryOrder":9,"number":70,"question":"小便滲漏是腎臟移植術後最常見的早期並發症，下列 何者不是造成小便滲漏常見的原因？","options":{"A":"過長的輸尿管","B":"太早移除輸尿管內管","C":"尿管放置過久","D":"腎實質壞死","E":"放置輸尿管內管時，造成腎實質穿孔"},"answer":"C","reference":"(112) /9.移植/參考資料(摘 錄自)：參考資料(摘錄 自)： Campbell-Walsh Urology, 12th edition. Chapter 88, p.1937 Box 88.1","sourcePage":355},{"id":"9-071","category":"移植","categoryOrder":9,"number":71,"question":"下列何者不是腎臟移植術後早期（< 3 months）輸尿 管阻塞常見的原因？","options":{"A":"輸尿管狹窄","B":"接合處水腫","C":"淋巴囊腫","D":"膿瘍","E":"術後未放置輸尿管內管"},"answer":"A","reference":"(112) /9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology, 12th edition. Chapter 88, p. 1937 Table 88.1 (A) Ureteral stricture 是 LATE URETERAL OBSTRUCTION (>3 MONTHS)","sourcePage":355},{"id":"9-072","category":"移植","categoryOrder":9,"number":72,"question":"下列何者不是造成接受腎移植患者結石的原因？","options":{"A":"高尿鈣","B":"高尿酸尿","C":"高檸檬酸尿","D":"副甲狀腺功能高亢","E":"高草酸尿"},"answer":"C","reference":"(112) /9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology, 12th edition. Chapter 88 p. 1939 Several factors favor stone formation in kidney transplant patients, such as secondary hyperparathyroidism, recurrent urinary tract infections, and metabolic abnormalities such as hypercalciuria, hyperuricosuria, hypocitraturia, or hyperoxaluria","sourcePage":355},{"id":"9-073","category":"移植","categoryOrder":9,"number":73,"question":"病人若發現泌尿系統癌症，需觀察一段時間無復發， 才能接受腎臟移植，下列配對何者錯誤?","options":{"A":"Kidney cancer, T1aN0M0, Fuhrman 3–4: none","B":"Prostate cancer, intermediate risk: 2 years","C":"Urothelial cancer, T1, high grade: 2 years","D":"Kidney cancer,T1bN0M0, Fuhrman 3–4: 2years","E":"Prostate cancer, low risk: none"},"answer":"B","reference":"(112) /9.移植/參考資料(摘 錄自)： Smith & Tanagho’s General Urology, 19th edition. Chapter 36 Table 36-2 (B) Prostate cancer, intermediate risk: none","sourcePage":356},{"id":"9-074","category":"移植","categoryOrder":9,"number":74,"question":"以下那些情況要在腎臟移植前或同時進行原腎臟移 除? 甲、 持續性蛋白尿經內科治療無效 乙、 有 Grade III~V 膀胱輸尿管逆流 丙、 大小超過 iliac crest 的多囊性腎臟 丁、 反覆性腎盂腎炎 戊、 有症狀且無法清乾淨的腎結石","options":{"A":"甲乙丙丁","B":"乙丁戊","C":"甲丙丁戊","D":"乙丙丁","E":"全部皆對"},"answer":"C","reference":"(112) /9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology 11th ed、2016 Ch.47 P.1073","sourcePage":356},{"id":"9-075","category":"移植","categoryOrder":9,"number":75,"question":"關於 ABO 血型不相容的腎臟移植, 下列敘述何者錯 誤?","options":{"A":"ABO incompatible (ABOi)並非移植禁忌症, 只 要移植時接受者的血中抗體效價夠低且有免疫 抑制，仍可有相當高的成功機會","B":"ABOi 移植前進行 splenectomy, 使用 IVIG, 或 者進行 plasmaphresis, 均可能降低血中抗體效 價","C":"移植前施打 Rituximab 是經由 anti-CD20 減少 B lymphocyte 的增生","D":"大約有 2 成健康捐贈者(medically suitable donors)會遇到血型不相容的問題","E":"腎臟配對捐贈(Kidney paired donation) 也是 解決 ABO 血型不相容問題的好方法"},"answer":"D","reference":"(112) /9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology 11th ed、2016 Ch.47 (A) P.1076 (B) P.1078 (C) P.1085 (D) P.1078 (E) P.1078","sourcePage":356},{"id":"9-076","category":"移植","categoryOrder":9,"number":76,"question":"以下何種移植藥物已證實對人類胎兒有危險,孕婦使 用需特別小心?","options":{"A":"Tacrolimus","B":"Basiliximab","C":"Mycophenolate mefetil","D":"Glucocorticoids","E":"Rituximab"},"answer":"C","reference":"(112) /9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology 11th ed、2016 Ch.47 P.1087","sourcePage":357},{"id":"9-077","category":"移植","categoryOrder":9,"number":77,"question":"關於接受腎臟移植患者發生的惡性腫瘤, 下列敘述 何者錯誤?","options":{"A":"大部分的腎腫瘤均發生在原腎臟, 且多為低惡 性度(low-grade tumor)","B":"發生尿路上皮癌的機率是非移植族群的 3 倍, 且 較具有侵犯性(aggressive)","C":"在移植腎的腎細胞癌(de novo RCC)主要以 papaillary carcinoma 為主","D":"攝護腺癌的發生率與非移植族群相當, 不管手 術或放射治療, 移植腎都要考量受傷的風險","E":"在移植患者中, 若發生膀胱泌尿上皮癌, 其中非 肌肉侵犯的患者, 在 TURBT 後接受 BCG 灌藥為禁 忌症(contraindication)"},"answer":"E","reference":"(112) /9.移植/參考資料(摘 錄自)：Campbell-Walsh Urology 12th ed、2020 Ch.88 P.1940-1941","sourcePage":357},{"id":"9-078","category":"移植","categoryOrder":9,"number":78,"question":"根據 Malinoski 等發表於 2023 年 New England Journal of Medicine (NEJM)的研究 ”Hypothermia or Machine Perfusion in Kidney Donors” , 以下 何者有誤?","options":{"A":"根據研究結果, machine perfusion 對 delayed graft function 有較佳的保護力, 若合併 hypothermia 可優於單獨 machine perfusion, 但未達統計顯著","B":"腦死捐贈者以 therapeutic hypothermia (34-35 ℃)方式照護, 日後受贈者發生 delayed graft function 的 relative risk 可較正常體溫照護 降低近 4 成","C":"針對 delayed graft function 的定義為移植後 一週內接受透析","D":"在 hypothermia 與 machine perfusion 及 combination therapy 的比較中, 一年的 graft failure rate 並無差別","E":"在美國透過腦死捐贈的腎臟, 約有 1/3 會使用 machine perfusion"},"answer":"A","reference":"(112) /9.移植/參考資料(摘 錄自)：The New England Journal of Medicine 2023 Vol. 388 P. 418-426","sourcePage":357},{"id":"9-079","category":"移植","categoryOrder":9,"number":79,"question":"腎臟移植受贈者腎結石盛行率為?","options":{"A":"1%","B":"5%","C":"10%","D":"15%","E":"17%"},"answer":"A","reference":"(112) /9.移植/參考資料(摘 錄自)：Campbell 12e. P.1939","sourcePage":358},{"id":"9-080","category":"移植","categoryOrder":9,"number":80,"question":"下列關於移植評估及 Charlson Comorbidity Score/Index 的敘述何者正確？","options":{"A":"Charlson Comorbidity Score/Index 3 分的病 患十年預期餘命為 96%","B":"患有後天免疫缺乏症候群(acquired immune deficiency syndrome) Charlson Comorbidity Score/Index 的計分為 6 分","C":"患有慢性阻塞性肺病 Charlson Comorbidity Score/Index 的計分為 2 分","D":"在患有低風險性局限性攝護腺癌（localized prostate cancer, low risk）且經攝護腺切除 及雙側骨盆腔淋巴結廓清手術治療後的病人，需 等待至少 2 年觀察追蹤是否復發才可接受腎臟 移植","E":"腹腔鏡活體捐贈者腎切除術（laparoscopic donor nephrectomy）90 天死亡率為 0.31%"},"answer":"B","reference":"(112) /9.移植/參考資料(摘 錄自)： Smith 19e. chap. 36 詳解 A.P.565 22% C.P.566 table 36-6 1 分 D.P.564 table 36-2 不需觀 察追蹤是否復發即可接受腎 臟移植 E.P.566 3.1/10000(0.031%)","sourcePage":358},{"id":"9-081","category":"移植","categoryOrder":9,"number":81,"question":"下列何者為第二常見小兒腎移植泌尿道併發症 (urologic complications)?","options":{"A":"血腫(hematoma)","B":"輸尿管狹窄(ureteral stenosis)","C":"尿液滲漏(urinary leaks)","D":"泌尿道結石(stones)","E":"尿液逆流(reflux)"},"answer":"C","reference":"(112) /9.移植/參考資料(摘 錄自)： Campbell 12e. Ch.51 p.1064 keypoint","sourcePage":358},{"id":"9-082","category":"移植","categoryOrder":9,"number":82,"question":"小兒腎臟移植前評估時，常發現有膀胱功能異常．與 末期腎病變(ESRD)有關，“最常見”早期膀胱功能異 常為何？","options":{"A":"高容量 (high capacity)，高收縮力 ( hypercontractility)，高順應性( high compliance)．","B":"高容量 (high capacity)，高收縮力 ( hypercontractility)，差順應性( poor compliance)","C":"低容量 (low capacity)，高收縮力 ( hypercontractility)，高順應性( high compliance)","D":"低容量 (low capacity)，高收縮力 ( hypercontractility)，差順應性( poor compliance)","E":"低容量 (low capacity)，高收縮力 ( hypocontractility)，差順應性( low compliance)"},"answer":"D","reference":"(112) /9.移植/參考資料(摘 錄自)：12 版 Campbell Urology P1054-1055","sourcePage":358},{"id":"9-083","category":"移植","categoryOrder":9,"number":83,"question":"下列何者不是小兒腎臟移植考量腎臟切除( native nephrectomy) 的適應症？","options":{"A":"惡性高血壓 (Malignant hypertension)","B":"極度腎炎症候群合併脂肪流失營養不良 (Profound nephritic syndrome with malnutrition resulting from lipid loss)","C":"高風險發生惡性腫瘤(High risk for malignancy)","D":"反覆性泌尿道感染(Recurrent urinary tract infection)","E":"高度尿液逆流(Massive reflux)"},"answer":"B","reference":"(112) /9.移植/參考資料(摘 錄自)：12 版 Campbell Urology p1059","sourcePage":359},{"id":"9-084","category":"移植","categoryOrder":9,"number":84,"question":"下列有關移植後合併症的描述及處置，何者錯誤？","options":{"A":"隨機臨床試驗證實，移植時常規使用輸尿管導管 過吻合處(utility of the routine ureteral stent across the ureterovesical anastomosis during renal transplantation)，可減少尿液 滲漏(urine leak)及輸尿管狹窄( ureteral stricture)的發生率．","B":"腎臟摘取時近端輸尿管血液供應受損 ( compromising the blood supply to proximal ureter during organ procurement)是輸尿管壞 死(ureteral necrosis)，尿液滲漏( urine leak)的主要危險因子","C":"腎移植後的血尿，絕大多數後自行緩解 (self-limiting)","D":"移植腎切片( allograft biopsy)後持續性血 尿，是由於血管集尿系統廔管 (arteriovenous collecting system fistula)造成．都卜勒超音 波(duplex ultrasound) 可以確定診斷．","E":"移植術後，大多數的淋巴積液(lymphocele)是無 症狀的。"},"answer":"B","reference":"(112) /9.移植/參考資料(摘 錄自)：12 版 Campbell Urology p1936-1939","sourcePage":359},{"id":"9-085","category":"移植","categoryOrder":9,"number":85,"question":"下列有關腎臟移植後，發生泌尿系統癌症的描述，何 者正確？","options":{"A":"大多數的腎臟腫瘤發生在原位腎臟(native kidney)，是高惡性度腫瘤(high grade tumor)","B":"腎移植患者發生攝護腺癌的發生率與一般民眾 相當．","C":"腎移植患者比一般民眾發生尿路上皮癌的機 率，高達 3 倍，但低侵襲性(less aggressive)．","D":"膀胱灌注卡介苗( intravesical bacillus Calmette-Guerin)不可使用於高風險非肌肉侵 襲性膀胱癌( patient with high-risk non-muscle invasive bladder cancer）。","E":"全球改善腎臟病預後組織( the Kidney Disease: Improving Global outcome) KDIGO 建議移植後常規原位腎臟篩檢( screening of native kidney)"},"answer":"B","reference":"(112) /9.移植/參考資料(摘 錄自)：12 版 Campbell Urology p1940-1941","sourcePage":360},{"id":"9-086","category":"移植","categoryOrder":9,"number":86,"question":"65 歲男性十年前接受腎臟移植，近一年肌肝酸值從 1.2 mg/dL 逐漸上升至 1.8 mg/dL。排除其他急性問 題後腎臟切片結果顯示”replacement of myocytes in afferent arterioles with beads of hyaline that bulge into the adventitia, striped interstitial fibrosis and tubular atrophy”， 研判應和長期藥物使用有關，下列何種藥物可能性最 高？","options":{"A":"Prednisolone","B":"Calcineurin inhibitor","C":"mTOR inhibitor","D":"Mycophenolate mofetil","E":"Basiliximab"},"answer":"B","reference":"(113)/ Campbell-Walsh Urology 11th edition Chapter 47, p.1085","sourcePage":360},{"id":"9-087","category":"移植","categoryOrder":9,"number":87,"question":"腎臟移植術前必需把原腎切除的情況不包括？","options":{"A":"多囊腎合併反覆性出血或是腎盂腎炎","B":"無法用藥物控制的高血壓","C":"實質性的腎臟腫瘤,不管是否惡性","D":"局部的腎臟鹿角結石","E":"有腎盂腎炎的病史"},"answer":"E","reference":"(113)/ Smith &Tanagh’s General Urology 19th Chaptor 36 P.578","sourcePage":360},{"id":"9-088","category":"移植","categoryOrder":9,"number":88,"question":"根據腎臟移植術後，以下何者為非?","options":{"A":"腎移植術後，病人得到 kidney、bladder、penile cancer 的風險增加，得到 breast、prostate cancer 的比例會下降。","B":"腎臟移植術後，如果病人得到 high risk NMIBC， 即使使用膀胱灌注 Bacillus Calmette-Gué rin，可能會有比較高的風險有 systemic infection","C":"一般來說建議育齡婦女，在腎移植後至少 5 年的 健康狀況，包括無或輕微蛋白尿、無泌尿道阻 塞、無排斥情形及可以維持低劑量抗排斥藥物再 懷孕","D":"Azathioprine 不建議再移植術後的孕婦使用","E":"腎臟移植受贈者腎結石盛行率為 1 %"},"answer":
