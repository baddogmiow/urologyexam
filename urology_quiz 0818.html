iol 2018;15:207-215. 4.Zhu W, Zhao Z, Chou F, Zuo L, Liu T, Yeh S, Bushinsky D, Zeng G, Chang C. Loss of the androgen receptor suppresses intrarenal calcium oxalate crystals deposition via altering macrophage recruitment/M2 polarization with change of the miR-185-5p/CSF-1 signals. Cell Death Dis 2019; 20:10(4):275.","sourcePage":172},{"id":"5-022","category":"生理解剖","categoryOrder":5,"number":22,"question":"下列哪個因素不是關於睪丸下降的重要調控因素？","options":{"A":"雄性素","B":"Wnt信息途徑 signaling","C":"睪丸賀爾蒙 INSL3","D":"Gubernaculum 睪丸韌帶的細胞增殖，移動","E":"Sonic hedgehog（SHH）音蝟因子信息途徑"},"answer":"E","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell’s Urology 12th edi; pp950-953.","sourcePage":173},{"id":"5-023","category":"生理解剖","categoryOrder":5,"number":23,"question":"下列何者為中樞對於射精控制最必要的促進型神經傳導物 質？","options":{"A":"4-氨基丁酸(GABA, gama-aminobutyric acid)","B":"血清素(Serotonin)","C":"多巴胺(Dopamine)","D":"乙烯膽鹼(Acetylcholine)","E":"催產素(Oxytocin)"},"answer":"C","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell’s Urology 12th edi; chapter 71.pp1564-5.","sourcePage":173},{"id":"5-024","category":"生理解剖","categoryOrder":5,"number":24,"question":"下列有關性激素與攝護腺的敘述何者為非？","options":{"A":"游離睾酮(free testosterone)可轉化為雌激素 (estrogen)","B":"雌激素與二氫睪酮（DHT）及睾酮一起負責攝護腺的多 種代謝作用（包括生長，分化和生物學功能）","C":"DHT 是在攝護腺中雄性激素的主要形式","D":"在血漿中游離睾酮在攝護腺經過 5α 還原酶被轉化成 DHT，其活性是睾酮 2 至 10 倍","E":"5α 還原酶有兩型(isoform)。存在於攝護腺基質中， 且與臨床有關的 5α 還原酶主要是第 1 型"},"answer":"E","reference":"(110)/5.生理解剖/參考 資料(摘錄自)：Partin, A.W.et al. Campbell Walsh Wein Urology, 12 ed.; Elsevier Health Sciences: 2020, Chapter 143, P.3281-3284","sourcePage":173},{"id":"5-025","category":"生理解剖","categoryOrder":5,"number":25,"question":"下列有關輸尿管解剖構造的敘述何者不恰當？","options":{"A":"走在膀胱壁內的輸尿管是輸尿管最窄的部分，平均直徑 為 3~4 mm","B":"三角區是膀胱中血管最多的部分，由輸尿管的縱向肌纖 維在逼尿肌上的延伸形成","C":"遠端輸尿管（distal ureter）的血液是由其內側的血 管供應","D":"輸尿管的路徑開始於腎動脈的後方，並沿著腰大肌的前 緣向下延伸","E":"男性的輸尿管間嵴（interureteral ridge）比女性更 突出，輸尿管口沿其對稱分佈，距中線約 1～2 cm"},"answer":"C","reference":"(110)/5.生理解剖/參考 資料(摘錄自)：Partin, A.W.et al. Campbell Walsh Wein Urology, 12 ed.; Elsevier Health Sciences: 2020, Chapter 84, P.1874-1875","sourcePage":173},{"id":"5-026","category":"生理解剖","categoryOrder":5,"number":26,"question":"與男性性功能有關的中樞神經傳導物質作用，以下敘述何者 為非？","options":{"A":"多巴胺(Dopamine)會刺激勃起","B":"鴉片類藥物（Opioids）會刺激勃起","C":"正腎上腺素 （norepinephrine）會促進性功能","D":"催乳激素(Prolactin) 會抑制性功能","E":"血清素（Serotonin）會刺激也可能會抑制勃起"},"answer":"B","reference":"(110)/5.生理解剖/參考 資料(摘錄自)：Partin, A.W.et al. Campbell Walsh Wein Urology, 12 ed.; Elsevier Health Sciences: 2020, Chapter 68, P.1495","sourcePage":174},{"id":"5-027","category":"生理解剖","categoryOrder":5,"number":27,"question":"有關膀胱的神經生理調控，下列何者敘述為非？","options":{"A":"膀胱尿路上皮的醣胺聚多醣層（glycosaminoglycan layer）可防止細菌附著，同時它的不通透性也可防止 尿液滲漏","B":"尿路上皮細胞可以釋放神經傳導物質並回應神經傳導 物質的刺激","C":"肌纖維母細胞(myofibroblast)可以調控尿路上皮及感 覺神經間的互動","D":"尿路上皮細胞會釋放出 ATP 刺激肌纖維母細胞並將信 號透過感覺神經傳導至中樞","E":"緊密連接(tight junction)蛋白與 Uroplakin 蛋白在尿 路上皮屏障功能中扮演重要的角色"},"answer":"A","reference":"(110)/5.生理解剖/參考 資料(摘錄自)：Partin, A.W.et al. Campbell Walsh Wein Urology, 12 ed.; Elsevier Health Sciences: 2020, Chapter 110, P.2470","sourcePage":174},{"id":"5-028","category":"生理解剖","categoryOrder":5,"number":28,"question":"以下有關男性生殖系統的解剖生理學，何者正確?","options":{"A":"輸精管動脈(artery of the vasa deferentia)是源自 外髂動脈(external iliac artery)","B":"睪丸的 sertoli cell 之間有 tight junction，因此不 會形成血睪屏障(blood-testis barrier)","C":"神經學檢查 bulbocavernosus reflex，主要是測量 S2-4 的薦椎神經根(sacral nerve root levels)","D":"攝護腺中的 5α-reductase 已 type1 &3 為主","E":"Prostatic stem cell 會位在 distal portions of prostatic ducts"},"answer":"C","reference":"(110)/5.生理解剖/參考 資料(摘錄自)：Campbell walsh Urology, 11th edition, Chapter71& 102","sourcePage":174},{"id":"5-029","category":"生理解剖","categoryOrder":5,"number":29,"question":"以下有關骨盆腔的解剖生理，何者正確?","options":{"A":"Sacrotuberous ligament 分開 greater sciatic foramen 和 lesser sciatic foramen","B":"陰部動脈(pudendal artery)最後走回外髂動脈 (external iliac artery)","C":"副屬陰部動脈(accessory pudendal artery)與勃起功 能無關","D":"外尿道括約肌的肌纖維組可分 slow-twitch fibers 與 fast-twitch fibers，男性的 slow-twitch fibers 與 比例要高於女性","E":"外尿道括約肌的肌纖維組可分 slow-twitch fibers 與 fast-twitch fibers，男性比例分別為 65% & 35%"},"answer":"E","reference":"(110)/5.生理解剖/參考 資料(摘錄自)：Campbell walsh Urology, 11th edition, P1598 P1604 P2658 P1637","sourcePage":175},{"id":"5-030","category":"生理解剖","categoryOrder":5,"number":30,"question":"腎臟的解剖生理何者正確?","options":{"A":"阻塞一個月的腎臟中可發現，鈉離子運輸蛋白 upregulation","B":"阻塞一個月的腎臟中可發現，腎內壓上升","C":"阻塞一個月的腎臟中可發現，水通道蛋白 (aquaporin-2)減少","D":"腎水腫若合併在MAG3 Lasix renogram中造影劑uptake 明顯延遲，則代表沒有阻塞","E":"腎水腫若合併non-contrast CT發現腎盂鈣化(pelvic calcification)，則代表有阻塞"},"answer":"C","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 11th edition Chapter 48 Campbell review Ch 48 P.195 No.21 Ch 48 P.195 No.22","sourcePage":175},{"id":"5-031","category":"生理解剖","categoryOrder":5,"number":31,"question":"維持骨盆內器官位置穩定主要依靠 endopelvic connective tissues，這些筋膜構成了骨盆器官 Level I-III support， 關於這些筋膜的敘述，以下何者正確？","options":{"A":"Cardinal and pubocervical ligaments 組成 level I support，負責維持子宮及上段陰道的穩定","B":"Endopelvic and uterosacral fascia 組成 level II support，負責維持中段陰道的穩定","C":"Level III support 主要由 periurethral fascia 組 成，負責維持下段陰道的穩定","D":"Level II 的筋膜纖維主要為垂直走向","E":"Level III 的筋膜纖維長度較 Level I 筋膜纖維短"},"answer":"E","reference":"(110)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology, 11th Edition,p1941","sourcePage":175},{"id":"5-032","category":"生理解剖","categoryOrder":5,"number":32,"question":"有關於攝護腺胚胎生理相關之生物標記（markers）相關敘 述，以下何者正確？","options":{"A":"Prebud urogenital sinus epithelium 上可找到 TP63、 KRT5 之生物標記，但找不到 KRT18 之生物標記","B":"Solid prostatic ducts 上可找到 TP63、KRT5 之生物 標記，但找不到 KRT18 之生物標記","C":"Adult prostate luminal cells 上可找到 TP63、KRT5 之生物標記，但找不到 KRT18 之生物標記","D":"Adult prostate basal cells 上可找到 TP63、KRT5 之 生物標記，但找不到 KRT18 之生物標記","E":"GSTpi 之生物標記可以在 Prebud urogenital sinus epithelium、Solid prostatic ducts 與 Adult luminal cells 上找到"},"answer":"D","reference":"(111) Campbell-Walsh Urology 12th Chp.20 P.315 Table 20.1","sourcePage":175},{"id":"5-033","category":"生理解剖","categoryOrder":5,"number":33,"question":"下列有關於身體對於泌尿道癌症所產生的生理免疫反應，何 者敘述錯誤？","options":{"A":"在壓力、發炎、病毒感染的情況下，泌尿道上皮細胞 (epithelial/urothelial cell)會分泌 type I interferons 與 chemokines 以協助免疫反應進行。","B":"巨噬細胞(macrophage)會吞噬病原體與凋亡的細胞，並 且分泌 cytokines 與 chemokines 來啟動或加強免疫反 應","C":"CD8 T cell 被稱作 killer T cell，一旦被啟動後，將 會攻擊標的物使之溶解","D":"CD4 T cell 被稱作 helper T cell，可以協助殺手 T 細胞進行胞殺作用或協助 B 細胞分泌抗體","E":"Regulatory T cell(Treg)屬於 CD4 T cells 的一個子 集合，主要功能是控制趨緩目前正在進行的免疫反應。 其上會表現 transcription factor “FoxP5"},"answer":"E","reference":"(111) Campbell-Walsh Urology 12th Chp.61 P.1334 Table 61.1","sourcePage":176},{"id":"5-034","category":"生理解剖","categoryOrder":5,"number":34,"question":"有關於男性生殖系統的解剖構造敘述，以下何者有誤？","options":{"A":"睪丸附件(appendix testis)位於睪丸(testis)本體的 下端(lower pole)","B":"副睪(epididymis)與睪丸的接合處位於睪丸本體的後 外側(posterolateral)","C":"輸精管動脈(deferential artery)大多源自於內髂動 脈(internal iliac artery)或上膀胱動脈(superior vesical artery)","D":"睪丸的淋巴系統主要匯集至 para-aortic lymph nodes 與 interaortocaval lymph nodes","E":"副睪的血液供應主要由睪丸動脈(testicular artery) 與輸精管動脈(deferential artery)負責"},"answer":"A","reference":"(111) Campbell-Walsh Urology 12th Chp.63 (1) P.1370 (2) P.1370 (3) P.1370 (4) P.1372 (5) P.1375","sourcePage":176},{"id":"5-035","category":"生理解剖","categoryOrder":5,"number":35,"question":"有關於中樞神經系統中，神經傳導物質 (neurotransmitters)對於陰莖勃起(penile erection)的 生理敘述，下列何者錯誤？","options":{"A":"多巴胺(dopamine)藉由與 D1 和 D4 受體結合，可促進陰 莖勃起","B":"血清素(serotonin, 5-HT)藉由與 5-HT1A 受體結合，可 抑制陰莖勃起","C":"血清素(serotonin, 5-HT)藉由與 5-HT1C 受體結合，可 促進陰莖勃起","D":"γ-Aminobutyric acid 可抑制陰莖勃起","E":"黑皮質素(melanocortins)藉由與 MC4 受體結合，可抑 制陰莖勃起"},"answer":"E","reference":"(111) Campbell-Walsh Urology 12th Chp.68 P.1494 P.1495 Table 68.7","sourcePage":176},{"id":"5-036","category":"生理解剖","categoryOrder":5,"number":36,"question":"關於利用泌尿道手術中，利用消化道置入(bowel/stomach interposition)以行泌尿道改道(urinary diversion)後所 造成的電解質與酸鹼不平衡之敘述，下列何者正確？","options":{"A":"利用胃(stomach)做泌尿道改道，需注意產生代謝性鹼 中毒(metabolic alkalosis)","B":"利用近端空腸(proximal jejunum)做泌尿道改道，需注 意產生高鉀、高氯性代謝性酸中毒(hyperkalemic hyperchloremic metabolic acidosis)","C":"利用迴腸(ileum)做泌尿道改道，需要注意產生高氯性 代謝性鹼中毒(hyperchloremic metabolic alkalosis)","D":"利用胃(stomach)做泌尿道改道，常造成醛固酮 (aldosterone)異常下降","E":"利用空腸(jejunum)做泌尿道改道，常造成腎素(renin) 與血管收縮素(angiotensin)異常下降"},"answer":"A","reference":"(111) Campbell-Walsh Urology 12th Chp.139 P.3199 P.3200 P.3201 Table 139.15","sourcePage":177},{"id":"5-037","category":"生理解剖","categoryOrder":5,"number":37,"question":"關於腎上腺生理解剖之描述，何者正確?","options":{"A":"右側腎上腺靜脈流入右腎靜脈，通常比左側腎上腺靜脈 短","B":"腎上腺皮質由被膜動脈(capsular artery)供應血流","C":"腎上腺皮質及髓質血流供應血管不相同，供應腎上腺皮 質的血流不會進入髓質","D":"髓質小動脈(medullary arterioles)是供應腎上腺髓 質血流的唯一血管","E":"流出腎上腺皮質的靜脈血液中含有高濃度的糖皮質素 (glucocorticoids)"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell urology, 第 12 版, 105, 2345-2353.e1","sourcePage":177},{"id":"5-038","category":"生理解剖","categoryOrder":5,"number":38,"question":"關於膀胱解剖構造之描述，何者正確?","options":{"A":"由外髂動脈(external iliac artery)分支出來的上膀 胱動脈(Superior vesical artery)和下膀胱動脈 (Inferior vesical artery)負責","B":"膀胱淋巴引流包含外髂及內髂淋巴結(external and internal iliac lymph nodes)","C":"膀胱右側壁之淋巴引流只會到右側淋巴結","D":"膀胱壁具有高密度之交感神經支配","E":"膀胱之固有肌層(muscularis propria)由兩層平滑肌 組成"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell urology, 第 12 版, 109, 2444-2460.e1","sourcePage":177},{"id":"5-039","category":"生理解剖","categoryOrder":5,"number":39,"question":"關於攝護腺解剖構造之描述，何者正確?","options":{"A":"深背靜脈(deep dorsal vein)的表淺分枝位於攝護腺外 側，靠近直腸","B":"主要供應攝護腺血流的動脈為上膀胱動脈(superior vesical artery)","C":"攝護腺兩旁之神經血管束(neurovascular bundle)位 於提肛筋膜(levator fascia)之外層","D":"攝護腺之交感神經支配由下腹神經(hypogastric nerve)控制","E":"尿道外括約肌之肌肉與攝護腺尖部有明確之分界線，括 約肌不會接觸到攝護腺"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell urology, 第 12 版, 155, 3548-3565.e2","sourcePage":178},{"id":"5-040","category":"生理解剖","categoryOrder":5,"number":40,"question":"關於睪丸生理解剖之描述，何者正確?","options":{"A":"睪丸白膜(tunica albuginea)內含有平滑肌細胞","B":"Leydig 細胞製造睪固酮，位於細精管(seminiferous tubules)管腔內","C":"睪丸內不含免疫細胞，例如肥大細胞(mast cell)","D":"輸精管動脈為睪丸主要血液供應血管","E":"睪丸之淋巴回流主要至骨盆淋巴結"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell urology, 第 12 版, 63, 1370-1389.e2","sourcePage":178},{"id":"5-041","category":"生理解剖","categoryOrder":5,"number":41,"question":"關於尿道解剖之描述，何者正確?","options":{"A":"利特腺細胞(glands of Littre)位於陰莖尿道的黏膜層","B":"尿道血液主要由外陰動脈(external pudendal artery) 提供","C":"尿道之淋巴引流主要至外髂淋巴結(external iliac nodes)","D":"尿道舟狀窩(fossa navicularis)為慕勒氏管遺跡 (müllerian remnant)","E":"前列腺小囊(prostatic utricles)開口位於精阜 (verumontanum)"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell urology, 第 12 版, 63, 1370-1389.e2","sourcePage":178},{"id":"5-042","category":"生理解剖","categoryOrder":5,"number":42,"question":"下列關於腎上腺何者錯誤?","options":{"A":"在單側腎臟發育不全(renal agenesis)的病人，其對側 腎上腺通常處於後腹腔上側正常的位置","B":"在跨越性異位腎臟(renal ectopia) 的病人，其同側腎 上腺通常處於後腹腔上側正常的位置","C":"腎上腺髓質主要分泌 catecholamines，是調控血壓及 戰鬥或逃跑反映的重要荷爾蒙","D":"腎上腺皮質最外層為 zona glomerulosa，主要分泌糖 化皮質類固醇 glucocorticoids","E":"腎上腺皮質最內層為 zona reticularis，可分泌雄性 素 androgens"},"answer":"D","reference":"(111) 參考資料(摘錄自)：(111) Campbell-Walsh 12th edition Chapter105. P2349, P2351 Chapter38. P724","sourcePage":178},{"id":"5-043","category":"生理解剖","categoryOrder":5,"number":43,"question":"下列關於腎臟的解剖構造，何者正確?","options":{"A":"The white line of Toldt 包覆在橫結腸上","B":"腎門(renal hilum)的構造，從前到後依序為腎動脈、 腎靜脈、腎盂","C":"腎筋膜(Georta fascia)包圍整個腎臟及腎上腺，但不 包含腎臟最外側","D":"Avascular plane of Brodel 是位於腎實質前三分之 二，與腎實質後三分之一之間的橫切面，是腎臟血流相 對較少的區域","E":"通常來說，右側 gonadal vein 匯入右側 renal vein"},"answer":"D","reference":"(111) Campbell-Walsh 12th edition Chapter12. P163 Chapter75.","sourcePage":179},{"id":"5-044","category":"生理解剖","categoryOrder":5,"number":44,"question":"下列關於攝護腺的解剖構造，何者錯誤?","options":{"A":"Apex 區域是由 striated urethral sphincter 延伸而 來","B":"Central zone 包含了 ejaculatory duct，主要腺體來 源自 Müllerian duct","C":"有約 70%的攝護腺癌發生在 Peripheral zone","D":"Anterior zone 是由 fibromuscular stroma 組成","E":"攝護腺有 70%是由 glandular tissue 組成，30%是由 fibromuscular tissue 組成"},"answer":"B","reference":"(111) Campbell-Walsh 12th edition, Chapter 63.","sourcePage":179},{"id":"5-045","category":"生理解剖","categoryOrder":5,"number":45,"question":"與男性膀胱頸對比，女性膀胱頸的特徵為?","options":{"A":"縱向平滑肌纖維延伸至 external meatus","B":"擁有廣泛性的腎上腺素激導性的神經支配(extensive adrenergic innervation)","C":"主要負責女性的 urinary continence","D":"比較厚的 middle smooth muscle layer","E":"被第一型纖維(type I fiber)所環繞"},"answer":"A","reference":"(111) Campbell-Walsh 11th edition Review Chapter 67","sourcePage":179},{"id":"5-046","category":"生理解剖","categoryOrder":5,"number":46,"question":"擁有雙套輸尿管的病人解剖構造通常會遵循 Weigert-Meyer rule，以下敘述何者正確?","options":{"A":"Upper moiety 的輸尿管從較近端及內側進入膀胱， Lower moiety 的輸尿管則從較遠端及外側進入膀胱","B":"Upper moiety 的輸尿管從較遠端及外側進入膀胱， Lower moiety 的輸尿管則從較近端及內側進入膀胱","C":"Upper moiety 的輸尿管從較近端及外側進入膀胱， Lower moiety 的輸尿管則從較遠端及內側進入膀胱","D":"Upper moiety 的輸尿管從較遠端及內側進入膀胱， Lower moiety 的輸尿管則從較近端及外側進入膀胱","E":"Upper moiety 的輸尿管進入膀胱的位置高於 Lower moiety 的輸尿管進入膀胱的位置"},"answer":"D","reference":"(111) Campbell-Walsh 11th edition Review Chapter 137","sourcePage":179},{"id":"5-047","category":"生理解剖","categoryOrder":5,"number":47,"question":"關於攝護腺癌與 DNA 甲基化(methylation)的描述，下列何 者有誤?","options":{"A":"Glutathione-S-transferases pi (GSTP1) 的甲基化是 攝護腺癌最常見的 somatic genome alteration","B":"約九成的攝護腺癌可發現 GSTP1甲基化，但在正常攝護 腺組織約只有兩成","C":"DNA 甲基化的機制之一為 5-methylcytosine 固有的突 變效應(mutational effect)","D":"DNA 甲基化的程度高，與攝護腺癌預後較差有正相關","E":"腫瘤抑制基因 RASSF1A的甲基化也與攝護腺癌的發生 有關"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell Urology 11th edition, pp:463","sourcePage":180},{"id":"5-048","category":"生理解剖","categoryOrder":5,"number":48,"question":"關於在攝護腺癌細胞之染色體中所發現的染色體重排 (chromosomal rearrangement)，下列描述何者為非?","options":{"A":"在 2005 年首先發現在 TMPRESS2和 ERG基因上游的 regulatory region，有 recurrent gene fusion","B":"這些 gene fusion 絕大部分是由於 intervening sequence 的 deletion 加上後續複雜的 translocation-type rearrangements 所產生","C":"這樣的結果會讓 androgen-regulated promoter 可以控 制 antioncogenic transcription factor","D":"這些基因的重排可以簡單經由 RT-PCR 得知","E":"目前已可利用免疫染色的方式來偵測 ERG蛋白的表 現，以作為 ERG基因重排的 surrogate marker"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell Urology 11th edition, pp:466","sourcePage":180},{"id":"5-049","category":"生理解剖","categoryOrder":5,"number":49,"question":"下列關於 TMPRSS2-ERG fusion 的敘述何者為誤?","options":{"A":"攝護腺癌中發生的機率為 40-60%","B":"High grade PIN 亦可發現此類基因變異","C":"因其具有高特異性，可以與 PSA 共同來診斷或監測攝護 腺癌的治療效果","D":"在攝護腺癌組織中，fusion status 程度越高，疾病的 預後較差","E":"此基因改變在從 transition zone 長出來的攝護腺癌完 全看不到"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell Urology 11th edition, pp:466","sourcePage":180},{"id":"5-050","category":"生理解剖","categoryOrder":5,"number":50,"question":"關於後腹腔的解剖學構造，下列何者為非?","options":{"A":"腎臟屬於 primarily retroperitoneal 器官，而腎上腺 屬於 secondarily retroperitoneal 器官","B":"Extraperitoneal space 包含了後腹腔及周邊包圍腹腔 的空間","C":"Lumbosacral plexus 也包含在後腹腔中","D":"Prerenal fascia 又稱為 fascia of Toldt","E":"Perirenal space 並非是一個封閉的空間"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell Urology 11th edition, pp:765, 771","sourcePage":181},{"id":"5-051","category":"生理解剖","categoryOrder":5,"number":51,"question":"關於陰莖解剖學構造及功能的描述，下列何者為非?","options":{"A":"Tunica 最脆弱的地方位於 ventral groove","B":"在人類身上，兩個 corpora cavernosa 間的 septum 是 不完整的","C":"在未勃起狀態，陰莖血液的氧氣分壓為 35 mm Hg","D":"在勃起狀態下，尿道海綿體內的壓力只有陰莖海綿體的 一半到三分之一左右","E":"Ischiocavernosus muscle 收縮可促進精液排出"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell Urology 11th edition, pp:613-618","sourcePage":181},{"id":"5-052","category":"生理解剖","categoryOrder":5,"number":52,"question":"下列關於兩側腎靜脈的敘述，何者不正確？","options":{"A":"左腎靜脈比較長，約 6-10 cm，所以有腎上腺靜脈與性 腺靜脈注入","B":"右靜脈比較短約 2-4 cm，所以腰靜脈注入","C":"附屬腎靜脈 accessory vein，右側比較常見","D":"胡桃鉗症候群最常見的症狀是血尿","E":"胡桃鉗症候群是左腎靜脈被腹主動脈與上腸繫膜動脈 夾壓所致"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell’s Urology 11th edi p264, p973 Orczyk K, et al: What Each Clinical Anatomist Has to Know about Left Renal Vein Entrapment Syndrome (Nutcracker Syndrome): A Review of the Most Important Findings. Biomed Res Int 2017; 17:1746570.","sourcePage":181},{"id":"5-053","category":"生理解剖","categoryOrder":5,"number":53,"question":"下列何者是支撐固定腎臟的組織，1.膠原蛋白束、2.腎旁脂 肪 pararenal fat、3.腎周圍脂肪 perirenal fat、4.Gerota fascia","options":{"A":"1+2","B":"1+2+4","C":"2+3+4","D":"1+3+4","E":"1+2+3+4"},"answer":"B","reference":"(111) Campbell’s Urology 11th edi p967","sourcePage":181},{"id":"5-054","category":"生理解剖","categoryOrder":5,"number":54,"question":"下列關於輸尿管胚胎發育時的敘述何者不正確？","options":{"A":"在完全複製的輸尿管，引流上段腎臟的輸尿管進入膀胱 通常是在下段腎臟輸尿管的下內側方稱為Ｗ erget-Meyer rule","B":"異位腎臟的輸尿管進入膀胱，通常在同側正常的位置上","C":"異位的輸尿管進入膀胱容易產生輸尿管囊腫 ureterocele 或逆流","D":"進入骨盆的輸尿管跨過髁總動脈的分叉點即內外腸股 動脈，然後往內側下降，是重要的骨盆手術標記","E":"右輸尿管從十二指腸下部後面開始往下走，被性腺血管 跨過，稱為橋下的水 Water under bridge"},"answer":"D","reference":"(111) Campbell’s Urology 11th edi p975 Campbell’s Urology 11th edi p935 Smith’s General Urology the 17th edi, p7","sourcePage":182},{"id":"5-055","category":"生理解剖","categoryOrder":5,"number":55,"question":"下列有關於調控 GnRH 促性腺素釋素分泌的物質的作用何者 不正確？","options":{"A":"鴉片類是抑制","B":"前列腺素是抑制","C":"性激素是抑制","D":"胜肽賀爾蒙如濾泡刺激素是抑制","E":"胰島素是刺激"},"answer":"B","reference":"(111) Smith’s General Urology the 17th edi, p685 Campbell’s Urology 11th edi p517","sourcePage":182},{"id":"5-056","category":"生理解剖","categoryOrder":5,"number":56,"question":"下列敘述關於女性尿道的解剖構造，何者不正確？","options":{"A":"在黏膜下的結締組織內有大的 Skene 腺體，開口於緊鄰 尿道口的底部","B":"緊接著黏膜下的是蹤走的平滑肌，來自於膀胱內蹤走層 的平滑肌","C":"環狀的平滑肌來自於膀胱外層平滑肌","D":"外括約肌是環狀的平滑肌位於尿道的中三分之一","E":"女性尿道的動脈由膀胱下動脈、陰道與內陰動脈供應"},"answer":"D","reference":"(111) Smith’s General Urology the th 17 edi, p14-15","sourcePage":182},{"id":"5-057","category":"生理解剖","categoryOrder":5,"number":57,"question":"關於腎上腺的構造及功能，下列敘述何者為正確敘述?","options":{"A":"腎上腺血液供應由上、中、下三條動脈組成，上： inferior phrenic artery，中：aorta，下；ipsilateral renal artery，兩側的腎上腺靜脈皆先回流至 Inferior phrenic vein，再回流至 Inferior vena cava","B":"Thoracic splanchnic nerves 從脊髓 Intermediolateral cell column 發出至 Sympathetic trunk，Postganglionic Fibers 再由此發出至 adrenal 控制 medulla 分泌 catacholamine","C":"成人腎上腺皮質構造由外到內依序是 zona glomerulosa (ZG)，zona reticularis (ZR)， zona fasciculata (ZF)","D":"Zona glomerulosa (ZG)分泌 Glucocorticoids，zona reticularis (ZR)分泌 Mineralocorticoids，zona fasciculata (ZF)分泌 sex hormones","E":"胚胎發育時,由 adrenogonadal ridge 的 cephalic portion 產生"},"answer":"E","reference":"(111) 參考資料(摘錄自)：第 11 版 Campbell P.1519-1526","sourcePage":182},{"id":"5-058","category":"生理解剖","categoryOrder":5,"number":58,"question":"關於腎上腺生理，以下何者為非?","options":{"A":"Cushing syndrome 在西方世界以外源性(Exogenous)的 原因最多","B":"不管是身理性或是心理性的壓力都是調節 Hypothalamic-Pituitary-Adrenal Axis 最重要的因素","C":"位於膀胱逼尿肌的 catecholamine receptor 為 ß ，於 2 ureter 調節 motility and tone 的為 α 1","D":"Ectopic Adrenocorticotropic Hormone Syndrome 大 概佔 Cushing syndrome 中的 10%，且幾乎都是惡性","E":"Mineralocorticoids 作用於遠曲小管 Distal tubule, connecting segment, collecting duct，可幫助排除 Cl 離子以維持電解質平衡"},"answer":"E","reference":"(111) Campbell Walsh Wein Urology11th Edition,, pg 1531-1534)","sourcePage":183},{"id":"5-059","category":"生理解剖","categoryOrder":5,"number":59,"question":"關於陰莖、睪丸的構造，以下何者正確?","options":{"A":"從陰莖的背側開始劃刀，切開 penile skin 以後第一個 淺層的 fascia 為 Buck fascia。","B":"支配睪丸 Cutaneous nerve 之神經為 pudendal nerve 之 inferior branch。","C":"副睪丸 80%以上由 superior epididymal artery 供應 血流，但做結紮手術時可犧牲 superior epididymal artery 增加更多的 testicular mobilization。","D":"陰莖白膜(tunica albuginea)分為兩層， 為內縱外環的構造。","E":"斜筋膜(external oblique fascia)與肌 肉向下延伸成 為提睪肌和筋膜 (cremasteric muscle and fascia)"},"answer":"C","reference":"(111) Campbell Walsh Wein Urology11th Edition,, pg 1531-1534) (D)512 (E)514 Campbell Walsh Wein Urology12th Edition,, pg 1842-1845)","sourcePage":183},{"id":"5-060","category":"生理解剖","categoryOrder":5,"number":60,"question":"關於 ureter 生理解剖，下列敘述何者正確？","options":{"A":"ureter 胚胎源自於 mesonephric tubules","B":"關於輸尿管的 blood supply, proximal ureter 是由內 側 renal artery 供應，mid-ureter 是由後側 common iliac artery 供應，distal ureter 則是由外側 superior vesical artery 供應","C":"Mid-ureter 和 distal ureter 的靜脈回流主要是靠 external iliac vein","D":"輸尿管狹窄可由一張清楚的 excretory urography 影像 來診斷","E":"根據 Ureteral orifice 的位置和外型分級，級別越高 代表 orifice 越傾向在 medial side 且越可能有 reflux 的問題"},"answer":"B","reference":"(111) Campbell-Walsh Urology 12th edition, Chapter 20, p.314, p.320; Chapter 84, p.1874~1875","sourcePage":183},{"id":"5-061","category":"生理解剖","categoryOrder":5,"number":61,"question":"下列關於女性骨盆腔解剖構造的敘述何者為非?","options":{"A":"女性 pelvic inlet 前傾，使得來自腹內和骨盆腔的壓 力是由骨盆的骨頭支撐，而不是肌肉和韌帶","B":"骨盆底偏內側的 arcus tendineus fascia pelvis (ATFP) 和偏外側的 arcus tendineus levator ani (ATLA) 連接坐骨脊和恥骨，是筋膜和肌肉附著的重要 構造","C":"進行脫垂懸吊手術時，ischial spine 和 sacrospinous ligament 可作為座標，避免傷到後方的 sacral plexus 及 pudendal nerve","D":"Sacral plexus 損傷會影響大腿和小腿後側的感覺和運 動功能","E":"骨盆腔器官的淋巴主要經由 internal iliac nodes 和 其分支回流"},"answer":"D","reference":"(111) Campbell-Walsh Urology 12th ed Ch. 108. p.2433, 2439","sourcePage":184},{"id":"5-062","category":"生理解剖","categoryOrder":5,"number":62,"question":"下列有關男性泌尿生殖解剖的敘述，何者正確?","options":{"A":"攝護腺主要由纖維肌肉間質(fibromuscular stroma) 所構成，占比約為攝護腺總體組成的 70%","B":"陰莖的深部動脈血流，主要源自內髂動脈(internal iliac.)，經陰部內動脈(internal pudendal a.)，於 陰莖分支為陰莖深動脈(deep a.)、背側動脈(dorsal a.)，以及球尿道動脈(bulbourethral a.)","C":"提睪肌(cremaster m.)主要由腹外斜肌(external oblique m.)延伸而來","D":"睪丸血流主要由睪丸動脈(testicular a.)供應，為內 髂動脈(internal iliac a.)分支之一","E":"儲精囊的交感神經支配，由上段腰骶神經叢 (superior lumbar nerves) 以及海綿體神經(cavernous n.) 所組 成"},"answer":"B","reference":"(111) 參考資料(摘錄自)： Campbell Urology 12版, Chapter 63, Page 1370-1389. 詳解: (A) glandular element為 主。 (C)腹內斜肌。 (D)由aorta分支而來。 (E)由腹下神經 (hypogastric n. )和上段 腰骶神經叢(superior lumbar nerves) 所支配。","sourcePage":184},{"id":"5-063","category":"生理解剖","categoryOrder":5,"number":63,"question":"下列關於膀胱及尿道生理解剖的描述，何者正確?","options":{"A":"第三型毒蕈鹼類受體 (Muscarinic M3 receptor)主要 調控膀胱迫尿肌收縮，占膀胱毒蕈鹼類受體的比例最高","B":"橫紋肌括約肌(Rhabdospincter)主要由 slow-twitch fiber 組成, 在男性的占比較女性高，負責 sphincter tone 的維持","C":"膀胱壁中 Type III collagen 比率，會隨著順應性 (compliance)變差而減少","D":"一氧化氮可藉由調控細胞內 cAMP 濃度上升，促使尿道 平滑肌放鬆","E":"薦骨神刺激術(Sacral nerve stimulation) 可透過調 節不正常的 guarding reflex 來改善尿滯留"},"answer":"E","reference":"(111) 參考資料(摘錄自)： Campbell Urology 12 版, Chapter 110, page 2463-2511; Chapter 120, Page 2679-2680. 詳解: (A)為第二型(M2)。 (B)男性較女性低。 (C)增加。 (D)cGMP。","sourcePage":184},{"id":"5-064","category":"生理解剖","categoryOrder":5,"number":64,"question":"下列關於腎臟及輸尿管生理解剖的描述，何者正確?","options":{"A":"腎動脈(renal a.) 的數量可能產生變異而增加，且較 容易發生在右側","B":"在 complete ureter duplication, lower moiety 產生 ureterocele 的機率較 upper moiety 來的高","C":"根據 Ureter orifice 的形狀，可分為 4 個等級，與 vesicoureteral reflux 有關","D":"採用內視鏡切開手術(endoureterotomy)，治療下段輸 尿管(distal portion)狹窄時，應靠輸尿管外側 (lateral side)切入，避免傷及動脈","E":"血管加壓素(Angiotensin)以及前列腺 E1(Prostaglandins E1)會增加輸尿管的活動性"},"answer":"C","reference":"(111) 參考資料(摘錄自)： Campbell Urology 12 版, Chapter 84, Page1869-1875; Chapter 85, Page 1902. 詳解: (A)左側。 (B)低。 (C)Grade 0-3，愈高則越 嚴重 (D)內側。 (E)減少。","sourcePage":185},{"id":"5-065","category":"生理解剖","categoryOrder":5,"number":65,"question":"下列關於腎上腺生理解剖的描述，何者正確?","options":{"A":"腎上腺分為兩部分，分別由源自神經外胚層 (neuroectoderm)分化的皮質(cortex)，以及源自中胚 層(mesoderm)的髓質(medulla)構成","B":"球狀帶(Zona Glomerulosa)占腎上腺皮質體積最少，主 要由血管加壓素 II (angiotensin II)所調節","C":"腎上腺髓質(medulla)負責身體 Catecholamine 的製 造，以 norepinephrine 所占比率最高，dopamine 次之","D":"束狀帶(Zona fasciculata)負責葡萄醣皮質素 (glucocorticoid)的製造，主要由促腎上腺皮質激素 (ACTH)所調節","E":"Phenylethanolamine-N-methyltransferase (PNMT) 為 腎上腺髓質特有的酵素，而礦物性皮質素 （mineralocorticoid）能夠加強其作用"},"answer":"D","reference":"(111) 參考資料(摘錄自)： Campbell Urology 12 版, Chapter 106, Page 2354-2360. 詳解: (A)相反。 (B)占比為第二，約為 15% (C) epinephrin 占比最 高，norepinephrin 次之。 (E)葡萄糖皮質素 (glucocorticoid)。","sourcePage":185},{"id":"5-066","category":"生理解剖","categoryOrder":5,"number":66,"question":"下列關於女性骨盆解剖構造的敘述，何者錯誤?","options":{"A":"陰道支撐根據高低位置分成三個等級，而尿道過度移動 (urethral hypermobility)的產生主要源自於 level II 支持結構的缺失","B":"提肛肌(levator ani m.)，是由恥骨尾骨肌 (Pubococcygeus m.)，恥骨直腸 肌 (Puborectalis m.)，和髂骨尾骨肌 (iliococcygeus m.) 所構成，為支撐骨盆腔結構的主 要角色","C":"骨盆弓型筋膜(Arcus tendineus fascia pelvis, ATFP) 可提供陰道前壁的支持","D":"骨盆腔血流供應主要由內髂動脈(Internal iliac a.) 供應，可進一步分為 anterior trunk 跟 posterior trunk 兩大分支","E":"薦神經叢走向，由坐骨大孔(greater sciatic foramen) 行經薦棘韌帶(sacrospinous ligament)後方，臨床上 可能因實行懸吊手術(colposuspension)而受傷"},"answer":"A","reference":"(111) 參考資料(摘錄自)： Campbell Urology 12 版, Chapter 108, Page 2432-2438 Chapter 115, Page 2597-2599. 詳解: (A) level III","sourcePage":185},{"id":"5-067","category":"生理解剖","categoryOrder":5,"number":67,"question":"關於膀胱及尿道解剖生理之描述，何者有誤?","options":{"A":"Uroplakin 由傘細胞(umbrella cells)製造分泌","B":"第三型膠原蛋白升高可導致膀胱膀胱順應性不良(poor compliant bladder)","C":"男性尿道橫紋肌(rhabdosphincter)內慢縮肌纖維 (slow twitch fiber)比例高於快縮肌纖維(fast twitch fiber)","D":"使用 α-adrenoceptor blockers 可導致尿道壓力下降","E":"骨盆底肌肉運動可促進慢縮肌纖維(slow twitch fiber)轉變為快縮肌纖維(fast twitch fiber)進而減 輕尿失禁症狀"},"answer":"E","reference":"(112) 參考資料(摘錄自)： Campbell urology, 第 12 版, 110, 2462, 2464, 2467, 2468","sourcePage":186},{"id":"5-068","category":"生理解剖","categoryOrder":5,"number":68,"question":"關於後腹腔的生理解剖，以下敘述何者錯誤?","options":{"A":"十二指腸下行段(descending part)位於後腹腔","B":"與大的腸系膜缺損(mesenteric defect)相比，小的腸 系膜缺損發生內疝(internal hernia)的風險較低","C":"下腸繫膜動脈(Inferior mesenteric artery)因手術需 要而截斷時，因有邊緣動脈(marginal arteries)、直 腸動脈(rectal arteries)等側枝循環，故不易發生結 腸缺血","D":"近端輸尿管的血液供給主要來自內側的血管，遠端輸尿 管的血液供給主要來自外側的血管","E":"在手術進行後腹腔剝離時，若傷害到下腹神經叢 (hypogastric plexus)時，可能會導致逆行性射精 (retrograde ejaculation)"},"answer":"B","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12 ed. Chapter 75. P.1658-1679 (Smaller mesenteric defects have a higher risk of internal hernia than large defects. As such, smaller defects should be closed primarily.)","sourcePage":186},{"id":"5-069","category":"生理解剖","categoryOrder":5,"number":69,"question":"下列關於睪丸的敘述何者錯誤?","options":{"A":"正常的年輕男性的睪丸體積約 15-25ml, 長度約 4.5-5.1cm.其中單顆睪丸的曲細精管(seminiferous tubules)約 250 公尺, 且大約有 700 萬個 Leydig cells","B":"SRY (sex-determining region Y gene)是控制性別(sex determination)的重要基因，其位於 Y 染色體的長臂上 (long arm of Y chromosome)，並且大大影響睪丸的生 成","C":"DAX1, WNT4 基因被視為反睪丸基因(antitestis gene)，因為他們會積極地影響女性的性腺發展(female gonadal development)","D":"睪丸中的血管，中段部分(midsection)比上、下部分 (superior, inferior)相對較少","E":"睪丸沒有體神經的支配(somatic innervation)，但是 有自主神經的支配(autonomic innervation)，其來源 為腸系膜間神經(intermesenteric nerves), 腎神經叢 (renal plexus)"},"answer":"B","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh Urology 12th Edition, p.1392-1394/(B) short arm","sourcePage":186},{"id":"5-070","category":"生理解剖","categoryOrder":5,"number":70,"question":"下列與下泌尿道功能(Lower urinary tract function)有關 的神經(nerve)與神經傳導物質(neurotransmitter)的敘 述，何者為是?","options":{"A":"下腹神經(hypogastric nerve)的感覺纖維(afferent fiber)，包含了有髓鞘的 Aδ 纖維(myelinated Aδ axons)與無髓鞘的 C 纖維(unmyelinated C axons)，用 來感知膀胱的飽脹程度與收縮力","B":"當膀胱的泌尿上皮(urothelium)受到拉扯(stretch) 時，會分泌三磷酸腺苷(adenosine triphosphate (ATP))，透過具有髓鞘的傳入神經(myelinated afferent fibers)，向大腦提供膀胱的飽脹程度","C":"一氧化氮(nitric oxide)在儲尿期可以刺激膀胱的傳 入神經活性(afferent activity)，在排尿期可以放鬆 尿道平滑肌(urethral smooth muscle)","D":"橋腦排尿中樞(pontine micturition center)主要透過 麩胺酸(glutamate)作為神經傳導物質，來調控副交感 節前神經元(preganglionic parasympathetic neurons)，刺激膀胱收縮","E":"刺激中樞血清素系統(central serotonergic system)，會透過刺激交感神經活性(sympathetic activity)，進而抑制排尿"},"answer":"D","reference":"(112) 參考資料(摘錄自)： Campbell-Walsh-Wein Urology, 12e, 2021. p. 2481 p. 2484 p. 2488 p. 2495 解題說明： (A) Pelvic nerve (B) Unmyelinated (C) 抑制傳入神經 (E) 抑制副交感神經","sourcePage":187},{"id":"5-071","category":"生理解剖","categoryOrder":5,"number":71,"question":"請問下列哪一項關於女生泌尿生理構造的敘述是錯誤的？","options":{"A":"Cardinal ligament 與 uterosacral ligament 融合， 共同穩定子宮頸與上段陰道","B":"Pubovesical ligaments 近似於男性 puboprostatic ligament，可提供恥骨後方支撐","C":"Sacrospinous(SS) ligament culposuspension 時，因 後方就是坐骨大孔，要小心 sacral plexus injury","D":"Episiotomy 時角度應橫向斜切以避免傷害 perineal body","E":"負責性行為時 clitoral engorgement 的 cavernous nerve 源於 pudendal nerve"},"answer":"E","reference":"(112) 參考資料(摘錄自)： Campbell 12ed, Chapter 108, Page 2429-2434; Chapter 74, page 1627.e3 詳解 (A) p.2430 (B) p.2429 (C) p.2433 (D) p.2434 (E) p.1627.e3，derived from inferior hypogastric plexus","sourcePage":187},{"id":"5-072","category":"生理解剖","categoryOrder":5,"number":72,"question":"「守衛反射」(guarding reflex)指的是?","options":{"A":"正常膀胱充盈/貯存過程中，在咳嗽時看到橫紋肌括約 肌活動突然增加","B":"脊髓交感神經抑制副交感神經節活動","C":"正常膀胱充盈/貯存過程中，橫紋肌括約肌活動逐漸增 加","D":"正常膀胱充盈/貯存過程中，腦皮質逐漸抑制腦橋中腦 小便中樞的活動","E":"正常膀胱充盈/貯存過程中，腦橋中腦與脊髓骨盆腔前 核逐漸抑制的活動"},"answer":"C","reference":"(112) /5.生理解剖/參考 料(摘錄自)： Campbell Urology 12th ed. Chapter 111, p.2515","sourcePage":188},{"id":"5-073","category":"生理解剖","categoryOrder":5,"number":73,"question":"關於異位性輸尿管(ectopic ureter)的敘述何者錯誤?","options":{"A":"根據定義只要輸尿管不是注入膀胱三角 (trigone area)都算是異位性輸尿管(ectopic ureter)","B":"若病人的輸尿管屬於雙套系統(Duplex), 通常 都是上套輸尿管(upper pole ureter)會形成異位性輸 尿管(ectopic ureter)","C":"在女性，異位性輸尿管(ectopic ureter)可能 注入膀胱頸(bladder neck),會陰(perineum),陰道 (vagina),子宮(uterus)甚至直腸(rectum)","D":"在男性，異位性輸尿管(ectopic ureter)可能 注入輸精管(vas deferens),儲精囊(seminal vesicles),射精管(ejaculatory duct),尿道攝護腺 (prostatic urethra),尿道球狀部(bulbous urethra)","E":"在男性，異位性輸尿管(ectopic ureter)的臨 床症狀通常不包含尿失禁(incontinence)，取而代之的 是受影響器官的感染或疼痛"},"answer":"D","reference":"(112)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 12th Edition, p798 / (D) In males, the ectopic ureter always enters the urogenital system above the external sphincter or pelvic floor, and usually into the Wolffian structures, including the vas deferens, seminal vesicles, or ejaculatory duct","sourcePage":188},{"id":"5-074","category":"生理解剖","categoryOrder":5,"number":74,"question":"關於輸尿管之描述，何者為非？","options":{"A":"一般來說輸尿管有三處狹窄處，分別為輸尿管腎盂交 界、跨過髂動靜脈處、膀胱壁內(intramural)輸尿管","B":"單靠一張 excretory urography 鮮少能夠完整顯示輸尿 管全長之結構","C":"動脈供應：近端由內側 renal artery 供應、中段由後 側 common iliac artery 供應、遠端外側由 superior vesical artery 供應","D":"靜脈回流：近端走 renal and gonadal vein、中段走 common iliac vein、遠端走 external iliac vein","E":"輸尿管開口依照位置和形態分級 (Grade 1,2,3)，級別 越高表示輸尿管開口越傾向位於外側且易有逆流發生"},"answer":"D","reference":"(112)/ 5.生理解剖/參考 資料(摘錄自)： Campbell 12ed, Chapter 84, Page 1873-1875 詳解： (A) p.1873 (B) p.1874 (C) p.1874 (D) p.1874, mid- and distal 都是 common and internal iliac veins。 p.1875","sourcePage":188},{"id":"5-075","category":"生理解剖","categoryOrder":5,"number":75,"question":"下列有關下尿路(lower urinary tract)的周邊神經系統調 控何者正確?","options":{"A":"骨盆副交感神經(pelvic parasympathetic nerves)由 脊髓的薦神經發出, 活化時可刺激膀胱放鬆與尿道收 縮","B":"腰交感神經(Lumbar sympathetic nerves)活化時會抑 制膀胱體(bladder body)及膀胱底(bladder base);與 刺激尿道收縮","C":"下尿路的交感神經路徑(sympathetic pathway) 由 sympathetic chain ganglia 開始, 經由 inferior mesenteric ganglia 到 hypogastric nerves, 再到 pelvic ganglia","D":"陰部神經(Pudendal nerve)活化時會刺激膀胱底 (bladder base)及尿道外括約肌(external urethral sphincter)","E":"支配膀胱之一的骨盆神經(pelvic nerve)其傳入路徑 (afferent pathway)會偵測膀胱的容量及膀胱收縮的 電位高低, 僅經由 myelinated axon"},"answer":"C","reference":"(112)/ 5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 12th edition Ch 110 p.2480-2481 (A)骨盆副交感神經活化 時刺激膀胱收縮及尿道放 鬆。 (B)應為抑制 bladder body, 刺激 bladder base 及 urethra。 (D)只刺激 EUS 並不會刺激 bladder base。 (E)需有 myelinated 及 unmeylinated axon 一起 進行電位的傳導。","sourcePage":189},{"id":"5-076","category":"生理解剖","categoryOrder":5,"number":76,"question":"睪丸具備外分泌及內分泌之功能，以下關於睪丸功能之描述 何者有誤？","options":{"A":"成年男性每天大約分泌 5 公克之睪固酮","B":"濾泡刺激素(FSH)刺激 Leydig 細胞製造前列腺素 (prostagladins)","C":"激活素(avtivin)促進濾泡刺激素(FSH)分泌","D":"睪固酮被 5α 還原酶(5α-reductase)轉化為 dihydrotestosterone","E":"睪固酮分泌的型態為不規則、脈衝式型態"},"answer":"B","reference":"(112) /5 生理解剖/參考 資料(摘錄自)： Campbell urology, 第 12 版, 64, 1391-1392","sourcePage":189},{"id":"5-077","category":"生理解剖","categoryOrder":5,"number":77,"question":"關於睪丸解剖構造之描述，何者有誤？","options":{"A":"睪丸內間質組織約佔整體睪丸容積的 20-30%","B":"將睪丸分成上、中、下三等份，中間部位的血管量最少","C":"嬰兒時期發生睪丸扭轉會破壞血液-睪丸屏障，產生大 量抗精蟲抗體(antisperm antibodies)","D":"睪丸及副睪丸的血液供應主要來自內精索動脈 (internal spermatic artery)、外精索動脈(external spermatic artery)、輸精管動脈(deferential artery)","E":"精子經由睪丸網(rete testis)進入副睪丸頭部"},"answer":"C","reference":"(112) /5 生理解剖/參考 資料(摘錄自)： Campbell urology, 第 12 版, 64, 1393, 1394, 1399","sourcePage":190},{"id":"5-078","category":"生理解剖","categoryOrder":5,"number":78,"question":"關於腎上腺之描述，何者有誤？","options":{"A":"上腎上腺動脈可能源自於下膈動脈(inferior phrenic artery)","B":"中腎上腺動脈可能源自於下膈動脈(inferior phrenic artery)","C":"下腎上腺動脈可能源自於腎動脈","D":"上腎上腺動脈可能源自於主動脈","E":"下腎上腺動脈可能源自於肋間動脈(intercostal artery)"},"answer":"E","reference":"(112) /5 生理解剖/參考 資料(摘錄自)： Campbell urology, 第 12 版, 105, 2345","sourcePage":190},{"id":"5-079","category":"生理解剖","categoryOrder":5,"number":79,"question":"關於攝護腺解剖生理之描述，何者有誤？","options":{"A":"移行區(transitional zone)包圍射精管，大約佔 5%攝 護腺體積","B":"前部纖維肌肉間質(anterior fibromuscular stroma) 大約佔 30%攝護腺體積，不含腺體成分","C":"攝護腺上皮包含上皮及間質細胞","D":"泌尿生殖竇(urogenital sinus)經由雙氫睪酮刺激轉 化為攝護腺","E":"攝護腺內具有神經內分泌細胞(neuroendocrine cells)，可分泌 somatostatin"},"answer":"A","reference":"(112) /5 生理解剖/參考 資料(摘錄自)： Campbell urology, 第 12 版, 143, 3277, 3278, 3279","sourcePage":190},{"id":"5-080","category":"生理解剖","categoryOrder":5,"number":80,"question":"請問關於儲精囊的解剖生理敘述，下列何者錯誤？","options":{"A":"儲精囊為男性成對的生殖器官，通常左邊的儲精囊會比 右邊來得大","B":"在胚胎發育第 12 週開始從 distal mesonephric ducts 擴張形成，在第 16 週尾聲時逐漸形成許多 diverticula，發育過程當中需要 testosterone 以及 dihydrotestosterone 刺激其 androgen receptor signaling pathway","C":"儲精囊上皮細胞在出生時主要由 principal cells 和 basal cells 組成，後者隨著年紀增加而逐漸減少","D":"Seminal fluid 大約 60%為儲精囊製造，約 30%為攝護 腺製造，主要蛋白質成分為 semenogelin 以及 52-kD protein","E":"儲精囊動脈支配來自於 vesiculodeferential artery，為 umbilical artery 的分支"},"answer":"A","reference":"(112)/ 5.生理解剖/參考 資料(摘錄自)： Campbell 12ed, Chapter 83, page 1856; Chapter 143, page 3280 詳解： (A) p.1856 右邊通常大於 左邊 (B) p.1856 and 3280 (C) p.1856 (D) p.1856 and 3280 p.1856","sourcePage":190},{"id":"5-081","category":"生理解剖","categoryOrder":5,"number":81,"question":"請問關於下泌尿道的構造，下列何者正確？","options":{"A":"Pelvic levators 及 urethral sphincter 均屬於快肌 (fast-twitch fibers)","B":"在順應性(compliance)較差的膀胱，可見 type I collagen 所佔比例顯著上升","C":"Rhabdosphincter(EUS)為快肌與慢肌的混合，男性 EUS 慢肌比例較女性少","D":"膀胱 lamina propria 主要細胞為 fibroblasts，可協 調尿路上皮與逼尿肌控制膀胱縮放","E":"尿路上皮屏障功能主要由 mucinous layer 所維持"},"answer":"C","reference":"(112)/ 5.生理解剖/參考 資料(摘錄自)： Campbell 12ed, Chapter 110, page 2462-2467 詳解： (A) p.2467，慢肌 (B) p.2463，type III， The ratio of Type III to Type I collagen increased. (C) p.2466，正確，EUS 男生 35%快肌＋65%慢 肌，女生 87%慢肌＋13% 快肌 (D) p.2462，內含 myofibroblasts and interstitial cells p.2462，Uroplakins","sourcePage":191},{"id":"5-082","category":"生理解剖","categoryOrder":5,"number":82,"question":"下列關於陰莖解剖構造敘述何者錯誤？","options":{"A":"Glans penis 沒有 Tunica albuginea","B":"Corpous spongiosum 的 major blood supply 為 dorsal artery","C":"Corpous spongiosum 在勃起時沒有 venous occlusion","D":"勃起時 Corpous spongiosum 會被 ischiocavernosus and bulbocavernosus 壓迫造成 engorgement","E":"勃起時 Corpous cavernosa 的壓力較 Corpous spongiosum 高"},"answer":"B","reference":"(112)/ 5.生理解剖/參考 資料(摘錄自)： Campbell 12ed, Chapter 68, Page 1489-1490, table 68.2 詳解： (B) 錯誤，Bulbar and spongiosal arteries (C) (D) (E) 正確","sourcePage":191},{"id":"5-083","category":"生理解剖","categoryOrder":5,"number":83,"question":"下列有關男性泌尿生殖系統之生理解剖敘述，何者錯誤？","options":{"A":"尿道的血液供應來自 internal pudendal artery，其 球狀尿道分支供應 urethra，corpus spongiosum 及 glans penis","B":"睪丸的動脈血液供應共有三套，分別為 internal spermatic artery，deferential artery 以及 cremasteric artery，其中以 internal spermatic artery 為最主要血液供應來源","C":"陰囊前壁的血液供應來自 external pudendal arteries，動脈走向平行於陰囊皺摺且跨越陰囊中縫， 可同時提供對側陰囊養分","D":"儲精囊的靜脈血液回流主要是經由 vesiculodeferential veins 及 inferior vesical plexus，最終匯入 pelvic venous plexus","E":"攝護腺最主要的動脈血液供應來自於 inferior vesical artery"},"answer":"C","reference":"(112)/5.生理解剖/參考 資料(摘錄自)： Campbell 12th chapter 63, page 1370, 1378, 1380, 1384, 1387 詳解： C 選項錯誤 (Page 1387 Artery supple 部分)，動 脈供應不會跨越陰囊中縫","sourcePage":191},{"id":"5-084","category":"生理解剖","categoryOrder":5,"number":84,"question":"下列有關男性陰莖功能之生理解剖敘述，何者錯誤？","options":{"A":"男性勃起與消退總共分為七個時期，其中以 rigid erection phase 時的 pudendal arterial flow 最低， 且 intracorporeal pressure 達到最高","B":"大腦前腦的 pyriform cortex 抑制 sexual drive，此 區域受損的病患會有 hypersexuality 的表現","C":"細胞內高鈣離子狀態會促使鈣離子結合 calmodulin 進 而活化 MLC kinase，使得海綿體平滑肌保持收縮狀態","D":"神經傳導物質 Dopamine 藉由結合在 D2 及 D4 受器促進 勃起反應發生","E":"陰莖血流的供應主要來自於 internal iliac artery 的分支 internal pudendal artery，進入陰莖後又再 分為 cavernous，dorsal 和 bulbourethral artery"},"answer":"D","reference":"(112)/5.生理解剖/參考 資料(摘錄自)： Campbell 12th chapter 68, page 1487, 1489, 1491, 1495, 1501 詳解： D 選項錯誤 (Page 1495， Table 68.7)，應是 D1 及 D4","sourcePage":192},{"id":"5-085","category":"生理解剖","categoryOrder":5,"number":85,"question":"下列有關攝護腺的生理解剖敘述，下列選項何者有誤？","options":{"A":"儲精囊，輸精管，副睪及射精管在胚胎時期經由 fetal testosterone 刺激 wolffian ducts 發育而來","B":"Prostate glands 由 epithelial cells，extracellular matrix 及 stromal cells 組成。PSA 即是由 columnar secretory epithelial cells 所分泌","C":"DHT，testosterone 及 estrogen 共同調控攝護腺生長 及分化，free testosterone 可轉為 estrogen，此生化 反應為不可逆反應","D":"Human kallikrein 11 具有 serine protease 活性，除 了會在攝護腺表現此蛋白以外，乳房及卵巢也會分泌此 蛋白","E":"Testosterone 進入攝護腺後，經由 5-alpha reductase 轉為 DHT，隨後部分 DHT 在攝護腺不可逆地轉為 3-alpha 及 3-beta diol"},"answer":"E","reference":"(112)/5.生理解剖/參考 資料(摘錄自)： Campbell 12th chapter 143, page 3277, 3278, 3284, 3286, 3298 詳解： Ｅ選項錯誤 (Page 3286 圖 143.8)，應是可逆反應","sourcePage":192},{"id":"5-086","category":"生理解剖","categoryOrder":5,"number":86,"question":"下列有關膀胱尿道之生理解剖敘述，下列選項何者有誤？","options":{"A":"結締組織的增加會影響膀胱的順應性，尤其是 type III collagen 的表現量增加，會大幅降低膀胱順應性","B":"Uroplakin 和 tight junction 蛋白是尿路上皮屏障的 重要成分。Type I piliated uropathogenic E.coli 藉由附著於 tight junction 蛋白進而侵犯尿路上皮","C":"副交感神經末端釋出神經傳導物質乙醯膽鹼刺激膀胱 毒蕈鹼受器，使得鈣離子經由離子通道進入細胞，進而 引發逼尿肌收縮","D":"橫紋肌括約肌(Rhabdosphincter)由 fast-twitch 和 slow-twitch fibers 組成，無論男性或女性， fast-twitch fibers 的表現量都相對較低","E":"膀胱上皮會釋放一氧化氮，並且抑制膀胱神經傳入活性"},"answer":"B","reference":"(112)/5.生理解剖/參考 資料(摘錄自)： Campbell 12th chapter 110, page 2464, 2467, 2469, 2470, 2478 詳解： B 選項錯誤 (Page 2470 Key point)，應是附著於 Uroplakin","sourcePage":193},{"id":"5-087","category":"生理解剖","categoryOrder":5,"number":87,"question":"下列有關腎臟輸尿管之生理解剖敘述，何者錯誤？","options":{"A":"腎臟 hilar structure 由前至後分別為，renal vein，renal artery，renal pelvic 以及 posterior segmental artery","B":"輸尿管依照膀胱開口位置分為 caudo zone， normal zone 以及 cranio zone。開口位置位於 caudo zone 容易發生輸尿管阻塞","C":"腹腔內輸尿管靜脈回流至 renal 及 gonadal veins，中段及下段輸尿管則回流至 common and external iliac veins","D":"右側腎臟淋巴液主要回流至 right interaortocaval 及 right paracaval 淋巴 結，而左側主要回流至 left lateral para-aortic lymph nodes","E":"近端輸尿管血液供應主要來自輸尿管內側，中 段輸尿管來自後側，遠端輸尿管則是外側"},"answer":"C","reference":"(112)/5.生理解剖/參考 資料(摘錄自)： Campbell 12th chapter 84, page 1868, 1871, 1874, 1875, 詳解： C 選項錯誤 (Page 1874 右 半中間黑體字)，中下段輸 尿管應是回流至 common and internal iliac vein。","sourcePage":193},{"id":"5-088","category":"生理解剖","categoryOrder":5,"number":88,"question":"下列關於腎上腺的血管解剖構造及供應何者錯誤?","options":{"A":"動脈主要有三套供應,superior adrenal artery 通常 是由 inferior phrenic artery 分支供應;middle adrenal artery 是由 aorta 分支供應;inferior adrenal artery 是由同側的 renal artery 分支供應","B":"腎上腺髓質(adrenal medulla)是由 medullary arterioles 及 cortical sinusoid capillaries 兩套 血管供應","C":"Left adrenal vein 直接回流至 inferior vena cava; right adrenal vein 則需先回流至 right renal vein","D":"Capsular artery 只供應 adrenal capsule","E":"實行 adrenal vein sampling 時一般認為右側較難進 行, 原因是右側 adrenal vein 相對於左側,其管徑較 窄, 長度較短, 且進入的角度較大"},"answer":"C","reference":"(112)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 12th edition Ch 105 p.2345-2349 Ch 106 p.2371 (C)相反;left adrenal vein 需先回流至 left renal vein;而 right adrenal vein 直接回流至 IVC。","sourcePage":193},{"id":"5-089","category":"生理解剖","categoryOrder":5,"number":89,"question":"有關女性骨盆解剖構造敘述, 下列何者錯誤?","options":{"A":"Pubovesical ligaments 是相對應於男性的 puboprostatic ligaments, 皆由 pubic bone 延伸至膀 胱頸(bladder neck), 提供 retropubic suspension","B":"Levator ani muscle 由 iliococcygeus, puborectalis 及 pubococcygeus 等 muscles 構成,其神經由 third sacral nerve 支配","C":"Pudendal nerve 由 sacral plexus 之 S2-S4 支配, 因 會穿過 greater sciatic foramen, 因此是進行 sacrospinous ligament fixation 時容易傷害到的神 經","D":"Uterine artery 由 inferior iliac artery 的 anterior branch 所分支, 因會跨過 ureter, 所以 ureter 容易在 進行婦科子宮相關手術時被傷害","E":"骨盆的 Sympathetic innervation 是從 T10-T12 的 preganglionic fibers 分出並沿著 ovarian vessels 來支配卵巢及輸卵管"},"answer":"B","reference":"(112) /5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 12th edition Ch 108 p.2429-2434 (B) 應是由 fourth sacral nerve 支配。","sourcePage":194},{"id":"5-090","category":"生理解剖","categoryOrder":5,"number":90,"question":"下列關於睪丸的生理及解剖構造,何者敘述錯誤?","options":{"A":"供應睪丸的三套動脈中, 最主要的是 internal spermatic artery","B":"不論是 parietal 或 visceral layer of tunica vaginalis, 其感覺神經皆由 genitofemoral nerve 的 genital branch 支配","C":"血睪屏障(blood-testis barrier)由 Sertoli cells 中的 tight junction 構成, 並將 seminiferous tubule space 分成 basal 及 adluminal 等兩個 compartment","D":"睪固酮(testosterone)是由膽固醇(cholesterol)合 成, 而膽固醇藉由 steroidogenic acute regulatory (StAR) protein 及 peripheral benzodiazepine receptor (PBR) 等兩種運輸蛋白進入粒線體 (mitochondrion)","E":"Leydig cells 在人出生六個月過後會來到分化的第二 波高峰(second wave)並開始幫助腦下垂體 luteinizing hormone 的製造"},"answer":"E","reference":"(112)/ 5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 12th edition Ch 63 p.1370-1373 Ch 64 p.1394-1396 (E)second wave 發生在出 生第三個月。","sourcePage":194},{"id":"5-091","category":"生理解剖","categoryOrder":5,"number":91,"question":"下列有關攝護腺相關解剖構造敘述何者錯誤?","options":{"A":"深背靜脈(deep dorsal vein)離開陰莖進入到泌尿生殖 橫膈(urogenital diaphragm)後在攝護腺會分出三條 主要分支, 分別是 superficial branch 及左右兩側 lateral venous plexus","B":"下膀胱動脈(inferior vesical artery)除了供應攝護 腺, 同時也會供應儲精囊(seminal vesicle)以及膀胱 底(bladder base)","C":"攝護腺外覆蓋著三層 fascial layers, 分別是 Denonvilliers fascia, prostatic fascia 及 levator fascia","D":"攝護腺周圍的 neurovascular bundle (NVB of Walsh) 介在 Denonvilliers fascia 與 prostatic fascia 之間","E":"攝護腺的交感神經(sympathetic)由下腹神經 (hypogastric nerve)支配"},"answer":"D","reference":"(112) 5.生理解剖 Campbell-Walsh Urology 12th edition Ch 155 p.3548-3550 (D)應是介在 prostatic fascia 與 levator fascia 之間。","sourcePage":195},{"id":"5-092","category":"生理解剖","categoryOrder":5,"number":92,"question":"關於人體免疫反應的調控機制，以下敘述何者錯誤？","options":{"A":"B 細胞主要的功能是產生抗體並協助巨噬細胞進行吞 噬作用(phagocytose)","B":"IL-4, IL-5, IL-10, IL-13 是由第二型輔助性 T 細胞 (Th2 cell)所分泌","C":"對於非肌肉侵犯性膀胱癌(NMIBC)，BCG 所產生的免疫 治療作用包含嗜中性球和巨噬細胞的活化","D":"免疫檢查點分子(immune checkpoint molecules)是一 系列的細胞表面蛋白，當與特定的配體(ligand)結合 時，它們會減弱 CD8 T 細胞的效應功能","E":"免疫編輯理論(immunoediting hypothesis)的三階段 依序為清除期(elimination)、逃逸期(escape)、平衡 期(equilibrium)"},"answer":"E","reference":"(112)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh-Wein Urology, 12 ed. Chapter 61. P.1333-1345 (Immunoediting hypothesis: elimination、 equilibrium、escape)","sourcePage":195},{"id":"5-093","category":"生理解剖","categoryOrder":5,"number":93,"question":"關於輸尿管相關的生理解剖，以下敘述何者錯誤？","options":{"A":"中段輸尿管的血液供應主要來自後方的血管","B":"黃體素(progesterone)具有抑制輸尿管收縮的效果","C":"β agonist 具有使輸尿管平滑肌舒張的效果，環腺苷 酸(cAMP)作為第二信使(second messenger)參與此作 用","D":"環腺苷酸(cAMP)是由腺苷酸環化酶(adenylyl cyclase)所分解，環磷酸鳥苷(cGMP)由磷酸二酯酶 (phosphodiesterase)所分解","E":"一氧化氮(Nitric Oxide)可經由活化鳥苷酸環化酶 (guanylyl cyclase)進一步使平滑肌舒張"},"answer":"D","reference":"(112)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh-Wein Urology, 12 ed. Chapter 84, 85. P.1865-1904 (PDE degrade both cAMP and cGMP.)","sourcePage":195},{"id":"5-094","category":"生理解剖","categoryOrder":5,"number":94,"question":"2013 年諾貝爾生醫獎為細胞外囊泡(extracellular (11 vesicles)運輸調控機制的相關研究，2022 年中研院基因體 資料 研究中心團隊亦在 Nanoscale Horizons 期刊發表學術回顧 1. 論文，探討奈米材料與細胞外囊泡在生醫領域的應用，並獲 選為該期刊之 Inside front cover。以下有關細胞外囊泡 的敘述，何者為非？","options":{"A":"外泌體(exosome)是細胞外囊泡的一種，其脂質雙層膜 囊泡內會攜帶核酸、蛋白質、醣類、脂質等多種訊號因 子","B":"外泌體可作為治療藥物的載體，具有體積小、高通透 性、低免疫原(immunogenicity)等生理特性，但因高極 性(polarity)無法通過血腦障壁(blood-brain barrier)","C":"細胞外囊泡可經由細胞吞噬作用(phagocytosis)或微 囊泡吞噬作用(micropinocytosis)進入目標細胞內，也 可直接與細胞膜融合","D":"自尿液中所分離出的外泌體，其內含的蛋白質、RNA， 2. 可作為膀胱癌診斷、惡化、復發的生物標誌(biomarker)","E":"因目前仍欠缺標準化的分離程序，使得外泌體的臨床應 用尚不普及 (Ex has adv imm vas (3) of the"},"answer":"B","reference":"2)/5.生理解剖/參考 (摘錄自)： Chan, Ming-Hsien et al. “Integrated therapy platform of exosomal system: hybrid inorganic/organic nanoparticles with exosomes for cancer treatment.” Nanoscale horizons vol. 7,4 352-367. 28 Mar. 2022, doi:10.1039/d1nh006 37a Georgantzoglou, Natalia et al. “Extracellular Vesicles as Biomarkers Carriers in Bladder Cancer: Diagnosis, Surveillance, and Treatment.” International journal of molecular sciences vol. 22,5 2744. 9 Mar. 2021, doi:10.3390/ijms220 52744 osome-based therapy several significant antages: (1) low unogenicity; (2) no cular occlusion; and systemic injection exosomes can cross blood–brain barrier and enter the brain parenchyma.)","sourcePage":196},{"id":"5-095","category":"生理解剖","categoryOrder":5,"number":95,"question":"關於攝護腺的解剖構造， 下列何者錯誤?","options":{"A":"Seminal vesicle 的起源主要是 Wolffian duct 受到 testosterone 刺激而來","B":"攝護腺表皮細胞的 basal cell, 主要由未分化 的分泌細胞組成，會表現 keratin 5,14,18","C":"Columnar secretory cell 是不分裂的細胞， 富含酸性磷酸酶（Acid phosphatase）","D":"Neuroendocrine cell 是非增生細胞，會表現 chromogranin-A, PSA(prostate-specific antigen), 和 neuron-specific enolase","E":"Prostate zone 的大小， 以 peripheral zone 最大，central zone 次之， transitional zone 最小。 會發生 BPH 的主要在 transitional zone"},"answer":"D","reference":"(112)/ 5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 12th Edition, p3277 Table 143.1/ (D) Columnar secretory cell 富含酸性磷酸酶 Acid phosphatase 和 PSA, 而不 是 Neuroendocrine cell","sourcePage":197},{"id":"5-096","category":"生理解剖","categoryOrder":5,"number":96,"question":"關於腰骶神經叢(Lumbosacral Plexus)的分支下列敘述何 者正確","options":{"A":"肋下神經(Subcostal nerve)來自 L1 的腹側支 (Anterior ramus L1)，並支配髖部皮膚(skin over hip) 的感覺功能","B":"髂腹股溝神經(Ilioinguinal) 來自 L1 的腹側 支(Anterior ramus L1)，並支配腹外斜肌(External oblique)跟腹內斜肌(Internal oblique)的運動功能","C":"生殖股神經(Genitofemoral nerve) 來自 L1 及 L2 的腹側支(Anterior ramus L1, L2)並支配提睪肌 (cremasteric muscle)的運動功能","D":"若病人於手術後抱怨大腿(thigh)的外側麻，可 能是傷到股神經(Femoral nerve)","E":"若病人於手術後抱怨膝蓋無法伸直(knee extension)，可能是傷到閉孔神經(Obturator nerve)"},"answer":"C","reference":"(112)/ 5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 12th Edition, p1679 Table.75.4/ (A) T12; (B) Internal oblique & transversus abdominis; (D) Lateral cutaneous nerve of the thigh (E)femoral nerve","sourcePage":197},{"id":"5-097","category":"生理解剖","categoryOrder":5,"number":97,"question":"根據 Campbell 第 12 版，針對解剖構造異常的膀胱腸廔管 (Vesicoenteric Fistula)疾病， 下列何者症狀最不常見?","options":{"A":"發燒與畏寒(fever and chills)","B":"腹痛 (abdomen pain)","C":"血尿 (hematuria)","D":"氣尿 (pneumatruia)","E":"下泌尿道症狀(頻尿, 急尿) (Urinary tract infection symptoms; frequency, urgency)"},"answer":"C","reference":"(112)/ 5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh Urology 12th Edition, p.2953 table 129.4/ (A)41% ; (B) 25% ; (C) 5-22%; (D) 52-77% ; (E)44-45%","sourcePage":197},{"id":"5-098","category":"生理解剖","categoryOrder":5,"number":98,"question":"下列有關男性生殖器(male genitalia)的淋巴回流 (lymphatic drainage)相關敘述，下列何者為非？","options":{"A":"陰莖的淋巴回流走向，是由表淺腹股溝淋巴結 (superficial inguinal lymph nodes)，流向深層腹股 溝淋巴結(deep inguinal lymph nodes)，再流往骨盆 腔淋巴系統(pelvic lymphatic systems)","B":"包皮(prepuce)與陰莖繫帶(frenulum)的淋巴回流，主 要透過表淺淋巴系統(superficial lymphatic system)","C":"龜頭(glans)的淋巴回流，主要透過深層淋巴系統(deep lymphatic system)","D":"尿道(urethra)的淋巴回流，主要位在尿道的黏膜層 (mucosal layer)與黏膜下層(submucosa)。其中最緻密 的淋巴網路(lymphatic network)位在尿道舟狀窩 (fossa navicularis)的位置","E":"右側睪丸(testis)的淋巴回流主要流向主動脈下腔靜 脈間淋巴結(interaortocaval nodes)，部分流向右側 下腔靜脈旁淋巴結(right paracaval nodes)，與少部 分流向左側主動脈旁區域(left para-aortic region)"},"answer":"B","reference":"(112)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh-Wein Urology, 12e, 2021. p. 1674 and p. 1790 解題說明：陰莖繫帶的淋 巴回流主要透過深層淋巴 系統。","sourcePage":198},{"id":"5-099","category":"生理解剖","categoryOrder":5,"number":99,"question":"下列與下泌尿道功能(lower urinary tract function)有關 的神經反射迴路(reflex circuitry)敘述，何者為非?","options":{"A":"膀胱至外括約肌反射(bladder to external urethral sphincter reflex)指的是膀胱儲存尿液的感覺神經訊 號(afferent signal)會透過脊髓反射(spinal reflex)，刺激會陰神經的動作神經元(pudendal motoneurons)，導致尿道外括約肌收縮。此反射又被稱 作防衛反射(guarding reflex)","B":"膀胱交感神經反射(bladder sympathetic reflex)指的 是在尿液蓄積的過程中，會透過負回饋(negative feedback)，促進尿道出口的關閉並抑制膀胱收縮","C":"括約肌至膀胱反射(sphincter to bladder reflexes) 指的是，透過刺激會陰神經(pudendal nerve)的體感覺 傳入路徑(somatic afferent pathway)，可以抑制排尿 功能","D":"尿道至膀胱反射(urethral to bladder reflexes)指的 是，透過尿道的物理性刺激(mechanical stimulation) 可以誘發膀胱反射性收縮(reflexive bladder contraction)","E":"尿道至膀胱反射可以分為兩的部分，一部分是透過刺激 骨盆神經(pelvic nerve)的臟器感覺傳入路徑 (visceral afferent pathway)，對橋腦排尿中心 (pontine micturition center)產生促進排尿的作用。 另一部分則是透過刺激會陰神經的體感覺傳入路徑與 脊髓反射來促進排尿"},"answer":"E","reference":"(112)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh-Wein Urology, 12e, 2021. pp. 2489-2492 解題說明：一部分透過刺 激會陰神經的體感覺傳入 路徑對橋腦排尿中心產生 促進排尿；另一部分透過 刺激骨盆神經的臟器感覺 傳入路徑與脊髓反射來促 進排尿。","sourcePage":198},{"id":"5-100","category":"生理解剖","categoryOrder":5,"number":100,"question":"下列有關尿道外括約肌(external urethral sphincter)的 敘述,，何者為非?","options":{"A":"橫紋括約肌(rhabdosphincter)是一種出現在尿道壁 (wall of urethra)上的骨骼肌(skeletal muscle)，這 種骨骼肌細胞的尺寸比起一般的骨骼肌細胞來的大","B":"男性的外括約肌(external urethral sphincter)由精 埠(verumontanum)的近端(proximal)開始，以新月形 (crescent shape)包覆在攝護腺(prostate)的腹側面 (ventral surface)，然後形成馬蹄形(horseshoe shape)包覆，最後再以新月形延伸到球狀尿道(bulbar urethra)結束","C":"在尿路動力學檢查(urodynamic study)的儲存期 (storage phase)，外括約肌肌電圖的背景活動值(the background electromyographic activity)是由橫紋括 約肌的慢縮肌(slow-twitch fibers)所產生","D":"目前認為骨盆底肌訓練(pelvic floor exercise)或電 刺激(electrostimulation)之所以能有效治療應力性 尿失禁(stress incontinence)，是因為將尿道的橫紋 肌纖維(striated muscle fibers)組成由快縮肌 (fast-twitch fibers)轉化為慢縮肌","E":"除了橫紋括約肌之外，尿道外括約肌的組成也包含了平 滑肌(smooth muscle)。這些平滑肌可以接受正腎上腺 素的調控(noradrenergic innervation)"},"answer":"A","reference":"(112)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh-Wein Urology, 12e, 2021. pp. 2465-2467 解題說明：橫紋括約肌細 胞的尺寸比起一般的骨骼 肌細胞來的小。","sourcePage":199},{"id":"5-101","category":"生理解剖","categoryOrder":5,"number":101,"question":"下列有關下泌尿道功能(lower urinary tract function) 的藥理機轉描述，何者正確？","options":{"A":"Trospium 是一個四級胺化合物(quaternary amine compound)，本身帶負電(negatively-charged)，理論 上不容易通過血腦障壁(blood-brain barrier)，因此 較不用擔心其對患者之認知功能(cognitive function)影響","B":"Solifenacin、Tolterodine 與 Trospium 在體內都是透 過細胞色素 P450 酵素系統(cytochrome P450 enzyme system)在肝臟進行代謝，需特別注意與其他藥物之交 互作用","C":"Darifenacin 與 Trospium 都屬於 P-醣蛋白藥物運送蛋 白(P-glycoprotein drug transporter)的受質 (substrate)。即使通過血腦障壁，也能透過主動運輸 (active transport)離開中樞神經系統","D":"Oxybutynin 對於毒蕈鹼接受器(muscarinic receptor) 的不同亞型(subtypes)不具備任何選擇性 (selectivity)，因此較容易產生副作用","E":"Flavoxate 與 Oxybutynin 在體內都具備有多種藥理機 轉，除了主要的抗毒蕈鹼作用(antimuscarinic effect)之外，他們還有平滑肌鬆弛劑(smooth muscle relaxant)的作用"},"answer":"C","reference":"(112)/5.生理解剖/參考 資料(摘錄自)： Campbell-Walsh-Wein Urology, 12e, 2021. pp. 2682-2696 解題說明： (A) Trospium 帶正電(B) Trospium 不透過 P450 代 謝路徑 (D) Oxybutynin 對於 M1 與 M3 受器有較高的選擇性 (E) Flavoxate 不具備抗 毒蕈鹼作用","sourcePage":199},{"id":"5-102","category":"生理解剖","categoryOrder":5,"number":102,"question":"「運動-感覺」假說(motor-sensory hypothesis)用於解釋 以下哪種治療的作用機制？","options":{"A":"利用膽鹼促效劑治療逼尿肌活動力不足(DU)","B":"利用 TRPVI 阻斷劑治療神經源性膀胱過度活動","C":"利用 onabotulinumtoxin A 治療特發性膀胱過度活動 (IDO)","D":"利用抗膽鹼藥治療尿急症狀","E":"利用 α-阻斷劑治療頻尿症狀"},"answer":"D","reference":"(112) /5.生理解剖/參考 資料(摘錄自)： Campbell Urology 12th ed. Chapter 110, p.2478","sourcePage":200},{"id":"5-103","category":"生理解剖","categoryOrder":5,"number":103,"question":"為了保護對輸尿管的血管供應，在腹膜上作切口的位置應該 是?","options":{"A":"腹部在輸尿管較內側而骨盆在較外側","B":"腹部在輸尿管較外側而骨盆在較內側","C":"總是在輸尿管的內側","D":"總是在輸尿管的外側","E":"直接在輸尿管上方"},"answer":"B","reference":"(112) /5.生理解剖/參考 資料(摘錄自)： Campbell Urology 12th ed. Chapter 109, p.2456","sourcePage":200},{"id":"5-104","category":"生理解剖","categoryOrder":5,"number":104,"question":"以下關於三角區（trigone）的敘述中，哪個是正確的？","options":{"A":"上皮比膀胱其他部分更厚且緊密貼合","B":"淺層平滑肌是瓦爾代爾（Waldeyer）鞘的延續","C":"由平滑肌擴大形成的厚肌束","D":"輸尿管的平滑肌形成輸尿管間脊（Mercier bar）","E":"膀胱排空時，三角區會產生厚褶皺"},"answer":"D","reference":"(112) /5.生理解剖/參考 資料(摘錄自)： Campbell Urology 12th ed. Chapter 109, p.2455-2456","sourcePage":200},{"id":"5-105","category":"生理解剖","categoryOrder":5,"number":105,"question":"請問下列哪一項關於女生泌尿生理構造的敘述是錯誤的？","options":{"A":"Cardinal ligament 與 uterosacral ligament，共同維 持子宮、子宮頸與上段陰道的穩定","B":"Pubovesical ligament 近似於男性 puboprostatic ligament，可提供恥骨後方支撐，在排尿時也有放鬆膀胱 頸作用","C":"Sacrospinous ligament colposuspension 時，因爲後方 就是坐骨大孔，要小心sacral plexus injury","D":"Ovarian artery 因會跨過輸尿管，輸尿管容易在進行 婦科子宮相關手術時被傷到","E":"Levator ani muscle 由 iliococcygeus, puborectalis, pubococcygeus 等 muscle 構成"},"answer":"D","reference":"(113) Campbell 12ed, Ch108 p.2430- p.2438 uterine artery","sourcePage":200},{"id":"5-106","category":"生理解剖","categoryOrder":5,"number":106,"question":"有關各式藥物作用在膀胱與尿道的生理機轉，以下敘述何者 (1 有誤？ Ca Ur","options":{"A":"Calcium antagonists 藉由減少動作電位期間鈣離子的 11 進入，來減少膀胱收縮的幅度 P.","B":"Prostaglandin synthesis inhibitors 能夠在減少平 C: 滑肌張力的同時促使膀胱放鬆 no","C":"Tricyclic antidepressants 具有抗膽鹼功能，能直接 收 導致平滑肌的放鬆，同時增加 norepinephrine 的再吸 收","D":"Estrogen 可以增加尿路上皮黏膜的厚度，減少尿失禁 的發生率；同時增加尿道的 adrenergic effect","E":"Afferent nerve inhibitors 可減少膀胱感覺神經的傳 入，進而增加膀胱容量與減少逼尿肌過動的發生"},"answer":"C","reference":"13) mpbell-Walsh ology 12th ed. Chapter 0 2499, table110.4 會抑制 repinephrine 的再吸 。","sourcePage":201},{"id":"5-107","category":"生理解剖","categoryOrder":5,"number":107,"question":"關於睪丸血液循環的描述，以下何者不正確? (1","options":{"A":"有三條動脈供應睪丸血流 Ur","B":"睪丸動脈(testicular artery)直接來自主動脈 (aorta)","C":"輸精管動脈(deferens artery)直接來自總髂動脈 (common iliac artery)","D":"提睪肌動脈(cremasteric artery)即外精索動脈 (external spermatic artery)來自外髂動脈(external iliac artery)","E":"副睪的血液供應有上副睪動脈及下副睪動脈(superior and inferior epididymal arteries)進行輸精管重接 手術，必要時上副睪動脈可以犧牲"},"answer":"C","reference":"13)/Campbell's ology 12 版,Chapter 83","sourcePage":201},{"id":"5-108","category":"生理解剖","categoryOrder":5,"number":108,"question":"關於新生兒及嬰幼兒腎臟功能之描述何者為正確? (1","options":{"A":"在妊娠末期胎兒血清中之 renin, angiotensin II, and 1. angiotensin-converting enzyme (ACE) 濃度會降低， 2. 在出生後才會上升至與成人相同程度 3.","B":"胎兒和新生兒之腎絲球濾過率 Glomerular filtration 4. rate (GFR) 通較成人為高","C":"新生兒腎臟對於鉀離子排出能力較弱， 因此新生兒比 起幼兒有較高之血清鉀離子","D":"新生兒血清中之重碳酸鹽 (bicarbonate) 較成人為高","E":"新生兒出生時血清中鈣離子比起成人為低"},"answer":"C","reference":"13)解題說明請註明 Campbell 12Th edition Chapter 21 341-342","sourcePage":201},{"id":"5-109","category":"生理解剖","categoryOrder":5,"number":109,"question":"關於腎臟腫瘤的敘述,以下何者為非?","options":{"A":"Clear cell RCC (ccRCC)是一種 hypervascular 的腎臟腫瘤,起源於近曲小管(proximal tubule)","B":"Type 1 papillary RCC 是一種 hypovascular 癌細胞,其癌細胞起源於近曲小管,細胞遺傳染色可以 觀察到第 7 和 17 號三倍數染色體(trisomy)和 Y 染色體 缺失","C":"Type 2 Papillary RCC 其癌細胞是 basophilic cell with high-grade nuclei,預後比 type 1 papillary RCC 還差","D":"Chromophobe RCC 起源於 intercalated cells of collecting duct,大量染色體 1,2,6,10,13,17 缺失 可在 86%的病人身上發現,預後通常較好","E":"Renal medullary carcinoma 和鐮刀形性狀 (sickle cell trait)有關,通常在年輕的非裔美 國人身上被診斷出來,預後很差,大部分在診斷 時已經局部晚期或者轉移至他處"},"answer":"C","reference":"(113)Campbell Walsh Wein Urology, 12th Edition, Chapter 97, P2149, P2159, P2154","sourcePage":202},{"id":"5-110","category":"生理解剖","categoryOrder":5,"number":110,"question":"泌乳激素(prolactin)對於男性的生理之影響作用何者為 誤?","options":{"A":"可增加 Sertoli 細胞上黃體激素(LH) 受體的濃度","B":"可增強雄性素( androgen)對男性副性腺(accessary sex gland) 分泌的影響","C":"正常的血清泌乳激素濃度對於維持性慾是重要的","D":"泌乳激素低不一定是病理狀況","E":"高泌乳激素血症(hyperprolatinemia) 藉由干擾 GnRH 之釋放因而降低促性腺激素的脈動( gonadotropin pulsatility)"},"answer":"A","reference":"(113)解題說明請註明 1. Campbell 2. 12Th edition 3. Chapter 64 1391","sourcePage":202},{"id":"5-111","category":"生理解剖","categoryOrder":5,"number":111,"question":"以下描述關於男性勃起生理機轉何者正確?","options":{"A":"尿道海綿體(corpus spongiosum)及陰莖頭(glans penis)在勃起時皆沒有靜脈的阻塞(venous occlusion)","B":"勃起狀態下，尿道海綿體的壓力會達陰莖海綿體 (corpora cavernosa)的 2 至 3 倍高。","C":"刺激骨盆神經叢（pelvic plexus）與陰莖海綿體神經 （cavernous nerves）可讓勃起消退(detumescence)","D":"由非腎上腺能、非膽鹼能神經（NANC nerves）中的神 經型一氧化氮合酶（nNOS）產生的一氧化氮，負責啟動 海綿體平滑肌的鬆弛作用；上皮型的一氧化氮合酶 (eNOS)則是會讓平滑肌收縮","E":"在中樞神經系統中，血清素（5-HT）的作用會刺激引起 性慾與勃起功能"},"answer":"A","reference":"(114) 參考資料(摘錄 自)：Campbell Urology 12 版, Chapter 68, Page1489-1494 詳解: (B) pressure in the corpus spongiosum and glans is only one-third to one-half of pressure within the corpora cavernosa (C) induces erection. (D) eNOS is thought to drive maintenance of smooth muscle relaxation and penile erection. (E) The peristalsis of the ureter originates from pacemakers in the minor calyces.","sourcePage":202},{"id":"5-112","category":"生理解剖","categoryOrder":5,"number":112,"question":"關於前列腺及尿道解剖構造之描述，下列何者錯誤？","options":{"A":"前列腺尖部（prostate apex）並無真正的前列腺包膜 （prostatic capsule）","B":"前列腺底部（prostate base）並無真正的前列腺包膜 （prostatic capsule）","C":"陰莖海綿體神經（cavernosal nerves）行經前列腺外 側筋膜（lateral prostatic fascia）內，位於前列腺 的後外側","D":"所有前列腺腺體的開口皆位於尿道角（urethral angle）過後的前列腺尿道中","E":"前列腺小囊（prostatic utricle）是由沃氏管 （Wolffian duct）遺留下來的結構"},"answer":"E","reference":"(114)Campbell Walsh Wein Urology, 12th Edition, Chapter 63, P1378-1382","sourcePage":203},{"id":"5-113","category":"生理解剖","categoryOrder":5,"number":113,"question":"以下物質何者不是以正回饋(Positive feedback)方式影響 下視丘(Hypothalamus)釋放促性腺素釋放 激素(Gonadotropin-Releasing Hormone)？","options":{"A":"Leptin","B":"PGE2","C":"Insulin","D":"Kisspeptin","E":"ß-Endorphin"},"answer":"E","reference":"(114)/Campbell 12ed, Chapter 64, Male Reproductive physiology, p.1391, Table 64.1","sourcePage":203},{"id":"5-114","category":"生理解剖","categoryOrder":5,"number":114,"question":"關於睾丸的解剖結構，下列敘述何者為錯誤？","options":{"A":"每顆睪丸的大小約為 4 × 3 × 2.5 公分。睪丸的上極有 一個小的柄狀或無柄的構造，稱為睪丸附屬體 （appendix testis）","B":"供應睪丸的動脈（internal spermatics arteries）源 自腹主動脈（abdominal aorta），起點位於腎動脈下 方，經過精索到達睪丸，並與來自髂下動脈 （hypogastric artery）的輸精管動脈產生吻合","C":"睪丸每個小葉（lobule）內包含 1 到 4 條高度彎曲的曲 細精管（seminiferous tubules），每條長約 60 公分， 匯集於睪丸中隔，接續連接至輸精小管（efferent ducts），再排入附睪","D":"曲細精管具有基底膜，內含結締組織及彈性纖維。此基 底膜支撐兩種細胞：1.支持細胞（Sertoli cells），2. 生殖細胞（spermatogenic cells）","E":"左側精索靜脈直接回流入下腔靜脈（inferior vena cava），而右側精索靜脈回流至腎靜脈（ renal vein）"},"answer":"E","reference":"(114)解題說明請註明 1. Smith’s General Urology 2. 18ed Ch 1, p14","sourcePage":203},{"id":"5-115","category":"生理解剖","categoryOrder":5,"number":115,"question":"下列關於睪丸整體解剖構造的敘述，何者錯誤？","options":{"A":"睪丸內部由白膜 (tunica albuginea) 向內凹 陷形成的睪丸縱膈 (mediastinum testis) 形成隔板， 將睪丸分隔成約 200-300 個小葉 (lobules)","B":"負責製造睪固酮 (testosterone) 的萊氏細胞 (Leydig cells) 位於曲細精管 (seminiferous tubules) 內","C":"曲細精管中的支持細胞—賽托利細胞 (Sertoli cells) 之間有緊密連結 (tight junctions)，構成血睪屏障 (blood-testis barrier) 的解剖基礎","D":"睪丸的淋巴系統主要向上經由精索，引流至腹 部的主動脈旁 (para-aortic) 及腔靜脈間 (interaortocaval) 的淋巴結","E":"睪丸本身沒有體性神經 (somatic innervation) 支配，其神經主要為來自腎臟及 主動脈神經叢的自律神經 (autonomic innervation)"},"answer":"B","reference":"","sourcePage":204},{"id":"5-116","category":"生理解剖","categoryOrder":5,"number":116,"question":"關於逼尿肌平滑肌收縮的過程，下列哪些步驟是正確的？ 1.鈣離子（Ca²⁺ ）與 Calmodulin（CaM）結合並使其活化 2.活化後的 CaM 會活化肌球蛋白輕鏈激酶（myosin light chain kinase） 3.激酶催化 adenosine triphosphate（ATP）轉移磷酸到肌 球蛋白，使肌球蛋白能與 thin filaments 的肌動蛋白 （actin）結合 4.當細胞內鈣離子濃度下降時，平滑肌會放鬆","options":{"A":"1+4","B":"1+2+4","C":"1+3+4","D":"3+4","E":"1+2+3+4 題號 答案 考 題"},"answer":"E","reference":"(114)Campbell Walsh Wein Urology, 12th E dition, Chapter 110, P2470-2472 年度 類別 參考資料","sourcePage":204},{"id":"6-001","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":1,"question":"下列針對尿路動力學檢查的敘述何者正確？","options":{"A":"尿道壓力圖(urethral pressure profile, UPP) 能診斷應力性尿失禁","B":"錄影尿路動力學檢查(Video-urodynamic study, VUDS)能區別「逼尿肌尿道外括約肌共濟失調 (detrusor external sphincter dyssynergia, DESD)」及假性共濟失調(pseudo-DESD)","C":"壓力尿流檢查(pressure flow study)無法診斷合 併逼尿肌收縮力低下及良性前列腺阻塞 (coexisting detrusor underactivity and benign prostatic obstruction)病患之膀胱出口 阻塞","D":"女性膀胱出口阻塞(female bladder outlet obstruction)有國際認可之診斷標準","E":"根據尿流速圖形能診斷病患有膀胱出口阻塞 (bladder outlet obstruction, BOO)"},"answer":"C","reference":"(110)/6 排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Chapter 114, Campbell-Walsh-Wein Urology,12th edition, 2021","sourcePage":206},{"id":"6-002","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":2,"question":"男性尿失禁的常見原因可以縮寫成 DIAPPERS，下列何 者並非其中之一？","options":{"A":"Delirium","B":"Atrophic urethritis","C":"Psychiatric illness","D":"Performance status","E":"Stool impaction"},"answer":"D","reference":"(110)/6 排尿功能障礙&女性 泌尿/參考資料(摘錄自)：12th ed. Campbell, p.2539","sourcePage":206},{"id":"6-003","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":3,"question":"括約肌構造在男女控制禁尿機制中扮演重要的角色， 以下對於 sphincteric mechanisms 敘述，何者有誤?","options":{"A":"在男性的內括約肌(internal sphincter)因為有 包括攝護腺(prostate gland)，所以強度比女性 的內括約肌強","B":"男性的外括約肌中，橫紋括約肌 (rhabdosphincter)是屬於 type I (fast-twitch)的骨骼肌，可以在膀胱儲尿期時維 持尿道的關閉","C":"控制外括約肌的神經主要由陰部神經(pudendal nerve)支配","D":"女性尿道上的黏膜(urethral mucosa)也有維持 禁尿的功能","E":"陰道前壁(anterior vaginal wall)提供女性中段 尿道(mid-urethra)後面堅固的支撐"},"answer":"B","reference":"(110) /6 排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Wash 12th edition, Chapter 115 p.11813-11818","sourcePage":206},{"id":"6-004","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":4,"question":"關於骨盆腔臟器脫垂的手術治療，以下何者為非？","options":{"A":"對於手術前沒有應力性尿失禁(stress urinary incontinence)的婦女而言，進行陰道薦骨固定術 (sacrocolpopexy)的時候若合併 Burch 陰道懸吊 手術(Burch colposuspension)能夠降低術後發 生應力性尿失禁的機率","B":"根據 Cochrane review，針對前腔室(anterior compartment)脫垂的患者，使用聚丙烯 (polypropylene)網膜修補比起只用患者自身組 織做修補有較低的脫垂再發機率","C":"子宮薦棘韌帶固定術(Sacrospinous ligament fixation)由於改變了子宮的角度結果增加了後 腔室(posterior compartment)脫垂復發的機率","D":"對於剖腹陰道薦骨固定術(Abdominal sacrocolpopexy)而言，曾接受過全子宮切除 (total hysterectomy)的婦女比接受子宮頸上子 宮切除(supracervical hysterectomy)的婦女有 更高的陰道網膜暴露機率","E":"對於有家族性癌症病史，或帶有 BRCA1/BRCA2 基 因突變者，做子宮脫垂手術時，應將子宮一併切 除"},"answer":"C","reference":"(110)/6 排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12th edition Chap112, p2536 Chap124, p2785, p2794, p2804, p2816","sourcePage":207},{"id":"6-005","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":5,"question":"關於膀胱儲尿時禁尿(urinary continence)機制的神 經調控，下列何者錯誤?","options":{"A":"脊髓反射經由 delta 髓鞘神經傳入膀胱","B":"交感神經促進膀胱頸關閉，此機制於女性較男性 強烈","C":"橋腦上中樞藉由抑制副交感來抑制膀胱收縮","D":"位於薦椎的 Onuf nucleus 經由 pudendal nerve 活化外括約肌保持持續禁尿","E":"副交感調控經 pelvic nerve，交感調控經 hypogastric nerve"},"answer":"B","reference":"(110)/6 排尿功能障礙&女性 泌尿/參考資料(摘錄自)：12th ed. Campbell, p.2593","sourcePage":207},{"id":"6-006","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":6,"question":"關於女性產生尿失禁的危險因子，何者敘述錯誤？","options":{"A":"隨著女性年齡的上升，不同尿失禁的種類從以 SUI 居多，慢慢轉變成以 MUI 或是 UUI 為多","B":"懷孕過程中，有多達 40%的孕婦有 SUI 相關的症 狀且有 50%的孕婦表達對 QoL 有顯著的影響","C":"懷孕及生產會顯著地提高女性終其一生發生尿失 禁的風險，研究指出其 Odd Ratio 可達 1.5 左右， 其中又以 SUI 的症狀為主","D":"據統計，肥胖對尿失禁也會有顯著的影響，當 BMI 超過 25 以上時，其女性產生尿失禁的風險相較於 體重正常女性可達 3 倍以上","E":"其他也有許多因素被指出與女性的尿失禁相關， 包括抽煙、飲食、糖尿病甚至是憂鬱症都有可能"},"answer":"D","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Wein, A. (2016). Campbell-Walsh Urology. 11th ed. Philadelphia: Elsevier Saunders, Chapter 74. P1747-1749.","sourcePage":207},{"id":"6-007","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":7,"question":"下列針對巴金森疾病(Parkinson disease, PD)及多重 系統萎縮(Multiple system atrophy, MSA)的敘述何 者正確？","options":{"A":"PD 病患容易產生逼尿肌尿道外括約肌共濟失調 (detrusor external sphincter dyssynergia, DESD)","B":"PD 男性病患是經尿道前列腺切除術(TUR-P)的禁 忌症","C":"MSA 男性病患做 TUR-P 能獲得下尿路症狀緩解","D":"MSA 病患做錄影尿路動力學檢查 (Video-urodynamic study)常發現有膀胱頸閉鎖 不全(open bladder neck)","E":"MSA 病患不會產生勃起功能障礙(erectile dysfunction)"},"answer":"D","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Chapter 116, Campbell-Walsh-Wein Urology,12th edition, 2021","sourcePage":208},{"id":"6-008","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":8,"question":"下列針對脊柱裂合併脊髓膜膨出(spina bifida with myelomeningocele)病患的敘述何者錯誤？","options":{"A":"出生時馬上接受手術無法避免成年時產生下尿路 功能障礙 (lower urinary tract dysfunction, LUTD)","B":"病患常有乳膠過敏(latex allergy)","C":"進入青春期前容易產生扯髓症候群(tethered cord syndrome)","D":"成年病患若產生應力性尿失禁可考慮做關閉膀胱 頸及尿路改道手術(bladder neck closure and urinary diversion)","E":"成年病患若產生膀胱順應性差(poor bladder compliance)採用逼尿肌肉毒桿菌注射(detrusor Botox injection)療效不佳"},"answer":"C","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Chapter 116, Campbell-Walsh-Wein Urology,12th edition, 2021","sourcePage":208},{"id":"6-009","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":9,"question":"下列針對腹部漏尿壓(Abdominal LPP, ALPP)及逼尿肌 漏尿壓(Detrusor leak point pressure, DLPP)的敘 述何者錯誤？","options":{"A":"ALPP < 60 cmH20 之女性能診斷為內因性括約肌 缺損(intrinsic sphincter deficiency)","B":"男性膀胱順應性差(poor bladder compliance) 病患做完經尿道前列腺切除術 DLPP 會下降","C":"女性膀胱順應性差(poor bladder compliance) 病患做完中段尿道吊帶手術(mid-urethral sling procedure) DLPP 會上升","D":"女性膀胱順應性差(poor bladder compliance) 病患做完中段尿道吊帶手術(mid-urethral sling procedure) ALPP 會上升","E":"尿路動力學檢查時膀胱順應性同為 5 ml/cmH20 的兩位病患，「膀胱容量 100 ml 開始漏尿病患」 比起「膀胱容量 300 ml 開始漏尿病患」更容易產 生腎損傷"},"answer":"E","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Chapter 114, Campbell-Walsh-Wein Urology,12th edition, 2021","sourcePage":209},{"id":"6-010","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":10,"question":"有關夜尿症的敘述下列何者正確？","options":{"A":"男性病患服用低劑量犀利士每日錠能改善夜尿","B":"睡眠呼吸中止症造成夜尿是因抗利尿激素 (anti-diuretic hormone, ADH)分泌不足","C":"心臟衰竭病患造成夜尿是因心房利鈉胜肽 (atrial natriuretic peptide, ANP)分泌過多","D":"服用 Desmopressin 治療夜尿症需監控鉀離子濃 度","E":"肌酸酐清除率(Creatinine clearance) < 50 ml/min 病患不適合使用 Desmopressin 治療夜尿"},"answer":"E","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Chapter 119, Campbell-Walsh-Wein Urology,12th edition, 2021","sourcePage":209},{"id":"6-011","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":11,"question":"下列 6th International Consultation for Incontinence 針對攝護腺根除術後的尿失禁復健行 為治療(behavior therapy)的敍述,何者正確?","options":{"A":"Pelvic floor muscle training (PFMT)對長期尿 控的效果比早期尿控佳","B":"Biofeedback 應在機構執行,而非病患家中","C":"使用 digital rectal exam 有利患者定位訓練的 肌群,應列為標準步驟","D":"電刺激用於較晚期持續尿失禁沒效","E":"術前合併電刺激及 PFMT 對術後 early recovery 沒有幫助"},"answer":"D","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12th edition, pp12518","sourcePage":209},{"id":"6-012","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":12,"question":"下列有關急性尿滯留(Acute urinary retention, AUR)的敍述,何者錯誤?","options":{"A":"Initial Trial Without Catheter (TWOC)(3-8 天) 成功率約 60%","B":"Initial TWOC 失敗後,再試一次的成功率低於 3 成","C":"若成功 TWOC,則半年內 AUR 機會低於 6 成","D":"MTOS trial 中,Doxazosin group 無法有效減少 AUR 的發生率","E":"研究發現 Alfuzosin 可增加 TWOC 的成功率"},"answer":"C","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12th edition, pp15410","sourcePage":210},{"id":"6-013","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":13,"question":"下列有關女性骨盆疾病及尿失禁的敍述,何者正確?","options":{"A":"婦女接受停經後口服 estrogen 治療, 超過 2 年會 增加尿失禁風險","B":"局部塗抹 estrogen 得到的結果與口服類似","C":"肥胖與尿失禁的嚴重度有關,但減重無法改善漏 尿次數","D":"子宮切除可以減少後續脫垂的風險","E":"Pelvic floor muscle training 不影響產後脫垂 的發生"},"answer":"E","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12th edition, pp11803","sourcePage":210},{"id":"6-014","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":14,"question":"下列關於 sacral neuromodulation(SNM)與 onabotulinumtoxinA (BTX)對於治療女性 refractory Urgency urinary incontinence(UUI)的敍述,何 者有誤?","options":{"A":"24 個月的 UUI episodes, SNM 與 BTX 無差異","B":"6 個月的 UUI episodes 中, 完全改善(no UUI)的 病人, BTX 優於 SNM","C":"整體 quality of life 改善, SNM 與 BTX 無差異","D":"OAB 短表問卷治療滿意度, SNM 與 BTX 無差異","E":"經濟效益, BTX 優於 SNM"},"answer":"D","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)：Eur Urol. 2018 Jul;74(1):66-73. J Urol. 2020 May;203(5):969-977.","sourcePage":210},{"id":"6-015","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":15,"question":"骨盆腔器官脫垂 (Pelvic organ prolapse; POP)和尿 失禁(Urinary incontinence; UI)統稱為 Pelvic floor disorders (PFDs)，以下針對 PFDs 的描述，何 者有誤?","options":{"A":"約 40% 的 POP 病人同時合併有應力性尿失禁 stress urinary incontinence (SUI)的症狀","B":"POP 中最常出現的症狀是摸到陰道有膨出物，且 最常出現在 posterior compartment(後腔)","C":"懷孕和生產是 PFDs 的危險因子","D":"一般來說，症狀的嚴重程度和脫垂的嚴重程度沒 有很強的關係","E":"當計畫施行膀胱脫垂手術時，要高度懷疑合併有 陰道頂部脫垂(vaginal apical prolapse)，必須 考慮同時修補"},"answer":"B","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Wash 12th edition, Chapter 112 p.11564, 11798, 11780, 11799","sourcePage":210},{"id":"6-016","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":16,"question":"尿路動力學(UDS)和錄影式尿路動力學(VUDS)是診斷 下尿路功能障礙重要的檢查工具，以下描述何者有誤?","options":{"A":"一般而言，如果漏尿時腹部壓力(Abdominal leak point pressure; ALPP)測得大於 90 cmH2O，表 示括約肌內在缺損(Intrinsic sphincter deficiency; ISD)的機會比較小","B":"真正的逼尿肌-尿道外括約肌共濟失調 (detrusor-external sphincter dyssynergia; DESD)只會出現在神經病灶在 sacral micturition center 以上","C":"利用 UDS 算出來的 Bladder outlet obstruction index (BOOI)，可以準確診斷是否有女性膀胱出 口阻塞(female bladder outlet obstruction; BOO)","D":"可以利用 VUDS 診斷原發性膀胱頸阻塞(Primary bladder neck obstruction; PBNO)","E":"對於非複雜性應力性尿失禁 stress urinary incontinence (SUI)的病人，治療之前不用常規 安排 UDS/VUDS 檢查"},"answer":"C","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Wash 12th edition, Chapter 114 p.11683, 110703, 110705, 11708 EAU guideline, 2020 urinary incontinence in adults.","sourcePage":211},{"id":"6-017","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":17,"question":"以下有關下尿路障礙的治療，何者敘述正確?","options":{"A":"針對脊髓損傷病人的神經性逼尿肌過動症 (neurogenic detrusor overactivity)，不能將 肉毒桿菌注射於逼尿肌治療","B":"在人類的逼尿肌上存在有蕈毒類接受器 (Muscarinic receptors)。M 接受器是最重要負 2 責逼尿肌收縮的接受器","C":"對於男性中重度的下尿路症狀，只能選擇手術治 療","D":"使用抗毒蕈鹼藥物(antimuscarinic therapy)治 療膀胱過動症(overactive bladder)的病人持續 性通常很差，主要停藥原因是效果不夠和藥物造 成的副作用，例如口乾、便祕、視力模糊等","E":"沒有口服藥物可以治療應力性尿失禁(Stress incontinence)"},"answer":"D","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)：EAU guideline, 2020 Neuro-urology Management of Non-Neurogenic Male Lower Urinary Tract Symptoms Incontinence in adults Campbell-Wash 12th edition, Chapter 120","sourcePage":211},{"id":"6-018","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":18,"question":"下列有關女性應力性尿失禁(Stress urinary incontinence)病生理學的相關敘述,何者錯誤?","options":{"A":"壓力傳導理論(the pressure transmission theory)提出由於骨盆支持力受損，膀胱頸和近端 尿道過度移動，使得腹壓無法有效傳達，造成尿 失禁","B":"吊床理論(Hammock hypothesis)認為尿失禁是因 為尿道後方和側面的支撐層鬆弛缺損，因此腹壓 升高時無法有效地阻擋尿液流出","C":"完整理論論(integral theory)強調恥骨尿道韌 帶(pubo-urethral ligament, PUL)支撐了遠端尿 道，若韌帶發生缺損或減弱將會造成尿失禁","D":"內括約肌缺損（Intrinsic sphincter deficiency）的定義為在腹壓增加時，尿道內括 約肌無法收縮且無法產生足夠的阻力，而導致應 力性尿失禁的產生","E":"內括約肌缺損最常見的成因包含了多次尿失禁手 術、先前接受過骨盆腔手術、生殖泌尿道萎縮等"},"answer":"C","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition, p.2596-2597","sourcePage":212},{"id":"6-019","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":19,"question":"下列有關 Fowlers syndrome 的相關敘述,何者為是?","options":{"A":"突發性的尿滯留伴隨強烈急尿感和下腹疼痛","B":"好發生於中年女性，和多囊性卵巢有關","C":"可能合併其他神經學症狀一起出現","D":"括約肌針極肌電圖檢查(needle EMG)會出現複雜 重覆放電波(complex repetitive discharge)和 減速突波(decelerating bursts)","E":"治療方式為補充黃體素"},"answer":"D","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition, p.2629","sourcePage":212},{"id":"6-020","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":20,"question":"下列導致抗利尿激素(antidiuretic hormone)減少的 原因，何者為非?","options":{"A":"高血鈣","B":"心房利鈉肽(atrial natriuretic peptide)","C":"鋰鹽(lithium)","D":"高血鉀","E":"前列腺素 E2 (prostaglandin E2)"},"answer":"D","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition, p.2668","sourcePage":212},{"id":"6-021","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":21,"question":"在做尿路動力學檢查時, 下列危險因子暗示病人可能 會有上泌尿道代償不良(Upper tract decompensation), 下列何者為非?","options":{"A":"膀胱順應性低(Impaired compliance)","B":"腹部漏尿壓力上升(Elevated abdominal leak point pressure)","C":"逼尿肌-尿道外括約肌共濟失調(Detrusor external sphincter dyssynergia)","D":"逼尿肌過動伴隨膀胱高壓(High-pressure detrusor overactivity present throughout filling)","E":"解尿解不乾淨伴隨膀胱高壓(Poor emptying with high storage pressure)"},"answer":"B","reference":"(110) / Campbell-Walsh Urology 12th edition, p.2612-2613","sourcePage":213},{"id":"6-022","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":22,"question":"關於尿道的敘述，下列何者為非？","options":{"A":"人類的尿道，內層是縱向肌肉，外層環狀排列肌 肉","B":"慢肌纖維(slow-twitch fibers)的功能是在膀胱 灌注時於維持尿道擴約肌的張力，負責被動的常 態性禁尿","C":"快肌纖維(fast-twitch fibers)的功能是在腹內 壓突然增加時，用力收縮來保持尿道關閉","D":"慢肌為不隨意肌，快肌為隨意肌","E":"慢肌纖維除以快肌纖維的比值，女性比男性高"},"answer":"D","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh Urology 12th edition, p.2594","sourcePage":213},{"id":"6-023","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":23,"question":"針對前幾線治療無效的過動性膀胱(overactive bladder)，膀胱擴大術(bladder augmentation)是可 以考慮的後線治療。關於膀胱擴大術，下列敘述何者 為是？","options":{"A":"膀胱擴大術可透過傳統開腹(open)及機器人輔助 (robotic)方式進行；而機器人輔助可以減少整體 開刀時間(operative time)","B":"使用大腸(large bowel)進行膀胱擴大術相較小 腸(small bowel)，有黏液分泌較多(mucus production)以及較高惡性腫瘤發生風險 (malignancy risk)的問題","C":"膀胱擴大術術後最常見的長期併發症(long-term complications)是無症狀的泌尿道感染，其次為 代謝失調(metabolic disturbance)","D":"和病因不明膀胱過動症(idiopathic DO)相比，神 經性膀胱過動症(neurogenic DO)接受膀胱擴大 術後的整體禁尿比率(overall continence rate) 比較低","E":"由於膀胱擴大術能改善病患的生活品質(quality of life)以及禁尿比率(continence rate)，近年 來接受膀胱擴大術的案例有緩步增加的趨勢"},"answer":"B","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： A. EAU guidelines on non-neurogenic Female LUTS, 2021 B. Campbell 12ed. Ch127, Pg 2890 C. EAU guidelines on non-neurogenic Female LUTS , 2021, Pg 34, D. Campbell 12ed. Ch127, Pg 2890 E. Campbell 12ed. Ch127, Pg 2889","sourcePage":213},{"id":"6-024","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":24,"question":"有關排尿障礙的治療，下列關於神經調節 (neuromodulation)的敘述，何者正確？","options":{"A":"薦神經調節(sacral neuromodulation, SNM)在治 療病因不明膀胱過動症(idiopathic OAB)上有相 當的成效，但並沒有得到美國 FDA 的許可，屬於 off-label use","B":"經皮脛神經刺激(percutaneous tibial nerve stimulation, PTNS)有微創、便宜、省時的優點","C":"薦神經調節(SNM)用於治療神經性膀胱 (neurogenic bladder)已被普遍接受，已有證據 力足夠的大型研究證實其療效","D":"針對有急迫性尿失禁(UUI)的婦女，經皮脛神經刺 激(PTNS)的治療效果較 tolterodine 更好","E":"薦神經調節(SNM)在非阻塞性膀胱功能低下 (non-obstructive UAB)的治療有得到美國 FDA 的許可，是標準治療的選擇之一"},"answer":"E","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： A. Campbell 12ed., Ch122, Pg 2755, B. Campbell 12ed., Ch122, Pg 2751, C. Campbell 12ed., Ch122, Pg 2753, D. Campbell 12ed., Ch122, Pg 2750, E. Campbell 12ed., Ch122, Pg 2755","sourcePage":214},{"id":"6-025","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":25,"question":"關於間質性膀胱炎/膀胱疼痛症候群(IC/BPS)，在與病 人衛教時應避免的困擾性 (bothersome)食物，下列選 項何者為非？","options":{"A":"葡萄柚","B":"番茄","C":"藍莓","D":"鳳梨","E":"橘子"},"answer":"C","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12ed., Ch57, Pg 1240","sourcePage":214},{"id":"6-026","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":26,"question":"有關女性骨盆腔臟器脫垂的評估，以下何者為是？","options":{"A":"根據 Baden-Walker halfway system, grade 2 是 指脫垂最脫出位置介於處女膜遺跡(hymen remnant)之內與外小於一公分的距離","B":"POP-Q 脫垂評估系統對於沒有骨盆腔臟器脫垂的 婦女而言，Ba 點應該記錄為-tvl","C":"骨盆腔臟器脫垂不常伴隨尿失禁的情況，反而是 手術後可能會有應力性尿失禁(stress urinary incontinence)的發生","D":"子宮圓韌帶(round ligment)與闊韌帶(broad ligment)對於骨盆腔臟器的支持沒有明顯的幫助","E":"做過子宮切除術的婦女比沒做過子宮切除術的婦 女有較低的骨盆腔臟器脫垂機率"},"answer":"D","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12th edition Chap108, p2438 Chap112, p2527, p2529, p2535 Chap115, p2591","sourcePage":214},{"id":"6-027","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":27,"question":"下列關於兒童之神經性膀胱功能障礙何者最不正確？","options":{"A":"最常見成因為脊髓腔發育異常","B":"母體缺乏葉酸時會增加 Neural tube defect 之風 險，建議每日攝取 0.4mg","C":"神經病灶對照之脊椎骨位置和實際上造成之症狀 並無絕對關聯","D":"三種可能出現的下泌尿道功能狀態依比例由高至 低可分為：dyssynergic，synergic，complete denervation","E":"兒童之血清肌肝酸受多種因素影響，其中最重要 者為肌肉量"},"answer":"D","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)：12th ed. Campbell, p.624 – p.629","sourcePage":215},{"id":"6-028","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":28,"question":"進行尿動力檢查時，何者並非評估 bladder outlet 之指標？","options":{"A":"UPP","B":"DLPP","C":"VLPP","D":"MUPP","E":"EMG"},"answer":"B","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)：12th ed. Campbell, p.2516","sourcePage":215},{"id":"6-029","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":29,"question":"下列關於中風後所導致得排尿功能障礙敘述何者錯 誤？","options":{"A":"中風發生的急性期，最常見的的排尿功能障礙為 逼尿肌不反射(Detrusor areflexia)所引起的急 性尿滯留","B":"最常見長期下泌尿道功能失調的表現為 Phasic detrusor overactivity，並且合併膀胱感覺完全 消失","C":"中風後尿失禁的情形在急性期最嚴重，並且會逐 漸改善，通常在出院時僅剩下 25-28%的病患仍有 症狀，並在數個月後下降到僅有 12-19%","D":"在部分中風前就有 LUTS 的患者裡，中風之後即便 進行攝護腺括除術也沒辦法改善症狀","E":"當中風發生於腦幹時，其造成主要症狀的來源是 dorsal lateral pons 中 pontine reticular nucleus, reticular formation and locus cerulues 受損"},"answer":"B","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Wein, A. (2016). Campbell-Walsh Urology. 11th ed. Philadelphia: Elsevier Saunders, Chapter 75. P1763-1765","sourcePage":215},{"id":"6-030","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":30,"question":"關於 Detrusor Sphincter Dyssynergia 的敘述下列何 者為非？","options":{"A":"True DSD 定義為 Brainstem PMC 與 sacral spinal cord 之間發生傳導路徑上的損傷或異常所導致 的解尿症狀","B":"Type 2 DSD 於尿動學檢查中典型的表現為在逼尿 肌收縮期間會偵測到偶發性的括約肌收縮","C":"脊隨損傷的患者中，Type 1 DSD 通常合併完全性 的 motor/sensory loss，而 Type 2/3 則有可能 保留部份的 motor/sensory function","D":"尿動力學檢查中，有時會出現 pseudodyssynergia 的情況，最主要的原因是來 自於腹部出力，以及因為不適所產生的憋尿行為","E":"DSD 的患者若沒有接受適當治療，大約有 50%的病 人會發生如 VUR、腎臟損傷、結石及泌尿道感染 等嚴重併發症"},"answer":"C","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Wein, A. (2016). Campbell-Walsh Urology. 11th ed. Philadelphia: Elsevier Saunders, Chapter 75. P1787","sourcePage":216},{"id":"6-031","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":31,"question":"下列關於膀胱過動症(OAB)的相關敘述，何者不正確？","options":{"A":"膀胱過動症盛行率不低且對患者生活品質有很大 的影響，在 Epidemiology of incontinence study(EPIC)中，男性及女性族群的盛行率約為 10.8%及 12.8%","B":"女性 OAB 患者相對於男性患者會有較高尿失禁的 比率，以及頻尿次數可能更多","C":"臨床上經常使用的治療藥物包括 antimuscarinic agent 以及 beta-3 agonist，但目前 beta-3 agonist 用於治療男性患者 OAB 症狀之經驗及證 據並不明確，不建議使用於男性患者","D":"目前以 PDE5i 治療男性 OAB 症狀並不建議，除了 可能的副作用之外，對於症狀改善也有限，EAU guidelines 目前歸類為 investigational","E":"除了藥物治療之外，其他可能的治療選項包括 intradetrusor botulinum toxin A injections、 posterior tibial nerve stimulation 及 sacral nerve stimulation，唯治療效果有賴更進一步的 研究支持"},"answer":"C","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Cosimo De Nunzio, Beyond Antimuscarinics: A Review of Pharmacological and Interventional Options for Overactive Bladder Management in Men, European Urology, Volume 79, Issue 4, 2021, https://doi.org/10.1016/j.eur uro.2020.12.032","sourcePage":216},{"id":"6-032","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":32,"question":"根據不同的病因所造成的相對應排尿功能障礙部位， 包括 brain circuits、efferent pathway、afferent pathway、detrusor muscle，何者為錯誤?","options":{"A":"Neurological disease 或 injury 影響的是 brain circuits、efferent pathway、afferent pathway","B":"Bladder outlet obstruction 影響的是 efferent pathway、afferent pathway、detrusor muscle","C":"糖尿病影響的是 afferent pathway、detrusor muscle","D":"正常老化影響的是 brain circuits、efferent pathway、afferent pathway、detrusor muscle","E":"正常老化影響的是 brain circuits、efferent pathway、afferent pathway"},"answer":"E","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)：EAU guideline: Non-neurogenic Female LUTs Figure 1","sourcePage":217},{"id":"6-033","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":33,"question":"以下何者不是治療男性應力性尿失禁(stress urinary incontinence)的選擇？","options":{"A":"骨盆底肌肉訓練","B":"陰莖夾","C":"抗膽鹼劑","D":"男性吊帶手術","E":"人工尿道括約肌植入手術"},"answer":"C","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh Urology 12th ed. Chapter 114 Evaluation and Management of Men With Urinary Incontinence, pp2546-2547","sourcePage":217},{"id":"6-034","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":34,"question":"中段尿道吊帶手術(Midurethral Sling TVT)在老年女 性與年輕病患相比，何者為正確？","options":{"A":"較低的手術成功率","B":"較低的滿意度","C":"較高比例的術後急尿(urgency)","D":"較高比例的混合性尿失禁緩解","E":"較高比例的術後尿滯留"},"answer":"C","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell-Walsh Urology 12th ed. Chapter 125 Slings: Autologous, Biologic, Synthetic, and Mid-urethral pp2862-2863","sourcePage":217},{"id":"6-035","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":35,"question":"有關膀胱低下症(underactive bladder, UAB)，何者 為錯誤？","options":{"A":"以臨床症狀診斷 UAB，包含尿流緩慢(slow urinary stream)、排尿啟動遲緩(hesitancy)、 排尿需用力(straining to void)等","B":"尿路上皮功能障礙、尿路上皮下發炎、及感覺相 關蛋白質表現異常，都會導致膀胱低下症的發生","C":"在女性病人避免常規給予副交感神經促進劑","D":"常用非侵入性的尿流速檢查(Uroflometry)與膀 胱出口阻塞(bladder outlet obstruction)做鑑 別","E":"對於保守性治療失敗的女性病人，可以考慮薦骨 神經電刺激(Sacral Nerve Stimulation)治療"},"answer":"D","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)：EAU guidelines on non-neurogenic female LUTS","sourcePage":217},{"id":"6-036","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":36,"question":"下列有關糖尿病膀胱病變(diabetic cystopathy)的 成因敘述，何者為非？","options":{"A":"改變 muscarinic receptor 密度，尤其是 M 2 receptor 的過度表達","B":"由高血糖引起的直接神經損傷","C":"在高血糖環境中，sorbitol 的產生會增加 reactive oxygen species，導致肌肉細胞的氧化 壓力(oxidative stress)","D":"Diacylglycerol 的產生導致 protein kinase C 激活，進而影響多種結締組織成分的轉錄，像是 type IV collagen","E":"Nerve growth factor (NGF)的上升，導致膀胱過 度敏感"},"answer":"E","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12th Chap116, p2623, 粗體字","sourcePage":218},{"id":"6-037","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":37,"question":"下列敘述有關 Parkinson disease(PD)以及 Multiple system atrophy(MSA)最常表現出來的排尿障礙，何者 有誤？","options":{"A":"PD 及 MSA 的膀胱逼尿肌是 overactive 或 impaired","B":"PD 的膀胱順應性是正常的，而 MSA 是正常或下降","C":"PD 的平滑括約肌皆是協同的(Synergic)","D":"MSA 的平滑括約肌為協同失調的(Dyssynergic)","E":"兩者的橫紋括約肌皆是協同的(Synergic)"},"answer":"D","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12th Chap116, p2601, Table 116.1","sourcePage":218},{"id":"6-038","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":38,"question":"下列敘述何者為正確？","options":{"A":"在診斷女性膀胱出口阻塞時，膀胱壓力及尿流速 是很精準的，不需要 X 光或是其他臨床證據來輔 助診斷","B":"不能使用 Bladder outlet obstruction index (BOOI)來診斷女性膀胱出口阻塞，因為會對其過 度診斷","C":"Solomon-Greenwell nomogram 是用來評估女性的 膀胱出口阻塞，其公式為 P Q − 2.4 × Q det max max","D":"若 Solomon-Greenwell nomogram 數值小於 5，則 膀胱出口阻塞可能性小於 10%","E":"若 Solomon-Greenwell nomogram 數值大於 18， 則膀胱出口阻塞可能性大於 90%"},"answer":"E","reference":"(110)/6.排尿功能障礙&女性 泌尿/參考資料(摘錄自)： Campbell 12th Chap114, p2568 粗體字","sourcePage":218},{"id":"6-039","category":"排尿功能障礙&女性泌尿","categoryOrder":6,"number":39,"question":"下列關於各種膀胱逼尿肌力量評估方式的敘述，何者 有誤？","options":{"A":"Watts factor 的缺點是容易被膀胱出口阻塞影響 數值","B":"Bladder contractility index (BCI)缺點是無法 評估逼尿肌收縮的持續性","C":"Voluntary stop test 缺點是容易低估等容積壓 力(isovolumetric pressure)","D":"Detrusor contraction coefficient (DECO)優點 是測量容易且使用方式簡單","E":"Detrusor shortening velocity
