<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小小英文樂園</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: single phone-width column; big tap targets for a 4-year-old, parent tools tucked behind one link */
:root {
  --bg: #e8f4fb;
  --surface: #ffffff;
  --fg: #14304a;
  --muted: #4f6b82;
  --line: #c9e0ef;
  --primary: #ffc533;
  --primary-fg: #3a2a00;
  --accent: #2a7fd1;
  --good: #2f9e55;
  --good-bg: #dcf5e5;
  --warn: #d9531e;
  --warn-bg: #ffe6dc;
  --font-display: "Fredoka", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1b2a; --surface: #14283b; --fg: #e6f1fa; --muted: #9fb6c9; --line: #25405a;
    --primary: #f2b928; --primary-fg: #241a00; --accent: #6db4f2;
    --good: #5fd68a; --good-bg: #12362a; --warn: #ff8f63; --warn-bg: #3a2018;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1b2a; --surface: #14283b; --fg: #e6f1fa; --muted: #9fb6c9; --line: #25405a;
  --primary: #f2b928; --primary-fg: #241a00; --accent: #6db4f2;
  --good: #5fd68a; --good-bg: #12362a; --warn: #ff8f63; --warn-bg: #3a2018;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 16px; line-height: 1.6;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 2.1rem; }
h2 { font-size: 1.5rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.top { display: flex; align-items: center; gap: 12px; }
.top h2 { flex: 1; min-width: 0; }
button { font: inherit; cursor: pointer; border: 0; color: inherit; }
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  min-height: 56px; padding: 12px 20px; border-radius: 16px; font-weight: 700; font-size: 1.05rem;
  background: var(--primary); color: var(--primary-fg);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.ghost { background: var(--surface); color: var(--fg); border: 2px solid var(--line); }
.btn.sm { min-height: 44px; padding: 8px 14px; font-size: 0.95rem; border-radius: 12px; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn:active { transform: translateY(1px); }
.back { min-width: 48px; padding: 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.tcard {
  background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px 12px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0;
}
.tcard .em { font-size: 3.2rem; line-height: 1.1; }
.tcard b { font-family: var(--font-display); font-size: 1.15rem; }
.bar { width: 100%; height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 999px; }
.menu { display: flex; flex-direction: column; gap: 12px; }
.menu .btn { justify-content: flex-start; min-height: 72px; font-size: 1.2rem; }
.menu .btn span.sub { display: block; font-weight: 400; font-size: 0.85rem; opacity: 0.8; }
.stage {
  background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 22px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; min-width: 0;
}
.big { font-size: 6.5rem; line-height: 1.1; animation: pop 0.35s ease-out; }
.word { font-family: var(--font-display); font-size: 2.6rem; font-weight: 600; overflow-wrap: anywhere; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
.opt {
  background: var(--bg); border: 3px solid var(--line); border-radius: 20px; min-height: 104px;
  font-size: 3.4rem; line-height: 1; display: grid; place-items: center; padding: 8px;
}
.opt.yes { background: var(--good-bg); border-color: var(--good); }
.opt.no { background: var(--warn-bg); border-color: var(--warn); animation: shake 0.3s; }
.msg { min-height: 2rem; font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }
.msg.good { color: var(--good); }
.msg.warn { color: var(--warn); }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
textarea { width: 100%; min-height: 110px; font: inherit; font-size: 0.85rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
input[type="text"] { width: 100%; min-height: 48px; font: inherit; color: var(--fg); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; }
label { font-weight: 700; font-size: 0.92rem; }
.bubble { background: var(--bg); border: 2px solid var(--line); border-radius: 20px; padding: 12px 16px; font-family: var(--font-display); font-size: 1.5rem; font-weight: 500; overflow-wrap: anywhere; }
.scene-card .em { font-size: 2.6rem; letter-spacing: 0.1em; }
.notice { background: var(--warn-bg); color: var(--fg); border-radius: 12px; padding: 10px 12px; font-size: 0.9rem; }
@keyframes pop { from { transform: scale(0.7); opacity: 0.2; } to { transform: scale(1); opacity: 1; } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .big, .opt.no { animation: none; } .btn:active { transform: none; } }
</style>

<main id="app"></main>

<script>
(function () {
  var THEMES = [
    { id: "animals", name: "動物", en: "Animals", em: "🐶", tpl: "a", items: [
      ["cat","貓","🐱"],["dog","狗","🐶"],["bird","鳥","🐦"],["fish","魚","🐟"],
      ["rabbit","兔子","🐰"],["duck","鴨子","🦆"],["pig","豬","🐷"],["cow","牛","🐮"]] },
    { id: "colors", name: "顏色", en: "Colors", em: "🌈", tpl: "see", items: [
      ["red","紅色","🔴"],["blue","藍色","🔵"],["yellow","黃色","🟡"],["green","綠色","🟢"],
      ["orange","橘色","🟠"],["purple","紫色","🟣"],["black","黑色","⚫"],["white","白色","⚪"]] },
    { id: "fruits", name: "水果", en: "Fruits", em: "🍎", tpl: "a", items: [
      ["apple","蘋果","🍎"],["banana","香蕉","🍌"],["grapes","葡萄","🍇"],["strawberry","草莓","🍓"],
      ["watermelon","西瓜","🍉"],["pear","梨子","🍐"],["lemon","檸檬","🍋"],["peach","桃子","🍑"]] },
    { id: "body", name: "身體", en: "Body", em: "👀", tpl: "my", items: [
      ["eye","眼睛","👁️"],["ear","耳朵","👂"],["nose","鼻子","👃"],["mouth","嘴巴","👄"],
      ["hand","手","✋"],["foot","腳","🦶"],["tooth","牙齒","🦷"],["leg","腿","🦵"]] },
    { id: "numbers", name: "數字", en: "Numbers", em: "🔢", tpl: "num", items: [
      ["one","一","1️⃣"],["two","二","2️⃣"],["three","三","3️⃣"],["four","四","4️⃣"],["five","五","5️⃣"],
      ["six","六","6️⃣"],["seven","七","7️⃣"],["eight","八","8️⃣"],["nine","九","9️⃣"],["ten","十","🔟"]] },
    { id: "ride", name: "交通工具", en: "Vehicles", em: "🚗", tpl: "a", items: [
      ["car","汽車","🚗"],["bus","公車","🚌"],["train","火車","🚆"],["bike","腳踏車","🚲"],
      ["plane","飛機","✈️"],["boat","小船","⛵"],["truck","卡車","🚚"],["fire truck","消防車","🚒"]] },
    { id: "talk", name: "日常口說", en: "Say it!", em: "💬", tpl: "none", items: [
      ["Hello!","哈囉","👋"],["Good morning!","早安","🌅"],["Thank you!","謝謝","🙏"],["Please.","請","🤲"],
      ["Sorry.","對不起","😔"],["I'm fine.","我很好","😊"],["I love you.","我愛你","❤️"],["Good night!","晚安","🌙"]] }
  ].map(function (t) {
    t.items = t.items.map(function (a) { return { w: a[0], zh: a[1], e: a[2] }; });
    return t;
  });

  var SCENES = [
    { id: "icecream", name: "冰淇淋店", em: "🐱🍦", who: "🐱", lines: [
      { s: "Hello! Welcome to the ice cream shop!", zh: "哈囉！歡迎來到冰淇淋店", ok: ["hello", "hi"], m: "Hello!" },
      { s: "What ice cream do you like?", zh: "你喜歡什麼冰淇淋？", ok: ["chocolate", "vanilla", "strawberry", "like", "ice cream"], m: "I like chocolate." },
      { s: "Here you go! Yummy ice cream!", zh: "給你，好吃的冰淇淋！", ok: ["thank", "you", "thanks"], m: "Thank you!" },
      { s: "Bye-bye! See you!", zh: "掰掰！再見！", ok: ["bye", "see", "you"], m: "Bye-bye!" }] },
    { id: "space", name: "太空船", em: "🤖🚀", who: "🤖", lines: [
      { s: "Beep boop! Hello, space friend!", zh: "嗶嗶！哈囉，太空朋友！", ok: ["hello", "hi"], m: "Hello!" },
      { s: "What is your name?", zh: "你叫什麼名字？", ok: ["my", "name", "is"], m: "My name is" },
      { s: "How are you today?", zh: "你今天好嗎？", ok: ["fine", "good", "great", "happy"], m: "I'm fine." },
      { s: "Ready? Three, two, one, go!", zh: "準備好了嗎？三、二、一，出發！", ok: ["go", "one", "two", "three"], m: "Go!" }] },
    { id: "zoo", name: "動物園", em: "🐻🦁", who: "🐻", lines: [
      { s: "Hi! I am a big bear. Hello!", zh: "嗨！我是大熊，哈囉！", ok: ["hello", "hi"], m: "Hello!" },
      { s: "Do you see the lion?", zh: "你有看到獅子嗎？", ok: ["yes", "no", "see", "lion"], m: "Yes!" },
      { s: "What color is the lion?", zh: "獅子是什麼顏色？", ok: ["yellow", "orange", "brown", "gold"], m: "It's yellow." },
      { s: "Good job! Bye-bye!", zh: "做得好！掰掰！", ok: ["bye", "thank", "thanks"], m: "Bye-bye!" }] }
  ];

  var KEY = "kids_english_v1_progress";
  var S = load();
  function load() {
    try { var j = JSON.parse(localStorage.getItem(KEY) || "null"); if (j && j.stars) { j.custom = Array.isArray(j.custom) ? j.custom : []; return j; } } catch (e) {}
    return { stars: {}, spoken: {}, rounds: [], custom: [] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function key(t, i) { return t.id + ":" + t.items[i].w; }
  function customTheme() { return { id: "mine", name: "我的單字本", en: "My words", em: "⭐", tpl: "none", items: S.custom }; }
  function themes() { return S.custom.length ? THEMES.concat([customTheme()]) : THEMES; }
  function themeById(id) { return themes().filter(function (t) { return t.id === id; })[0]; }
  function done(t) {
    var n = 0;
    t.items.forEach(function (_, i) { var k = key(t, i); if ((S.stars[k] || 0) + (S.spoken[k] || 0) > 0) n++; });
    return n;
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
    return a;
  }

  /* speech */
  var voice = null;
  var canSpeak = "speechSynthesis" in window;
  function pickVoice() {
    if (!canSpeak) return;
    var vs = speechSynthesis.getVoices();
    voice = vs.filter(function (v) { return /^en[-_]US/i.test(v.lang); })[0] ||
            vs.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
  }
  if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text, rate) {
    if (!canSpeak) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = rate || 0.7; u.pitch = 1.1;
      if (voice) u.voice = voice;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function sentence(t, it) {
    if (it.s) return it.s;
    var w = it.w;
    if (t.tpl === "a") return "This is " + (/^[aeiou]/i.test(w) ? "an " : "a ") + w + ".";
    if (t.tpl === "my") return "This is my " + w + ".";
    if (t.tpl === "see") return "I see " + w + ".";
    if (t.tpl === "num") return "Count with me: " + w + ".";
    return "";
  }

  /* speech recognition (needs an HTTPS page outside the Claude viewer, plus mic permission) */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var DIGITS = { "0": "zero", "1": "one", "2": "two", "3": "three", "4": "four", "5": "five", "6": "six", "7": "seven", "8": "eight", "9": "nine", "10": "ten" };
  var ALIAS = { one: ["won"], two: ["to", "too"], four: ["for"], eight: ["ate"], red: ["read"], blue: ["blew"], pear: ["pair", "bear"], eye: ["i"] };
  function words(s) {
    return s.toLowerCase().replace(/[^a-z0-9\s']/g, " ").split(/\s+/).filter(Boolean).map(function (w) { return DIGITS[w] || w; });
  }
  function lev(a, b) {
    var d = [], i, j;
    for (i = 0; i <= a.length; i++) { d[i] = [i]; }
    for (j = 1; j <= b.length; j++) d[0][j] = j;
    for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    return d[a.length][b.length];
  }
  function heard(said, target) {
    var hw = words(said), tw = words(target), hit = 0;
    tw.forEach(function (t) {
      var tol = t.length >= 5 ? 2 : (t.length >= 3 ? 1 : 0);
      var ok = hw.some(function (h) {
        return h === t || (ALIAS[t] || []).indexOf(h) >= 0 || lev(h, t) <= tol;
      });
      if (ok) hit++;
    });
    return tw.length > 0 && hit >= Math.ceil(tw.length * 0.6);
  }

  /* custom words and optional Claude lookup */
  var sampleFn = null;
  try {
    if (window.claude && window.claude.use) window.claude.use("sample").then(function (f) {
      sampleFn = f || null; if (view.n === "add") render();
    }, function () {});
  } catch (e) {}
  function cleanCustom(a) {
    return (Array.isArray(a) ? a : []).filter(function (c) { return c && typeof c.w === "string" && typeof c.e === "string" && c.w && c.e; })
      .slice(0, 60).map(function (c) { return { w: c.w, zh: typeof c.zh === "string" ? c.zh : "", e: c.e, s: typeof c.s === "string" ? c.s : "" }; });
  }
  function fld(id) { return document.getElementById(id); }
  function addMsg(txt, cls) { var m = fld("addmsg"); if (m) { m.textContent = txt; m.style.color = cls === "bad" ? "var(--warn)" : "var(--good)"; } }
  function addWord() {
    var w = fld("aw").value.trim(), zh = fld("az").value.trim(), e = fld("ae").value.trim(), s = fld("as").value.trim();
    if (!w || !e) return addMsg("英文和圖案要填", "bad");
    if (e.length > 12) return addMsg("圖案只放一個 emoji", "bad");
    if (S.custom.length >= 60) return addMsg("單字本已滿 60 個", "bad");
    if (S.custom.some(function (c) { return c.w.toLowerCase() === w.toLowerCase(); })) return addMsg("這個單字已經有了", "bad");
    S.custom.push({ w: w, zh: zh, e: e, s: s }); save();
    view.msg = "";
    render();
    addMsg("已加入「" + w + "」", "ok");
  }
  function aiFill() {
    if (!sampleFn) return;
    var q = (fld("aw").value || fld("az").value).trim();
    if (!q) return addMsg("先輸入英文或中文", "bad");
    var btn = fld("aibtn"); btn.disabled = true; addMsg("Claude 想一想…", "ok");
    var prompt = "你在幫台灣 4 歲小朋友學英文。家長輸入了一個單字或詞：「" + q + "」（可能是英文或中文）。" +
      "請只回覆一個 JSON 物件，欄位：w（簡單常見的英文單字，小寫）、zh（繁體中文意思，1 到 4 個字）、e（一個最貼切的 emoji）、s（3 到 6 個字的簡單英文例句）。" +
      '例：{"w":"cat","zh":"貓","e":"🐱","s":"This is a cat."}';
    sampleFn.json(prompt, { modelTier: "quick" }).then(function (j) {
      if (!j || typeof j.w !== "string" || typeof j.e !== "string") throw { code: "invalid_json" };
      fld("aw").value = j.w; fld("az").value = typeof j.zh === "string" ? j.zh : ""; fld("ae").value = j.e; fld("as").value = typeof j.s === "string" ? j.s : "";
      addMsg("已填好，確認後按「加入單字本」", "ok");
    }).catch(function (err) {
      var c = err && err.code;
      addMsg(c === "rate_limited" ? "太頻繁了，請稍後再試，或手動填寫"
        : (c === "not_granted" || c === "sampling_disabled") ? "無法使用 Claude，請手動填寫"
        : "沒成功，可以再按一次或手動填寫", "bad");
    }).then(function () { if (fld("aibtn")) fld("aibtn").disabled = false; });
  }

  function sceneById(id) { return SCENES.filter(function (c) { return c.id === id; })[0]; }
  function hearAny(said, oks) { return oks.some(function (o) { return heard(said, o); }); }

  /* view state */
  var view = { n: "home" };
  var app = document.getElementById("app");
  function go(v) { view = v; render(); window.scrollTo(0, 0); }

  function dots(n, total) {
    var s = "";
    for (var i = 0; i < total; i++) s += '<i class="' + (i < n ? "on" : "") + '"></i>';
    return '<div class="dots" aria-hidden="true">' + s + "</div>";
  }
  function backBtn(act) { return '<button class="btn ghost back" data-act="' + act + '" aria-label="返回">←</button>'; }

  var V = {
    home: function () {
      var cards = themes().map(function (t) {
        var d = done(t), pct = Math.round(d / t.items.length * 100);
        return '<button class="tcard" data-act="theme" data-id="' + t.id + '">' +
          '<span class="em">' + t.em + '</span><b>' + t.name + '</b>' +
          '<span class="small muted">' + t.en + " · " + d + "/" + t.items.length + '</span>' +
          '<span class="bar"><i style="width:' + pct + '%"></i></span></button>';
      }).join("");
      return '<header><h1>小小英文樂園</h1><p class="muted">選一個主題，聽一聽、點一點、跟著說。</p></header>' +
        (canSpeak ? "" : '<div class="notice">這個瀏覽器不支援發音，請改用手機 Safari 或 Chrome 開啟。</div>') +
        '<button class="btn" data-act="scenes">🎭 情境對話 · 跟角色聊天</button>' +
        '<div class="grid">' + cards + "</div>" +
        '<div class="row"><button class="btn ghost sm" data-act="add">＋ 加新單字</button><button class="btn ghost sm" data-act="parent">家長區</button></div>';
    },
    menu: function () {
      var t = themeById(view.id);
      return '<div class="top">' + backBtn("home") + "<h2>" + t.em + " " + t.name + " · " + t.en + "</h2></div>" +
        '<div class="menu">' +
        '<button class="btn" data-act="learn"><span>🔊 學習卡<span class="sub">看圖、聽發音</span></span></button>' +

  function render() {
    app.innerHTML = V[view.n]();
    if (view.n === "parent") document.getElementById("bk").value = JSON.stringify(S);
    if (view.n === "add") view.msg = "";
  }

  function startQuiz(t) {
    var list = shuffle(t.items.map(function (_, i) { return i; })).slice(0, Math.min(5, t.items.length));
    view = { n: "quiz", id: t.id, q: { list: list, n: 0, score: 0, first: true, locked: false, state: {}, msg: "", opts: [] } };
    setOpts();
    render();
    say(t.items[view.q.list[0]].w);
  }
  function setOpts() {
    var t = themeById(view.id), q = view.q, a = q.list[q.n];
    var others = shuffle(t.items.map(function (_, i) { return i; }).filter(function (i) { return i !== a; })).slice(0, 2);
    q.opts = shuffle([a].concat(others));
    q.state = {}; q.msg = ""; q.msgCls = ""; q.locked = false; q.first = true;
  }
  function addRound(t, s, n) {
    S.rounds.push({ d: new Date().toLocaleDateString("zh-TW"), t: t.name, s: s, n: n });
    S.rounds = S.rounds.slice(-30);
    save();
  }
  function bump(map, k) { map[k] = (map[k] || 0) + 1; }

  function act(a, b) {
    var t = view.id ? themeById(view.id) : null;
    if (a === "home") return go({ n: "home" });
    if (a === "theme") return go({ n: "menu", id: b.dataset.id || view.id });
    if (a === "parent") return go({ n: "parent" });
    if (a === "learn") { go({ n: "learn", id: view.id, i: 0 }); return say(t.items[0].w); }
    if (a === "speak") { go({ n: "speak", id: view.id, i: 0 }); return say(t.items[0].w); }
    if (a === "quiz") return startQuiz(t);
    if (a === "say" || a === "slow") {
      var rate = a === "slow" ? 0.4 : 0.7;
      if (view.n === "quiz") return say(t.items[view.q.list[view.q.n]].w, rate);
      var it = t.items[view.i], s = sentence(t, it);
      return say(it.w + (s ? ". " + s : ""), rate);
    }
    if (a === "prev" && view.i > 0) { view.i--; render(); return say(t.items[view.i].w); }
    if (a === "next") {
      if (view.i >= t.items.length - 1) return go({ n: "menu", id: view.id });
      view.i++; render(); return say(t.items[view.i].w);
    }
    if (a === "ans") {
      var q = view.q; if (q.locked) return;
      var i = +b.dataset.i, right = q.list[q.n];
      if (i === right) {
        q.locked = true; q.state[i] = "yes"; q.msg = "Great! ⭐"; q.msgCls = "good";
        if (q.first) { q.score++; bump(S.stars, key(t, right)); save(); }
        render(); say(t.items[right].w);
        var cur = q;
        setTimeout(function () {
          if (view.q !== cur) return;
          if (cur.n >= cur.list.length - 1) { addRound(t, cur.score, cur.list.length); return go({ n: "quizEnd", id: view.id, q: cur }); }
          cur.n++; setOpts(); render(); say(t.items[cur.list[cur.n]].w);
        }, 1100);
      } else {
        q.first = false; q.state[i] = "no"; q.msg = "Try again!"; q.msgCls = "warn";
        render(); say(t.items[right].w);
      }
      return;
    }
    if (a === "scenes") return go({ n: "scenes" });
    if (a === "scene") { go({ n: "scene", sc: b.dataset.id, li: 0 }); return say(sceneById(b.dataset.id).lines[0].s); }
    if (a === "ssay" || a === "sslow") return say(sceneById(view.sc).lines[view.li].s, a === "sslow" ? 0.4 : 0.7);
    if (a === "shint") { view.hint = true; render(); return say(sceneById(view.sc).lines[view.li].m, 0.5); }
    if (a === "smic") return listenScene();
    if (a === "sok") { if (!view.ok) sceneOk(); return; }
    if (a === "add") return go({ n: "add" });
    if (a === "aifill") return aiFill();
    if (a === "addsave") return addWord();
    if (a === "del") { S.custom.splice(+b.dataset.i, 1); save(); return render(); }
    if (a === "mic") return listen(t);
    if (a === "award") {
      bump(S.spoken, key(t, view.i)); save();
      return nextSpeak(t);
    }
    if (a === "skip") return nextSpeak(t);
    if (a === "copy") {
      var el = document.getElementById("bk"), m = document.getElementById("bkmsg");
      try {
        navigator.clipboard.writeText(el.value).then(
          function () { m.textContent = "已複製"; },
          function () { el.select(); m.textContent = "請長按文字，手動複製"; });
      } catch (e) { el.select(); m.textContent = "請長按文字，手動複製"; }
      return;
    }
    if (a === "import") {
      var m2 = document.getElementById("bkmsg");
      try {
        var j = JSON.parse(document.getElementById("bk").value);
        if (!j || typeof j.stars !== "object" || j.stars === null) throw new Error("bad");
        S = { stars: j.stars, spoken: j.spoken || {}, rounds: j.rounds || [], custom: cleanCustom(j.custom) };
        save(); m2.textContent = "已匯入"; return;
      } catch (e) { m2.textContent = "格式不正確，請貼上完整的備份文字"; return; }
    }
    if (a === "reset") {
      if (!view.confirm) { view.confirm = true; return render(); }
      S = { stars: {}, spoken: {}, rounds: [], custom: S.custom }; save(); view.confirm = false; return render();
    }
  }
  function startLine(li) {
    var sc = sceneById(view.sc);
    view = { n: "scene", sc: sc.id, li: li, noMic: view.noMic };
    render(); say(sc.lines[li].s);

    bump(S.spoken, "scene:" + sc.id + ":" + cur); save();

      if (view.n !== "scene" || view.li !== cur) return;

      startLine(cur + 1);

  function listenScene() {
    if (!SR || view.listening || view.ok) return;
    var sc = sceneById(view.sc), cur = view.li, ln = sc.lines[cur], got = false, rec;
    try { if (canSpeak) speechSynthesis.cancel(); rec = new SR(); } catch (e) { view.noMic = true; return render(); }
    rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 5; rec.continuous = false;
    view.listening = true; view.micMsg = ""; view.micCls = "";
    rec.onresult = function (ev) {
      got = true;
      if (view.n !== "scene" || view.li !== cur) return;
      var r = ev.results[0], alts = [];
      for (var k = 0; k < r.length; k++) alts.push(r[k].transcript);
      view.listening = false;
      if (alts.some(function (x) { return hearAny(x, ln.ok); })) return sceneOk();
      view.micMsg = "我聽到：" + alts[0] + "。再說一次，或按「提示」"; view.micCls = "warn"; render();
    };
    rec.onerror = function (ev) {
      if (view.n !== "scene" || view.li !== cur) return;

      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {

      } else if (ev.error === "no-speech") { view.micMsg = "沒聽到聲音，再按一次"; view.micCls = "warn"; }
      else if (ev.error !== "aborted") { view.micMsg = "沒辨識成功，再試一次"; view.micCls = "warn"; }

      if (view.listening && view.n === "scene" && view.li === cur) {
        view.listening = false;
        if (!got) { view.micMsg = "沒聽到聲音，再按一次"; view.micCls = "warn"; }
        render();
      }
    };
    try { rec.start(); render(); } catch (e) { view.listening = false; view.noMic = true; render(); }
  }
  function nextSpeak(t) {

  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (b && !b.disabled) act(b.dataset.act, b);
  });
  render();
})();
</script>

</html>
